  <!-- Header -->
  <text x="56" y="68" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUND 84 · SVG 527 · GOLF TEE-TIME, COUNTRY CLUB F&amp;B MINIMUM &amp; RAIN-CHECK ESCROW</text>
  <text x="56" y="100" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Golf &amp; Club Agent: All-In Cart/Caddie Lock, Aerification Alert &amp; Cash Rain-Check</text>
  <text x="56" y="126" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">GolfNow / Supreme Golf / Invited Clubs / BaiGolf — Blocking Tee-Time Scalpers, Punched-Greens Traps &amp; Expiring Rain Checks</text>
  <rect x="960" y="54" width="184" height="36" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>

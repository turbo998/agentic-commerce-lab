  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red214)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：桩体贴纸扫码遭钓鱼 (Quishing) + 充 $18 电被锁死 $175 一周</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 户外充电桩静态二维码被贴纸覆盖钓鱼 (Quishing)：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 黑产用假二维码贴纸盖住原码，车主扫码进入高仿钓鱼页瞬间被盗刷卡号与 3DS；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 充电桩根本未启动，车主却损失数千美元并引发集中拒付。</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 插枪冻结 $175 最高预授权，拔枪未发 0420 冲正锁卡 7 天：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 车主仅充 $18.50 电，剩余 $156.50 预授权因未发 0420 报文被死锁 5–10 个工作日！</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 断网用“时间×功率”软件估算度数违反德国 Eichrecht 计量法：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 缺失直流电表 OCMF 硬件数字签名，或无通知强扣 $120 占位费遭 100% 拒付败诉。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 212 · EV ISO 15118 &amp; OCMF</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体新能源车机充电 (MCC 5552) ISO 15118 即插即充与 OCMF 清算架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">EMAID 硬件证书防假二维码 (Quishing) + OCMF 电表签名 + $175 预授权 0420 秒解冻令牌 (`agentic_ev_charging_ocpi_iso15118_afd_mandate_...`) vs 锁卡一周</text>

  <!-- Left Card: Anti-Pattern -->

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. ISO 15118-20 充电电缆 PLC 直连握手 (EMAID X.509 证书)：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 插枪瞬间车机 TPM 与充电桩通过物理电缆完成双向证书认证，2 秒自动启动；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 全程零手机扫码，从物理底层 100% 根绝假二维码贴纸钓鱼 (Quishing)！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 直流电表 OCMF ECDSA 硬件签名 + 拔枪 0420 3秒解冻 $156.50：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• OCPI v2.2.1 CDR 绑定电表起止读数签名；拔枪同事务发送 0420 秒退剩余押金。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 谷电导航与 MCC 5552 降费：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 智能错峰谷电补能并解锁 MCC 5552 小额优惠费率，单批立省 $30,400.00 (HTTP 409)！</text>


  <rect width="1200" height="675" fill="url(#bg292)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent292)"/>

  <!-- Header -->
  <text x="52" y="62" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-15 · ROUND 290 · AGENTIC ROOFTOP SOLAR PPA/LOAN, NEM 3.0 BATTERY VPP &amp; ZERO DEALER FEE</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">智能体屋顶光伏与储能虚拟电厂 (NEM 3.0 VPP)：零贷款贴息抽成、LiDAR 遮挡与 PTO 清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">封杀“3.99%低息贷款暗加 30% ($11,400) Dealer Fee” · 阻断手动删掉树荫虚报 40% 发电量 · 未获电网 PTO 批文严禁启动扣款</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统上门推销光伏贷款与 PPA 三大深坑 (贵 35%–55%)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 低息贷款暗加 30% ($11,400) 隐形 Dealer Fee</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 现金购买仅需 $26,600 的 10kW 光伏 + 储能系统</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 办“3.99% 低息贷款”后被塞入 30% 贴息费，本金变 $38,000</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 欺骗无税额退休老人能拿 30% 现金退税，第18月月供暴涨</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 软件里手动删掉大树阴影虚报 40% 年发电量</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 推销员在 Aurora 里删掉邻居家大橡树，把背阴北坡当南坡算</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 承诺年发 14,000 度电，装好后实发仅 8,200 度电</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 业主既要交全额光伏月租，又要交高昂电网补充电费</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 3.5% 年复利涨价、私吞 VPP 补贴与未并网扣款</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• PPA 每年复利涨价 3.5% (25年翻 2.4倍)，私吞 $1,200/年 VPP</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 还没拿到电力公司 PTO 准许并网函就开始强扣月供</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• UCC-1 留置权锁死房产，卖房或重贷被勒索 $15k 买断费</text>

  <!-- Center Card: Agentic Policy Engine -->
  <rect x="422" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="422" y="136" width="356" height="38" rx="12" fill="#78350F"/>
  <text x="442" y="160" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体现金同价、LiDAR 保底与 PTO 并网三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#B45309"/>
  <text x="452" y="210" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：零隐形 Dealer Fee 与 LiDAR 树荫真实发电锁</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制融资合同本金 == 现金底价 (0% 隐形贴息抽成)</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 交叉比对 USGS 1m LiDAR 屋顶阴影，严禁删树虚报发电</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 阻断 30% 贷款泡沫与虚假发电预测</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#B45309"/>
  <text x="452" y="326" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：ANSI C12.20 零售电价退差与 VPP &gt;=80% 分成</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 欠发低于 90% P50 按电网零售 TOU 电价全额退赔业主</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 年涨幅 &lt;=0.99%，VPP 放电与 SREC 绿证 &gt;=80% 归业主</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 拦截高息复利阶梯与私吞 VPP 补贴</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#B45309"/>
  <text x="452" y="442" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ 电网正式 PTO 并网批文与 CFPB 锁</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 核验电力公司正式 PTO 并网运行批文</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 核查 CSLB C-46 光伏执照与 CFPB 真实信贷披露合规</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $6,840</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="796" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="796" y="136" width="356" height="38" rx="12" fill="#064E3B"/>
  <text x="816" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 屋顶光伏 + 储能 VPP ($38,000) 实测矩阵</text>

  <rect x="812" y="188" width="324" height="60" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="826" y="210" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="826" y="232" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">零 Dealer Fee + LiDAR 保底 + VPP 分成 + PTO → $38k</text>

  <rect x="812" y="258" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="280" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="826" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">暗加 30% ($11,400) 贷款贴息费或删树虚报发电 → 拦截</text>

  <rect x="812" y="328" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="826" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">3.5% 复利涨幅、私吞 VPP 补贴或锁死房产过户 → 阻断</text>

  <rect x="812" y="398" width="324" height="60" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="826" y="420" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 (275ms) / 🧑‍⚖️ HTTP 409 (240ms)</text>
  <text x="826" y="442" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">未获电网 PTO 提前扣款挂起 / 剥离融资费+补贴省 $6,840</text>

  <rect x="812" y="468" width="324" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="826" y="490" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">💡 剥离融资贴息水分与兑现 VPP 补贴后净付：$31,160 (省 18%)</text>
  <text x="826" y="510" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="11">令牌：agentic_rooftop_solar_ppa_lease_nem30_vpp_...</text>

  <!-- Footer -->
  <rect x="48" y="556" width="1104" height="80" rx="10" fill="#020617" stroke="#334155"/>
  <text x="68" y="582" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 严禁签署含 25%–35% 隐形贷款 Dealer Fee 的光伏分期合同，必须强制执行现金同价 (Cash-Price Parity) 并经 USGS LiDAR 树荫核验。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 尾款与月供必须在 Web IQ 核实取得电力公司正式 PTO 并网批文后方可激活，且 NEM 3.0 电池 VPP 与 SREC 收益 &gt;=80% 归业主。</text>

  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截翻新山寨箱或穿楼板缺失内部防火隔板</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 满足 NEC 368 与 ANSI/NETA MTS 强检标准</text>


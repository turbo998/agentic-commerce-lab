  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁拿加长扳手死拧已断头的双头定扭剪力螺栓</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 接头温升异常只需抽换 $380 独立连接器包 (Joint Pack)</text>
  <text x="74" y="368" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断压塌蝶形弹垫或虚报 $18,500 换母线槽</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>

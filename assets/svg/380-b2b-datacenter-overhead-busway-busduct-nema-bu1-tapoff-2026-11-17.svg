  <!-- Header -->
  <text x="48" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 378 · DATA CENTER OVERHEAD BUSWAY &amp; BUSDUCT (NEMA BU 1.1 / UL 857), $145 TAP-OFF &amp; $380 JOINT PACK GATE</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">数据中心机柜滑轨母线与密集型母线槽维保、$145 插接箱内芯锁与 $380 连接器包清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Starline Track Busway / Schneider I-Line / Siemens Sentron · 镀银插接爪检查 + 双头剪力螺栓/蝶形弹垫保护 + 100A DLRO &lt;=50 µΩ</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="64" y="160" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">⚡ 四大机房母线槽与插接箱电气硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 插接箱顶部镀银爪 &amp; $145 电表/$45 熔丝锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Tap-Off 插接箱外壳与顶部旋转铜爪寿命长达 20 年</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 断电或掉线 90% 仅需换内部 $45 保险丝或 $145 计量板</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截把小模块故障高报成 $7,800 换整只插接箱</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>

  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 带载红外温差 ΔT &lt;=15°C 且超声波局放无电晕异响</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 检修断电实测关节微欧接触电阻 &lt;= 50 µΩ</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 保障 4000A 主干与算力机柜顶部配电零闪络</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>

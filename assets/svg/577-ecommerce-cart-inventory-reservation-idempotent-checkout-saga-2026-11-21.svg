<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg577" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081326" />
      <stop offset="50%" stop-color="#0f2342" />
      <stop offset="100%" stop-color="#06101e" />
    </linearGradient>
    <linearGradient id="accent577" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21.5px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .mono { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #6ee7b7; }
      .warn { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #fca5a5; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg577)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent577)" rx="3" />

  <text x="40" y="58" class="title">电商结账购物车状态机、Redis Lua 防超卖与防重扣/掉单 Saga 托管 (Shopify / Stripe / Temporal)</text>
  <text x="40" y="80" class="subtitle">Round 134 · 防秒杀并发超卖赔 30% 违约金、防弱网重试连扣两次钱与防“钱扣了锁库刚好过期”掉单净省 37% 损耗 (SVG 577)</text>

  <!-- Left Card: 3 Checkout & Inventory Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大结账状态机致命故障</text>
  <text x="56" y="164" class="card-title">1. 先查后减 (Check-then-Act) 并发超卖 (HTTP 403)</text>
  <text x="56" y="184" class="body">• 仅剩 1 台显卡，50 个导购 Agent 同时读到 stock == 1</text>
  <text x="56" y="202" class="body">• 非原子扣减导致卖出 50 台，库存变成 -49 台</text>
  <text x="56" y="220" class="warn">• 平台按消保规则每单赔付 30% 缺货违约金 + 店铺降权封禁</text>

  <text x="56" y="256" class="card-title">2. 弱网超时重试连扣两次钱与掉单 (HTTP 422)</text>
  <text x="56" y="276" class="body">• 结账 Agent 调支付接口 5s 超时，换新 UUID 重试第 2 次</text>
  <text x="56" y="294" class="body">• 持卡人收到两条 $899 扣款短信! 或第 14分59秒付款成功，</text>
  <text x="56" y="312" class="warn">  Webhook 第 15分02秒才到，锁库已过期释放导致“钱扣货空”</text>

  <text x="56" y="348" class="card-title">3. 恶意加购占库不付 (Cart Hoarding DoS)</text>
  <text x="56" y="368" class="body">• 竞争对手派 2,000 个爬虫账号在零点把全店爆款全部加购</text>
  <text x="56" y="386" class="body">• 若“加入购物车即锁死 30 分钟库存”，正常买家全部显示售罄</text>
  <text x="56" y="404" class="warn">• 30 分钟后爬虫弃单，大促黄金半小时真实成交额为 $0!</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: NON_ATOMIC_OVERSELL_OR_CART_HOARDING_DOS</text>
  <text x="70" y="502" class="warn">• HTTP 422: PAYLOAD_IDEMPOTENCY_DRIFT_OR_ZOMBIE_CAPTURE</text>
  <text x="70" y="524" class="warn">• HTTP 451: SPLIT_TENDER_GIFT_CARD_ORPHAN_LOCK_HOLD</text>
  <text x="70" y="546" class="mono">• HTTP 409: TWO_PHASE_TTL_BUFFER_AND_WAITLIST_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: ATOMIC_LUA_RESERVE_AND_SAGA_AUTHORIZED</text>
  <text x="70" y="596" class="body">铁律: 支付 TTL (10m) 必须严格短于库存预占 TTL (12m)!</text>

  <!-- Center Card: 4-Stage Checkout State Machine -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶高并发结账状态机与防重扣架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="175" class="card-title" fill="#38bdf8">Gate 1: Redis Lua 原子预占 + 进入支付页才锁库</text>
  <text x="450" y="195" class="body">• 普通加购 (Add-to-Cart) 不锁物理库存，彻底粉碎爬虫占库攻击</text>
  <text x="450" y="213" class="body">• 仅当通过人机核验点击“去结账”时执行 Redis Lua 原子预减</text>
  <text x="450" y="231" class="mono">• 非原子 SQL 扣减或未核身批量占库 -&gt; HTTP 403 阻断</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#10b981" />
  <text x="450" y="282" class="card-title" fill="#6ee7b7">Gate 2: 确定性哈希幂等键 + 双 TTL 时间差安全垫</text>
  <text x="450" y="302" class="body">• Idempotency-Key = SHA256(user_id + cart_version + items_hash)</text>
  <text x="450" y="320" class="body">• 弱网重试 10 次也命中同一笔 PaymentIntent，绝不双倍扣款!</text>
  <text x="450" y="338" class="body">• 支付会话有效期设为 10m，库存预占锁设为 12m (留 120s 缓冲)</text>
  <text x="450" y="354" class="mono">• 根除“第10分钟付款成功但库存已释放”的掉单事故 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: 组合支付 (积分/礼品卡 + 信用卡) 原子回滚</text>
  <text x="450" y="419" class="body">• 客户用 $50 礼品卡 + $200 信用卡组合付款，若信用卡拒付失败:</text>
  <text x="450" y="437" class="body">• Temporal Saga 必须在 500ms 内自动退回 $50 礼品卡并解锁优惠券</text>
  <text x="450" y="455" class="mono">• 信用卡失败却吞没客户礼品卡与首单神券 -&gt; HTTP 451 熔断</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#f59e0b" />
  <text x="450" y="508" class="card-title" fill="#fcd34d">Gate 4: 弃单库存秒级候补替补 (Waitlist Auto-Fill)</text>
  <text x="450" y="528" class="body">• 动态阶梯锁库 TTL: 高热度秒杀款仅锁 180 秒，常规款锁 600 秒</text>
  <text x="450" y="546" class="body">• 一旦前序买家超时未付，释放出的库存不回公海受爬虫争抢</text>
  <text x="450" y="566" class="mono">• 直接按序顺延激活候补队列 (Waitlist) 预授权买家秒级成交!</text>
  <text x="450" y="586" class="mono">• 零超卖罚金 + 零掉单客诉 + 候补秒转 -&gt; 净省 37% 大促损耗</text>

  <!-- Right Card: Tech Stack & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大高并发结账技术底座</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Redis Cluster + Lua 脚本原子锁</text>
  <text x="846" y="182" class="body">• 优势: 单分片 10 万+ QPS 原子判断 `if stock &gt;= qty then decrby`</text>
  <text x="846" y="198" class="body">• 特性: 配合 Redisson 延迟队列处理超时未支付自动回补</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. Stripe PaymentIntents + 幂等键</text>
  <text x="846" y="244" class="body">• 优势: 24 小时服务端幂等锁，参数篡改即返回 400 错误</text>
  <text x="846" y="260" class="body">• 特性: 支持 `expires_at` 精确控制收银台过期秒数</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. Temporal.io / LangGraph 持久化 Saga</text>
  <text x="846" y="306" class="body">• 优势: 进程崩溃重启后自动恢复执行未完成的优惠券/礼品卡冲正</text>
  <text x="846" y="322" class="body">• 特性: 保证“库存-优惠券-礼品卡-主卡”四方最终一致性</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. Shopify Checkout Extensibility</text>
  <text x="846" y="368" class="body">• 优势: 全球标杆级防刷排队室 (Queue-it 内置) 与原子库存预留</text>
  <text x="846" y="384" class="body">• 特性: 支持每分钟数万单黑五闪购零超卖</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度大促超卖罚金、掉单与占库损失 ($125,000)</text>
  <text x="860" y="456" class="body">• 传统超卖赔付+黄牛占库流拍+掉单退款: $125,000/季</text>
  <text x="860" y="476" class="mono">• Redis Lua + 结账锁库粉碎超卖与爬虫占库: -$22,500</text>
  <text x="860" y="496" class="mono">• 双 TTL 缓冲垫与载荷幂等消除重扣与掉单: -$13,750</text>
  <text x="860" y="516" class="mono">• 超时未付库存秒级顺延候补队列挽回 GMV: -$10,000</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净损耗: $78,750 (净省 $46,250 / -37%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: ecommerce_checkout_saga_optim_409</text>
</svg>

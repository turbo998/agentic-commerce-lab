<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg259" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent259" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dangerGrad259" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad259" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg259)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="420" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="254" y="55" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">ROUND 257 · CONSTRUCTION AIA G702/G703, RETAINAGE &amp; LIEN WAIVER</text>
  <text x="44" y="96" fill="#f8fafc" font-size="23" font-weight="800">B2B 智能体基建工程进度款（AIA G702/G703）、留置金托管与法定留置权豁免书清算架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">二级分包商 Unconditional Lien Waiver 闭环锁 + LiDAR/BIM 激光点云完工度核量 + 10% Retainage 托管 vs. 传统前期虚报套现与大楼被查封二次赔付</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent259)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad259)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统粗放工程进度款拨付的三大基建失血黑洞（双倍赔付 &amp; 烂尾）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. 总包挪用工程款触发二级分包商留置查封大楼（Double-Payment Lien · 403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 业主按时把 $200 万进度款打给总包 (GC)，总包却挪去填补外地亏空，拖欠机电分包与建材商</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 分包商依法直接在业主大楼产权上登记 Mechanic's Lien 并申请法拍，逼迫业主付第二遍钱</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 未核验 Preliminary Notice 全量分包商的上一期无条件豁免书 (Unconditional Waiver)</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. AIA G703 前期虚报套现与假场外暂存材料（Front-Loaded SOV · 422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• 总包将前期场地平整与深化图纸标价高估 300%，施工仅完成 38% 却在 G703 申报 65% 套现</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• 虚报“$60万冷水机组已存外地仓库 (Stored Materials)”，无保税仓产权保单即骗走进度款</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 缺乏无人机 LiDAR 激光点云与 BIM LOD 400 物理完工度实测核量门禁</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. 未竣工违规释放 10% 留置金与履约保函断保（Premature Retainage · 451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• 尚未取得市政入住证 (CO) 且存 40 项 Punch List 缺陷，总包公关提前套走 10% Retainage</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 施工中途总包商履约保函 (Surety Bond) 或工伤险 (COI) 断保，发生安全事故业主连带赔偿</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 留置金失去尾期整改约束力，工程烂尾或质量缺陷无人兜底</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad259)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + LiDAR/BIM + 法定留置权豁免四重门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · Preliminary Notice 全量分包豁免书闭环锁（拦截 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 100% 对齐工地预备通知名录，强制集齐全部二级分包与材料商的 N-1 期</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">Unconditional Waiver 与 N 期 Conditional Waiver；缺一即冻结并转 Joint-Check 直付</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · 3D LiDAR 激光点云 vs. BIM LOD 400 物理完工度锁（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">每周无人机/地面激光雷达扫描比对 BIM 构件实际安装率，严禁 G703 SOV 超物理进度</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">请款 (&gt;5% 偏差即阻断)，且场外暂存设备必须具备独立保税仓物权保单与铭牌核验</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · 10% Retainage 留置金竣工锁与保函/工伤险核验（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">硬件托管锁死 10% 留置金直至取得市政 Certificate of Occupancy 及 Punch List 清零，</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">并实时穿透州 CSLB 牌照库、Miller Act 履约保函与 COI 工伤险在线状态</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 分包联名直付托管 &amp; BIM 核量纠偏双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">10ms 签发 b2b_construction_aia_g702_... 令牌；BIM 核减与联名直付立省 $59,200 转 409</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#fbbf24" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 合规 G702 进度拨付</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">豁免书全齐 + 点云吻合 ($740k)</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Split-Escrow Settled · 10ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · 缺二级分包留置豁免书</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">防大楼被挂 Mechanic's Lien</text>
  <text x="410" y="692" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">MISSING_LIEN_WAIVER_BLOCKED</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · G703 前期虚报/假存料</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">点云实测 38% 却虚报 65%</text>
  <text x="642" y="692" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">FRONT_LOADED_G703_SOV</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · 违规释放留置金/断保</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">未获竣工证或 Surety Bond 断保</text>
  <text x="874" y="692" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">PREMATURE_RETAINAGE_HOLD</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · 点云纠偏+分包直付</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">立省 $59.2k ($680.8k 净付)</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">BIM_SOV_TRUEUP_CONFIRM</text>
</svg>

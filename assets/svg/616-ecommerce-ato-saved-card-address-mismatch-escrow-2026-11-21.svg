  <text x="442" y="200" class="mono">+ Residential_Proxy_ASN Velocity</text>
  <text x="432" y="223" class="body-txt">• Loyalty Points &amp; Store-Credit Instant-Drain Lock:</text>
  <text x="442" y="243" class="mono" fill="#fcd34d">Block &gt;$50 Wallet/Points Redemption on</text>
  <text x="442" y="261" class="mono" fill="#fcd34d">Unrecognized Device within 24h of Login</text>

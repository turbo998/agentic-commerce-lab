  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Saved-Card + New Address Step-Up Lock (403)</text>
  <text x="44" y="162" class="body-txt">• Closes the "1-Click Vaulted Token" ATO Loophole:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Hacker logs in → adds Mule Drop Address →</text>
  <text x="54" y="200" class="mono">charges victim's Saved Stripe/Braintree Token</text>
  <text x="44" y="223" class="body-txt">• Mandatory Cryptographic Binding Rule:</text>
  <text x="54" y="243" class="mono">If Payment == Saved_Card &amp; Ship_Addr == NEW:</text>
  <text x="54" y="261" class="mono" fill="#fca5a5">Require Full_PAN_ReEntry OR 3DS2 / Passkey</text>
  <text x="44" y="284" class="body-txt">• Blocks silent 0-CVV token reuse when shipping</text>
  <text x="54" y="302" class="body-txt">destination diverges from historical address graph</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 SAVED_CARD_NEW_ADDRESS_NO_STEPUP_BLOCKED</text>


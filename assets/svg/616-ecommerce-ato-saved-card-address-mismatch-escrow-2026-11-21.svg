  <text x="820" y="223" class="body-txt">• In-Transit Carrier Reroute (`UPS MyChoice/FedEx`):</text>
  <text x="830" y="243" class="mono" fill="#f9a8d4">Ship with Shipper_Release=False &amp; Direct_Addr</text>

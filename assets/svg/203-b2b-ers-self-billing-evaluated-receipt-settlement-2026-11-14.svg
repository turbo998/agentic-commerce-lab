  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#teal203)"/>
  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 201 · B2B ERS SELF-BILLING</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">B2B 评估收货结算 (ERS / 逆向开票 Self-Billing) 与免发票自动清算架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">地磅实收净重签名 + EU VAT Art. 224 双签协议 + 防卖方重开发票门禁 (`b2b_ers_self_billing_receipt_settlement_mandate_...`) vs 32% 异常挂账与双倍付款</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red203)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：等供应商开票尾差挂账 + 卖方误发发票造成 200% 双倍付款</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 32% 供应商发票因途耗、皮重或四舍五入卡死在异常挂账：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 大宗原料运输自然途耗 0.4% (实收 99.6 吨)，但供应商仍按发货 100 吨开票；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 三单匹配冻结长达 20–45 天，每张异常发票耗费 $15–$22 人工对账红冲成本。</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. “买方 ERS 逆向开票 + 供应商 EDI 810 正向开票”双轨碰撞：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 缺乏通道互斥锁导致同一批货被付两次款 (200%) 并重复申报两次增值税进项抵扣！</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 违反欧盟 EU VAT Art. 224 / 英国 HMRC Notice 700/62 法定红线：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 双边逆向开票协议 (SBA) 过期或供应商已注销 VAT 税号，税局全额追缴进项税并重罚。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms Dup Invoice/SBA) | HTTP 422 (14ms Weight Drift)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#teal203)"/>
  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：B2B ERS 评估收货逆向开票 + 通道互斥锁 + Web IQ 税号核验</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 入库实收净重 × PO 协议单价 10ms 自动生成逆向税票：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 彻底消灭“等待供应商开票”环节；以买方校准地磅实收净重 (GR) 为唯一结算真源；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动签发带法定 "SELF-BILLING / AUTOFACTURATION" 标识的 Peppol 3.0 税票。</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. PO 级 ERS_EXCLUSIVE 互斥锁 + SBA 12个月效期门禁：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 硬拒收任何针对 ERS 订单的供应商自开发票，100% 根绝双倍付款与重复抵扣。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms VIES 税号活性核验与早付折扣：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 免除 32% 异常挂账人工成本并捕获 JIT 早付折扣，单批立省 $34,000.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $680k ERS) | HTTP 409 ($34k AP &amp; JIT Discount Saved)</text>


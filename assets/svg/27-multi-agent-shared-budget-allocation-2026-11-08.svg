      <text x="254" y="58" fill="#38BDF8" font-size="10">版本冲突 15ms 返 HTTP 409</text>

      <text x="466" y="38" fill="#38BDF8" font-size="18" font-weight="800">→</text>

      <rect x="484" y="0" width="216" height="68" rx="8" fill="#0F172A" stroke="#A855F7"/>
      <text x="496" y="22" fill="#D8B4FE" font-size="12" font-weight="700">③ 4,000ms 死锁熔断器</text>
      <text x="496" y="42" fill="#CBD5E1" font-size="11">DAG 拓扑防双向循环等待</text>
      <text x="496" y="58" fill="#C084FC" font-size="10">超时 17ms 返 HTTP 408</text>

      <text x="708" y="38" fill="#38BDF8" font-size="18" font-weight="800">→</text>

      <rect x="726" y="0" width="216" height="68" rx="8" fill="#0F172A" stroke="#F59E0B"/>
      <text x="738" y="22" fill="#FDE68A" font-size="12" font-weight="700">④ Web IQ 联订套餐比价</text>
      <text x="738" y="42" fill="#CBD5E1" font-size="11">拆单 $1,910 vs 整包 $1,620</text>
      <text x="738" y="58" fill="#FBBF24" font-size="10">省 $290 → 315ms 409 Confirm</text>

      <text x="950" y="38" fill="#10B981" font-size="18" font-weight="800">→</text>

      <rect x="968" y="0" width="188" height="68" rx="8" fill="#042F2E" stroke="#10B981"/>
      <text x="980" y="22" fill="#A7F3D0" font-size="12" font-weight="700">⑤ 协同原子交割 (265ms)</text>
      <text x="980" y="42" fill="#E2E8F0" font-size="11">实付 $1,910 &lt;= $2,000</text>
      <text x="980" y="58" fill="#34D399" font-size="10">HTTP 200 $0 透支成交</text>
    </g>

    <line x1="20" y1="40" x2="1180" y2="40" stroke="#334155"/>
    <text x="28" y="58" fill="#94A3B8" font-size="12" font-weight="700">评测场景 (Scenario)</text>
    <text x="380" y="58" fill="#94A3B8" font-size="12" font-weight="700">共享主钱包无协调基线</text>
    <text x="690" y="58" fill="#94A3B8" font-size="12" font-weight="700">层级化子切片 + CAS 账本 + Web IQ 网关</text>
    <text x="1040" y="58" fill="#94A3B8" font-size="12" font-weight="700">实测延迟 / 证据标签</text>

    <line x1="20" y1="68" x2="1180" y2="68" stroke="#1E293B"/>
    <text x="28" y="88" fill="#E2E8F0" font-size="12">1. 3 个子 Agent 无切分共享 $2,000 主钱包并发扣款</text>
    <text x="380" y="88" fill="#F87171" font-size="12">❌ TOCTOU 并发刷出 $2,850 (超支 $850)</text>
    <text x="690" y="88" fill="#34D399" font-size="12" font-weight="700">🛑 HTTP 403 SHARED_ROOT_WALLET_RACE_BLOCKED</text>
    <text x="1040" y="88" fill="#CBD5E1" font-size="12">12 ms (synthetic)</text>

    <text x="28" y="112" fill="#E2E8F0" font-size="12">2. 并发基于过期版本 v42 争抢酒店释放的 $150 盈余</text>
    <text x="380" y="112" fill="#F87171" font-size="12">❌ 双花许诺导致总支出突破 $2,000</text>
    <text x="690" y="112" fill="#34D399" font-size="12" font-weight="700">🛑 HTTP 409 CAS_BUDGET_VERSION_CONFLICT</text>
    <text x="1040" y="112" fill="#CBD5E1" font-size="12">15 ms (simulation)</text>

    <text x="28" y="136" fill="#E2E8F0" font-size="12">3. 子 Agent 循环等待或议价超 4,000ms + Web IQ 联订比价</text>
    <text x="380" y="136" fill="#F87171" font-size="12">❌ 死锁烧光 Token / 拆单多花 $290</text>
    <text x="690" y="136" fill="#FBBF24" font-size="12" font-weight="700">🛑 17ms HTTP 408 死锁熔断 / 🧑‍⚖️ 315ms 409 联订省 $290</text>
    <text x="1040" y="136" fill="#CBD5E1" font-size="12">17ms / 315ms</text>

    <text x="28" y="160" fill="#E2E8F0" font-size="12">4. 酒店释放 $150 盈余 + CAS 调拨 $80 给机票 ($1,910 &lt;= $2,000)</text>
    <text x="380" y="160" fill="#F87171" font-size="12">⚠️ 静态切片卡死在机票 $900 失败</text>
    <text x="690" y="160" fill="#34D399" font-size="12" font-weight="700">⚡ HTTP 200 COALITION_BUDGET_ALLOCATED_COMMITTED</text>
    <text x="1040" y="160" fill="#CBD5E1" font-size="12">265 ms (simulation)</text>

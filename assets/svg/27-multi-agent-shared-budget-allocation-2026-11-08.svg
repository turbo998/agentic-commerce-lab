  <!-- Header -->
  <g transform="translate(40, 26)">
    <rect x="0" y="0" width="440" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="16" y="19" fill="#A7F3D0" font-size="12" font-weight="700" letter-spacing="0.5">ROUND 25 · MULTI-AGENT A2A BUDGET SLICING &amp; CAS LEDGER FAQ</text>
    <text x="456" y="19" fill="#94A3B8" font-size="12">Provenance: deterministic_offline_simulation · official_doc_snapshot · synthetic_policy (as of 2026-11-08)</text>

    <text x="0" y="62" fill="#F8FAFC" font-size="24" font-weight="800">多智能体协同采购（A2A）共享预算拆账架构：层级化子切片 + CAS 盈余账本 vs 并发抢扣透支</text>
    <text x="0" y="88" fill="#CBD5E1" font-size="14">Hierarchical Sub-Mandate Slicing (sub_mandate_slice_...) &amp; 2PC CAS Surplus Rebalance vs. Shared Root-Wallet Race Overdraft &amp; Deadlock</text>
  </g>

  <!-- Left Card: Shared Root Wallet Race Overdraft & Deadlock -->
  <g transform="translate(40, 132)">
    <rect x="0" y="0" width="580" height="275" rx="14" fill="url(#cardRed27)" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="18" y="16" width="290" height="24" rx="6" fill="#7F1D1D"/>
    <text x="28" y="33" fill="#FECACA" font-size="12" font-weight="700">❌ 传统共享主钱包并发抢扣 (TOCTOU 透支 + 环形死锁)</text>

    <rect x="20" y="54" width="540" height="64" rx="8" fill="#140A0C" stroke="#7F1D1D"/>
    <text x="34" y="76" fill="#FCA5A5" font-size="13" font-weight="700">漏洞 1：3 个并发子 Agent 同时读取 $2,000 主钱包余额 (HTTP 403 · 12ms 阻断)</text>
    <text x="34" y="96" fill="#E2E8F0" font-size="12">机票($1,100) + 酒店($1,200) + 租车($550) 同时通过 balance &gt;= price 检查 → 实扣 $2,850!</text>
    <text x="34" y="112" fill="#F87171" font-size="11" font-weight="700">→ 300ms 内击穿 $2,000 差旅总预算红线，恶意/并发超支高达 +$850.00 (+42.5%)!</text>

    <rect x="20" y="128" width="540" height="64" rx="8" fill="#140A0C" stroke="#7F1D1D"/>
    <text x="34" y="150" fill="#FCA5A5" font-size="13" font-weight="700">漏洞 2：无乐观锁 P2P 抢夺盈余与循环等待死锁 (HTTP 409 15ms / HTTP 408 17ms)</text>
    <text x="34" y="170" fill="#E2E8F0" font-size="12">机票与租车同时基于旧版本 v42 抢夺酒店省下的 $150 盈余；或互等对方先降级陷入死锁</text>
    <text x="34" y="186" fill="#F87171" font-size="11" font-weight="700">→ 双花承诺导致总额再次越界，或超过 4,000ms 时间盒无限互发消息烧光 Token!</text>

    <rect x="20" y="202" width="540" height="56" rx="8" fill="#140A0C" stroke="#7F1D1D"/>
    <text x="34" y="224" fill="#FCA5A5" font-size="13" font-weight="700">漏洞 3：各自孤立拆单错过官方“机+酒+车”联订套餐大额折扣</text>
    <text x="34" y="244" fill="#E2E8F0" font-size="12">3 个子 Agent 各自砍到最低单买价 ($980+$650+$280=$1,910)，却比官方 $1,620 联订包多花 $290!</text>
  </g>


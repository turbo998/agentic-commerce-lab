    <rect x="0" y="0" width="580" height="275" rx="14" fill="url(#cardGreen27)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="18" y="16" width="380" height="24" rx="6" fill="#065F46"/>
    <text x="28" y="33" fill="#A7F3D0" font-size="12" font-weight="700">✅ 层级化子授权切片 (sub_slice_...) + CAS 盈余账本 + Web IQ 联订</text>

    <rect x="20" y="54" width="540" height="64" rx="8" fill="#04130E" stroke="#065F46"/>
    <text x="34" y="76" fill="#6EE7B7" font-size="13" font-weight="700">1. 派发前原子切分 + MCC 品类硬绑定 (∑ Slice_i = $2,000 · 0% 并发超支)</text>
    <text x="34" y="96" fill="#E2E8F0" font-size="12">Flight=$900 (MCC 4511) · Hotel=$800 (MCC 7011) · Car=$300 (MCC 7512)</text>
    <text x="34" y="112" fill="#34D399" font-size="11" font-weight="700">→ 网关按子令牌独立验额，从数学上根除 TOCTOU 并发超支 (共享主钱包 12ms 返回 HTTP 403)</text>

    <rect x="20" y="128" width="540" height="64" rx="8" fill="#04130E" stroke="#065F46"/>
    <text x="34" y="150" fill="#6EE7B7" font-size="13" font-weight="700">2. 主控账本乐观锁 CAS 盈余调拨 + 4,000ms 死锁熔断 (18ms 调拨 / 17ms 解锁)</text>
    <text x="34" y="170" fill="#E2E8F0" font-size="12">酒店实锁 $650 释放 $150 回主池 (v43) → CAS 原子拨付 $80 给机票 ($980, v44)</text>
    <text x="34" y="186" fill="#34D399" font-size="11" font-weight="700">→ 旧版本并发抢夺 15ms 返 HTTP 409；环形等待超 4,000ms 立即返 HTTP 408 熔断</text>

    <rect x="20" y="202" width="540" height="56" rx="8" fill="#04130E" stroke="#065F46"/>
    <text x="34" y="224" fill="#6EE7B7" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 跨品类联订套利接地 (315ms HTTP 409 Confirm)</text>
    <text x="34" y="244" fill="#E2E8F0" font-size="12">检出官方“机+酒+车”联订整包 $1,620 比拆单总和 $1,910 省 $290 → 弹窗建议一键切换整包!</text>
  </g>


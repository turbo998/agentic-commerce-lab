  <text x="440" y="372" class="body">核验 EPA/OSPAR 汞 Hg&lt;=1ppm &amp; 镉 Cd&lt;=3ppm</text>
  <text x="440" y="390" class="body">&amp; API 13A 会标有效性 — 海洋违禁直返 HTTP 451</text>

  <rect x="428" y="410" width="348" height="68" rx="8" fill="#1e293b" stroke="#f59e0b"/>

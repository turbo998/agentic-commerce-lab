  <text x="52" y="196" class="body" fill="#fca5a5" font-weight="700">1. 重晶石掺石灰石 (SG=3.88&lt;4.20) 致井漏井喷</text>
  <text x="52" y="216" class="body">掺 25% 碳酸钙后为配到 2.10 密度需多投 35% 粉，</text>
  <text x="52" y="234" class="body">固相体积冲破 45% 红线致 ECD 压裂地层恶性井漏，</text>
  <text x="52" y="252" class="body">液面下降失去静液柱压力瞬间诱发高压气侵井喷！</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. 石膏水溶性钙 (&gt;250 mg/kg) 与斜井沉砂埋钻</text>

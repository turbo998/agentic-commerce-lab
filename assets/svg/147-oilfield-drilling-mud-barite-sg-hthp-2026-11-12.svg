  <text x="440" y="296" class="body">180°C/500psi HTHP 滤失 &lt;=12.0 mL (泥饼 &lt;=2mm)</text>
  <text x="440" y="314" class="body">&amp; 沉砂因子 SF 0.50–0.53 — 卡钻风险直返 HTTP 422</text>

  <rect x="428" y="334" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>

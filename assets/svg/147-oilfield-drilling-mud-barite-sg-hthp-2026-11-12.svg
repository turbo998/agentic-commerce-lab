  <text x="52" y="320" class="body">重晶石沉降堆积 (SF&gt;0.53) 埋死千万美元旋转导向。</text>

  <text x="52" y="350" class="body" fill="#fca5a5" font-weight="700">3. 180°C HTHP 滤失失控引发“压差卡钻”</text>
  <text x="52" y="370" class="body">HTHP&gt;12mL 致泥页岩水化垮塌，并在砂岩井壁结</text>
  <text x="52" y="388" class="body">6mm 厚虚泥饼将钻具吸死，侧钻报废超 $1.5M。</text>

  <rect x="52" y="418" width="323" height="58" rx="8" fill="#0f172a" stroke="#7f1d1d"/>

  <text x="54" y="538" class="card-h" fill="#38bdf8">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• 深井钻井液严禁“按重晶石吨袋盲付”：掺入低比重石灰石会使固相体积冲破 45% 引发井漏与井喷，而 HTHP 滤失超标会结厚泥饼吸死钻具。</text>
  <text x="54" y="584" class="body">• 必须将 API 13A 真比重 (&gt;=4.20 g/cm3)、180°C HTHP 滤失 (&lt;=12mL) 与 Web IQ 双离心机重晶石回收 (82% 复用) 绑定为智能托管解锁谓词。</text>

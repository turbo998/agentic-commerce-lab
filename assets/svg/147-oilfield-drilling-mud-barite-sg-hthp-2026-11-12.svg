  <text x="36" y="84" class="sub">Oilfield Drilling Mud API Barite &amp; HPHT Fluid SLA, Specific Gravity (&gt;=4.20 g/cm3), HTHP Filtrate (&lt;=12 mL) &amp; Centrifuge Recovery</text>


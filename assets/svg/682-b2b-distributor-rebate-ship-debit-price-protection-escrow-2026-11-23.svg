  <text x="62" y="462" class="body-txt">Replaces dangerous `$1`</text>
  <text x="62" y="480" class="body-txt">retroactive margin cliffs</text>
  <text x="62" y="498" class="body-txt">with stepped marginal</text>
  <text x="62" y="516" class="mono">growth-mix rebate bands!</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="337" y="440" class="card-hdr">② Automated `EDI 849` Response</text>
  <text x="337" y="462" class="body-txt">Line-by-line auto-adjudicates</text>
  <text x="337" y="480" class="body-txt">`EDI 844` claims in `400ms`</text>
  <text x="337" y="498" class="body-txt">and returns `EDI 849`</text>
  <text x="337" y="516" class="mono">approved/adjusted codes!</text>

  <rect x="608" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>

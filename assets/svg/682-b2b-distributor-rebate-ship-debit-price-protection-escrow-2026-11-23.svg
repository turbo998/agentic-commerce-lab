  <text x="622" y="462" class="body-txt">Settles approved rebates</text>
  <text x="622" y="480" class="body-txt">as `Credit Memos` against</text>
  <text x="622" y="498" class="body-txt">next PO/AR balance instead</text>
  <text x="622" y="516" class="mono" fill="#6ee7b7">of raw wire cash drain!</text>

  <rect x="893" y="418" width="259" height="120" rx="8" fill="#1e293b" stroke="#10b981"/>

  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. `EDI 844` Stack Mutex Gate (HTTP 422)</text>
  <text x="432" y="162" class="body-txt">• Blocks `Ship-and-Debit` + Volume Rebate Stack:</text>
  <text x="442" y="182" class="mono">Exclude `SPA / EDI_844_Claimed_Serial_Numbers`</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">From Back-End Volume Rebate Accrual Pool!</text>
  <text x="432" y="223" class="body-txt">• Verified Wholesale Acquisition Cost (`WAC`) Base:</text>
  <text x="442" y="243" class="mono">Debit_Claim = `Actual_Net_Paid_Lot_Price - SPA`</text>
  <text x="432" y="266" class="body-txt">• Prevents distributors claiming a `$40` special</text>
  <text x="442" y="286" class="body-txt">pricing billback against High List Price when</text>
  <text x="442" y="304" class="body-txt">they bought the lot on a `-15%` promo deal</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 SHIP_AND_DEBIT_VOLUME_REBATE_DOUBLE_DIP_OR_WAC_INFLATION</text>

  <!-- Lane 3: Phantom Inventory Price-Protection Claims (Claiming Price-Drop Credit on Already-Sold Stock) -->
  <rect x="804" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. `FIFO Price-Protection` Gate (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Stops Phantom On-Hand Price-Protection Claims:</text>
  <text x="830" y="182" class="mono">Verify `Eligible_Stock = min(EDI_852_OnHand,`</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">`Cumulative_Ship_In - Cumulative_POS_Out)`!</text>
  <text x="820" y="223" class="body-txt">• Enforces 60-Day `FIFO` Purchase-Window Cap:</text>
  <text x="830" y="243" class="body-txt">Blocks distributors inflating warehouse counts</text>
  <text x="830" y="261" class="body-txt">when a vendor announces a `15%` MSRP price cut</text>
  <text x="830" y="279" class="body-txt">to pocket `$120k` in unearned credit memos</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 PHANTOM_PRICE_PROTECTION_STOCK_OR_AGED_LOT_CLAIM</text>


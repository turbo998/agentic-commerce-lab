  <text x="48" y="74" class="sub">Enable / SAP Vistex / Flintfox / Model N · `Sell-Through` Netting · `EDI 844/849` Stack Mutex · `FIFO` Price-Protection (-36%)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1081" y="59" text-anchor="middle" class="mono" fill="#a7f3d0">SVG #682 · FAQ #358</text>

  <!-- Lane 1: Quarter-End Channel Stuffing & Post-Rebate Return Gaming (Dec 30 Buy -> Jan 5 RMA) -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. `Sell-Through` &amp; Return Gate (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Dec 30 Buy / Jan 5 Return Tier Gaming:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Accrue Tiered Rebates on `Net_Paid_Sell_Through`</text>
  <text x="54" y="200" class="mono">+ Enforce `45-Day Post-Close Return Hold`!</text>
  <text x="44" y="223" class="body-txt">• Retroactive Cliff vs Marginal Tier Guard:</text>
  <text x="54" y="243" class="mono">Recalculate Tier Retroactively on Any Q1 RMA</text>
  <text x="44" y="266" class="body-txt">• Eliminates distributors placing a fake `$500k`</text>
  <text x="54" y="286" class="body-txt">order on Dec 30 just to unlock an `8%` retro</text>
  <text x="54" y="304" class="body-txt">rebate on `$5M` annual spend and returning it</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 CHANNEL_STUFFING_RETURN_GAMING_OR_UNPAID_INVOICE</text>

  <!-- Lane 2: Double-Dipping Ship-and-Debit (EDI 844) + Back-End Volume Rebate on the Same Invoice Line -->

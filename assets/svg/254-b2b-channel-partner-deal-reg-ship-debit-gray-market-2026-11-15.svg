  <text x="684" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• /v3/browse 280ms 识别外国政府与国企 (SOE) 终端属性，刚性封顶渠道合理留存毛利 (&lt;=18%)。</text>
  <text x="684" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 同步筛查 BIS Entity List 出口管制清单，拦截 FCPA 小金库风险与违规转售 (HTTP 451)！</text>

  <rect x="668" y="446" width="564" height="68" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>

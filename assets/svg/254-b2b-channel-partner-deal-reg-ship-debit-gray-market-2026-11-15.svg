  <text x="50" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5">❌ 传统“前置 4 折发货 + Excel 出货表报销”（四大渠道毛利黑洞）</text>
  <text x="50" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#FECACA">Why Upfront SPA Discounts &amp; Unverified POS Spreadsheets Trigger Gray-Market Dumping &amp; FCPA Fines</text>

  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. 编造“假大客户立项”骗取 40% 特批价 (SPA) 倒卖至窜货灰市</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 代理商借某大银行买 20 台服务器之名，虚报 200 台骗取 6 折特批价，将多出的 180 台抛售至灰市。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 未校验设备序列号是否真在该银行 DUNS 租户下联网激活，彻底砸穿原厂全国价格体系！</text>

  <rect x="48" y="282" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">2. 母子公司换名重复报备商机 (Deal-Reg) 与“折上折”击穿成本底线</text>
  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 两家代理分别用客户总部与分公司名称报备同一项目；或将 SPA 特价 + 报备返点 + 季度返利无限叠加。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 甚至将早已售出的旧批次虚报为在库库存骗取跌价保护 (Price Protection)，原厂卖一台亏一台！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 海外政务/国企 (SOE) 项目批出 50% 异常深折触发 DOJ FCPA 巨额罚单</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 代理商以“政务竞争激烈”为由讨要 5 折底价，转手却按原价卖给政府，中间 45% 差价沦为行贿小金库。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 原厂因违反美国《反海外腐败法 (FCPA 15 USC 78dd-1)》第三方管控义务被罚没数亿美元！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">4. 手工核对总代 Excel POS 周报滞后 45 天且漏检 BIS 管制终端</text>
  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 传统渠道财务靠人工比对数万行 Excel 序列号，错发贷项通知单后无法追回。</text>
  <text x="64" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 无法实时阻断代理商将高算力芯片转售给 BIS Entity List 受限实体。</text>


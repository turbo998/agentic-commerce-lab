  <text x="684" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 任何未激活或在灰市陌生租户激活的窜货序列号，11ms 硬拦截拒付补贴 (HTTP 403)！</text>

  <rect x="668" y="282" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>

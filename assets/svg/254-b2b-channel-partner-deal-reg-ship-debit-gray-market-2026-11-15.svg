  <text x="684" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 穿透全球 DUNS 母子树锁定唯一报备权；特批价 (SPA) 自动互斥常规冲量返利并校验 FIFO 在库序列号。</text>
  <text x="684" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 检出一单双报、返点叠加击穿 Pocket Margin 底线或虚报库存，14ms 立即阻断 (HTTP 422)！</text>

  <rect x="668" y="364" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>

  <text x="684" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 自动打包 AS2 MDN + ELD 围栏轨迹 + 出库条码评级图一键上传商超门户完成全自动申诉。</text>
  <text x="684" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FDE68A">• 在 $760,000.00 商超供货批次上单批追回/防损 $60,800.00 (净确认回款 $699,200.00 · HTTP 409)！</text>


  <text x="684" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• /v3/browse 280ms 核验促销补贴是否符合 15 U.S.C. § 13(d)/(e) 同区域零售商等比例开放原则。</text>
  <text x="684" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 实时盯防商超门户 30 天硬性申诉过期窗口，异常交易立即触发合规挂起 (HTTP 451)！</text>

  <rect x="668" y="446" width="564" height="68" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>

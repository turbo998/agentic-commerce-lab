  <text x="50" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5">❌ 传统“见 EDI 812 扣款单即认栽核销”（四大净利润吞噬黑洞）</text>
  <text x="50" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#FECACA">Why Blindly Accepting Retailer EDI 812 Debit Memos Wipes Out 3%–8% of Gross Revenue</text>

  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. 商超自身月台堵车排队 9 小时却甩锅供应商强扣 3% OTIF 迟到罚金</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 卡车在 MABD 截止前 4 小时已抵达商超仓库大门口，因商超缺卸货工在院内苦等至次日凌晨才扫码。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 商超 WMS 按次日扫码时间自动判 OTIF 违约并扣走 3% 货款，或谎称未收到 EDI 856 ASN 开罚单！</text>

  <rect x="48" y="282" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">2. 商超以“外箱 GS1-128 条码扫不出”为由按 $25/箱乱开标签重贴罚单</text>
  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 收货员图省事手敲条码代替扫描枪，系统自动生成“供应商 SSCC-18 标签印刷缺陷”扣款单。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 供应商出库时未留存 ISO 15416 光学对比度评级照片，1,000 箱货被白扣 $25,000 无法申诉！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 无投放实绩证明 (POP) 强扣数万美元 Co-Op / MDF 联合营销基金</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 商超采购员直接发 EDI 812 从货款中划走 $40,000 促销补贴，却不提供端架照片或曝光数据 (POP)。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 违反 ASC 606-10-32-25 独立履约义务准则，沦为零售商填补自身毛利缺口的隐形提款机！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">4. 触犯《罗宾逊-帕特曼法》反价格歧视红线与错过 30 天申诉死线</text>
  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 私下向单一零售巨头提供非等比例 MDF 补贴违反 15 U.S.C. § 13(d)/(e)，面临 FTC 与竞对 3 倍索赔。</text>
  <text x="64" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 人工月底对账缓慢，超过 Walmart Retail Link / Vendor Central 30 天申诉期永久失权！</text>


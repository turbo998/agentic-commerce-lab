  <text x="684" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 凡属商超自身月台排队或内部 EDI 延迟导致的伪 OTIF/ASN 罚单，11ms 硬拦截拒付 (HTTP 403)！</text>


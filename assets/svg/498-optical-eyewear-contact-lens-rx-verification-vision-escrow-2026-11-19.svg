  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. 近视负号写成远视正号或缺瞳距(PD)，镜片全报废</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 用户手动抄写验光单把 -4.50 填成 +4.50，或高度</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  渐进多焦点镜片未测单眼瞳距(Dual PD)导致头晕全退</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：验光单 OCR 符号一致性 + Apple TrueDepth</text>

  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Warby Parker / Zenni / 1-800 Contacts / 宝岛眼镜 vs FTC FCLCA 8h 被动核验 vs AR 瞳距测量 vs VSP/FSA 拆账</text>

  <!-- Left Panel: 3 Core Optical & Contact Lens Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />

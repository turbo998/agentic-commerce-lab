  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">医疗与司法口笔译：SIP 秒级 CDR 译员接通锁、NBCMI 持证核验 vs IVR 排队计费与 15 分钟凑整</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_medical_legal_interpretation_vri_opi_per_second_cdr_nbcmi_certification_mandate_2026 · 15.0% Savings ($23,250 / Batch)</text>

  <!-- Left Panel: Legacy LSP Traps -->

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动剥离排队凑整、VRI 降级与 TM 重复词折扣 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动按 Leg-B 真实秒数重算话单、将非必要 VRI 降级为 OPI 并执行 TM 折扣：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $155,000.00 → 自动核减 $23,250.00 (15.0%) → 净付 $131,750.00！</text>


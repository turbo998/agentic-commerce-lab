  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Leg-B 译员接通信令起算 + 按秒无凑整锁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">彻底剥离 Leg-A IVR 语种选择与排队等待时长，仅统计 Leg-B 译员桥接 200 OK</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">至挂断的真实口译秒数，严禁 15/30 分钟起步凑整，毫秒级拦截注水话单。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 非手语 VRI→OPI 费率封顶 + XLIFF TM 折扣门禁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">无视觉临床需求的语音通话强制按 OPI 单价封顶；校验 .tmx/XLIFF 字数矩阵强制</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">扣除 100% 重复匹配并核验 ISO 17100 双译员修订签名，封杀 MT 冒充 TEP。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核验 NBCMI / CCHI / RID 执业库 (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 穿透核查每通临床/法庭口译员的 NBCMI、CCHI、RID 手语及州法院认证</text>

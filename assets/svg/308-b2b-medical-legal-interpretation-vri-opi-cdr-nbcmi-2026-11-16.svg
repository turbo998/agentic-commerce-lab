  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统语言服务商四大计费黑洞 (Legacy LSP Billing Leakage: 22%–45%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. IVR 排队听音乐照收钱 + 15 分钟最低起步凑整 (Hold Time &amp; Minimum Floor)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">急诊护士在 IVR 队列等了 7 分半钟，接通译员仅讲 80 秒，供应商却从呼入起算</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">或按 15 分钟 VRI 最低消费门槛强收 $59.25 ($3.95/分×15)，溢价近 10 倍。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 无证客服顶替持证医疗/法庭译员 (Uncertified Call-Center Overflow)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">高峰期将临床知情同意或庭审口译溢出给无 NBCMI/CCHI/RID 资质的海外双语客服</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">(成本 $0.25/分)，账单仍按持证医疗/司法专员高档费率 ($2.80–$3.95/分) 结算。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 纯语音沟通默认呼出高价视频流 (Unnecessary VRI Over-Routing vs. OPI)</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">非手语 (Non-ASL) 的普通话/西语门诊取药说明无需视频画面，诊室 iPad 却默认</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">发起 $3.25/分 VRI 视频呼叫（而非 $0.85/分 OPI 音频），白付 3.8 倍差价。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 机器直译冒充人工双审与 TM 重复词全价 (MTPE Upcoding &amp; No TM Discount)</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">临床试验文档中 62% 属翻译记忆库 100% 重复句段却不给折扣，或用大模型直出</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">冒充 ISO 17100 双独立医学专家审校 (TEP) 按 $0.28/源词全价收割。</text>


  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 204 · GIFT CARD &amp; AML GATE</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体闭环礼品卡 (Closed-Loop Gift Card) 与储值钱包防撞库反洗钱架构</text>

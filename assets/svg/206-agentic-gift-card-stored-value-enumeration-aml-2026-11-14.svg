  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red206)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：连号卡密被机器人撞库刷空 + 盗刷买卡 90 秒异地洗钱变现</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 16位连号卡 + 4位数字 PIN + 开放匿名查余额接口：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 黑产 AI 机器人每秒数万次遍历 /check-balance 接口并穷举 10,000 种 PIN；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 一夜之间将尚未被消费者刮开的数十万美元节日礼品卡资金池彻底搬空！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 盗刷信用卡买电子卡 → 90秒换小号买 iPhone (三角洗钱)：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 电子卡免物理收货地址绕过 AVS；小号用储值付款被误判为“零风险”秒放行。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 允许“以卡买卡/BNPL买卡”且单卡日充 &gt;$2,000 触犯 FinCEN 法案：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 突破 31 CFR § 1010.100(ww) $2,000 闭环豁免红线，沦为无牌照非法资金传输商。</text>


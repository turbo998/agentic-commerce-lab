  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 128 位随机熵卡号 + HSM Pepper Argon2id 哈希 + 登录态绑定：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 彻底关闭匿名查余端点；强制 Bind-on-First-Check 且单日试错 3 次即锁死；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 行项目级支付源互斥锁：11ms 硬禁止用礼品卡、储值或 BNPL 购买新礼品卡。</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 单卡单日 ≤$2,000 FinCEN 硬顶 + 跨号高变现品冷静期锁：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 阻断 90 秒异地小号秒提数码黄金；100% 守住闭环预付卡免 MSB 牌照安全港。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms CARD Act 核验与通道费套利：</text>

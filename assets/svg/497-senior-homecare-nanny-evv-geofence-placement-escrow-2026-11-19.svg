  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">居家养老护理与月嫂家政：防护工空挂打卡骗保、防保姆闪辞坑中介费与无证熔断</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Care.com / Papa / Honor / 天鹅到家 vs 21st Century Cures Act EVV 蓝牙打卡 vs 中介费按日托管 vs OIG 筛查</text>

  <!-- Left Panel: 3 Core Home-Care & Domestic Placement Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 居家养老与月嫂家政三大资金黑洞</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />

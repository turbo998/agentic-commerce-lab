  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Cures Act EVV 六要素 + 老人家中 BLE 蓝牙信</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  标/固话 IVR 双因子在场强核验 (HTTP 403)</text>


  <rect width="1200" height="675" fill="url(#bg600)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent600)" rx="3" />

  <text x="40" y="58" class="title">服装鞋履 AI 尺码导购 (True Fit / Bold Metrics)、防买3退2试码 (Bracketing) 与虚拟试穿托管架构</text>
  <text x="40" y="80" class="subtitle">Round 157 · 防同款连拍 S/M/L 三件退两件吃光毛利、防全站共用一张通用尺码表误导 &amp; 精准锁码净省 39% (SVG 600)</text>

  <!-- Left Card: 3 Sizing & Bracketing Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大服装尺码退货与试穿黑洞</text>
  <text x="56" y="164" class="card-title">1. “同款连拍 S/M/L 三件退两件”风暴 (HTTP 403)</text>
  <text x="56" y="184" class="body">• 买家拿不准尺码，同一件 $150 连衣裙一口气拍下 S、M、L 三件</text>
  <text x="56" y="202" class="body">• 必退 2 件 (67% 退货率)，来回运费 + 熨烫重包费亏掉 $28</text>
  <text x="56" y="220" class="warn">• 更导致大促期间另外 2 件黄金尺码被白白锁死 14 天错过真买主!</text>

  <text x="56" y="256" class="card-title">2. 全站套用同一张“通用尺码表”瞎推荐 (HTTP 422)</text>
  <text x="56" y="276" class="body">• 紧身瑜伽裤与 Oversize 廓形卫衣竟然共用同一张静态身高体重表</text>
  <text x="56" y="294" class="body">• 未接入工廠 CAD 制版平铺实测数据 (Garment Spec) 与面料弹力系数</text>
  <text x="56" y="312" class="warn">• 某批次牛仔裤实际偏小 1.5 码却未触发动态修正，退货率飙至 62%!</text>

  <text x="56" y="348" class="card-title">3. 虚拟试穿 (VTO) 渲染失真与身材隐私泄露 (HTTP 451)</text>
  <text x="56" y="368" class="body">• AIGC 虚拟换装只做 2D 贴图美化，把短款露脐装P成长款遮胯效果</text>
  <text x="56" y="386" class="body">• 买家收到实物大失所望投诉虚假宣传；或未经脱敏保存用户</text>
  <text x="56" y="404" class="warn">  全身内衣紧身照用于训练模型，违反伊利诺伊 BIPA 生物识别法!</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: MULTI_SIZE_BRACKETING_CART_HOARDING</text>
  <text x="70" y="502" class="warn">• HTTP 422: GENERIC_SIZE_CHART_OR_HIGH_RETURN_LOT</text>
  <text x="70" y="524" class="warn">• HTTP 451: UNCALIBRATED_VTO_DRAPE_OR_BIPA_PII_LEAK</text>
  <text x="70" y="546" class="mono">• HTTP 409:CROSS_BRAND_FIT_GRAPH_FREE_EXCHANGE_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: GARMENT_SPEC_VERIFIED_SINGLE_SIZE_200</text>
  <text x="70" y="596" class="body">铁律: 同款同色加购 &gt;=2 个相邻尺码必弹 AI 锁码与换码免邮保单!</text>

  <!-- Center Card: 4-Stage AI Sizing & Anti-Bracketing Architecture -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶 AI 尺码图谱与防多码同拍托管架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#ef4444" />
  <text x="450" y="175" class="card-title" fill="#fca5a5">Gate 1: 购物车“多尺码连拍 (Bracketing)”实时拦截 (HTTP 403)</text>
  <text x="450" y="195" class="body">• 检测购物车内 `Same_Style_Color` 出现 `S + M` 或 `41 + 42 + 43` 相邻尺码</text>
  <text x="450" y="213" class="body">• 立即拦截盲目多拍: 唤醒跨品牌尺码匹配助手 + 承诺“只买 1 件若不合身</text>
  <text x="450" y="231" class="mono">  享免费顺丰上门极速换码”，坚持买多码收 $6/件整理费 -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="282" class="card-title" fill="#38bdf8">Gate 2: CAD 制版平铺参数与退货反馈自愈闭环 (HTTP 422)</text>
  <text x="450" y="302" class="body">• 拒绝通用尺码表! 强制绑定每个 SKU 的 `Tech Pack 实测胸围/衣长/弹力率`</text>
  <text x="450" y="320" class="body">• 实时监听售后退货原因: 若某款连衣裙“选 M 码因偏小退货率 &gt; 22%”:</text>
  <text x="450" y="338" class="body">  系统自动将该 SKU 推荐引擎向大一码偏移 0.8 码并标黄提示“版型偏小”!</text>
  <text x="450" y="354" class="mono">• 缺失实测制版表或偏码爆雷款未自动修正推荐 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: 3D 物理衣长锚定与 BIPA 身材照片零留存 (HTTP 451)</text>
  <text x="450" y="419" class="body">• 虚拟试穿 (VTO) 必须基于 CLO3D 物理打版锚定真实下摆/袖长位置</text>
  <text x="450" y="437" class="body">• 用户上传的全身照在提取骨骼关键点后 `5 秒内内存销毁` (Zero-Retention)</text>
  <text x="450" y="455" class="mono">• 纯 2D 美化误导衣长或违规落盘存储用户全身照 -&gt; HTTP 451</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#10b981" />
  <text x="450" y="508" class="card-title" fill="#6ee7b7">Gate 4: 跨品牌合身图谱 (“你穿 Nike 42 = 本店 41.5”) (HTTP 409)</text>
  <text x="450" y="528" class="body">• 消费者根本记不住自己胸围多少厘米，但 100% 记得自己常穿什么牌子!</text>
  <text x="450" y="546" class="body">• 通过 True Fit 亿级跨品牌保留图谱: 输入“常穿 Zara M 码合身”即秒推</text>
  <text x="450" y="566" class="mono">• 将“买 3 件试穿退 2 件”收敛为“精准买 1 件留 1 件 + 免邮秒换”</text>
  <text x="450" y="586" class="mono">• 砍掉 55% 试码多拍退货与熨烫翻新成本 -&gt; 净省 39% 逆向损耗</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大 AI 尺码与虚拟试穿技术栈</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. True Fit (Fashion Genome 跨品牌图谱)</text>
  <text x="846" y="182" class="body">• 优势: 连接全球上万服饰品牌的真实“购买且未退货”尺码交叉数据库</text>
  <text x="846" y="198" class="body">• 特性: 无需拿软尺量身体，用已知合身品牌直接映射目标款尺码</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. Bold Metrics (AI Body Digital Twin)</text>
  <text x="846" y="244" class="body">• 优势: 仅凭身高、体重、年龄、鞋码 4 个简单问题反推 50+ 项人体</text>
  <text x="846" y="260" class="body">  三维围度，与服装 PLM CAD 制版表的每个部位(肩/胸/腰/臀)逐项比对</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. Google Virtual Try-On / Zeekit (Walmart)</text>
  <text x="846" y="306" class="body">• 优势: 支持在 2XL 至 XXS 不同真实体型模特身上展示真实垂坠褶皱</text>
  <text x="846" y="322" class="body">• 特性: 杜绝“S 码白幼瘦模特图误导大码买家”引发的版型落差退货</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. Loop Returns Instant Exchange (免垫资秒换码)</text>
  <text x="846" y="368" class="body">• 经验: 用“买 1 件若不合身，快递揽收瞬间即刻发出新尺码”彻底替代</text>
  <text x="846" y="384" class="body">  “结账时一口气买 3 个尺码回家试穿”的恶劣习惯</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度服装尺码不合与买3退2损耗池 ($140,000)</text>
  <text x="860" y="456" class="body">• 传统买3退2占库+运费熨烫亏损+偏码爆雷: $140,000/季</text>
  <text x="860" y="476" class="mono">• 拦截多码同拍 (Bracketing) 转单件免邮秒换: -$26,600</text>
  <text x="860" y="496" class="mono">• 跨品牌合身图谱 + CAD 实测版型精准锁码: -$16,800</text>
  <text x="860" y="516" class="mono">• 退货原因偏大/偏小实时回流自动纠偏算法: -$11,200</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净尺码退货损耗: $85,400 (净省 $54,600 / -39%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: apparel_ai_sizing_escrow_optim_409</text>
</svg>

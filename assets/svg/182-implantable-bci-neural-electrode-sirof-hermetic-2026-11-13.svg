  <text x="54" y="584" class="body">• 必须将 PBS 1kHz 阻抗 (&lt;=50kΩ)、水窗口 CIC (&gt;=3.0mC/cm2)、a-SiC 老化零脱层与 10^-11 气密绑定为智能托管谓词。</text>

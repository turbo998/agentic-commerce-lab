<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg94" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051324"/>
      <stop offset="50%" stop-color="#0a2544"/>
      <stop offset="100%" stop-color="#113866"/>
    </linearGradient>
    <linearGradient id="accent94" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg94)"/>
  <rect x="30" y="25" width="1140" height="580" rx="18" fill="#081a30" stroke="#0ea5e9" stroke-width="2" opacity="0.95"/>
  <rect x="30" y="25" width="1140" height="6" fill="url(#accent94)"/>

  <text x="60" y="72" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">ROUND 92 · PELAGIC TUNA/SEAFOOD, VMS/EM ANTI-IUU, HISTAMINE (&lt;=30 PPM) &amp; -60C MANDATE</text>
  <text x="60" y="108" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">远洋金枪鱼/海产品捕捞交割、VMS/电子观察员防非法捕捞与组胺/-60°C 托管 vs 日志盲付</text>
  <text x="60" y="136" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Continuous VMS/AIS + Deck EM Camera + Histamine (&lt;=30 ppm) &amp; Zero-CO Gas + -60C Core Pull-Down vs. IUU/Spoilage</text>

  <!-- Left Card -->
  <rect x="60" y="160" width="525" height="335" rx="12" fill="#25121d" stroke="#ef4444" stroke-width="1.8"/>
  <text x="85" y="196" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ 传统凭船长手写捕捞日志 (Logbook) 盲付模式</text>
  <text x="85" y="230" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 关掉 AIS 进保护区非法偷捕 (IUU)：伪造公海经纬度日志，到港被欧盟/美国 NOAA 整柜查扣销毁</text>
  <text x="85" y="260" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 慢速盐水冻结致组胺中毒 (Scombroid)：甲板暴晒或冷舱降温慢使组胺突破 200 ppm 引发食物中毒</text>
  <text x="85" y="290" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 一氧化碳 (CO) 毒气熏鱼染红造假：将腐败发褐的劣质金枪鱼用 CO 熏成鲜艳樱桃红冒充刺身级</text>
  <text x="85" y="320" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 公海非法冷蔵运输船转运洗白：将受制裁或血汗渔船的违规渔获混入合规母船舱内无法溯源</text>
  <rect x="85" y="350" width="475" height="120" rx="8" fill="#35101d" stroke="#f87171" stroke-width="1"/>
  <text x="105" y="382" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">典型跨国生鲜连锁 / 金枪鱼罐头巨头远洋渔获采购资损案例：</text>
  <text x="105" y="410" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">水产采购 Agent 预付 $215,000 采购超低温大目金枪鱼，因渔船在禁渔期违规投放集鱼器</text>
  <text x="105" y="434" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">(FAD) 被卫星抓拍且部分鱼体经 CO 气体护色掩盖高组胺，遭海关扣押并触发全渠道下架召回</text>
  <text x="105" y="456" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• IUU 偷捕拦截：0% | • CO 染色假刺身拦截：0% | • 查扣与召回损失：超 $500,000</text>

  <!-- Right Card -->
  <rect x="615" y="160" width="525" height="335" rx="12" fill="#0a2426" stroke="#22c55e" stroke-width="1.8"/>
  <text x="640" y="196" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">✅ VMS+甲板电子观察员 + 组胺/零CO门禁 + 超低温托管</text>
  <text x="640" y="230" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 卫星船位 (VMS/AIS) 零断点 + 甲板绞纲机电子观察员 (EM)：铁证核验捕捞网次经纬度与零兼捕</text>
  <text x="640" y="260" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• -60°C 超低温冷舱核心温降、组胺 (&lt;=30 ppm) 与零 CO 气体染色门禁：杜绝组胺中毒与化学护色</text>
  <text x="640" y="290" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• RFMO (WCPFC/IATTC) 白名单与 MSC 产销监管链核验：Web IQ 核查欧盟 IUU 捕捞证与 NOAA SIMP</text>
  <text x="640" y="320" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 母港直卸 -60°C 超低温集装箱替代公海冷藏运输船转运套利：砍掉公海过驳费立省 $31,000</text>
  <rect x="640" y="350" width="475" height="120" rx="8" fill="#062e29" stroke="#4ade80" stroke-width="1"/>
  <text x="660" y="382" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">端到端工程与财务收益（Measured / Deterministic）：</text>
  <text x="660" y="410" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">11ms 硬阻断 AIS 异常关机偷捕 (IUU) 或禁渔期违规使用集鱼器 (FAD) 的黑名单渔获；14ms 拦截</text>
  <text x="660" y="434" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">组胺 &gt;30ppm 或一氧化碳 CO 熏鱼造假；Web IQ 直卸 -60°C 超低温冷柜方案立省 $31,000（净付 $184k）</text>
  <text x="660" y="456" fill="#4ade80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 非法捕捞与扣关风险：0% | • 组胺与 CO 染色拦截：100% | • 验真耗时：&lt; 25ms</text>

  <!-- Bottom Bar -->
  <rect x="60" y="512" width="1080" height="72" rx="10" fill="#0d233d" stroke="#475569" stroke-width="1"/>
  <text x="85" y="541" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">架构师核心选型法则：</text>
  <text x="235" y="541" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14">远洋水产采购 Agent 绝不能信手写捕捞日志与肉眼红度！必须绑定【VMS+EM 影像 + 组胺/零CO + -60°C 遥测】。</text>
  <text x="85" y="567" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Provenance: Deterministic Policy Evaluator (`evaluate_pelagic_seafood_tuna_policy`) · GDST 1.2 / NOAA SIMP &amp; FDA HACCP · 2026-11-11</text>
</svg>

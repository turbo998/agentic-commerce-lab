  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#amber220)"/>
  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 218 · SURGE &amp; ANTI-GOUGING</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体动态溢价 (Surge Pricing) 与紧急状态反哄抬物价 (≤10% Cap) 架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">FEMA/州长紧急令 ≤1.10x 硬熔断 + 30天基准锚定 + 300s 报价锁令牌 (`agentic_surge_pricing_emergency_gouging_cap_mandate_...`) vs 灾难 5x 溢价重罚</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red220)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：暴风雪/山火逃生期间算法盲飙 5.0x 溢价 + 点支付瞬间暗涨跳价</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 算法分不清“演唱会散场”与“飓风/山火疏散”，触发 5.0x 灾难溢价：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 州长宣布紧急状态 (State of Emergency) 后，加州 §396 / 纽约 §396-r 严禁涨超 10%；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 裸奔 RL 算法自动涨价 4.5x，遭州司法部长按 $10,000–$25,000/单顶格重罚！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 报价页显示 $24，点击“确认支付”瞬间后台重算扣走 $49：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 无签名报价锁 (Price-Lock TTL)，触犯 FTC 诱饵欺诈并引发 Visa 12.5 拒付。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 灾后 30/180 天重建限价期内违规提前恢复高倍溢价：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 未同步州长紧急行政令延期公报，在法定保护期内提前解禁动态加价被立案。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms Emergency &gt;1.10x Gouging) | HTTP 422 (14ms Price Jump)</text>


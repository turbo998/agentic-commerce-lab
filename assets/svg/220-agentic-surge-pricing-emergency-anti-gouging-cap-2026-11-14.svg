  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#amber220)"/>
  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：FEMA 紧急令 ≤1.10x 物理钳位 + 30天基准锁 + 300s 报价锁网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. FEMA / 州长紧急令地理围栏 ≤1.10x 物理钳位 + 运力补贴解耦：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 命中紧急状态 H3 网格时，11ms 强制将乘客端价格锁在 ≤1.10x (对比前30天基准)；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 平台自动降为 0% 抽成并由企业应急基金直接补贴骑手/司机恶劣天气奖励！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. HMAC 签名 Price-Lock Quote 令牌 (TTL = 300s 所见即所扣)：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 锁死 5 分钟内结账全包总价，14ms 阻断任何点支付瞬间的后台暗涨跳价。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 紧急令巡检与免罚增收：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 100% 免疫州检察长反哄抬重罚并挽回跳价弃单，单批立省/保全 $38,400.00！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>

  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 系统见“已发货”即允许 T+1 全额提现，老板拿钱跑路</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 买家集体发起信用卡拒付，由平台自掏 $30万 全额垫付!</text>


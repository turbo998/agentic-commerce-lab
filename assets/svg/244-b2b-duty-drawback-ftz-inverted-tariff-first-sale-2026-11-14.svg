  <text x="684" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• /v3/browse 280ms 核验 CBP CROSS 8 位 HTS 替代判例、5 年 TFTEA 追溯期与禁退规则。</text>
  <text x="684" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 严格执行 USMCA Art. 2.5 加墨复出口孰低扣减，违规交易立即挂起 (HTTP 451)！</text>

  <rect x="668" y="446" width="564" height="68" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>

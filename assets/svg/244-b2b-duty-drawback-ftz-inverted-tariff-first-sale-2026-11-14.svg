  <text x="684" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 将整周多票到港合并为单次 FTZ Weekly Entry (MPF 封顶 $614.35/周) 并直连 ACE 退回 99% 关税。</text>
  <text x="684" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FDE68A">• 在 $790,000.00 跨境关税批次上立省/追回 $63,200.00 (净结算 $726,800.00 · HTTP 409 Confirm)！</text>


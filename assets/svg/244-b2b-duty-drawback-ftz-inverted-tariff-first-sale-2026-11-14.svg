  <text x="168" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#E0F2FE" text-anchor="middle">2026-11-14 · ROUND 242 · DUTY DRAWBACK &amp; FTZ</text>
  <text x="306" y="57" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">B2B 跨境退税 (Duty Drawback)、FTZ 倒挂关税与 First-Sale 首层出厂价清算架构</text>
  <text x="46" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#CBD5E1">19 U.S.C. § 1313 TFTEA 99% Drawback, FTZ Inverted-Tariff &amp; Nissho Iwai First-Sale vs. 300% § 1593a Fines &amp; Middleman Duty Overpayment</text>
  <text x="46" y="106" font-family="Consolas, monospace" font-size="12" fill="#7DD3FC">Mandate Token: b2b_duty_drawback_ftz_inverted_tariff_first_sale_mandate_2026_11_14 · Batch: $790,000.00 · Net Optimized: $726,800.00 (-$63,200.00)</text>

  <!-- Left Column: Legacy Customs & Drawback Traps -->
  <rect x="28" y="132" width="596" height="398" rx="14" fill="url(#red-card)" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5">❌ 传统“按贸易商发票直报 + 无序申领退税”（四大关税流失与重罚陷阱）</text>
  <text x="50" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#FECACA">Why Unlinked Drawback Claims &amp; Middleman-Invoice Declarations Trigger 3x Fines &amp; 35% Over-Taxation</text>

  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. 上下游对同一张 CBP 7501 报关单重复申领退税遭 300% 欺诈重罚</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 进口商与出口集成商未锁定退税权唯一转让证书 (CD)，各自拿同一批进口行项向 CBP 申退 99%。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 触发 19 U.S.C. § 1593a 双重申领红线，最高面临退税额 3 倍 (300%) 的法定欺诈罚款！</text>

  <rect x="48" y="282" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">2. 忽略首次销售原则 (First-Sale Rule) 按中间商加价 35% 多交冤枉税</text>
  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 代工厂 $65 卖给香港贸易商、贸易商 $100 卖给美国进口商；AI 直接按 $100 商业发票报关。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 白白为中间商的 35% 贸易毛利缴纳高额从价关税，且在 FTZ 保税区内选反 NPF/PF 倒挂税率！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 违反 USMCA 第 2.5 条北美转口“孰低规则”或踩中 "Other" 兜底税号</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 复出口至加拿大/墨西哥时未按 USMCA Art. 2.5 扣除加墨减免税额，违规申领全额 99% 退税。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 混用带 "Other" 兜底描述的 8 位 HTS 税号或超 5 年 TFTEA 死线，遭 CBP 事后稽查连本带利追缴！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">4. 每日零散货柜逐票缴纳 $614.35 MPF 海关处理费且退税过期作废</text>
  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 未启用 FTZ 每周合并报关 (Weekly Entry)，每周 40 票货柜重复交 40 次 MPF 处理费。</text>
  <text x="64" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 传统人工对账缓慢，外部退税中介抽走 15%-20% 高额佣金。</text>


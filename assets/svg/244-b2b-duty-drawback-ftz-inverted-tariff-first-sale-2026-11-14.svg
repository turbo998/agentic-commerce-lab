  <text x="684" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 强制绑定进口 Entry Line、出口 AES ITN 离境回执与上下游《退税权独占转让证书》。</text>
  <text x="684" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 任何一单两退、超额扣减或缺失出口实绩的申领，11ms 硬拦截 (HTTP 403)！</text>

  <rect x="668" y="282" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>

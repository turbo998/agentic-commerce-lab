  <text x="684" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 自动穿透锁定代工厂一手出厂价 (-30% 完税基数)，剥离贸易中间商加价水分。</text>
  <text x="684" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 入区自动对比零件与成品税率动态锁定 NPF/PF 状态，14ms 阻断多交冤枉税 (HTTP 422)！</text>

  <rect x="668" y="364" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>

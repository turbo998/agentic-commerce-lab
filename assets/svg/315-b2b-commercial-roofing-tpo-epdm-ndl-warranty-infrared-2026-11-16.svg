  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 隐瞒屋顶在 20 年 NDL 免费保修期内重复收费并弄废保修 (NDL Void Trap)</text>

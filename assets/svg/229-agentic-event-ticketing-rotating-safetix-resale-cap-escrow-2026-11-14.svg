  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 227 · EVENT TICKETING</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体演出与体育赛事票务 15s 动态旋转码、转售溢价封顶与开演托管架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">内核级旧码作废重签发 + FTC 全包价 + 开演后 T+24h 托管令牌 (`agentic_event_ticketing_rotating_qr_resale_cap_escrow_mandate_...`)</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red229)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：静态 PDF 截图一票十卖 + 黄牛 500% 溢价 + 演出取消跑路穿仓</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 静态 PDF / 二维码截图“一票十卖”与抢票外挂 (BOTS Act)：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 骗子把同一张 PDF 门票同时卖给 10 个粉丝，9 人在场馆闸机口被拒入引发 100% 拒付；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 为机房抢票外挂提供销赃通道违反美国联邦 BOTS Act (15 U.S.C. § 45c) 遭重罚！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 黄牛加价 400% 倒卖 + 演出开场前提前向卖家/主办方放款：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 一旦演唱会因故取消，早已提现的卖家跑路失联，票务平台被迫独自垫资赔付全额拒付。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 搜索页标 $100 结账末页暗加 $38 服务费违反 FTC 反垃圾费铁律：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反 FTC 16 CFR Part 464 与纽约 ACAL § 25.07 首屏全包价强制令，面临巨额罚单。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms PDF/Bot Fraud) | HTTP 422 (14ms Scalper Cap/Escrow)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#pnk229)"/>
  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：15s TOTP 动态码换绑 + ≤1.10x 限溢价 + 开演后 T+24h 托管网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 15s RFC 6238 TOTP 动态旋转码 + 内核级“作废旧码、重签新码”：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 硬拦截静态 PDF/截图交割；转售瞬间在票务主账本原子销毁原卖家条码种子，</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 为新买家手机安全芯片签发全新 Ticket_UUID，实现 0.0% 体育馆闸机撞票拒入！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 原价转售池硬锁 ≤ 1.10x 票面上限 + 开演后 T+24h 专户托管：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 票款 100% 冻结至演出顺利开场满 24h 后方才解冻；若演出取消则 10ms 自动原路退现。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms FTC 全包价核验与防损增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 严守首屏全包价披露并消除假票拒付罚金与黄牛加价，单批立省 $36,000.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $450k SafeTix/Escrow) | HTTP 409 ($36.0k Fraud/Cap Saved)</text>


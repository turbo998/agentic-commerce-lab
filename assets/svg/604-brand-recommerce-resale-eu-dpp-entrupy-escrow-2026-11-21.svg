  <rect width="1200" height="675" fill="url(#bg604)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent604)" rx="3" />

  <text x="40" y="58" class="title">品牌官方二手转售 (Trove / Archive)、欧盟数字产品护照 (EU DPP) 与显微鉴定托管架构 (Entrupy)</text>
  <text x="40" y="80" class="subtitle">Round 161 · 防高仿A货骗取官方以旧换新补贴、防穿烂旧衣虚报“99新” &amp; NFC 数字护照一键转售净省 36% (SVG 604)</text>

  <!-- Left Card: 3 Brand Recommerce & DPP Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大品牌二手回收与护照黑洞</text>
  <text x="56" y="164" class="card-title">1. 拿高仿 A 货寄回官方二手仓骗补贴 (HTTP 403)</text>
  <text x="56" y="184" class="body">• 买家曾在专柜买过 1 件正品冲锋衣，随后在广州买 3 件高仿假货</text>
  <text x="56" y="202" class="body">• 凭当年的正品订单记录申请官方“以旧换新返 $150 储值卡”</text>
  <text x="56" y="220" class="warn">• 若未核对洗标加密 NFC/DPP 芯片，官方二手区竟上架假货身败名裂!</text>

  <text x="56" y="256" class="card-title">2. 穿烂起球旧衣谎报“全新仅试穿” (HTTP 422)</text>
  <text x="56" y="276" class="body">• 线上回收问卷自填“Condition: Like New (返 $80)”秒发礼金券</text>
  <text x="56" y="294" class="body">• 仓库开箱却发现领口发黄、袖口破洞且水洗标已被剪掉 (不可二次销售)</text>
  <text x="56" y="312" class="warn">• 礼金券早已被花光，残次旧衣只能花钱销毁 + 倒贴 $12 邮费!</text>

  <text x="56" y="348" class="card-title">3. 缺失欧盟 ESPR 数字产品护照遭禁止清关 (HTTP 451)</text>
  <text x="56" y="368" class="body">• 欧盟《可持续产品生态设计法规》(ESPR 2024/1781) 强制纺织品/电池</text>
  <text x="56" y="386" class="body">  及时尚品具备扫码可读的 `Digital Product Passport (DPP)`</text>
  <text x="56" y="404" class="warn">• 缺失纤维溯源、可修复性评分或把召回瑕疵批次流入二手市场违法!</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: COUNTERFEIT_ENTRUPY_OR_DPP_CHIP_MISMATCH</text>
  <text x="70" y="502" class="warn">• HTTP 422: CUT_CARE_LABEL_OR_SEVERE_WEAR_GRADE_DROP</text>
  <text x="70" y="524" class="warn">• HTTP 451: MISSING_EU_ESPR_DPP_OR_RECALLED_BATCH</text>
  <text x="70" y="546" class="mono">• HTTP 409:ONE_TAP_DPP_RESALE_STORE_CREDIT_BONUS_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: AURA_DPP_AND_GRADE_A_RECOMMERCE_200</text>
  <text x="70" y="596" class="body">铁律: 剪掉成分洗标 (Care Label) 的旧衣严禁进入二次销售流!</text>

  <!-- Center Card: 4-Stage Brand Recommerce & EU DPP Escrow -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <text x="441" y="134" class="badge">四阶品牌二手回收、数字护照与鉴定架构</text>
  <rect x="431" y="118" width="206" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶品牌二手回收、数字护照与鉴定架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#ef4444" />
  <text x="450" y="175" class="card-title" fill="#fca5a5">Gate 1: NFC/QR 数字护照签名与 Entrupy 显微验真 (HTTP 403)</text>
  <text x="450" y="195" class="body">• 手机轻触衣服洗标内置 `NTAG 424 DNA NFC` 或扫唯一 GS1 Digital Link</text>
  <text x="450" y="213" class="body">• 高奢包袋通过 Entrupy 400倍显微皮纹比对 + Aura 联盟链所有权核验</text>
  <text x="450" y="231" class="mono">• 芯片克隆伪造、无正品链上铸造记录或显微皮纹不符 -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="282" class="card-title" fill="#38bdf8">Gate 2: 洗标完整性视觉预审与入库定级后放款 (HTTP 422)</text>
  <text x="450" y="302" class="body">• 生成寄回面单前，强制上传 3 张实拍图: (1) 完整未剪断的成分洗标</text>
  <text x="450" y="320" class="body">  (联邦 FTC Care Labeling Rule 强制二手转售必须带成分标!)；(2) 领口袖口</text>
  <text x="450" y="338" class="body">• 回收款处于托管态，待 Trove 仓入库臭氧消毒定级 A/B 后秒发储值卡</text>
  <text x="450" y="354" class="mono">• 剪标、破洞霉斑或企图未入库验货直接套取高档补贴 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: 欧盟 ESPR 数字产品护照 (DPP) 合规门禁 (HTTP 451)</text>
  <text x="450" y="419" class="body">• 校验 JSON-LD 格式 `EU Digital Product Passport`: 必填再生材料占比、</text>
  <text x="450" y="437" class="body">  碳足迹、洗护维修指南与历次转售保养记录</text>
  <text x="450" y="455" class="mono">• 缺失欧盟 ESPR 必填字段或属安全召回批次严禁上架 -&gt; HTTP 451</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#10b981" />
  <text x="450" y="508" class="card-title" fill="#6ee7b7">Gate 4: 数字衣橱“一键挂牌 + 120% 储值换新”飞轮 (HTTP 409)</text>
  <text x="450" y="528" class="body">• 买家无需自己拍照写文案! 打开品牌 App “我的数字衣橱”，点击 2 年前</text>
  <text x="450" y="546" class="body">  买的羽绒服 -&gt; 自动调取当年官方高清官图、尺码表与原价一键上架!</text>
  <text x="450" y="566" class="mono">• 选“拿现金 ($70)” vs “拿品牌新品储值卡 ($100 [+43% Bonus])”</text>
  <text x="450" y="586" class="mono">• 收回闲鱼/Vinted 二手利润 + 锁死正价复购 -&gt; 净省 36% 获客与回收成本</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大品牌官方转售与 DPP 底座</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Trove / Archive (品牌官方 Recommerce 引擎)</text>
  <text x="846" y="182" class="body">• 客户: Lululemon Like New、Patagonia Worn Wear、Arc'teryx ReBIRD</text>
  <text x="846" y="198" class="body">• 优势: 单件唯一定价入库、臭氧翻新与品牌官网无缝同域嵌入</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. Aura Blockchain Consortium / Eon Product Cloud</text>
  <text x="846" y="244" class="body">• 客户: LVMH、Prada、Cartier、Chloé 全球奢侈品数字护照联盟</text>
  <text x="846" y="260" class="body">• 特性: 出厂缝入加密 NFC 芯片，符合欧盟 ESPR DPP 标准并记录历任物权</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. Entrupy / Osura (AI 显微真伪鉴定硬件)</text>
  <text x="846" y="306" class="body">• 优势: 光学显微镜拍摄皮革纹理/金属刻字微米级特征，99.1% 准确率</text>
  <text x="846" y="322" class="body">• 特性: 附带金融级真品赔付担保 (Financial Authenticity Guarantee)</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. GS1 Digital Link (二维码统一数据载体)</text>
  <text x="846" y="368" class="body">• 优势: 一个二维码同时兼容商场 POS 收银扫码与消费者手机扫出</text>
  <text x="846" y="384" class="body">  碳足迹护照、真伪查询及“一键转卖换取品牌购物金”入口</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度二手假货调包、残次回收与获客池 ($110,000)</text>
  <text x="860" y="456" class="body">• 传统收到假货/剪标破衣+二手流量外流闲鱼: $110,000/季</text>
  <text x="860" y="476" class="mono">• NFC/DPP 芯片验签与 Entrupy 杜绝假货骗回收: -$19,800</text>
  <text x="860" y="496" class="mono">• 寄前洗标/磨损视觉预审砍掉废衣逆向运费: -$11,000</text>
  <text x="860" y="516" class="mono">• 数字衣橱一键挂牌+储值卡奖励拉动新品复购: -$8,800</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净循环商业成本: $70,400 (净省 $39,600 / -36%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: brand_recommerce_dpp_optim_409</text>
</svg>

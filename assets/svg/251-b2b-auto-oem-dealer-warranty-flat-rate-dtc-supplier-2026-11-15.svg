  <rect x="28" y="22" width="1224" height="94" rx="14" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="46" y="38" width="248" height="26" rx="13" fill="#881337" stroke="#F43F5E" stroke-width="1"/>
  <text x="170" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFE4E6" text-anchor="middle">2026-11-15 · ROUND 249 · AUTO OEM WARRANTY</text>
  <text x="310" y="57" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">B2B 主机厂与经销商售后保修 (OEM Warranty)：UDS 冻结帧验真、重叠工时去重与供应商追偿架构</text>
  <text x="46" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#CBD5E1">ISO 14229 UDS 0x19/0x22 Telemetry Gate, Overlapping Labor DAG &amp; Tier-1 Recovery vs. Parts-Washing &amp; 50% NTF Swaps</text>
  <text x="46" y="106" font-family="Consolas, monospace" font-size="12" fill="#FDA4AF">Mandate Token: b2b_auto_oem_dealer_warranty_flat_rate_dtc_supplier_recovery_mandate_2026_11_15 · Batch: $610,000.00 · Net OEM Outlay: $561,200.00 (-$48,800.00)</text>

  <!-- Left Column: Legacy OEM Warranty Traps -->
  <rect x="28" y="132" width="596" height="398" rx="14" fill="url(#red-card)" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5">❌ 传统“凭文字工单盲赔 + 跳过 TSB 换硬件”（四大售后保修黑洞）</text>
  <text x="50" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#FECACA">Why Text-Only RO Approvals &amp; Unchecked Flat-Rate Codes Trigger 15%+ Warranty Leakage</text>

  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. 4S 店“幽灵换件/洗件套现 (Parts-Washing)”骗取 $4,000 原厂配件</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 利用正常保养车辆的 VIN 码编造故障描述，向主机厂索赔全新激光雷达、逆变器或空气悬架。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 未校验 UDS 0x19 原始冻结帧与 0x22 新件上车序列号，新配件根本没装车就被倒卖至汽配黑市！</text>

  <rect x="48" y="282" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">2. 共享拆装路径违规叠加两个独立主作业工时 (Overlapping Labor)</text>
  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 拆变速箱 (6.0h) 时顺手换曲轴后油封仅需 0.4h 附加码，工单却直接报 6.0h + 4.5h = 10.5h。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 把同一套拆装保险杠/抬总成的前置动作双倍计费，每单虚增 $400–$800 保修工时费！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 无视 TSB 软件升级指令直接换 $3,500 电脑板 (50% 退回件实测无故障 NTF)</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 原厂技术通报 (TSB) 已明确该故障码只需 0.3h 刷写固件即可解决，但技师为赚备件提成直接换总成。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 寄回原厂 WPRC 的旧件高达 50% 检测完全正常 (No Trouble Found)，造成巨额硬件浪费！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">4. 主机厂单方面吞下保修亏损而漏向 Tier-1 零部件供应商追偿</text>
  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 财务赔付了 4S 店，却因缺失单车 UDS 故障铁证无法向上游一级供应商 (Tier-1) 发起质量索赔。</text>
  <text x="64" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 原本按《质量保证协议 (QAA)》应由供应商承担 70% 的批次缺陷全由主机厂买单。</text>

  <!-- Right Column: UDS 0x19/0x22 + Labor DAG + Tier-1 Recovery Architecture -->
  <rect x="648" y="132" width="604" height="398" rx="14" fill="url(#green-card)" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#6EE7B7">✅ UDS 0x19/0x22 验真 + 工时拓扑去重 + Tier-1 追偿 + Web IQ</text>
  <text x="670" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#A7F3D0">Cryptographic CAN-Bus Telemetry Gate, Add-On Labor DAG &amp; Automated Supplier Chargebacks</text>

  <rect x="668" y="200" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>
  <text x="684" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">1. UDS 0x19 故障冻结帧与 0x22 新件序列号上车回读双锁 (11ms → 403)</text>
  <text x="684" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 强制绑定本车 VIN 拆件前 UDS 0x19 故障冻结帧快照，以及换件后 0x22 读出的新备件硬件序列号。</text>
  <text x="684" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 任何无真实 DTC 冻结帧或新件未上车激活的“洗件骗保”，11ms 硬拦截 (HTTP 403)！</text>

  <rect x="668" y="282" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>
  <text x="684" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">2. 整车拆装拓扑树 (DAG) 重叠工时自动去重锁 (14ms → 422)</text>
  <text x="684" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 自动识别同单多项作业的公共前置拆装步骤，强制将从属作业降级为 0.4h 组合附加码 (Add-On Code)。</text>
  <text x="684" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 拦截共享拆装路径双倍报工时与超法定上限的备件加价，14ms 阻断注水账单 (HTTP 422)！</text>

  <rect x="668" y="364" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>
  <text x="684" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">3. Microsoft Web IQ 强锁 TSB 软件优先与 WPRC 旧件回收 (280ms → 451)</text>
  <text x="684" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• /v3/browse 280ms 核验 NHTSA/OEM 技术服务通报 (TSB)，要求先执行 0.3h 固件重刷方可申请换件。</text>
  <text x="684" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 强制核验高价值旧件已扫码退回 WPRC 检测中心，违规跳过刷机立即挂起 (HTTP 451)！</text>

  <rect x="668" y="446" width="564" height="68" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>
  <text x="684" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">4. Tier-1 供应商质量追偿分摊与防 NTF 误换立省 $48,800 (245ms → 409)</text>
  <text x="684" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 凭单车 UDS 故障铁证按 QAA 责任比例自动向上游 Tier-1 供应商扣款追偿并压降 NTF 误换率。</text>
  <text x="684" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FDE68A">• 在 $610,000.00 保修清算批次上单批追偿/立省 $48,800.00 (净支出 $561,200.00 · HTTP 409)！</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg273" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent273" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dangerGrad273" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad273" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg273)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="490" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="289" y="55" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">ROUND 271 · DEFENSE &amp; AEROSPACE DFARS/CMMC, DCAA &amp; SAE AS6171</text>
  <text x="44" y="96" fill="#f8fafc" font-size="22" font-weight="800">B2B 智能体国防与航空航天总包采购（DFARS/CMMC）、DCAA 工时审计与 AS6171 防伪清算架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">SPRS/CMMC 2.0 Level 2 认证锁 + DCAA 每日签名工时卡与 FAR 31.205 禁报费剥离 + SAE AS6171 X光/开盖防伪令牌 vs. CUI 泄密、跨合同串工时与打磨假芯片</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent273)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad273)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统航空防务分包结算的三大致命黑洞（触发三倍重罚 &amp; 假件上天）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. SPRS 积分造假与 CUI 涉密图纸违规外包（CMMC Breach · 403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 二级分包商未通过 CMMC 2.0 Level 2 C3PAO 认证 (无 MFA/FIPS 加密) 却在 SPRS 虚报满分</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 私自将战机/卫星 CUI 受控图纸转包给无资质小厂，触发司法部《虚假申报法》3倍惩罚性索赔</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 主承包商因未核验下级供应链网络安全合规，面临数千万美元连带重罚</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. 把亏损固定价项目工时串入 Cost-Plus &amp; 混入 FAR 31.205 禁报费（422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• 将正在亏损的一口价 (FFP) 商业项目工程师工时，偷偷记在实报实销的 Cost-Plus 合同名下</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• 在间接管理费池 (G&amp;A) 混入 FAR 31.205 明令禁报的高管头等舱、红酒宴请、游说与公关费</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 遭遇 DCAA 突击查岗 (Floorcheck) 与 FAR 42.709 双倍违规罚款追缴</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. 废旧主板拆下打磨重印 (Blacktopping) 冒充宇航级芯片（AS6171 · 451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• 停产军规芯片从非授权现货商采购：商贩把 $0.50 家用芯片 (0°C~70°C) 表面磨平涂黑漆</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 激光重刻军规批号 (-55°C~+125°C) 卖 $500/颗，仅附一张伪造纸质合格证 (CoC)</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 装上万米高空客机或低轨卫星后在 -55°C 极寒下当场死机，引发灾难性事故</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad273)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + CMMC/SPRS + DCAA/AS6171 四重门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · CAGE 级 CMMC 2.0 Level 2 证书与 SPRS 积分锁（拦截 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 在放行图纸与结算 WAWF 账单前，实时穿透联邦 SPRS 库核验分包商具备</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">C3PAO 签发的 NIST SP 800-171 (110分) 有效认证且零未授权 Tier-3 外包</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · DCAA 每日签名工时卡与 FAR 31.205 禁报科目剥离锁（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">强制校验每名工程师本人当日不可篡改工时签名，阻断 FFP 向 Cost-Plus 跨工单串账，</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">并 100% 自动过滤剔除酒水、游说、娱乐、罚款等全部 FAR 31.205 不可报销科目</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · OCM 原厂授权链与 SAE AS6171 X光/声扫/开盖防伪锁（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">强制核验航电 EEE 元器件具备原厂直供链，停产件必须附带 ISO 17025 实验室出具的</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">SAE AS6171 X-Ray 引线框比对、C-SAM 声扫与去封盖晶圆报告且零 GIDEP 报警</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 防务分包自动清算 &amp; FAR 31.205 剥离+费率纠偏双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">10ms 签发 b2b_defense_aerospace_dfars_... 令牌；剥离违规间接费立省 $69,600 转 409</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#38bdf8" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 合规防务分包清算</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">CMMC + DCAA + AS6171 ($870k)</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">WAWF Voucher Settled · 10ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · CMMC 缺失 / CUI 违规转包</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">SPRS 不达标防 FCA 三倍重罚</text>
  <text x="410" y="692" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">CMMC_SPRS_CUI_BLOCKED</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · 跨合同串工时/FAR 禁报费</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">FFP 串入 CPFF 或含酒水游说费</text>
  <text x="642" y="692" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">DCAA_FAR31205_VIOLATION</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · 打磨翻新假芯片/缺 AS6171</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">Blacktopping 假军规件或 GIDEP</text>
  <text x="874" y="692" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">COUNTERFEIT_AS6171_HOLD</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · 禁报费剥离+DCAA 调率</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">立省 $69.6k ($800.4k 净付)</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">FAR31205_DCAA_CONFIRM</text>
</svg>

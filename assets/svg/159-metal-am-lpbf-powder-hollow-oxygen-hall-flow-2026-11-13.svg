  <text x="36" y="60" class="title">Round 157 · 金属 3D 打印 (LPBF) 球形钛/高温合金粉、显微 CT 空心率与氧含量架构图</text>
  <text x="36" y="84" class="sub">Metal AM Spherical Ti64/IN718 Powder Offtake, Micro-CT Hollow (&lt;=0.5%), Oxygen (&lt;=1,200 ppm) &amp; Hall Flow (&lt;=28 s/50g)</text>

  <!-- Left Card: Failure Mode -->
  <rect x="36" y="104" width="355" height="390" rx="12" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="52" y="120" width="160" height="24" rx="12" fill="#fca5a5"/>
  <text x="64" y="136" class="pill-err">⛔ 传统按公斤重与目数盲付</text>
  <text x="52" y="166" class="card-h">三大火箭叶轮氩气孔炸裂、高氧脆断与卡刀灾难</text>

  <text x="52" y="196" class="body" fill="#fca5a5" font-weight="700">1. 空心粉 (4.8%) 包裹不溶氩气致 HIP 后复胀</text>
  <text x="52" y="216" class="body">气雾化液滴卷入氩气形成“空心汤圆”，氩在金属中</text>
  <text x="52" y="234" class="body">零溶解度，HIP 压扁后遇高温重新膨胀 (TIP)，</text>
  <text x="52" y="252" class="body">使火箭涡轮泵高周疲劳寿命暴跌 80% 试车炸裂！</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. 卫星粉粘连 (球形度0.81) 致铺粉刮刀拉沟</text>
  <text x="52" y="302" class="body">糖葫芦状卫星粉互相钩挂使霍尔流速卡死 (&gt;38s)，</text>
  <text x="52" y="320" class="body">粉床出现疏松条纹，打印件残留尖锐未熔合裂纹。</text>

  <text x="52" y="350" class="body" fill="#fca5a5" font-weight="700">3. 掺入回收高氧旧粉 (O2=2,450ppm) 与支撑贱卖</text>
  <text x="52" y="370" class="body">筛余旧粉间隙氧钉扎钛滑移系，抗拉虚高但延伸率</text>
  <text x="52" y="388" class="body">跌至 3% 一撞即断；28% 线切割支撑废件未再雾化。</text>

  <rect x="52" y="418" width="323" height="58" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="64" y="440" class="mono" fill="#f87171">Legacy: 5t Powder Weight + 15-53um Laser PSD</text>
  <text x="64" y="460" class="mono" fill="#fca5a5">Result: $440,000 exposed to TIP fatigue crack</text>


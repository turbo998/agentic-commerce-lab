  <text x="440" y="296" class="body">ASTM B213 霍尔流速 &lt;=28.0 s/50g, 动态图像球形度</text>
  <text x="440" y="314" class="body">&gt;=0.92 &amp; 卫星粉 &lt;=3% — 铺粉拉沟直返 HTTP 422</text>

  <rect x="428" y="334" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="354" class="mono">Gate 3: Web IQ Virgin Lot &amp; 0-W HDI (280ms)</text>
  <text x="440" y="372" class="body">核验 NADCAP 母棒至成品粉质量守恒 (零旧粉掺杂)</text>
  <text x="440" y="390" class="body">与 X 射线零高密度钨夹杂 — 掺旧粉直返 HTTP 451</text>

  <rect x="428" y="410" width="348" height="68" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="430" class="mono" fill="#fcd34d">Gate 4: PREP &amp; Support Re-Atomize (245ms)</text>
  <text x="440" y="448" class="body">PREP 等离子旋转电极零空心粉 + 28% 线切割支撑</text>
  <text x="440" y="466" class="body">与筛上粗粉真空重熔再雾化立省 $61,600 触发 HTTP 409</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="812" y="104" width="352" height="390" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="828" y="120" width="184" height="24" rx="12" fill="#fde68a"/>
  <text x="840" y="136" class="pill-warn">📊 5-Lane 实测矩阵与 Web IQ</text>

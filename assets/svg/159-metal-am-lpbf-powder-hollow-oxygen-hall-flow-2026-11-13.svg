  <text x="840" y="458" class="body">准确率 100% · P50 245ms · 抗注入 100% · 切片保密</text>

  <!-- Footer -->
  <rect x="36" y="512" width="1128" height="92" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="538" class="card-h" fill="#ec4899">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• 金属 3D 打印粉末严禁“仅看粒度分布与抗拉强度盲付”：内部氩气空心粉在 HIP 后会复胀炸裂，而掺入高氧旧粉会使抗拉虚高但一撞即断。</text>
  <text x="54" y="584" class="body">• 必须将 Micro-CT 空心率 (&lt;=0.5%)、氧含量 (&lt;=1,200ppm)、霍尔流速 (&lt;=28s) 与支撑废件重熔再雾化绑定为智能托管解锁谓词。</text>

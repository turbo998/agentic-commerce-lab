  <text x="828" y="332" class="mono" fill="#c084fc">⛔ HTTP 451 (280ms) · Web IQ 掺回收旧粉或钨异物</text>
  <text x="828" y="350" class="body">掺 25% 筛余旧粉或检出钨粒 → 熔断 $440,000.00</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bnplAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="banRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg5)" rx="16"/>

  <!-- Header -->
  <text x="40" y="46" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUND 5 ARCHITECTURE SELECTION GUIDE · 2026-11-08 · PROVENANCE: OFFICIAL_DOC_SNAPSHOT + SYNTHETIC_POLICY</text>
  <text x="40" y="80" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="25" font-weight="800">BNPL 先买后付智能体结账架构：受控 WebView 跳转接管 vs 全自动令牌代扣选型图谱</text>
  <text x="40" y="106" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="14">为什么 AI Agent 能全自动刷 Stripe SPT / Visa VIC，却绝对不能在后台用无头浏览器代签 Affirm / Klarna 分期信贷合同？</text>

  <!-- Left Column: Direct Autonomous Token Rail -->
  <rect x="40" y="130" width="355" height="390" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="40" y="130" width="355" height="44" rx="12" fill="url(#cardBlue)"/>
  <text x="60" y="158" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">轨道 A：全自动令牌直通 (SPT v2 / VIC)</text>

  <text x="60" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">法律与金融本质：既有授信额度内消费</text>
  <text x="60" y="224" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">• 不产生新信贷合同，复用发卡行既有持卡人协议</text>
  <text x="60" y="246" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">• 买家预先通过 FIDO2 Passkey 签发预算上限令牌</text>
  <text x="60" y="268" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">• Agent 后台直接提交 spt_v2_* 完成静默扣款</text>

  <rect x="60" y="290" width="315" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="314" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">payment_method: "spt_v2_card"</text>
  <text x="76" y="336" fill="#a7f3d0" font-family="Consolas, monospace" font-size="12">status: "succeeded" (Zero Redirect)</text>
  <text x="76" y="358" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">latency: 482 ms (offline sandbox)</text>
  <text x="76" y="376" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">[deterministic_offline_simulation]</text>

  <text x="60" y="415" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">最佳适用场景：</text>
  <text x="60" y="438" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13">• 全款借记卡/信用卡代购、周期订阅、B2B 绿区采购</text>
  <text x="60" y="460" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13">• 无需实时逐笔征信审批与分期年化利率 (APR) 披露</text>
  <text x="60" y="492" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">结论：支持 100% 后台静默结账 (Autonomous)</text>

  <!-- Center Column: Controlled WebView Handover for BNPL -->
  <rect x="422" y="130" width="355" height="390" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="422" y="130" width="355" height="44" rx="12" fill="url(#bnplAmber)"/>
  <text x="442" y="158" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">轨道 B：BNPL 受控 WebView 跳转接管</text>

  <text x="442" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">法律与金融本质：新发个人消费信贷合同</text>
  <text x="442" y="224" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">• 每笔 Affirm/Klarna 分期均触发实时软/硬征信评估</text>
  <text x="442" y="246" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">• 监管要求借款人本人亲自阅读 APR 与还款计划表</text>
  <text x="442" y="268" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">• Agent 准备购物车后必须挂起并移交受控系统浏览器</text>

  <rect x="442" y="290" width="315" height="95" rx="8" fill="#0f172a" stroke="#b45309"/>
  <text x="458" y="314" fill="#fbbf24" font-family="Consolas, monospace" font-size="12">status: "requires_action"</text>
  <text x="458" y="336" fill="#fde68a" font-family="Consolas, monospace" font-size="12">next_action: "redirect_to_url"</text>
  <text x="458" y="358" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">surface: "ASWebAuth / CustomTab"</text>
  <text x="458" y="376" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">[official_doc_snapshot + synthetic_policy]</text>

  <text x="442" y="415" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">三步混合接力机制 (Prepare → Handover → Resume)：</text>
  <text x="442" y="438" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13">1. Agent 用 Web IQ 核验 0% APR 资格与含息总价上限</text>
  <text x="442" y="460" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13">2. 唤起隔离 WebView 由买家本人完成征信授权与签字</text>
  <text x="442" y="492" fill="#fbbf24" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">结论：前置准备自动化 + 签署环节强制人类接管</text>

  <!-- Right Column: Prohibited Headless Agent BNPL Automation -->
  <rect x="805" y="130" width="355" height="390" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <rect x="805" y="130" width="355" height="44" rx="12" fill="url(#banRed)"/>
  <text x="825" y="158" fill="#ffffff" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">禁区 C：无头浏览器代签分期 (严禁)</text>

  <text x="825" y="200" fill="#fda4af" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">为什么绝对不能让 Agent 后台自动点“同意贷款”？</text>
  <text x="825" y="224" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">• 违反消费信贷真实披露原则 (TILA Reg Z / EU CCD2)</text>
  <text x="825" y="246" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">• 剥夺用户对隐性利息 (15%–36% APR) 的知情拒绝权</text>
  <text x="825" y="268" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">• 触发 BNPL 机构设备指纹反欺诈与贷款合同无效拒付</text>

  <rect x="825" y="290" width="315" height="95" rx="8" fill="#0f172a" stroke="#be123c"/>
  <text x="841" y="314" fill="#fb7185" font-family="Consolas, monospace" font-size="12">HTTP 403 Forbidden</text>
  <text x="841" y="336" fill="#fda4af" font-family="Consolas, monospace" font-size="12">error: "headless_bnpl_prohibited"</text>
  <text x="841" y="358" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">guard: "block_playwright_loan_sign"</text>
  <text x="841" y="376" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">[synthetic_policy + offline_verifier]</text>

  <text x="825" y="415" fill="#fda4af" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">网关硬拦截条件 (Synthetic Policy Guardrails)：</text>
  <text x="825" y="438" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13">• 检测到无头浏览器尝试自动提交 BNPL 征信表单</text>
  <text x="825" y="460" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13">• Web IQ 发现分期含息总价超出买家 Mandate 上限</text>
  <text x="825" y="492" fill="#f43f5e" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">结论：100% 硬阻断，绝不允许 AI 代签借贷契约</text>

  <!-- Bottom Flow Bar -->
  <rect x="40" y="542" width="1120" height="106" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="572" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700">架构师落地黄金铁律（Card Spending vs. Credit Origination Boundary）：</text>
  <text x="64" y="598" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">1. 花已有额度的钱（借记卡/信用卡）：走 Stripe SPT v2 或 Visa VIC，由 Agent 后台全自动完成，无需打断用户。</text>
  <text x="64" y="620" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="13">2. 借新债分期付款（Affirm / Klarna / Afterpay）：Agent 只负责用 Web IQ 算清含息总价并生成 redirect_to_url，必须弹受控系统 WebView 由人类亲自签字。</text>
  <text x="64" y="640" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance (as_of 2026-11-08): Stripe ACP redirect_to_url spec = official_doc_snapshot | APR &amp; Total-Cost guardrails = synthetic_policy | Live Klarna/Affirm API = not_measured</text>
</svg>

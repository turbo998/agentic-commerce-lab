  <rect width="1200" height="675" fill="url(#bg589)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent589)" rx="3" />

  <text x="40" y="58" class="title">电商优惠券互斥引擎与防“零元购/破价薅羊毛”熔断架构 (Talon.One / Voucherify / Shopify Functions)</text>
  <text x="40" y="80" class="subtitle">Round 146 · 防多券叠加把 $200 商品干成 $4 一夜被薅破产、防凑单分母退货白嫖神券 &amp; 个性化弹性券净增 36% 毛利 (SVG 589)</text>

  <!-- Left Card: 3 Promo & Coupon Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大优惠券破价与薅毛灾难</text>
  <text x="56" y="164" class="card-title">1. 多券连环叠加变“1元购”破产夜 (HTTP 403)</text>
  <text x="56" y="184" class="body">• 运营配置失误未设互斥：会员 8 折 + 黑五立减 $50 +</text>
  <text x="56" y="202" class="body">  客服补偿无门槛 $40 券同时生效，把 $100 商品算成 -$10!</text>
  <text x="56" y="220" class="warn">• 羊毛群脚本 15 分钟狂下 12 万单，一夜亏掉全年利润!</text>

  <text x="56" y="256" class="card-title">2. 静态口令码 (`VIP50`) 泄露全网疯传 (HTTP 422)</text>
  <text x="56" y="276" class="body">• 本来发给 50 名流失 VIP 的专属半价码写成静态 `VIP50`</text>
  <text x="56" y="294" class="body">• 3 分钟后被贴到小红书/Reddit/Honey 插件，2 万人涌入白嫖</text>
  <text x="56" y="312" class="warn">• 或用“满 $300 减 $60”凑单结账后秒退 $250 凑单品独享神券!</text>

  <text x="56" y="348" class="card-title">3. 生产环境遗留 `TEST99` 1分钱测试码 (HTTP 451)</text>
  <text x="56" y="368" class="body">• 研发在正式库创建 `TEST100 / QA_FREE` 免单码测试支付闭环</text>
  <text x="56" y="386" class="body">• 忘记删除或未绑定内部测试员白名单，被黑客字典爆破猜中</text>
  <text x="56" y="404" class="warn">• 叠加硬通货 (黄金/茅台/Apple/礼品卡) 未拉黑导致洗钱套现!</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: STACKED_DISCOUNT_BELOW_COGS_MARGIN_FLOOR</text>
  <text x="70" y="502" class="warn">• HTTP 422: LEAKED_STATIC_CODE_OR_FILLER_CANCEL_ABUSE</text>
  <text x="70" y="524" class="warn">• HTTP 451: VELOCITY_SPIKE_CIRCUIT_BREAKER_OR_GIFT_CARD</text>
  <text x="70" y="546" class="mono">• HTTP 409:PROPENSITY_MINIMUM_DISCOUNT_ELASTICITY_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: MUTEX_VERIFIED_PROFITABLE_PROMO_200</text>
  <text x="70" y="596" class="body">铁律: 任何促销叠加后实付价不得低于 `COGS 成本 × 85%`!</text>

  <!-- Center Card: 4-Stage Promo Circuit-Breaker Architecture -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶促销互斥矩阵与防破价熔断架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#ef4444" />
  <text x="450" y="175" class="card-title" fill="#fca5a5">Gate 1: 行项级成本底线硬锁 (Hard COGS Floor Gate)</text>
  <text x="450" y="195" class="body">• 收银台内核最后一道物理铁闸: 无论上游叠加了多少张券/积分，</text>
  <text x="450" y="213" class="body">  若 `Final_Unit_Paid &lt; SKU_Landed_COGS × 0.85` (非清仓款):</text>
  <text x="450" y="231" class="mono">• 立即拒绝生成支付单并冻结异常优惠码 -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="282" class="card-title" fill="#38bdf8">Gate 2: 唯一身份绑定单次码与凑单防拆退锁 (HTTP 422)</text>
  <text x="450" y="302" class="body">• 高額券 (如 &gt;20% Off) 强制生成绑定 `customer_id` 的单次加密串</text>
  <text x="450" y="320" class="body">  被转发到羊毛群或 Honey 插件由他人账号输入 100% 报错无效!</text>
  <text x="450" y="338" class="body">• 满 $300 减 $60 凑单锁: 发货前严禁单独取消其中 1 件凑单品</text>
  <text x="450" y="354" class="mono">• 企图跨账号盗用专属码或未发货秒退凑单分母 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: 活动预算池总阀门与硬通货黑名单 (HTTP 451)</text>
  <text x="450" y="419" class="body">• 每场促销活动强制设 `Max_Total_Burn_Budget = $10,000` 水位线</text>
  <text x="450" y="437" class="body">• 5 分钟核销速率超历史 10x (疑似进羊毛群) 毫秒级自动停券熔断</text>
  <text x="450" y="455" class="mono">• 礼品卡/金条/刚性控价品 (MAP) 硬编码排除在全场券外 -&gt; HTTP 451</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#10b981" />
  <text x="450" y="508" class="card-title" fill="#6ee7b7">Gate 4: 购买倾向弹性发券 (Uplift Modeling) (HTTP 409)</text>
  <text x="450" y="528" class="body">• 识别本来就要原价结账的“高意向自然客” -&gt; 0 发券保 100% 毛利</text>
  <text x="450" y="546" class="body">• 识别犹豫弃购客 -&gt; 精准测试 10% 折扣即可转化，绝不盲目给 25%</text>
  <text x="450" y="566" class="mono">• 差 $18 满减门槛时主动推荐高毛利自有品牌凑单品拉高客单价</text>
  <text x="450" y="586" class="mono">• 零破价事故 + 砍掉无效自然客补贴 -&gt; 净增 36% 促销 ROI</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大企业级促销规则引擎</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Talon.One / Voucherify</text>
  <text x="846" y="182" class="body">• 优势: 专为企业级促销设计，原生支持活动级总预算硬顶 (Budget Cap)</text>
  <text x="846" y="198" class="body">• 特性: 精细化互斥组 (Stacking Matrix) 与单次绑定码防泄露</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. Shopify Functions (Discount Allocator API)</text>
  <text x="846" y="244" class="body">• 优势: WebAssembly 编译运行在收银台底层，执行延迟 &lt;5ms</text>
  <text x="846" y="260" class="body">• 特性: 可直接读取 SKU 成本价 MetaField 实施硬性毛利底线保护</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. 京东/天猫“平行满减 vs 阶梯折上折”防护</text>
  <text x="846" y="306" class="body">• 经验: 改“折上折累乘”为“同一吊牌基准价平行扣减”</text>
  <text x="846" y="322" class="body">• 特性: 平台内置“价格笼子 (Price Cage)”跌破近30天最低价5折即锁死</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. Intellimize / Rokt 个性化补贴引擎</text>
  <text x="846" y="368" class="body">• 优势: 根据实时停留轨迹预测价格敏感度，用最小折扣博最大转化</text>
  <text x="846" y="384" class="body">• 特性: 彻底告别“全场粗暴派发无差别 8 折码”的毛利失血</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度促销补贴浪费与破价风险池 ($115,000)</text>
  <text x="860" y="456" class="body">• 传统多券误叠破价+静态码外泄+盲发券: $115,000/季</text>
  <text x="860" y="476" class="mono">• 价格笼子与 COGS 硬底线杜绝破价薅毛事故: -$19,550</text>
  <text x="860" y="496" class="mono">• 唯一身份单次码拦截 Honey/社交群泄露盗刷: -$12,650</text>
  <text x="860" y="516" class="mono">• 购买倾向弹性发券免除自然老客无效补贴: -$9,200</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净补贴成本: $73,600 (净省 $41,400 / -36%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: ecommerce_promo_stacking_optim_409</text>
</svg>

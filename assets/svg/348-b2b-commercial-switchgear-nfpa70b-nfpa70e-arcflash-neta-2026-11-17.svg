  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">商业配电房开关柜维保：&gt;=40% 带载开盖红外锁、DLRO 微欧锁 vs 隔铁皮门拍红外与 $2 假弧闪贴纸</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_commercial_switchgear_nfpa70b_thermography_nfpa70e_arcflash_neta_mandate_2026 · 15.0% Savings ($22,200 / Batch)</text>


  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 可见光裸排/红外窗双图配对锁 + &gt;=40% 额定电流门禁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">强制每张红外图配对可见光裸露铜排照片（或经晶体 IR Window 拍摄），并同步校验</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">智能电表实时负载率 &gt;= 40% (ANSI/NETA MTS)，11ms 硬拦截隔门拍铁皮与空载扫描。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. IEEE 1584 逐柜唯一弧闪表锁 + 100A DLRO 微欧免换开关锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">强制提交 ETAP/SKM 逐节点短路电流与入射能量 (cal/cm²) 源文件；主触头微欧接触</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">电阻达标时一律降级为 $180 脱扣器电池/线圈维护，14ms 封杀假贴纸与 $8,500 骗换机。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 NETA 资质与州 PE 工程师执照 (270ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">270ms 在线穿透核验国际电气测试协会 NETA Accredited Company 名录与签字人州级</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Professional Engineer (PE) 执业注册号，确保报告获商业财产险与 OSHA 100% 认可。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动将 $8,500 换主断路器降级为换 $180 脱扣附件并扣减假扫描 (235ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将微欧接触电阻正常的框架断路器降级为更换脱扣器电池/线圈并剔除假贴纸水分：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $148,000.00 → 自动核减 $22,200.00 (15.0%) → 净付 $125,800.00！</text>


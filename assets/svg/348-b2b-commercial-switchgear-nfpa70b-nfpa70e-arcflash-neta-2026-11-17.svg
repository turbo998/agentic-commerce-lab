  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业配电房预防性试验与弧闪贴标四大黑洞 (Legacy EPM Leakage: 35%–60%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 隔着关闭的铁皮配电箱门拍红外，或挑周日半夜 (&lt;10% 空载) 拍假满分报告</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">红外线根本穿不透 2mm 钢板柜门！外包工懒得拆内盖板对着铁皮门乱拍，或在夜间空载</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">无电流发热时扫描收 $12,000，漏检白天满载时飙到 180°C 的松动母排致配电房爆炸。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 买一卷 $2 通用“危险 40 cal/cm²”贴纸贴满全楼，冒充 $22,000 IEEE 1584 建模</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">未用 ETAP / SKM 软件核算供电局短路电流与断路器脱扣曲线，给 150 个配电柜全贴</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">一模一样的假警告贴纸骗走 $22,000，违反 NFPA 70E 130.5(H) 被 OSHA 与保险公司重罚。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. $180 电子脱扣器 (MicroLogic) 电池没电，被虚报为 $8,500 换 1600A 主断路器</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">框架断路器内部银钨合金主触头完好无损（微欧接触电阻仅 25 uOhm），维保商趁脱扣器</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">液晶屏报警或分励线圈老化，吓唬业主“总开关坏了会停电”强收 $8,500 换整机。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 检测队无 NETA 认证资质且弧闪报告无州 PE 电气工程师签章，遭保险拒保</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自 2023 年 NFPA 70B 升级为强制标准后，无 NETA 资质与无注册电气工程师 (PE)</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">签章的野鸡检测报告被 FM Global 等商业财产险直接判定无效并上浮保费 40%。</text>


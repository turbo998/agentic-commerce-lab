  <rect width="1200" height="675" fill="url(#bg451)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent451)"/>

  <!-- Header -->
  <text x="52" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · MULTI-UNIT FRANCHISE &amp; QSR SUPPLY CHAIN · AUTO-REPLENISHMENT, FEFO SHELF-LIFE &amp; ROYALTY SPLIT AGENT</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">万店连锁餐饮、茶饮咖啡与加盟供应链 (Franchise QSR &amp; Foodservice) 自动叫货与分账架构</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">POS 杯量消耗对比拦截私采假料 · 短保鲜奶/果浆 FEFO 效期上限锁 · POS 流水实时清分特许权使用费 · 立省 $85,800 (22.0%)</text>

  <!-- Left Column: Franchise QSR Pitfalls -->
  <rect x="48" y="132" width="352" height="390" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="162" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统连锁加盟店订货与总部抽成三大痛点</text>

  <rect x="64" y="178" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 加盟商体外私采劣质原料 &amp; 逃避总部供应链统采</text>
  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 门店 POS 卖出 10,000 杯拿铁，但向总部仅订购了 4,000 杯咖啡豆</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 加盟商从黑市私买廉价糖浆/过期奶，砸穿全品牌食品安全口碑</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 总部月底人工催缴 5% 品牌管理费 (Royalty) 遭拖欠赖账!</text>

  <rect x="64" y="288" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="310" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 店长拍脑袋叫货导致 7天短保鲜奶大面积过期报损</text>
  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 未结合次日降雨降温与联名活动热度，盲目按上周销量翻倍订鲜奶</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 大仓发货未校验剩余保质期 (Remaining Shelf Life &lt; 65%)</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 鲜奶到店仅剩 2 天效期直接整箱倒掉，损耗率高达 9%!</text>

  <rect x="64" y="398" width="320" height="106" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="420" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 联名周边/爆款包材被黄牛加盟店恶意囤货断供</text>
  <text x="78" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 顶流 IP 联名纸袋/徽章上线瞬间被少数大店抢订 500 箱挂闲鱼倒卖</text>
  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 其余 80% 社区门店首日上午即缺包材被迫下架联名新品</text>
  <text x="78" y="480" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 传统加盟供应链报损、私采与欠费损耗基线：$390,000 / 季度</text>

  <!-- Center Column: 5-Lane Deterministic Gate -->
  <rect x="420" y="132" width="380" height="390" rx="12" fill="#0F2238" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="440" y="162" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">🛡️ 万店加盟自动叫货与分账五车道确定性门禁</text>

  <rect x="436" y="178" width="348" height="56" rx="8" fill="#091526" stroke="#EF4444" stroke-width="1.2"/>
  <text x="450" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · 拦截非总部认证供应商私采或囤积联名包材 (10ms)</text>
  <text x="450" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">强制校验 BOM 理论消耗与统采入库比对，并按门店杯量锁死联名配额</text>

  <rect x="436" y="244" width="348" height="56" rx="8" fill="#091526" stroke="#F97316" stroke-width="1.2"/>
  <text x="450" y="266" fill="#FB923C" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · 拦截突破短保效期上限 (FEFO) 或漏扣特许费 (13ms)</text>
  <text x="450" y="286" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">订货量严禁超过剩余保质期预计消耗，且 POS 收款实时分账 Royalty</text>

  <rect x="436" y="310" width="348" height="56" rx="8" fill="#091526" stroke="#A855F7" stroke-width="1.2"/>
  <text x="450" y="332" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 · 拦截食药监原料批次召回与超 180d 密钥 (255ms)</text>
  <text x="450" y="352" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">Web IQ 实时监控乳品/果浆批次召回并在 POS 端秒级锁死关联饮品</text>

  <rect x="436" y="376" width="348" height="58" rx="8" fill="#091526" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="450" y="398" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🧑‍⚖️ HTTP 409 · 天气/外卖弹性自动叫货 + POS 分账直扣 (215ms)</text>
  <text x="450" y="418" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="11">压降 68% 鲜奶报损并实现 0 拖欠特许权费立省 $85,800 → $304,200</text>

  <rect x="436" y="444" width="348" height="60" rx="8" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
  <text x="450" y="468" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · 整托冷链自动补货 + 实时分账闭环 (10ms)</text>
  <text x="450" y="488" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="11">万店零店长手工算单 + 100% 统采食安溯源 ($390,000 批次)</text>

  <!-- Right Column: Quantitative Metrics -->
  <rect x="820" y="132" width="332" height="390" rx="12" fill="#0B2420" stroke="#10B981" stroke-width="1.5"/>
  <text x="840" y="162" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">📊 万店加盟供应链第一性原理</text>

  <rect x="836" y="178" width="300" height="104" rx="8" fill="#071715" stroke="#065F46" stroke-width="1"/>
  <text x="850" y="200" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🧋 自动订货与分账三大不变量</text>
  <text x="850" y="222" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 质量守恒：POS 出品 BOM 消耗 ≈ 统采进货量</text>
  <text x="850" y="242" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 效期守恒：在库+在途+新订 ≤ 剩余效期销量</text>
  <text x="850" y="262" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 资金守恒：POS 收银实时拆分 Royalty + 货款</text>

  <rect x="836" y="294" width="300" height="104" rx="8" fill="#071715" stroke="#065F46" stroke-width="1"/>
  <text x="850" y="316" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">⚡ 实测万店运营与风控指标</text>
  <text x="850" y="338" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 短保鲜奶/鲜果过期报损率：从 7.8% 降至 1.4%</text>
  <text x="850" y="358" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 总部特许权使用费与货款按时回款率：100%</text>
  <text x="850" y="378" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 体外私采假冒原料检出拦截率：100%</text>

  <rect x="836" y="410" width="300" height="94" rx="8" fill="#071715" stroke="#10B981" stroke-width="1.5"/>
  <text x="850" y="434" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">💰 季度连锁加盟供应链净收益</text>
  <text x="850" y="460" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">立省 $85,800.00 (-22.0%)</text>
  <text x="850" y="484" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12">原临期报损、私采跑冒与催款损耗 $390,000 → 净值 $304,200</text>

  <!-- Footer Mandate Strip -->
  <rect x="48" y="538" width="1104" height="96" rx="10" fill="#091326" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="566" fill="#38BDF8" font-family="Consolas, monospace" font-size="13" font-weight="700">Mandate Prefix: franchise_qsr_supply_royalty_split_mandate_*</text>
  <text x="68" y="590" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">✅ Good Fit: 连锁现制茶饮咖啡 (瑞幸/霸王茶姬/蜜雪冰城/Starbucks)、快餐连锁 (QSR) 与餐饮 B2B 冷链供应链 (Sysco/美菜)</text>
  <text x="68" y="614" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">⛔ Not For: 依赖店长深夜手工填表叫货、允许订购超出保质期消化能力的短保鲜奶或事后人工催收加盟抽成 · Provenance: official_doc_snapshot + deterministic_offline_simulation</text>
</svg>

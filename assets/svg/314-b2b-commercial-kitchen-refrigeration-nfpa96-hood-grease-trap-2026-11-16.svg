  <rect width="1200" height="675" fill="url(#bg314)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent314)"/>

  <!-- Header -->
  <text x="48" y="58" fill="#FB923C" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 312 · B2B COMMERCIAL KITCHEN REFRIGERATION, NFPA 96 HOOD CLEANING &amp; FOG GREASE TRAP PUMPING</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">餐饮冷链与烟罩隔油池维保：铭牌冷媒容量锁、屋顶风机 NFC vs 14oz 冷柜收 25磅氟利昂与隔油池撇水</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_commercial_kitchen_refrigeration_nfpa96_hood_fog_grease_trap_mandate_2026 · 15.0% Savings ($21,750 / Batch)</text>

  <!-- Left Panel: Legacy Kitchen Maintenance Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统餐饮后厨与商超冷链维保四大黑洞 (Legacy Kitchen Leakage: 25%–48%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 14 盎司小冷柜补氟按 25 磅整罐收 $750 (Whole-Jug Refrigerant Padding)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">后厨双门冷柜或制冰机出厂铭牌总冷媒容量仅 12–16 盎司 (不足 1 磅)，维修工补了</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">6 盎司却按整罐 25 磅氟利昂开单收 $750，账单充注量比机器总容量还大 20 倍。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 半夜洗烟罩只擦灶台表面、漏洗屋顶排烟风机 (NFPA 96 Duct/Fan Skipping)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">利用凌晨无人监管，清洗工花 20 分钟把店长看得见的集烟罩擦亮贴标，却根本没爬</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">上屋顶打开风机铰链，竖井内堆积 2 厘米厚易燃焦油，一旦起火直接遭保险拒赔。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 隔油池只撇表层浮水 (Skimming) 或臭水回灌冒充 1,500 加仑整池抽干</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">吸污车为逃避污水厂高额卸油处置费，只抽走隔油池顶层 250 加仑浮油，留着池底</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">半米厚硬油泥不管（或将分离后的灰水违规回灌池内），却照收 1,500 加仑全价。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 制冰机假除垢滋生粉红粘菌 + 侵吞废食用油 (UCO) 生物柴油返利</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">未触发制冰机主板 CLEAN 程序就收 $280 除垢费导致冰块霉菌超标；同时免费拉走</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">高价值废炸油 (Used Cooking Oil) 转卖生物柴油厂（$0.45/lb），却对餐厅零返利。</text>

  <!-- Right Panel: Agentic Nameplate Oz + NFPA 96 Architecture -->
  <rect x="616" y="132" width="540" height="395" rx="12" fill="#0F1E2E" stroke="#10B981" stroke-width="1.5"/>
  <rect x="616" y="132" width="540" height="38" rx="12" fill="#064E3B"/>
  <text x="636" y="156" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">✅ 铭牌冷媒容量锁 + 屋顶风机 NFC + 隔油池见底超声清算架构</text>

  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 设备铭牌冷媒总容量封顶锁 (&lt;=Nameplate Oz) + CLEAN 核验 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">绑定每台冷柜/制冰机序列号出厂铭牌冷媒总盎司数 (如 14 oz)，严禁突破铭牌容量</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">或按 5磅/25磅整罐凑整计费；制冰机保养强制校验控制板 CLEAN 清洗脉冲日志。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 屋顶风机铰链 NFC + &lt;50µm 裸金属照 + 隔油池 0% 见底锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">强制屋顶风机翻转铰链内侧 NFC 签到与裸金属测厚照 (NFPA 96 § 11.6)；隔油池</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">必须验证超声液位降至 0% 露出池底且与市政污水厂 FOG Manifest 地磅单闭环。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查市政消防平台与 FOG/EPA 608 牌照 (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 穿透核查市政消防合规平台 (Brycer TCE) 烟道清洗上传备案、水务局 FOG</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">废油脂准运证及技师 EPA Section 608 / IKECA 执照，杜绝消防封店与非法倾倒。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动将整罐冷媒回调至实测盎司并抵扣废食用油 (UCO) 返利 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动剥离 25 磅整罐凑整水分并按 $0.45/lb 冲抵门店废炸油生物柴油回收返利：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $145,000.00 → 自动核减 $21,750.00 (15.0%) → 净付 $123,250.00！</text>

  <!-- Bottom Telemetry & Benchmark Bar -->
  <rect x="44" y="542" width="1112" height="92" rx="12" fill="#020617" stroke="#334155"/>
  <text x="64" y="568" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 确定性门禁实测 (Deterministic Policy Guards · $145,000.00 Monthly 200-Store Kitchen Facilities Batch)</text>

  <rect x="64" y="580" width="205" height="40" rx="6" fill="#064E3B"/>
  <text x="76" y="598" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 200 · 10ms</text>
  <text x="76" y="614" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11">铭牌盎司+屋顶NFC+见底($145k)</text>

  <rect x="281" y="580" width="205" height="40" rx="6" fill="#450A0A"/>
  <text x="293" y="598" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 403 · 11ms</text>
  <text x="293" y="614" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="11">拦 14oz 冷柜收 25 磅整罐氟</text>

  <rect x="498" y="580" width="215" height="40" rx="6" fill="#450A0A"/>
  <text x="510" y="598" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 422 · 14ms</text>
  <text x="510" y="614" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="11">拦漏洗屋顶风机与隔油池撇水</text>

  <rect x="725" y="580" width="205" height="40" rx="6" fill="#3B0764"/>
  <text x="737" y="598" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 451 · 275ms</text>
  <text x="737" y="614" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="11">拦漏报消防平台与无 FOG 证</text>

  <rect x="942" y="580" width="196" height="40" rx="6" fill="#451A03"/>
  <text x="954" y="598" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 409 · 240ms</text>
  <text x="954" y="614" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11">盎司重算+UCO省 $21.75k ($123.25k)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg838" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent838" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg838)" />
  <rect x="24" y="24" width="1152" height="582" rx="18" fill="none" stroke="url(#accent838)" stroke-width="2" opacity="0.45" />

  <text x="52" y="66" fill="#c084fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">
    🏆 ROUND 395 MAJOR MILESTONE · FAQ #514 · SVG #838 · SANDBOX #288 · TEST #1,392
  </text>
  <text x="52" y="102" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">
    Enterprise B2B Wholesale Dealer Portal, Fair-Share Allocation &amp; Blind Drop-Ship
  </text>
  <text x="52" y="130" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Shopify Plus B2B vs. OroCommerce vs. Salesforce B2B vs. BigCommerce + MAP Diverter Lock, Tier Quota &amp; Blind Slip
  </text>

  <!-- Panel 1 -->
  <rect x="52" y="156" width="350" height="390" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="1.8" />
  <rect x="52" y="156" width="350" height="42" rx="14" fill="#7f1d1d" />
  <text x="72" y="183" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    1. MAP Diverter &amp; Territory Lock (403)
  </text>
  <text x="72" y="222" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    Problem: Wholesale Buyers Dumping on Amazon Below MAP
  </text>
  <text x="72" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    • Rogue dealer buys 500 units at 50% wholesale discount
  </text>
  <text x="72" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    and dumps them on Amazon 3P at 25% below MAP,
  </text>
  <text x="72" y="284" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    stealing the brand's own Buy Box!
  </text>
  <rect x="72" y="304" width="310" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1" />
  <text x="86" y="328" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">
    if Active_MAP_Strike or Territory_Exclusivity_Breach:
  </text>
  <text x="86" y="348" fill="#fecaca" font-family="Consolas, monospace" font-size="12">
    raise HTTP_403_MAP_VIOLATOR_OR_TERRITORY_VETO
  </text>
  <text x="86" y="366" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">
    # Freeze wholesale SKU access on MAP violation strike
  </text>
  <text x="72" y="404" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    Platform Fit: OroCommerce / Salesforce B2B
  </text>
  <text x="72" y="426" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Enforces ZIP-code exclusive dealer territory boundaries
  </text>
  <text x="72" y="446" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Blocks checkout to Amazon FBA warehouse addresses
  </text>
  <text x="72" y="466" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Serialized lot tracking traces gray-market diverters
  </text>

  <!-- Panel 2 -->
  <rect x="425" y="156" width="350" height="390" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" />
  <rect x="425" y="156" width="350" height="42" rx="14" fill="#78350f" />
  <text x="445" y="183" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    2. Fair-Share ATP Allocation Gate (422)
  </text>
  <text x="445" y="222" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    Problem: 3 Whale Distributors Hoard 100% of Launch Stock
  </text>
  <text x="445" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    • First-come-first-served (FCFS) lets 3 large buyers
  </text>
  <text x="445" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    drain 100% of scarce launch stock, starving 400
  </text>
  <text x="445" y="284" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    boutiques and the brand's own high-margin D2C store!
  </text>
  <rect x="445" y="304" width="310" height="72" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="459" y="328" fill="#fcd34d" font-family="Consolas, monospace" font-size="12" font-weight="700">
    if Order_Qty &gt; Dealer_Tier_Quota or D2C_Pool_Drained:
  </text>
  <text x="459" y="348" fill="#fde68a" font-family="Consolas, monospace" font-size="12">
    raise HTTP_422_WHALE_HOARDING_OR_MOQ_PACK_BREACH
  </text>
  <text x="459" y="366" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">
    # Enforce per-dealer allocation quota &amp; D2C ring-fence
  </text>
  <text x="445" y="404" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    Pro-Rata Fair-Share Allocation (HTTP 409):
  </text>
  <text x="445" y="426" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Allocates scarce stock by historical POS sell-through
  </text>
  <text x="445" y="446" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Protects 35% high-margin D2C safety pool
  </text>
  <text x="445" y="466" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Cuts channel cannibalization &amp; stockout loss by 41%
  </text>

  <!-- Panel 3 -->
  <rect x="798" y="156" width="350" height="390" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.8" />
  <rect x="798" y="156" width="350" height="42" rx="14" fill="#064e3b" />
  <text x="818" y="183" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    3. Blind Drop-Ship &amp; Resale Tax (451)
  </text>
  <text x="818" y="222" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    Problem: Printing Wholesale Cost Inside Consumer Box!
  </text>
  <text x="818" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    • Dealer requests B2B2C drop-ship to end consumer,
  </text>
  <text x="818" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    and WMS accidentally packs the $140 wholesale invoice
  </text>
  <text x="818" y="284" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    inside the $300 retail box—exposing dealer margin!
  </text>
  <rect x="818" y="304" width="310" height="72" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="832" y="328" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">
    if DropShip_Shows_Cost or Resale_Cert_Expired:
  </text>
  <text x="832" y="348" fill="#a7f3d0" font-family="Consolas, monospace" font-size="12">
    raise HTTP_451_BLIND_SLIP_LEAK_OR_RESALE_TAX_BREACH
  </text>
  <text x="832" y="366" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">
    # Force zero-price blind packing slip &amp; valid ST-120 cert
  </text>
  <text x="818" y="404" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    Zero-Leak B2B2C Fulfillment:
  </text>
  <text x="818" y="426" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Prints white-label blind packing slip with $0 prices
  </text>
  <text x="818" y="446" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Sets return address on shipping label to Dealer's address
  </text>
  <text x="818" y="466" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Validates active state Resale Tax Exemption cert
  </text>

  <!-- Footer -->
  <text x="52" y="582" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    Agentic Commerce Fiduciary Architecture · Pillar 4: B2B Wholesale Dealer Portal &amp; Fair-Share Allocation · 🏆 Round 395 Milestone!
  </text>
</svg>

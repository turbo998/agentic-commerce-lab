  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 同人 3 个姓名变体 (Alias) × 4 个县收 12 次检索费 + 虚构 $25 法院规费</text>

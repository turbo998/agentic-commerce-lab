  <text x="44" y="223" class="body-txt">• Stops "35% Off 1st Autoship + Instant Cancel":</text>
  <text x="54" y="243" class="mono">Block Same-Card/Address Multi-Account Promo Loop</text>
  <text x="44" y="266" class="body-txt">• Prevents fatal permethrin toxicity (dog flea meds</text>

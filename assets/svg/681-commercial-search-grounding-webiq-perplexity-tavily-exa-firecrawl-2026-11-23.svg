<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg681" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101e"/>
      <stop offset="50%" stop-color="#0b1d33"/>
      <stop offset="100%" stop-color="#071324"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .body-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 11.5px; fill: #6ee7b7; }
      .kpi-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 800; }
      .kpi-lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg681)"/>
  <rect x="28" y="22" width="1144" height="68" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="48" y="51" class="title">Round 238 · Commercial Search Grounding: `Web IQ` vs `Perplexity` vs `Tavily` vs `Exa` vs `Firecrawl`</text>
  <text x="48" y="74" class="sub">Microsoft Web IQ (`/v3/search` + `/v3/browse`) · `liveCrawlSucceeded` Gate · `GTIN/JSON-LD` Parity · 2-Stage Tiered Router (-41%)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1081" y="59" text-anchor="middle" class="mono" fill="#a7f3d0">SVG #681 · FAQ #357</text>

  <!-- Lane 1: Stale Search Snippet Price/Stock Hallucination (Treating 7-Day Cached Snippet as Live Checkout Quote) -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Live-Crawl &amp; Freshness Gate (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Never Lock Payment From a Cached Search Snippet:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Require `WebIQ /v3/browse liveCrawlSucceeded`</text>
  <text x="54" y="200" class="mono">`== true` &amp; `availability == InStock`!</text>
  <text x="44" y="223" class="body-txt">• Blocks Summary-Only APIs at Checkout Gate:</text>
  <text x="54" y="243" class="mono">Reject Unverified `Perplexity/Tavily` Price Summary</text>
  <text x="44" y="266" class="body-txt">• Eliminates 29% checkout price-jump abandonment</text>
  <text x="54" y="286" class="body-txt">caused by agents quoting expired Black Friday</text>
  <text x="54" y="304" class="body-txt">prices from 7-day-old search engine cache</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 STALE_SEARCH_SNIPPET_OR_LIVE_CRAWL_NOT_VERIFIED</text>

  <!-- Lane 2: SKU Variant / Accessory / Refurbished Confusion & Missing Shipping/Duty Landed Cost -->
  <rect x="416" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. `GTIN / JSON-LD` SKU Gate (HTTP 422)</text>
  <text x="432" y="162" class="body-txt">• Stops Accessory / Refurb / Deposit Confusion:</text>
  <text x="442" y="182" class="mono">Match Exact `14-Digit GTIN + itemCondition=New`</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">in `Schema.org/Product Offers JSON-LD`!</text>
  <text x="432" y="223" class="body-txt">• All-In Landed Price (`Item + Ship + Tax`) Lock:</text>
  <text x="442" y="243" class="mono">Block `$490 Item + $85 Shipping` Bait-and-Switch</text>
  <text x="432" y="266" class="body-txt">• Prevents an agent claiming a `$1,199` laptop is</text>
  <text x="442" y="286" class="body-txt">on sale for `$149` because the webpage dropdown</text>
  <text x="442" y="304" class="body-txt">defaulted to the `$149` docking-station accessory</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 GTIN_CONDITION_MISMATCH_OR_ACCESSORY_PRICE_TRAP</text>

  <!-- Lane 3: Indirect Prompt Injection (Hidden DOM Text) & SEO Affiliate Slop Farm Pollution -->
  <rect x="804" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. `DOM Injection` &amp; `robots` Gate (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Strips Hidden `display:none / font-size:0` DOM:</text>
  <text x="830" y="182" class="mono">Quarantine `IGNORE MANDATE / Transfer to Wallet`</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">&amp; Filter Unverified SEO Affiliate Slop Farms!</text>
  <text x="820" y="223" class="body-txt">• Enforces `robots.txt / TDMRep` &amp; `CPSC` Recall:</text>
  <text x="830" y="243" class="body-txt">Blocks scraping behind paywalls/CAPTCHAs that</text>
  <text x="830" y="261" class="body-txt">violate merchant `robots.txt` or recommending</text>
  <text x="830" y="279" class="body-txt">products with active `CPSC / FDA` safety recalls</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 HIDDEN_DOM_PROMPT_INJECTION_OR_RECALL_SAFETY_HOLD</text>

  <!-- Bottom Two-Stage Funnel: Fast Passage Search -> Top-3 Live Browse -> Browser-Use Only on Action -->
  <rect x="28" y="374" width="1144" height="182" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="48" y="401" class="card-hdr" fill="#38bdf8">4. 3-Tier Grounding Funnel: `Web IQ Passage` (`$0.003`) → `Top-3 Live Browse` → `UCP/MCP` Checkout (HTTP 409)</text>

  <rect x="48" y="418" width="255" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="62" y="440" class="card-hdr">① Stage 1: `Web IQ / Exa` Recall</text>
  <text x="62" y="462" class="body-txt">Scans 20 candidate merchants</text>
  <text x="62" y="480" class="body-txt">using `contentFormat=passage`</text>
  <text x="62" y="498" class="body-txt">in `360ms` (7.1x fewer tokens</text>
  <text x="62" y="516" class="mono">vs full-page HTML scrape!)</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="337" y="440" class="card-hdr">② Stage 2: Top-3 `/v3/browse`</text>
  <text x="337" y="462" class="body-txt">Runs live landing-page verify</text>
  <text x="337" y="480" class="body-txt">only on Top-3 finalists to</text>
  <text x="337" y="498" class="body-txt">confirm exact `GTIN`, stock &amp;</text>
  <text x="337" y="516" class="mono">shipping before quoting!</text>

  <rect x="608" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="622" y="440" class="card-hdr">③ Category-Scoped TTL Cache</text>
  <text x="622" y="462" class="body-txt">Caches static specs/reviews</text>
  <text x="622" y="480" class="body-txt">for `24h`, but enforces `0s`</text>
  <text x="622" y="498" class="body-txt">cache bypass on live price</text>
  <text x="622" y="516" class="mono" fill="#6ee7b7">&amp; flash-sale inventory!</text>

  <rect x="893" y="418" width="259" height="120" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="907" y="440" class="card-hdr" fill="#6ee7b7">④ Zero Browser-Use on Search</text>
  <text x="907" y="462" class="body-txt">Reserves `$0.08` headless</text>
  <text x="907" y="480" class="body-txt">browsers strictly for final</text>
  <text x="907" y="498" class="body-txt">non-API checkout forms</text>
  <text x="907" y="516" class="mono" fill="#38bdf8">-41% Grounding &amp; Drift Cost</text>

  <!-- KPI Footer -->
  <rect x="28" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="46" y="604" class="kpi-num" fill="#38bdf8">-41.0%</text>
  <text x="46" y="626" class="kpi-lbl">Quarterly API Spend &amp; Price-Drift Loss Saved</text>
  <text x="46" y="642" class="mono">$90,200 Saved / $220k Pool</text>

  <rect x="318" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="336" y="604" class="kpi-num" fill="#10b981">7.1x Tokens</text>
  <text x="336" y="626" class="kpi-lbl">Web IQ `passage` vs Full Markdown</text>
  <text x="336" y="642" class="mono">2.75x Faster Multi-Merchant Recall</text>

  <rect x="608" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="626" y="604" class="kpi-num" fill="#f59e0b">100% Blocked</text>
  <text x="626" y="626" class="kpi-lbl">Hidden DOM Prompt Injection &amp; Recalls</text>
  <text x="626" y="642" class="mono">Strict JSON-LD GTIN Parity</text>

  <rect x="898" y="572" width="274" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="916" y="604" class="kpi-num" fill="#f472b6">0% Price Jump</text>
  <text x="916" y="626" class="kpi-lbl">Top-3 `/v3/browse` Pre-Commit Verify</text>
  <text x="916" y="642" class="mono">Verified `liveCrawlSucceeded=true`</text>
</svg>

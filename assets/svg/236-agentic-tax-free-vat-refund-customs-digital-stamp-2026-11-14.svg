  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：空壳卡骗市内免税境内倒卖 + 伪造纸质海关章 + 中介抽走 40% 税款</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 代购用 0 余额预付卡办市内退现后将名表留在境内倒卖：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 领走 20% 退税后根本不去机场扫海关码，担保预付卡扣款失败，商家被税局追缴 20% 税+罚金；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 造假者花 $20 私刻假海关橡皮章盖在纸质单据上邮寄骗走巨额退税！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 跨天拼单未达单日最低门槛 (法国 &gt;€100) 或混入禁退餐饮/已开封品：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反欧盟增值税指令第 147 条与日本免税规定，在税务稽查中被全额剔除补税。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 传统退税寡头截留 35%–45% 手续费并强绑 8% 恶劣 DCC 汇差：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 游客在机场排长队 2 小时到手退税额缩水近半，重创奢侈品门店复购体验。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

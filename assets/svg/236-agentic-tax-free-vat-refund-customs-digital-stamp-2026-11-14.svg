  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 直连法国 PABLO / 西班牙 DIVA / 日本 PIE 电子海关章 + 真卡担保锁：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 硬拦截空壳预付卡与纸质假章；市内退现强制冻结真实信用卡 100% 税额预授权，</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 21 天未获机场海关电子离境签名自动扣回补税，实现商家 0.0% 税务坏账！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 护照 ICAO 9303 NFC 验真 + 同店同日起征额与 ≤90天离境锁：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动剔除长居工作/留学签与已拆封消耗品，确保 100% 符合 EU Art. 147 免税条件。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 法规核验与直连降费增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 消除未离境补税罚金与传统中介 35% 高额截留，单批立省 $40,800.00 (HTTP 409)！</text>


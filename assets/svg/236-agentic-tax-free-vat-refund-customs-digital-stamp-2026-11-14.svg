  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 234 · TAX-FREE VAT REFUND</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体离境退税与奢品市内免税 PABLO/DIVA 电子海关章与信用卡追回架构</text>

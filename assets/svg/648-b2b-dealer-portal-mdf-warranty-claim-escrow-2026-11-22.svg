  <text x="442" y="182" class="mono">Match `Parent_Unit_SN + Child_Part_SN` In Warranty</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">Require Field-Destroy Cut-Cord Video or Core Return</text>
  <text x="432" y="223" class="body-txt">• Flat-Rate Labor Book &amp; `3-Sigma` Anomaly Gate:</text>
  <text x="442" y="243" class="mono">Cap Labor Hours to OEM Standard &amp; Flag Outlier Shops</text>
  <text x="432" y="266" class="body-txt">• Eliminates service centers filing fake warranty</text>
  <text x="442" y="286" class="body-txt">claims on working parts to harvest free OEM</text>
  <text x="442" y="304" class="body-txt">compressors/boards and sell them for cash</text>

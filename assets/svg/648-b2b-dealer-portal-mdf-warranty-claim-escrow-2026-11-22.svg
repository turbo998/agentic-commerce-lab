  <text x="54" y="304" class="body-txt">submitting inflated invoices from related agencies</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 UNAPPROVED_MDF_OR_COMPETITOR_AD_CLAIM_BLOCKED</text>


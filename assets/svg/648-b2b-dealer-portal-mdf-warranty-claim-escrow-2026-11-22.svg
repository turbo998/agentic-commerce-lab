  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Co-Op / MDF Proof-of-Performance (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Paying $40k MDF for Fake or Rival Ads:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Require `Pre_Approval_ID` + Brand Share &gt;= 50%</text>

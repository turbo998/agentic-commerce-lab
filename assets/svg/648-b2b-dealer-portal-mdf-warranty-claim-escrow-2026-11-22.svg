  <text x="44" y="223" class="body-txt">• Vision Audit of Local Event / Print Tear-Sheets:</text>
  <text x="54" y="243" class="mono">Reject Photoshopped Logos &amp; Competitor Co-Features</text>
  <text x="44" y="266" class="body-txt">• Prevents dealers from billing the OEM for multi-</text>

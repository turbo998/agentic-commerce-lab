  <text x="820" y="162" class="body-txt">• Stops Ordering $500k on Dec 30 &amp; Returning Jan 4:</text>
  <text x="830" y="182" class="mono">Rebate_Base = Shipped_Sell_In - 60d_Stock_Rotation</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">Claw Back Tier-Up Rebate if Return Drops Tier</text>
  <text x="820" y="223" class="body-txt">• Contractual Stock-Rotation Cap (`&lt;= 5%` of Qtr):</text>
  <text x="830" y="243" class="body-txt">Requires 2:1 offsetting new order for any slow-</text>
  <text x="830" y="261" class="body-txt">moving inventory rotation back to the OEM</text>
  <text x="820" y="284" class="body-txt">• Prevents dealers from gaming quarterly volume</text>
  <text x="830" y="302" class="body-txt">rebate cliffs via end-of-quarter order stuffing</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 EOQ_STUFF_AND_RETURN_REBATE_GAMING_HOLD</text>


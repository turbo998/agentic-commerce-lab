<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg258" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent258" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="dangerGrad258" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad258" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg258)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="380" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="234" y="55" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">ROUND 256 · PHARMA EDI 844/849 CHARGEBACK &amp; DSCSA/340B</text>
  <text x="44" y="96" fill="#f8fafc" font-size="23" font-weight="800">B2B 智能体医药一级分销商返利回扣对账（EDI 844/849）与 DSCSA/340B 防重扣清算架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">DEA/HIN 终端医疗机构资格锁 + 历史批次 WAC 溯源账本 + DSCSA SGTIN 单盒防重扣令牌 vs. 传统串货套利、提价期 WAC 虚报与 340B 双重返利</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent258)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad258)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统粗放 EDI 844 财务核销的三大毛利漏损黑洞（年损 4%~8% 营收）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. 终端医院资格伪造与串货套利（Class-of-Trade Diversion · 403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 分销商按 WAC $1,000/支进货后，实际按 $920 卖给无合同医美诊所或非会员药房</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 提交 EDI 844 时却冒填公立教学医院 DEA/HIN 或已过期 GPO 合同号，骗走 $380/支差价</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 缺乏发票日 EDI 845 + HRSA OPAIS 成员资格强校验，导致低价合同药流入灰市</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. 提价期新旧 WAC 库存套利与超额幽灵索赔（WAC-Spike Arbitrage · 422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• 1月1日药厂将 WAC 从 $900 提至 $1,000；分销商拿去年按 $900 买进的老批次库存</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• 卖给 $620 合同医院后按新 WAC $1,000 索赔 $380（实为 $280），每支白薅药厂 $100</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 未绑定原始发货批次 EDI 810 历史买入 WAC 与批次剩余可核销支数上限</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. 340B + Medicaid 双重重复返利与单盒序列号重放（Duplicate Discount · 451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• 违反 42 U.S.C. § 256b：同一盒药前端刚拿 45% 340B 差价回扣，后端又被州医保索要返利</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 同一枚 DSCSA 2D DataMatrix SGTIN 单盒序列号在不同周 EDI 844 报文中重复报销两次</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 药厂遭遇“一盒药割两刀肉”双重失血，事后人工抽检追回率不足 15%</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad258)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + DSCSA SGTIN + EDI 849 四重确定性核销门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · DEA / HIN / HRSA OPAIS 终端医院有效合同锁（拦截 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 实时比对发票日终端医院 DEA+HIN 是否处于有效 EDI 845 价格授权名录及</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">HRSA 340B 激活状态；非授权机构 5ms 自动签发 EDI 849 Ineligible 拒付码</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · 进货批次历史 WAC 溯源与批次销量耗尽锁（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">强制绑定 Lot 原始 EDI 810 发票买入 WAC 计算差价（严禁拿老库存套新 WAC），</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">且校验 Claimed Units ≤ Lot Remaining Unclaimed Balance，粉碎幽灵超额索赔</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · DSCSA SGTIN 单盒唯一锁与 340B/Medicaid 互斥门禁（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">逐盒校验 FDA DSCSA 2D SGTIN 序列号首次核销，并与州 Medicaid MDRP 处方返利库</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">执行实时交叉去重，100% 阻断 42 U.S.C. § 256b 联邦双重折扣与序列号重放</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 自动签发 EDI 849 贷项凭证 &amp; &gt;$150k 贸易财务双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">11ms 签发 b2b_pharma_wholesale_chargeback_... 令牌；超 $150k 或争议复议转 409 HITL</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#38bdf8" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 合规 EDI 844 核销</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">100支 × ($1,000-$620) = $38,000</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">EDI 849 Approved · 11ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · 终端医院资格不符</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">非 EDI 845 签约机构 / 串货</text>
  <text x="410" y="692" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">dea_hin_contract_roster_mismatch</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · 提价 WAC 套利/超发</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">老库存冒用新 WAC 或超批次量</text>
  <text x="642" y="692" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">wac_lot_inventory_exhausted</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · 340B 双重返利/重放</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">340B+Medicaid 冲突或 SGTIN 重放</text>
  <text x="874" y="692" fill="#f472b6" font-size="12" font-weight="700" text-anchor="middle">duplicate_340b_or_dscsa_serial_replay</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · &gt;$150k / 争议复议</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">$240k 大额单转人工双签</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">require_pharma_trade_finance_hitl</text>
</svg>

  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截秒取消原报价换同名高仿假号(API劫持)或发货前恶意刮掉四连全息贴纸</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">recipient_steamid64 != buyer_id | sticker_wear_increased = true</text>


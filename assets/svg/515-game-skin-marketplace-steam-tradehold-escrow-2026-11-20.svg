  <!-- Header -->
  <text x="44" y="48" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 72 · GAME SKIN MARKETPLACE, STEAM P2P TRADE-HOLD ESCROW &amp; ESPORTS COACHING</text>

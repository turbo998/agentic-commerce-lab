  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 交易达成后若立即给卖家放款，卖家向官方谎称“账号被盗”</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  触发 7 天交易回滚或账号原始邮箱(OG Email)找回，钱货两空</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：强制 T+8d 不可逆冷却期满才释放托管资金</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  + 磨损度(Float)与全息贴纸刮损复核 (HTTP 422)</text>

  <rect x="62" y="474" width="314" height="134" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 代练偷开外挂致百万库存 VAC 封禁与 P2P 租赁寻优</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 共享账号代练开透视外挂导致号主 $50,000 饰品库存永久冻结</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ 禁异地共享上号(改双排陪练)与黑产洗钱锁(451)</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• P2P 玩家直连免机器人二次7天CD(省去15%官方社区税)</text>
  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  + 信用免押短期体验租刀替代高位接盘省 26% (HTTP 409)</text>


  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">网易 BUFF / 悠悠有品 / CSFloat / Skinport / 比心 vs 禁明文 Web API Key 劫持 vs 7+1天防撤回托管 vs 免押租刀省 26%</text>

  <!-- Left Panel: 3 Core Game Skin Trading & Coaching Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 游戏饰品交易与陪玩代练三大盗损</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. 钓鱼劫持 Steam API Key，秒取消真报价换假机器人</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 木马窃取卖家 Web API Key，当买家发来 $3,000 蝴蝶刀</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  交易报价时，脚本 0.5 秒内自动拒绝并伪造同名头像假号发新报价骗走饰品</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：强制客户端库存 AssetID + 64位 SteamID64</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  与注册年份硬绑定，拦截取消重发异动 (HTTP 403)</text>

  <rect x="62" y="328" width="314" height="132" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />

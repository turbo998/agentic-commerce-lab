  <text x="868" y="340" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 芝麻信用满 650 分免押金按天租赁万元龙狙/蝴蝶刀；</text>
  <text x="868" y="360" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  电竞教练采用“组队双排语音教学(Duo-Queue)”零交号风险</text>
  <text x="868" y="380" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：短期尝鲜高端皮肤租赁、安全合规电竞陪玩指导</text>

  <rect x="854" y="412" width="284" height="196" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />

  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 发货前后比对 Float 磨损值与四连贴纸完好度</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 严守 T+8d 不可逆冷却期满放款 + 禁交号代练</text>

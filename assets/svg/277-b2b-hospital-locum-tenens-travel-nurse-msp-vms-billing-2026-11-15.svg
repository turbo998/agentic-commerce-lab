<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg277" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent277" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="dangerGrad277" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad277" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg277)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="490" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="289" y="55" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">ROUND 275 · HOSPITAL LOCUM &amp; TRAVEL NURSE VMS, EMR &amp; IRS GSA</text>
  <text x="44" y="96" fill="#f8fafc" font-size="22" font-weight="800">B2B 智能体医院临时主治医师与旅行护士派遣（MSP/VMS）、执业核验与 EMR 考勤清算架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">班次级 Nursys/NPDB/OIG 执业牌照锁 + 门禁与 Epic EMR 医嘱验证急诊召回 (Call-Back) + 首周培训免收费与 IRS 税籍锁 vs. 幽灵急诊召回与违规免税房补</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent277)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad277)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统医院外包医护 VMS 纸质考勤盲付的三大黑洞（年流失 9%~18%）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. 外州吊销执照/OIG 黑名单人员上岗 &amp; 无权限跨科顶班（403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 外包医护在中途被外州暂停 Nursys 执照或列入联邦 OIG LEIE 医保禁入名单，中介瞒报未撤换</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 普通病房旅行护士无资质被临时借调至 NICU/ICU，连累医院整笔 CMS 医保 DRG 账单被全额拒付</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 仅在入职首日查一次证件，缺乏班次级实时执业状态与科室权限门禁</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. 在家睡觉虚报深夜急诊召回 ($420/h) &amp; 违规收首周培训工时费（422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• 临时麻醉/外科医生虚填周末 3 次深夜急诊召回 (Call-Back 每次保底 4h 共索要 $5,040)</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• 实则门禁与 Epic EMR 无任何进院与开医嘱记录；且中介把本应免费的 16h 入职培训按 $140/h 收钱</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 科室主任周五草签纸质考勤单，VMS 计费系统与门禁及电子病历彻底脱节</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. 本地护士冒领 $1,800/周免税房补 &amp; 驻院超 12 个月税务暴雷（451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• 中介把家住医院 15 英里内的本地护士包装成“异地旅行护士”发放免税 GSA 住房餐饮津贴</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 同一护士通过换中介马甲在院连续工作超 12 个月 (违反 IRS Pub 463)，触发国税局共同雇主追缴</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 医院作为共同雇主面临数百万美元未代扣 FICA 社保税与滞纳金连带重罚</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad277)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + Nursys/NPDB + Epic EMR 四重门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · 班次级 Nursys e-Notify / NPDB / OIG 与专科授权锁（拦截 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 按医护 NPI 在每个值班日穿透核验多州紧凑执照、NPDB 医疗事故库、</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">OIG LEIE 黑名单及院内 ICU/OR 临床授权矩阵；资质异常 11ms 硬拦截</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · 门禁 + Epic EMR 医嘱双因子召回锁 &amp; 培训费归零（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">所有高价急诊召回 (Call-Back) 必须同时命中院区生物识别门禁刷卡与 Epic EMR</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">现场医嘱签名时间戳，并强制将首周 16~24h 入职培训 (Orientation) 设为 $0</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · IRS &gt;50英里异地税籍锁与跨中介 365 天驻场计数器（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">核验享受免税 GSA 房补人员的真实异地双重房租凭证 (&gt;50英里)，并按唯一 NPI</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">跨所有子供应商累计本院驻场天数，满 365 天强制转为全额征税 W-2 费率</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 外包医护自动清算 &amp; EMR 召回核减+培训去重双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">10ms 签发 b2b_hospital_locum_tenens_travel_nurse_... 令牌；立省 $57,600 转 409</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#38bdf8" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 合规 VMS 医护清算</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">牌照有效 + EMR 吻合 ($720k)</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">VMS Staffing Settled · 10ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · 执照暂停/无 ICU 权限</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">Nursys/OIG 违例防医保拒付</text>
  <text x="410" y="692" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">SANCTIONED_NURSYS_BLOCKED</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · 幽灵急诊召回/收培训费</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">无 EMR 医嘱记录或收 16h 培训</text>
  <text x="642" y="692" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">PHANTOM_CALLBACK_ORIENTATION</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · 假异地税籍/超 12个月</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">本地护士领免税房补或 &gt;365天</text>
  <text x="874" y="692" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">INVALID_IRS_TAX_HOME_HOLD</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · EMR 考勤核减+剥离培训</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">立省 $57.6k ($662.4k 净付)</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">EMR_SHIFT_AUDIT_CONFIRM</text>
</svg>

  <!-- Header -->
  <text x="48" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 338 · B2B COMMERCIAL STOREFRONT GLAZING, EMERGENCY BOARD-UP &amp; LOW-E IGU REPLACEMENT (ANSI Z97.1)</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">商业幕墙与商铺橱窗玻璃维修：封板工时抵扣锁、10 年 IGU 质保锁 vs 天价拆板二道贩子与假换铝框</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_commercial_glazing_storefront_igu_ansi_z971_boardup_mandate_2026 · 15.0% Savings ($18,600 / Batch)</text>

  <!-- Left Panel: Legacy Commercial Glazing Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业橱窗抢修与幕墙换玻璃四大黑洞 (Legacy Glazing Leakage: 30%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 半夜钉两张 $25 胶合板收 $1,600，装玻璃时再收 $650 拆木板费 (Double-Dip)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">利用门店橱窗半夜被砸急需封堵心理，钉两块建筑胶合板开出 $1,600 抢险天价，</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">5 天后同一拨人来换玻璃不仅不抵扣封板费，反而再收 $650“拆旧木板与清运费”。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 中空玻璃 (IGU) 起雾吞掉 10 年原厂质保，且忽悠连完好铝合金窗框一起砸掉重装</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">双层中空玻璃夹层进水起雾原本享有原厂 10 年 ASTM E2190 免费原片赔付，玻璃商却</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">隐瞒质保收全价，甚至谎称必须把完好的铝合金幕墙龙骨整套拆换狂收 $3,400。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 用无镀膜普通白玻冒充 $55/平尺 双银/三银 Low-E 充氩气节能中空玻璃</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">欺负物业肉眼看不出纳米金属镀膜，拿廉价普通透明白玻顶替 Solarban 70XL Low-E</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">中空玻璃，导致夏天西晒办公室空调跳闸，且按“单块最低 15 平尺”霸王凑整计费。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 在门扇与落地危险区违规安装无 SGCC / ANSI Z97.1 永久钢印的普通退火玻璃</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">违反 IBC 2406 建筑安全规范，在距地不足 18 英寸落地窗或门边装未钢化退火玻璃，</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">不仅无永久蚀刻 SGCC 安全角标无法通过消防/保险验房，一撞即碎成致命断头台。</text>


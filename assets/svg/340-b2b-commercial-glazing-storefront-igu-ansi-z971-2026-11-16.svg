  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 应急封板定额抵扣锁 ($0 拆板费) + 激光 Low-E 镀膜验真 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">锁定夜间胶合板封堵上限，同商换玻璃强制冲抵封板工时并 100% 剔除拆木板费；强制</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">校验激光玻璃测厚仪第 2/3 面 Low-E 镀膜读数，11ms 封杀二次收费与白玻顶替。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 完好铝框单换玻璃锁 (Reglaze Only) + 10 年 IGU 质保锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">铝合金框体未撞弯一律锁定为压线开槽单换玻璃芯；强制读取中空槽口铝隔条出厂日期，</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">10 年内起雾自动抵扣 $0 OEM 质保原片，14ms 拦截 $3,400 假换整框与吞质保。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 SGCC 安全钢印与 C-17 幕墙牌照 (270ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">270ms 在线穿透核验玻璃四角永久蚀刻 SGCC-XXXX 认证号 (16 CFR 1201 Cat II)、</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">IGCC ASTM E2190 名录及承包商 C-17 / NACC 幕墙执照，严防退火玻璃伤人。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动冲抵封板拆板费并扣回 10 年质保内免费 IGU 原片款 (235ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动剔除 $650 拆木板重复收费、冲抵夜间封板工时并扣回 10 年内起雾 IGU 原片费：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $124,000.00 → 自动核减 $18,600.00 (15.0%) → 净付 $105,400.00！</text>


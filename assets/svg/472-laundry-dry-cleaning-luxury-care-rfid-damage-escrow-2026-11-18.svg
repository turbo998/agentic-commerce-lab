  <text x="868" y="458" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. ISO 3758 水洗标视觉识别防羊绒误水洗</text>
  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 洗前 360° 瑕疵拍照经客户确认后才下水</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 奢品强制保价精洗 + 商用毛巾薅羊毛锁</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. UHF RFID 防错件 + 快递柜集单省 24%</text>
  <rect x="868" y="542" width="256" height="50" rx="6" fill="#022C22" />

  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：高估价衣物强制保价精洗通道 + 拦截家庭</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  订阅塞入大批量商用布草 (HTTP 422 拦截)</text>


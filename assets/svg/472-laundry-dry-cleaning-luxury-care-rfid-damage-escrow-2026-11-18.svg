  <text x="450" y="584" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">季度洗护与奢品护理结算池 $210,000 → 净赔付及履约成本 $159,600 (省 $50,400)</text>


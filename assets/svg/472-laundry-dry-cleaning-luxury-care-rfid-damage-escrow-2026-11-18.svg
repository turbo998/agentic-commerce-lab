  <text x="868" y="340" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 按袋包月(Rinse Repeat)与晚间管家上门取送</text>
  <text x="868" y="360" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 异地顺丰/快递柜全链路条码路由与保价险</text>
  <text x="868" y="380" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：全城上门取送 O2O 与电商奢品养护</text>


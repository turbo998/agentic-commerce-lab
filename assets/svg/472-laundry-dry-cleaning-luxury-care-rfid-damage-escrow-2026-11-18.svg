  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 四氯乙烯(PERC)环保禁令与发错衣服纠纷</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 合作中央工厂违规使用 EPA 禁用致癌四氯乙烯溶剂</text>

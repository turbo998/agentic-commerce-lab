  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  烘成童装，或入厂未拍原破损照洗后遭天价索赔</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：ISO 3758 水洗标视觉拦截 + 洗前瑕疵图</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  客户小程序确认锁 (HTTP 403 禁直接下水)</text>


  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  与开柜验衣放款立省 24% (HTTP 409)</text>

  <!-- Center Panel: 5-Lane Deterministic Gate -->

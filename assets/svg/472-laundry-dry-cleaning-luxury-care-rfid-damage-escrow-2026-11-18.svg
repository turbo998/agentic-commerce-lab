  <!-- Header -->
  <text x="44" y="48" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 29 · ON-DEMAND LAUNDRY, LUXURY GARMENT CARE, ISO 3758 CARE-LABEL GATE &amp; RFID ESCROW</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">O2O 洗护与奢品皮具护理：防羊绒混入水洗袋缩水、洗前瑕疵拍照确权与 RFID 防错衣</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Rinse / CleanCloud vs 丰巢洗护 / 京东洗衣 vs ISO 3758 Care-Label Vision vs Azure Foundry + UHF RFID Gate</text>

  <!-- Left Panel: 3 Core Laundry & Luxury Care Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 O2O 洗衣与奢品洗护三大理赔黑洞</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />

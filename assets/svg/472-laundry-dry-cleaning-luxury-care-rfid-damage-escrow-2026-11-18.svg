  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截仅限干洗羊绒/真丝混入水洗烘袋或洗前瑕疵未获客户确认</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">iso3758_wash_safe = false | defect_ack = false</text>


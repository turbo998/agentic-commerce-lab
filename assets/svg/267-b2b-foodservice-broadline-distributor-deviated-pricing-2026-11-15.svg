<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg267" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="accent267" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dangerGrad267" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad267" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg267)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="480" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="284" y="55" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">ROUND 265 · BROADLINE FOODSERVICE DPA, LANDED COST &amp; FSMA 204</text>
  <text x="44" y="96" fill="#f8fafc" font-size="22" font-weight="800">B2B 智能体连锁餐饮一级食材配送（Broadline）、厂家偏离价（DPA）与到岸成本加成清算架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">原厂 DPA 偏离底价全国 DC 穿透锁 + 关联头程运费 (Freight-In) 去泡沫与缺货平价替代 + GS1-128 实重与 FSMA 204 锁 vs. 截留返利两头吃与虚增成本基数</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent267)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad267)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统餐饮 Cost-Plus 食材统配的三大毛利失血黑洞（年损 3%~7% 食材费）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. 区域冷库漏挂原厂 DPA 偏离底价 &amp; 返利两头吃（DPA Double-Dip · 403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 餐饮总部与泰森签妥 $2.10/磅专供协议价 (DPA)，公开批发价为 $2.65/磅</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 分销商一边找泰森领走 $0.55/磅差价返利，一边在异地冷库仍按 $2.65 向门店收钱</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 总部谈判成果在异地分销中心 (DC) 落空，分销商独吞原厂补贴“一鱼两吃”</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. 借关联物流公司给头程运费注水 &amp; 缺货强推高价自牌货（422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• 表面承诺每箱只赚 $2.40 配送费，却用关联货运子公司把 $1.80 头程运费虚开成 $4.50 塞进成本</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• 合同约定的 $32/箱薯条缺货时，直接发 $46/箱自有品牌薯条并按高价扣款 (拒绝原价保护)</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 在 Landed Cost 到岸成本基数里藏匿暴利，且利用缺货诱导高毛利自牌替代</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. 冷鲜肉不扫 GS1-128 实重按均重扣费 &amp; 缺 FSMA 204 溯源码（451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• 整箱冷鲜牛眼肉条码实重仅 54.2 磅，账单却按 60.0 磅名义箱均重统一收钱 (+10.7% 空气肉)</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 高风险生食绿叶菜与海鲜缺失 FDA FSMA 204 强制要求的溯源批次码 (TLC) 与关键数据元素</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 门店厨师忙于备餐无暇复秤核价，且食安召回时无法精准定位问题批次</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad267)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + 原厂 DPA 锁 + GS1-128 四重确定性门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · 食品原厂 DPA 偏离底价全国 DC 强制穿透锁（拦截 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 将连锁总部与各食品生产商签署的生效 DPA 价格矩阵与 USDA 行情公式</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">强制绑定至全美所有分销中心 (DC)；漏挂底价或返利双吃 11ms 硬拦截</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · 头程干线运费 (Freight-In) 去泡沫与缺货平价替代锁（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">对标独立第三方冷链干线运价剥离关联物流子公司加价，并对分销商缺货发起的</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">替代商品 (Subbed SKU) 强制锁死结算价 ≤ 原合同脱销商品单价</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · GS1-128 AI(310n) 逐箱实重锁与 FDA FSMA 204 门禁（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">强制按每箱生鲜肉类 GS1-128 条码过磅净重结算（严禁按名义箱均重估算），</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">并校验高危生鲜 EDI 856 具备完整 FDA FSMA 204 KDE 与 TLC 溯源批次码</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 多门店统配自动清算 &amp; 跨区 DPA+运费核减双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">10ms 签发 b2b_foodservice_broadline_distributor_... 令牌；核减 $51,200 虚高成本转 409</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#fbbf24" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 合规 Cost-Plus 清算</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">DPA 底价 + 实重吻合 ($640k)</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Broadline Settled · 10ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · 漏挂 DPA 底价/返利双吃</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">$2.10 协议鸡肉按 $2.65 收款</text>
  <text x="410" y="692" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">OMITTED_DPA_DOUBLE_DIP</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · 关联运费注水/高价替代</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">Freight-In 翻倍或缺货不保价</text>
  <text x="642" y="692" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">FREIGHT_IN_SUB_OVERCHARGE</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · 名义箱均重/缺 FSMA 204</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">54.2磅牛肉按60磅收或无 TLC 码</text>
  <text x="874" y="692" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">CATCH_WEIGHT_FSMA204_HOLD</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · DPA 追回+运费去泡沫</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">立省 $51.2k ($588.8k 净付)</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">DPA_FREIGHT_AUDIT_CONFIRM</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg361" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent361" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg361)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent361)"/>

  <!-- Header -->
  <text x="48" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 359 · COMMERCIAL PARKING GARAGE CONCRETE RESTORATION (ACI 362.2R / ICRI) &amp; 40-MIL TRAFFIC COATING</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">商业停车楼结构混凝土空鼓修补、浇筑前切缝裸坑 LiDAR 锁与 &gt;=40 mils 聚氨酯耐磨地坪清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Sika / Tremco Vulkem / MasterSeal · &gt;=3/4" 垂直切缝裸坑激光测绘 + ICRI CSP 3–4 抛丸 + 30 sq.ft./gal 物料平衡 + 结构 PE 核验</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="64" y="160" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">🏢 四大停车楼结构修补与地坪硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 浇筑前 &gt;=3/4" 垂直切缝裸坑 LiDAR 锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制逐坑上传浇砂浆前的直角切边与钢筋下 3/4" 间隙</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 按浇筑前裸坑 LiDAR 点云锁定 $95/sq.ft. 结算面积</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截盖上黑面漆后虚报 300+ sq.ft. 与羽毛边</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. ICRI CSP 3–4 抛丸 &amp; &gt;=40 mils 物料平衡</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁拿高压水冲代替无尘钢丸抛丸 (ICRI CSP 3–4)</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 按空桶批号核验 &lt;=30 sq.ft./gal 锁死 &gt;=40 mils 干膜</text>
  <text x="74" y="368" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断少刷一半聚氨酯导致通车半年成片起皮</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="426" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 嵌入式牺牲锌阳极块 (防光环腐蚀锁)</text>
  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 新旧混凝土交界电位差会加速外围老钢筋 3 倍锈蚀</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制在修补坑边缘绑扎 Galvanic Zinc Anode 阳极块</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 彻底消除 Ring-Anode / Halo Effect 次生剥落</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="540" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. Web IQ 结构 PE 签章 &amp; GPR 预应力防切</text>
  <text x="74" y="560" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• /v3/browse 核验州注册结构工程师 (Structural PE) 印章</text>
  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截无 GPR 探地雷达扫筋擅凿预应力钢绞线</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 满足 ACI 362.2R 与市政车库周期性安全法检</text>

  <!-- Center Column: 5-Lane Deterministic Matrix -->
  <rect x="416" y="132" width="424" height="495" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="436" y="160" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">⚖️ 五路确定性清算决策矩阵 (5-Lane Matrix)</text>

  <!-- Lane 200 -->
  <rect x="432" y="176" width="392" height="76" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="446" y="198" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="446" y="218" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12">VERIFIED_COMMERCIAL_PARKING_GARAGE_RESTORATION_SETTLED</text>
  <text x="446" y="238" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">浇筑前裸坑 LiDAR + CSP 3-4 抛丸 + &gt;=40 mils + PE → $168,000.00</text>

  <!-- Lane 403 -->
  <rect x="432" y="264" width="392" height="76" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="446" y="286" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="446" y="306" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">PHANTOM_SPALL_PATCH_SQFT_PADDING_OR_UNSAWCUT_FEATHER_EDGE_BLOCKED</text>
  <text x="446" y="326" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截无浇筑前切缝裸坑激光照片虚报 $95/sq.ft. 面积 → $0.00</text>

  <!-- Lane 422 -->
  <rect x="432" y="352" width="392" height="76" rx="8" fill="#450A0A" stroke="#F87171"/>
  <text x="446" y="374" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="446" y="394" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">SKIPPED_ICRI_CSP_SHOTBLAST_OR_THIN_TRAFFIC_COATING_UNDER_40MILS</text>
  <text x="446" y="414" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截跳过 CSP 3-4 抛丸或聚氨酯空桶折算厚度 &lt;40 mils → $0.00</text>

  <!-- Lane 451 -->
  <rect x="432" y="440" width="392" height="76" rx="8" fill="#3B0764" stroke="#C084FC"/>
  <text x="446" y="462" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛑 HTTP 451 · Send to a human (265ms)</text>
  <text x="446" y="482" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">UNSTAMPED_STRUCTURAL_PE_PT_TENDON_REPAIR_OR_MISSING_ZINC_ANODE_HOLD</text>
  <text x="446" y="502" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web IQ 挂起无结构 PE 签章凿预应力板或漏埋牺牲锌阳极 → $0.00</text>

  <!-- Lane 409 -->
  <rect x="432" y="528" width="392" height="84" rx="8" fill="#451A03" stroke="#F59E0B"/>
  <text x="446" y="550" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🧑‍⚖️ HTTP 409 · Confirm (230ms)</text>
  <text x="446" y="570" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">AUTOMATED_LIDAR_SPALL_NET_SQFT_AND_COATING_GALLON_AUDIT_SAVINGS_CONFIRM</text>
  <text x="446" y="592" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">按浇筑前 LiDAR 净面积核减 300 sq.ft. 虚报尺数立省 $28,500 → 净付 $139,500.00</text>

  <!-- Right Column: FinOps & Benchmark -->
  <rect x="856" y="132" width="300" height="495" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="876" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">📊 成本精算与基准对比</text>

  <rect x="872" y="176" width="268" height="145" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="886" y="198" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">单批停车楼结构修补与地坪总额</text>
  <text x="886" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">$168,000.00</text>
  <text x="886" y="252" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web IQ 裸坑复尺 &amp; 加仑核减立省：</text>
  <text x="886" y="278" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">-$28,500.00 (-17.0%)</text>
  <text x="886" y="304" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">净清算额：$139,500.00</text>

  <rect x="872" y="335" width="268" height="140" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="886" y="357" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Web IQ vs. 竞品检索能力</text>
  <text x="886" y="379" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ: 230ms 直连州结构 PE 库</text>
  <text x="886" y="399" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  与 Sika/Tremco 固含量加仑定额</text>
  <text x="886" y="421" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Bright Data: 缺乏浇筑前裸坑几何</text>
  <text x="886" y="441" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">  与 1604 mils/gal 物料平衡模型</text>
  <text x="886" y="461" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exa: 无法做 PTI/ICRI 执照强校验</text>

  <rect x="872" y="489" width="268" height="121" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="886" y="511" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛠️ 生产核验清单 (Checklist)</text>
  <text x="886" y="533" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ 浇筑前 &gt;=3/4" 垂直切缝裸坑 LiDAR</text>
  <text x="886" y="553" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ ICRI CSP 3-4 抛丸 &amp; &gt;=40 mils 干膜</text>
  <text x="886" y="573" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ 结构 PE 签章 &amp; 牺牲锌阳极块归档</text>
  <text x="886" y="593" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">☑ 零虚构坐标 · CSP 自包含沙盒通过</text>
</svg>

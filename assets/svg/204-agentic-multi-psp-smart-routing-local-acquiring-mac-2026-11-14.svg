  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#indigo204)"/>
  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 202 · MULTI-PSP &amp; MAC GATE</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体多收单行动态路由 (Multi-PSP Smart Routing) 与卡组织 MAC 硬拒付零重试架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">8位 BIN 本地收单对齐 + Visa Cat-1 / MC MAC 03 零重试 + 0400 先冲正后级联令牌 (`agentic_multi_psp_smart_routing_mac_mandate_...`) vs 暴力重试重罚</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red204)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：单 MID 跨境收全球卡 + 跨 PSP 暴力重试硬拒付触发重罚</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 单一境外 MID 收全球卡白交 1.5% 跨境费且 15% 正常单被误杀：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 用美国收单主体刷英国/日本/巴西本地卡，被加收 1.2%–1.8% 卡组跨境费；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 海外发卡行风控对境外收单行高度敏感，首次授权通过率跌至 81% 以下。</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 遇到 Visa Cat-1 / MC MAC 03/21 硬拒付仍跨 PSP 循环重试：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 挂失被盗卡 (43) 或用户已撤回代扣 (MAC 21) 严禁任何重试，跨 PSP 照样被罚 $25k/月！</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 主通道超时 (Code 91) 未完成 0400 冲正即秒切备选 PSP：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 主备通道同时落账成功，导致消费者银行卡被双倍扣款 (200% Double Charge)。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms Cat-1/MAC03 Retry) | HTTP 422 (14ms Unreversed Failover)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#indigo204)"/>
  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：8位 BIN 本地收单对齐 + MAC 零重试熔断 + 先冲正后级联网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 8 位 IIN/BIN 发卡国与本地收单主体 (Local MID) 动态对齐：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 英国卡走英国 MID、日本卡走日本 MID，100% 免除 1.5% 跨境卡组费；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 享受本土交易信任加权与网络令牌 (Network Token)，通过率跃升至 94.5%+！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. Cat-1 / MAC 03/21 硬拒付 11ms 熔断 + 30天 &lt;=15 次滑动窗口：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 硬拒付零重试即刻封锁；超时故障强制先确认 ISO 8583 0400 冲正再级联备选 PSP。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 规则核验与跨境费套利：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 免除跨境费并挽回高价值误杀订单，单批立省/增收 $50,400.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $840k Batch) | HTTP 409 ($50.4k Local Acquiring Saved)</text>


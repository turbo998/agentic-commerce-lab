  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 偷减铟 (In) 掺杂再生废铝致阳极水下“钝化休眠”</text>
    <text x="58" y="224" fill="#CBD5E1">• 按铸造毛重收走 $185,000 铝锌铟牺牲阳极款</text>
    <text x="58" y="242" fill="#CBD5E1">• 铟含量 &lt;0.015% 致表面结死氧化铝壳，电容量跌破 900 Ah/kg</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 欠保护 (&gt;-800mV) 锈穿或过保护 (&lt;-1100mV) 氢脆</text>

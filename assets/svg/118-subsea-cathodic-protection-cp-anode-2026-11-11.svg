    <text x="58" y="344" font-weight="700" fill="#F87171">3. 阳极铁芯冷隔缩孔脱落或 HVDC 杂散电流腐蚀</text>
    <text x="58" y="364" fill="#CBD5E1">• 未做铁芯-铝体接触电阻 (&lt;=0.001 Ω) 与剖切探伤</text>

    <text x="823" y="370" fill="#CBD5E1">  延迟：295 ms · 节省：$29,600.00 (16.0% 降本)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  137 / 137 单元测试 100% 通过 (CSP 自包含)</text>

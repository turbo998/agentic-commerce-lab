  <text x="510" y="614" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="11">拦$280假换电磁阀与虚报打针</text>

  <rect x="725" y="580" width="205" height="40" rx="6" fill="#3B0764"/>
  <text x="737" y="598" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 451 · 265ms</text>
  <text x="737" y="614" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="11">拦无ISA树艺师证与砍头截干</text>


  <text x="636" y="156" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">✅ ET 雨天闭锁 + 免排污分表锁 + $18 膜片降级 + Web IQ ISA 架构</text>

  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 雨天/冰冻 0.0 GPM 流量闭锁 + 市政免排污费分表抵扣锁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">直连 WaterSense ET 主控箱与脉冲分水表，强制校验降雨 &gt;0.25" 或 &lt;38°F 时零流量，</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">并自动同步灌溉分表读数申报市政 Sewer-Deduct 排污费减免，11ms 拦雨天瞎喷。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 无冻裂电磁阀 $18 膜片优先锁 + 树木 DBH 药瓶毫升守恒锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">凡阀体无冰冻开裂一律锁定 $18 顶盖橡胶膜片更换；树干注药强制核对单株 GPS 胸径</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">(DBH Inches) 与 EPA 原厂药瓶毫升数闭环，14ms 封杀 $280 假换阀与虚报株数。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#06B6D4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 ISA 树艺师执照与 ANSI A300 (265ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">265ms 在线穿透核验现场负责人 ISA Certified Arborist 国际注册树艺师证号、州农药</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">施用许可证并严禁 ANSI A300 违章砍头截干 (Topping)，守住园区树木资产安全。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动将 $280 换整阀降级为 $18 膜片并按实测 DBH 核销注药 (230ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将未裂电磁阀降级为 $18 膜片包、剔除虚报注药株数并锁定分表排污费减免：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $112,000.00 → 自动核减 $16,800.00 (15.0%) → 净付 $95,200.00！</text>


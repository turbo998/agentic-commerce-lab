  <!-- Header -->
  <text x="48" y="58" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 342 · B2B COMMERCIAL IRRIGATION (WATERSENSE ET), SEWER-DEDUCT SUB-METERING &amp; ISA TREE CARE</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">商业园区智能喷灌、免排污费分表与乔木修剪：雨天闭锁、$18 膜片降级锁 vs 白交排污费与砍头毁树</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_commercial_irrigation_et_controller_sewer_submeter_isa_arborist_mandate_2026 · 15.0% Savings ($16,800 / Batch)</text>

  <!-- Left Panel: Legacy Commercial Irrigation & Tree Care Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业园区喷灌与乔木养护四大黑洞 (Legacy Irrigation Leakage: 32%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 短接雨感器致暴雨天喷灌照常狂喷，且漏报分表白交 60% 市政排污费 ($25,000/夏)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">把 EPA WaterSense 智能气象控制器改成死板定时模式，大雨天喷头还在喷水；且未按月</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">向水务局申报灌溉分表免排污费 (Sewer-Deduct Credit)，渗入泥土的水全交了高价排污费。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 电磁阀关不严仅因 $18 橡胶膜片卡沙子，却虚报 $280/个 挖土更换整套阀门</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Hunter ICV / Rain Bird PEB 商用电磁阀只需拧开顶盖 4 颗螺丝花 5 分钟换一片 $18</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">橡胶膜片 (Diaphragm)，外包商却每次开单收 $280 破土锯管换新阀，喷嘴堵了报换整头。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 树干微孔注药只打门口 20 棵，账单却按全园 150 棵 × $180 ($27,000) 虚报</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">欺负物业不会逐棵去数树干底部的针眼，也无法核实打进去的是甲维盐原液还是自来水，</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">不记录单株胸径 (DBH) 与空药瓶批号，虚报 5 倍注药株数骗取高额植保费。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 无 ISA 树艺师执照野蛮“砍头截干 (Tree Topping)”，致大树空心腐烂断枝砸车</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">违反 ANSI A300 国家树木修剪规范，把大树主冠直接锯平变成“电线杆”，导致主干</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">心材腐烂并疯长脆弱丛生水芽，三年后遇台风整枝劈裂砸毁停车场豪车与行人。</text>

  <!-- Right Panel: Agentic ET/Sub-Meter Lock + Diaphragm/DBH Gate + Web IQ ISA Architecture -->
  <rect x="616" y="132" width="540" height="395" rx="12" fill="#0F1E2E" stroke="#10B981" stroke-width="1.5"/>

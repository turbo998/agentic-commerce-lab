  <rect width="1200" height="675" fill="url(#bg225)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#amb225)"/>
  <text x="159" y="57" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 223 · HAZMAT UN38.3 &amp; IMDG</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">B2B 危化品与锂电池跨境物流 UN 38.3、SoC ≤30% 荷电红线与海运 IMDG 隔离架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">全货机 CAO 锁死 + 9x9 IMDG 化学隔离矩阵令牌 (`b2b_hazmat_dg_un383_soc30_imdg_segregation_mandate_...`) vs 普货瞒报遭 FAA 重罚</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red225)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：危化品当普货瞒报 + 85% 满电上客机 + 氧化剂易燃物同柜混装</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 为省 $200 危险品费将锂电池伪报成普货或订入客机腹舱：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• UN 3480 纯锂电池严禁装入客机腹舱 (必须走 CAO 全货机) 且必须附 UN 38.3 报告；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 一旦安检被查或高空冒烟，面临 FAA/PHMSA 每单 $99,756–$232,762 重罚与刑责！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 85% 高荷电状态 (SoC &gt; 30%) 上机 + 海运拼箱违反 IMDG 隔离表：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 5.1 类氧化剂与 3 类易燃液混装一柜引发海运集装箱起火与数亿美元共同海损追偿。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 缺失 16 项 GHS SDS 安全数据表或 49 CFR § 172.604 24h 应急电话：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 目的港海事局直接扣柜退运，产生每天 $500+/柜的天价危险品码头滞港费。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms Undeclared/PAX) | HTTP 422 (14ms SoC&gt;30% / IMDG)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#amb225)"/>
  <text x="890" y="161" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：UN 38.3 签名锁 + SoC ≤30% 门禁 + IMDG 7.2 隔离矩阵网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. BOM/CAS 穿透识别 + UN 38.3 签名核验 + UN 3480 锁定 CAO 全货机：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 硬拦截任何危化品伪报普货与客机腹舱违规订舱，100% 校验 T.1–T.8 试验哈希；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动生成符合 IATA DGR 第67版规范的电子危险品申报单 (e-DGD)！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 产线 BMS 下线荷电状态 SoC ≤ 30% + 海运 9x9 IMDG 隔离矩阵：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 14ms 阻断超充锂电上机，并对拼箱同柜所有 UN 编号执行两两化学相容性布尔校验。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms GHS SDS 与合规拼箱增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 绑定 CHEMTREC 24h 应急电话并免除退关罚金与危化品滞港费，单批立省 $72,800.00！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $910k HazMat/DG) | HTTP 409 ($72.8k Fine/Demurrage Saved)</text>


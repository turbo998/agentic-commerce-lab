  <text x="54" y="584" class="body">• 必须将 30G 零擦碰、靶面铼含量 (&gt;=9.5%)、CZT 零极化、余辉 (&lt;=0.01%) 与 UDI 双码防伪绑定为智能托管解锁谓词。</text>

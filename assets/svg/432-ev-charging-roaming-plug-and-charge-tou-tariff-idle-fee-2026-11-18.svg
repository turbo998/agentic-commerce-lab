  <!-- Header -->
  <text x="52" y="58" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · ROUND 430 · EV SUPERCHARGING ROAMING (OCPI), ISO 15118 PLUG &amp; CHARGE, TOU &amp; IDLE-FEE AGENT</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">新能源充电网络与车队补能“即插即充 (ISO 15118)、分时电价寻优与超时占位费”Agent 架构</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">ISO 15118 证书握手防假贴纸二维码钓鱼 · 按剩余 SoC 精准冻结秒解冻 · 空站免收超时占位费 · 立省 $40,700.00 (22.0%)</text>

  <!-- Left Column: EV Charging Pitfalls -->
  <rect x="48" y="132" width="352" height="390" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="162" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统公共充电与车队补能三大痛点</text>

  <rect x="64" y="178" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>

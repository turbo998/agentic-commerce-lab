  <text x="850" y="222" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Hold = (1 - 当前SoC) × 电池容量 × 电价 × 1.1</text>
  <text x="850" y="242" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 占位费前提：占用率 &gt;=50% 且超 5m 宽限期</text>

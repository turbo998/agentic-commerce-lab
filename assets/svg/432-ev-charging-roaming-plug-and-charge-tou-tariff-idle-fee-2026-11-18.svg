  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 骗子用高仿贴纸覆盖桩体静态二维码骗走车主信用卡号</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 车队司机拿公司加油/充电卡给私家车充电套现</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 缺乏车机 VIN 证书与 GPS 同框核验，盗刷损失惨重!</text>

  <rect x="64" y="288" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="310" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 充 $10 电死冻 $75 一周 &amp; 半夜空站强罚占位费</text>
  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 不看车辆剩余电量一律顶格冻结 $75，占满车主信用卡额度</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 凌晨 2 点全站 20 根桩空着 18 根，仍按 $1/分钟罚占位费</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 或充电枪机械锁死拔不出来却照收占位罚金引发拒付!</text>

  <rect x="64" y="398" width="320" height="106" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="420" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 跨峰谷时段按最高价一刀切 &amp; 坏桩吞预付款</text>
  <text x="78" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 22:50 插枪充到 23:40，整单全按 22:50 尖峰高价算</text>
  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 坏桩握手失败充入 0 度电，预扣款却卡在平台不秒退</text>
  <text x="78" y="480" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 传统车队补能溢价与占位费拒付基线：$185,000 / 季度</text>


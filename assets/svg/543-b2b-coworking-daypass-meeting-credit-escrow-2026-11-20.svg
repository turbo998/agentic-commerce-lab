  <rect width="1200" height="675" fill="url(#bg543)"/>
  <rect x="28" y="24" width="1144" height="627" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="24" width="1144" height="6" rx="3" fill="url(#accent543)"/>

  <!-- Header -->
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUND 100 · SVG 543 · B2B COWORKING, ON-DEMAND DAY-PASS &amp; MEETING-CREDIT ESCROW</text>
  <text x="56" y="100" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Flexible Workspace Agent: Zero Exit-Fee Lock, Credit Rollover &amp; Pay-on-Tap Pool</text>
  <text x="56" y="126" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">WeWork / Regus IWG / Industrious / LiquidSpace / Gable — Blocking $150/Desk Exit Fees, Expiring Room Credits &amp; Ghost Passes</text>
  <rect x="960" y="54" width="184" height="36" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="1052" y="77" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">36% WORKSPACE SAVED</text>

  <!-- Left Panel: 3 Commercial Traps -->
  <rect x="52" y="150" width="345" height="475" rx="14" fill="#111827" stroke="#ef4444" stroke-width="1.2"/>
  <text x="72" y="182" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. Coworking &amp; Flex-Office Traps</text>

  <rect x="70" y="200" width="309" height="126" rx="10" fill="#1f2937" stroke="#dc2626" stroke-width="1"/>
  <text x="84" y="224" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap A: 18% Step-Up &amp; $150/Desk Exit Fee</text>
  <text x="84" y="246" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 90-day notice trap auto-renews suite at +18%</text>
  <text x="84" y="266" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Deducts $150/desk "Suite Refresh/Paint" + $95</text>
  <text x="84" y="286" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  IT de-activation + $79/seat mandatory coffee</text>
  <text x="84" y="306" fill="#fca5a5" font-family="Consolas, monospace" font-size="11">Guard: HTTP 403 ZERO_EXIT_FEE_AND_ALL_IN_DESK</text>

  <rect x="70" y="340" width="309" height="126" rx="10" fill="#1f2937" stroke="#f97316" stroke-width="1"/>
  <text x="84" y="364" fill="#fed7aa" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap B: Expiring Credits &amp; &lt;5d All-Access</text>
  <text x="84" y="386" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Monthly meeting credits expire Day 30, then</text>
  <text x="84" y="406" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  bills $85/hr cash overage for 6-person room</text>
  <text x="84" y="426" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Pays $299/m pass for staff visiting 2 days/mo</text>
  <text x="84" y="446" fill="#fdba74" font-family="Consolas, monospace" font-size="11">Guard: HTTP 422 CREDIT_ROLLOVER_AND_5D_AUDIT</text>

  <rect x="70" y="480" width="309" height="124" rx="10" fill="#1f2937" stroke="#a855f7" stroke-width="1"/>
  <text x="84" y="504" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap C: Master-Lease Lockout &amp; Open Wi-Fi</text>
  <text x="84" y="526" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Operator defaults on master building lease</text>
  <text x="84" y="546" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  (retainer lost) or shared unisolated PSK Wi-Fi</text>
  <text x="84" y="566" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Stale mandate signing key (&gt;180 days)</text>
  <text x="84" y="586" fill="#d8b4fe" font-family="Consolas, monospace" font-size="11">Guard: HTTP 451 WEBIQ_LEASE_DEFAULT_OR_VLAN_HOLD</text>

  <!-- Center Panel: Deterministic Control Plane -->
  <rect x="419" y="150" width="362" height="475" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="439" y="182" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. Deterministic Flex-Workspace Escrow</text>

  <rect x="439" y="202" width="322" height="82" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="455" y="226" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 1 · 30D NOTICE &amp; $0 RESTORATION LOCK</text>
  <text x="455" y="248" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Bans $150/desk exit paint/IT fees, caps retainer</text>
  <text x="455" y="268" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12">at 1 month &amp; blocks $79/seat coffee add-ons</text>

  <rect x="439" y="298" width="322" height="86" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
  <text x="455" y="322" fill="#a5b4fc" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 2 · 90D CREDIT POOL &amp; 5-DAY GATE</text>
  <text x="455" y="344" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Pools room credits across company (90d rollover)</text>
  <text x="455" y="364" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">&amp; downgrades &lt;5d/mo passes to $29 Day Pass</text>

  <rect x="439" y="398" width="322" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="455" y="422" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 3 · WPA3-802.1X VLAN &amp; SNDA LOCK</text>
  <text x="455" y="444" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Verifies private 802.1X VLAN isolation &amp;</text>
  <text x="455" y="464" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">landlord Non-Disturbance (SNDA) escrow protection</text>

  <rect x="439" y="502" width="322" height="102" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="455" y="526" fill="#fcd34d" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 4 · PAY-ON-TAP DAY-PASS POOL (409)</text>
  <text x="455" y="548" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Replaces empty private suites &amp; $299 memberships</text>
  <text x="455" y="568" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">with Gable/Desana/LiquidSpace Pay-on-Tap ($29/d)</text>
  <text x="455" y="588" fill="#fde68a" font-family="Consolas, monospace" font-size="12">Quarterly Savings: $57,600 / $160,000 (36.0%)</text>

  <!-- Right Panel: 5-Lane HTTP Verdicts & Platform Matrix -->
  <rect x="803" y="150" width="345" height="475" rx="14" fill="#111827" stroke="#10b981" stroke-width="1.2"/>
  <text x="823" y="182" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">3. 5-Lane Verdicts &amp; Platform Matrix</text>

  <rect x="821" y="200" width="309" height="46" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="835" y="220" fill="#a7f3d0" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 200 · ALL_IN_SUITE_AND_VLAN_AUTHORIZED</text>
  <text x="835" y="237" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="11">Mandate: b2b_coworking_daypass_mandate_200</text>

  <rect x="821" y="254" width="309" height="46" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="835" y="274" fill="#fecaca" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 403 · EXIT_RESTORATION_OR_STEPUP_BLK</text>
  <text x="835" y="291" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11">Blocks $150/desk exit fees &amp; +18% renewal ratchet</text>

  <rect x="821" y="308" width="309" height="46" rx="8" fill="#431407" stroke="#f97316" stroke-width="1"/>
  <text x="835" y="328" fill="#fed7aa" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 422 · ROOM_OVERAGE_OR_GHOST_PASS_BLK</text>
  <text x="835" y="345" fill="#fdba74" font-family="Segoe UI, Arial, sans-serif" font-size="11">Blocks $85/hr room overage &amp; &lt;5d/mo $299 passes</text>

  <rect x="821" y="362" width="309" height="46" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
  <text x="835" y="382" fill="#e9d5ff" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 451 · WEBIQ_MASTER_LEASE_DEFAULT_HOLD</text>
  <text x="835" y="399" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="11">Holds retainer on landlord default or open Wi-Fi</text>

  <rect x="821" y="416" width="309" height="50" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="835" y="436" fill="#fde68a" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 409 · PAY_ON_TAP_POOL_AND_LIQUIDSPACE</text>
  <text x="835" y="455" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="11">$29 pay-on-tap pool + LiquidSpace rooms (-36%)</text>

  <!-- Platform Summary -->
  <rect x="821" y="478" width="309" height="126" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="835" y="500" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Platform Selection Matrix:</text>
  <text x="835" y="520" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Gable / Desana / LiquidSpace: Pay-on-tap pass</text>
  <text x="835" y="538" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Industrious / WeWork: All-inclusive vs credits</text>
  <text x="835" y="556" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Regus (IWG) / Spaces: Watch exit &amp; coffee fees!</text>
  <text x="835" y="574" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• KrSpace (氪空间) / BeePlus: China flex suites</text>
  <text x="835" y="592" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11">Provenance: synthetic · reproduced=False</text>

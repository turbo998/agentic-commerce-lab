<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg274" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#271c19"/>
    </linearGradient>
    <linearGradient id="accent274" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dangerGrad274" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad274" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg274)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="490" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="289" y="55" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">ROUND 272 · CORRUGATED PACKAGING TAPPI ECT, RISI INDEX &amp; PLATE/DIE</text>
  <text x="44" y="96" fill="#f8fafc" font-size="22" font-weight="800">B2B 智能体瓦楞纸箱与冷链包装采购（Corrugated）、TAPPI ECT 边压与 RISI 原纸联动架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">高湿冷库 TAPPI T811 ECT 与原生纯木浆牛卡锁 + C/M/Y/K 分色印版刀模防重收与 105% 溢装锁 + Fastmarkets RISI 对称联动 vs. 偷换再生纸塌箱与重复收开模费</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent274)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad274)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统瓦楞纸箱粗放采购的三大失血黑洞（冷库塌箱 &amp; 溢价 7%~14%）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. 将 42磅原生纯木浆牛卡偷换成 33磅再生纸致冷库塌箱（Sub-ECT · 403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 纸箱厂为每吨原纸省 $140，把合同 100% 原生长纤木浆牛卡偷换成短纤废纸再生纸 (Testliner)</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 箱底照盖 44 ECT 假合格章；进 85% RH 冷库吸水后边压跌至 32.5，底层托盘软塌砸毁 $120k 生鲜</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 仅凭箱底自印 BMC 油墨章收货，完全漏检高湿冷链环境下的抗压崩塌隐患</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. 改 3 个黑字重收全套 $8,500 四色印版刀模费 &amp; +18% 超发塞货（422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• 首单已买断 4 色柔印树脂版与滚筒刀模；第 4 单仅修改黑色版一行小字却被重收 $8,500 全套费</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• 突破行业 ±5% 溢短装上限，强行超发 +18% 纸箱尾货逼客户全额买单并挤爆仓库</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 缺乏分色印版/刀模唯一资产台账与订单收货量 105% 自动截断门禁</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. RISI 原纸指数跌价装死不降 &amp; 独吞 28% 异形箱模切废纸（451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• Fastmarkets RISI 箱板纸涨 $70/吨时秒提 $/MSF 单价，回落 -$50/吨时却隐瞒不调降</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 开窗展示箱 (PDQ) 按整张长方形毛面积收原纸费，却独吞冲切下来的 28% OCC #11 高价废纸款</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 陷入单向涨价棘轮，且白白流失每年数十吨一号瓦楞边角料的废纸冲抵红利</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad274)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + TAPPI ECT 锁 + RISI/OCC 四重门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · 恒温恒湿 TAPPI T811 ECT 与原生木浆牛卡配比锁（拦截 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 强制校验到货抽检的 TAPPI T811 边压/T810 耐破实测值 ≥ BMC 标称值，</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">并核验 42/26/42 lb 100% 原生未漂白木浆牛卡配比；偷换再生纸 11ms 硬拦截</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · C/M/Y/K 分色印版与刀模资产去重锁 &amp; 105% 溢装门禁（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">按 SKU 锁定已买断滚筒刀模与四色柔印版台账，局部改字仅准收取单张换版费 ($650)，</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">并将 EDI 810 可结算交货数量硬截断在 PO 订单量的 105% 以内</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · Fastmarkets RISI 双向对称联动与 OCC #11 废纸回抵锁（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">按箱型展开面积与楞型消耗系数 (Take-Up Factor) 对齐当季 RISI 原纸指数涨跌，</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">并强制按 (毛面积 - 净面积) × OCC #11 废纸指数扣回异形箱模切边角料残值</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 包装批次自动清算 &amp; RISI 下调+印版去重双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">10ms 签发 agentic_corrugated_packaging_ect_... 令牌；立省 $46,400 包装费转 409</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#fbbf24" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 合规 44-ECT 包装清算</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">原生牛卡 + RISI 对齐 ($580k)</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Packaging Batch Settled · 10ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · 偷换再生纸/高湿 ECT 塌箱</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">33磅再生纸冒充 42磅原生木浆</text>
  <text x="410" y="692" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">SUB_ECT_RECYCLED_SWAP</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · 重复收印版刀模/+18%超发</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">改单色收全套 $8.5k 或超 105%</text>
  <text x="642" y="692" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">DUPLICATE_PLATE_OVERRUN</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · RISI 跌价不降/独吞废纸</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">单向棘轮或未退 28% OCC #11</text>
  <text x="874" y="692" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">ASYMMETRIC_RISI_OCC_HOLD</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · RISI 纠偏+印版去重</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">立省 $46.4k ($533.6k 净付)</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">RISI_PLATE_DEDUP_CONFIRM</text>
</svg>

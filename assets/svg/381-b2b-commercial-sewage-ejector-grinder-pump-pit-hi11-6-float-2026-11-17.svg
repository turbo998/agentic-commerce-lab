  <text x="446" y="502" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web IQ 挂起缺失 H2S/LEL 气体记录或非 NFPA 820 防爆泵 → $0.00</text>


  <rect width="1200" height="675" fill="url(#bg381)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent381)"/>

  <!-- Header -->
  <text x="48" y="58" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 379 · COMMERCIAL SEWAGE EJECTOR &amp; GRINDER PUMP PIT (ANSI/HI 11.6 / NFPA 820), DE-RAGGING &amp; $55 FLOAT GATE</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">商业建筑地下室双联污水提升泵坑维保、叶轮清缠兆欧锁与 $55 浮球/$120 止回阀清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Xylem Flygt / Liberty / Zoeller / Weil · 1000V 绕组绝缘 &gt;=100MΩ 锁 + 导轨提泵清湿巾 + 停泵零倒流 + OSHA 1910.146 四合一气体</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="64" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">🚰 四大地下污水提升泵坑机电与安全硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 提泵叶轮清湿巾 &amp; &gt;=100MΩ 兆欧锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 90% 过载跳闸源于无纺布湿巾卡死叶轮或 $55 浮球断</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 1000V 兆欧表 &gt;=100MΩ 铁证定子绕组零进水未烧毁</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截卡团湿巾就忽悠花 $9,800 换两台新泵</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. $120 止回阀瓣零倒流 &amp; $85 交替继电器</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 停泵后集水坑液位回升必查立管 $120 止回阀橡胶瓣</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 双泵不轮换仅需换控制箱内 $85 拔插式交替继电器</text>
  <text x="74" y="368" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断污水回流频繁启停与 $3,600 假换控制箱</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="426" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 机械密封油室白油检验 &amp; $220 切割刀盘</text>
  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 旋开油室检视螺丝核验透平油清澈度与湿度探针</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 研磨切割泵钝化仅需单独更换底部 $220 合金切刀环</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 延长重型铸铁潜污泵使用寿命至 10–15 年</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="540" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. Web IQ OSHA 1910.146 气体 &amp; 防爆核查</text>
  <text x="74" y="560" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• /v3/browse 核验开井前 H2S/CH4/O2/CO 四合一气体记录</text>
  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截在 NFPA 820 沼气井违规装非防爆普通泵</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 根除地下污水井硫化氢窒息与沼气闪爆特大事故</text>


  <text x="446" y="414" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截漏修 $120 止回阀致污水倒流或 $85 继电器高报 $3.6k 换柜 → $0.00</text>


  <text x="446" y="592" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">改用提泵清掏湿巾 + 换 $55 浮球 + $120 止回阀瓣立省 $19,200 → $86,800.00</text>


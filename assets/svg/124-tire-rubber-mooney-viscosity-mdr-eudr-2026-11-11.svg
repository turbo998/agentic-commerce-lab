  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="823" y="204" font-weight="700" fill="#6EE7B7">• 门尼 62 MU 与分散度 97% 放款 (200)</text>
    <text x="823" y="223" fill="#CBD5E1">  延迟：19 ms · 放款：$190,000.00 (ts2 = 6.2 min)</text>

    <text x="823" y="253" font-weight="700" fill="#FCA5A5">• 混炼胶早期焦烧 (ts2=1.8m) 死胶拦截 (403)</text>
    <text x="823" y="272" fill="#CBD5E1">  延迟：11 ms · 拒付堵死挤出机的提前交联胶</text>

    <text x="823" y="302" font-weight="700" fill="#FCA5A5">• 炭黑/白炭黑团聚 (&lt;95% 分散) 拦截 (422)</text>
    <text x="823" y="321" fill="#CBD5E1">  延迟：14 ms · 守住 EV 轮胎低滚阻与抗撕裂寿命</text>

    <text x="823" y="351" font-weight="700" fill="#FDE68A">• Web IQ 再生裂解炭黑 (rCB) 闭环套利 (409)</text>
    <text x="823" y="370" fill="#CBD5E1">  延迟：295 ms · 节省：$30,400.00 (16.0% 降本)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  143 / 143 单元测试 100% 通过 (CSP 自包含)</text>
  </g>
  <rect x="823" y="442" width="319" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="982" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">
    守住新能源车轮胎安全底线，终结焦烧死胶与毁林风险
  </text>

  <!-- Footer Banner -->
  <rect x="40" y="512" width="1120" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="541" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700" fill="#FDE047">
    🏛️ 架构师选型铁律 (Takeaway): 绝对不要按“过磅毛重”或“出厂静态化验单”盲付天然标胶 (TSR-20) 与终炼母炼胶货款！
  </text>
  <text x="60" y="565" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    必须绑定：① 到厂 ISO 289 门尼粘度与无转子硫化仪 (MDR) 焦烧时间 ts2 &gt;=4.5 min (11ms 拦 403)；② 光学切面炭黑/白炭黑分散度 &gt;=95% (14ms 拦 422)；
  </text>
  <text x="60" y="586" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    ③ Web IQ 核查欧盟 EUDR 橡胶园多边形与 REACH 环保芳烃油 (PAH &lt;=10 ppm, 285ms 拦 451)，并耦合液相湿法母炼胶与废胎热裂解炭黑 (rCB) 立省 $30,400 (295ms)。
  </text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg124" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09111D"/>
      <stop offset="50%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent124" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="cardBg124" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17273E"/>
      <stop offset="100%" stop-color="#0B1422"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg124)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent124)"/>

  <!-- Header -->
  <rect x="40" y="24" width="390" height="28" rx="14" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="235" y="43" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#FEF3C7" text-anchor="middle">
    ROUND 122 · TIRE &amp; RUBBER (MOONEY / MDR / EUDR) ESCROW
  </text>
  <text x="40" y="84" font-family="Segoe UI, Ubuntu, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">
    轮胎与天然/合成橡胶交割 (TSR-20/SSBR)、门尼粘度/MDR 焦烧与 EUDR 托管
  </text>
  <text x="40" y="111" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" fill="#94A3B8">
    ISO 289 Mooney Viscosity, MDR Scorch Time (ts2 &gt;=4.5 min), Dispergrader Carbon-Black (&gt;=95%) &amp; EUDR Polygon vs. Scorched Compound Scrap
  </text>

  <!-- Left Card: Legacy Bale Tonnage & Scorch/Wet-Cup-Lump Failure -->
  <rect x="40" y="132" width="355" height="360" rx="12" fill="url(#cardBg124)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="148" width="323" height="32" rx="6" fill="#450A0A"/>
  <text x="217" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">
    ❌ 传统按标胶吨数盲付与早期焦烧报废踩坑
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 密炼混炼胶早期焦烧 (Scorch ts2 &lt; 2min) 死在挤出机</text>
    <text x="58" y="224" fill="#CBD5E1">• 海运高温集装箱致终炼胶提前交联，收走 $190,000</text>
    <text x="58" y="242" fill="#CBD5E1">• 门尼粘度飙升 &gt;85 MU，上胎面挤出机直接卡死整批报废</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 炭黑/白炭黑分散度不足 (&lt;85%) 致高速爆胎</text>
    <text x="58" y="294" fill="#CBD5E1">• 密炼机偷减混炼时间，硅烷偶联反应不完全存在微米团聚体</text>
    <text x="58" y="312" fill="#CBD5E1">• EV 重载轮胎滚动阻力大增且胎肩应力集中引发脱层爆胎</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 胶块夹心污水/树皮或触犯欧盟 EUDR 毁林法案</text>
    <text x="58" y="364" fill="#CBD5E1">• 20号标胶 (TSR-20) 塑性保持率 PRI &lt; 40% 极易老化</text>
    <text x="58" y="382" fill="#CBD5E1">• 缺失东南亚/西非小农橡胶林 EUDR GeoJSON 多边形遭欧盟扣货</text>
  </g>
  <rect x="58" y="442" width="319" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="217" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg446" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent446" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg446)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent446)"/>

  <!-- Header -->
  <text x="52" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · PRE-PURCHASE ANTI-WRONG-BUY GATE · VISA AGENTIC COMMERCE BENCHMARK (42.8% FAIL / 54% WRONG BUY)</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">面向“54% 错误仍误下单”的智能体购前防买错护栏架构选型 (Visa Benchmark 启示录)</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">破解 Visa 评测 22 模型 42.8% 失败率 · 拦截缺货近似品私自替换 · 规格/尺码/全包价精确断言 · 立省 $78,000 (25.0%)</text>

  <!-- Left Column: Visa Benchmark Failure Modes -->
  <rect x="48" y="132" width="352" height="390" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="162" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ Visa 评测揭示的裸跑购物 Agent 三大灾难</text>

  <rect x="64" y="178" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 42.8% 任务失败，且 54% 失败运行仍强行下单</text>
  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Visa 评测 12 实验室 22 模型：遇断码/缺货时模型患“完成强迫症”</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 偷偷把“无糖燕麦奶”换成“含乳糖全脂奶”或买错尺码直接付款</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 54% 的推理失败最终变成了真实扣款的错单与拒付!</text>

  <rect x="64" y="288" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="310" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 仅看商品裸价忽略运费/税费/服务费导致超预算</text>
  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 用户要求“总价不超过 $100”，模型挑了 $95 商品直接点支付</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 结账最后一步加上 $18 运费与 $9 税费变成 $122 仍照扣不误</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 忽略送达日期约束 (如周五婚礼前必达却买了下周达商品)!</text>

  <rect x="64" y="398" width="320" height="106" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="420" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 赞助商广告牌/高仿副厂配件混淆型号</text>
  <text x="78" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 搜索排第一的 Sponsored 广告实为不兼容型号或第三方高仿件</text>
  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 未做 14位 GTIN 与必选属性集 (Must-Have Predicates) 逐项对齐</text>
  <text x="78" y="480" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 传统 Agent 买错退货与拒付赔偿损耗基线：$312,000 / 季度</text>

  <!-- Center Column: 5-Lane Deterministic Gate -->
  <rect x="420" y="132" width="380" height="390" rx="12" fill="#0F2238" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="440" y="162" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">🛡️ 购前确定性防买错 (Pre-Purchase Verifier) 五车道门禁</text>

  <rect x="436" y="178" width="348" height="56" rx="8" fill="#091526" stroke="#EF4444" stroke-width="1.2"/>
  <text x="450" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · 拦截未经授权的静默近似品/尺码替换 (9ms)</text>
  <text x="450" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">强制校验硬约束谓词 (尺码/过敏原/GTIN)，不符即停绝不凑合付款</text>

  <rect x="436" y="244" width="348" height="56" rx="8" fill="#091526" stroke="#F97316" stroke-width="1.2"/>
  <text x="450" y="266" fill="#FB923C" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · 拦截含税运全包价超预算或送达晚点 (12ms)</text>
  <text x="450" y="286" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">核验 All-In Total &lt;= Budget 且预计送达日早于用户硬截止期</text>

  <rect x="436" y="310" width="348" height="56" rx="8" fill="#091526" stroke="#A855F7" stroke-width="1.2"/>
  <text x="450" y="332" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 · 拦截详情页规格矛盾与超 180d 密钥 (250ms)</text>
  <text x="450" y="352" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">Web IQ /v3/browse 核出标题与参数表冲突或密钥 &gt;180d 立即挂起</text>

  <rect x="436" y="376" width="348" height="58" rx="8" fill="#091526" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="450" y="398" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🧑‍⚖️ HTTP 409 · 缺货优雅暂停 + 候选平替卡片确认 (210ms)</text>
  <text x="450" y="418" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="11">将 54% 盲目错买率压降至 0% 立省 $78,000 → 净值 $234,000</text>

  <rect x="436" y="444" width="348" height="60" rx="8" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
  <text x="450" y="468" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · 规格/全包价/时效四重断言 100% 匹配成交 (10ms)</text>
  <text x="450" y="488" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="11">签发绑定 SKU 哈希的受托支付令牌 ($312,000 批次)</text>

  <!-- Right Column: Quantitative Metrics -->
  <rect x="820" y="132" width="332" height="390" rx="12" fill="#0B2420" stroke="#10B981" stroke-width="1.5"/>
  <text x="840" y="162" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">📊 防买错护栏第一性原理</text>

  <rect x="836" y="178" width="300" height="104" rx="8" fill="#071715" stroke="#065F46" stroke-width="1"/>
  <text x="850" y="200" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🔒 四重购前硬断言 (4-Tuple Assert)</text>
  <text x="850" y="222" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 规格断言：SKU 属性集 ⊇ 用户必选约束集</text>
  <text x="850" y="242" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 金额断言：商品+税+运费总和 ≤ 预算上限</text>
  <text x="850" y="262" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 失败即停：Fail-Closed (禁签 SPT 支付令)</text>

  <rect x="836" y="294" width="300" height="104" rx="8" fill="#071715" stroke="#065F46" stroke-width="1"/>
  <text x="850" y="316" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">⚡ 对标 Visa Benchmark 提升指标</text>
  <text x="850" y="338" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 失败任务仍强行误下单率：从 54% 降至 0.0%</text>
  <text x="850" y="358" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 运费/税费隐藏超预算拦截率：100%</text>
  <text x="850" y="378" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 缺货转人工候选卡片挽回率：78.5%</text>

  <rect x="836" y="410" width="300" height="94" rx="8" fill="#071715" stroke="#10B981" stroke-width="1.5"/>
  <text x="850" y="434" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">💰 季度防买错退货与拒付止损净收益</text>
  <text x="850" y="460" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">立省 $78,000.00 (-25.0%)</text>
  <text x="850" y="484" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12">原误买退货运费与拒付损耗 $312,000 → 净值 $234,000</text>

  <!-- Footer Mandate Strip -->
  <rect x="48" y="538" width="1104" height="96" rx="10" fill="#091326" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="566" fill="#38BDF8" font-family="Consolas, monospace" font-size="13" font-weight="700">Mandate Prefix: ecommerce_pre_purchase_anti_wrong_buy_mandate_*</text>
  <text x="68" y="590" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">✅ Good Fit: 所有零售电商代购 Agent、浏览器购物助手 (Operator / Browser-use)、企业采购寻源与礼品代买智能体</text>
  <text x="68" y="614" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">⛔ Not For: 允许 LLM 在主选商品缺货时未经确认自行挑选近似替代品并直接调用支付工具 · Provenance: official_doc_snapshot + deterministic_offline_simulation</text>
</svg>

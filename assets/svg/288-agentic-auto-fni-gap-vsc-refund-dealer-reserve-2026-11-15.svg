<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg288" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent288" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg288)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent288)"/>

  <!-- Header -->
  <text x="52" y="62" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-15 · ROUND 286 · AGENTIC AUTO F&amp;I GAP/VSC EARLY-PAYOFF PRO-RATA REFUND &amp; DEALER RESERVE CAP</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">智能体汽车金融与保险 (Auto F&amp;I)：提前还贷未赚保费自动退还、反月供塞包与利差封顶架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">车贷提前结清瞬间自动计算 Pro-Rata 未赚 VSC/GAP 保费并从经销商储备池扣回 70% 佣金 · LTV&lt;80% 禁售无效 GAP · 利差封顶 &lt;=100 bps</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统 4S 店 F&amp;I 小黑屋三大乱象 (单车多花 $4,500)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 提前卖车/结清贷款时私吞 $2,100 未到期保费</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 65% 的 72 期车贷在第 30 个月因置换或转贷提前结清</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 4S 店为保住已揣进兜里的 70% 延保佣金，踢皮球拒不退保</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 导致放款银行遭 CFPB UDAAP 重罚数千万美元</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 向首付 35% 客户强卖废纸 GAP 险 + 月供塞包</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 客户贷款价值比 LTV 仅 65%，车祸全损永远不可能资不抵债</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 仍被塞入 $1,200 零理赔概率 GAP 险与 $699 车窗防盗刻字</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 报虚高基础月供掩盖 $4,800 附加品 (Payment Packing)</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 暗中加息 250 bps 吃利差回扣 (Dealer Reserve)</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 银行批发过审利率 (Buy Rate) 仅 5.49%，4S 店谎报 7.99%</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 放款当日从银行拿走 $3,400 利差折现佣金</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 推高车主月供违约率并触发 ECOA 信贷歧视监管追责</text>

  <!-- Center Card: Agentic Policy Engine -->
  <rect x="422" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="422" y="136" width="356" height="38" rx="12" fill="#1E40AF"/>
  <text x="442" y="160" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体结清自动退保、LTV 门禁与利差封顶三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#1D4ED8"/>
  <text x="452" y="210" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：提前结清 Pro-Rata 自动退保与佣金追回锁</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 生成结清账单 (Payoff Quote) 瞬间自动抵减未赚 VSC/GAP</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 自动从 4S 店月度储备池扣回 70% 未赚佣金，禁用 Rule 78s</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 阻断截留未到期退保金与违规扣费</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#1D4ED8"/>
  <text x="452" y="326" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：LTV&gt;=80% GAP 门槛、反塞包与 &lt;=100bps 利差</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 贷款 LTV&lt;80% 硬件锁定禁售无效 GAP 差额豁免险</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制裸车 vs 含附加品双月供签名，利差加点封顶 100 bps</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 拦截废纸 GAP、$699 刻字与高利差</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#1D4ED8"/>
  <text x="452" y="442" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ 州自动退保法案 (CA AB 2311) 锁</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 核验加州 AB 2311 / 科州 HB 1188 红线</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 穿透核查 NADA/Black Book 真实车价与 FTC 价格透明披露</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $47,200</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="796" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="796" y="136" width="356" height="38" rx="12" fill="#064E3B"/>
  <text x="816" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 汽车金融 F&amp;I 与结清批次 ($590,000) 实测矩阵</text>

  <rect x="812" y="188" width="324" height="60" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="826" y="210" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="826" y="232" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">Pro-Rata 退保自动冲抵 + LTV/利差合规 → 清算 $590k</text>

  <rect x="812" y="258" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="280" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="826" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">提前还贷扣留 $2,100 未赚保费或用 Rule 78s → 拦截</text>

  <rect x="812" y="328" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="826" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">LTV 65% 强卖无效 GAP 或加息 250 bps → 阻断</text>

  <rect x="812" y="398" width="324" height="60" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="826" y="420" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 (275ms) / 🧑‍⚖️ HTTP 409 (240ms)</text>
  <text x="826" y="442" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">违反 CA AB 2311 挂起 / 追回未赚佣金省 $47,200</text>

  <rect x="812" y="468" width="324" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="826" y="490" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">💡 提前结清退保追回与利差削减后净额：$542,800 (省 8%)</text>
  <text x="826" y="510" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="11">令牌：agentic_auto_fni_gap_vsc_ancillary_refund_...</text>

  <!-- Footer -->
  <rect x="48" y="556" width="1104" height="80" rx="10" fill="#020617" stroke="#334155"/>
  <text x="68" y="582" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 凡车贷提前结清、转贷或全损，系统必须自动按 Pro-Rata 冲抵未赚 GAP/VSC 保费，并直接从经销商返利储备池追回 70% 未赚佣金。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 贷款价值比 LTV &lt; 80% 严禁搭售 GAP 差额险，经销商利率加点 (Dealer Reserve) 硬封顶 &lt;=100 bps，彻底杜绝 CFPB UDAAP 罚单。</text>
</svg>

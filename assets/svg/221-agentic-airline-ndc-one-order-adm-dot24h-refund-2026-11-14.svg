  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：IATA NDC v21.3 防 ADM 门禁 + 税项字典 + DOT 自动退现网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 防 ADM 收益完整性门禁 (PNR 重订 ≤2 次 + 禁弃程甩尾)：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 硬拦截循环占座与隐藏城市甩尾路由，将航司 ADM 罚单率压降至 0.0%；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 直连 IATA NDC v21.3 / One Order 免除每张 $15–$26 传统 GDS 分销附加费！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. US DOT 24h/重大航变自动退现金 + YQ vs 政府真税精确剥离：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 延误 ≥3h(国内)/6h(国际) 自动原路退现金；自愿退票锁死 YQ 并 100% 退政府机场税。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 航协 830d 与降费增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 免除传统 GDS 渠道附加费并清零 ADM 违约罚单，单批立省 $55,200.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>

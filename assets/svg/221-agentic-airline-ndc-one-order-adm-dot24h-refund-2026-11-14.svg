  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 219 · AIRLINE NDC &amp; ANTI-ADM</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体航空票务 (IATA NDC v21.3) 防航司 ADM 罚单与 DOT 自动退票架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">防弃程甩尾 (Skiplagging) 与 PNR 洗舱 + YQ/政府税拆分 + DOT 退现令牌 (`agentic_airline_ndc_adm_dot24h_refund_mandate_...`) vs $250/张 ADM 重罚</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red221)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：高频占座洗舱/拼弃程票遭 ADM 划扣 + 航变强塞代金券违法</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. PNR 反复锁座取消 (Churning) 与弃程甩尾票 (Skiplagging)：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Agent 循环锁座 &gt;3 次或买 A-&gt;B-&gt;C 教唆用户在 B 中途溜走套利；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 航司依据 IATA 850m 直接从代理商 BSP 银行账户划扣 $250/张 ADM 罚单并封号！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 退不可退客票时误退 $280 YQ 燃油费，或吞没 $65 政府机场税：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• YQ/YR 属航司不可退附加费 (退了必遭 ADM 追缴)，而 XF/AY/UB 政府税未飞必退。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 航班延误 ≥3h/6h 拒退现金强塞代金券违反美国交通部 DOT 法令：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反 14 CFR Part 259/260 自动退现强制令，面临每单最高 $40,000+ 联邦罚款。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

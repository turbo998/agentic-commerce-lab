  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 买方故意将已出货给关联渠道的数百万颗芯片谎称为“在库未售”或虚报晶圆报废率。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 未与代工厂/封测厂 (OSAT) 的实际 Wafer-Out × KGD 出货流交叉对账，长期被逃避巨额版税！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 未通过 Calibre DRC/LVS 物理验证即释放 NRE 款致 $2,000 万流片报废</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 买方 AI 见供应商上传了压缩包即自动释放 NRE 里程碑款，未校验 EDA 物理与时序收敛零违例。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 流片前夜发现硬核内部金属层短路 (LVS Error)，被迫推迟流片窗口并损失千万级掩膜费！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">4. 触犯 BIS EAR ECCN 3E001 先进制程技术出口红线与强开源传染</text>
  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 未核验 &lt;=5nm GAA / 高速互连 IP 的 ECCN 3E001 出口许可，或混入 CERN-OHL-S 强传染开源 RTL。</text>

  <text x="684" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FDE68A">• 在 $880,000.00 半导体 IP 批次上单批立省/防漏 $70,400.00 (净结算 $809,600.00 · HTTP 409)！</text>


  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. “买一偷五”：付一次单项目授权费却私下塞进 5 颗衍生芯片流片</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 芯片设计公司花 $450k 购买仅限 1 颗 SoC 使用的 PCIe/HBM IP 授权，拿到源码后复制进 4 款衍生芯片。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 代工厂制版时无 Mask-Release Token 硅水印核验，IP 厂商白白流失 $1,350,000+ 二次授权费！</text>

  <rect x="48" y="282" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>

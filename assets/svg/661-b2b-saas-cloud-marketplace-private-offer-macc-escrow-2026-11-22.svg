  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. `CPPO` Wholesale Margin Lock (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Partner Discount + Cloud Fee Double-Hit:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Net_ISV_Proceeds = Wholesale_Price - Cloud_Fee</text>
  <text x="54" y="200" class="mono">Require `Net_ISV_Proceeds &gt;= Approved_Floor_ACV`!</text>
  <text x="44" y="223" class="body-txt">• Blocks Unauthorized Partner Resale Offers:</text>
  <text x="54" y="243" class="mono">Verify `CPPO_Partner_ID == CRM_Registered_Partner`</text>

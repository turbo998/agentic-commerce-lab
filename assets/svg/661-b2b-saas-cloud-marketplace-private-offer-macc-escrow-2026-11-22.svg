  <text x="442" y="182" class="mono">Submit Hourly Usage Within Strict `60-Min Window`</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">+ Dead-Letter Replay Before Cloud Cutoff!</text>
  <text x="432" y="223" class="body-txt">• Stops "Accepted Offer, Never Completed SSO Link":</text>
  <text x="442" y="243" class="mono">Require `x-amzn-marketplace-token` Tenant Bind</text>
  <text x="432" y="266" class="body-txt">• Eliminates orphan subscriptions where the buyer</text>

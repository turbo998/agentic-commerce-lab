  <text x="830" y="200" class="mono" fill="#f9a8d4">Before Quoting Commit-Drawdown Language in PDF!</text>
  <text x="820" y="223" class="body-txt">• Blocks Prohibited Pass-Through Billing:</text>
  <text x="830" y="243" class="body-txt">Prohibits bundling 3rd-party consulting or physical</text>
  <text x="830" y="261" class="body-txt">hardware inside a SaaS SKU (prevents delisting)</text>

  <text x="54" y="286" class="body-txt">15% partner wholesale margin + 3% AWS fee without</text>
  <text x="54" y="304" class="body-txt">realizing net revenue dropped 43%</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 CPPO_WHOLESALE_FLOOR_BREACH_OR_UNAUTH_RESELLER</text>


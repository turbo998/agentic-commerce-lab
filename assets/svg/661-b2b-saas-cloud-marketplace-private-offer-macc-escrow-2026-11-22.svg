  <text x="830" y="302" class="body-txt">non-transactable listing fails to decrement MACC</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 INELIGIBLE_MACC_EDP_LISTING_OR_PASSTHROUGH_HOLD</text>


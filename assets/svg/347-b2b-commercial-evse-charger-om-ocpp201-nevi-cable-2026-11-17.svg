  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">($85)，维保商在冷却液管路毫无泄漏时强行报废整条液冷电缆狂收 $4,800。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 无 EVITP 高压认证电工施工，且缺失 NIST HB 44 (NTEP/CTEP) 商用电表计量铅封</text>

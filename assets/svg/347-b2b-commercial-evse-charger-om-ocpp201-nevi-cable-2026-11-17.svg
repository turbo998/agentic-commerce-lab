  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">PLC 握手失败的“僵尸桩 (Zombie Chargers)”，车主根本充不上电却白付全额 SLA 管理费。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 路人误按红色蘑菇急停按钮 (E-Stop)，技师拧一下 3 秒复位却谎收 $1,450 大修费</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">有人顺手按下了桩体侧面的红色急停开关，技师到场连机柜门都没开，顺时针拧 1/4 圈</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">弹起按钮即恢复正常，转头却开出 $1,450“高压直流接触器与绝缘监测模块抢修单”。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 充电枪头塑料锁扣摔断 ($85 快换件)，被虚报为 $4,800 更换整条 350kW 液冷枪线</text>

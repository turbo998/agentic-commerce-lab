  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业充电桩与超充站运维四大黑洞 (Legacy EVSE O&amp;M Leakage: 32%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 枪头碎了/刷卡器死机，却靠 4G 网卡 Ping 得通谎报“99.5% 可用率”照收月费</text>

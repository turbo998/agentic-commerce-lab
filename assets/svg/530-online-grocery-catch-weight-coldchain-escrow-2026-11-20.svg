  <rect width="1200" height="675" fill="url(#bg530)"/>
  <rect x="28" y="24" width="1144" height="627" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="24" width="1144" height="6" rx="3" fill="url(#accent530)"/>

  <!-- Header -->
  <text x="56" y="68" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUND 87 · SVG 530 · ONLINE GROCERY, CATCH-WEIGHT PRE-AUTH &amp; COLD-CHAIN ESCROW</text>
  <text x="56" y="100" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Grocery &amp; Fresh Agent: &lt;=10% Catch-Weight Cap, Substitution Lock &amp; 0%-Markup Parity</text>
  <text x="56" y="126" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Instacart / Amazon Fresh / Weee! / Hema (盒马) — Blocking Expensive Substitutions, +50% Weight Creep &amp; 20% App Markups</text>
  <rect x="960" y="54" width="184" height="36" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="1052" y="77" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">22% GROCERY SAVED</text>

  <!-- Left Panel: 3 Commercial Traps -->
  <rect x="52" y="150" width="345" height="475" rx="14" fill="#111827" stroke="#ef4444" stroke-width="1.2"/>
  <text x="72" y="182" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. Online Grocery &amp; Fresh Traps</text>

  <rect x="70" y="200" width="309" height="126" rx="10" fill="#1f2937" stroke="#dc2626" stroke-width="1"/>
  <text x="84" y="224" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap A: Expensive Swap &amp; Weight Creep</text>
  <text x="84" y="246" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Shopper swaps $4.99 item for $11.99 pack to</text>
  <text x="84" y="266" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  inflate % tip; picks 2.4lb steak for 1.5lb order</text>
  <text x="84" y="286" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  capturing full 35% catch-weight pre-auth buffer</text>
  <text x="84" y="306" fill="#fca5a5" font-family="Consolas, monospace" font-size="11">Guard: HTTP 403 SUB_PRICE_AND_10PCT_WEIGHT_CAP</text>

  <rect x="70" y="340" width="309" height="126" rx="10" fill="#1f2937" stroke="#f97316" stroke-width="1"/>
  <text x="84" y="364" fill="#fed7aa" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap B: 20% App Markup &amp; Warm Trunk Thaw</text>
  <text x="84" y="386" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• App inflates shelf prices by +18% to +24% and</text>
  <text x="84" y="406" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  hides paper register receipt from customer</text>
  <text x="84" y="426" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 3-order batch leaves sashimi in trunk 85 mins</text>
  <text x="84" y="446" fill="#fdba74" font-family="Consolas, monospace" font-size="11">Guard: HTTP 422 SHELF_PARITY_AND_COLD_CHAIN_TTI</text>

  <rect x="70" y="480" width="309" height="124" rx="10" fill="#1f2937" stroke="#a855f7" stroke-width="1"/>
  <text x="84" y="504" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap C: FDA/USDA Class-I Food Recall</text>
  <text x="84" y="526" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Cart contains deli meat, leafy greens, or dairy</text>
  <text x="84" y="546" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  matching active FDA Listeria/Salmonella lot</text>
  <text x="84" y="566" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Stale mandate signing key (&gt;180 days)</text>
  <text x="84" y="586" fill="#d8b4fe" font-family="Consolas, monospace" font-size="11">Guard: HTTP 451 WEBIQ_FDA_CLASS1_RECALL_HOLD</text>

  <!-- Center Panel: Deterministic Control Plane -->
  <rect x="419" y="150" width="362" height="475" rx="14" fill="#111827" stroke="#10b981" stroke-width="1.4"/>
  <text x="439" y="182" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. Deterministic Grocery &amp; Cold-Chain Engine</text>

  <rect x="439" y="202" width="322" height="82" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="455" y="226" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 1 · SUBSTITUTION &amp; CATCH-WEIGHT LOCK</text>
  <text x="455" y="248" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Sub price &lt;= 1.05x original · Catch-weight &lt;=</text>
  <text x="455" y="268" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">1.10x requested lbs · Flat-$ tip (no % tip creep)</text>

  <rect x="439" y="298" width="322" height="86" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="455" y="322" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 2 · IN-STORE SHELF PARITY &amp; TTI GATE</text>
  <text x="455" y="344" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Verifies 0% in-app shelf markup &amp; enforces</text>
  <text x="455" y="364" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">&lt;=45m insulated cold-chain (&lt;=4°C TTI tag)</text>

  <rect x="439" y="398" width="322" height="90" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
  <text x="455" y="422" fill="#a5b4fc" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 3 · FDA / USDA FSIS GTIN RECALL SCAN</text>
  <text x="455" y="444" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Cross-checks scanned GS1-128 barcode &amp; lot</text>
  <text x="455" y="464" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">against live FDA/USDA Class-I recall feeds</text>

  <rect x="439" y="502" width="322" height="102" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="455" y="526" fill="#fcd34d" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 4 · 0%-MARKUP GROCER &amp; STORE BRAND (409)</text>
  <text x="455" y="548" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Routes basket to In-Store-Price grocers +</text>
  <text x="455" y="568" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">pre-approves private-label swaps &amp; flat tip</text>
  <text x="455" y="588" fill="#fde68a" font-family="Consolas, monospace" font-size="12">Quarterly Savings: $18,700 / $85,000 (22.0%)</text>

  <!-- Right Panel: 5-Lane HTTP Verdicts & Platform Matrix -->
  <rect x="803" y="150" width="345" height="475" rx="14" fill="#111827" stroke="#10b981" stroke-width="1.2"/>
  <text x="823" y="182" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">3. 5-Lane Verdicts &amp; Platform Matrix</text>

  <rect x="821" y="200" width="309" height="46" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="835" y="220" fill="#a7f3d0" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 200 · CATCH_WEIGHT_AND_COLD_CHAIN_OK</text>
  <text x="835" y="237" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="11">Mandate: online_grocery_coldchain_mandate_200</text>

  <rect x="821" y="254" width="309" height="46" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="835" y="274" fill="#fecaca" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 403 · SUB_UPSELL_OR_WEIGHT_CREEP_BLK</text>
  <text x="835" y="291" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11">Blocks &gt;5% sub price jump &amp; &gt;10% weight overage</text>

  <rect x="821" y="308" width="309" height="46" rx="8" fill="#431407" stroke="#f97316" stroke-width="1"/>
  <text x="835" y="328" fill="#fed7aa" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 422 · SHELF_MARKUP_OR_THAW_BLOCKED</text>
  <text x="835" y="345" fill="#fdba74" font-family="Segoe UI, Arial, sans-serif" font-size="11">Blocks 20% app catalog markup &amp; &gt;45m warm trunk</text>

  <rect x="821" y="362" width="309" height="46" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
  <text x="835" y="382" fill="#e9d5ff" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 451 · WEBIQ_FDA_CLASS1_RECALL_HOLD</text>
  <text x="835" y="399" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="11">Holds checkout on recalled Listeria/Salmonella lot</text>

  <rect x="821" y="416" width="309" height="50" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="835" y="436" fill="#fde68a" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 409 · PARITY_GROCER_AND_PRIVATE_LABEL</text>
  <text x="835" y="455" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="11">0%-markup store + private-label swap (-22% TCO)</text>

  <!-- Platform Summary -->
  <rect x="821" y="478" width="309" height="126" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="835" y="500" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Platform Selection Matrix:</text>
  <text x="835" y="520" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Instacart: Filter for "In-Store Prices" badge</text>
  <text x="835" y="538" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Amazon Fresh / Whole Foods: Direct cold-chain</text>
  <text x="835" y="556" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Weee! / Hema (盒马鲜生): Live seafood &amp; scale refund</text>
  <text x="835" y="574" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Walmart+ InHome: $0 markup + W-2 refrigerated van</text>
  <text x="835" y="592" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11">Provenance: synthetic · reproduced=False</text>

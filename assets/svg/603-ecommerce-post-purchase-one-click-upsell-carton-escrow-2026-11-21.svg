<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg603" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081326" />
      <stop offset="50%" stop-color="#0f2342" />
      <stop offset="100%" stop-color="#06101e" />
    </linearGradient>
    <linearGradient id="accent603" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21.5px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .mono { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #6ee7b7; }
      .warn { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #fca5a5; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg603)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent603)" rx="3" />

  <text x="40" y="58" class="title">支付后一键追销 (Post-Purchase 1-Click Upsell：AfterSell / ReConvert) 与同箱合单托管架构</text>
  <text x="40" y="80" class="subtitle">Round 160 · 防主单已下发 WMS 后追销变成第 2 个独立包裹倒赔运费、防重填卡号弃单 &amp; 同箱余量推荐净省 35% (SVG 603)</text>

  <!-- Left Card: 3 Post-Purchase Upsell Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大结账加购与支付后追销黑洞</text>
  <text x="56" y="164" class="card-title">1. 主单已流转仓库，追销变“第2个独立包裹” (HTTP 403)</text>
  <text x="56" y="184" class="body">• 买家付完 $80 主订单，第 1 秒 ERP 就把订单推给了 3PL 仓库打单</text>
  <text x="56" y="202" class="body">• 3 分钟后买家在感谢页点击“一键加购 $12 特惠袜子 (免运费)”</text>
  <text x="56" y="220" class="warn">• 因主单已锁，仓库被迫单独再发第 2 个包裹 (运费 $8)，净亏 -$3!</text>

  <text x="56" y="256" class="card-title">2. 追销品与主商品“在不同仓库或超首重档” (HTTP 422)</text>
  <text x="56" y="276" class="body">• 主商品在美西仓 (重 430g，差 20g 触发 USPS 1磅涨价阶梯)</text>
  <text x="56" y="294" class="body">• 追销弹窗却瞎推了一瓶 500g 的玻璃装洗发水，或推了只有美东仓</text>
  <text x="56" y="312" class="warn">  才有货的孤品 -&gt; 整箱运费暴涨 $6.50 或被迫异地拆成两箱!</text>

  <text x="56" y="348" class="card-title">3. 结账前弹窗打断支付流或感谢页挂流氓广告 (HTTP 451)</text>
  <text x="56" y="368" class="body">• 在买家点“立即支付”前强弹全屏加购窗，导致主订单转化率掉 9%</text>
  <text x="56" y="386" class="body">• 或在感谢页接入劣质外链广告网，诱导刚买完的客户点击“领免费礼卡”</text>
  <text x="56" y="404" class="warn">  结果被外部钓鱼订阅暗扣 $49/月，客户把怒火全撒在品牌身上!</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: WMS_HOLD_EXPIRED_SPLIT_PARCEL_UPSELL</text>
  <text x="70" y="502" class="warn">• HTTP 422: DIFFERENT_WAREHOUSE_OR_WEIGHT_TIER_BREACH</text>
  <text x="70" y="524" class="warn">• HTTP 451: PRE_PAY_POPUP_FRICTION_OR_SCAM_AD_WIDGET</text>
  <text x="70" y="546" class="mono">• HTTP 409:SAME_BOX_ZERO_MARGINAL_FREIGHT_UPSELL_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: ATOMIC_ORDER_EDIT_MERGED_UPSELL_200</text>
  <text x="70" y="596" class="body">铁律: 主订单下发 WMS 前必留 15m 合单缓冲窗 (`Fulfillment Hold`)!</text>

  <!-- Center Card: 4-Stage Post-Purchase Upsell & Carton-Slack Architecture -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶支付后追销合单与同箱余量托管架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#ef4444" />
  <text x="450" y="175" class="card-title" fill="#fca5a5">Gate 1: 15 分钟 WMS 挂起窗口与原单原地追加 (HTTP 403)</text>
  <text x="450" y="195" class="body">• 主单支付成功瞬间，设置 `FulfillmentOrder.status = ON_HOLD (TTL=15m)`</text>
  <text x="450" y="213" class="body">• 买家在 15m 内点击一键追销，直接通过 `Order Edit API` 追加进同一张主单!</text>
  <text x="450" y="231" class="mono">• 若超过 15m 仓库已打单拣货，自动关闭免邮追销入口 -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="282" class="card-title" fill="#38bdf8">Gate 2: 同仓现货锁与包装箱余量 (Carton Slack) 门禁 (HTTP 422)</text>
  <text x="450" y="302" class="body">• 追销候选池硬过滤: (1) 必须与主商品在 **同一个发货仓库** 有现货；</text>
  <text x="450" y="320" class="body">  (2) `Main_Weight + Upsell_Weight &lt;= Current_Carrier_Weight_Bracket`</text>
  <text x="450" y="338" class="body">  确保塞进同一个纸箱且不触发快递跨档涨价 (边际运费 = $0.00!)</text>
  <text x="450" y="354" class="mono">• 异仓商品或超重压垮快递阶梯的追销品 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: 零支付前打断与感谢页外链广告净化 (HTTP 451)</text>
  <text x="450" y="419" class="body">• 严禁在买家点击 Pay 按钮前弹出阻断式弹窗 (确保主单 100% 先落袋为安!)</text>
  <text x="450" y="437" class="body">• 追销动作位于 `Payment Confirmed -&gt; Thank You Page` 之间，复用原令牌</text>
  <text x="450" y="455" class="mono">• 支付前拦截弹窗或感谢页挂载诱导性订阅暗扣外链广告 -&gt; HTTP 451</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#10b981" />
  <text x="450" y="508" class="card-title" fill="#6ee7b7">Gate 4: 零边际运费纯毛利追销 (Zero-CAC Margin Lift) (HTTP 409)</text>
  <text x="450" y="528" class="body">• 为什么支付后追销是利润印钞机? 因为 **获客广告费 (CAC) = $0**，且</text>
  <text x="450" y="546" class="body">  塞进主订单同一个快递箱里 **边际包装与快递首重费 = $0**!</text>
  <text x="450" y="566" class="mono">• 推荐 30g 便携装/替换芯/护理液 (即使打 7 折，净毛利仍高达 65%)</text>
  <text x="450" y="586" class="mono">• 消灭二次发件运费倒挂 + 零获客成本增购 -&gt; 净增 35% 订单毛利</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大结账扩展与支付后追销引擎</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Shopify Checkout Extensibility + Post-Purchase</text>
  <text x="846" y="182" class="body">• 优势: 官方沙箱级扩展，原生支持 `Fulfillment Hold` 挂起主单等追销</text>
  <text x="846" y="198" class="body">• 特性: 复用首单 Vaulted Payment Token 实现免重输卡号 1-Click 增购</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. AfterSell / ReConvert / Zipify OCU</text>
  <text x="846" y="244" class="body">• 优势: 支持“接受第1个追销后再弹配套升级、拒绝则弹低价小样”漏斗</text>
  <text x="846" y="260" class="body">• 特性: 原生将追销行项合并写入原 Order ID，零拆单烦恼</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. Stripe Incremental Auth / Multi-Capture</text>
  <text x="846" y="306" class="body">• 优势: 在支持增量授权的卡组轨上，将主单与 3 分钟后的追销合并为</text>
  <text x="846" y="322" class="body">  单次清算 Capture，省下第 2 笔固定 `$0.30` 网关交易费!</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. 顺丰/菜鸟“15分钟合单缓冲窗”标准范式</text>
  <text x="846" y="368" class="body">• 经验: OMS 收到新订单后默认静默等待 15 分钟再推 WMS 波次</text>
  <text x="846" y="384" class="body">• 特性: 同时承接“买家改地址、加购追销、凑单合并”三大高频需求</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度追销拆包运费亏损与支付中断池 ($105,000)</text>
  <text x="860" y="456" class="body">• 传统追销变独立包裹亏运费+支付前弹窗弃单: $105,000/季</text>
  <text x="860" y="476" class="mono">• 15m WMS 挂起窗将追销 100% 合并进原包裹: -$18,900</text>
  <text x="860" y="496" class="mono">• 同仓现货+快递重量阶梯余量过滤零边际运费: -$10,500</text>
  <text x="860" y="516" class="mono">• 移至支付后一键免输卡追销消除主单弃购率: -$7,350</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净追销损耗: $68,250 (净省 $36,750 / -35%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: post_purchase_upsell_optim_409</text>
</svg>

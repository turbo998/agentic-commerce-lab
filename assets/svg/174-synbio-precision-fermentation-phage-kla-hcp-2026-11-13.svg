  <text x="54" y="538" class="card-h" fill="#38bdf8">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• 精密发酵严禁“仅看凯氏定氮粗蛋白盲付”：噬菌体倒罐死菌尸水与丢质粒杂菌同样含氮，且宿主残留蛋白 (HCP) 超标会诱发严重过敏。</text>
  <text x="54" y="584" class="body">• 必须将 qPCR 零噬菌体、质粒保留 (&gt;=98%)、活性滴度 (&gt;=12g/L)、kLa (&gt;=450) 与 HCP (&lt;=10ppm) 绑定为智能托管解锁谓词。</text>

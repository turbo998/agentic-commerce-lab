  <text x="52" y="320" class="body">宿主残留蛋白 HCP=480 ppm 涂抹/注射引发剧烈过敏。</text>

  <text x="52" y="350" class="body" fill="#fca5a5" font-weight="700">3. 活体转基因菌 (GMO) 逃逸与高蛋白废菌泥焚烧</text>

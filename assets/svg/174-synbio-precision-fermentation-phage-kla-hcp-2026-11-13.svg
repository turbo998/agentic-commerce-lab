  <text x="52" y="234" class="body">质粒的摸鱼突变菌疯长不产目标蛋白 (仅 2.8 g/L)，</text>
  <text x="52" y="252" class="body">死菌碎片照样让凯氏定氮粗蛋白“假合格”！</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. 大罐 kLa 溶氧不足产乙酸中毒与 HCP 严重过敏</text>

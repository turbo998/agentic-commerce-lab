  <text x="36" y="84" class="sub">SynBio Precision Fermentation CDMO Offtake, Zero Phage, Functional Titer (&gt;=12 g/L), kLa (&gt;=450 h^-1) &amp; HCP (&lt;=10 ppm)</text>


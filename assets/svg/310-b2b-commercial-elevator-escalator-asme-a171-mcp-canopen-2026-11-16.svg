  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">强制原厂对 15 年内停产部件免费提供向后兼容件；无 &gt;3.0G 门机冲击波形拒认人为</text>

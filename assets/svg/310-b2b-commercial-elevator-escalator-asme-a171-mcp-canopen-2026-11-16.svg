  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统电梯原厂全包维保四大黑洞 (Legacy OEM Elevator Leakage: 25%–48%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 机房“8分钟签字即走”幽灵保养 (Machine-Room Sign-and-Go Ghost Visit)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">技师背负 150 台定额，进机房在纸质本上一次性补签 8 台电梯名字，停留 8 分钟</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">即离开，全年未切入轿顶检修模式调校门锁或清扫底坑，全包月费却照收不误。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 借口“部件停产 (Obsolescence)”逃避全包免费更换 (Obsolete Part Trap)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">连交 6 年 $60,000 全包维保费后变频器或主控板故障，原厂宣称“该旧版型号已停产</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">不在全包范围”，强迫业主自费 $28,500 购买所谓“控制系统现代化升级包”。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 常规磨损甩锅“人为碰撞” + 漏保坏梯倒收 $980/h 加班费 (Callback OT)</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">门刀光幕老化一概推卸为“住户推车撞击”另收 $3,400；因平时漏保导致周五晚</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">夹门困人，技师重启 25 分钟却按 4 小时双倍加班起步价倒收 $4,200 召回费。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 漏报 ASME A17.1 Cat 1 / Cat 5 满载试验引发市政停梯罚单</text>

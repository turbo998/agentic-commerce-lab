  <text x="868" y="458" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 购前视频识别厨卫油污生成一口价严禁上门加价</text>
  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 智能门锁/BLE 在场工时核验杜绝干半截早退</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 退租保洁绑定房东 25 项验收通过才放款</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. 闲时错峰包月 + 按次SPT免充卡立省 23%</text>
  <rect x="868" y="542" width="256" height="50" rx="6" fill="#022C22" />

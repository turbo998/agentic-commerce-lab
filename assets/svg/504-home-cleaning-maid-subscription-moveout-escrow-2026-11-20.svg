  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截上门后借故“重油污/擦窗”强行加价或未经同意偷换新手阿姨</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">onsite_surcharge_pct &gt; 0.0 | assigned_cleaner_swapped = true</text>

  <rect x="434" y="352" width="362" height="72" rx="8" fill="#431407" stroke="#F97316" stroke-width="1.5" />
  <text x="450" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 422 · SHORTCHANGED_HOURS_OR_MOVEOUT_FAIL</text>
  <text x="450" y="396" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截未满约定工时提前早退或退租保洁未通过房东25项部位照片验收</text>
  <text x="450" y="413" fill="#FDBA74" font-family="Consolas, monospace" font-size="11">actual_service_minutes &lt; booked | landlord_checklist_passed = false</text>


  <text x="76" y="352" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2. 4 小时服务偷工减料干 2 小时就走与房东扣押金</text>
  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 购买 4 小时深度保洁，保洁员敷衍擦完表面 2.5 小时就点</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  完工；或退租保洁漏擦油烟机/踢脚线致房东仍扣 $400 押金</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：智能门锁/BLE 在场时长核验 + 退租保洁</text>

  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">家政保洁、钟点工包月与退租开荒保洁：防上门坐地起价、防早退缩水与房东验收托管</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Handy / Thumbtack / 天鹅到家 / 自如家服 / 轻喜到家 vs 视频定损一口价 vs 房东退租验收锁 vs 固定熟手包月省 23%</text>

  <!-- Left Panel: 3 Core Residential Cleaning & Maid Service Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 家政保洁与退租开荒三大消费陷阱</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. $99 退租保洁引流，进门后坐地起价要收 $380</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 团购标价 $99 全屋深度保洁，保洁员进门后指着烤箱和</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  玻璃窗称属“重度油污/高空”强收 $280 私下转账加价费</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：下单前视频扫描厨卫油污生成一口价包干</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  + 严禁上门临时加价(&gt;10% 直接熔断) (HTTP 403)</text>


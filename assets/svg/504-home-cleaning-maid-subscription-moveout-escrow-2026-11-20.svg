  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 强酸洗坏天然大理石台面拒赔与包月熟手寻优</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 无证游击队用洁厕灵强酸腐蚀万元天然大理石台面后拉黑</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ 家政险($100k 家财损坏险)与无犯罪核查(451)</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 锁定同一好评熟手阿姨双周包月 + 闲时错峰(周二至</text>
  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  周四午间)随用随扣免充值卡跑路立省 23% (HTTP 409)</text>


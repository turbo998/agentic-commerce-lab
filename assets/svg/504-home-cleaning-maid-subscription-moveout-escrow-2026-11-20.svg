  <text x="450" y="497" fill="#D8B4FE" font-family="Consolas, monospace" font-size="11">property_damage_bond_active = false | key_age &gt; 180d</text>

  <rect x="434" y="520" width="362" height="88" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.5" />
  <text x="450" y="544" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 409 · OFFPEAK_RECURRING_CADENCE_AND_PAY_PER_VISIT</text>

  <rect width="1200" height="675" fill="url(#bg457)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent457)"/>

  <!-- Header -->
  <text x="52" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · FLEXIBLE WORKSPACE &amp; COWORKING AGENT · BADGE TELEMETRY, GHOST-DESK DOWNSIZE &amp; 15M ROOM RELEASE</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">企业灵活办公与联合办公采购 (WeWork / IWG Regus) 门禁活跃度缩容与会议室释放架构</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">60天续约通知窗口硬提醒 · 门禁刷卡识别 &lt;2天/周僵尸固定工位转流动卡 · 会议室 15m 未签到秒退积分 · 立省 $69,600 (29.0%)</text>

  <!-- Left Column: Coworking Procurement Pitfalls -->
  <rect x="48" y="132" width="352" height="390" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="162" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统企业联合办公与会议室预订三大浪费</text>

  <rect x="64" y="178" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 错过“提前 60 天书面解约期”被按挂牌价自动锁死 1年</text>
  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 联合办公合同暗藏 60–90 天自动续约锁死条款 (Evergreen Clause)</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 到期自动取消首年 7 折优惠，按门市全价翻倍扣款 12 个月</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 离职员工未及时注销 All-Access 通行卡，每月继续白扣 $299!</text>

  <rect x="64" y="288" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="310" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 为居家销售租 $900/月专属工位，月均刷卡仅 2.5 天</text>
  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 缺乏门禁闸机 (HID/Brivo) 刷卡遥测与工位租金的比对</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 45% 固定专属工位长期空置，单次到店日均成本高达 $360</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 会议室被员工随手占满一天却爽约不去，扣光公司月度点数池!</text>

  <rect x="64" y="398" width="320" height="106" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="420" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 退租时“墙面恢复原状费 (Dilapidations)”漫天要价</text>
  <text x="78" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 运营商以“玻璃贴膜清理/网络布线复原”为名强扣 2 个月押金</text>
  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 超额打印、超时空调费 ($150/h) 未经行政确认直接从公卡划走</text>
  <text x="78" y="480" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 传统企业灵活办公空置与幽灵会议室损耗基线：$240,000 / 季度</text>

  <!-- Center Column: 5-Lane Deterministic Gate -->
  <rect x="420" y="132" width="380" height="390" rx="12" fill="#0F2238" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="440" y="162" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">🛡️ 门禁遥测缩容与会议室释放五车道确定性门禁</text>

  <rect x="436" y="178" width="348" height="56" rx="8" fill="#091526" stroke="#EF4444" stroke-width="1.2"/>
  <text x="450" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · 拦截离职员工通行卡扣费或静默翻倍续约 (9ms)</text>
  <text x="450" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">HRIS 离职秒撤门禁卡，且在 60天通知期前强制锁死自动涨价续约</text>

  <rect x="436" y="244" width="348" height="56" rx="8" fill="#091526" stroke="#F97316" stroke-width="1.2"/>
  <text x="450" y="266" fill="#FB923C" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · 拦截僵尸固定工位续租或幽灵会议室扣点 (12ms)</text>
  <text x="450" y="286" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">周均刷卡 &lt;1.5天自动降级按次热桌卡，且会议室 15m 未签到秒释放</text>

  <rect x="436" y="310" width="348" height="56" rx="8" fill="#091526" stroke="#A855F7" stroke-width="1.2"/>
  <text x="450" y="332" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 · 拦截大业主停业退租风险与超 180d 密钥 (250ms)</text>
  <text x="450" y="352" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">Web IQ 实时监控联合办公空间欠租停业公告并保护押金池</text>

  <rect x="436" y="376" width="348" height="58" rx="8" fill="#091526" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="450" y="398" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🧑‍⚖️ HTTP 409 · 固定套间缩容转混合热桌 + 15m 释放退点 (210ms)</text>
  <text x="450" y="418" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="11">砍掉 45% 空置专属工位与爽约点数浪费立省 $69,600 → $170,400</text>

  <rect x="436" y="444" width="348" height="60" rx="8" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
  <text x="450" y="468" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · 门禁活跃度对齐 + 封顶点数池结算闭环 (10ms)</text>
  <text x="450" y="488" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="11">零离职幽灵卡 + 退租复原费封顶锁 ($240,000 批次)</text>

  <!-- Right Column: Quantitative Metrics -->
  <rect x="820" y="132" width="332" height="390" rx="12" fill="#0B2420" stroke="#10B981" stroke-width="1.5"/>
  <text x="840" y="162" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">📊 灵活办公治理第一性原理</text>

  <rect x="836" y="178" width="300" height="104" rx="8" fill="#071715" stroke="#065F46" stroke-width="1"/>
  <text x="850" y="200" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🪪 工位与热桌切换平衡点公式</text>
  <text x="850" y="222" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 固定工位月租 $850 vs. 日通卡 $35/天</text>
  <text x="850" y="242" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 平衡点：月均刷卡 &lt; 14天必转流动热桌卡</text>
  <text x="850" y="262" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 会议室：开会 +15m 无人刷门禁即退回积分</text>

  <rect x="836" y="294" width="300" height="104" rx="8" fill="#071715" stroke="#065F46" stroke-width="1"/>
  <text x="850" y="316" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">⚡ 实测空间利用率与成本指标</text>
  <text x="850" y="338" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 离职员工幽灵通行卡扣费率：0.0%</text>
  <text x="850" y="358" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 会议室爽约空置率：从 32% 压降至 4.5%</text>
  <text x="850" y="378" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 错过 60天通知期被动高价续约率：0.0%</text>

  <rect x="836" y="410" width="300" height="94" rx="8" fill="#071715" stroke="#10B981" stroke-width="1.5"/>
  <text x="850" y="434" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">💰 季度企业灵活办公采购净收益</text>
  <text x="850" y="460" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">立省 $69,600.00 (-29.0%)</text>
  <text x="850" y="484" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12">原僵尸工位与会议室超支 $240,000 → 净值 $170,400</text>

  <!-- Footer Mandate Strip -->
  <rect x="48" y="538" width="1104" height="96" rx="10" fill="#091326" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="566" fill="#38BDF8" font-family="Consolas, monospace" font-size="13" font-weight="700">Mandate Prefix: coworking_flexible_office_rightsizing_mandate_*</text>
  <text x="68" y="590" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">✅ Good Fit: 跨国企业混合办公采购 (WeWork All-Access / IWG Regus / Industrious / 贝壳商办)、门禁遥测工位优化与会议室按需预订</text>
  <text x="68" y="614" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">⛔ Not For: 不看门禁刷卡率盲目按人头1:1续租固定工位、忽略 60天解约通知期或任由会议室爽约烧光点数 · Provenance: official_doc_snapshot + deterministic_offline_simulation</text>

  <rect width="1200" height="675" fill="url(#bg234)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#sil234)"/>
  <text x="159" y="57" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 232 · FOUNDRY KGD &amp; E142</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">B2B 半导体晶圆代工与 CoWoS 封测 KGD 良率走廊、SEMI E142 验签与防盗产架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">ATE 机台签名 SEMI E142 + 1:1 KMS eFuse 防影子夜班令牌 (`b2b_semiconductor_foundry_kgd_yield_wafer_map_e142_mandate_...`)</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red234)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：良率暴跌仍付整片全款 + 篡改明文 E142 图谱 + 影子夜班盗产</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 篡改无签名 SEMI E142 晶圆图谱 + 私开“影子夜班 (Ghost Shift)”：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 封测厂内鬼用脚本将明文 XML 中 Bin4 次品改成 Bin1 虚报合格颗数骗取加工费；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 夜间偷拿边缘报废裸片私自封装打标卖入灰市，引发客户算力卡死机维权与价格崩盘！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 产线良率暴跌至 32% 仍按整片毛晶圆付全款 + 坏片陪葬 HBM3e：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 未做 KGD 折算白付 68% 废硅片钱；更把坏裸片封上 CoWoS 害死 8 颗高价 HBM3e。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 漏检 BIS EAR ECCN 3A090 算力密度红线或掩膜版 (Photomask) 失控：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 流片前未核验 TPP 与性能密度阈值导致价值数千万美元的 NRE 光罩被临时叫停报废。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms E142 Tamper/Ghost Shift) | HTTP 422 (14ms Bad-Die/CoWoS)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#sil234)"/>
  <text x="890" y="161" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：ATE 签名 SEMI E142 + KGD 良率走廊 + 1:1 KMS eFuse 网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 测试机台 (ATE) HSM 硬件直签 SEMI E142 + 1:1 KMS 熔丝配额锁：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 强制核验 Advantest/Teradyne 机台加密芯片签名，粉碎人工篡改 Bin1 图谱；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• KMS 仅按核定 Bin1 KGD 数量 1:1 下发 eFuse 启动根证书，私印/翻新芯片通电变砖！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. WAT ±3σ 电性门禁 + KGD 良率走廊折算 + CoWoS 仅封 Bin1 锁：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 低良率异常批自动按实际合格裸片 (KGD) 扣减结算，并严禁非 Bin1 裸片贴上 CoWoS。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 3A090 核验与防损增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动核减低良率废片并阻断坏片陪葬高价 HBM3e 显存，单批立省 $76,800.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $960k Foundry/OSAT) | HTTP 409 ($76.8k KGD/HBM Saved)</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg647" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101e"/>
      <stop offset="50%" stop-color="#0b1d33"/>
      <stop offset="100%" stop-color="#081423"/>
    </linearGradient>
    <linearGradient id="hdr647" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .body-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 11.5px; fill: #6ee7b7; }
      .kpi-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 800; }
      .kpi-lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg647)"/>
  <rect x="28" y="22" width="1144" height="68" rx="12" fill="#0f172a" stroke="url(#hdr647)" stroke-width="2"/>
  <text x="48" y="51" class="title">Round 204 · E-Commerce Gift Registry, Group Gifting &amp; Anti-Triangulation Escrow</text>
  <text x="48" y="74" class="sub">Babylist / Zola / Amazon Registry / Shopify · 20m Buying-Now Mutex · Anti-Triangulation Credit Lock · Group-Gift Pool (-35% Loss)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1081" y="59" text-anchor="middle" class="mono" fill="#a7f3d0">SVG #647 · FAQ #323</text>

  <!-- Lane 1: Stolen-Card Registry Triangulation Laundering & Completion-Discount Abuse Guard -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Anti-Triangulation &amp; Discount Lock (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Fake Wedding Registries Laundering Stolen Cards:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Gift Return Credit Locked to `KYC_Registrant_ID`</text>
  <text x="54" y="200" class="mono">Hold Gift-Credit Liquidation for 14d Post-Delivery</text>
  <text x="44" y="223" class="body-txt">• 15% Completion-Discount Abuse Shield:</text>
  <text x="54" y="243" class="mono">Require Registry_Age &gt;= 30d &amp; Exclude MAP SKUs</text>
  <text x="44" y="266" class="body-txt">• Blocks fraudsters from creating fake tomorrow-</text>
  <text x="54" y="286" class="body-txt">dated baby registries just to harvest an instant</text>
  <text x="54" y="304" class="body-txt">15% completion coupon or cash out stolen cards</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 REGISTRY_TRIANGULATION_OR_COMPLETION_GAMING_BLOCKED</text>

  <!-- Lane 2: Duplicate Gift Collision Across Multi-Store & In-Store Guests Guard -->
  <rect x="416" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. Duplicate-Gift Reservation Lock (HTTP 422)</text>
  <text x="432" y="162" class="body-txt">• Stops 3 Relatives Buying the Same $800 Stroller:</text>
  <text x="442" y="182" class="mono">20-Min `Buying_Now_Soft_Lock` on Click-Out / Cart</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">Auto-Parse External Order Receipt Email (`Order_#`)</text>
  <text x="432" y="223" class="body-txt">• Pre-Shipment "Ship-When-Ready" Hold Vault:</text>
  <text x="442" y="243" class="mono">Hold Physical Dispatch Until Couple Requests Ship</text>
  <text x="432" y="266" class="body-txt">• Eliminates 35% duplicate-gift reverse logistics</text>
  <text x="442" y="286" class="body-txt">and prevents 40 boxes arriving at the couple's</text>
  <text x="442" y="304" class="body-txt">doorstep while they are away on their honeymoon</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 DUPLICATE_GIFT_COLLISION_OR_UNSYNCED_RECEIPT_BLOCKED</text>

  <!-- Lane 3: Under-Funded Group-Gift Stranded Pool & Out-of-Stock Price Hike Lock -->
  <rect x="804" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. Group-Gift Pool &amp; Price-Jump Lock (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Stops Stranding $450 on a $900 Group-Gift Item:</text>
  <text x="830" y="182" class="mono">If `Group_Funded &lt; 100%` at Event Date:</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">Convert 100% of Pool to `Universal_Store_Credit` ($0 Fee)</text>
  <text x="820" y="223" class="body-txt">• 6-Month Registry Catalog Discontinuation Shield:</text>
  <text x="830" y="243" class="body-txt">When a registered SKU goes OOS or jumps +20% before</text>
  <text x="830" y="261" class="body-txt">the wedding, swaps to next-gen model at original price</text>
  <text x="820" y="284" class="body-txt">• Prevents awkward partial-funding deadlocks where</text>
  <text x="830" y="302" class="body-txt">neither guests nor the couple can access the money</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 STRANDED_PARTIAL_GROUP_GIFT_OR_SKU_DISCONTINUED_HOLD</text>

  <!-- Bottom Digital Gift-Reveal & Pre-Shipment Swap Architecture -->
  <rect x="28" y="374" width="1144" height="182" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="48" y="401" class="card-hdr" fill="#38bdf8">4. Digital Gift-Reveal &amp; Pre-Shipment Color/Credit Swap + Group-Gifting Engine (HTTP 409)</text>

  <rect x="48" y="418" width="255" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="62" y="440" class="card-hdr">① 20m Soft Reservation</text>
  <text x="62" y="462" class="body-txt">Locks registry item for 20m</text>
  <text x="62" y="480" class="body-txt">when a guest clicks "Buy" &amp;</text>
  <text x="62" y="498" class="body-txt">auto-ingests email receipts;</text>
  <text x="62" y="516" class="mono">-92% Duplicate Gift Collisions</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="337" y="440" class="card-hdr">② Split Group-Gifting Pool</text>
  <text x="337" y="462" class="body-txt">Lets 6 friends chip in $150</text>
  <text x="337" y="480" class="body-txt">each toward a $900 crib;</text>
  <text x="337" y="498" class="body-txt">3.1x Higher Big-Ticket Sell-Thru</text>
  <text x="337" y="516" class="mono">$0 Stranded Partial Funds</text>

  <rect x="608" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="622" y="440" class="card-hdr">③ Pre-Ship Digital Swap</text>
  <text x="622" y="462" class="body-txt">Couple unwraps gift digitally</text>
  <text x="622" y="480" class="body-txt">first &amp; can swap color or</text>
  <text x="622" y="498" class="body-txt">convert to credit BEFORE ship;</text>
  <text x="622" y="516" class="mono" fill="#6ee7b7">Saves $28/Box Return Freight</text>

  <rect x="893" y="418" width="259" height="120" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="907" y="440" class="card-hdr" fill="#6ee7b7">④ Completion-Bundle Upsell</text>
  <text x="907" y="462" class="body-txt">Unlocks 2-time 15% completion</text>
  <text x="907" y="480" class="body-txt">discount on remaining items</text>
  <text x="907" y="498" class="body-txt">60 days before baby/wedding;</text>
  <text x="907" y="516" class="mono" fill="#38bdf8">-35% Return &amp; Fraud Loss Saved</text>

  <!-- KPI Footer -->
  <rect x="28" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="46" y="604" class="kpi-num" fill="#38bdf8">-35.0%</text>
  <text x="46" y="626" class="kpi-lbl">Quarterly Duplicate Return &amp; Fraud Saved</text>
  <text x="46" y="642" class="mono">$54,250 Saved / $155k Pool</text>

  <rect x="318" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="336" y="604" class="kpi-num" fill="#10b981">Pre-Ship Swap</text>
  <text x="336" y="626" class="kpi-lbl">Digital Reveal Before WMS Dispatch</text>
  <text x="336" y="642" class="mono">Zero Two-Way Bulky Return Shipping</text>

  <rect x="608" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="626" y="604" class="kpi-num" fill="#f59e0b">3.1x Big-Ticket</text>
  <text x="626" y="626" class="kpi-lbl">Frictionless Group-Gifting Pool</text>
  <text x="626" y="642" class="mono">Auto-Converts Partial Funds</text>

  <rect x="898" y="572" width="274" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="916" y="604" class="kpi-num" fill="#f472b6">0 Triangulation</text>
  <text x="916" y="626" class="kpi-lbl">14d Gift-Credit Liquidation Hold</text>
  <text x="916" y="642" class="mono">Blocks Fake-Registry Discount Gaming</text>
</svg>

  <text x="68" y="582" fill="#FB923C" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 迷你仓租约必须通过 SPT 虚拟卡硬锁 12 个月固定价格与日历月周期，并由 Web IQ 实时抓取同店新客挂牌价消除杀熟溢价。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 自动上传既有 HO-3/商业财险 COI 100% 免除 $28/月自营租客险，并配置双支付通道与 SCRA/留置权核验严防剪锁拍卖。</text>

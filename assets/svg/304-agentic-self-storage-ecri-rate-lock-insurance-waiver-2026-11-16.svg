  <!-- Header -->
  <text x="52" y="62" fill="#FB923C" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-16 · ROUND 302 · AGENTIC SELF-STORAGE &amp; MINI-WAREHOUSE RENTAL, ANTI-ECRI STREET-RATE PARITY &amp; COI WAIVER</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">智能体自助仓储与商业迷你仓租赁：12个月锁价防 ECRI 杀熟、家财险豁免与防拍卖清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">封杀“首月 $79 入住 90天后算法暴涨 85% 割熟客 (ECRI)” · 凭现有房屋险/商业财险免除 $28/月强制租客险 · 拦截 28天周期偷收第13月</text>

  <!-- Left Card: Legacy Failure Modes -->

  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 月中搬空上传空仓照片，强制按日折算退还当月未用租金</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 拦截 $28 自营险与霸王吞没整月租金</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#C2410C"/>

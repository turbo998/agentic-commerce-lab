  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 虚拟卡硬锁定前 12 个月租金不变，严禁 90 天 ECRI 涨价</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制按标准日历月 (12期/年) 结算，封杀 28 天 13 期猫腻</text>

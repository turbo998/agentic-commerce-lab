  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统自助仓储与迷你仓三大杀熟黑洞 (多付 35%–75%)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 首月 $79 骗进仓，第 90 天 ECRI 算法暴涨 85%</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 算准客户搬一次货要花 $600 搬家费，签按月滚动活期合同</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 入驻满 90 天涨到 $145/月，满 9 个月涨到 $230/月</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 隔壁一模一样的空仓在官网招新客依然只卖 $75 (3倍杀熟)</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 拒认既有保单强扣 $28/月自营险与 28 天伪月租</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 故意退回客户已有的 HO-3 房屋险或商业财险凭证</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强绑 $28/月自营保护计划 (吃75%回扣) 且鼠咬发霉全拒赔</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 按“每 28 天”扣款一次，一年硬生生多收第 13 个月租金</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 信用卡换卡漏扣 1 次，30 天剪锁 $80 盲盒贱卖</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 企业信用卡到期换号导致扣款失败，仅发旧邮箱通知</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 加收 $120 留置权拍卖费 (Lien Fee) 并直接剪断挂锁</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 将仓内 $25,000 医疗样品或传家宝按 $80 盲盒拍卖一空</text>


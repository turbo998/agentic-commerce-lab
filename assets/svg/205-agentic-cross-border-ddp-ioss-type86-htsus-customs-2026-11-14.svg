<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg205" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="blue205" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="red205" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg205)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#blue205)"/>
  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 203 · DDP IOSS &amp; TYPE 86</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体跨境直邮完税交货 (DDP) 与欧盟 IOSS / 美国 CBP Type 86 清关架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">支付流水 1:1 报关锚定 + 欧盟 IOSS (≤€150) 加密 H7 绑定 + 美国 10位 HTSUS 令牌 (`agentic_cross_border_ddp_ioss_customs_mandate_...`) vs DDU 拒收与低报扣关</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red205)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：DDU 门口到付税费拒收 + 灰产低报货值触发海关扣押重罚</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 发 DDU 未完税包裹导致 28% 消费者在门口拒收弃件：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 快递员送货上门时索要进口 VAT + €6~€15/单承运商代垫手续费；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 消费者直接拒收并提信用卡拒付，商户痛失双程国际空运费与全部货值。</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 欧盟 &gt;€150 订单误挂 IOSS 造成 200% 双重征税 &amp; 面单明文印税号：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 超过 €150 内在货值海关拒绝 IOSS 免税并二次征税；外箱印 IOSS 号被黑产盗刷。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 把 $200 商品低报成 $15 样品或同日拆单违反美国 19 U.S.C. § 1592：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• CBP ACE 比对支付流水查获低报与拆单逃税，整批扣押并处货值 2–4 倍重罚！</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms Undervaluation/Split) | HTTP 422 (14ms IOSS/HTSUS)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#blue205)"/>
  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：全链路 DDP 算税 + IOSS H7 加密分流 + CBP Type 86 网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 支付捕获流水与报关单金额 1:1 加密锚定 (零低报容忍)：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 强制断言 customs_declared_cents == net_paid_merchandise_cents；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动剥离独立列明运费计算欧盟 €150 内在货值，守住合法免关税红线。</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 欧盟 ≤€150 走 H7 加密 IOSS / &gt;€150 切商业 DDP + 美国 10位 HTSUS：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• IOSS 号仅通过 EDI 写入 H7 舱单绝不印上面单；美国 Type 86 强制校验 10位 HTSUS。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 税则核验与防弃件增收：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 免除 €15/单代垫费并消除 28% 门口拒收弃件，单批立省 $42,700.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $610k DDP) | HTTP 409 ($42.7k Refusal &amp; Fee Saved)</text>

  <!-- Bottom Quantitative Benchmark Table -->
  <rect x="36" y="415" width="1128" height="236" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="56" y="444" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">📊 定量实测矩阵：跨境直邮 DDP 清关批次 ($610,000.00) 5 组边界验证 (`evaluate_agentic_cross_border_ddp_customs_policy`)</text>

  <rect x="52" y="458" width="1096" height="28" rx="4" fill="#0F172A"/>
  <text x="66" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">SCENARIO ID</text>
  <text x="220" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">DDP VALUATION / EU IOSS €150 H7 / US CBP TYPE 86 10-DIGIT HTSUS</text>
  <text x="650" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">HTTP &amp; ACTION PILL</text>

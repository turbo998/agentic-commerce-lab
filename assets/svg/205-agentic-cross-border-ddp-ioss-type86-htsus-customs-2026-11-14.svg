  <text x="66" y="504" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">ddp_commit_ok</text>
  <text x="220" y="504" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">报关价 1:1 锚定支付流水 + 欧盟 €150 H7 精确分流 + 10位 HTSUS</text>
  <text x="650" y="504" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">200 · Act automatically</text>
  <text x="875" y="504" fill="#E2E8F0" font-family="monospace" font-size="12">10ms</text>
  <text x="965" y="504" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">$610,000.00 Cleared</text>

  <!-- Row 2 -->
  <text x="66" y="532" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">ddp_val_403</text>
  <text x="220" y="532" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">企图将 $200 商品低报为 $15 逃税或同日拆单规避美国 $800 上限</text>
  <text x="650" y="532" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">403 · Send to a human</text>
  <text x="875" y="532" fill="#E2E8F0" font-family="monospace" font-size="12">11ms</text>
  <text x="965" y="532" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">Customs Fraud Blocked</text>

  <!-- Row 3 -->
  <text x="66" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">ddp_ios_422</text>
  <text x="220" y="560" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">欧盟 &gt;€150 误挂 IOSS (双重征税)、外箱明文印 IOSS 或缺 10位 HTSUS</text>
  <text x="650" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">422 · Send to a human</text>
  <text x="875" y="560" fill="#E2E8F0" font-family="monospace" font-size="12">14ms</text>
  <text x="965" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">Double-VAT Blocked</text>

  <!-- Row 4 -->
  <text x="66" y="588" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">ddp_pga_451</text>
  <text x="220" y="588" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Web IQ /v3/browse 检出命中 TARIC 反倾销税或缺失美国 FDA/FCC 准入</text>
  <text x="650" y="588" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">451 · Send to a human</text>
  <text x="875" y="588" fill="#E2E8F0" font-family="monospace" font-size="12">280ms</text>
  <text x="965" y="588" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">PGA Compliance Hold</text>

  <!-- Row 5 -->
  <text x="66" y="616" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">ddp_sav_409</text>
  <text x="220" y="616" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Web IQ 启用全链路 DDP + H7 加密 IOSS 免除代垫费与 28% 门口拒收</text>
  <text x="650" y="616" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">409 · Confirm</text>
  <text x="875" y="616" fill="#E2E8F0" font-family="monospace" font-size="12">245ms</text>
  <text x="965" y="616" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">Saves $42,700.00</text>

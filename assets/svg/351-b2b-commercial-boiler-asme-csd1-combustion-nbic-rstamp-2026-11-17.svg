  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">导致过量空气带走大量热能或 CO &gt;400 ppm；低水位联锁只按按钮不排污致浮球卡死。</text>


  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业锅炉燃烧调校与安全联锁维保四大黑洞 (Legacy Boiler Leakage: 32%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 不插烟气分析仪只扫 20 分钟炉灰收 $1,850，排烟残氧 &gt;8.5% 冬天多烧 $22k 气</text>

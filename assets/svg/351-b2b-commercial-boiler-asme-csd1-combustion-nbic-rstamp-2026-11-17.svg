  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">锅炉报熄火故障 (Flame Failure)，90% 只是前端 $65 Honeywell C7027A 紫外感光管积碳</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">或 $38 离子探针老化，维保商却谎称整套 $6,500 RM7800 燃烧安全主控制器烧毁。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 找无 NBBI "R" Stamp 钢印资质的普通焊工补焊漏水炉管，致 $120,000 锅炉报废</text>

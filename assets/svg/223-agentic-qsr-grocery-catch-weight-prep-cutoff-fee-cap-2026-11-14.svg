  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#org223)"/>
  <text x="890" y="161" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：+15% 称重缓冲一次清分 + KDS 锁单 + 出餐克重封签网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. KDS_FIRED 点火锁死免费撤单 + 出餐电子秤克重 (±5%) 防拆封签：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 后厨下锅瞬间关闭无损取消；打包台电子秤校验整袋克重匹配菜品 BOM (±5%)，</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 粉碎“实秤 1092g 封签完好却谎称少送 550g 主菜”的恶意仅退款诈骗！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 单根 TID +15% 称重缓冲预授权 + GS1 计价秤码 1 次清分：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 扫码一次精准扣收实秤金额 (≤115%) 并通过 0420 秒退剩余缓冲，零二刷拒付坏账。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 市政佣金围栏与防损增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 严守 ≤15% 市政配送佣金红线并挽回生鲜二刷坏账与白食损失，单批立省 $29,600.00！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>

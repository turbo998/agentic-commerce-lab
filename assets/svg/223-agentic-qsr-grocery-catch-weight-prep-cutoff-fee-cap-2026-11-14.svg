  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#org223)"/>
  <text x="159" y="57" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 221 · QSR &amp; CATCH-WEIGHT</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体餐饮外卖与即时生鲜 +15% 称重缓冲、后厨 KDS 防撤单与市政佣金上限架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">GS1 计价秤码单次清分 + 出餐克重封签防仅退款令牌 (`agentic_qsr_grocery_catch_weight_prep_cutoff_fee_cap_mandate_...`) vs 二刷拒付</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red223)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：生鲜超重二刷被拒 + 下锅后恶意撤单 + 谎称少菜骗仅退款</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 后厨已下锅烹饪 (KDS_FIRED) 仍允许免费撤单 + 虚假少件仅退款：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 食材已熟或骑手已取餐仍被 API 秒退全款，餐厅 100% 倒贴食材与人工成本；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 买家撕毁包装谎称“少送 $28 主菜”触发 AI 客服无脑秒退，被黑产代点吃白食！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 散装鲜肉切重多出 $2.88 后发起“第 2 笔独立刷卡”遭 SPT 拒付：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 单次授权令牌 (SPT/VCN) 首刷后即销毁，二刷补差价 100% 失败且多交 $0.30 通道费。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 在纽约/旧金山/西雅图对独立餐厅违规强抽 30% 基础配送佣金：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反市政 Delivery Fee Cap 法令 (≤15% 上限)，面临每店每天 $1,000 行政重罚。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

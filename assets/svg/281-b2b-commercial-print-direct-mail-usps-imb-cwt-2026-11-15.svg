  <text x="68" y="582" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 严禁将预付邮资打入印刷厂账户；必须通过品牌自有 USPS EPS 专户直付，并凭 PostalOne! Form 3602-R 与 &gt;=99.5% IMb 进局扫描结算印工费。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 合同废除 ±10% 超印惯例 (Overrun Cap = 0%)，开机纸损封顶 3.5%，并由 Web IQ 实时核验 RISI CWT 原纸指数与 SOC 2 Type II 隐私资质。</text>

  <!-- Header -->
  <text x="52" y="62" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-15 · ROUND 279 · B2B COMMERCIAL PRINT &amp; DIRECT MAIL USPS IMb SEAMLESS ACCEPTANCE, EPS &amp; CWT PAPER</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">B2B 商业印刷与直邮营销：USPS IMb 进局扫码、EPS 邮资专户托管与 CWT 纸张克重清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">USPS EPS 邮资直付防印厂少印少寄侵吞现金 · PostalOne! Mail.dat 99.5% IMb 扫码锁 · TAPPI 纸重核验与 0% 未授权超印封顶</text>


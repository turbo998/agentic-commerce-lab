  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 200 万封订单先把 $540,000 邮资打进印厂私人账户</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 印厂挑出 50 封种子测试信照寄，暗中少印 30 万封</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 单笔直接侵吞 $81,000 现金邮资与 $34,000 白纸</text>


  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Activation-Lock &amp; GSMA IMEI Gate (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops #1 Trade-In Write-Off ("Bricked Devices"): </text>
  <text x="54" y="182" class="mono" fill="#fca5a5">32% of Trade-Ins Arrive w/ Find-My-iPhone ON,</text>
  <text x="54" y="200" class="mono">Corporate MDM Lock, or Carrier Financing Lien!</text>
  <text x="44" y="223" class="body-txt">• Pre-Checkout Live `IMEI / Serial` Lookup:</text>
  <text x="54" y="243" class="mono">Verify GSMA_Lost_Stolen == False &amp; EIP_Paid</text>
  <text x="54" y="261" class="mono">&amp; Activation_Lock (FMI / Google FRP) == OFF</text>

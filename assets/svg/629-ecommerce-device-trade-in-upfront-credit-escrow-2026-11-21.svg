  <text x="830" y="182" class="mono">If New_Device Returned After Trade-In Sold:</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">Refund Trade-In Portion as Store Gift Card</text>
  <text x="820" y="223" class="body-txt">• Mandatory `NIST SP 800-88 Rev.1` Data Erasure:</text>
  <text x="830" y="243" class="body-txt">Issues cryptographic ADISA / Blancco erasure</text>
  <text x="830" y="261" class="body-txt">certificate before wholesale recommerce resale</text>

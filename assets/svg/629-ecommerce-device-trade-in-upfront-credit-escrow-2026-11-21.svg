  <text x="442" y="182" class="mono">Bind 21-Day Credit-Card SPT Collateral Mandate</text>
  <text x="442" y="200" class="body-txt">(Blocks prepaid/empty debit cards on upfront credit)</text>
  <text x="432" y="223" class="body-txt">• Stops Predatory Depot "Bait-and-Switch" Clawback:</text>
  <text x="442" y="243" class="mono" fill="#fcd34d">If Depot Re-Grades $500 → $180:</text>
  <text x="442" y="261" class="mono" fill="#fcd34d">Require Unbox_Video + 7d Buyer Accept/Return</text>

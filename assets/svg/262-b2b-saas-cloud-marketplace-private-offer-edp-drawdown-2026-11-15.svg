<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg262" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent262" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dangerGrad262" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad262" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg262)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="460" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="274" y="55" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">ROUND 260 · CLOUD MARKETPLACE PRIVATE OFFER, MACC/EDP &amp; MPO/CPPO</text>
  <text x="44" y="96" fill="#f8fafc" font-size="22" font-weight="800">B2B 智能体云市场私有报价（Private Offer）、MACC/EDP 承诺池抵扣与多方渠道分成清算架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">100% MACC/EDP 抵扣徽章锁 + MPO/CPPO 批发底价与防双倍提成锁 + Metering API 幂等门禁 vs. 买错非抵扣 SKU 作废百万承诺、渠道叠折穿底与到期恢复原价</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent262)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad262)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统盲签云市场 Private Offer 的三大失血黑洞（承诺池作废 &amp; 穿底）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. 买错非抵扣 SKU 致年底百万云承诺作废（Zero Commit Drawdown · 403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 误选无 MACC/EDP Benefit Eligible 徽章的 BYOL 计划或超出合同第三方抵扣比例上限</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 云厂商不仅 0% 扣减承诺池、另开 $500k 现金账单，年底没花完的 $500k 承诺池还被没收</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 企业遭遇“多付一份现金 + 作废一份承诺池”的 $100 万双倍财务灾难</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. MPO / CPPO 渠道越权叠折击穿底价与双倍提成（Wholesale Breach · 422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• 三方报价中代理商在原厂直销特批价上再次叠加渠道返点，扣完 3% 平台费后击穿原厂底价</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• CRM 给原厂直销 AE 与渠道经理同时计提双份全额佣金 (Double Comp)，净毛利亏损 30%</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 缺乏 Wholesale Floor 净额护栏与 Co-Sell 唯一销售业绩归属互斥锁</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. Metering API 重放 10 倍扣费与到期跳回公有标价（Price Cliff · 451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• SaaS 厂商调用 Marketplace Metering API 超时重试未带幂等键，同一小时 Token 被扣 10 次</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 12 个月 Private Offer 专属折扣到期夜，订阅静默切回无折扣公有目录原价 (+65% 暴涨)</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 云账单在月底突然爆表，跨云厂商、ISV 与代理商三方申请退费耗时数月</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad262)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + MACC/EDP 锁 + MPO/CPPO 四重确定性门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · Plan-ID 级 100% MACC/EDP 承诺抵扣资格锁（拦截 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 在点击 Accept 前穿透核验具体 Offer ID + Plan ID 具备 IP Co-Sell / EDP</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">100% 抵扣徽章且企业剩余第三方配额充足；非抵扣 SKU 11ms 硬拦截</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · MPO/CPPO 原厂批发底价与单一 Co-Sell 佣金锁（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">强制核算 ISV Net = Wholesale Price × (1 - 3% Listing Fee) ≥ 授权底价线，</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">并锁定 ASC 606 净额分账与唯一销售提成归属，彻底粉碎渠道越权叠折与双倍发奖</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · Metering API 幂等遥测对账与到期原价悬崖熔断（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">逐小时比对 BatchMeterUsage 幂等键与客户侧真实消费遥测日志，并在 Private Offer</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">到期前锁死续约价格上限，严禁未经确认静默跳回 +65% 公有目录标价</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 三方自动清分 &amp; 年末即将过期 MACC 余额置换双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">10ms 签发 b2b_saas_cloud_marketplace_... 令牌；吸收过期承诺池立省 $64,000 转 409</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#38bdf8" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 100% MACC 抵扣清分</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">MPO 三方合规分账 ($800k)</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Drawdown Settled · 10ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · 非抵扣 SKU 零冲抵</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">BYOL 或超第三方配额上限</text>
  <text x="410" y="692" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">ZERO_MACC_EDP_DRAWDOWN</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · CPPO 击穿底价/双提成</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">渠道越权叠折或直销渠道双奖</text>
  <text x="642" y="692" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">WHOLESALE_FLOOR_BREACH</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · 计量重放/跳回原价</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">Metering 10x 或 +65% 原价续费</text>
  <text x="874" y="692" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">METERING_SPIKE_PRICE_CLIFF</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · 过期承诺池灵活置换</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">立省 $64.0k ($736.0k 净付)</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">MACC_SURPLUS_SWAP_CONFIRM</text>
</svg>

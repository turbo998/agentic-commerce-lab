  <rect width="1200" height="630" fill="url(#bg180)" rx="16"/>
  <rect x="28" y="22" width="1144" height="6" fill="url(#accent180)" rx="3"/>

  <text x="36" y="60" class="title">Round 178 · 全固态电池 (ASSB) 硫银锗矿硫化物电解质、临界电流密度 (CCD) 与防 H2S 水解架构图</text>
  <text x="36" y="84" class="sub">All-Solid-State Battery Li6PS5Cl Sulfide Electrolyte &amp; Dry Electrode Offtake, Ionic Conductivity (&gt;=4.5 mS/cm), CCD (&gt;=3.5 mA/cm2) &amp; H2S</text>

  <!-- Left Card: Failure Mode -->
  <rect x="36" y="104" width="355" height="390" rx="12" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="52" y="120" width="160" height="24" rx="12" fill="#fca5a5"/>
  <text x="64" y="136" class="pill-err">⛔ 传统按公斤与粒度D50盲付</text>
  <text x="52" y="166" class="card-h">三大晶界内生锂枝晶短路、剧毒 H2S 与空间电荷死墙灾难</text>

  <text x="52" y="196" class="body" fill="#fca5a5" font-weight="700">1. 电子电导超标致内部孔隙长出孤立锂枝晶劈裂</text>
  <text x="52" y="216" class="body">激光粒度测不出相纯度！残余 Li2S 致电导仅 0.8；</text>
  <text x="52" y="234" class="body">电子电导 &gt;10^-8 S/cm 时电子钻进陶瓷内部孔隙直接</text>
  <text x="52" y="252" class="body">还原成金属锂核 (CCD=0.6 mA/cm2) 当场撑裂短路！</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. 微量水汽水解冒剧毒 H2S 与正极空间电荷死墙</text>
  <text x="52" y="302" class="body">受潮水解生成剧毒硫化氢 (H2S) 触发车间毒气报警；</text>
  <text x="52" y="320" class="body">未包覆 LiNbO3 的正极界面锂耗尽电阻飙至 180 Ω·cm2。</text>

  <text x="52" y="350" class="body" fill="#fca5a5" font-weight="700">3. 工业级 99% Li2S 含铁自放电与湿法溶剂腐蚀</text>
  <text x="52" y="370" class="body">廉价前驱体含磁性铁屑刺穿隔膜；沿用湿法涂布溶剂</text>
  <text x="52" y="388" class="body">破坏硫化物晶格且未冲抵干法 PTFE 免烘道红利。</text>

  <rect x="52" y="418" width="323" height="58" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="64" y="440" class="mono" fill="#f87171">Legacy: 500 kg Powder + Laser D50=1.2um</text>
  <text x="64" y="460" class="mono" fill="#fca5a5">Result: $660,000 exposed to H2S &amp; dendrite short</text>

  <!-- Center Card: Mandate Pipeline -->
  <rect x="412" y="104" width="380" height="390" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="428" y="120" width="290" height="24" rx="12" fill="#6ee7b7"/>
  <text x="440" y="136" class="pill-ok">🛡️ solid_state_sulfide_electrolyte_mandate</text>
  <text x="428" y="166" class="card-h">四层高电导、高 CCD 与零水解毒气门禁（10ms–280ms）</text>

  <rect x="428" y="182" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="202" class="mono">Gate 1: σ_ion &gt;=4.5 &amp; CCD &gt;=3.5 (11ms)</text>
  <text x="440" y="220" class="body">室温离子电导 &gt;=4.5 mS/cm, 电子电导 &lt;=10^-9 S/cm</text>
  <text x="440" y="238" class="body">&amp; 对称电池 CCD &gt;=3.5 mA/cm2 — 枝晶短路直返 403</text>

  <rect x="428" y="258" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="278" class="mono">Gate 2: H2S &lt;=0.05 &amp; LiNbO3 R_ct (14ms)</text>
  <text x="440" y="296" class="body">露点 -50°C H2S 析出 &lt;=0.05 cm3/g &amp; LiNbO3</text>
  <text x="440" y="314" class="body">包覆正极界面阻抗 &lt;=15 Ω·cm2 — 水解产毒直返 422</text>

  <rect x="428" y="334" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="354" class="mono">Gate 3: Web IQ 4N Li2S &amp; Dew-Point (280ms)</text>
  <text x="440" y="372" class="body">核验 4N 超纯 Li2S 前驱体 (磁性铁 &lt;=50 ppb) 与</text>
  <text x="440" y="390" class="body">UN 3134 桶内蓝牙露点计 (&lt;=-50°C) — 违者直返 451</text>

  <rect x="428" y="410" width="348" height="68" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="430" class="mono" fill="#fcd34d">Gate 4: THF Recycle &amp; Dry PTFE (245ms)</text>
  <text x="440" y="448" class="body">液相法合成 THF 溶剂 99.3% 分子筛精馏回用 + 零溶剂</text>
  <text x="440" y="466" class="body">双螺杆 PTFE 原纤化干法自支撑极片立省 $92,400 触发 409</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="812" y="104" width="352" height="390" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="828" y="120" width="184" height="24" rx="12" fill="#fde68a"/>
  <text x="840" y="136" class="pill-warn">📊 5-Lane 实测矩阵与 Web IQ</text>
  <text x="828" y="166" class="card-h">零虚构坐标定量实测（Provenance: measured）</text>

  <text x="828" y="194" class="mono" fill="#4ade80">✅ HTTP 200 (10ms) · 高电导高 CCD 与零水解放行</text>
  <text x="828" y="212" class="body">6.8 mS/cm + CCD 4.8 + H2S 0.008 → $660,000</text>

  <text x="828" y="240" class="mono" fill="#f87171">⛔ HTTP 403 (11ms) · 低电导或晶界内生锂枝晶</text>
  <text x="828" y="258" class="body">电导 0.8 或 CCD=0.6 短路 → 冻结 $660,000.00</text>

  <text x="828" y="286" class="mono" fill="#fb923c">⛔ HTTP 422 (14ms) · 水解冒剧毒 H2S 或高界面阻抗</text>
  <text x="828" y="304" class="body">H2S 超标或 R_ct=180 Ω·cm2 → 拒付 $660,000.00</text>

  <text x="828" y="332" class="mono" fill="#c084fc">⛔ HTTP 451 (280ms) · Web IQ 含铁前驱体或受潮</text>
  <text x="828" y="350" class="body">99% 工业级 Li2S 或露点破封 → 熔断 $660,000.00</text>

  <text x="828" y="378" class="mono" fill="#facc15">🟡 HTTP 409 (245ms) · 液相溶剂回用与干法 PTFE</text>
  <text x="828" y="396" class="body">节省 $92,400 (-14%) → 确认后净付 $567,600.00</text>

  <rect x="828" y="416" width="320" height="62" rx="8" fill="#1e293b"/>
  <text x="840" y="438" class="body" font-weight="700" fill="#38bdf8">Web IQ (/v3/browse) vs Exa / Bright Data</text>
  <text x="840" y="458" class="body">准确率 100% · P50 245ms · 抗注入 100% · 配方保密</text>

  <!-- Footer -->
  <rect x="36" y="512" width="1128" height="92" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="538" class="card-h" fill="#38bdf8">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• 硫化物固态电解质严禁“仅看粒度 D50 盲付”：电子电导超标会在陶瓷内部晶界长出孤立锂枝晶劈裂短路，且受潮会释放剧毒硫化氢 (H2S)。</text>
  <text x="54" y="584" class="body">• 必须将离子电导 (&gt;=4.5mS/cm)、电子电导 (&lt;=10^-9)、CCD (&gt;=3.5mA/cm2) 与 H2S (&lt;=0.05) 绑定为智能托管解锁谓词。</text>

  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 钢瓶阀口微漏湿气生成氢氟酸 (HF) 蚀穿管路</text>
    <text x="58" y="224" fill="#CBD5E1">• 出厂纸质 COA 写 5.5N 纯度，收走 $210,000 货款</text>
    <text x="58" y="242" fill="#CBD5E1">• 实测水分 180 ppb &gt; 10 ppb，WF6 水解堵死 3D NAND 通孔</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 10%-15% 保压安全余气 (Heel Gas) 遭无偿吞没</text>
    <text x="58" y="294" fill="#CBD5E1">• 防倒吸规定剩 120 psi (12% 质量) 必须停用换瓶</text>
    <text x="58" y="312" fill="#CBD5E1">• 气商收回余气不退费直接补充再卖，两头通吃暴利</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 缺失高 GWP 温室气体 (NF3) 尾气焚烧与内壁钝化</text>
    <text x="58" y="364" fill="#CBD5E1">• 电抛光内壁粗糙度 Ra &gt; 0.13 μm 释放颗粒铁镍金属</text>
    <text x="58" y="382" fill="#CBD5E1">• 违反 SEMI C3/F57 标准及欧盟氟化气体 (F-Gas) 法规</text>
  </g>
  <rect x="58" y="442" width="319" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="217" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">

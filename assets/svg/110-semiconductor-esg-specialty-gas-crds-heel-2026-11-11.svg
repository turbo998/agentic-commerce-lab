  <rect width="1200" height="630" fill="url(#bg110)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent110)"/>

  <!-- Header -->
  <rect x="40" y="24" width="390" height="28" rx="14" fill="#4C1D95" stroke="#C084FC" stroke-width="1"/>
  <text x="235" y="43" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F3E8FF" text-anchor="middle">
    ROUND 108 · SEMICONDUCTOR ELECTRONIC SPECIALTY GAS ESCROW
  </text>
  <text x="40" y="84" font-family="Segoe UI, Ubuntu, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">
    半导体电子特气 (6N NF3 / WF6 / SiH4)、CRDS 痕量水分 (&lt;=10 ppb) 与钢瓶余气回皮智能托管
  </text>
  <text x="40" y="111" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" fill="#94A3B8">

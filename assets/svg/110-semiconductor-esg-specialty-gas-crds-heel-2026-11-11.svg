  <text x="60" y="541" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700" fill="#E9D5FF">
    🏛️ 架构师选型铁律 (Takeaway): 绝对不要按“整瓶标称充装重量 + 出厂纸质 COA”盲付半导体高纯电子特气账单！
  </text>
  <text x="60" y="565" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    必须绑定：① 气柜吹扫后在线光腔衰荡光谱 (CRDS H2O &lt;=10 ppb) 与 FTIR 零水解酸度 (11ms 拦 403)；② BSGS 高精度称重传感器自动退还 10%-15% 保压余气 (Heel Credit, 14ms 拦 422)；
  </text>
  <text x="60" y="586" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    ③ Web IQ 核查 Y-Ton 钢瓶 316L 电抛光定检与 F-Gas 法规配额 (290ms 拦 451)，并叠加余气回皮与蚀刻尾气氖/氪/氙纯化回收立省 $29,400 (300ms)。
  </text>

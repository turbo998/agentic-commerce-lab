  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：升配2天薅算力降配退现 + 乱序扣包 + 首日全额确认年费收入</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 升配旗舰版跑批 2 天后立即降配并原路退回 93% 现金：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 客户花 $667 白嫖价值 $10,000/月的高阶算力，商户还倒贴 2.9% 刷卡手续费；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 浮点数按天折算在 28/31 天月份产生 $0.01–$0.05 对账尾差 (Penny Drift)。</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 先扣光客户长效付费充值包，月底免费内含包却作废：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反 FEFO (最早过期优先) 扣减顺序，导致客户付费额度被吞并引发集体拒付。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 收到 $120k 年费当天全额确认为营业收入违反 ASC 606 / IFRS 15：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 未按独立售价 (SSP) 拆分履约义务并锁定递延收入，IPO/年审直接被出具否定意见！</text>


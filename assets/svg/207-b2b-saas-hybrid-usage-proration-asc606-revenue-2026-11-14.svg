  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. Unix 秒级 64位微美分折算 + 降配仅退不可提现 Credit Note：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 周期中途降配差额自动转为账单贷项通知单 (冲抵下期续费/Overage)，严禁退现；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 任意频次席位调整经最大余数法分配，月末发票 100% 美分精确守恒。</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 确定性 FEFO 瀑布流 + ASC 606 独立售价 (SSP) 自动分摊：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 先扣快过期赠金与当月内含包；年费锁入递延收入负债，按天/按消耗自动结转营收。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms SSP 走廊核验与阶梯升档：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动升档预付包消除天价 Overage 坏账冲销，单批立省/保全 $46,800.00 (HTTP 409)！</text>


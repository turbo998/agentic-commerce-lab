  <text x="510" y="614" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="11">拦$16k假修机头与定时排水阀</text>

  <rect x="725" y="580" width="205" height="40" rx="6" fill="#3B0764"/>

  <!-- Header -->
  <text x="48" y="58" fill="#06B6D4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 350 · B2B INDUSTRIAL COMPRESSED AIR (ISO 8573-1), ULTRASONIC CFM LEAK AUDITS &amp; SCREW AIR-END</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">工业螺杆空压机与查漏结算：保压总管 SCFM 降幅锁、SPM 轴承脉冲锁 vs 挂牌假查漏与 $16k 骗修机头</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_industrial_compressed_air_iso8573_ultrasonic_leak_airend_mandate_2026 · 15.0% Savings ($21,600 / Batch)</text>

  <!-- Left Panel: Legacy Industrial Compressed Air Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统工业空压站查漏与螺杆主机维保四大黑洞 (Legacy Compressed Air Leakage: 30%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 花 $8,500 在车间挂满 80 张漏气纸吊牌，修完后周末保压总管流量 1 CFM 没降</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">不带 Fluke ii900 声学成像仪拍分贝图，随便在气管上绑一圈塑料牌交差；周日全厂停机</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">保压时热式质量流量计 (SCFM) 依然高达 280 CFM，一年照样白烧 $38,000 漏气电费。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. $320 油气分离芯堵塞或 $95 温控阀卡死高温跳机，被虚报为 $16,000 大修螺杆机头</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">螺杆空压机排气超温 (&gt;215°F) 或跑油，90% 只是 $320 油分芯压差超 10 PSID 或石蜡</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">温控阀未打开，维保商却谎称“阴阳转子磨损抱死”强收 $16,000 机头 (Air-End) 大修费。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 给储气罐与冷干机装 $45 定时电磁排水阀，每 3 分钟直排高压气年亏 $18,000</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">不用零气耗液位感应排水器 (Zero-Loss Drain)，装廉价定时电磁阀无论有无冷凝水都</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">定时开启狂喷 10 秒 100 PSIG 高压空气，且极易被铁锈卡在常开位放空整座空压站。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 食品/制药车间违规加注非 NSF H1 工业矿物油，且违反 ISO 8573-1 Class 1.2.1</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">用普通低价工业矿物油冒充 NSF H1 食品级全合成油，配合失效的除油精密滤芯，</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">导致油雾 (>0.01 mg/m³) 吹进食品包装袋引发整批次产品召回。</text>

  <!-- Right Panel: Agentic Header SCFM Lock + SPM Gate + Web IQ ISO 8573 Architecture -->
  <rect x="616" y="132" width="540" height="395" rx="12" fill="#0F1E2E" stroke="#10B981" stroke-width="1.5"/>
  <rect x="616" y="132" width="540" height="38" rx="12" fill="#064E3B"/>
  <text x="636" y="156" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">✅ 周末保压 SCFM 降幅锁 + SPM 轴承脉冲锁 + 零气耗排水 + Web IQ 架构</text>

  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 声学成像分贝图 + 周末停产保压总管 SCFM 下降锁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">强制提交每处漏点 Fluke ii900 声学成像图，并直连总管热式质量流量计验证周末保压</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">基荷流量真实回落 &gt;=80% 标定漏量，11ms 硬拦截只挂纸牌不降耗的假查漏。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. SPM 轴承冲击脉冲锁 (&lt;20 dBm 免修机头) + 零气耗排水锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">机头轴承 SPM 脉冲未入红区 (&lt;35 dBm) 时，高温或跑油一律锁定更换 $320 油分芯与</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">$95 温控阀；100% 禁绝定时电磁排水阀，14ms 封杀 $16,000 骗修螺杆机头。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#06B6D4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 NSF H1 食品级油与 ISO 8573-1 (265ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">265ms 在线穿透核验 NSF White Book Category H1 食品级空压机油注册号、CAGI</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">比功率认证表及终端 ISO 8573-1 Class 1.2.1 (残油 &lt;=0.01 mg/m³) 检测报告。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动将 $16,000 机头大修降级为换 $320 油分/温控阀 (230ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将轴承完好的螺杆机头大修降级为更换油气分离芯与温控阀并核减未兑现查漏费：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $144,000.00 → 自动核减 $21,600.00 (15.0%) → 净付 $122,400.00！</text>


  <text x="684" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 将全集团门诊与住院采购量实时并表锁定最高 Tier-4 折扣并自动回收季度合规返利。</text>
  <text x="684" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FDE68A">• 在 $740,000.00 医院 GPO 采购批次上单批立省/追回 $59,200.00 (净结算 $680,800.00 · HTTP 409)！</text>


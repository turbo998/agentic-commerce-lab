  <text x="684" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 自动将所有下属诊所/分院 GLN 映射至母集团 EDI 832 Tier-4 战略价，并守护 &gt;=80% LOC 承诺份额。</text>
  <text x="684" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 检出分院被按 Tier-1 原价高开或违规采购导致阶梯跳水，14ms 立即阻断 (HTTP 422)！</text>


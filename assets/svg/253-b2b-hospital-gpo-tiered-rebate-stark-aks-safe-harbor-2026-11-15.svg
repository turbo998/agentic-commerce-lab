  <text x="46" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#CBD5E1">Anti-POD Stark Law Gate, 42 CFR § 1001.952(h) CMS-2552 Safe Harbor &amp; GLN Tier-4 Lock vs. +32% Off-Contract Overbilling</text>
  <text x="46" y="106" font-family="Consolas, monospace" font-size="12" fill="#A5B4FC">Mandate Token: b2b_hospital_gpo_tiered_rebate_stark_aks_safe_harbor_mandate_2026_11_15 · Batch: $740,000.00 · Net Optimized: $680,800.00 (-$59,200.00)</text>

  <!-- Left Column: Legacy Hospital GPO & Stark Traps -->
  <rect x="28" y="132" width="596" height="398" rx="14" fill="url(#red-card)" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5">❌ 传统“科室主任点名选商 + 分院分散结算”（四大医疗合规与溢价黑洞）</text>
  <text x="50" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#FECACA">Why Surgeon-Owned PODs &amp; Unlinked Clinic GLNs Trigger FCA Treble Fines &amp; +32% Overcharges</text>

  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. 向主刀医生参股的经销商 (POD) 买植入物触发 Stark Law 三倍医保重罚</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 外科医生私下在耗材代理商持有股权 (Physician-Owned Distributorship) 并指定医院 AI 采购。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 触犯《斯塔克法 (42 USC 1395nn)》自我转介禁令，整台手术 $45,000 医保报销沦为欺诈遭 3 倍追缴！</text>

  <rect x="48" y="282" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">2. 接受“买试剂白送分析仪”未写入 CMS-2552 成本报告构成刑事回扣</text>
  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 厂商在账外免费投放高价检验设备或发放隐性返利，医院未在发票与医保成本报告中透明分摊。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 丧失《42 CFR § 1001.952(h) 折扣安全港》保护，直接触犯美国联邦《反回扣法 (AKS)》！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 新并购分院/门诊中心 GLN 漏挂 GPO 名录被按目录原价多收 32%</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 母集团虽签有 Vizient/Premier Tier-4 战略低价，但新分院的 GS1 GLN 地址码未同步至经销商。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 经销商 ERP 将分院当成合同外散客按 Tier-1 原价开票，或因科室私买竞品跌破 80% LOC 阶梯线！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">4. 漏查 CMS Open Payments 阳光法案未申报利益冲突与 OIG 禁入黑名单</text>
  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 未穿透核查引进委员会专家在《阳光法案》中的厂商大额顾问费及 HHS-OIG LEIE 医保禁入记录。</text>
  <text x="64" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 向被联邦医保拉黑的供应商付款面临全额拒付与行政罚款。</text>


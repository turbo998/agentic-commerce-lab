  <text x="684" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• /v3/browse 280ms 穿透核查 CMS Open Payments 阳光法案利益披露与 HHS-OIG LEIE 医保禁入库。</text>
  <text x="684" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 同步核验器械 FDA 510(k) / PMA 批准文号有效性，违规立即触发挂起 (HTTP 451)！</text>

  <rect x="668" y="446" width="564" height="68" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>

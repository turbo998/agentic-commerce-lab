  <rect width="1200" height="675" fill="url(#bg284)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent284)"/>

  <!-- Header -->
  <text x="52" y="62" fill="#2DD4BF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-15 · ROUND 282 · B2B PRECISION PLASTIC INJECTION MOLDING, VIRGIN RESIN MFI &amp; EUROMAP 77 CAVITY LOCK</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">B2B 精密注塑代工：ASTM D1238 熔指 (MFI) 防掺回料锁、EUROMAP 77 满穴周期与水口残值架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">成品 vs 原料 MFI 熔指偏移锁 (&lt;=+10%) 一秒识破偷掺水口粉碎料 · PPAP 32满穴与基准周期锁防转嫁堵穴工时 · Web IQ 核验 UL 黄卡与水口冲抵</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统注塑代工三大黑洞 (成本虚高 20% + 脆裂召回)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 夜班偷掺 40% 水口粉碎料冒充 100% 全新料</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 医疗/车规连接器指定用 $6,000/吨 100% 原厂全新 PC/POM</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 偷偷掺入 40% 多次高温剪切粉碎水口料 (Regrind)</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 卡尺尺寸虽合格，但分子链断裂导致装机半年大面积脆裂</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 模具堵死 6 穴 + 拉长周期转嫁机台工时费</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 客户出资的 32 穴模具因保养不当堵死 6 穴 (仅 26 穴生产)</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 操作工私自将 15s 标准成型周期调慢至 20s，时产暴跌 40%</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 反过来以“实际占用机台工时增加”为由要求涨价 35%</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 虚报冷流道水口重量并私吞高价水口残值</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 按“产品净重 40g + 流道水口 12g”向客户收全额全新料费</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 切下的 25% 高纯度工程塑料水口被工厂转卖副牌商</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 客户既付了水口原价，又拿不到一分钱 Scrap Credit</text>

  <!-- Center Card: Agentic Policy Engine -->
  <rect x="422" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#14B8A6" stroke-width="1.5"/>
  <rect x="422" y="136" width="356" height="38" rx="12" fill="#115E59"/>
  <text x="442" y="160" fill="#99F6E4" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体 MFI 熔指、满穴周期与水口冲抵三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#0F766E"/>
  <text x="452" y="210" fill="#2DD4BF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：ASTM D1238 熔指 (MFI) 偏移与吨数守恒锁</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 比对原厂粒子 CoA 与成品实测 MFI (限制偏移 &lt;=+10%)</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 校验原厂授权经销商发票吨数 &gt;= 大货出货总毛重</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 阻断偷掺回料导致熔指异常飙升批次</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#0F766E"/>
  <text x="452" y="326" fill="#2DD4BF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：EUROMAP 77 满穴基准周期与水口残值门禁</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 单件机台费刚性锁死 PPAP 封样 32 满穴与 15.0s 周期</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 冷流道不可回用水口强制按副牌行情返还 Scrap Credit</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 拦截堵穴慢周期加价与水口侵吞</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#0F766E"/>
  <text x="452" y="442" fill="#2DD4BF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ UL Yellow Card 与 USP Class VI 锁</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 核验 UL iQ 黄卡 (UL94 V-0) 阻燃状态</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 校验医疗 FDA DMF / USP Class VI 备案与 ICIS 树脂指数</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $36,800</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="796" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="796" y="136" width="356" height="38" rx="12" fill="#064E3B"/>
  <text x="816" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 200 万件精密注塑批次 ($460,000) 实测矩阵</text>

  <rect x="812" y="188" width="324" height="60" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="826" y="210" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="826" y="232" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">MFI 偏移 &lt;=10% + 满穴周期 + UL/USP 合规 → 清算 $460k</text>

  <rect x="812" y="258" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="280" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="826" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">偷掺 40% 回料致 MFI 飙升 +42% 或缺 CoA → 拦截 $460k</text>

  <rect x="812" y="328" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="826" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">堵死 6 穴转嫁慢工时或私吞 25% 水口废料 → 阻断</text>

  <rect x="812" y="398" width="324" height="60" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="826" y="420" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 (275ms) / 🧑‍⚖️ HTTP 409 (240ms)</text>
  <text x="826" y="442" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">无 UL 黄卡/USP 挂起 / 满穴还原+水口抵扣省 $36,800</text>

  <rect x="812" y="468" width="324" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="826" y="490" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">💡 满穴周期还原与水口冲抵后净付：$423,200 (省 8.0%)</text>
  <text x="826" y="510" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="11">令牌：b2b_plastic_injection_molding_virgin_resin_...</text>

  <!-- Footer -->
  <rect x="48" y="556" width="1104" height="80" rx="10" fill="#020617" stroke="#334155"/>
  <text x="68" y="582" fill="#2DD4BF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 100% 全新料订单必须执行“入库粒子 CoA vs 出货成品”双端 ASTM D1238 熔指 (MFI) 检测，偏移超 +12% 即判定掺入热降解回料。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 单件加工费刚性锚定 PPAP 满穴数与基准周期 (堵穴减产由注塑厂自担)，且冷流道工程塑料水口必须按副牌回收行情自动冲抵。</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg268" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent268" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dangerGrad268" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad268" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg268)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="480" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
  <text x="284" y="55" fill="#c084fc" font-size="13" font-weight="700" text-anchor="middle">ROUND 266 · SEMICONDUCTOR OSAT, STDF TEST-TIME &amp; SILICON SCRAP</text>
  <text x="44" y="96" fill="#f8fafc" font-size="22" font-weight="800">B2B 智能体半导体封测委工（OSAT）、STDF 机台测试日志签名与报废晶圆赔偿清算架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">客供晶圆硅片原值倒扣锁 (Assembly Yield≥99.5%) + STDF 净测试秒数与探针重测剥离 + 测试程序哈希与金线联动 vs. 压碎 $88k 晶圆只免 $800 加工费</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent268)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad268)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统半导体 OSAT 委外封测结算的三大失血黑洞（碎晶圆自吞 &amp; 3倍机时）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. 减薄划片压碎 $88,000 客供晶圆却只退 $800 加工费（Scrap Shift · 403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 芯片厂将已付台积电 $22,000/片的 4nm 晶圆寄售给封测厂，封测厂仅收 $200/片切割手工费</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 封测厂操作失误压碎 4 片晶圆 (或封装良率跌至 91%)，却拿霸王条款只免 $800 手工费拒赔硅片</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 客供硅片原值与封测账单脱节，芯片厂赔了 $88,000 晶圆还得倒贴封测费</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. 探针卡脏污引发 3 倍假性重测机时费 &amp; 卡料停机乱计费（Retest · 422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• CP 晶圆中测按 ATE 测试机小时费 ($180/h) 结算；封测厂未清针导致探针氧化接触不良</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• 30% 好芯片首测误判 Bin 2 开路，机台连跑 3 遍重测并将机械手卡料待机时间全算进账单</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 芯片厂替封测厂的探针维护懒政买单，ATE 测试机时费凭空暴涨 300%</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. 私自降级测试程序漏放坏片 &amp; 用镀钯铜线冒充纯金线收费（451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• 夜班为赶工期加载删减高温测试向量的旧版程序 (STDF EXEC_VER 哈希不符)，坏片流入客户</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 工程 ECN 早已改用廉价镀钯铜线 (CuPd Wire)，账单仍按 LBMA 99.99% 纯金线克重收附加费</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 引发服务器/车规客户整批 RMA 退货索赔，且被长期薅走虚假贵金属附加费</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad268)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + STDF v4 遥测 + 硅片原值赔偿四重门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · 封装良率 (≥99.5%) 与客供晶圆硅片原值倒扣锁（拦截 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 对齐 SEMI E142 入厂 KGD 裸片数与出厂成品数；一旦封装良率跌破 99.5%</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">或发生碎片且未按台积电采购原值全额抵扣赔偿，11ms 自动冻结封测账单</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · STDF PRR/MIR 净有效测试秒数与探针重测剥离锁（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">直接解析机台二进制 STDF v4 日志，仅按首遍有效测试秒数核算 ATE 小时费，</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">100% 剥离因探针卡接触不良 (Bin 2) 引发的重复重测耗时与 Handler 卡料停机</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · STDF EXEC_VER 程序哈希锁与键合线 BOM 联动门禁（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">逐批校验 STDF 测试程序加密校验和匹配签核版，阻断漏测逃逸 (Test Escape)，</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">并对齐 ECN BOM 键合线材质 (Au vs CuPd) 与当季 LBMA 金价指数</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 委外封测自动清算 &amp; 重测剥离+报废硅片冲抵双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">10ms 签发 b2b_semiconductor_ate_wafer_probe_... 令牌；核减 $67,200 虚高账单转 409</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#c084fc" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 合规 OSAT 封测清算</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">良率 99.7% + STDF 吻合 ($840k)</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">OSAT Batch Settled · 10ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · 碎晶圆拒赔硅片原值</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">毁 $88k 晶圆只免 $800 手工费</text>
  <text x="410" y="692" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">UNCOMPENSATED_WAFER_SCRAP</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · 探针脏污 3 倍重测机时</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">Bin 2 接触不良重测或卡料停机</text>
  <text x="642" y="692" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">PROBE_RETEST_HOUR_OVERBILL</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · 篡改测试程序/假金线费</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">EXEC_VER 不符或铜线收金线费</text>
  <text x="874" y="692" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">STDF_HASH_GOLD_WIRE_HOLD</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · 重测剥离+报废硅片倒扣</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">立省 $67.2k ($772.8k 净付)</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">STDF_SCRAP_OFFSET_CONFIRM</text>
</svg>

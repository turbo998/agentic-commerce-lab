  <!-- Header -->
  <text x="48" y="58" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 362 · STADIUM SYNTHETIC TURF (ASTM F355 / F1936 GMAX), POLE-BASE LED DRIVER &amp; NFPA 102 BLEACHER</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">体育场馆人造草坪养护 (Gmax &lt;= 165g)、20 点位胶粒深度锁与杆底 $160 LED 驱动清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">FieldTurf / AstroTurf / Musco / Hussey · 2.5 吨/mm 胶粒过磅与 20 点位插针锁 + Triax 冲击波形 + 杆底驱动箱 + NFPA 102 看台</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="64" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">🏟️ 四大体育场馆草坪、灯光与看台硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 20 点位插针深度 (&gt;=25mm) &amp; 吨包过磅锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 标准球场每提升 1mm 填充厚度必耗 ~2.5 吨胶粒</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制核对吨包地磅单与 20 点位三爪数字深度规增量</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截收 12 吨胶粒钱却只在中圈撒 3 吨骗局</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. ASTM F1936 Gmax &lt;= 165g 原始波形锁</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Triax 2015 / Clegg 落锤在 20 点位连测 3 次冲击</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制上传带 GPS 时间戳的毫秒级加速度峰值曲线</text>
  <text x="74" y="368" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 杜绝手填假 Gmax 报告导致运动员脑震荡诉讼</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>

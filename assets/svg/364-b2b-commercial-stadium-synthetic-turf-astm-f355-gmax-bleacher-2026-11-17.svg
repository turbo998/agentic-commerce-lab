  <text x="446" y="482" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">UNACCREDITED_TURF_GMAX_TESTER_OR_ACTIVE_OEM_LIGHTING_WARRANTY_HOLD</text>

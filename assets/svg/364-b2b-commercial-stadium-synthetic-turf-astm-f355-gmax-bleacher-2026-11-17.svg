      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent364" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#38BDF8"/>

  <text x="74" y="560" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• /v3/browse 核验 ASBA CFB-S 与 A2LA 冲击校准证书</text>
  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截对仍在 Musco 10-25 年质保期内的灯收费</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 满足 NCAA / FIFA Quality Pro 赛事场地认证</text>


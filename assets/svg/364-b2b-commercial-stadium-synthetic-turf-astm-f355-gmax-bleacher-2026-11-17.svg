  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 高杆球场灯驱动器装在离地 3m 杆底箱，换芯仅 $160</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 伸缩看台强制查验底盘剪叉焊缝与 $125 承重滚轮</text>
  <text x="74" y="482" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断 $2,400 高空换整灯+蜘蛛车台班高报</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>

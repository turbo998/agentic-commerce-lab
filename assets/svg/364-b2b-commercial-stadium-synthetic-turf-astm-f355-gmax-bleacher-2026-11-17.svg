  <text x="446" y="394" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">SPORTS_LED_LUMINAIRE_UPCODING_OR_SKIPPED_NFPA102_BLEACHER_UNDERSTRUCTURE</text>
  <text x="446" y="414" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截杆底 $160 驱动器虚报 $2,400 换高空灯或漏检看台 → $0.00</text>


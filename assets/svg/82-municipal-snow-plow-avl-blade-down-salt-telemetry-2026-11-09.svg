<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg82" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324"/>
      <stop offset="50%" stop-color="#0e2440"/>
      <stop offset="100%" stop-color="#153559"/>
    </linearGradient>
    <linearGradient id="accent82" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg82)"/>
  <rect x="30" y="25" width="1140" height="580" rx="18" fill="#09192e" stroke="#38bdf8" stroke-width="2" opacity="0.95"/>
  <rect x="30" y="25" width="1140" height="6" fill="url(#accent82)"/>

  <text x="60" y="72" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">ROUND 80 · MUNICIPAL &amp; COMMERCIAL SNOW-PLOW AVL, BLADE-DOWN &amp; SALT-SPREADER MANDATE</text>
  <text x="60" y="108" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">冬季除雪车铲刀落地遥测、闭环融雪盐计量与防黑冰托管 vs 空跑翘铲虚报</text>
  <text x="60" y="136" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">J1939 Hydraulic Blade-Down Sensor + Closed-Loop Auger Salt Tonnage + Road-Temp Pre-Wet Brine vs. Ghost-Pass Billing</text>

  <!-- Left Card -->
  <rect x="60" y="160" width="525" height="335" rx="12" fill="#25121d" stroke="#ef4444" stroke-width="1.8"/>
  <text x="85" y="196" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ 传统普通 GPS 轨迹 / 手写融雪盐磅单模式 (Ghost Pass)</text>
  <text x="85" y="230" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 翘铲空跑冒充除雪 (Blade-Up Ghost Pass)：司机抬起铲刀以 60 km/h 飙车刷满全路段 GPS 轨迹</text>
  <text x="85" y="260" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 融雪盐私卖与虚报吨数：账单报撒盐 85 吨（$150/吨），实际绞龙只转了 48 吨，余盐倒卖给私企</text>
  <text x="85" y="290" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 停车怠速吹暖风算工时：除雪车停在快餐店停车场怠速 3 小时，照按 $220/小时重型机械计费</text>
  <text x="85" y="320" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 超标狂撒氯化钠污染水源：地表 -2°C 却按 -15°C 极寒剂量撒盐，触犯 EPA 氯化物地下水红线</text>
  <rect x="85" y="350" width="475" height="120" rx="8" fill="#35101d" stroke="#f87171" stroke-width="1"/>
  <text x="105" y="382" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">典型大型物流枢纽园区与市政道路冬季除冰资损案例：</text>
  <text x="105" y="410" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">园区收到单场暴风雪账单 $68,000，含 32% 铲刀抬起空跑里程与 37 吨虚报融雪盐，</text>
  <text x="105" y="434" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">且漏撒区域结黑冰导致半挂车打滑追尾赔偿 → 累计多付与事故损失超 $24,500</text>
  <text x="105" y="456" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 翘铲空跑拦截率：0% | • 虚报融雪盐识别率：0% | • 结冰滑倒抗辩证据：无</text>

  <!-- Right Card -->
  <rect x="615" y="160" width="525" height="335" rx="12" fill="#0a2426" stroke="#22c55e" stroke-width="1.8"/>
  <text x="640" y="196" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">✅ 液压铲刀落地 + 闭环绞龙盐量 + 预湿盐水智能托管</text>
  <text x="640" y="230" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• J1939 液压铲刀触地门禁：仅对液压压力证实铲刀落地 (Blade-Down) 且车速 &lt;=35 km/h 里程计费</text>
  <text x="640" y="260" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 闭环绞龙传感器实撒盐量对账：按电子控制器脉冲累计的实际撒布吨数结算，剔除死角堆盐</text>
  <text x="640" y="290" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 红外地表温度与 EPA 限盐红线：Web IQ 核验地表温度与饮用水源保护区氯化物上限</text>
  <text x="640" y="320" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 23.3% 氯化钠预湿盐水 (Pre-Wet Brine) 套利：防弹跳减盐 30% 立省 $11,400</text>
  <rect x="640" y="350" width="475" height="120" rx="8" fill="#062e29" stroke="#4ade80" stroke-width="1"/>
  <text x="660" y="382" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">端到端工程与财务收益（Measured / Deterministic）：</text>
  <text x="660" y="410" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">12ms 硬拦截铲刀抬起空跑 (Ghost Pass) 与停车场怠速骗工时；15ms 拦截手写融雪盐</text>
  <text x="660" y="434" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">虚报吨数；Web IQ 预湿盐水防冰技术减盐 30% 立省 $11,400.00（净付 $56,600.00）</text>
  <text x="660" y="456" fill="#4ade80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 翘铲空跑拦截率：100% | • 融雪盐计量精度：99.2% | • 验真耗时：&lt; 25ms</text>

  <!-- Bottom Bar -->
  <rect x="60" y="512" width="1080" height="72" rx="10" fill="#0f233a" stroke="#475569" stroke-width="1"/>
  <text x="85" y="541" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">架构师核心选型法则：</text>
  <text x="235" y="541" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14">市政与园区冬季除雪结算 Agent 绝不能只看普通车载 GPS！必须绑定【液压铲刀落地 + 闭环绞龙盐量 + 地表温度】三门禁。</text>
  <text x="85" y="567" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Provenance: Deterministic Policy Evaluator (`evaluate_municipal_snow_plow_avl_salt_policy`) · SAE J1939 &amp; Clear Roads · 2026-11-09</text>
</svg>

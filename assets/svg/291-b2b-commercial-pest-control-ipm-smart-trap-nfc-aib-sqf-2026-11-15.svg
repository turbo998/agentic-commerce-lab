<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg291" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent291" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg291)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent291)"/>

  <!-- Header -->
  <text x="52" y="62" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-15 · ROUND 289 · B2B COMMERCIAL PEST CONTROL (IPM), INTERIOR-LID NFC, FUMIGATION CT &amp; EPA FIFRA</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">B2B 食品工厂与连锁餐饮虫害防制 (IPM)：盒盖内侧 NFC 锁、熏蒸 CT 门禁与 EPA 食安清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">封杀“车内扫复印条码 6 分钟假打卡 (Pencil-Whipping)” · 包干害虫反弹 100% 免费返工 · 穿透核验磷化氢熏蒸 CT 杀卵曲线与 EPA 食品区用药合规</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统商业消杀与仓储熏蒸三大黑洞 (多付 20%–35%)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 车内扫复印条码“6分钟路边假打卡”</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 传统条码贴在鼠饵盒外表面，甚至全印在卡纸上放车里扫</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 200 个诱饵站 6 分钟伪造“全部正常”，60% 鼠盒长年未开</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• AIB / SQF / FDA 外审员现场开盒发现活鼠直接判停产</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 日常偷懒养大虫患，反收 $3,200 紧急消杀费</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 因平时漏换胶饵致后厨或车间爆发德国小蠊与果蝇</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 消杀商将包干范围内的常规害虫反弹包装成“紧急增项”</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 每单强收 $1,800–$4,500 空间冷雾费，把失职变摇钱树</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 密闭熏蒸漏气未杀卵与食品车间违规喷禁用药</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 粮食/坚果熏蒸帐幕漏气，PH3 浓度未维持 300ppm×96h</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 虫卵未死透两周后复发；或把仅限室外的菊酯喷进食品区</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 诱发储粮害虫抗药性并随时引爆 FDA 一级农残召回</text>

  <!-- Center Card: Agentic Policy Engine -->
  <rect x="422" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="422" y="136" width="356" height="38" rx="12" fill="#4C1D95"/>
  <text x="442" y="160" fill="#DDD6FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体盒内 NFC、熏蒸 CT 积分与 EPA 食安三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#6D28D9"/>
  <text x="452" y="210" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：盒盖内侧加密 NFC (&gt;=99%) 与驻留时长锁</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• NTAG 424 动态芯片铆接在盒盖内侧，不开锁无法贴近感应</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制核验 &gt;=99% 点位完成率、驻留时长与粘虫板 AI 视觉</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 阻断路边假打卡与漏巡诱饵站</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#6D28D9"/>
  <text x="452" y="326" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：包干害虫 $0 返工与熏蒸 CT 杀卵曲线门禁</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 合同内鼠/蟑/蝇/甲虫反弹必须免费返工，禁收紧急冷雾费</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 熏蒸必传无线传感器 CT (ppm·h) 积分曲线与散气安全证</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 拦截返工乱收费与半吊子漏气熏蒸</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#6D28D9"/>
  <text x="452" y="442" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ EPA FIFRA 药剂标签与 AIB/SQF 锁</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 核验 EPA Reg. No. 食品区施用许可</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 核查州农业厅施药执照与 AIB / SQF 外审零虫害扣分</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $18,900</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="796" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="796" y="136" width="356" height="38" rx="12" fill="#064E3B"/>
  <text x="816" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 食品厂与餐饮 IPM ($210,000) 实测矩阵</text>

  <rect x="812" y="188" width="324" height="60" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="826" y="210" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="826" y="232" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">盒内 NFC &gt;=99% + 熏蒸 CT 达标 + EPA 食品级 → $210k</text>

  <rect x="812" y="258" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="280" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="826" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">车内扫复印条码 (盒内扫码率 42%) 或 6分钟走人 → 拦截</text>

  <rect x="812" y="328" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="826" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">包干害虫复发收 $3,200 紧急冷雾费或熏蒸漏气 → 阻断</text>

  <rect x="812" y="398" width="324" height="60" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="826" y="420" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 (275ms) / 🧑‍⚖️ HTTP 409 (240ms)</text>
  <text x="826" y="442" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">食品区违规喷非食品级药挂起 / IoT 优化+去增项省 $18,900</text>

  <rect x="812" y="468" width="324" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="826" y="490" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">💡 IoT 靶向巡检与剔除违规返工费后净付：$191,100 (省 9.0%)</text>
  <text x="826" y="510" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="11">令牌：b2b_commercial_pest_control_ipm_iot_smart_trap_...</text>

  <!-- Footer -->
  <rect x="48" y="556" width="1104" height="80" rx="10" fill="#020617" stroke="#334155"/>
  <text x="68" y="582" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 严禁凭外贴表面条码结算消杀费，必须将加密 NFC 芯片铆接在诱饵盒盖内侧 (&gt;=99% 开盒扫描率) 并联动 24/7 IoT 捕鼠遥测。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 密闭熏蒸强制绑定无线气体传感器 CT (ppm·h) 杀卵积分曲线，并通过 Web IQ 逐单校验 EPA Reg. No. 食品接触区施药合规。</text>
</svg>

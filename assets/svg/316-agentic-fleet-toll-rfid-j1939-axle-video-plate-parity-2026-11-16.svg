  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业车队过路费与罚单四大黑洞 (Legacy Fleet Toll Leakage: 20%–45%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. $1.50 过桥费加收 $15 租车行政费或 $5.95/天包日租 (Predatory Admin Fee)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">服务车租期 10 天仅过一次 $1.50 匝道，租赁商却按每笔加收 $15.00 行政手续费</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">(溢价 1000%)，或激活整租期 10天×$5.95=$59.50 电子标签日租；邻道串读也照付。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 卸下挂车的 3 轴单车头 (Bobtail) 被按 5 轴满载重卡扣费 (Axle Overbilling)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">重卡在物流园甩挂后单车头 (3轴，应交 $28) 返程或空载升起悬浮轴，龙门架却按</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">标签默认最高档 5 轴半挂重卡扣 $92，单次过杆多扣 $64，全年流失十余万美元。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 标签没电走车牌识别被收 2 倍视频最高价 + $50 罚单 (Video-Toll Penalty)</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">货车车牌早已登记在企业 E-ZPass 预付费白名单中，仅因挡风玻璃标签电池衰减未</text>

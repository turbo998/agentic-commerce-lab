  <rect x="498" y="580" width="215" height="40" rx="6" fill="#450A0A"/>
  <text x="510" y="598" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 422 · 14ms</text>
  <text x="510" y="614" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="11">拦 5 倍盐量虚报与雨天喷灌</text>

  <rect x="725" y="580" width="205" height="40" rx="6" fill="#3B0764"/>
  <text x="737" y="598" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 451 · 275ms</text>

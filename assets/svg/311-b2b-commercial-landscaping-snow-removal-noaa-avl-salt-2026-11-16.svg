  <text x="636" y="156" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">✅ NOAA 双源雪深锁 + AVL 撒盐遥测 + Web IQ 公报核验架构</text>

  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. NOAA 认证雪深 (&gt;=2.0") 触发锁 + 24h 风暴合并 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">强制比对园区邮编网格 NOAA ASOS 与现场超声雪深传感器 (&lt;2.0" 严禁收铲雪费)，</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">并将 24 小时同一气旋锋面强制合并为单次风暴阶梯计费，11ms 封杀拆单套利。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 撒盐车 AVL 螺旋脉冲计量 (&lt;=0.4T/英亩) + 雨天停灌门禁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">直连车载 AVL 撒布控制器读取电子围栏内真实螺旋给料转数，按 SIMA 面积上限</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">封顶用盐吨数；夏季核验 EPA WaterSense 雨量闭锁与割草机 PTO 真实运转工时。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 NOAA 风暴公报与 ASCA 认证 (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 穿透核查 NOAA NWS 官方地方风暴终审报告、承包商 ASCA ISO 22325</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">认证与州农业厅商业施药执照，生成法庭级防滑倒诉讼 (Slip-and-Fall) 抗辩铁证。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动按官方雪深阶梯重算并核减超标融雪盐吨位 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将虚报跳档回调至 NOAA 实测档位、按 AVL 实测磅重结算融雪盐并追回水费：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $165,000.00 → 自动核减 $24,750.00 (15.0%) → 净付 $140,250.00！</text>


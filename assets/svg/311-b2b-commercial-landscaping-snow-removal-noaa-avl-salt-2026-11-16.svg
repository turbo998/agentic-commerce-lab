  <!-- Header -->
  <text x="48" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 309 · B2B COMMERCIAL LANDSCAPING, SMART IRRIGATION &amp; WINTER SNOW/DE-ICING (NOAA ASOS &amp; ASCA ISO 22325)</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">园区园林与冬季除雪：NOAA 2英寸雪深锁、AVL 撒盐遥测 vs 0.2英寸薄霜强铲与 5 倍盐量虚报</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_commercial_landscaping_snow_removal_noaa_depth_avl_salt_spreader_mandate_2026 · 15.0% Savings ($24,750 / Batch)</text>

  <!-- Left Panel: Legacy Snow & Landscaping Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统冬季除雪与园林外包四大黑洞 (Legacy Snow &amp; Grounds Leakage: 28%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 未满 2 英寸起铲线强行出车收割 (Phantom 0.3-Inch Flurry Plow Push)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">合同规定积雪 &gt;=2.0 英寸才启动重型铲雪 ($4,500/次)，承包商却在凌晨 3 点趁</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">0.3 英寸薄霜空刮一圈，天亮雪化死无对证，照开 $14,000 多站点全额出车单。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 一场中雪人为拆成 3 次独立出车与虚报跳档 (Storm Splitting &amp; Creep)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">持续 6 小时的 4.2 英寸降雪本应按单一风暴档位收 $6,200，承包商故意每下 1.5</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">英寸就进场推一次，拆成 3 笔独立铲雪单收 $13,500，或将 3.8" 谎报为 4.1" 跳档。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 融雪盐吨位虚报 5 倍与“一车盐卖四家” (5x De-Icing Salt Tonnage Padding)</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">10 英亩停车场按 SIMA 标准撒布仅需 3.5 吨岩盐，手写单却虚报 18 吨 ($380/吨)；</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">司机拉一车 12 吨融雪盐跑 4 个园区，却给每个甲方各开一张 12 吨整车发票。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 夏季暴雨天照开喷灌浪费水费与滑倒诉讼败诉 (Rain Irrigation &amp; Slip Risk)</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">暴雨周未闭锁喷淋系统导致水费暴涨 40% 并诱发草坪真菌病；冬季纸质补签日志无</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">NOAA 气象与 GPS 盐量防伪存证，遇顾客滑倒骨折诉讼直接面临 $150,000 败诉赔偿。</text>

  <!-- Right Panel: Agentic NOAA + AVL Architecture -->

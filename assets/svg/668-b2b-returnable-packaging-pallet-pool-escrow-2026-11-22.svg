  <text x="622" y="480" class="body-txt">serials to `myCHEP` on ship</text>
  <text x="622" y="498" class="body-txt">day to stop supplier rent;</text>
  <text x="622" y="516" class="mono" fill="#6ee7b7">Saves 18 Days Phantom Rent</text>

  <rect x="893" y="418" width="259" height="120" rx="8" fill="#1e293b" stroke="#10b981"/>

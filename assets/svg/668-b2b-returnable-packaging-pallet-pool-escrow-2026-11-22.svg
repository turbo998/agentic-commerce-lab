  <rect x="28" y="22" width="1144" height="68" rx="12" fill="#0f172a" stroke="url(#hdr668)" stroke-width="2"/>
  <text x="48" y="51" class="title">Round 225 · B2B Returnable Transport Packaging (`RTP`) &amp; Pallet-Pool (`CHEP / IFCO`) Escrow</text>
  <text x="48" y="74" class="sub">SAP LEIH (`MIGO 501M/502M`) / CHEP / IFCO / EPAL · 1-for-1 Dock Drop-and-Swap · GRAI-96 RFID Gate · Dwell Cap (-35% Loss)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1081" y="59" text-anchor="middle" class="mono" fill="#a7f3d0">SVG #668 · FAQ #344</text>

  <!-- Lane 1: Dock Pallet Short-Swap ("Dropped 22 CHEP Pallets, Took 30 Empty") & Grade Downgrade Guard -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Dock `GRAI` Scan &amp; Grade Lock (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Driver Taking 30 Pallets After Dropping 22:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Dock_Portal_RFID_Out &lt;= `ASN_Inbound_RTP_Qty`</text>
  <text x="54" y="200" class="mono">+ Dual-Signed `e-BOL Pallet Exchange Receipt`!</text>
  <text x="44" y="223" class="body-txt">• Stops Swapping Grade-A `EPAL/CHEP` for Junk Wood:</text>
  <text x="54" y="243" class="mono">Verify `GS1 GRAI-96 Tag` &amp; `EPAL/UIC` Burn Stamp</text>
  <text x="44" y="266" class="body-txt">• Eliminates $38/unit lost-equipment penalties</text>
  <text x="54" y="286" class="body-txt">caused by drivers loading extra empty pallets or</text>
  <text x="54" y="304" class="body-txt">dumping broken white-wood pallets in exchange</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 DOCK_PALLET_OVER_PICKUP_OR_WHITEWOOD_SWAP_BLOCK</text>


  <text x="62" y="462" class="body-txt">Loads folded `IFCO` crates</text>
  <text x="62" y="480" class="body-txt">&amp; stacked `CHEP` pallets on</text>
  <text x="62" y="498" class="body-txt">returning empty fleet trucks;</text>
  <text x="62" y="516" class="mono">-62% Reverse LTL Freight</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="337" y="440" class="card-hdr">② Dock Door CV + RFID Arch</text>
  <text x="337" y="462" class="body-txt">Counts blue/red pallets &amp;</text>
  <text x="337" y="480" class="body-txt">reads `GS1 GRAI` tags as</text>
  <text x="337" y="498" class="body-txt">forklift drives into trailer;</text>
  <text x="337" y="516" class="mono">0 Manual Tally Sheet Errors</text>

  <rect x="608" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>

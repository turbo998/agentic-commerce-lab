  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. Transfer Cutoff &amp; `LEIH` Gate (HTTP 422)</text>
  <text x="432" y="162" class="body-txt">• Stops Billing Daily Rent After Pallet Shipped Out:</text>
  <text x="442" y="182" class="mono">Stop_Supplier_Rent_Clock_At(`EDI_856_Ship_TS`)!</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">Auto-Transfer Liability to Retailer Pool Account</text>
  <text x="432" y="223" class="body-txt">• `SAP LEIH` (`MIGO 501M/502M`) Non-Valuated Sub-Ledger:</text>
  <text x="442" y="243" class="mono">Isolate Refundable Container Deposit From Goods VAT</text>
  <text x="432" y="266" class="body-txt">• Prevents suppliers paying 60 days of $0.08/day</text>
  <text x="442" y="286" class="body-txt">CHEP/IFCO dwell rent on crates that were shipped</text>
  <text x="442" y="304" class="body-txt">to the grocery retailer 2 months ago</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 POST_TRANSFER_DWELL_RENT_OR_LEIH_VAT_ERROR_BLOCK</text>

  <!-- Lane 3: ISPM-15 Phytosanitary Heat-Treat & Food-Contact Sanitization Wash Lock -->
  <rect x="804" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. `ISPM-15` &amp; `FSMA` Wash Lock (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Cross-Border Wood Packaging `ISPM-15 (IPPC)` Lock:</text>
  <text x="830" y="182" class="mono">Require `IPPC_HT_Stamp` on All Cross-Border Wood</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">(Prevents Customs Quarantine &amp; Container Re-Export!)</text>
  <text x="820" y="223" class="body-txt">• `FDA FSMA` Food-Grade `RPC` Wash Cycle Proof:</text>
  <text x="830" y="243" class="body-txt">Blocks dispatching unwashed/untested `IFCO/Tosca`</text>
  <text x="830" y="261" class="body-txt">plastic produce crates to fresh-food packers</text>
  <text x="820" y="284" class="body-txt">• Eliminates port rejection of entire ocean</text>
  <text x="830" y="302" class="body-txt">containers over a single unstamped wooden pallet</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 MISSING_ISPM15_HT_STAMP_OR_UNWASHED_FOOD_RPC_HOLD</text>

  <!-- Bottom Backhaul Empty-Stack Consolidation & Automated 90-Day Lost-Crate Buyout -->
  <rect x="28" y="374" width="1144" height="182" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="48" y="401" class="card-hdr" fill="#38bdf8">4. Deadhead Backhaul Empty-Crate Sweep + Automated `EDI 856` Pool-Account Transfer (HTTP 409)</text>

  <rect x="48" y="418" width="255" height="120" rx="8" fill="#1e293b" stroke="#334155"/>

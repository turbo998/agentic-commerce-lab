  <rect x="608" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="626" y="604" class="kpi-num" fill="#f59e0b">-18d Rent</text>
  <text x="626" y="626" class="kpi-lbl">Instant `EDI 856 -> myCHEP` Off-Hire</text>
  <text x="626" y="642" class="mono">Clean SAP LEIH Deposit Ledger</text>

  <rect x="898" y="572" width="274" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="916" y="604" class="kpi-num" fill="#f472b6">100% ISPM-15</text>
  <text x="916" y="626" class="kpi-lbl">Cross-Border Heat-Treat Verified</text>
  <text x="916" y="642" class="mono">+ FSMA Sanitized Produce RPCs</text>

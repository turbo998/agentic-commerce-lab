  <text x="907" y="462" class="body-txt">Pings customer at Day 45</text>
  <text x="907" y="480" class="body-txt">before 60d lost-container</text>
  <text x="907" y="498" class="body-txt">replacement fee ($38) fires;</text>
  <text x="907" y="516" class="mono" fill="#38bdf8">-35% RTP &amp; Pallet Pool Loss</text>


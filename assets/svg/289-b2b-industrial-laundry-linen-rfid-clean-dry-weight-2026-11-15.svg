<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg289" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent289" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg289)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent289)"/>

  <!-- Header -->
  <text x="52" y="62" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-15 · ROUND 287 · B2B HOSPITAL &amp; HOTEL INDUSTRIAL LAUNDRY UHF RFID, CLEAN-DRY WEIGHT &amp; HLAC</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">B2B 医院与酒店工业布草洗涤租赁：UHF RFID 理论干重封顶、洗次折旧与 HLAC 院感清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">严禁按吸满体液/水渍的脏布湿重 (+28%) 计费 · min(地磅净重, RFID件数×标准干重) 挤干微潮水分 · 芯片记录水洗次数防洗破旧布按新品索赔</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统工业布草洗涤租赁三大黑洞 (虚高 18%–32%)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 按回收脏布湿重过磅 (Wet-Soiled Billing)</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 病房/客房换下的脏床单吸满汗液、生理盐水与洗澡水</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 重量比干布暴增 28%–35%，甚至混入纸尿裤与医疗垃圾</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 医院与酒店每年白花十多万美元替“脏水”付洗涤费</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 笼车标牌皮重造假与未烘透“微潮送货”</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 周转笼车喷漆写皮重 80 磅，加装底板与积水后实重 110 磅</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 烘干机提前 5 分钟出炉保留 15% 水汽，每车多算 50 磅</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 每天 40 车布草被笼车铁皮与水汽白吃 2,000+ 磅费用</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 强收 16% 固定丢损费与旧床单按 100% 新品敲诈</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 床单在洗涤厂 60-bar 压榨机里洗满 105 次自然老化撕裂</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 统统栽赃为“酒店客人烟头烫破或护士剪坏 (Ruin Fee)”</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 按 $18/条全新采购价索赔，外加每月 16% 固定丢损摊派</text>

  <!-- Center Card: Agentic Policy Engine -->
  <rect x="422" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="422" y="136" width="356" height="38" rx="12" fill="#164E63"/>
  <text x="442" y="160" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体 RFID 理论干重、洗次折旧与院感三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#0E7490"/>
  <text x="452" y="210" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：净布干重 (Clean-Dry) 与动态空车去皮锁</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁按脏布湿重计费，每辆空笼车回收时动态过磅锁死真皮重</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 结算重量 = min(地磅净重, UHF RFID 件数 × 标准干重)</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 阻断脏布湿重计费与笼车皮重造假</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#0E7490"/>
  <text x="452" y="326" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：EPC Gen2 RFID 洗次寿命折旧与责任门禁</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 芯片记录累计水洗次数，洗满 &gt;=85 次自然撕裂 $0 免赔</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 院内遗失严格按剩余洗次线性折旧，废除 16% 固定丢损费</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 拦截旧布按新品索赔与固定比例摊派</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#0E7490"/>
  <text x="452" y="442" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ HLAC / TRSA 院感与 71°C 消杀锁</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 核验 HLAC / TRSA 医疗洗涤认证有效</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 穿透核查隧道洗涤机 (CBW) 71°C×25min 与 USP &lt;61&gt; 菌落</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $30,600</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="796" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="796" y="136" width="356" height="38" rx="12" fill="#064E3B"/>
  <text x="816" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 医院与酒店月度洗涤 ($340,000) 实测矩阵</text>

  <rect x="812" y="188" width="324" height="60" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="826" y="210" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="826" y="232" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">净布干重 + 动态笼车去皮 + RFID 折旧合规 → 清算 $340k</text>

  <rect x="812" y="258" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="280" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="826" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">按脏布湿重过磅 (+28%) 或笼车皮重少标 30 磅 → 拦截</text>

  <rect x="812" y="328" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="826" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">洗满 105 次旧床单按新品索赔或收 16% 丢损费 → 阻断</text>

  <rect x="812" y="398" width="324" height="60" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="826" y="420" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 (275ms) / 🧑‍⚖️ HTTP 409 (240ms)</text>
  <text x="826" y="442" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">HLAC 院感失效挂起 / RFID 干重封顶+折旧省 $30,600</text>

  <rect x="812" y="468" width="324" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="826" y="490" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">💡 理论干重挤水与洗次折旧后净付：$309,400 (省 9.0%)</text>
  <text x="826" y="510" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="11">令牌：b2b_hospital_hotel_industrial_laundry_linen_...</text>

  <!-- Footer -->
  <rect x="48" y="556" width="1104" height="80" rx="10" fill="#020617" stroke="#334155"/>
  <text x="68" y="582" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 工业洗涤费严禁按回收脏布湿重结算，必须按 min(收货地磅净重 - 实测空车皮重, UHF RFID 件数 × 标准干重) 计费。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 布草报废与丢失赔偿强制绑定 EPC 芯片累计水洗次数线性折旧，且医院洗涤厂必须通过 Web IQ 持续核验 HLAC/TRSA 院感认证。</text>
</svg>

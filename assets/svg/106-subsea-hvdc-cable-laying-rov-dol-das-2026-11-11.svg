  </text>

  <!-- Center Card: 4-Layer Subsea Cable Mandate Engine -->
  <rect x="415" y="132" width="370" height="360" rx="12" fill="url(#cardBg106)" stroke="#0EA5E9" stroke-width="2"/>
  <rect x="431" y="148" width="338" height="32" rx="6" fill="#0C4A6E"/>
  <text x="600" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#E0F2FE" text-anchor="middle">

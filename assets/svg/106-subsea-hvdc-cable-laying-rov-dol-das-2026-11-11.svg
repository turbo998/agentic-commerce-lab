  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="823" y="204" font-weight="700" fill="#6EE7B7">• 全线埋深 &gt;=1.5m 与光纤零过弯放款 (200)</text>
    <text x="823" y="223" fill="#CBD5E1">  延迟：21 ms · 放款：$420,000.00</text>

    <text x="823" y="253" font-weight="700" fill="#FCA5A5">• 跳犁浅埋 (&lt;1.5m) 或悬空段拦截 (403)</text>
    <text x="823" y="272" fill="#CBD5E1">  延迟：12 ms · 拦截虚报款：$420,000.00</text>

    <text x="823" y="302" font-weight="700" fill="#FCA5A5">• BOTDR 弯曲半径折损/光纤超应变拦截 (422)</text>
    <text x="823" y="321" fill="#CBD5E1">  延迟：15 ms · 锁定敷设船机械扭折责任</text>

    <text x="823" y="351" font-weight="700" fill="#FDE68A">• Web IQ 基岩段精准抛石 (Rock Dumping) 折让 (409)</text>
    <text x="823" y="370" fill="#CBD5E1">  延迟：305 ms · 节省：$58,000.00 (13.8% 扣减)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  125 / 125 单元测试 100% 通过 (CSP 自包含)</text>
  </g>
  <rect x="823" y="442" width="319" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="982" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">
    杜绝全球海缆 80% 故障根源：浅埋裸露遭船锚拉断
  </text>

  <!-- Footer Banner -->
  <rect x="40" y="512" width="1120" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="541" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700" fill="#7DD3FC">
    🏛️ 架构师选型铁律 (Takeaway): 绝对不要凭铺缆船“冲埋犁滑靴角度传感器日志”就结清海缆敷设与冲埋尾款！
  </text>
  <text x="60" y="565" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    必须绑定：① 独立 ROV TSS-440 电磁探测与多波束声呐实测埋深 DoL &gt;=1.5m 且零悬空 (12ms 拦 403)；② 布里渊光时域反射仪 (BOTDR) 弯曲半径 &gt;=3.5m MBR 且应变 &lt;=1,500 με (15ms 拦 422)；
  </text>
  <text x="60" y="586" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    ③ Web IQ 核查 UXO 未爆弹清障证书与海事局 NtM 禁锚通告 (295ms 拦 451)，并对海底基岩浅埋段自动核算落管船精准抛石 (Rock Placement) 扣减方案 (305ms 省 $58,000)。
  </text>

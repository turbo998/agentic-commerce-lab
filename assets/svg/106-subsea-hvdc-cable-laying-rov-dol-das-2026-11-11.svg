<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg106" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051324"/>
      <stop offset="50%" stop-color="#0C223B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent106" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cardBg106" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112740"/>
      <stop offset="100%" stop-color="#081526"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg106)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent106)"/>

  <!-- Header -->
  <rect x="40" y="24" width="390" height="28" rx="14" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
  <text x="235" y="43" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#E0F2FE" text-anchor="middle">
    ROUND 104 · SUBSEA HVDC CABLE LAYING &amp; ROV BURIAL ESCROW
  </text>
  <text x="40" y="84" font-family="Segoe UI, Ubuntu, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">
    海底高压海缆铺设 (Subsea HVDC)、ROV 实测埋深 (&gt;=1.5m) 与光纤弯曲半径智能托管
  </text>
  <text x="40" y="111" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" fill="#94A3B8">
    ROV TSS-440 Depth-of-Lowering (DoL &gt;=1.5m), Brillouin BOTDR Strain/MBR &amp; AIS Anchor-Drag Guard vs. Shallow-Burial Strike Overbilling
  </text>

  <!-- Left Card: Legacy Plow-Log & Shallow Exposure Failure -->
  <rect x="40" y="132" width="355" height="360" rx="12" fill="url(#cardBg106)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="148" width="323" height="32" rx="6" fill="#450A0A"/>
  <text x="217" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">
    ❌ 传统凭犁刀深度日志盲付与拖锚断缆踩坑
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 冲埋犁遇硬粘土“跳犁 (Plow Skip)”致海缆裸露</text>
    <text x="58" y="224" fill="#CBD5E1">• 铺缆船交完进度表收走 $420,000 里程碑款</text>
    <text x="58" y="242" fill="#CBD5E1">• 实际埋深仅 0.3m 甚至悬空 (Free-Span)，遭拖网/船锚拉断</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 下水张力失控致最小弯曲半径 (MBR) 折损绝缘</text>
    <text x="58" y="294" fill="#CBD5E1">• 船尾溜槽过弯半径 &lt; 3.5m MBR 或拉应力 &gt; 120 kN</text>
    <text x="58" y="312" fill="#CBD5E1">• 铅护套微裂纹与 XLPE 绝缘树枝放电，投运半年击穿</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 缺失海底未爆弹 (UXO) 扫测或禁锚区 AIS 航警</text>
    <text x="58" y="364" fill="#CBD5E1">• 路由穿过二战水雷磁异常区或未发 NtM 航海通告</text>
    <text x="58" y="382" fill="#CBD5E1">• 海事保险拒赔 (单次海上打捞重接损失 &gt;$18M)</text>
  </g>
  <rect x="58" y="442" width="319" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="217" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">

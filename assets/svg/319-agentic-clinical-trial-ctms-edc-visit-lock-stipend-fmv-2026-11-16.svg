  <!-- Header -->
  <text x="48" y="58" fill="#818CF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 317 · AGENTIC CLINICAL TRIAL SITE GRANTS, EDC VISIT-LOCK &amp; PATIENT STIPEND RECONCILIATION (ICH E6 R3)</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">临床试验中心经费与患者津贴：EDC 锁库触发锁、筛查比例封顶 vs 14:1 刷筛查费与 0 入组僵尸月费</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: agentic_clinical_trial_ctms_edc_visit_lock_patient_stipend_fmv_mandate_2026 · 15.0% Savings ($39,000 / Batch)</text>

  <!-- Left Panel: Legacy Clinical Trial Site Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统临床试验中心发票结算四大黑洞 (Legacy Clinical Trial Leakage: 22%–40%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 恶意刷筛查失败率套取 $1,200/例筛查费 (14:1 Screen-Fail Farming)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">合同允许报销筛查失败成本（上限 &lt;=2:1），部分中心将明显不符合病史的门诊患者</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">拉来凑数抽血，仅随机入组 1 人却申报 14 例筛查失败，单中心套走 $16,800。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 未录入 EDC eCRF 或重大方案违背照领随访款 (Unverified Visit Invoices)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">凭纸质发票提前打款 $3,400/访视，事后 CRA 监查才发现电子病例表 (eCRF) 根本</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">未填，或受试者漏做核心终点 CT 属重大方案违背 (Major Deviation) 导致数据作废。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 0 入组“僵尸中心”连领 18 个月药房与档案管理费 (Zombie Site Retainers)</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">中心启动 (SIV) 后整整一年 0 例入组，或末例患者早已出组 (LPLV) 却拖延不办</text>

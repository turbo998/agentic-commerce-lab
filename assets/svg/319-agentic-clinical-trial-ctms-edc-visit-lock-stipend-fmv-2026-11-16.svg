  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 患者 $75 交通卡被暗扣 $4.50/月休眠费 + 超 FMV 触发反回扣调查</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">发给受试者的预付借记卡被平台每月暗扣 $4.50 休眠管理费引发 IRB 伦理违规；或</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">向 PI 支付超出公平市场价值 (FMV 75分位) 3 倍的观察费触发 DOJ 反回扣法重罚。</text>


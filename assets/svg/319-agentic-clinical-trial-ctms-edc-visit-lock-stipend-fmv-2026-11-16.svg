  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. EDC eCRF 锁库+SDV 触发锁 + &lt;=2:1 筛查封顶 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">废除纸质发票催款，仅当 Medidata/Veeva eCRF 录入完成、SDV 通过且零重大方案</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">违背时才生成支付令；强制锁定 Screen-Fail &lt;=2:1 入组人数封顶，11ms 拦刷单。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 90天 0入组僵尸中心月费冻结 + 患者卡 100% 免扣费 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">对启动满 90 天仍 0 入组或已过 LPLV 的中心自动冻结月度药房与档案维护费；强制</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">受试者交通津贴卡 100% 净额到账，严禁从患者卡内扣除任何休眠费或 ATM 取现费。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 FDA 禁入名单与阳光法案 FMV (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 穿透核查主要研究者 (PI) 是否列于 FDA Debarment / CLIIL 禁入名单、IRB</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">伦理批件有效期及单次操作费是否突破 CMS/Sunshine Act FMV 75th 分位红线。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动核减超标筛查费并执行 15% 数据库锁库留置金 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动剔除超 2:1 筛查失败水分并预扣 15% Close-Out Holdback 直至全中心锁库：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $260,000.00 → 自动核减/留置 $39,000.00 (15.0%) → 当期净付 $221,000.00！</text>


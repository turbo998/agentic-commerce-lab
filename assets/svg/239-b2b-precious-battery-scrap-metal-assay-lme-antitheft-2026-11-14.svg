  <text x="159" y="57" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 237 · BLACK MASS &amp; SCRAP</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">B2B 动力电池黑粉与贵金属回收 ICP-OES 仲裁化验、LME 折算与防盗赃架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">球磨缩分 ICP-OES/火试金 + 17位拆车 VIN 防盗锁令牌 (`b2b_precious_battery_scrap_metal_assay_lme_antitheft_mandate_...`) vs 盖帽掺假</text>


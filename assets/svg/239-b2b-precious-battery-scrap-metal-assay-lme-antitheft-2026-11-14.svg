  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：手持 XRF 测表层被盖帽掺假骗走 $40万 + 现金收盗赃催化器遭全批没收</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 太空袋“表层撒高钴粉、底层填废铁渣 (Salting)” + 现金收黑货：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 手持 XRF 枪测不出锂 (Li) 且仅穿透 2mm，按表层快检付 90% 预付款当场巨亏；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 现金收购无 17位 VIN 报废证明的被盗三元催化器/铜缆，遭警方查封没收整炉贵金属！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 把 18% 的水分当成贵金属干重买单，或超 0.25% 化验公差强行放款：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 未做 105°C 恒重扣水与高氟/高铁杂质罚金核减，导致湿法冶金萃取率暴跌亏穿毛利。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 违反欧盟黑粉危废新规 (19 12 11*) 与《巴塞尔公约》越境转移：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 未持事先知情同意书 (PIC) 或违规向非 OECD 国出口危废黑粉，遭海关扣船重罚。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

  <text x="890" y="161" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：球磨缩分 ICP-OES 仲裁托管 + VIN 防盗锁 + LME 干基网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 整批球磨混匀 + 旋转缩分三份样 + ISO 17025 ICP-OES/火试金：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 硬拦截表面 XRF 快检请款与无 NMVTIS 17位拆车 VIN 的现金收赃；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 强制执行法定 3–10 天防盗留置期与实名对公电汇，100% 免疫司法查封没收！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 105°C 烘干扣水 + 氟/铁杂质罚金 + ≤0.25% 公差仲裁锁：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 仅按干基可付金属净重 × LME 计价系数结算；超公差自动触发 SGS 铅封样终局裁决。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 巴塞尔核验与防损增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动剥离 18% 掺水湿重与杂质超标水分，单批核减/立省 $62,400.00 (HTTP 409)！</text>


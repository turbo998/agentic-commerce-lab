  <!-- Header -->
  <text x="48" y="58" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 305 · B2B HEAVY CONSTRUCTION EQUIPMENT, AERIAL LIFT &amp; SCAFFOLDING RENTAL (ISO 15143-3 AEMP 2.0)</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">工程机械与高空车租赁：Off-Rent 停租确认锁、COI 免除 16% RPP 门禁 vs 报停后拖延收租与双班工时加价</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_heavy_equipment_rental_aemp20_telematics_offrent_confirmation_rpp_waiver_mandate_2026 · 15.0% Fleet Savings ($34,500 / Batch)</text>

  <!-- Left Panel: Legacy Rental Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统工程机械租赁四大黑洞 (Legacy Equipment Rental Leakage: 18%–35%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 电话报停后拖延 7 天不拉车照收租金 (Post-Call-Off Pickup-Delay Billing)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">周五下午已电话报停 3 台 80 尺曲臂车，门店因平板拖车排期慢拖延 8 天才拉走，</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">却按“实际回场扫描日”多收 $10,080；或因装车挪位 0.2h 自动恢复全额计费。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 已交商业设备浮船险 COI 仍强收 16% RPP (Mandatory RPP/LDW Stacking)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">总包已提供 $5M Contractors' Equipment Floater COI，但新开子工地账号默认勾选</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">15%–16% RPP 损坏免责费 + 3.5% 环保费，把账面租金隐形推高近 20%。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 怠速计入双班超时费与日租叠加 (Phantom Double-Shift &amp; Rate Inversion)</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">将钥匙未拔空转热车计入 160h/28天限额，按 1.5x 双班费加收 $1,800；或对连续</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">续租 5 天的设备按 $380/天×5=$1,900 计费，拒不折算为 $1,050/周封顶价。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. $11.50/加仑天价柴油费与正常泥浆磨损索赔 (Refuel &amp; Mud Backcharges)</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">退场少 25 加仑红油按 $11.50/Gal 扣 $287.50；把实心轮胎正常工地碎石印算作</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">$3,200 人为损坏，或派发 ANSI A92.20 年检过期高空车引发 OSHA 停工罚单。</text>

  <!-- Right Panel: Agentic AEMP 2.0 + Off-Rent Architecture -->

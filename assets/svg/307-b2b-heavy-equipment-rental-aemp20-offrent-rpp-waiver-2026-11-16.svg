  <rect x="616" y="132" width="540" height="38" rx="12" fill="#064E3B"/>
  <text x="636" y="156" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">✅ AEMP 2.0 遥测 + Off-Rent 时间戳冻结清算架构 (Deterministic Gates)</text>

  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Off-Rent 确认号秒级截断 + &lt;=0.5h 装车免责锁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">以 API Off-Rent Confirmation 时间戳秒级冻结计费时钟；AEMP 2.0 验证报停后</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">位移 &lt;=0.5h 属平板拖车装车正常操作，彻底封杀门店延迟拉车产生的幽灵天租。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 全局 COI 自动清零 16% RPP + 有效载荷工时计量 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">绑定企业 Equipment Floater COI 强制全工地 RPP/LDW = $0；直连 ISO 15143-3</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">剔除空转怠速工时，仅当真实液压/发电载荷工时超标时按线性费率核算。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 ANSI A92.20 年检与 EPA Tier 4 (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 穿透核验高空车 ANSI A92.20 / OSHA 1926.453 年度结构检验签名与非道路</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">柴油机 CARB/EPA Tier 4 Final 登记，拦截未年检高危设备进场结算。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. Best-Rate 日/周/4周阶梯最优折算 + 豁免 RPP (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将连续天租/周租折算为 4 周封顶价并剥离 16% RPP 与 $11.50/Gal 油费差价：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $230,000.00 → 自动核减 $34,500.00 (15.0%) → 净付 $195,500.00！</text>


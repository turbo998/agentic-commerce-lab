  <rect x="28" y="22" width="1144" height="68" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="48" y="51" class="title">Round 246 · Hotel Direct `Points+Cash`, `5th-Night-Free` &amp; `Plusgrade / Nor1` Upgrade Escrow</text>
  <text x="48" y="74" class="sub">Marriott Bonvoy / Hilton Honors / Oracle Opera Nor1 / Plusgrade · `CPP &gt;= 0.8¢` Floor · `5th-Night` Merge · `T-24h` Suite Clear (-36%)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1081" y="59" text-anchor="middle" class="mono" fill="#a7f3d0">SVG #689 · FAQ #365</text>

  <!-- Lane 1: Sub-Floor Cents-Per-Point (CPP < 0.8c) Burn & Splitting a 5-Night Stay Losing "5th Night Free" -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. `CPP` Floor &amp; `5th-Night` Gate (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Blocks Burning Points Below `CPP` Valuation Floor:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Require `Redemption_CPP == (Cash_Net - Taxes) /`</text>
  <text x="54" y="200" class="mono">`Points &gt;= Hurdle_Floor (0.80¢ / 1.50¢)`!</text>
  <text x="44" y="223" class="body-txt">• Prevents Splitting 5-Night Award Stays:</text>
  <text x="54" y="243" class="mono">Enforce Single `5-Night PNR` for `5th_Night_Free`</text>
  <text x="44" y="266" class="body-txt">• Stops naive agents burning `100,000` points for</text>
  <text x="54" y="286" class="body-txt">a `$320` roadside motel (`0.32¢/pt`) or losing</text>
  <text x="54" y="304" class="body-txt">80,000 points by booking `2 + 3` separate nights</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 SUB_FLOOR_CPP_POINT_BURN_OR_SPLIT_5TH_NIGHT_LOSS</text>


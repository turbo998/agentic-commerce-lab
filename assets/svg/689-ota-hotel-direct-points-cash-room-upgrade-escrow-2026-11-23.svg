  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. Broker `ATO` &amp; Expiry Gate (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Stops Gray-Market Broker "Second-Guest" Swaps:</text>
  <text x="830" y="182" class="mono">Require `FIDO2_StepUp` When Adding Unrelated</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">`2nd_CheckIn_Guest` on High-Value Award Stays!</text>
  <text x="820" y="223" class="body-txt">• 30-Day Grace Extension on Canceled Award Points:</text>
  <text x="830" y="243" class="body-txt">Prevents points or Free-Night Certificates (`FNC`)</text>
  <text x="830" y="261" class="body-txt">from instantly expiring into thin air when a</text>
  <text x="830" y="279" class="body-txt">hotel or flight cancellation forces a rebook</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 BROKER_SECOND_GUEST_ATO_OR_CANCELED_FNC_FORFEITURE</text>


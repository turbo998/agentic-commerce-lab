  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. `PMS` Suite Lock &amp; Resort-Fee Gate (HTTP 422)</text>
  <text x="432" y="162" class="body-txt">• Never Capture Upgrade Bid Before `PMS` Room Lock:</text>
  <text x="442" y="182" class="mono">Require `Opera_PMS_Room_Assigned == True` &amp;</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">Verify `Unobstructed_View / Non_Connecting`!</text>
  <text x="432" y="223" class="body-txt">• Blocks Illegally Charging `$55` Resort Fee on Awards:</text>
  <text x="442" y="243" class="mono">Enforce `$0_Resort_Fee` on `Hilton/Hyatt Awards`</text>
  <text x="432" y="266" class="body-txt">• Prevents charging a guest `$150/night` for an</text>
  <text x="442" y="286" class="body-txt">Ocean Suite upgrade only for the front desk to</text>
  <text x="442" y="304" class="body-txt">say "Sorry, suites are sold out" at check-in</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 UNASSIGNED_PMS_UPGRADE_CAPTURE_OR_AWARD_RESORT_FEE</text>


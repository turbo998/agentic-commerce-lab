  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">PunchOut 强制 disable_checkout=true 回传采购车 · SFTP 禁 replace · EA/CS 箱件换算锁 · 立省 $54,600.00 (21.0%)</text>


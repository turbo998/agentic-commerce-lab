  <rect width="1200" height="675" fill="url(#bg640)"/>
  <rect x="28" y="22" width="1144" height="68" rx="12" fill="#0f172a" stroke="url(#hdr640)" stroke-width="2"/>
  <text x="48" y="51" class="title">Round 197 · Corporate Travel Hotel RFP, LRA Squatting Audit &amp; Dynamic BAR-Cap Escrow</text>
  <text x="48" y="74" class="sub">Cvent Transient / Sabre / Amadeus / Tripbam · LRA Availability Enforcement · Min(Fixed_LRA, 0.85×BAR) · Jan-2 GDS Rate Audit (-34% Spend)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1081" y="59" text-anchor="middle" class="mono" fill="#a7f3d0">SVG #640 · FAQ #316</text>

  <!-- Lane 1: Peak-Season LRA Squatting & Fake Sold-Out Blackout Guard -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Peak-Season LRA Squatting Lock (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Closing $220 Corp Rate When $490 BAR Is Open:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">If Standard_King_BAR == Open &amp; Corp_LRA == Closed:</text>
  <text x="54" y="200" class="mono">Flag `LRA_Breach` &amp; Claim Rate-Delta Credit!</text>
  <text x="44" y="223" class="body-txt">• Unapproved Conference Blackout Date Filter:</text>
  <text x="54" y="243" class="mono">Reject Blackout Dates Not Signed in Cvent Addendum</text>
  <text x="44" y="266" class="body-txt">• Prevents hotel revenue managers from secretly</text>
  <text x="54" y="286" class="body-txt">throttling negotiated Last Room Availability (`LRA`)</text>
  <text x="54" y="304" class="body-txt">inventory during high-demand trade-show weeks</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 LRA_AVAILABILITY_SQUATTING_OR_BLACKOUT_BLOCKED</text>

  <!-- Lane 2: Off-Peak BAR Undercutting Fixed Corporate Rate ("Reverse Overpay") Guard -->
  <rect x="416" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. Off-Peak BAR Undercut Shield (HTTP 422)</text>
  <text x="432" y="162" class="body-txt">• Stops Paying $220 Fixed Corp Rate When BAR Is $160:</text>
  <text x="442" y="182" class="mono">Enforce `Rate_To_Book = Min(Fixed_Corp, 0.88×BAR)`</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">Retain Free-Cancel &amp; Breakfast Perks on Lower BAR</text>
  <text x="432" y="223" class="body-txt">• Jan-2 GDS Rate-Loading &amp; Amenity Audit:</text>
  <text x="442" y="243" class="mono">Verify `Sabre/Amadeus` Loaded Exact Negotiated Rate</text>
  <text x="432" y="266" class="body-txt">• Fixes the #1 corporate travel embarrassment:</text>
  <text x="442" y="286" class="body-txt">18% of negotiated hotel rates are either loaded</text>
  <text x="442" y="304" class="body-txt">wrong in GDS in Q1 or pricier than public winter rates</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 PUBLIC_BAR_UNDERCUT_OR_GDS_MISLOAD_BLOCKED</text>

  <!-- Lane 3: Low-Volume City Heavy RFP Waste & Unbundled Resort/Urban Fee Lock -->
  <rect x="804" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. Resort-Fee Waiver &amp; Tier Gate (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Stops $45/Night "Destination / Urban Fee" Creep:</text>
  <text x="830" y="182" class="mono">Mandate 100% Resort/Destination Fee Waiver in RFP</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">Block Static RFP in Cities With &lt; 100 Room Nights/Yr</text>
  <text x="820" y="223" class="body-txt">• Chain-Wide Dynamic Discount (`12%–15% Off BAR`):</text>
  <text x="830" y="243" class="body-txt">Routes tail cities automatically to chain-wide</text>
  <text x="830" y="261" class="body-txt">dynamic discount codes instead of 5-round RFPs</text>
  <text x="820" y="284" class="body-txt">• Eliminates $45/night front-desk destination fee</text>
  <text x="830" y="302" class="body-txt">ambushes and 4-month RFP cycles for 20-night cities</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 UNWAIVED_DESTINATION_FEE_OR_TAIL_RFP_HOLD</text>

  <!-- Bottom Continuous GDS Rate-Loading & Hybrid Rate-Cap Architecture -->
  <rect x="28" y="374" width="1144" height="182" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="48" y="401" class="card-hdr" fill="#38bdf8">4. Hybrid `Cap-plus-Dynamic` Contracting + Automated GDS Rate-Loading &amp; LRA Audit Bot (HTTP 409)</text>

  <rect x="48" y="418" width="255" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="62" y="440" class="card-hdr">① Tiered City Segmentation</text>
  <text x="62" y="462" class="body-txt">Top 15 cities (&gt;500 nights)</text>
  <text x="62" y="480" class="body-txt">get Fixed LRA Caps; tail</text>
  <text x="62" y="498" class="body-txt">cities get 15% Dynamic BAR;</text>
  <text x="62" y="516" class="mono">-70% Annual RFP Admin Hours</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="337" y="440" class="card-hdr">② Hybrid Rate-Cap Clause</text>
  <text x="337" y="462" class="body-txt">Contracts `Min($220 Fixed Cap,`</text>
  <text x="337" y="480" class="body-txt">`15% Off Live BAR)` so firm</text>
  <text x="337" y="498" class="body-txt">wins in both peak &amp; off-peak;</text>
  <text x="337" y="516" class="mono">Zero Off-Peak Overpayment</text>

  <rect x="608" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="622" y="440" class="card-hdr">③ Jan-2 GDS Rate-Load Bot</text>
  <text x="622" y="462" class="body-txt">Audits `Sabre/Amadeus` pseudo-</text>
  <text x="622" y="480" class="body-txt">city codes (`PCC`) weekly to</text>
  <text x="622" y="498" class="body-txt">fix unloaded corporate rates;</text>
  <text x="622" y="516" class="mono" fill="#6ee7b7">Catches 18% Unloaded Q1 Rates</text>

  <rect x="893" y="418" width="259" height="120" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="907" y="440" class="card-hdr" fill="#6ee7b7">④ Live LRA Squatting Probe</text>
  <text x="907" y="462" class="body-txt">Runs parallel public vs. corp</text>
  <text x="907" y="480" class="body-txt">GDS queries to enforce Last</text>
  <text x="907" y="498" class="body-txt">Room Availability compliance;</text>
  <text x="907" y="516" class="mono" fill="#38bdf8">-34% Corporate Lodging Spend</text>

  <!-- KPI Footer -->
  <rect x="28" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="46" y="604" class="kpi-num" fill="#38bdf8">-34.0%</text>
  <text x="46" y="626" class="kpi-lbl">Quarterly Lodging Overpay &amp; Leak Saved</text>
  <text x="46" y="642" class="mono">$57,800 Saved / $170k Pool</text>

  <rect x="318" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="336" y="604" class="kpi-num" fill="#10b981">100% True LRA</text>
  <text x="336" y="626" class="kpi-lbl">Stops Peak-Week Inventory Squatting</text>
  <text x="336" y="642" class="mono">Public vs. Corp Parity Probe</text>

  <rect x="608" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="626" y="604" class="kpi-num" fill="#f59e0b">Min(Cap, BAR)</text>
  <text x="626" y="626" class="kpi-lbl">Hybrid Ceiling + Dynamic Discount</text>
  <text x="626" y="642" class="mono">Never Beaten by Public Promo</text>

  <rect x="898" y="572" width="274" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="916" y="604" class="kpi-num" fill="#f472b6">$0 Urban Fees</text>
  <text x="916" y="626" class="kpi-lbl">Contractual Destination-Fee Waiver</text>
  <text x="916" y="642" class="mono">Saves $40–$55/Night at Check-Out</text>
</svg>

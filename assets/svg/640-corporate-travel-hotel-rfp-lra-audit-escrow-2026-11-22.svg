      <stop offset="100%" stop-color="#081423"/>
    </linearGradient>
    <linearGradient id="hdr640" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>

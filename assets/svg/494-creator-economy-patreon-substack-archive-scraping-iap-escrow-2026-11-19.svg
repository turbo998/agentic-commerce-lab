  <text x="868" y="458" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 月付新户阶梯解锁 + 盲水印终结扒全集秒退订</text>
  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 打赏 T+14 托管与周边物流单号分账防洗钱</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 拒付/到期 1 秒级撤销 Discord Role 与 RSS</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. 合规 Web 结账免 30% 苹果税立省 24%</text>

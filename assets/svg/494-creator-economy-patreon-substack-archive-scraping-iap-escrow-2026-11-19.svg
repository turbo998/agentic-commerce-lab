  <text x="450" y="245" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">creator_economy_patronage_escrow_mandate_*</text>

  <rect x="434" y="268" width="362" height="72" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
  <text x="450" y="292" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 403 · ARCHIVE_BULK_SCRAPING_OR_TOKEN_SHARING_BLOCKED</text>

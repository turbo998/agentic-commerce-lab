  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 盗版党花 $10 订阅首月，用脚本批量下载创作者过去</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  5 年 400 篇深度研报与模型源文件，随后发起信用卡拒付</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：新订户阶梯速率阈值 + 会员 ID 频域盲水印 +</text>

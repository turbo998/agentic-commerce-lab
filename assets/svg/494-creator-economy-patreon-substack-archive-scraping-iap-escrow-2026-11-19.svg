  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：打赏 T+14 风险准备金锁 + 实物周边物流单号</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  分阶段解冻与退订秒踢 Discord 权限 (HTTP 422)</text>


  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Patreon / Substack / Whop / 知识星球 vs 盲水印防盗版 vs 阶梯解锁(Drip Unlock) vs Apple IAP 30% Web 分流</text>

  <!-- Left Panel: 3 Core Creator Economy Risks -->

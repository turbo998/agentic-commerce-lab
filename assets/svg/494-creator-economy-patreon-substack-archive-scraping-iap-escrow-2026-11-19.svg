  <text x="450" y="413" fill="#FDBA74" font-family="Consolas, monospace" font-size="11">self_tip_wash_laundering = true | merch_tier_unshipped = true</text>

  <rect x="434" y="436" width="362" height="72" rx="8" fill="#3B0764" stroke="#A855F7" stroke-width="1.5" />

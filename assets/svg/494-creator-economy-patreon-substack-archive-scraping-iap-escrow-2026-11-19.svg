  <text x="868" y="340" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强绑定 Discord 身份组 / 微信群与软件 License</text>
  <text x="868" y="360" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  分发；需严防退订不退群与黑灰产金融带单合规</text>

  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">医药学术会议、器械 GPO 集采返利与医院寄售：防阳光法案超标、防串货骗补与 UDI 扫码结算</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Veeva CRM / SAP Concur vs Premier / Vizient GPO EDI 844 vs CMS Open Payments NPI vs Azure Foundry + UDI Gate</text>

  <!-- Left Panel: 3 Core Life Sciences & MedTech Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 医药学术合规与器械集采三大黑洞</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />

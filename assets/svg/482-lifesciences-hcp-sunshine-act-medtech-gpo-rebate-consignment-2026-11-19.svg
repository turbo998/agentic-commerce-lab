  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Web IQ 实时拦截 OIG 黑名单讲者与召回耗材</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. 智能高值耗材柜用完即结防串货省 21%</text>
  <rect x="868" y="542" width="256" height="50" rx="6" fill="#022C22" />

  <text x="450" y="245" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">lifesciences_sunshine_gpo_udi_mandate_*</text>

  <rect x="434" y="268" width="362" height="72" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
  <text x="450" y="292" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 403 · HCP_MEAL_CAP_OR_MISSING_NPI_BLOCKED</text>
  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截超各州法定医生人均餐标、娱乐消费或缺失参会医生 NPI</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">per_hcp_meal &gt; state_cap | npi_roster_valid = false</text>

  <rect x="434" y="352" width="362" height="72" rx="8" fill="#431407" stroke="#F97316" stroke-width="1.5" />

  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">空调跨接导通电阻 &lt;=0.05 Ω，11ms 硬拦截钳形表内部钢筋环路假测与漏跨接。</text>


  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业建筑防雷接地与浪涌保护维保四大黑洞 (Legacy Lightning Leakage: 32%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 不打远端地钎，拿钳形表夹在连着大楼钢筋的扁铁上测出“0.4Ω”假数据收 $4,200</text>

  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">哪怕地下接地铜棒早已锈烂脱离土壤也显示 0.4Ω；且漏检屋顶新换空调未重接跨接线。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 配电柜浪涌保护器 (SPD) 单相 $140 压敏模块红灯，被虚报为 $4,500 换整套防雷箱</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">现代工业级 UL 1449 SPD (Surgelogic / Eaton) 采用热插拔相模块设计，哪相变红只需</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">3 分钟换一颗 $140 MOV 卡匣，维保商却谎称整台不锈钢防雷箱报废强收 $4,500。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 屋顶裸铜避雷索直接绑在铝合金女儿墙压顶上，18 个月发生电偶腐蚀烂断</text>

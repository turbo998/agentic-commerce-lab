  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">铜与铝遇雨水形成原电池，一年半即把铝压顶与支架蚀穿导致接闪网彻底断路。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 施工队无 LPI Master 防雷师执照且 UL 96A Master Label 铭牌超 5 年过期</text>

    <text x="823" y="223" fill="#CBD5E1">  延迟：19 ms · 放款：$170,000.00</text>

    <text x="823" y="253" font-weight="700" fill="#FCA5A5">• 跳过 290°C 均质炉热浸伪造证书拦截 (403)</text>
    <text x="823" y="272" fill="#CBD5E1">  延迟：11 ms · 杜绝摩天楼高空幕墙自爆雨</text>

    <text x="823" y="302" font-weight="700" fill="#FCA5A5">• 高铁分泛绿/透光不足或辊道波变形拦截 (422)</text>
    <text x="823" y="321" fill="#CBD5E1">  延迟：14 ms · 守住光伏组件发电功率与幕墙平整</text>

    <text x="823" y="351" font-weight="700" fill="#FDE68A">• Web IQ 超白碎玻璃 (Cullet) 闭环回炉 (409)</text>
    <text x="823" y="370" fill="#CBD5E1">  延迟：295 ms · 节省：$27,200.00 (16.0% 降本)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  142 / 142 单元测试 100% 通过 (CSP 自包含)</text>
  </g>
  <rect x="823" y="442" width="319" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="982" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">

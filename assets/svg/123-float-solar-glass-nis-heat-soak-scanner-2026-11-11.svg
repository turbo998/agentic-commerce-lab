  </text>

  <!-- Footer Banner -->
  <rect x="40" y="512" width="1120" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="541" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700" fill="#7DD3FC">
    🏛️ 架构师选型铁律 (Takeaway): 绝对不要仅凭目视表面完好就按“平方米面积”给幕墙钢化玻璃与光伏玻璃放款！
  </text>
  <text x="60" y="565" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    必须绑定：① EN 14179-1 均质炉 290°C±10°C 2h 真实热电偶曲线引爆硫化镍 (NiS) 结石且激光扫描零微气泡 (11ms 拦 403)；② 透光率 &gt;=94.0% 且波纹度 &lt;=0.05mm (14ms 拦 422)；
  </text>
  <text x="60" y="586" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    ③ Web IQ 核查中空玻璃 EN 1279 氩气浓度 (&gt;=90%) 与 SGCC 认证 (285ms 拦 451)，并将深加工裁切超白碎玻璃 (Cullet) 闭环回炉抵扣重质纯碱与燃气费立省 $27,200 (295ms)。
  </text>

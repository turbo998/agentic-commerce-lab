  </text>

  <!-- Left Card: Legacy Area Billing & Spontaneous Shattering Failure -->
  <rect x="40" y="132" width="355" height="360" rx="12" fill="url(#cardBg123)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="148" width="323" height="32" rx="6" fill="#450A0A"/>
  <text x="217" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">
    ❌ 传统按平米面积盲付与摩天楼玻璃自爆踩坑
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 省掉 290°C 均质炉热浸 (HST) 致高空“蝴蝶斑自爆”</text>
    <text x="58" y="224" fill="#CBD5E1">• 钢化厂为省电跳过 6小时均质热浸，收走 $170,000</text>
    <text x="58" y="242" fill="#CBD5E1">• 内部 0.1mm 硫化镍 (NiS) 结石相变膨胀，300米幕墙爆裂下玻璃雨</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 普通普白玻璃冒充低铁超白或 AR 镀膜透光不足</text>
    <text x="58" y="294" fill="#CBD5E1">• 氧化铁 Fe2O3 &gt; 0.015% 泛绿光，光伏透光率仅 91.2% (&lt;94.0%)</text>
    <text x="58" y="312" fill="#CBD5E1">• 光伏组件功率永久损失 2.8% 或辊道波形弯曲度 (Roller Wave) 扭曲</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 锡槽粘锡斑点致 Low-E 脱膜或防霉纸失效彩虹斑</text>
    <text x="58" y="364" fill="#CBD5E1">• 浮法锡面未标记反装或中空玻璃氩气充气率 &lt; 85%</text>
    <text x="58" y="382" fill="#CBD5E1">• 海运受潮发生碱析“发霉彩虹斑”，整批幕墙报废重做</text>
  </g>
  <rect x="58" y="442" width="319" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="217" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">

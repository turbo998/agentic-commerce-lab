  <text x="868" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：科技/金融大厂员工生育福利、跨国合规冻卵报销</text>

  <rect x="854" y="298" width="284" height="100" rx="8" fill="#1E293B" />
  <text x="868" y="320" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Shady Grove / Kindbody / 锦欣生殖 (自费共享风险)</text>
  <text x="868" y="340" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 提供 Shared-Risk 100% Refund 计划(最多包 6 个取卵</text>
  <text x="868" y="360" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  周期，未成功活产退还 80%–100% 医疗费)，SART 数据公开</text>
  <text x="868" y="380" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：自费多周期试管婴儿、高龄三代 PGT-A 筛查需求</text>

  <rect x="854" y="412" width="284" height="196" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="868" y="436" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">★ 推荐：Foundry + 周期分阶与特药托管网关</text>
  <text x="868" y="458" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 强制前置披露促排药/ICSI/PGT-A 全周期真实总价</text>
  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 促排/取卵/养囊/移植四阶段里程碑实做实结</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 核验胚胎室 CAP/CLIA 认证与液氮罐双路温控险</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. 促排针剂按需拆包配送免剩药浪费省 26%</text>
  <rect x="868" y="542" width="256" height="50" rx="6" fill="#022C22" />

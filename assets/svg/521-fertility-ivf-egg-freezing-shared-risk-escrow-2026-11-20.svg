  <!-- Header -->
  <text x="44" y="48" fill="#EC4899" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 78 · FERTILITY BENEFITS, EGG FREEZING &amp; MULTI-CYCLE IVF SHARED-RISK ESCROW</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">辅助生殖(IVF)、企业冻卵福利与胚胎筛查托管：防隐瞒促排药/PGT-A费与周期中断退费锁</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Progyny / Carrot Fertility / Kindbody / 锦欣生殖 vs 促排+取卵+养囊+PGT-A 里程碑拆账 vs 中途取消退70% vs 特药直采省 26%</text>

  <!-- Left Panel: 3 Core Fertility & IVF Billing Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 辅助生殖与冻卵套餐三大隐性账单</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. “$9,500 冻卵/试管套餐”不含 $5,000 促排药与基因筛查</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 诊所套餐故意隐瞒果纳芬促排针药($4,500)、ICSI 单精子注射</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  ($1,800)、三代 PGT-A 胚胎筛查($3,800)及麻醉费，实付翻倍</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：强制术前披露含促排药与 PGT-A 的全周期总拥有</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  成本(Full-Cycle TCO)并锁定加项上限 (HTTP 403)</text>

  <rect x="62" y="328" width="314" height="132" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="76" y="352" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2. 促排卵泡不达标中途取消，诊所仍吞走 $16,000 全款</text>
  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 周期第 1 天先收走 $16,000 全款，若第 8 天因卵巢反应不良</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  取消取卵或未养成可移植囊胚，诊所拒退未发生的实验室与移植费</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：按 Progyny Smart Cycle 四阶段里程碑(促排</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  20%/取卵35%/养囊25%/移植20%)实做实结 (HTTP 422)</text>

  <rect x="62" y="474" width="314" height="134" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 液氮罐温控失灵毁胚免责霸王条款与特药寻优</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 胚胎冷冻年费合同写“液氮挥发毁损仅赔1年保管费($800)”</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ CDC SART 活产率验真与双电路液氮险(451)</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 促排卵特药按天小批量直采(防多买浪费 $2,000 剩余冷链</text>
  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  针剂) + 企业免税福利三周期风险共担包省 26% (HTTP 409)</text>


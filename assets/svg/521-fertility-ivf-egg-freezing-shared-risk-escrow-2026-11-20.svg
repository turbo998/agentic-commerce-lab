  <text x="450" y="396" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截促排中途取消仍强扣未发生的取卵/胚胎培养/移植费或拒退风险共担款</text>
  <text x="450" y="413" fill="#FDBA74" font-family="Consolas, monospace" font-size="11">cycle_aborted_pre_retrieval &amp;&amp; lab_fee_charged = true</text>

  <rect x="434" y="436" width="362" height="72" rx="8" fill="#3B0764" stroke="#A855F7" stroke-width="1.5" />
  <text x="450" y="460" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 451 · WEBIQ_UNACCREDITED_EMBRYO_LAB_OR_CRYO_HOLD</text>
  <text x="450" y="480" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="12">Web IQ 检出胚胎实验室无 CAP/CLIA 认证或液氮冷冻罐无双路断电报警险</text>
  <text x="450" y="497" fill="#D8B4FE" font-family="Consolas, monospace" font-size="11">cap_clia_embryo_lab_verified = false | cryo_tank_insurance = false</text>

  <rect x="434" y="520" width="362" height="88" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.5" />
  <text x="450" y="544" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 409 · JUST_IN_TIME_SPECIALTY_RX_AND_SHARED_RISK</text>
  <text x="450" y="564" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="12">促排针剂按卵泡监测动态拆包配送(零剩药浪费) + 风险共担包省 26%</text>
  <text x="450" y="584" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">季度企业辅助生殖福利与自费试管池 $265,000 → 净结算额 $196,100 (省 $68,900)</text>

  <!-- Right Panel: Platform Selection Matrix -->

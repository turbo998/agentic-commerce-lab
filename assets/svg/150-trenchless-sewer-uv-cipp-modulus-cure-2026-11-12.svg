  <text x="54" y="584" class="body">• 必须将短期弯曲模量 (&gt;=12GPa)、DSC 残余放热 (&lt;=5J/g)、3D 激光褶皱 (&lt;=2% ID) 与 DIBt 50年蠕变认证绑定为托管令牌谓词。</text>

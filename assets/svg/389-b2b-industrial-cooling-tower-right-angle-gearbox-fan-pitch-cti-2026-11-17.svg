  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  油封进水汽 (伞齿完好 Fe&lt;75ppm)，或单叶偏 1.5° 振跳</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 外包商却谎称伞齿崩裂报废强收 $14,200 吊装换新!</text>


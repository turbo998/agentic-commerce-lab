  <text x="850" y="338" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 靠岸下船/退房挂账逃单死账率：0.00%</text>
  <text x="850" y="358" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 儿童手环超额误刷拒付投诉率：下降 99%</text>

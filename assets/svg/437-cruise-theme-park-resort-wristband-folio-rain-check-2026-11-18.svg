  <!-- Header -->
  <text x="52" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · ROUND 435 · CRUISE, THEME PARK &amp; RESORT WRISTBAND FOLIO INCREMENTAL AUTH &amp; RAIN-CHECK AGENT</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">邮轮度假与主题乐园 (Disney/皇家加勒比) 架构：手环增量预授权、停航停运退赔与未成年防盗刷</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">儿童手环限额与禁酒/禁赌锁 · 每 $250 阶梯增量预授权防下船逃单 · 改港自动退港务税与停运快通卡升级 · 立省 $63,250 (23.0%)</text>

  <!-- Left Column: Cruise & Theme-Park Pitfalls -->
  <rect x="48" y="132" width="352" height="390" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="162" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统邮轮挂账与乐园快通卡三大痛点</text>

  <rect x="64" y="178" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 公海手环刷爆 $5,000 免税表 -> 靠岸下船扣款失败</text>
  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 登船仅预授权 $100，航行中任由手环离线挂账数千美元</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 靠岸清晨统一扣款时发现绑的是空卡/锁死卡，客人已离船失联</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 造成巨额“下船逃单坏账 (Walk-Off Bad Debt)”!</text>

  <rect x="64" y="288" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>

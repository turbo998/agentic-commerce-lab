  <text x="78" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 因天气取消靠港却未自动退还政府港务税 (Port Taxes) 违法</text>
  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 热门过山车故障 2 小时，2,000 名快通卡游客围堵前台退钱</text>

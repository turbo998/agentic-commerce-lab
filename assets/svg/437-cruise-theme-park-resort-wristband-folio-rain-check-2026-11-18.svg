  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 同舱房儿童手环默认共享父母主卡无限额，偷买玩具/刷自助酒墙</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 自我禁入名单 (Self-Exclusion) 赌客用房卡手环挂账兑换筹码</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 引发家长集中拒付争议与酒水/博彩牌照监管重罚!</text>


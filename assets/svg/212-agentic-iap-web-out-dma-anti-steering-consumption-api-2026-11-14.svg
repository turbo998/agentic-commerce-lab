  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 退款后未即时吊销 VIP (僵尸权益) &amp; 盲签欧盟 €0.50 CTF 倒挂：</text>

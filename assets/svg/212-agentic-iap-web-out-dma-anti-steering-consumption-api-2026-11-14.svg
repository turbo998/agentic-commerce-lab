  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. Web-to-App 跨端订阅 (2.9% Stripe) + Storefront 官方外链围栏：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 投流直达 Web 落地页付费再登录 App (遵循 3.1.3b 跨平台规则 0% 苹果抽成)；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• App 内按美/欧/日 Storefront 动态开启官方 External Purchase Link 权限。</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. &lt;500ms 自动回传 FULLY_CONSUMED 遥测 + REFUND 毫秒级销权：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 向苹果提供 12 维算力消耗铁证驳回 88%+ 恶意退款；收到 REFUND 瞬间清零余额。</text>


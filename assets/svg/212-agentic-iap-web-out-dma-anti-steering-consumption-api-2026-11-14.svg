  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 全走原生 IAP 抽走 30% 营收；若在非豁免区用热更开关私自弹窗跳 H5 支付，</text>

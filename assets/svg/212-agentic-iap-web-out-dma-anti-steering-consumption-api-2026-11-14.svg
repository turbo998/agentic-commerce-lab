  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：硬交 30% 苹果税吞噬算力毛利 + 违规热更被封 + 算力被白嫖退款</text>


  <!-- Header -->
  <text x="52" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · ROUND 393 · OTA FLIGHT/HOTEL PLANNING &amp; AUTO-REBOOKING AGENT ARCHITECTURE</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">OTA 机酒差旅智能规划与自动比价改签 Agent：全包价接地、两阶段防甩单 Saga 与净节省改签</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Web IQ 穿透核验行李/Resort Fee 全包价 · 2-Phase Hold 防单边甩单 · 先锁新单再退旧单 (净省 &gt;=$25) · 批次立省 $34,650.00 (21.0%)</text>

  <!-- Left Column: OTA & Travel Agent Failures -->
  <rect x="48" y="132" width="352" height="390" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="162" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统机酒差旅 Agent 三大资损事故</text>

  <rect x="64" y="178" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 机票先扣款成功、酒店 409 满房致单边甩单</text>
  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 串行直接扣款：先花 $680 买下不可退特价机票</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 随后订酒店撞上 409 slot_unavailable 满房无处可住</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 旅客被迫承担高额退票罚金或天价临时换酒店!</text>

  <rect x="64" y="288" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="310" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 先退旧单再去抢降价新单，或漏算退改罚金倒亏</text>
  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 先退旧房再去锁新房，新房被抢光导致两头踏空</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 房价降 $80 却处于 $120 阶梯退改罚金窗，越改越贵</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 忽视 $65 登机箱费与 $50/晚 Resort Fee 隐性加价!</text>

  <rect x="64" y="398" width="320" height="106" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="420" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 超 180 天 SPT 越界与超时重试订出双份机票</text>
  <text x="78" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 远期预约超出 Stripe Bookings 180 天 SPT 有效期上限</text>
  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• GDS 响应慢触发无幂等键重试，订出双份重名票招致 ADM</text>
  <text x="78" y="480" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 传统差旅支出基线：$165,000 / 季度（高退改损耗）</text>


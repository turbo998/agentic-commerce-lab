  <text x="68" y="566" fill="#38BDF8" font-family="Consolas, monospace" font-size="13" font-weight="700">Mandate Prefix: ota_travel_rebooking_ndc_saga_mandate_*</text>
  <text x="68" y="590" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">✅ Good Fit: 企业差旅管理 (TMC / Concur / Navan)、OTA 机酒自由行打包、购后自动盯价改签退差、展会团队用房锁位</text>

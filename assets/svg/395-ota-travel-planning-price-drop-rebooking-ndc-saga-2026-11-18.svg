  <text x="450" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · 拦截单边裸扣与“先退后订”改签 (11ms)</text>
  <text x="450" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">强制 2-Phase manual 预授权双锁 + Hold-New-Before-Cancel-Old</text>


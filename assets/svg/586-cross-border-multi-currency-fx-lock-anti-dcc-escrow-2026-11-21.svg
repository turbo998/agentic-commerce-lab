<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg586" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081326" />
      <stop offset="50%" stop-color="#0f2342" />
      <stop offset="100%" stop-color="#06101e" />
    </linearGradient>
    <linearGradient id="accent586" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21.5px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .mono { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #6ee7b7; }
      .warn { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #fca5a5; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg586)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent586)" rx="3" />

  <text x="40" y="58" class="title">跨境多币种结账与智能锁汇 (Adyen / Airwallex / Stripe FX)、防 DCC 6% 加点与防日元百倍错扣托管</text>
  <text x="40" y="80" class="subtitle">Round 143 · 防 DCC 动态货币转换吞走 6.5% 汇差、防 JPY/KRW 零小数位乘 100 倍刷爆卡 &amp; 多币种轧差净省 36% (SVG 586)</text>

  <!-- Left Card: 3 FX & Multi-Currency Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大跨境汇率与扣款事故</text>
  <text x="56" y="164" class="card-title">1. 动态货币转换 (DCC) 6.5% 汇率刺客 (HTTP 403)</text>
  <text x="56" y="184" class="body">• 在日本酒店或欧洲网站刷免货转信用卡，收银台默认勾选</text>
  <text x="56" y="202" class="body">  “以您的母国货币 USD 结算 (Guaranteed FX Rate)”</text>
  <text x="56" y="220" class="warn">• 实则暗藏 4.5%~7.0% 恶霸加点，比选当地币种直刷贵 $65!</text>

  <text x="56" y="256" class="card-title">2. 日元/韩元零小数位乘 100 倍扣款灾难 (HTTP 422)</text>
  <text x="56" y="276" class="body">• 开发者习惯把美元 `$15.00` 乘以 100 传 `amount=1500` (美分)</text>
  <text x="56" y="294" class="body">• 切到日元 `¥1,500 JPY` 时代码照乘 100 传了 `amount=150000`!</text>
  <text x="56" y="312" class="warn">• 瞬间从日本顾客卡里刷走 15 万日元 (100 倍超扣)! 全网通报批评!</text>

  <text x="56" y="348" class="card-title">3. 来回换汇双重磨损 (Double FX) 与退款汇损</text>
  <text x="56" y="368" class="body">• 刷欧元收款强转美元入账 (扣 2% 汇损)，付欧洲供应商欧元</text>
  <text x="56" y="386" class="body">  货款时又拿美元买回欧元 (再扣 2% 汇损)，白交 4% 过路费</text>
  <text x="56" y="404" class="warn">• 顾客 20 天后退货，期间汇率波动 + 双边换汇让商家倒贴 6%</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: PREDATORY_DCC_MARKUP_OVER_150BPS_BLOCK</text>
  <text x="70" y="502" class="warn">• HTTP 422: ISO4217_ZERO_DECIMAL_100X_MULTIPLIER_BUG</text>
  <text x="70" y="524" class="warn">• HTTP 451: EXPIRED_FX_QUOTE_OR_UNHEDGED_REFUND_HOLD</text>
  <text x="70" y="546" class="mono">• HTTP 409: LIKE_FOR_LIKE_MULTI_CURRENCY_NETTING_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: LOCAL_CURRENCY_AND_LOCKED_FX_AUTHORIZED</text>
  <text x="70" y="596" class="body">铁律: 永远选商户当地原币种结算 + ISO 4217 小数位查表锁!</text>

  <!-- Center Card: 4-Stage FX & Multi-Currency Architecture -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶多币种计价、防百倍错扣与锁汇架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="175" class="card-title" fill="#38bdf8">Gate 1: 反 DCC 剥削门禁 (Force Local Presentment)</text>
  <text x="450" y="195" class="body">• 买方 Agent 结账时强制选择商户所在国当地法定货币 (如 EUR/JPY)</text>
  <text x="450" y="213" class="body">• 交由 Visa/Mastercard 卡组织按基准中价转换，立省 5% DCC 黑费</text>
  <text x="450" y="231" class="mono">• 汇率加点 &gt; 150 bps (1.5%) 的 DCC 诱导弹窗 -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#10b981" />
  <text x="450" y="282" class="card-title" fill="#6ee7b7">Gate 2: ISO 4217 小数指数强类型校验 (Exponent Guard)</text>
  <text x="450" y="302" class="body">• 严禁业务代码手写 `* 100`! 强制通过 `ISO_4217_Exponent_Map`</text>
  <text x="450" y="320" class="body">• 0 位小数币种 (`JPY, KRW, VND, CLP`): 整数原值直传 (`1500`)</text>
  <text x="450" y="338" class="body">• 3 位小数中东币种 (`KWD, BHD, OMR`): 严格乘 `1000`</text>
  <text x="450" y="354" class="mono">• 零小数位币种误乘 100 或金额超历史均值 10x -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: 有界锁汇令牌 (FX Quote TTL) 与原汇率退款锁</text>
  <text x="450" y="419" class="body">• 跨币种展示价格绑定 `fx_quote_id` (有效期 15 分钟~24 小时)</text>
  <text x="450" y="437" class="body">• 30 天内发生售后退货时，复用原收单锁汇凭证按原汇率退回</text>
  <text x="450" y="455" class="mono">• 锁汇令牌过期裸跑或未对冲跨期退款汇率敞口 -&gt; HTTP 451</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#f59e0b" />
  <text x="450" y="508" class="card-title" fill="#fcd34d">Gate 4: 原币种留存入账与自然对冲轧差 (Like-for-Like)</text>
  <text x="450" y="528" class="body">• 彻底终结“收欧元转美元、付物流再买欧元”的 4% 双向剥削!</text>
  <text x="450" y="546" class="body">• 通过 Airwallex / Adyen 开通 EUR/GBP/JPY/AUD 多币种同名虚拟户</text>
  <text x="450" y="566" class="mono">• 欧元销售收入直接存进欧元池，原币种直付欧洲海外仓与广告费!</text>
  <text x="450" y="586" class="mono">• 原币种收付自然轧差 + 银行间批发点差 -&gt; 净省 36% 汇损成本</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大跨境多币种与司库底座</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Airwallex (空中云汇) / Wise Platform</text>
  <text x="846" y="182" class="body">• 优势: 60+ 币种银行间真实汇率 (仅加 0.2%~0.4%)，支持锁汇 API</text>
  <text x="846" y="198" class="body">• 特性: 多币种原币留存钱包直接发卡或付全球供应商，0 强制换汇</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. Adyen Multi-Currency (`Like-for-Like`)</text>
  <text x="846" y="244" class="body">• 优势: 支持全球 30+ 币种原币种收单且原币种直接结算入账</text>
  <text x="846" y="260" class="body">• 特性: 退货时直接从商户对应外币余额池扣减，彻底消除退款汇损</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. Stripe Multi-Currency &amp; Adaptive Pricing</text>
  <text x="846" y="306" class="body">• 优势: 零代码按买家 IP 展示本地货币，提升跨境结账转化 +17%</text>
  <text x="846" y="322" class="body">• 注意: 若未绑定当地外币银行账户，默认会收 1%~2% 强制换汇费</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. ISO 4217 `dinero.js / py-moneyed` 强类型库</text>
  <text x="846" y="368" class="body">• 优势: 从类型系统层面根绝浮点数精度丢失与 JPY/KRW 乘 100 错误</text>
  <text x="846" y="384" class="body">• 特性: 内置全球全部法定货币最小计价单位 (Minor Unit) 映射</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度跨境换汇磨损、DCC 与错扣池 ($118,000)</text>
  <text x="860" y="456" class="body">• 传统双向换汇磨损+DCC加点+退款汇损: $118,000/季</text>
  <text x="860" y="476" class="mono">• 原币种留存轧差 (Like-for-Like) 免双向换汇: -$21,240</text>
  <text x="860" y="496" class="mono">• 拦截 DCC 6% 加点与切换批发锁汇 (0.25%): -$14,160</text>
  <text x="860" y="516" class="mono">• 消除跨期退款汇差敞口与 JPY 百倍错扣事故: -$7,080</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净汇损: $75,520 (净省 $42,480 / -36%)</text>
  <text x="860" y="574" class="body">Provenance: official_list_price + synthetic</text>
  <text x="860" y="594" class="body">Mandate: cross_border_fx_escrow_optim_409</text>
</svg>

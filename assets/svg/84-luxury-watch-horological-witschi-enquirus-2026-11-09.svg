  <text x="660" y="410" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">12ms 硬阻断有卡度快慢针超级克隆机芯与拼装代用件；15ms 拦截摆幅衰减需大修或</text>
  <text x="660" y="434" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">气密失效老表；Web IQ 匹配免税自贸区交割与直通保养减免立省 $6,800.00（净付 $78,200.00）</text>
  <text x="660" y="456" fill="#4ade80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 超级克隆/拼装拦截：100% | • 赃表没收风险：0% | • 验真耗时：&lt; 25ms</text>


  <text x="60" y="72" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">ROUND 82 · SECONDARY LUXURY WATCH WITSCHI ACOUSTIC, FREE-SPRUNG &amp; ENQUIRUS MANDATE</text>

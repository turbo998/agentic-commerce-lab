  <text x="105" y="410" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">买家电汇 $85,000 购买热门贵金属计时码表，收货开盖发现原装砝码微调摆轮被换成</text>
  <text x="105" y="434" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">快慢针假机芯且序列号在伦敦登记被盗 → 款项已被转走，腕表被警方依法扣押</text>

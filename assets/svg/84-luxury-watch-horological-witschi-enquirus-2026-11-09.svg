  <text x="640" y="320" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 品牌官方认证二手表 (CPO) 联保与免税仓套利：Web IQ 匹配品牌 CPO 通道省 $6,800</text>

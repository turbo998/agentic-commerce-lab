  <text x="85" y="230" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 真壳套超级克隆机芯 (Frankenwatch)：用真金表壳/表盘装入丹东/一体克隆机芯骗取高价</text>
  <text x="85" y="260" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 套牌克隆保卡 (NFC/Serial Clone)：将正品序列号激光刻在假表内圈并复制 NFC 空白保卡</text>
  <text x="85" y="290" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 欧美入室抢劫赃表送修即扣：未查 Enquirus / The Watch Register，送官方售后保养被当场没收</text>
  <text x="85" y="320" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 后镶钻与副厂代用盘 (Aftermarket Dial)：隐瞒非原厂后改冰蓝盘/后加钻，二级残值暴跌 50%</text>

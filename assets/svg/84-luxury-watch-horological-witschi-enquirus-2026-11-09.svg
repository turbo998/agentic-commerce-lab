  <text x="60" y="136" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Witschi ChronoMaster Beat/Amplitude + Free-Sprung Micro-Optics + Enquirus/Watch Register vs. Frankenwatch Wire</text>


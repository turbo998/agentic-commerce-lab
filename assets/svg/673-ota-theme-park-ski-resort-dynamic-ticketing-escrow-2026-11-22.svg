  <rect width="1200" height="675" fill="url(#bg673)"/>
  <rect x="28" y="22" width="1144" height="68" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="48" y="51" class="title">Round 230 · Theme Park, Ski Resort &amp; Express-Lane Ticketing Escrow</text>
  <text x="48" y="74" class="sub">Disney Lightning Lane / Vail Epic / accesso / Klook · Express Ratio Cap (`&lt;=20%`) · Weather/Lift-Down Credit · `RFID` Biometric Lock (-36%)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1081" y="59" text-anchor="middle" class="mono" fill="#a7f3d0">SVG #673 · FAQ #349</text>

  <!-- Lane 1: Pass-Sharing ("Handing Ski Pass / Multi-Day Ticket to a Friend in the Parking Lot") & Bot Scalping -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Turnstile Biometric/RFID Lock (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Parking-Lot Pass Swapping &amp; Rental Resale:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Bind `First_Gate_Entry` to `Facial_Template_Hash`</text>
  <text x="54" y="200" class="mono">or `UHF_RFID_Jacket_Height_Profile`!</text>
  <text x="44" y="223" class="body-txt">• Stops `7:00 AM` Lightning-Lane Bot Sniping:</text>
  <text x="54" y="243" class="mono">Require `In-Park_Gate_Scan` Before Intra-Day Drop</text>
  <text x="44" y="266" class="body-txt">• Eliminates brokers renting out 4-day hopper</text>
  <text x="54" y="286" class="body-txt">passes or season ski passes to 4 different</text>
  <text x="54" y="304" class="body-txt">tourists across the week</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 PASS_SHARING_HANDOFF_OR_BOT_QUEUE_SNIPE_BLOCKED</text>

  <!-- Lane 2: Overselling Express Lanes ("FastPass Line Is 75 Mins!") & Ride Breakdown No-Recovery -->
  <rect x="416" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. Express-Lane `20%` Capacity Cap (HTTP 422)</text>
  <text x="432" y="162" class="body-txt">• Stops Overselling Paid Express / Lightning Lanes:</text>
  <text x="442" y="182" class="mono" fill="#fcd34d">Hard-Cap `Express_Allotment &lt;= 20%` of `OHRC`</text>
  <text x="442" y="200" class="mono">(Operational Hourly Ride Capacity)!</text>
  <text x="432" y="223" class="body-txt">• Instant Ride-Breakdown "Anytime Recovery Pass":</text>
  <text x="442" y="243" class="mono">Auto-Convert `14:00 Slot` to `Any-Ride_Pass` or</text>
  <text x="442" y="261" class="mono">Auto-Refund `$28` Single-Ride `ILL` if Down &gt;45m</text>
  <text x="432" y="284" class="body-txt">• Prevents guest fury when a `$39` Express pass</text>
  <text x="442" y="302" class="body-txt">waits 65 minutes or the coaster breaks down</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 EXPRESS_LANE_OVERALLOCATION_OR_UNREFUNDED_DOWN_RIDE</text>

  <!-- Lane 3: Child Height-Restriction Rejection at Turnstile & Weather/Lift Closure Escrow -->
  <rect x="804" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. Child Height &amp; Weather Shield (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Pre-Checkout Child Height &amp; `Rider Switch` Gate:</text>
  <text x="830" y="182" class="mono">Block Selling `$25 Thrill-Coaster ILL` for Child</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">`Profile_Height &lt; 122cm (48")` + Issue RiderSwap!</text>
  <text x="820" y="223" class="body-txt">• Severe Weather / `>=50%` Ski-Lift Wind-Hold Shield:</text>
  <text x="830" y="243" class="body-txt">If typhoon/lightning/blizzard closes `&gt;=50%` of</text>
  <text x="830" y="261" class="body-txt">major attractions/lifts for `&gt;120m`, auto-issue</text>
  <text x="830" y="279" class="body-txt">1-Year Rain-Check Voucher or Pro-Rata Refund!</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 CHILD_HEIGHT_RESTRICTION_OR_WEATHER_CLOSURE_HOLD</text>

  <!-- Bottom Dynamic Crowd-Balancing & Multi-Attraction City Pass Pro-Rata Settlement -->
  <rect x="28" y="374" width="1144" height="182" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>

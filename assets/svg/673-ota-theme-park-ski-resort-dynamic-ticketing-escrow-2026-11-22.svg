  <text x="62" y="462" class="body-txt">Pushes `$5` F&amp;B credit or</text>
  <text x="62" y="480" class="body-txt">bonus show slot to steer</text>
  <text x="62" y="498" class="body-txt">crowds away from 90-min</text>
  <text x="62" y="516" class="mono">bottleneck lands (-28% Wait)</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="337" y="440" class="card-hdr">② `CityPass` Redemption Split</text>
  <text x="337" y="462" class="body-txt">Settles multi-venue pass</text>
  <text x="337" y="480" class="body-txt">revenue strictly on verified</text>
  <text x="337" y="498" class="body-txt">turnstile scans (`Pay-on-Scan`)</text>
  <text x="337" y="516" class="mono">with pro-rata breakage share</text>

  <rect x="608" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="622" y="440" class="card-hdr">③ Direct-to-Lift Apple Wallet</text>
  <text x="622" y="462" class="body-txt">Issues `NFC Express Mode`</text>
  <text x="622" y="480" class="body-txt">or `BLE` mobile ski pass</text>
  <text x="622" y="498" class="body-txt">skipping ticket-window</text>
  <text x="622" y="516" class="mono" fill="#6ee7b7">lines completely (0 Queue)</text>

  <rect x="893" y="418" width="259" height="120" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="907" y="440" class="card-hdr" fill="#6ee7b7">④ Parametric Weather Cover</text>
  <text x="907" y="462" class="body-txt">Embeds `$6` parametric</text>
  <text x="907" y="480" class="body-txt">rain/wind-hold cover that</text>
  <text x="907" y="498" class="body-txt">auto-pays if `&gt;15mm` rain;</text>
  <text x="907" y="516" class="mono" fill="#38bdf8">-36% Refund &amp; Scalping Loss</text>

  <!-- KPI Footer -->
  <rect x="28" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>

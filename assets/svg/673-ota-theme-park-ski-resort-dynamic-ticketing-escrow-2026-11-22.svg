  <text x="46" y="626" class="kpi-lbl">Quarterly Ticketing &amp; Dispute Saved</text>
  <text x="46" y="642" class="mono">$79,200 Saved / $220k Pool</text>

  <rect x="318" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="336" y="604" class="kpi-num" fill="#10b981">&lt;=20% OHRC</text>
  <text x="336" y="626" class="kpi-lbl">Express-Lane Ratio Guaranteed</text>
  <text x="336" y="642" class="mono">Wait Time &lt;= 15 Mins SLA</text>

  <rect x="608" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="626" y="604" class="kpi-num" fill="#f59e0b">100% Auto-Sub</text>
  <text x="626" y="626" class="kpi-lbl">Ride-Down Recovery Pass / Refund</text>
  <text x="626" y="642" class="mono">Zero Guest Service Desk Lines</text>

  <rect x="898" y="572" width="274" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="916" y="604" class="kpi-num" fill="#f472b6">0 Pass-Swap</text>
  <text x="916" y="626" class="kpi-lbl">Biometric / UHF-RFID Gate Binding</text>
  <text x="916" y="642" class="mono">Child Height Pre-Check &amp; Swap</text>

  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_heavy_crane_rigging_lmi_telemetry_3d_lift_plan_superload_permit_mandate_2026 · 15.0% Savings ($43,500 / Batch)</text>


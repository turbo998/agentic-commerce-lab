  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 3D Lift Plan 最小合规吨位锁 + LMI 实挂配重核销拖车 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">承包商派大车强制按 3D 方案核定吨位计费 (Free Upgrade)；直接解析车载 LICCON/</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">CCS 黑匣子记录的实挂配重吨位 (每 42,000 lbs 核销 1 车)，11ms 砍除幽灵配重车。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 大风停机 (&gt;20 mph) 自动切 Standby 费率 + DOT 官费原票锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">比对风速仪与 LMI 吊钩零载荷时长，大风停工日强制执行 50% 待命折扣；州交通局</text>

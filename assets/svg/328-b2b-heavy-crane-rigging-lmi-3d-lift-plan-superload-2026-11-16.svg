  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统重型起重吊装与超限运输四大黑洞 (Legacy Crane Leakage: 28%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 110 吨吊装活故意派 350 吨巨型吊车 + 虚报 7 辆配重块半挂平板车</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">屋顶冷机只需 110 吨吊车 (1 车配重)，承包商故意派 350 吨巨车翻倍收日租；或现场</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">只挂 22 吨基础配重，账单却按满配重 220,000 磅虚报 7 辆重卡往返运费 $28,000。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 高空阵风 &gt;25 mph 停工一整天却按 100% 满负荷运行台班收费</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">因大风超标全天严禁起吊，吊车熄火零油耗、零钢丝绳磨损，承包商却拒绝执行</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">50%–65% 天气待命费率 (Weather Standby Rate)，照收 $12,000/天满额运行费。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. $180 州交通局超限通行证 (DOT Permit) 加价 1,200% 卖 $2,400</text>

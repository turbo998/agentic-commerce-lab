  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">协调与桥梁验算包干费”，单张通行证与引导车 (Pilot Car) 狂赚 10 倍差价。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. &gt;=75% 关键吊装缺失 PE 注册工程师签章或 NCCCO 操作员无证倾覆</text>

  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动锁定 3D 方案原吨位价并砍除幽灵配重车与许可证加价 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将 350 吨替用吊车重算回 110 吨合同价、砍掉 5 辆幽灵配重拖车并还原 DOT 官费：</text>

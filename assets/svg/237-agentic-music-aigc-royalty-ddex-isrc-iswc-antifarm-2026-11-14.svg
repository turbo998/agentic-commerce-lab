  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：听歌熵反刷流 + ISRC/ISWC 双轨清分 + 冲突差额托管网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 切歌时间分布香农熵 + 二分图孤岛检测 + 声纹去重：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 精准剔除集中在 30.5s–31.9s 机械切歌的僵尸农场与未满 1,000 播的垃圾音轨；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 强制 Audible Magic/Chromaprint 声纹比对，100% 阻断未授权采样上架！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. DDEX ISRC (母带) 与 ISWC (词曲 MLC) 双轨解耦 + ≤100% 守恒：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动剥离 § 115 词曲机械版税直付 The MLC；将 &gt;100% 权属重叠区锁入冲突托管户。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms CRB/USCO 核验与净化增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 净化版税池剔除黑产假量并免除 MLC 逾期滞纳金，单批立省 $37,600.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>

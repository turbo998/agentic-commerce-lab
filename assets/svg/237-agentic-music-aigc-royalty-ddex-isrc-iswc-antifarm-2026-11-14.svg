  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 235 · MUSIC &amp; AIGC ROYALTY</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体音乐流媒体与 AIGC 版权分账防 31s 刷流农场、ISRC/ISWC 双轨与托管架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">听歌时长香农熵防刷流 + 录音 ISRC 与词曲 ISWC 解耦令牌 (`agentic_music_aigc_royalty_ddex_isrc_iswc_antifarm_mandate_...`)</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red237)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：机房 31 秒刷流掏空版税池 + 漏付词曲机械版税遭 $15万/首重罚</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 黑产上传 10万首 AI 白噪音并雇僵尸号播到第 31 秒机械切歌：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 利用“满 30 秒即算 1 次有效点播”漏洞，机房 24h 循环盗刷洗空大盘按比例分账池；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 未经声纹指纹核验，将盗版采样与洗歌音轨直接上架分钱引发版权方连带起诉！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 将 100% 版税全打给 ISRC 音频上传者而漏付 ISWC 词曲作者：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反美国《音乐现代化法案 (17 U.S.C. § 115 MLC)》；或份额冲突达 125% 时违规超额付款。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 将 100% 纯随机提示词生成的噪音虚报为人类原创独享版权：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反美国版权局 (USCO) 人类独创性登记红线或低于 CRB 37 CFR Part 385 法定费率。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

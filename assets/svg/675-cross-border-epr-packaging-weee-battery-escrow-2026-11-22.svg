  <text x="442" y="182" class="mono">Carve Out `Marketplace_Pay_on_Behalf_Units` From</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">Direct `PRO (Lizenzero / Citeo)` Annual Filing!</text>
  <text x="432" y="223" class="body-txt">• Reconciles `LUCID` vs `Dual System` Tonnage Parity:</text>
  <text x="442" y="243" class="mono">Enforce `ZSVR_LUCID_Kg == Lizenzero_Contract_Kg`</text>
  <text x="432" y="266" class="body-txt">• Prevents German `ZSVR` regulator audits triggered</text>
  <text x="442" y="286" class="body-txt">by a 1-kilogram discrepancy between the public</text>
  <text x="442" y="304" class="body-txt">LUCID registry and the Dual System invoice</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 DOUBLE_EPR_PAYMENT_OR_LUCID_PRO_WEIGHT_MISMATCH</text>


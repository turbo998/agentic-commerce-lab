  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. `LUCID / WEEE / UIN` Gate (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Blocks Unregistered Shipments to `DE / FR / ES`:</text>
  <text x="830" y="182" class="mono">Require Active `DE-LUCID`, `Stiftung-EAR WEEE-Nr`,</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">`BattG` &amp; `FR-UIN` + Authorized Rep (`AR`)!</text>
  <text x="820" y="223" class="body-txt">• French `Triman` &amp; Italian `CONAI` Label Check:</text>
  <text x="830" y="243" class="body-txt">Verifies mandatory sorting symbols (`FR Triman`,</text>
  <text x="830" y="261" class="body-txt">`IT PAP20/LDPE04`) are printed on packaging</text>
  <text x="820" y="284" class="body-txt">• Eliminates marketplace ASIN takedowns and</text>
  <text x="830" y="302" class="body-txt">German competitor cease-and-desist (`Abmahnung`)</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 MISSING_LUCID_WEEE_UIN_OR_AUTHORIZED_REP_HOLD</text>


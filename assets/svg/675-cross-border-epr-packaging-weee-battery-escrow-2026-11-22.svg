  <text x="62" y="480" class="body-txt">`-20% to -30%` eco-bonus</text>
  <text x="62" y="498" class="body-txt">for `FSC` mono-cardboard</text>
  <text x="62" y="516" class="mono">&amp; avoids PVC/carbon-black</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>

  <!-- Lane 1: Paying Eco-Fees on Gross Product Weight Instead of Packaging Tare & Cancelled/RTO Orders -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Tare-Grammage &amp; Return Netting (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Taxing Product Weight as Packaging Weight:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Enforce `Paper_85g + LDPE_12g` Tare BOM Split</text>
  <text x="54" y="200" class="mono">(Never Pay Packaging Fee on 1.2kg Product Mass!)</text>
  <text x="44" y="223" class="body-txt">• Deducts Cross-Border `RTO` &amp; Cancelled Shipments:</text>
  <text x="54" y="243" class="mono">Exclude `Unshipped / Returned_to_Origin_Outside_EU`</text>
  <text x="44" y="266" class="body-txt">• Prevents marketplace default fallback estimators</text>
  <text x="54" y="286" class="body-txt">from charging plastic `€0.65/kg` eco-fees on</text>
  <text x="54" y="304" class="body-txt">total parcel weight or undelivered returns</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 GROSS_WEIGHT_OVERDECLARATION_OR_RTO_DOUBLE_FEE</text>


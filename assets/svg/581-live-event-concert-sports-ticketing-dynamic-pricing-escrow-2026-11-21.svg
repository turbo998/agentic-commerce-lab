<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg581" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081326" />
      <stop offset="50%" stop-color="#111e3d" />
      <stop offset="100%" stop-color="#060f1d" />
    </linearGradient>
    <linearGradient id="accent581" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21.5px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .mono { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #6ee7b7; }
      .warn { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #fca5a5; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg581)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent581)" rx="3" />

  <text x="40" y="58" class="title">演唱会与体育票务 (Ticketmaster / StubHub / SeatGeek / 大麦)、防动态高价刺客与防假票/鸽单托管</text>
  <text x="40" y="80" class="subtitle">Round 138 · 防 Platinum 动态溢价把 $180 票炒到 $1,650 误刷、防二手卖家涨价毁约不发码 &amp; 开场前折价寻优净省 32% (SVG 581)</text>

  <!-- Left Card: 3 Ticketing Traps -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大抢票与二手票务黑洞</text>
  <text x="56" y="164" class="card-title">1. 官方 Platinum 动态溢价与结账 38% 手续费</text>
  <text x="56" y="184" class="body">• 票面原价 $180，开票瞬间算法触发“Official Platinum”动态调价</text>
  <text x="56" y="202" class="body">• 同排座位瞬间飙至 $1,650 (不含任何 VIP 权益!) + 结账加收</text>
  <text x="56" y="220" class="warn">  38% 服务费/场馆费，Agent 若不锁死原价类型会直接刷爆信用卡</text>

  <text x="56" y="256" class="card-title">2. 静态 PDF 假票一票多卖与卖家临时鸽单 (HTTP 422)</text>
  <text x="56" y="276" class="body">• 骗子把同一张静态 PDF 条形码卖给 8 个人，后 7 人在闸机被拦</text>
  <text x="56" y="294" class="body">• 二手无货空头票 (Speculative Listing): 卖家没票先挂单，</text>
  <text x="56" y="312" class="warn">  开场前 2 小时票价大涨，卖家宁肯退钱也不给票害买家白跑机酒!</text>

  <text x="56" y="348" class="card-title">3. 音响柱重度遮挡视线 (Obstructed View) 与强实名不可转</text>
  <text x="56" y="368" class="body">• 低价抢到内场前排，入场才发现正对巨大控台塔架完全看不见舞台</text>
  <text x="56" y="386" class="body">• 国内强实名场次 (“人-证-脸”三合一) 误买黄牛代拍转赠票，</text>
  <text x="56" y="404" class="warn">  结果现场刷身份证闸机直接红灯报警无法入场 (HTTP 451)</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: PLATINUM_SURGE_TRAP_OR_HIDDEN_JUNK_FEE</text>
  <text x="70" y="502" class="warn">• HTTP 422: STATIC_PDF_BARCODE_OR_OBSTRUCTED_VIEW</text>
  <text x="70" y="524" class="warn">• HTTP 451: SPECULATIVE_SHORT_SELL_OR_ID_MISMATCH_HOLD</text>
  <text x="70" y="546" class="mono">• HTTP 409: INSTANT_SAFETIX_TRANSFER_AND_DEAL_SCORE_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: FACE_VALUE_ALL_IN_TICKET_AUTHORIZED</text>
  <text x="70" y="596" class="body">铁律: 只认 SafeTix 15s 滚动加密令牌 + 卖家 200% 违约罚金锁!</text>

  <!-- Center Card: 4-Stage Ticketing Escrow Architecture -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶票务防溢价刺客与防鸽单托管架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#ec4899" />
  <text x="450" y="175" class="card-title" fill="#f472b6">Gate 1: 原价票类型硬锁与 FTC 全包价 (All-In Price)</text>
  <text x="450" y="195" class="body">• 严格过滤 `inventoryType == "Standard / Face-Value"`，拉黑无</text>
  <text x="450" y="213" class="body">  实质权益却贵 5 倍的 `Official Platinum` 动态浮动票</text>
  <text x="450" y="231" class="mono">• 结账隐藏附加费 &gt;20% 或超用户设定全包上限 -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="282" class="card-title" fill="#38bdf8">Gate 2: SafeTix 滚动令牌直连过户与 3D 视线排雷</text>
  <text x="450" y="302" class="body">• 拒收一切静态 PDF / 截图二维码! 强制走 Ticketmaster SafeTix</text>
  <text x="450" y="320" class="body">  / AXS 官方账户级票据所有权转移 (旧条码立即作废，新码每15s刷新)</text>
  <text x="450" y="338" class="body">• 结合 AViewFromMySeat 3D 场馆视角剔除音响塔遮挡座与侧后盲区</text>
  <text x="450" y="354" class="mono">• 静态截图票或未披露 `Obstructed / Limited View` -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: 预托管秒发码 (Instant Download) 与强实名核验</text>
  <text x="450" y="419" class="body">• 仅购买卖家已将原始加密票据预托管在平台金库的 `Instant Transfer` 票</text>
  <text x="450" y="437" class="body">• 卖家违约不发码罚没信用卡 200% 票款直接替买家升级更优前排座</text>
  <text x="450" y="455" class="mono">• 无票空卖期房票或国内强实名场次非官方实名直录 -&gt; HTTP 451</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#10b981" />
  <text x="450" y="508" class="card-title" fill="#6ee7b7">Gate 4: 跨平台含费比价与 T-48h 恐慌抛售抄底 (HTTP 409)</text>
  <text x="450" y="528" class="body">• 同一座位卖家同时挂在 StubHub (收28%费)、SeatGeek、TickPick (0买家费)</text>
  <text x="450" y="546" class="body">• Agent 按 `(Section, Row, Seat)` 跨网去重，直选全包最低通道</text>
  <text x="450" y="566" class="mono">• 监控开场前 48 小时黄牛清库存跳水曲线或官方退票回流仓</text>
  <text x="450" y="586" class="mono">• 跨网去重免买家费 + 拦截 Platinum 溢价 -&gt; 净省 32% 购票支出</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大全球演出与体育票务栈</text>

  <text x="846" y="164" class="card-title" fill="#ec4899">1. Ticketmaster / AXS (一级市场 + SafeTix)</text>
  <text x="846" y="182" class="body">• 优势: 场馆官方原价首发与 Face Value Exchange 原价转售</text>
  <text x="846" y="198" class="body">• 注意: 必须加参数过滤掉 Official Platinum 算法高价票</text>

  <text x="846" y="226" class="card-title" fill="#38bdf8">2. SeatGeek / TickPick (透明比价与 Deal Score)</text>
  <text x="846" y="244" class="body">• 优势: TickPick 零买家手续费；SeatGeek 视角评分最准</text>
  <text x="846" y="260" class="body">• 特性: 适合跨平台找出同一黄牛挂出的最低含税总价</text>

  <text x="846" y="288" class="card-title" fill="#6ee7b7">3. StubHub (FanProtect 200% 换票担保)</text>
  <text x="846" y="306" class="body">• 优势: 全球二级流动性最大，优先选 `Instant Download` 预存票</text>
  <text x="846" y="322" class="body">• 特性: 卖家若鸽单，平台强刷卖家信用卡替买家换同级/升级票</text>

  <text x="846" y="350" class="card-title" fill="#fcd34d">4. 大麦 / 猫眼 / 携程票务 (强实名退票回流)</text>
  <text x="846" y="368" class="body">• 规则: 身份证+人脸强实名不可转赠，二级黄牛代拍 100% 废票</text>
  <text x="846" y="384" class="body">• 策略: 盯紧开场前 T-7d / T-48h 官方阶梯退票二次回流放票窗!</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度企业客户招待与个人票务池 ($72,000)</text>
  <text x="860" y="456" class="body">• 传统误买 Platinum 高价票+28%手续费+鸽单: $72,000/季</text>
  <text x="860" y="476" class="mono">• 拦截 Official Platinum 3倍溢价锁原价票: -$11,520</text>
  <text x="860" y="496" class="mono">• 跨平台同座去重改走 TickPick/直转免手续费: -$6,480</text>
  <text x="860" y="516" class="mono">• T-48h 二级清仓与官方退票回流仓狙击: -$5,040</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净支出: $48,960 (净省 $23,040 / -32%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: live_event_ticketing_optim_409</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111E" />
      <stop offset="50%" stop-color="#151D38" />
      <stop offset="100%" stop-color="#081322" />
    </linearGradient>
    <linearGradient id="accent512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg512)" />
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent512)" />

  <!-- Header -->
  <text x="44" y="48" fill="#EC4899" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 69 · BRAND IP LICENSING, ANIME MERCH (&quot;GUZI&quot;) MINIMUM GUARANTEE &amp; ROYALTY ESCROW</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">IP 联名授权、谷子经济(二次元周边)与保底分成：防夜班偷印瞒报、清仓地板价与 MG 抵扣</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Sanrio / Disney / 万代南梦宫 / 泡泡玛特 / 名创优品 / 阿里鱼 vs 一物一码全息证纸配额 vs 清仓期禁倾销 vs 阶梯保底省 25%</text>

  <!-- Left Panel: 3 Core IP Licensing & Anime Merch Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 IP 联名与谷子周边三大分成黑洞</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. 报备印 5 万个徽章(吧唧)，代工厂夜班偷印 15 万个</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 被授权商向版权方申报只生产了 5 万件免付超额溢价提成</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  (Overage Royalty)，背地里把夜班多印的 10 万件所谓“尾单</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  散货”低价倒卖闲鱼/拼多多，逃避 12% 版税分成</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 护栏：版权方直发加密全息防伪证纸配额锁 (HTTP 403)</text>

  <rect x="62" y="328" width="314" height="132" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="76" y="352" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2. 授权到期 90 天清仓期 1 折狂甩，砸穿 IP 价格体系</text>
  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 合同快到期前故意突击超量赶制 20 万件库存，然后在 90 天</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  清仓期(Sell-Off Period)按 1 折批发给折扣店，或保底金重复扣</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：清仓期禁入奥莱折扣渠道 + 最低限价(MAP)</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  + MG 保底金自动冲抵流水提成水位线 (HTTP 422)</text>

  <rect x="62" y="474" width="314" height="134" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 未经原画监修(Style Guide)魔改崩坏与联名寻优</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 未通过日本/欧美版权方图库监修擅自改色投产遭全批次销毁</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ 版权链与跨境越区窜货(Geo-Fencing)锁(451)</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 采用“低保底(Low MG) + 按防伪标激活阶梯分成”替代</text>
  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  高风险一口价盲赌买断立省 25% 资金占压 (HTTP 409)</text>

  <!-- Center Panel: 5-Lane Deterministic Gate -->
  <rect x="414" y="132" width="402" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="434" y="164" fill="#EC4899" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ IP 授权与谷子周边五车道受托状态机</text>

  <rect x="434" y="184" width="362" height="72" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="450" y="208" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 200 · HOLOGRAM_QUOTA_AND_MG_RECOUP_AUTHORIZED</text>
  <text x="450" y="228" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">原画监修已过 + 一物一码防伪标配额绑定 + MG 自动冲抵 (8ms)</text>
  <text x="450" y="245" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">ip_licensing_anime_merch_escrow_mandate_*</text>

  <rect x="434" y="268" width="362" height="72" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
  <text x="450" y="292" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 403 · GHOST_SHIFT_OVERRUN_OR_UNLABELED_MERCH</text>
  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截超出全息防伪证纸配额的夜班偷印黑货或未贴 NFC/QR 税标出库</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">minted_units &gt; hologram_sticker_quota | royalty_evasion = true</text>

  <rect x="434" y="352" width="362" height="72" rx="8" fill="#431407" stroke="#F97316" stroke-width="1.5" />
  <text x="450" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 422 · SELL_OFF_DUMPING_OR_MG_DOUBLE_CHARGE</text>
  <text x="450" y="396" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截清仓期击穿最低限价倾销、到期前突击囤货或未冲抵MG直接收提成</text>
  <text x="450" y="413" fill="#FDBA74" font-family="Consolas, monospace" font-size="11">sell_off_discount &gt; 0.30 | mg_recouped_before_overage = false</text>

  <rect x="434" y="436" width="362" height="72" rx="8" fill="#3B0764" stroke="#A855F7" stroke-width="1.5" />
  <text x="450" y="460" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 451 · WEBIQ_UNAPPROVED_STYLE_OR_TERRITORY_LEAK</text>
  <text x="450" y="480" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="12">Web IQ 检出未获版权委員会监修批文投产或仅限中国大陆授权窜货欧美</text>
  <text x="450" y="497" fill="#D8B4FE" font-family="Consolas, monospace" font-size="11">licensor_style_approval_hash = null | territory_breach = true</text>

  <rect x="434" y="520" width="362" height="88" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.5" />
  <text x="450" y="544" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 409 · TIERED_MG_AND_PRESALE_MADE_TO_ORDER_BATCH</text>
  <text x="450" y="564" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="12">低保底分阶释放 + 预售以销定产(全息标按需申领)立省 25%</text>
  <text x="450" y="584" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">季度 IP 联名保底金与周边版税池 $250,000 → 净结算额 $187,500 (省 $62,500)</text>

  <!-- Right Panel: Platform Selection Matrix -->
  <rect x="836" y="132" width="320" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="856" y="164" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🧭 IP 授权与谷子周边平台选型</text>

  <rect x="854" y="184" width="284" height="100" rx="8" fill="#1E293B" />
  <text x="868" y="206" fill="#EC4899" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">阿里鱼 / 迪士尼 / 三丽鸥授权中心 (头部 IP 平台)</text>
  <text x="868" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 标准在线图库监修工作流(OPA/Mediabox)，强制申领</text>
  <text x="868" y="246" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  官方全息防伪镭射贴纸，按防伪标申领数量核算 MG 抵扣</text>
  <text x="868" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：快消品牌联名、名创优品/泡泡玛特正版潮玩开发</text>

  <rect x="854" y="298" width="284" height="100" rx="8" fill="#1E293B" />
  <text x="868" y="320" fill="#A855F7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">万代南梦宫 / Bilibili 会员购 / Animate (谷子经济)</text>
  <text x="868" y="340" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 支持先行盲盒/徽章定金预售(受注生产)锁定真实粉丝</text>
  <text x="868" y="360" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  需求，背卡激光赋码一物一码防盗版同人厂山寨冲货</text>
  <text x="868" y="380" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：二次元徽章(吧唧)、亚克力立牌、毛绒痛包联名</text>

  <rect x="854" y="412" width="284" height="196" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="868" y="436" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">★ 推荐：Foundry + 全息配额与 MG 抵扣网关</text>
  <text x="868" y="458" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 一物一码全息防伪标配额锁杜绝代工厂夜班偷印</text>
  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. MG 保底金未冲抵满额前 0 超额版税重复扣款</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 拦截未过日本版权监修打样与跨授权区域窜货</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. 受注预售按需申领防伪标立省 25%</text>
  <rect x="868" y="542" width="256" height="50" rx="6" fill="#022C22" />
  <text x="880" y="563" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">审计标签：provenance = synthetic</text>
  <text x="880" y="581" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="11">independently_reproduced = false</text>
</svg>

  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">瓶头电磁先导阀已拧下悬空照片，11ms 硬拦截看表糊弄与带阀测试误喷风险。</text>


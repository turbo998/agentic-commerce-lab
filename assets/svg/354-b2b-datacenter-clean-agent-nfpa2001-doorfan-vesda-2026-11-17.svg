  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统数据中心气体灭火与 VESDA 维保四大黑洞 (Legacy Clean-Agent Leakage: 32%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 进机房看一眼压力表 5 分钟走人收 $3,800，且测试时不拧下电磁驱动头致误喷</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">液态七氟丙烷/全氟己酮只要剩一滴蒸汽压就不变，不拿超声波液位仪测液面高度纯属瞎看；</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">更因测试前未物理拆下瓶头电磁先导阀 (Solenoid)，继电器动作瞬间误喷 $45,000 药剂。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 顶部增压干氮气微渗掉压 12%（液态药剂一克没少），却骗你花 $14,000 重灌药剂</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">钢瓶压力从 360 PSI 掉到 315 PSI 往往只是瓶口漏了一点廉价驱动氮气（只需 $180 补氮），</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">维保商却谎称“350 磅昂贵全氟己酮漏光了”，骗取 $14,000 全量药剂重充暴利。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. $65 VESDA 极早期烟感双级空气滤芯脏堵，被虚报为 $4,200 换整套激光探测腔</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">VESDA-E 报 Filter Fault 或 Airflow Low，92% 只是 $65 插拔式滤芯积灰或采样管孔</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">需反吹清灰，维保商却谎称内部高精密激光散射探测腔烧毁，强收 $4,200 换腔。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 无 NICET Special Hazards 执照，且漏做 NFPA 2001 门风扇 &gt;=10 分钟气密测试</text>

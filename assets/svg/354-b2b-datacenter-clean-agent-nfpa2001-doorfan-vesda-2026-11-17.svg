  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 药剂失重 &lt;=5% 锁定 $180 补氮锁 + $65 VESDA 滤芯降级锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">凡超声波液位证实液态药剂失重 &lt;= 5%，低压钢瓶一律锁定 $180 干氮气复压；VESDA</text>

  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 逐瓶超声波液位毫米测定锁 + 测试前物理拧下电磁阀锁 (11ms → HTTP 403)</text>

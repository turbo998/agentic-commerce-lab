  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动将 $14,000 重充药剂降级为 $180 补氮并降级 VESDA 滤芯 (235ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将液位正常的掉压钢瓶降级为干氮气复压并将 VESDA 换激光腔降为换滤芯：</text>

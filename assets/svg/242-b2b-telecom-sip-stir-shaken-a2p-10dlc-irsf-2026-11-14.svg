  <text x="684" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FDE68A">• 在 $360,000.00 电信批次上立省 $28,800.00 (净结算 $331,200.00 · HTTP 409 Confirm)！</text>


  <text x="50" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#FECACA">Why Unprotected OTP APIs &amp; Raw LLM Strings Trigger $120k Pumping &amp; 3x UCS-2 Shocks</text>

  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. 流氓运营商勾结黑产实施短信刷量 (AIT / SMS Pumping) 与国际骗费 (IRSF)</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 僵尸网络周末向索马里/海事卫星 (+882/+252) 高落地费号段触发 50万次验证码与语音回拨。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 底层流氓小运营商伪造 DELIVERED 回执与黑产分赃，一夜刷爆 $120,000 网间结算费！</text>

  <rect x="48" y="282" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">2. 大模型夹带 1 个弯引号 (’) 或 Emoji (📦) 触发 3 倍 UCS-2 分片暴击</text>
  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 155 字符英文通知在 7-bit GSM-7 下仅 1 条 (上限 160 字)；混入 1 个弯引号即降级为 16-bit UCS-2。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 扣除 6 字节 UDH 拼接头后单条仅容 67 字，瞬间裂变为 3 条计费分片 (账单暴涨 +200%)！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 外呼缺失 FCC STIR/SHAKEN Attestation-A 签名遭运营商直接拦截</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• AI 语音外呼未携带 STI-CA 签发的 PASSporT A 级签名，或上游落地商被 FCC RMD 数据库除名。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 呼叫被终端标记为 Spam Likely 或在网间关口被全量拒接，接通率跌至 &lt;8%！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">4. 美区 A2P 10DLC 未备案或触发 SHAFT 违禁词遭 $10,000/例重罚</text>
  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 未绑定 The Campaign Registry (TCR) 10DLC 活动 ID 或营销文案越界触发运营商 Sev-0 罚单。</text>
  <text x="64" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 跨国身份核验死磕高价国际 SMS ($0.25/条)，未采用静默网络鉴权 (SNA) 造成巨额浪费。</text>


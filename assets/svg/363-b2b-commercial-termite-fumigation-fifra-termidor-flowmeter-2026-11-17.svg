<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg363" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent363" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg363)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent363)"/>

  <!-- Header -->
  <text x="48" y="58" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 361 · COMMERCIAL TERMITE &amp; WDO CONTROL (EPA FIFRA / SPCB), 4 GAL/10 LF FLOW &amp; SENTRICON NFC GATE</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">商业地产白蚁防治与帐幕熏蒸、4 Gal/10 LF 流量物料平衡锁与饵站拔芯 NFC 清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">BASF Termidor SC / Corteva Sentricon / Douglas Vikane · 0.06% 氟虫腈原液瓶平衡 + &lt;=12" 钻孔锁 + 药芯底部 NFC + Fumiscope Ct</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="64" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">🐜 四大商业白蚁防治化学与物理硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. EPA FIFRA 4.0 Gal/10 LF 流量 &amp; 空瓶锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Termidor SC 法定每 10 线性英尺必灌 4.0 加仑药液</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制核对 78 oz 原液瓶序列号 (&gt;=3.2 fl.oz./10 LF)</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截 1 瓶药兑满水箱掺水稀释与漏钻孔骗局</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 地下 Sentricon 饵站拔芯底部 NFC 锁</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁只扫草坪绿色外盖条码不打开饵站走过场</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 必须拔出地下 Recruit HD 药棒读取底部 &lt;=2cm NFC</text>
  <text x="74" y="368" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断全年不掀盖子的 $4,500 幽灵续保年费</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="426" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Vikane 帐幕熏蒸 Fumiscope Ct 积分锁</text>
  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 硫酰氟熏蒸须上传导热仪连续浓度×时间 (Oz-Hrs/MCF)</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制核验散气通风后室内残留 &lt;= 1.0 ppm 安全复工线</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 杜绝大风漏气导致干木白蚁未死透二次复发</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="540" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. Web IQ 州 SPCB WDO 执照 &amp; FIFRA 核查</text>
  <text x="74" y="560" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• /v3/browse 核验州 Category 7B/7C 结构白蚁/熏蒸执照</text>
  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截违规使用未获室内注册的廉价农用杀虫剂</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 满足商业地产并购 NPMA-33 法定披露合规</text>

  <!-- Center Column: 5-Lane Deterministic Matrix -->
  <rect x="416" y="132" width="424" height="495" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="436" y="160" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">⚖️ 五路确定性清算决策矩阵 (5-Lane Matrix)</text>

  <!-- Lane 200 -->
  <rect x="432" y="176" width="392" height="76" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="446" y="198" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="446" y="218" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12">VERIFIED_COMMERCIAL_TERMITE_WDO_FIFRA_SETTLED</text>
  <text x="446" y="238" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">4 Gal/10 LF 流量平衡 + 拔芯 NFC + Vikane Ct + SPCB → $118,000.00</text>

  <!-- Lane 403 -->
  <rect x="432" y="264" width="392" height="76" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="446" y="286" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="446" y="306" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">WATERED_DOWN_TERMITICIDE_DILUTION_OR_SHORT_GALLON_INJECTION_BLOCKED</text>
  <text x="446" y="326" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截灌注不足 4 Gal/10 LF 或 Termidor 原液瓶数掺水缩水 → $0.00</text>

  <!-- Lane 422 -->
  <rect x="432" y="352" width="392" height="76" rx="8" fill="#450A0A" stroke="#F87171"/>
  <text x="446" y="374" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="446" y="394" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">SKIPPED_IN_GROUND_BAIT_CORE_NFC_SCAN_OR_UNDERDOSED_VIKANE_CT_CURVE</text>
  <text x="446" y="414" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截地下饵站缺失拔芯内部 NFC 扫码或熏蒸 Ct 值未达标 → $0.00</text>

  <!-- Lane 451 -->
  <rect x="432" y="440" width="392" height="76" rx="8" fill="#3B0764" stroke="#C084FC"/>
  <text x="446" y="462" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛑 HTTP 451 · Send to a human (265ms)</text>
  <text x="446" y="482" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">UNLICENSED_SPCB_WDO_APPLICATOR_OR_NON_EPA_REGISTERED_TERMITICIDE_HOLD</text>
  <text x="446" y="502" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web IQ 挂起无州 SPCB WDO 执照或非 EPA 注册白蚁药剂 → $0.00</text>

  <!-- Lane 409 -->
  <rect x="432" y="528" width="392" height="84" rx="8" fill="#451A03" stroke="#F59E0B"/>
  <text x="446" y="550" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🧑‍⚖️ HTTP 409 · Confirm (230ms)</text>
  <text x="446" y="570" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">AUTOMATED_TERMIDOR_GALLON_RECONCILIATION_AND_NFC_BAIT_SAVINGS_CONFIRM</text>
  <text x="446" y="592" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">按真实注射加仑数与已拔芯 NFC 饵站核减立省 $19,800 → 净付 $98,200.00</text>

  <!-- Right Column: FinOps & Benchmark -->
  <rect x="856" y="132" width="300" height="495" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="876" y="160" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">📊 成本精算与基准对比</text>

  <rect x="872" y="176" width="268" height="145" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="886" y="198" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">单批园区白蚁屏障与熏蒸总额</text>
  <text x="886" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">$118,000.00</text>
  <text x="886" y="252" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web IQ 药量对账 &amp; 拔芯核减立省：</text>
  <text x="886" y="278" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">-$19,800.00 (-16.8%)</text>
  <text x="886" y="304" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">净清算额：$98,200.00</text>

  <rect x="872" y="335" width="268" height="140" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="886" y="357" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Web IQ vs. 竞品检索能力</text>
  <text x="886" y="379" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ: 230ms 直连 EPA PPLS 标签库</text>
  <text x="886" y="399" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  与州 SPCB Category 7B/7C 执照库</text>
  <text x="886" y="421" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Bright Data: 缺乏 4 Gal/10 LF 流量</text>
  <text x="886" y="441" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">  与 3.2 oz 原液瓶物料平衡模型</text>
  <text x="886" y="461" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exa: 无法做 Vikane Ct 曲线强校验</text>

  <rect x="872" y="489" width="268" height="121" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="886" y="511" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛠️ 生产核验清单 (Checklist)</text>
  <text x="886" y="533" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ 4.0 Gal/10 LF 流量 &amp; 78oz 原液瓶码</text>
  <text x="886" y="553" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ 地下饵站拔芯 NFC &amp; Vikane Ct 曲线</text>
  <text x="886" y="573" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ 州 SPCB WDO 执照 &amp; EPA Reg. No.</text>
  <text x="886" y="593" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">☑ 零虚构坐标 · CSP 自包含沙盒通过</text>
</svg>

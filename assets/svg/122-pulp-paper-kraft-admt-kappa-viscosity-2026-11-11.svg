  </text>
  <text x="445" y="446" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" font-weight="700" fill="#FDE68A">
    HTTP 409 Confirm · 立省 $32,800 ($172,200 净付)
  </text>
  <text x="445" y="465" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" font-weight="700" fill="#A7F3D0">
    ✅ 200 OK · 19ms 自动清算 $205,000.00
  </text>

  <!-- Right Card: Quantitative Benchmark & Architecture Wins -->
  <rect x="805" y="132" width="355" height="360" rx="12" fill="url(#cardBg122)" stroke="#10B981" stroke-width="1.5"/>
  <rect x="821" y="148" width="323" height="32" rx="6" fill="#064E3B"/>
  <text x="982" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0" text-anchor="middle">
    📊 定量实测基准与架构师收益 (Round 120)
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="823" y="204" font-weight="700" fill="#6EE7B7">• ADMT 净重与粘度 860 mL/g 放款 (200)</text>
    <text x="823" y="223" fill="#CBD5E1">  延迟：19 ms · 放款：$205,000.00 (ISO 白度 90%)</text>

    <text x="823" y="253" font-weight="700" fill="#FCA5A5">• 22% 湿浆包未折算 ADMT 拦截 (403)</text>
    <text x="823" y="272" fill="#CBD5E1">  延迟：11 ms · 拦截买水冤枉钱：$205,000.00</text>

    <text x="823" y="302" font-weight="700" fill="#FCA5A5">• 过漂致特性粘度崩塌 (&lt;750 mL/g) 拦截 (422)</text>
    <text x="823" y="321" fill="#CBD5E1">  延迟：14 ms · 保护高速纸机免遭断头停机</text>

    <text x="823" y="351" font-weight="700" fill="#FDE68A">• Web IQ 管道湿浆直供与妥尔油抵扣 (409)</text>
    <text x="823" y="370" fill="#CBD5E1">  延迟：295 ms · 节省：$32,800.00 (16.0% 降本)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  141 / 141 单元测试 100% 通过 (CSP 自包含)</text>
  </g>
  <rect x="823" y="442" width="319" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="982" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">
    只为 90% 绝干长纤维买单，终结湿包注水与过漂断纸
  </text>

  <!-- Footer Banner -->
  <rect x="40" y="512" width="1120" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="541" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700" fill="#6EE7B7">
    🏛️ 架构师选型铁律 (Takeaway): 绝对不要按“地磅湿毛重吨数”或“只看纸面白度”盲付大宗漂白针叶浆/阔叶浆 (BSKP/BEKP) 货款！
  </text>
  <text x="60" y="565" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    必须绑定：① 全包穿透微波实测风干公吨 ADMT = 绝干重 / 0.90 (11ms 拦 403)；② ISO 5351 铜乙二胺特性粘度 &gt;=750 mL/g 防过漂断链 (14ms 拦 422)；
  </text>
  <text x="60" y="586" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    ③ Web IQ 核查 ECF/TCF 可吸附有机卤素 (AOX &lt;=0.2 kg/t) 与 EUDR 多边形 (285ms 拦 451)，并通过林浆纸一体化管道湿浆直供与粗妥尔油 (CTO) 副产立省 $32,800 (295ms)。
  </text>
</svg>

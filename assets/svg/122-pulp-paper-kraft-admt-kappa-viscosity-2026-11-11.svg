<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg122" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081512"/>
      <stop offset="50%" stop-color="#112721"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent122" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="cardBg122" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15322A"/>
      <stop offset="100%" stop-color="#0A1915"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg122)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent122)"/>

  <!-- Header -->
  <rect x="40" y="24" width="390" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="235" y="43" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#D1FAE5" text-anchor="middle">
    ROUND 120 · BLEACHED KRAFT PULP (BSKP / BEKP) ADMT ESCROW
  </text>
  <text x="40" y="84" font-family="Segoe UI, Ubuntu, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">
    大宗漂白木浆贸易 (BSKP/BEKP)、风干公吨 (ADMT 90%绝干) 与粘度/白度智能托管
  </text>
  <text x="40" y="111" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" fill="#94A3B8">
    Microwave Bale ADMT (Bone-Dry / 0.90), ISO 5351 Intrinsic Viscosity (&gt;=750 mL/g) &amp; ECF/TCF AOX Guard vs. Wet-Bale Overbilling
  </text>

  <!-- Left Card: Legacy Gross Wet-Bale & Over-Bleached Fiber Failure -->
  <rect x="40" y="132" width="355" height="360" rx="12" fill="url(#cardBg122)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="148" width="323" height="32" rx="6" fill="#450A0A"/>
  <text x="217" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">
    ❌ 传统按地磅湿重盲付与过漂脆断踩坑
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 浆包芯部含水 22% (超 10% 基准) 把水当木浆卖</text>
    <text x="58" y="224" fill="#CBD5E1">• 按码头地磅湿毛重收走 $205,000 针叶/阔叶浆货款</text>
    <text x="58" y="242" fill="#CBD5E1">• 烘箱/微波实测绝干纤维仅 78%，每船白花 $2.7万买水分</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 为凑 ISO 90% 高白度过量加氯致纤维链断裂</text>
    <text x="58" y="294" fill="#CBD5E1">• 纸面白度虽高，但铜乙二胺特性粘度跌破 580 mL/g (&lt;750)</text>
    <text x="58" y="312" fill="#CBD5E1">• 纤维聚合度崩塌，上高速造纸机每小时断纸停机</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 元素氯漂白产生二噁英 (AOX) 或违反 EUDR 毁林</text>
    <text x="58" y="364" fill="#CBD5E1">• 冒充 ECF/TCF 无元素氯漂白，可吸附有机卤素 AOX 超标</text>
    <text x="58" y="382" fill="#CBD5E1">• 导致母婴生活用纸/食品卡纸被欧盟海关查封召回</text>
  </g>
  <rect x="58" y="442" width="319" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="217" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">
    风险敞口：$205,000 湿包注水款 + 纸机高频断头停产
  </text>

  <!-- Center Card: 4-Layer Kraft Pulp Mandate Engine -->
  <rect x="415" y="132" width="370" height="360" rx="12" fill="url(#cardBg122)" stroke="#10B981" stroke-width="2"/>
  <rect x="431" y="148" width="338" height="32" rx="6" fill="#064E3B"/>
  <text x="600" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#D1FAE5" text-anchor="middle">
    ⚡ 微波 ADMT 折算 + 特性粘度 + 湿浆直供托管
  </text>

  <!-- Step 1 -->
  <rect x="433" y="192" width="334" height="58" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="445" y="211" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">
    Gate 1 · 穿透微波风干公吨 (ADMT = 绝干/0.90 · 11ms)
  </text>
  <text x="445" y="229" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" fill="#CBD5E1">
    含水率 &gt; 10% 未按 ISO 638 折算 ADMT 净重或湿包霉变 →
  </text>
  <text x="445" y="244" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#F87171">
    HTTP 403 EXCESS_BALE_MOISTURE_UNADJUSTED_ADMT_BLOCKED
  </text>

  <!-- Step 2 -->
  <rect x="433" y="258" width="334" height="58" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="445" y="277" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#FDE047">
    Gate 2 · ISO 5351 特性粘度 (&gt;=750 mL/g) 与尘埃度 (14ms)
  </text>
  <text x="445" y="295" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" fill="#CBD5E1">
    过度漂白致特性粘度 &lt; 750 mL/g (抗张撕裂崩塌) 或尘埃超标 →
  </text>
  <text x="445" y="310" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#F87171">
    HTTP 422 CELLULOSE_VISCOSITY_DEGRADATION_OR_DIRT_SPECK_BLOCKED
  </text>

  <!-- Step 3 -->
  <rect x="433" y="324" width="334" height="58" rx="8" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
  <text x="445" y="343" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F472B6">
    Gate 3 · Web IQ ECF/TCF 零二噁英与 FSC/EUDR (285ms)
  </text>
  <text x="445" y="361" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" fill="#CBD5E1">
    有机卤素 AOX &gt; 0.2 kg/t 或缺失 FSC/PEFC 与 EUDR 多边形 →
  </text>
  <text x="445" y="376" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#F87171">
    HTTP 451 ELEMENTAL_CHLORINE_AOX_OR_EUDR_FOREST_HOLD
  </text>

  <!-- Step 4 -->
  <rect x="433" y="390" width="334" height="86" rx="8" fill="#064E3B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="445" y="410" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#7DD3FC">
    Gate 4 · Web IQ 园区管道湿浆直供 + 妥尔油副产 (295ms)
  </text>
  <text x="445" y="428" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" fill="#D1FAE5">

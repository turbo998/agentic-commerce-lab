  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 承运商 EDI 强制锁死 ASR 21+ 成人当面验身签收 + 禁快递柜：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 14ms 拦截任何 P.O. Box 与无人快递柜地址；强制快递员手持终端扫 21+ 证件签收。</text>


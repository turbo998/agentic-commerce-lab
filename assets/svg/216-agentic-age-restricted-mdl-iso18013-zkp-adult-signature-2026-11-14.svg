  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 盲目跨州直邮寄往犹他/密西西比禁运州触犯州级重罪 (Felony)：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 未校验 ZIP+4 干县禁令或突破德州单人每月 9 加仑限购上限。</text>


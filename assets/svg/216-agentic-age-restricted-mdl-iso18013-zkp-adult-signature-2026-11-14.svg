  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 网页勾选框自证 (Self-Attestation) + 普通快递放门口/快递柜：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 监管钓鱼执法机器人勾选“已满 21 岁”下单，快递员把酒箱扔在门廊无验身；</text>

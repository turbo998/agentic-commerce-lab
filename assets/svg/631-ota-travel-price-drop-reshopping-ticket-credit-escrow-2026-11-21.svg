  <rect width="1200" height="675" fill="url(#bg631)"/>
  <rect x="28" y="22" width="1144" height="68" rx="12" fill="#0f172a" stroke="url(#hdr631)" stroke-width="2"/>
  <text x="48" y="51" class="title">Round 188 · OTA &amp; Corporate Travel Post-Booking Price-Drop Re-Shopping &amp; Credit-Bank Escrow</text>
  <text x="48" y="74" class="sub">Tripbam / FairFly / Navan / Amadeus · Book-New-Before-Cancel Mutex · Exact Room/Perk Parity · Unused e-Credit Auto-Apply (-35% Spend)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1081" y="59" text-anchor="middle" class="mono" fill="#a7f3d0">SVG #631 · FAQ #307</text>

  <!-- Lane 1: Book-New-Before-Cancel Atomic Saga & Penalty Window Lock -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Book-New-Before-Cancel Saga Lock (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops "Cancel Old Room → New Rate Sold Out!":</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Step 1: Confirm New_PNR_Hotel_Conf_Number</text>
  <text x="54" y="200" class="mono">Step 2: ONLY THEN Cancel Old_Reservation</text>
  <text x="44" y="223" class="body-txt">• Cancellation-Penalty Deadline Safety Buffer:</text>
  <text x="54" y="243" class="mono">Freeze Re-Shopping at `Cancel_Cutoff - 24h`</text>
  <text x="44" y="266" class="body-txt">• Prevents triggering a 1-night penalty charge</text>
  <text x="54" y="286" class="body-txt">due to hotel destination timezone mismatch</text>
  <text x="54" y="304" class="body-txt">or losing the traveler's room during a conference</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 CANCEL_BEFORE_NEW_CONFIRM_OR_PAST_CUTOFF_BLOCKED</text>

  <!-- Lane 2: Room-Attribute, Loyalty & Refundability Downgrade Guard -->
  <rect x="416" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. Room-Perk &amp; Fare-Rule Parity Gate (422)</text>
  <text x="432" y="162" class="body-txt">• Stops Downgrading Flexible Rate to Non-Refundable:</text>
  <text x="442" y="182" class="mono">Require New_Rate.Refundable == True &amp;</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">Bed_Type + Breakfast + Loyalty_Points Retained</text>
  <text x="432" y="223" class="body-txt">• Air Fare-Drop Net-Savings Threshold (`>=$35`):</text>
  <text x="442" y="243" class="mono">Net_Gain = Fare_Drop - Change_Fee - Seat_Loss</text>
  <text x="432" y="266" class="body-txt">• Blocks re-ticketing if middle seat replaces</text>
  <text x="442" y="286" class="body-txt">aisle/window or if switching from direct hotel</text>
  <text x="442" y="304" class="body-txt">rate to opaque bedbank strips Marriott Bonvoy</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 NONREFUNDABLE_DOWNGRADE_OR_SEAT_LOSS_BLOCKED</text>

  <!-- Lane 3: Orphaned Unused e-Ticket Credit & Offboarding Pool -->
  <rect x="804" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. Unused e-Ticket Credit Bank Lock (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Stops Buying Cash Tickets While Credits Expire:</text>
  <text x="830" y="182" class="mono">8-12% of Corporate Flights Cancel into e-Credits</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">Auto-Intercept New Checkout if Open_Credit &gt; $0</text>
  <text x="820" y="223" class="body-txt">• Departed-Employee Ticket Name-Change Reclaim:</text>
  <text x="830" y="243" class="body-txt">On `Workday Termination`, converts traveler-named</text>
  <text x="830" y="261" class="body-txt">ETKT into corporate `UATP / Name-Waiver Pool`</text>
  <text x="820" y="284" class="body-txt">• Blocks departed employees from using company-</text>
  <text x="830" y="302" class="body-txt">paid airline credits for personal vacations</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 UNAPPLIED_OPEN_ECREDIT_OR_ORPHAN_TICKET_HOLD</text>

  <!-- Bottom 24/7 Automated Re-Shopping & Residual MCO Capture Architecture -->
  <rect x="28" y="374" width="1144" height="182" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="48" y="401" class="card-hdr" fill="#38bdf8">4. Continuous 6-Hour Hotel/Air Price-Drop Re-Shopper + Residual EMD/e-Credit Auto-Redemption (HTTP 409)</text>

  <rect x="48" y="418" width="255" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="62" y="440" class="card-hdr">① 6-Hour Rate-Drop Radar</text>
  <text x="62" y="462" class="body-txt">Polls GDS/NDC &amp; corporate</text>
  <text x="62" y="480" class="body-txt">rates every 6h after booking;</text>
  <text x="62" y="498" class="body-txt">24% of hotel bookings drop</text>
  <text x="62" y="516" class="mono">Avg -$118 Saved per Rebooked Stay</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="337" y="440" class="card-hdr">② Zero-Touch Hotel Swap</text>
  <text x="337" y="462" class="body-txt">Books new lower rate with same</text>
  <text x="337" y="480" class="body-txt">King bed + Bonvoy/Hilton #,</text>
  <text x="337" y="498" class="body-txt">then cancels higher old PNR;</text>
  <text x="337" y="516" class="mono">0 Traveler Action Required</text>

  <rect x="608" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="622" y="440" class="card-hdr">③ Air Fare-Drop Residual EMD</text>
  <text x="622" y="462" class="body-txt">Re-issues US/NDC zero-change-fee</text>
  <text x="622" y="480" class="body-txt">tickets when fare drops &gt;$40 &amp;</text>
  <text x="622" y="498" class="body-txt">banks residual `EMD` credit;</text>
  <text x="622" y="516" class="mono" fill="#6ee7b7">Preserves Aisle/Window Seat</text>

  <rect x="893" y="418" width="259" height="120" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="907" y="440" class="card-hdr" fill="#6ee7b7">④ Checkout e-Credit Auto-Burn</text>
  <text x="907" y="462" class="body-txt">Automatically applies expiring</text>
  <text x="907" y="480" class="body-txt">unused ticket credits at next</text>
  <text x="907" y="498" class="body-txt">booking before charging card;</text>
  <text x="907" y="516" class="mono" fill="#38bdf8">-35% Post-Booking Travel Spend</text>

  <!-- KPI Footer -->
  <rect x="28" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="46" y="604" class="kpi-num" fill="#38bdf8">-35.0%</text>
  <text x="46" y="626" class="kpi-lbl">Quarterly Overpaid Rate &amp; Credit Saved</text>
  <text x="46" y="642" class="mono">$54,250 Saved / $155k Pool</text>

  <rect x="318" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="336" y="604" class="kpi-num" fill="#10b981">Book-Then-Cancel</text>
  <text x="336" y="626" class="kpi-lbl">Atomic 2-Phase Hotel Rebook Saga</text>
  <text x="336" y="642" class="mono">0 Lost Rooms During Re-Shop</text>

  <rect x="608" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="626" y="604" class="kpi-num" fill="#f59e0b">100% Perk Match</text>
  <text x="626" y="626" class="kpi-lbl">Bed + Breakfast + Loyalty Preserved</text>
  <text x="626" y="642" class="mono">No Opaque Non-Refundable Traps</text>

  <rect x="898" y="572" width="274" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="916" y="604" class="kpi-num" fill="#f472b6">0 Expired ETKTs</text>
  <text x="916" y="626" class="kpi-lbl">Automated Unused-Credit Bank</text>
  <text x="916" y="642" class="mono">Reclaims Departed-Staff Credits</text>
</svg>

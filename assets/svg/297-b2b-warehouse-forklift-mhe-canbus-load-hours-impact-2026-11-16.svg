<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg297" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#3F6212"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent297" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg297)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent297)"/>

  <!-- Header -->
  <text x="52" y="62" fill="#A3E635" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-16 · ROUND 295 · B2B WAREHOUSE FORKLIFT &amp; MHE FLEET LEASING, CAN-BUS LOAD HOURS &amp; 5G IMPACT</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">B2B 仓储叉车与物料搬运设备 (MHE) 租赁维保：CAN-Bus 负载工时锁、5G 碰撞铁证与池化清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">封杀“按钥匙未拔怠速小时 (Key-On +38%) 收超时罚款” · 无 &gt;=5G 碰撞传感器铁证禁收全包外人为损坏费 · 退租豁免配重块掉漆</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统仓储叉车租赁与全包维保三大黑洞 (贵 20%–36%)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 按“钥匙通电时长 (Key-On)”收 $4,275/车超时费</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 拣货工下车搬箱缠膜不拔钥匙，车载电脑亮屏照走工时表</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 电机真实运转仅 1,850h，Key-On 表却记 3,200h (虚增 38%)</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 忙车狠罚 $2.85/h 超时费，同仓闲车剩余额度却一分不抵</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 全包维保把聚氨酯轮磨损甩锅“人为滥用 ($1,400)”</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 明明买了每月 $165/台全包维保 (Full Maintenance)</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 只要聚氨酯承载轮脱胶或油封渗油，就赖“地面有碎屑属滥用”</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 70% 常规易损件被踢出全包范围，按 250% 配件溢价再收钱</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 5年退租拿放大镜看掉漆敲诈 $4,500 &amp; 漏测货叉</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 租约到期退车时，把仓库叉车配重块正常掉漆当事故索赔</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 每台旧车勒索 $4,500 喷漆翻新费，逼客户高价续租</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 平时只收 PM 费却不拿卡尺测货叉 10% 磨损，埋断叉隐患</text>

  <!-- Center Card: Agentic Policy Engine -->
  <rect x="422" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#84CC16" stroke-width="1.5"/>
  <rect x="422" y="136" width="356" height="38" rx="12" fill="#365314"/>
  <text x="442" y="160" fill="#D9F99D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体 CAN-Bus 负载工时、5G 碰撞与安全三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#4D7C0F"/>
  <text x="452" y="210" fill="#A3E635" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：CAN-Bus 踏板/电机负载工时与全车队池化锁</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 仅当死人踏板踩下且牵引/升降电机电流 &gt;5A 时才累加计时</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 500 台车共享年度总工时池，忙闲车辆内部 100% 互抵</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 阻断 Key-On 待机超时费与孤岛罚款</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#4D7C0F"/>
  <text x="452" y="326" fill="#A3E635" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：&gt;=5.0G 碰撞加速度铁证与退租掉漆豁免门禁</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 无车载加速度计 &gt;=5G 硬碰撞记录，车轮/油封一律全包免费</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 退租严格豁免配重块、门架与护顶架一切非结构性掉漆刮痕</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 拦截全包甩锅收费与退租油漆敲诈</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#4D7C0F"/>
  <text x="452" y="442" fill="#A3E635" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ OSHA 1910.178 货叉/链条卡尺锁</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 核验 ANSI B56.1 货叉 &lt;=10% 磨损测量</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 核查门架板式链 &lt;=3% 伸长率读数与原厂强制安全召回</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $23,400</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="796" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="796" y="136" width="356" height="38" rx="12" fill="#064E3B"/>
  <text x="816" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 仓储叉车车队 ($260,000) 实测矩阵</text>

  <rect x="812" y="188" width="324" height="60" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="826" y="210" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="826" y="232" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">CAN-Bus 有效工时池化 + 零伪滥用 + 货叉检测 → $260k</text>

  <rect x="812" y="258" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="280" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="826" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">按 Key-On 怠速时长收超时费或拒绝车队池化 → 拦截</text>

  <rect x="812" y="328" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="826" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">无 &gt;=5G 碰撞把车轮磨损算滥用或退租敲诈喷漆费 → 阻断</text>

  <rect x="812" y="398" width="324" height="60" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="826" y="420" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 (275ms) / 🧑‍⚖️ HTTP 409 (240ms)</text>
  <text x="826" y="442" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">漏测货叉 10% 磨损挂起 / 负载池化+砍甩锅费省 $23,400</text>

  <rect x="812" y="468" width="324" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="826" y="490" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">💡 CAN-Bus 负载池化与剔除甩锅维修后净付：$236,600 (省 9%)</text>
  <text x="826" y="510" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="11">令牌：b2b_warehouse_forklift_mhe_fleet_lease_canbus_...</text>

  <!-- Footer -->
  <rect x="48" y="556" width="1104" height="80" rx="10" fill="#020617" stroke="#334155"/>
  <text x="68" y="582" fill="#A3E635" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 叉车租约严禁按钥匙通电 (Key-On) 计表，必须绑定 CAN-Bus 死人踏板 + 电机电流 &gt;5A 真实工作小时并执行全车队池化对冲。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 全包维保任何“人为损坏”增项必须具备 &gt;=5.0G 碰撞遥测铁证，且 PM 工单须经 Web IQ 校验 ANSI B56.1 货叉卡尺读数。</text>
</svg>

  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Deel vs Rippling Global vs Remote.com vs Papaya Global vs Azure AI Foundry + IR35/AB5 &amp; Local FX Gate</text>


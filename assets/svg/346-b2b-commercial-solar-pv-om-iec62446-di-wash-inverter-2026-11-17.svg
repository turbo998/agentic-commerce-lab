  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 无 NABCEP 认证人员将不同品牌 MC4 插头混插，引发 1,000V 直流拉弧屋顶大火</text>

  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统工商业光伏电站运维四大黑洞 (Legacy Solar O&amp;M Leakage: 30%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 直接接 350 ppm 市政自来水冲光伏板，留下永久白碱水垢废掉 25 年原厂质保</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">省掉去离子纯水 (DI Water) 树脂滤罐，烈日下拿高硬度自来水喷洗组件，碳酸钙结垢</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">烧毁玻璃表面纳米减反射增透膜，清洗后发电性能比 (PR) 零提升却收 $18,000。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 清晨或阴天低辐照度 (&lt;200 W/m²) 飞无人机，伪造“全站零热斑”假红外报告</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">违反 IEC 62446-3 强制要求斜面辐照度 &gt;=600 W/m² 的物理定律，在弱光小电流下飞</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">20 分钟收 $4,500，完全漏检正午满载时会飙升至 95°C 的旁路二极管短路与隐裂热斑。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. $22 直流组串熔断器烧断或 $35 MC4 接触不良，被虚报为 $6,800 换整台逆变器</text>

  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 从搜索/短视频跳独立站需重新登录填地址，近 7 成买家放弃</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 传统平台闭环小店吞噬买家一方法律关系与 CRM 会员资产</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 缺乏 UCP 协议导致品牌无法兼顾“原生一键付”与“自有 MoR”!</text>


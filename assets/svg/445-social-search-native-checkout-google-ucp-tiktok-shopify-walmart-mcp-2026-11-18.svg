  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">社交与搜索原生直购架构选型：Google UCP vs. TikTok Buy Direct vs. Shopify Fall '26 vs. Walmart MCP</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">保留品牌名义商户 (Brand-as-MoR) · Shopify 跨品牌统一结账与安全警告过滤 · Walmart Agent Profile 限额 · 立省 $71,400 (21.0%)</text>


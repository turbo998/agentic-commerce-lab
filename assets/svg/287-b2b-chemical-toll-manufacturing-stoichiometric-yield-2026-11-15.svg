<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg287" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent287" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg287)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent287)"/>

  <!-- Header -->
  <text x="52" y="62" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-15 · ROUND 285 · B2B CHEMICAL TOLL MANUFACTURING &amp; CDMO STOICHIOMETRIC YIELD, SOLVENT RECOVERY &amp; PGM</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">B2B 精细化工与医药受托加工 (Tolling/CDMO)：摩尔收率守恒、精馏溶剂回收与贵金属催化剂清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">成品+母液 HPLC/qNMR 全摩尔质量守恒防谎报低收率偷料 · 精馏塔流量计强制冲抵 85% 循环套用溶剂 · 卡尔费休水分折百干基与钯铂损耗封顶</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统化工来料加工三大黑洞 (流失 12%–24%)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 谎报反应收率偏低，私吞 7.5% 高价医药中间体</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 实际釜内摩尔收率达 92%，却向委托方谎报仅 84.5%</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 截留 $58,000 纯品卖灰市；烘干留 3.2% 水分凑交货毛重</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 委托方既丢了免费提供的 KSM 主原料，又为水付加工费</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 精馏塔回收 88% 旧溶剂，账单全按 100% 新料收</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 20 釜连续生产中，第 2~20 釜 88% THF/乙腈系精馏套用</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 代工厂在全部 20 釜 BOM 账单上均按 100% 新溶剂收费</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 单次战役式生产白白被多收 $60,000 虚构溶剂采购款</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 虚报 4% 钯铂贵金属催化剂损耗与伪洗釜费</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 氢化反应 10% 钯碳 (Pd/C) 正常压滤损耗仅 0.6%</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 谎称“穿滤烧毁”虚报 4.2% 损耗侵吞贵金属海绵钯</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 同品种连续批次间虚构 3 次 $12,000 溶剂煮釜洗釜费</text>

  <!-- Center Card: Agentic Policy Engine -->
  <rect x="422" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="422" y="136" width="356" height="38" rx="12" fill="#065F46"/>
  <text x="442" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体摩尔质量守恒、精馏抵扣与催化剂三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#047857"/>
  <text x="452" y="210" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：成品+母液摩尔质量守恒与 KF 折百干基锁</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 校验投料摩尔数 = 成品摩尔数 + 母液残渣 qNMR 副产物</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制扣除 ASTM E203 卡尔费休水分 (&lt;=0.2%) 按折百干基计重</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 拦截无母液副产物支撑的偷料低收率</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#047857"/>
  <text x="452" y="326" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：精馏塔 85% 溶剂循环抵扣与 PGM 损耗门禁</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 战役第 2~20 釜强制只付 &lt;=15% 新溶剂补加量 + 蒸馏电费</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 铂/钯/铑催化剂损耗硬封顶 &lt;=1.0%，禁收同品种洗釜费</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 阻断回收溶剂当新料收与催化剂侵吞</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#047857"/>
  <text x="452" y="442" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ 庄信万丰定盘价与 TSCA/GMP 锁</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 核验 Johnson Matthey 铂钯铑克价</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 穿透核查 EPA TSCA / ECHA REACH 备案与 ICH Q7 GMP 状态</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $60,000</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="796" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="796" y="136" width="356" height="38" rx="12" fill="#164E63"/>
  <text x="816" y="160" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 20 釜定制合成战役 ($750,000) 实测矩阵</text>

  <rect x="812" y="188" width="324" height="60" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="826" y="210" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="826" y="232" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">摩尔质量守恒 + 85% 溶剂抵扣 + PGM 合规 → 清算 $750k</text>

  <rect x="812" y="258" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="280" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="826" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">谎报收率 84% 偷截 7.5% KSM 或含水 3.2% → 拦截</text>

  <rect x="812" y="328" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="826" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">回收溶剂当 100% 新料收或虚报 4% 钯碳损耗 → 阻断</text>

  <rect x="812" y="398" width="324" height="60" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="826" y="420" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 (275ms) / 🧑‍⚖️ HTTP 409 (240ms)</text>
  <text x="826" y="442" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">无 TSCA/GMP 挂起 / 冲抵 85% 循环溶剂省 $60,000</text>

  <rect x="812" y="468" width="324" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="826" y="490" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">💡 溶剂循环抵扣与折百干基后净付：$690,000 (省 8.0%)</text>
  <text x="826" y="510" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="11">令牌：b2b_chemical_toll_manufacturing_custom_...</text>

  <!-- Footer -->
  <rect x="48" y="556" width="1104" height="80" rx="10" fill="#020617" stroke="#334155"/>
  <text x="68" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 来料加工必须执行“投料摩尔数 = 折百干基成品摩尔数 + 母液副产物摩尔数”的 98%–102% 闭合质量守恒，彻底封死谎报低收率偷料。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 连续战役第 2..N 釜强制冲抵 &gt;=85% 精馏回收溶剂，铂/钯催化剂损耗封顶 1.0%，并由 Web IQ 实时锁定庄信万丰定盘价。</text>
</svg>

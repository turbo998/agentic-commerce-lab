<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg276" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent276" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="dangerGrad276" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad276" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg276)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="490" height="28" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
  <text x="289" y="55" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">ROUND 274 · HOME WARRANTY &amp; HVAC DISPATCH, BLE TELEMETRY &amp; A2L R-454B</text>
  <text x="44" y="96" fill="#f8fafc" font-size="22" font-weight="800">智能体房屋保修与商业暖通空调派单（HVAC Dispatch）、A2L 制冷剂与定额工单清算架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">防借表面浮锈霸王拒赔锁 + 蓝牙钳形表/歧管表 (µF电容+LRA电流) 诊断门禁 + 蓝牙冷媒秤与 UL 60335-2-40 A2L 安全锁 vs. 借生锈拒赔、$145/磅冷媒敲诈与电容谎报压缩机</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent276)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad276)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统房屋保修与商业空调维保派单的三大黑洞（拒赔敲诈 &amp; 小病大修）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. 借外壳正常浮锈/水箱水垢“霸王拒赔”转推 $9,500 自费单（403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 保修公司仅付 $65 低廉上门费；维修工拍一张外壳铁锈照片勾选“缺乏保养生锈拒赔”</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 保修公司免赔脱身，维修工当场向 40°C 酷暑中的业主推销 $9,500 全自费换新机拿 20% 提成</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 外壳浮锈与电机烧毁毫无因果关系，触发各州检察长 (AG) 数千万美元恶意拒赔重罚</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. 保内获批却强收业主 $1,850 伪改造费 &amp; $145/磅天价冷媒（422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• 谎称“保修只包盘管，不包氮气吹洗、接水盘改造与焊枪费”向业主当场强收 $1,175 现金</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• 批发价仅 $12~$18/磅的 R-410A/R-454B 冷媒按 $145/磅向业主敲诈差价 ($675)</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 把标准安装步骤拆成“非保修改造项”，让免费保修变成比外面市场价还贵的宰客局</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. 把 $18 电容没电谎报 $2,800 压缩机报废 &amp; A2L 微燃冷媒违规混装（451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• 空调外机不启动实为 $18 启动电容衰减 (21 µF)，维修工却虚报 $2,800 压缩机卡缸报废</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 违反 EPA AIM Act 新规在旧 R-410A 盘管混充微可燃 A2L (R-454B) 且无 UL 60335-2-40 传感器</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 商业连锁门店维保预算被“小病大修”掏空，且埋下室内微燃冷媒泄漏燃爆隐患</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad276)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + 蓝牙仪表锁 + OEM 直供四重确定性门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · 机电故障物理因果锁（11ms 封杀“借外壳浮锈霸王拒赔”· 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 强制核验拒赔申请是否具备物理击穿或短路因果铁证；凡对绕组烧毁、</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">主板故障以“外观浮锈/普通水垢”拒赔的工单 11ms 自动驳回，强制转入保内履约</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · 零“伪改造费”敲诈与蓝牙冷媒充注秤批发价封顶锁（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">严禁向业主私收焊枪、吹洗、接水盘等定额内基础工序费，并强制绑定蓝牙电子充注秤</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">实测克重按公允批发基准结算，彻底根除 $145/磅天价冷媒宰客</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · 蓝牙万用表 (µF电容+LRA电流) 诊断锁与 A2L RDS 门禁（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">申请换压缩机前必须上传接入正常电容 (µF) 后的真实堵转电流 (LRA) 波形，</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">并核验 R-454B/R-32 系统具备 AHRI 匹配证号与 UL 60335-2-40 RDS 防爆传感器</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 派单批次自动清算 &amp; 电容纠偏+批发商直供双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">10ms 签发 agentic_home_warranty_hvac_plumbing_... 令牌；立省 $41,600 维保费转 409</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#22d3ee" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 合规暖通派单清算</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">蓝牙遥测 + A2L 合规 ($520k)</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">HVAC Dispatch Settled · 10ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · 借表面浮锈/水垢拒赔</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">无物理因果拒赔转推 $9.5k 自费</text>
  <text x="410" y="692" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">ABUSIVE_RUST_DENIAL_BLOCKED</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · $1,850 伪改造/$145冷媒</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">保内拆项敲诈或 10 倍冷媒暴利</text>
  <text x="642" y="692" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">MOD_UPSELL_FREON_GOUGING</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · 电容谎报压缩机/A2L混装</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">$18电容当$2.8k换或缺RDS传感器</text>
  <text x="874" y="692" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">BAD_CAPACITOR_A2L_HOLD</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · 遥测纠偏+批发商直供</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">立省 $41.6k ($478.4k 净付)</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">TELEMETRY_OEM_SHIP_CONFIRM</text>
</svg>

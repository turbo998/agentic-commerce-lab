  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. CAT 双磅单 J1939 油位一致锁 + &lt;=7.7 lb/ft³ AI 密度上限 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">比对空重/毛重过磅时卡车油位差 (&lt;=5 gal)，并将计费净重锁死在行前 AI 视觉扫描</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">立方体积 × 7.0 lbs/cu.ft. 的 110% 上限内，11ms 彻底粉碎过磅加油配重作弊。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 实木打箱带尺照片锁 + 接驳小车门前道路限宽门禁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">申报 $650+ 定制木箱必须上传实木框架封装照；申报 $1,850 接驳车必须提供 26 尺</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">小车车牌抓拍及道路禁行依据，14ms 拦截纸箱充木箱与幽灵倒驳费。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 FMCSA HHG 承运资质与零扣货记录 (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 穿透检索联邦 FMCSA SAFER / L&amp;I 数据库，验明承运商具备合法 HHG Motor</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Carrier 资质与货运险且零 Hostage Load 投诉，严禁皮包中介转包。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动按 AI 标准密度削减虚重并同步冲减 45% 税务补足 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">前置砍掉虚增磅重、假木箱与假接驳车，并自动重算连带缩减的 45% Tax Gross-Up：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $250,000.00 → 自动核减 $37,500.00 (15.0%) → 净付 $212,500.00！</text>


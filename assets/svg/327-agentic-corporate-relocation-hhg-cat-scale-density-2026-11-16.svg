  <!-- Header -->
  <text x="48" y="58" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 325 · AGENTIC CORPORATE EMPLOYEE RELOCATION, HHG MOVING, CAT SCALE &amp; EXPAT TAX GROSS-UP</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">企业员工搬迁与跨国派遣：CAT 双磅单油位锁、AI 体积密度上限 vs 过磅增重与 45% 补税放大</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: agentic_corporate_relocation_hhg_cat_scale_tare_gross_density_mandate_2026 · 15.0% Savings ($37,500 / Batch)</text>

  <!-- Left Panel: Legacy Relocation & HHG Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统企业员工异地搬迁四大黑洞 (Legacy Relocation Leakage: 30%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 空油箱过皮重 + 满油坐人过毛重虚增 4,000 磅 (Weight Bumping Fraud)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">装货前抽空油箱、卸下 150 条棉毯过轻皮重 (Tare)；装完家具后加满 280 加仑柴油</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">(+2,000lb) 并让 5 个壮汉坐车里过毛重 (Gross)，1,200 立方英尺家具虚报出 14,500 磅。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. $35 瓦楞纸电视箱谎报 $850 定制实木箱 + $1,850 幽灵接驳小车费</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">用普通纸箱装电视却按现场木工定制木箱 (Custom Crating) 收费；53 尺大挂车直接</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">停在公寓楼下装货，账单却谎称道路太窄强收 $1,850 26 尺接驳车费 (Shuttle Fee)。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 45%–55% 税务毛化补足 (Tax Gross-Up) 将所有搬家水分再放大 1.5 倍</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">因雇主报销搬家费计入员工应税收入，企业需按公式 Gross-Up = Cost / (1 - TaxRate)</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">替员工补交联邦/州税，导致搬家车队每多讹 $10,000，公司实际多流血 $15,380！</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 无证搬家黑中介 (Moving Broker) 层层转包引发半路坐地起价扣货勒索</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">未核查联邦 FMCSA Household Goods (HHG) 专属承运牌照，订单被倒卖给无保险</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">黑车队，在跨州途中将高管全套家当锁在仓库勒索现金赎金 (Hostage Load)。</text>


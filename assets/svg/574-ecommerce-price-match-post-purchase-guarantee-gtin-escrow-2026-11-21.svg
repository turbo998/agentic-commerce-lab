    <linearGradient id="bg574" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081326" />
      <stop offset="50%" stop-color="#0f2342" />
      <stop offset="100%" stop-color="#06101e" />
    </linearGradient>
    <linearGradient id="accent574" x1="0%" y1="0%" x2="100%" y2="0%">

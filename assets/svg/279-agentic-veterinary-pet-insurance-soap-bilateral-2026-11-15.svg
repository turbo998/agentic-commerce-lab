  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 凡宠物险核保，可治愈偶发病满 365 天无症状必须重置；对侧十字韧带断裂若 X 光 OA=0 属急性外伤，严禁套用双侧连带免责拒赔。</text>

  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 机械检索 SOAP 病历中 2 年前幼犬软便/耳道炎关键词</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 无视已满 12 个月无症状痊愈事实，拒赔胃异物/胰腺炎</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 严重违反 NAIC 宠物险示范法可治愈疾病重置规则</text>


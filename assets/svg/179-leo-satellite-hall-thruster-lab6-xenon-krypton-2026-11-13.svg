  <text x="54" y="584" class="body">• 必须将 5.5N 水氧 (&lt;=0.5ppmv)、磁屏蔽刻蚀 (&lt;=0.2um/h)、呼吸振荡 (&lt;=15%) 与高真空推力绑定为智能托管谓词。</text>

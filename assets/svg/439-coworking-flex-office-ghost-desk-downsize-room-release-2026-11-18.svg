  <rect width="1200" height="675" fill="url(#bg439)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent439)"/>

  <!-- Header -->
  <text x="52" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · ROUND 437 · COWORKING &amp; FLEX-OFFICE BADGE AUDIT, GHOST-DESK DOWNSIZING &amp; ROOM RELEASE AGENT</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">共享办公与企业弹性工位 (WeWork/IWG Regus) 架构：门禁出勤审计、幽灵工位缩容与会议室释放</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">NFC 防一卡多刷与访客 NDA 锁 · 集团赠送积分池优先抵扣 · 刷卡 &lt;=8天/月自动转日票与会议室 15m 释放 · 立省 $55,000 (25.0%)</text>

  <!-- Left Column: Coworking & Flex-Office Pitfalls -->
  <rect x="48" y="132" width="352" height="390" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="162" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统混合办公与共享工位三大浪费</text>

  <rect x="64" y="178" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 月均到岗 3 天却死租 $750/月专属“幽灵工位”</text>
  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 混合办公下 45% 员工每月去办公室不足 4 次，工位长期空置</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 折合每次去办公室成本高达 $200+，远超 $35 按次日票</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 错过提前 60 天退租通知窗口被霸王条款自动续期整年!</text>

  <rect x="64" y="288" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="310" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 周期会议忘取消空关房间 &amp; 赠送积分未抵扣乱收费</text>
  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 项目早改为线上开会，Outlook 周期日历仍每周锁死 16人会议室</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 主合同还有 500 赠送积分未用，员工子账号却被刷走 $150/h 现金</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 会议室明明空无一人，月底却收到数万美元超额账单!</text>

  <rect x="64" y="398" width="320" height="106" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="420" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 一卡多刷混入非授权人员 &amp; 闭店装修照交全租</text>
  <text x="78" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 截屏分享随心通二维码或带未签 NDA 外部人员进入研发套间</text>
  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 共享办公网点因消防/空调停摆闭店数周，财务仍照付全额月租</text>
  <text x="78" y="480" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 传统企业弹性办公空置与超额计费基线：$220,000 / 季度</text>


  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 静态白名单未更新且公益打款密钥 &gt;180 天未轮换</text>
  <text x="78" y="480" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 传统企业 CSR 骗捐与小额通道磨损基线：$150,000 / 季度</text>


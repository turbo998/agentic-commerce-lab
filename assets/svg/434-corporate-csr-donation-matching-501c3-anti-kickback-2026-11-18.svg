  <!-- Header -->
  <text x="52" y="58" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · ROUND 432 · CORPORATE CSR DONATION MATCHING, 501(C)(3) VERIFICATION &amp; ANTI-KICKBACK AGENT</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">企业 CSR 员工配捐与慈善捐赠 (Benevity/Stripe) 架构：防回扣套现、501(c)(3) 核验与对价扣除</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">拦截合谋空壳机构骗取 1:1 配捐返现 · 强制扣除慈善晚宴/义卖公允价值 (FMV) · 凑整捐免二次固定费 · 立省 $33,000.00 (22.0%)</text>

  <!-- Left Column: CSR & Charity Pitfalls -->
  <rect x="48" y="132" width="352" height="390" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="162" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统企业配捐与收银台公益三大漏洞</text>

  <rect x="64" y="178" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 合谋空壳基金会“捐 $5,000 骗公司配捐 $5,000”返现</text>
  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 员工向亲友/同伙控制的空壳慈善机构捐款并上传假收据</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 骗取公司 1:1 配捐后，外部机构扣 10% 将 $9,000 退回私人卡</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 酿成大厂百人被开除丑闻与严重税务欺诈刑事风险!</text>

  <rect x="64" y="288" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="310" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 慈善晚宴不扣餐标全额抵税 &amp; $0.40 捐款被扣 $0.31</text>
  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 花 $500 买含 $180 牛排晚宴的慈善票，违规按 $500 全额配捐</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 收银台 $0.40 凑整捐单独发起第 2 笔刷卡，被扣 $0.31 通道费</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 高达 78% 的消费者爱心小额善款被固定手续费白白吃光!</text>


  <rect width="1200" height="675" fill="url(#bg209)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#sky209)"/>
  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 207 · LODGING &amp; RENTAL AUTH</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体酒店差旅与租车增量预授权 (Incremental Auth) 及押金 0420 秒解冻架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">单根 TID 增量预授权 + ISO 8583 0420 押金秒冲正 + 禁扣战损罚款令牌 (`agentic_hospitality_lodging_incremental_auth_mandate_...`) vs 双倍锁卡 30 天与必输拒付</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red209)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：退房另起新交易锁死双倍额度 30 天 + 强扣刮擦吸烟费秒败诉</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 退房未复用原 TID 而是另刷一笔 Sale 且不发 0420 冲正：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 入住冻结 $1,200，退房另扣 $850，客户卡内 $2,050 额度被死锁长达 30 天；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 续住超支 &gt;15% 未发增量预授权直接强行 Capture，触发 Visa 11.3 无授权拒付。</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 用原预授权延迟扣款 (Delayed Charge) 强扣刮擦费/吸烟罚款：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反 Visa 5.9.4.2 铁律 (严禁在预授权内扣损坏赔偿)，持卡人拒付 100% 秒败诉！</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 未入住 (No-Show) 违规强扣整周 5 晚房费 &amp; 缺失 Folio 降级：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 超出 No-Show 仅限“首晚房费+税”法定上限；缺入住/退房日期触发交换费降级惩罚。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms Double-Lock/No-Inc-Auth) | HTTP 422 (14ms Damage Fine)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#sky209)"/>
  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：单根 TID 增量预授权 + 0420 秒冲正 + 战损罚款剥离网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 单根 TID 生命周期闭环 + ISO 8583 0420 押金 3 秒即刻解冻：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 续住超 +15% 自动追加同 TID 增量预授权；离店复用原 TID 执行 Capture；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 同事务毫秒级发送 0420 部分冲正，客户剩余 $350 押金 3 秒内恢复可用额度！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 账单行项目白名单 (剥离战损/吸烟罚款) + No-Show 首晚封顶：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 14ms 自动剥离刮擦维修与吸烟罚款转独立签约链接，100% 根绝 Visa 12.6 败诉。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 旅宿 Folio 增强免降级：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动补齐 MCC 7011/7512 专有 Folio 字段并免除拒付罚单，单批立省 $39,000.00！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $650k Folio) | HTTP 409 ($39k Downgrade &amp; Dispute Saved)</text>


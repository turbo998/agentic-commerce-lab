  <rect width="1200" height="675" fill="url(#bg369)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent369)"/>

  <!-- Header -->
  <text x="48" y="58" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 367 · INDUSTRIAL &amp; DISTRICT-COOLING PLATE HEAT EXCHANGER (PHE / AHRI 400), ASTM E165 UV &amp; $42 REGASKET</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">工业与区域供冷板式换热器 (PHE) 拆洗、ASTM E165 紫外荧光探伤与 $42 免胶换垫清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Alfa Laval / Kelvion / Tranter / Sondex · 逐张板片暗室紫外针孔图 + 低氯氨基磺酸洗 (&lt;25ppm Cl⁻) + 铭牌 A-Dimension 锁</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="64" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">♨️ 四大板式换热器探伤与组装硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. ASTM E165 紫外荧光探伤 &amp; $42 换垫锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 侧面信号孔滴水 99% 源于 $42 EPDM 橡胶垫老化</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制逐张板片暗室 365nm 紫外荧光穿透针孔定位</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截忽悠换整包 120 张 316L 板片骗 $24,000</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 无氯酸洗 (&lt;25 ppm Cl⁻) 防点蚀红线</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁拿廉价工业盐酸 (HCl) 浸泡 0.5mm 不锈钢板片</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制采用柠檬酸/氨基磺酸 (Cl⁻ &lt; 25 ppm) 循环除垢</text>
  <text x="74" y="368" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断游击队盐酸泡穿好板片后甩锅业主买单</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="426" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 铭牌夹紧尺寸 (A-Dimension ±2mm) 锁</text>
  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 复装必须按铭牌 A-min / A-max 四角对角均匀锁紧</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁不换老垫片强行过拧螺杆压塌板片波纹密封槽</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 保障 316L 与钛合金板片组 20 年机械寿命</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="540" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. Web IQ 原厂胶条硫化批号 &amp; 3-A 核查</text>
  <text x="74" y="560" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• /v3/browse 核验 Alfa Laval/Kelvion 胶条 Cure Date</text>
  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截库存超 3 年硬化胶条或 1.25x 水压泄压</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 满足 AHRI 400 与 FDA / 3-A 食品医药卫生合规</text>


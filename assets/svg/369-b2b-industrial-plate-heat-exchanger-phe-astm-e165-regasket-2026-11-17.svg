  <text x="886" y="379" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ: 230ms 直连 Alfa Laval</text>
  <text x="886" y="399" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  胶条批号库与 AHRI 400 / 3-A 认证</text>
  <text x="886" y="421" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Bright Data: 缺乏 ASTM E165 紫外</text>
  <text x="886" y="441" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">  探伤与 A-Dimension 螺距确定性模型</text>
  <text x="886" y="461" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exa: 无法做 DIN 7716 胶龄强校验</text>

  <rect x="872" y="489" width="268" height="121" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="886" y="511" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛠️ 生产核验清单 (Checklist)</text>
  <text x="886" y="533" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ 逐张板片 ASTM E165 紫外荧光图</text>
  <text x="886" y="553" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ 酸洗 Cl⁻ &lt;25ppm &amp; 铭牌 A-Dimension</text>
  <text x="886" y="573" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ 原厂 EPDM 硫化批号 &amp; 1.25x 水压</text>
  <text x="886" y="593" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">☑ 零虚构坐标 · CSP 自包含沙盒通过</text>

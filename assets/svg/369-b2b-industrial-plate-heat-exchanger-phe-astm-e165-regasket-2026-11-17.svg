  <text x="446" y="414" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截用含氯盐酸泡穿 316L 板片或过拧螺杆压塌 A-Dimension → $0.00</text>


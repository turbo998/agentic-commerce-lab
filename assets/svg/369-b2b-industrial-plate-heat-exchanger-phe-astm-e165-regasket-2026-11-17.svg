  <text x="446" y="306" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">PLATE_PACK_REPLACEMENT_UPCODING_ON_42_DOLLAR_ELASTOMER_GASKET_BLOCKED</text>

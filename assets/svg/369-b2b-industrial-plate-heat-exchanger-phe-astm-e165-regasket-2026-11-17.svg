  <text x="446" y="502" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web IQ 挂起超期假冒橡胶垫片或 1.25x MAWP 水压未通过 → $0.00</text>


    <text x="58" y="224" fill="#CBD5E1">• 加权平均挥发分虽湊到 23%，但煤岩反射率呈双峰断档</text>
    <text x="58" y="242" fill="#CBD5E1">• 炼出焦炭 CSR 跌至 48% (&lt;65%)，收走 $340,000 货款</text>


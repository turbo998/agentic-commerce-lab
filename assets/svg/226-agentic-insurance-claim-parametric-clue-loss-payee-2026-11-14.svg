  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. C2PA 硬件芯片签名直拍 + LiDAR 景深 + 车载 EDR 碰撞波形互验：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 禁用相册上传：11ms 校验 C2PA 签名链与车载 EDR 碰撞减速度 (Δv)，粉碎 AI 假图；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 直连 ISO ClaimSearch / CLUE 锁死 (17位 VIN + 出险时间窗)，根绝一车多赔！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 穿透 DMV ELT 电子车贷库：按揭银行 (Loss Payee) 优先受偿分账：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 全损赔款自动拆分为“直付银行结清贷款余额 + 净余值打给车主”，零银行二次追索。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms OFAC 终审与防骗保增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 拦截 AI 合成骗保并启用 DRP 认证维修厂协议价直付，单批立省 $51,200.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>

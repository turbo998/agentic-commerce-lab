  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 224 · INSURTECH CLAIMS</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体保险极速理赔 C2PA 防 AI 假图、ISO 跨司去重与 Loss Payee 分账架构</text>

  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red226)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：相册传 AI 合成战损图骗保 + 一车三赔 + 漏付按揭银行遭二次追索</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 生成式 AI 局部重绘伪造车损/货损图 + 跨保司“一损多赔”：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 黑产用 Diffusion 给完好车辆 P 上凹痕与玻璃碎裂上传相册，秒骗 $8,500 理赔款；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 同一车架号 (VIN) 同时向 3 家保司报案，孤岛系统未查 ISO 库导致重复赔付 300%！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 忽略保单按揭银行留置权人 (Loss Payee) 将全损款直打车主个人卡：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 车主拿走 $45k 全损现金后断供车贷，按揭银行依法起诉保司强制再赔 $32k 贷款本息。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 理赔极速打款前跳过 OFAC 制裁名单与法定急救医院留置权核查：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反美国财政部 OFAC 反洗钱规定或漏扣医院留置权 (Hospital Lien) 面临联邦重罚。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

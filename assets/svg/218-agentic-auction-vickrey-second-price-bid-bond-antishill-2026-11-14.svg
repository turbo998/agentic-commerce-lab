  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#violet218)"/>
  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 216 · VICKREY &amp; BID-BOND</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体实时竞价与拍卖 (Vickrey 次价清算、Bid-Bond 与 Soft-Close) 架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">10% 竞买保证金预授权 + 维克里次价代理 (付第2名+Δ) + Soft-Close 令牌 (`agentic_auction_vickrey_bid_bond_antishill_mandate_...`) vs 双号弃标与秒杀偷塔</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red218)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：空卡天价护盘弃标 (Bid Shielding) + 2ms 外挂偷塔 + 卖家托儿</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 双号高低配护盘弃标 (Bid Shielding)：小号 $1,000 捡漏 $3,500 资产：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 黑产用空卡大号喊出 $50,000 吓退全部正常买家，结标后大号违约弃标；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 无保证金惩罚使排第 2 名的自家小号以 $1,000 白菜价合法捡漏！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 硬截止时间诱发“最后 2 毫秒机房外挂偷塔”与 10k RPS 改价风暴：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 一价拍卖逼迫 Agent 每毫秒轮询加价 $0.01 打崩网关，最终被机房抢拍器绝杀。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 卖家派关联小号当“托儿 (Shill Bidding)”榨干买方代理上限：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 偷看买方 $20k 代理底牌并派托儿顶到 $19.9k，触犯 UCC § 2-328 与电信欺诈罪！</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms Unbonded Shielding) | HTTP 422 (14ms Seller Shill)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#violet218)"/>
  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：10% Bid-Bond 预授权 + 维克里次价代理 + Soft-Close 网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 出价前置锁死 10% Bid-Bond 银行卡预授权 + 弃标即刻罚没：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 喊 $50k 必须先冻结 $5k 真实额度，违约立即实扣罚没，100% 粉碎双号护盘；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 落选者结标瞬间通过 ISO 8583 0420 3 秒全额解冻保证金。</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. TEE 密封维克里次价清算 + Soft-Close (+120s) + 反托儿图谱：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 赢家仅付“独立第2高价 + Δ”；倒计时 120s 内有新出价自动顺延 120s 废掉外挂。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms UCC 合规与次价结余：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 消除买方过度溢价 (Winner's Curse) 与违约坏账，单批立省 $50,400.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $630k Auction) | HTTP 409 ($50.4k Vickrey Surplus Saved)</text>


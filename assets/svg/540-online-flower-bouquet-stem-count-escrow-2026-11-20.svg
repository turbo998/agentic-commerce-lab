  <!-- Header -->
  <text x="56" y="68" fill="#f472b6" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUND 97 · SVG 540 · ONLINE FLOWER, HOLIDAY BOUQUET &amp; STEM-COUNT VISION ESCROW</text>
  <text x="56" y="100" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Floral &amp; Bouquet Agent: Bench-Photo Stem Count, Direct-Studio Routing &amp; Pet-Safe Gate</text>

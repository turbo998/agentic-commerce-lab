  <text x="440" y="296" class="body">钒 V &lt;=180ppm &amp; 钠 Na &lt;=120ppm &amp; Fe &lt;=350ppm</text>
  <text x="440" y="314" class="body">&amp; 比电阻 ER &lt;=55 uOhm·m — 催化超标直返 HTTP 422</text>

  <rect x="428" y="334" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="354" class="mono">Gate 3: Web IQ ASI &amp; REACH Low-PAH Pitch (290ms)</text>
  <text x="440" y="372" class="body">核验 ASI 绩效证书与低苯并[a]芘煤沥青合规</text>
  <text x="440" y="390" class="body">高毒焦油掺假或环保关停厂直返 HTTP 451</text>

  <rect x="428" y="410" width="348" height="68" rx="8" fill="#1e293b" stroke="#f59e0b"/>

  <rect x="36" y="512" width="1128" height="92" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="538" class="card-h" fill="#38bdf8">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• 电解铝预焙炭阳极严禁“按吨过磅盲付”：粘结剂优先气化会导致掉炭渣引发极距发烧，而微量钒 (V) 和残留冰晶石钠 (Na) 会催化 10 倍速烧穿阳极颈部。</text>
  <text x="54" y="584" class="body">• 必须将 ISO 12988/12989 双反应性残余率 (&gt;=88% / &gt;=75%)、ISO 12980 XRF 钒钠门禁 (&lt;=180 / &lt;=120ppm) 与 Web IQ 洁净残极闭环回配绑定为托管令牌谓词。</text>

  <text x="36" y="60" class="title">Round 143 · 电解铝预焙炭阳极与煅后焦交割、CO2/空气反应残余率与钒钠催化门禁架构图</text>
  <text x="36" y="84" class="sub">Aluminum Smelter Prebaked Carbon Anode Offtake, ISO 12988/12989 Reactivity (&gt;=88% / &gt;=75%), XRF V/Na Gate &amp; Butt Loop vs. Pot Dusting</text>

  <!-- Left Card: Failure Mode -->
  <rect x="36" y="104" width="355" height="390" rx="12" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="52" y="120" width="160" height="24" rx="12" fill="#fca5a5"/>
  <text x="64" y="136" class="pill-err">⛔ 传统按炭块吨重盲付</text>
  <text x="52" y="166" class="card-h">三大高危物理与电化学漏洞</text>

  <text x="52" y="196" class="body" fill="#fca5a5" font-weight="700">1. 选择性氧化掏空粘结剂引发“掉炭渣”</text>
  <text x="52" y="216" class="body">焙烧不足使沥青焦活性远高于骨料焦，960°C</text>
  <text x="52" y="234" class="body">CO2 优先烧断粘结桥，焦粒脱落浮在极距间</text>
  <text x="52" y="252" class="body">引发局部短路发烧 (985°C)，吨铝多耗电 450kWh。</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. 高钒海绵焦与带壳残极钠 10 倍催化烧蚀</text>
  <text x="52" y="302" class="body">V&gt;180ppm 剧烈催化 550°C 空气氧化烧穿阳极颈部</text>
  <text x="52" y="320" class="body">掉块；残极未抛丸除冰晶石 (Na&gt;120ppm) 加速崩解。</text>

  <text x="52" y="350" class="body" fill="#fca5a5" font-weight="700">3. 铁硅磷溶入铝液降级与残极价值流失</text>
  <text x="52" y="370" class="body">Fe&gt;350ppm / P&gt;10ppm 污染 Al99.85 电工圆铝杆</text>
  <text x="52" y="388" class="body">且毒化电流效率；22% 洁净残极被按废炭贱卖。</text>

  <rect x="52" y="418" width="323" height="58" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="64" y="440" class="mono" fill="#f87171">Legacy: 2,000 MT Anode Gross Weight Paid</text>
  <text x="64" y="460" class="mono" fill="#fca5a5">Result: $950,000 exposed to pot fever &amp; stub burn</text>


  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 掺杂廉价白云石/红粘土拉低有效 K2O/P2O5</text>

  <!-- Header -->
  <text x="52" y="62" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-15 · ROUND 283 · AGENTIC SENIOR LIVING CCRC ENTRANCE-FEE ESCROW, ADL ACUITY &amp; CMS PDPM</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">智能体高端康养社区 (CCRC) 与护理院：120天退押金托管锁、Katz ADL 与 CMS PDPM 清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">独立银行信托托管 + 腾退 &lt;=120天无条件退还 80% 入门费防“油转租”赖账 · Katz ADL + PBJ 护工工时锁防乱涨价 · Web IQ 核验精算准备金</text>


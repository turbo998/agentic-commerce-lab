  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 护理院 MDS 3.0 PDPM 虚高升档与全包区重复收费</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 批量勾选吞咽障碍 (SLP) 与重度抑郁套取 $820/天高档医保</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 已付 $9,200/月全包失智专区费，仍叠加夜间巡房附加费</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 迅速掏空长者联邦医保免责天数与长护险终身保额</text>


  <text x="68" y="582" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. CCRC 可退还入门费必须存入独立受托银行专户，强制约定腾退满 120 天或房间改为月租模式时无条件自动退还 80%/90% 本金。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 协助生活区照护费升档必须同时满足 RN 签署的 Katz 6项核心 ADL 退化证明与 CMS PBJ 护工直接照护工时 (HPRD) 增长。</text>

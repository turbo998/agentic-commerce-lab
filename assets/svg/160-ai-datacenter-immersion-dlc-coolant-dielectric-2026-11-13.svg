<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg160" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent160" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 23px; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-h { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 12px; fill: #fde68a; }
      .pill-ok { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #052e16; }
      .pill-err { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #450a0a; }
      .pill-warn { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #451a03; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg160)" rx="16"/>
  <rect x="28" y="22" width="1144" height="6" fill="url(#accent160)" rx="3"/>

  <text x="36" y="60" class="title">Round 158 · AI 智算中心浸没氟化液与微通道冷板 (DLC)、介电击穿与防氢氟酸架构图</text>
  <text x="36" y="84" class="sub">AI Datacenter Immersion Dielectric Fluid &amp; DLC Cold-Plate Offtake, Breakdown (&gt;=40 kV), TAN (&lt;=0.01) &amp; Microchannel Rth (&lt;=0.035 K/W)</text>

  <!-- Left Card: Failure Mode -->
  <rect x="36" y="104" width="355" height="390" rx="12" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="52" y="120" width="160" height="24" rx="12" fill="#fca5a5"/>
  <text x="64" y="136" class="pill-err">⛔ 传统按吨数与沸点盲付</text>
  <text x="52" y="166" class="card-h">三大万卡机柜高压拉弧、HF 蚀穿与微通道堵死灾难</text>

  <text x="52" y="196" class="body" fill="#fca5a5" font-weight="700">1. 水分 (&gt;25ppm) 水解出剧毒氢氟酸致 18kV 拉弧</text>
  <text x="52" y="216" class="body">氟化液混入 85ppm 水分在 GPU 热点催化下脱氟生成</text>
  <text x="52" y="234" class="body">HF (TAN=0.14)，腐蚀光模块透镜并使击穿电压暴跌</text>
  <text x="52" y="252" class="body">至 18kV，引发 48V/800V 服务器母排拉弧爆燃！</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. 100um 铲齿铜冷板被氧化铜与生物膜堵死</text>
  <text x="52" y="302" class="body">DLC 冷却液 BTA 缓蚀耗尽，微米铜锈与细菌粘泥</text>
  <text x="52" y="320" class="body">架桥堵死 100um 微槽，热阻飙至 0.082 K/W 降频。</text>

  <text x="52" y="350" class="body" fill="#fca5a5" font-weight="700">3. 溶出管路增塑剂结焦与微湿氟化液天价报废</text>
  <text x="52" y="370" class="body">氟化液萃取 EPDM 软管增塑剂在芯片表面结成绝缘</text>
  <text x="52" y="388" class="body">黑垢；吸湿旧液未做 4A 分子筛再生直接危废报废。</text>

  <rect x="52" y="418" width="323" height="58" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="64" y="440" class="mono" fill="#f87171">Legacy: 20t Clear Fluid + Nominal Boiling Point</text>
  <text x="64" y="460" class="mono" fill="#fca5a5">Result: $550,000 exposed to busbar arc &amp; fouling</text>

  <!-- Center Card: Mandate Pipeline -->
  <rect x="412" y="104" width="380" height="390" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="428" y="120" width="248" height="24" rx="12" fill="#6ee7b7"/>
  <text x="440" y="136" class="pill-ok">🛡️ ai_datacenter_coolant_mandate</text>
  <text x="428" y="166" class="card-h">四层介电击穿、游离氢氟酸与微通道门禁（10ms–280ms）</text>

  <rect x="428" y="182" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="202" class="mono">Gate 1: IEC 60156 kV, H2O &amp; HF TAN (11ms)</text>
  <text x="440" y="220" class="body">击穿电压 &gt;=40 kV/2.5mm, 卡尔费休水分 &lt;=25 ppm</text>
  <text x="440" y="238" class="body">&amp; TAN &lt;=0.01 mg KOH/g — 变酸降绝缘直返 HTTP 403</text>

  <rect x="428" y="258" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="278" class="mono">Gate 2: 100um Cold-Plate Rth &amp; ΔP (14ms)</text>
  <text x="440" y="296" class="body">微通道冷板热阻 Rth &lt;=0.035 K/W, 压降 &lt;=65 kPa</text>
  <text x="440" y="314" class="body">&amp; 异养菌 &lt;10 CFU/mL — 微槽堵塞直返 HTTP 422</text>

  <rect x="428" y="334" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="354" class="mono">Gate 3: Web IQ OCP List &amp; Low-GWP (280ms)</text>
  <text x="440" y="372" class="body">核验 OCP 管路零增塑剂溶出 GC-MS 报告与欧盟</text>
  <text x="440" y="390" class="body">F-Gas GWP100 &lt;=100 合规 — 溶出结焦直返 HTTP 451</text>

  <rect x="428" y="410" width="348" height="68" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="430" class="mono" fill="#fcd34d">Gate 4: 4A Zeolite &amp; CDU District Heat (245ms)</text>
  <text x="440" y="448" class="body">4A 分子筛+活性氧化铝在线脱水除酸再生 (92% 回用)</text>
  <text x="440" y="466" class="body">+ CDU 60°C 回水余热供暖冲抵立省 $77,000 触发 HTTP 409</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="812" y="104" width="352" height="390" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="828" y="120" width="184" height="24" rx="12" fill="#fde68a"/>
  <text x="840" y="136" class="pill-warn">📊 5-Lane 实测矩阵与 Web IQ</text>
  <text x="828" y="166" class="card-h">零虚构坐标定量实测（Provenance: measured）</text>

  <text x="828" y="194" class="mono" fill="#4ade80">✅ HTTP 200 (10ms) · 高绝缘无酸与超低热阻放行</text>
  <text x="828" y="212" class="body">52kV + 水分 9ppm + Rth 0.026 K/W → $550,000</text>

  <text x="828" y="240" class="mono" fill="#f87171">⛔ HTTP 403 (11ms) · 水解氢氟酸或击穿电压跌落</text>
  <text x="828" y="258" class="body">18kV 击穿或 TAN=0.14 酸蚀 → 冻结 $550,000.00</text>

  <text x="828" y="286" class="mono" fill="#fb923c">⛔ HTTP 422 (14ms) · 100um 微通道生物膜/铜锈堵</text>
  <text x="828" y="304" class="body">Rth=0.082 K/W 或 ΔP=140kPa → 拒付 $550,000</text>

  <text x="828" y="332" class="mono" fill="#c084fc">⛔ HTTP 451 (280ms) · Web IQ 溶出增塑剂或高 GWP</text>
  <text x="828" y="350" class="body">EPDM 邻苯二甲酸酯溶出 → 熔断 $550,000.00</text>

  <text x="828" y="378" class="mono" fill="#facc15">🟡 HTTP 409 (245ms) · 分子筛在线再生与余热冲抵</text>
  <text x="828" y="396" class="body">节省 $77,000 (-14%) → 确认后净付 $473,000.00</text>

  <rect x="828" y="416" width="320" height="62" rx="8" fill="#1e293b"/>
  <text x="840" y="438" class="body" font-weight="700" fill="#38bdf8">Web IQ (/v3/browse) vs Exa / Bright Data</text>
  <text x="840" y="458" class="body">准确率 100% · P50 245ms · 抗注入 100% · 拓扑保密</text>

  <!-- Footer -->
  <rect x="36" y="512" width="1128" height="92" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="538" class="card-h" fill="#0ea5e9">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• AI 智算中心液冷严禁“按吨重盲付”：微量水分与不饱和氟烯烃在热点会水解出剧毒 HF 拉弧炸柜，而缓蚀耗尽会堵死 100um 微通道。</text>
  <text x="54" y="584" class="body">• 必须将击穿电压 (&gt;=40kV)、水分 (&lt;=25ppm)、TAN (&lt;=0.01)、冷板热阻 (&lt;=0.035 K/W) 与分子筛再生绑定为智能托管解锁谓词。</text>
</svg>

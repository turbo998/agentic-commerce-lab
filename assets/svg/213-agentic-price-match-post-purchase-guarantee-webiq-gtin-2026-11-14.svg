  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：视觉大模型轻信 F12 篡改截图秒退现金 + 优惠券双倍叠加失血</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 黑产按 F12 修改浏览器 DOM 价格截张图骗走 $801 差价：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 在竞品网页按 F12 把 $1,200 电视改成 $399 截图，零 PS 痕迹 100% 骗过视觉 LLM；</text>

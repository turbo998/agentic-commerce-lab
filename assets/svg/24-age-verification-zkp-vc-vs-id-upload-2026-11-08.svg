  <text x="56" y="168" fill="#FCA5A5" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">❌ 传统高危反模式：Agent 自填出生日期绕过 &amp; 对话框上传身份证/处方原件</text>

  <rect x="52" y="186" width="546" height="98" rx="10" fill="#1F2937" stroke="#F87171" stroke-width="1.2"/>
  <text x="68" y="212" fill="#FECACA" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">1. 自填出生日期 / 勾选“我已满 21 岁”伪造穿透 (Self-Attested DOB Bypass · HTTP 403)</text>
  <text x="68" y="236" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 目标导向的 AI Agent 为完成“买两瓶威士忌”指令，自动在 API 中填入 birth_date="1990-01-01"。</text>
  <text x="68" y="258" fill="#FCA5A5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">• 网关防护：14ms 硬阻断无加密签名的自填资格声明 (HTTP 403 BLOCKED_UNVERIFIED_SELF_ATTESTED)！</text>

  <rect x="52" y="298" width="546" height="104" rx="10" fill="#1F2937" stroke="#F87171" stroke-width="1.2"/>
  <text x="68" y="324" fill="#FECACA" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">2. 身份证/驾照/处方单原件发入 LLM 上下文 (Raw Govt ID / Rx Upload · HTTP 422)</text>
  <text x="68" y="348" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 高清人脸、公民身份号码与医疗病历一旦进入多模态 Prompt，立即触发 GDPR Art.9 / HIPAA 重度违规。</text>
  <text x="68" y="370" fill="#FCA5A5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">• 网关防护：15ms 前置阻断明文证件照片与身份证号入参 (HTTP 422 · 0 bytes 敏感数据落盘)！</text>

  <rect x="52" y="416" width="546" height="90" rx="10" fill="#1F2937" stroke="#F87171" stroke-width="1.2"/>
  <text x="68" y="442" fill="#FECACA" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">3. 截取他人成年凭证跨单重放 / 借壳代购 (Stale or Borrowed Proof Replay · HTTP 401)</text>
  <text x="68" y="466" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 未绑定当前订单随机数 order_nonce (180s TTL) 或主体 DID 不匹配的凭证，16ms 触发 HTTP 401 阻断！</text>
  <text x="68" y="488" fill="#FCA5A5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">• 杜绝未成年人复制粘贴旧证明或借用他人钱包签名买酒买药！</text>

  <!-- Right Column: Production Architecture -->

  <text x="56" y="88" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="21" font-weight="800">受监管商品（21+ 酒类/处方药/B2B 专营）零知识资格核验：W3C ZKP 谓词凭证 (zkp_vc_live_...) vs 自填生日伪造与身份证原件泄露</text>
  <text x="56" y="108" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: deterministic_offline_simulation · Web IQ /v3/browse ($12/1k official_doc_snapshot, as of 2026-11-08) · order_nonce TTL = 180s (synthetic_policy)</text>


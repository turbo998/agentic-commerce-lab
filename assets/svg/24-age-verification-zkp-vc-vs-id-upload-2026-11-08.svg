  <rect x="662" y="186" width="566" height="98" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.2"/>
  <text x="678" y="212" fill="#6EE7B7" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">1. 本地硬件钱包零知识布尔断言 (zkp_vc_live_... · 0 字节生日/身份证号暴露)</text>
  <text x="678" y="236" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 权威机构 (DMV mDL / 电子处方网) 预签发凭证；按单绑定 order_nonce 仅输出 age_over_21=true。</text>
  <text x="678" y="258" fill="#A7F3D0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">• 实测 260ms 完成椭圆曲线公钥验签与授权扣款，Agent 与商户全程零 PII 接触！</text>

  <rect x="662" y="298" width="566" height="104" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.2"/>
  <text x="678" y="324" fill="#6EE7B7" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">2. Microsoft Web IQ /v3/browse 属地禁售法规实时接地 (315ms · HTTP 451)</text>
  <text x="678" y="348" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 即便买家年满 21 岁，Web IQ 也会根据 ship_tok_... 的目标州/邮编前缀实时核验属地直邮禁令。</text>
  <text x="678" y="370" fill="#FDE68A" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">• 检出禁酒县 (Dry County) 或跨州管制药品禁寄区时，315ms 返回 HTTP 451 阻断扣款！</text>

  <rect x="662" y="416" width="566" height="90" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.2"/>
  <text x="678" y="442" fill="#6EE7B7" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">3. 末端履约面单强制绑定成人当面签收 (adult_signature_21_plus = true)</text>
  <text x="678" y="466" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 订单放行后自动在盲化物流令牌上锁死“必须年满 21 岁成人持证当面签收”，严禁快递放门口。</text>
  <text x="678" y="488" fill="#A7F3D0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">• 线上 ZKP 验签哈希 + 线下签收回执双重归档，构筑 100% 监管审计免责闭环！</text>


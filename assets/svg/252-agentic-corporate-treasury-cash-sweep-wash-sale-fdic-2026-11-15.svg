  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 未通过 IntraFi ICS 跨行网络拆单或转入国债货币基金，95% 运营资金处于无存款保险裸奔状态。</text>

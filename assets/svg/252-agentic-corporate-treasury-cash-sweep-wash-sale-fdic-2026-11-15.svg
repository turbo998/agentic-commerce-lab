  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 司库 AI 未对齐 ERP 未来 7 日发薪日历与刚性税款，将全部活期扫入 T+2 交收债券或定期存单。</text>

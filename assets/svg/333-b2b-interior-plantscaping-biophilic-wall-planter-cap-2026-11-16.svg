  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统室内绿植租摆与美陈四大黑洞 (Legacy Plantscaping Leakage: 35%–60%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 养护工 3 周不来浇水旱死绿植，却甩锅“员工倒咖啡/关空调”收 $240 换苗费</text>

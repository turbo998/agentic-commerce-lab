  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 存量枯黄绿植 $0 免费换新锁 + 花盆 NFC 按周浇水签到 (11ms → HTTP 403)</text>

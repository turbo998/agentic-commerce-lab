  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">在月度台账里被按鲜活热带植物照收 $18/盆/月的园艺浇水、施肥与修剪费。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 密闭办公区喷洒非 EPA 室内许可高毒农药或中庭植物墙滴灌爆管泡大堂</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">使用高挥发有机磷农药除虫引发员工过敏投诉，或跨层活体植物墙缺失电磁防漏切断阀</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">导致夜间滴灌漏水泡烂大堂石膏吊顶与实木地板。</text>


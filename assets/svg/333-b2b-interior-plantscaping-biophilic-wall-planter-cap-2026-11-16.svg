  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">正常日志，11ms 硬拦截任何向企业转嫁的枯死植物换苗费与漏检周次养护费。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 装饰花盆满 12 个月租金归零锁 + 仿真花/永生苔藓零浇水费 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">将装饰套盆硬件与活体养护解耦，满 12 个月花盆硬件租金强制归零 ($0)；14ms 自动</text>

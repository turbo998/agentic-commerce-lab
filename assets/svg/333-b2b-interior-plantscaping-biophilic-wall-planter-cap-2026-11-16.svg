  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">植物枯死后却开具“人为环境损毁单”，向企业二次收取 $180–$320/盆换新费。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 进价 $55 的玻璃钢装饰空花盆按 $24/月连租 60 个月花 $1,440 (买价 26 倍)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">将永远不会死的外套装饰盆 (Decorative Container) 与里面的活体植物捆绑永续收租，</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">5 年下来光 300 个塑料/玻璃钢空花盆就让企业多付了 $300,000+ 硬件冤枉钱。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 暗室塑料仿真花与永生驯鹿苔藓墙被混按鲜活绿植照收每周浇水养护费</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg595" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#102344" />
      <stop offset="100%" stop-color="#06101e" />
    </linearGradient>
    <linearGradient id="accent595" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21.5px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .mono { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #6ee7b7; }
      .warn { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #fca5a5; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg595)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent595)" rx="3" />

  <text x="40" y="58" class="title">电商预售定金膨胀 (Pre-Order Deposit)、尾款锁价与 FTC 延期合规托管架构 (Purple Dot / Shopify)</text>
  <text x="40" y="80" class="subtitle">Round 152 · 防付完定金后尾款期吊牌价暗涨、防预售延期违反 FTC 30天规则 &amp; 弃付尾款自动候补净省 36% (SVG 595)</text>

  <!-- Left Card: 3 Pre-Order & Deposit Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大预售定金与延期发货黑洞</text>
  <text x="56" y="164" class="card-title">1. “付完定金，尾款期吊牌价暗涨”刺客 (HTTP 403)</text>
  <text x="56" y="184" class="body">• 宣传“交 $50 定金抵 $100 (预计总价 $400，尾款仅需 $300)”</text>
  <text x="56" y="202" class="body">• 等买家交完不可退定金，商家在付尾款前夜把商品原价调高到 $480</text>
  <text x="56" y="220" class="warn">• 比现货直接买还贵，不付尾款又威胁没收 $50 定金!</text>

  <text x="56" y="256" class="card-title">2. 尾款自动代扣失败或合并凑单退定金难 (HTTP 422)</text>
  <text x="56" y="276" class="body">• 定金与尾款相隔 25 天，原 7 天信用卡预授权早已过期失效</text>
  <text x="56" y="294" class="body">• 尾款日凌晨静默扣款撞上银行风控拒付，未给 48h 换卡宽限期就</text>
  <text x="56" y="312" class="warn">  直接取消订单吞掉定金；或退货时只退尾款漏退首笔定金单!</text>

  <text x="56" y="348" class="card-title">3. 违反美国 FTC 邮购规则 (16 CFR 435) 重罚 (HTTP 451)</text>
  <text x="56" y="368" class="body">• 工厂排产延期超承诺发货日 (或无日期超 30 天)，商家只发封邮件</text>
  <text x="56" y="386" class="body">  通知“推迟下月发”，未获取买家显式 Opt-In 同意继续等待</text>
  <text x="56" y="404" class="warn">• 直接违反 FTC 铁律：未获二次同意必须全额原路退款，违者重罚!</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: POST_DEPOSIT_BASE_PRICE_HIKE_OR_FORFEIT</text>
  <text x="70" y="502" class="warn">• HTTP 422: ORPHAN_DEPOSIT_REFUND_OR_SPT_EXPIRED</text>
  <text x="70" y="524" class="warn">• HTTP 451: FTC_MAIL_ORDER_RULE_DELAY_NO_OPTIN</text>
  <text x="70" y="546" class="mono">• HTTP 409:C2M_MOQ_BATCHING_AND_WAITLIST_ROLL_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: HASH_LOCKED_DEPOSIT_AND_BALANCE_200</text>
  <text x="70" y="596" class="body">铁律: 交定金瞬间必须用 SHA-256 焊死尾款最高应付净额!</text>

  <!-- Center Card: 4-Stage Pre-Order & Deposit Escrow Architecture -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶预售定金锁价与 FTC 延期托管架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#ef4444" />
  <text x="450" y="175" class="card-title" fill="#fca5a5">Gate 1: 定金快照哈希锁死尾款上限与免罚退定 (HTTP 403)</text>
  <text x="450" y="195" class="body">• 支付定金瞬间生成不可篡改契约: `Locked_Balance_Max = $300.00`</text>
  <text x="450" y="213" class="body">• 尾款期若大盘降价则自动退差保价；若商家企图暗涨尾款或霸王吞定金:</text>
  <text x="450" y="231" class="mono">• 立即拦截涨价并支持“尾款期开启后一键合单全退”-&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="282" class="card-title" fill="#38bdf8">Gate 2: 180 天长效尾款令牌与双单原子同退锁 (HTTP 422)</text>
  <text x="450" y="302" class="body">• 采用 Stripe SPT / Shopify Vaulting 签发绑定 `max_balance` 的长效</text>
  <text x="450" y="320" class="body">  CIT-&gt;MIT 授权，扣尾款前 72h 发送提醒并留 48h 换卡宽限窗口</text>
  <text x="450" y="338" class="body">• 售后退货时将 `Deposit_Tx_ID + Balance_Tx_ID` 绑为原子双退事务</text>
  <text x="450" y="354" class="mono">• 企图只退尾款漏退定金或无宽限期秒杀定金单 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: 美国 FTC 16 CFR §435 延期二次同意锁 (HTTP 451)</text>
  <text x="450" y="419" class="body">• 严格对标 FTC Mail, Internet, or Telephone Order Merchandise Rule:</text>
  <text x="450" y="437" class="body">• 一旦预计发货日延误，自动提前 7 天发送含“[同意新交期] / [全额秒退]”</text>
  <text x="450" y="455" class="mono">  双按钮通知；原交期届满未收到买家显式 Opt-In 必自动全退 -&gt; HTTP 451</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#10b981" />
  <text x="450" y="508" class="card-title" fill="#6ee7b7">Gate 4: C2M 真实定金排产与弃单候补顺延 (HTTP 409)</text>
  <text x="450" y="528" class="body">• 用“付 $20 可退定金”替代“虚假免密 0 元预约”，精准过滤 85% 水分</text>
  <text x="450" y="546" class="body">  向工厂下达零库存积压的 C2M 柔性生产单 (MOQ 精准命中)</text>
  <text x="450" y="566" class="mono">• 尾款期若有 8% 买家弃付退款，库存毫秒级顺延给 Waitlist 候补全款客</text>
  <text x="450" y="586" class="mono">• 消灭盲目备货尾货清仓 + 零 FTC 罚单 -&gt; 净省 36% 预售履约成本</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大电商预售与定金膨胀技术栈</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Purple Dot / Shopify Pre-Order APIs</text>
  <text x="846" y="182" class="body">• 优势: 专为时尚与潮玩预售设计，原生内置美国 FTC 延期自动征求同意流</text>
  <text x="846" y="198" class="body">• 特性: 支持现货与预售商品自动拆单发货 (Split Fulfillment)</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. 天猫/京东“定金膨胀 + 尾款合并凑单”引擎</text>
  <text x="846" y="244" class="body">• 优势: 预售开启瞬间锁定预售基准价，严禁商家在尾款期调高吊牌价</text>
  <text x="846" y="260" class="body">• 特性: 尾款支持叠加跨店每满 300 减 50，且退货时定金+尾款原子同退</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. Stripe PaymentIntents (`setup_future_usage`)</text>
  <text x="846" y="306" class="body">• 优势: 首笔收 20% 定金同时完成 3DS2 强核身并保存 off-session 令牌</text>
  <text x="846" y="322" class="body">• 特性: 30 天后工厂出货扫描瞬间自动发起尾款 MIT 扣款，0 授权过期</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. BackerKit / Kickstarter 众筹阶梯锁</text>
  <text x="846" y="368" class="body">• 优势: 达不到最低开模起订量 (MOQ) 自动 $0 手续费全额释放预授权</text>
  <text x="846" y="384" class="body">• 特性: 彻底消除新品首发“做多了卖不掉、做少了不够卖”的死局</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度新品盲目备货清仓与预售违约池 ($125,000)</text>
  <text x="860" y="456" class="body">• 传统盲目备货折价清仓+尾款掉单+FTC罚金: $125,000/季</text>
  <text x="860" y="476" class="mono">• C2M 真实定金排产砍掉 60% 滞销尾货清仓亏损: -$22,500</text>
  <text x="860" y="496" class="mono">• 48h 换卡宽限与弃付尾款自动顺延候补客: -$13,750</text>
  <text x="860" y="516" class="mono">• 定金快照锁价与 FTC §435 自动征求同意零罚单: -$8,750</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净预售成本: $80,000 (净省 $45,000 / -36%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: preorder_deposit_escrow_optim_409</text>
</svg>

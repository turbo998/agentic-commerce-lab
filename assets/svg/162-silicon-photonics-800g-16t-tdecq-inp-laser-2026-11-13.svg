  <text x="828" y="350" class="body">刷写假 OUI 或 A0 版 DSP → 熔断 $640,000.00</text>

  <text x="828" y="378" class="mono" fill="#facc15">🟡 HTTP 409 (245ms) · LPO 线性直驱与旧模块回收</text>
  <text x="828" y="396" class="body">节省 $89,600 (-14%) → 确认后净付 $550,400.00</text>

  <rect x="828" y="416" width="320" height="62" rx="8" fill="#1e293b"/>

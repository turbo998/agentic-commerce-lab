  <!-- Footer -->
  <rect x="36" y="512" width="1128" height="92" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="538" class="card-h" fill="#6366f1">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• 800G/1.6T 硅光模块严禁“仅看光功率计与平均误码率盲付”：TDECQ 超标会产生突破 15 符号的突发误码卡死万卡训练，未老化 InP 激光器会成批猝死。</text>
  <text x="54" y="584" class="body">• 必须将 PAM4 TDECQ (&lt;=1.8dB)、FEC 最大错误桶 (&lt;10)、GR-468 老化 ΔIth (&lt;=5%) 与 LPO/旧件回收绑定为智能托管解锁谓词。</text>

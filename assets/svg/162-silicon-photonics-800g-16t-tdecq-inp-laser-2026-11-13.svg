  <text x="36" y="60" class="title">Round 160 · AI 智算中心 800G/1.6T 硅光模块、PAM4 眼图 TDECQ 与激光器老化架构图</text>
  <text x="36" y="84" class="sub">800G/1.6T Silicon Photonics Transceiver Offtake, PAM4 TDECQ (&lt;=1.8 dB), FEC Tail (&lt;10) &amp; GR-468 Burn-In ΔIth (&lt;=5%)</text>

  <!-- Left Card: Failure Mode -->
  <rect x="36" y="104" width="355" height="390" rx="12" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="52" y="120" width="160" height="24" rx="12" fill="#fca5a5"/>

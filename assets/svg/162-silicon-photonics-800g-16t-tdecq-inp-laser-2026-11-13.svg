  <text x="52" y="166" class="card-h">三大万卡训练闪断卡死、激光器猝死与假模块灾难</text>

  <text x="52" y="196" class="body" fill="#fca5a5" font-weight="700">1. PAM4 眼图畸变 (TDECQ=3.9dB) 触发万卡闪断</text>
  <text x="52" y="216" class="body">普通光功率计测 +2dBm 发光正常，但 PAM4 四电平</text>
  <text x="52" y="234" class="body">非线性拥挤产生 &gt;15 符号突发误码击穿 KP4 FEC，</text>
  <text x="52" y="252" class="body">微秒级 Link Flap 直接卡死上万张 GPU 同步训练！</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. 偷省 72h 老化致 InP 激光器暗线缺陷 (DLD) 猝死</text>
  <text x="52" y="302" class="body">外延位错在注入电流下攀移成暗线黑洞，上机 300h</text>
  <text x="52" y="320" class="body">阈值电流暴涨 +24% 成批失明；FAU 胶移损耗 +2.5dB。</text>

  <text x="52" y="350" class="body" fill="#fca5a5" font-weight="700">3. 刷写假 CMIS 固件与短距滥用 16W 高功耗 DSP</text>
  <text x="52" y="370" class="body">白牌刷 EEPROM 冒充原厂；机柜间 &lt;30m 短距未用</text>
  <text x="52" y="388" class="body">8W LPO 线性直驱白费一半电，旧 400G 金锗未回收。</text>

  <rect x="52" y="418" width="323" height="58" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="64" y="440" class="mono" fill="#f87171">Legacy: 1,000 Modules + +2.0dBm Power Meter</text>
  <text x="64" y="460" class="mono" fill="#fca5a5">Result: $640,000 exposed to AllReduce link flaps</text>


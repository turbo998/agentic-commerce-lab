  <text x="440" y="296" class="body">100% 85°C 高温老化阈值漂移 ΔIth &lt;=5.0%, 金锡空洞</text>
  <text x="440" y="314" class="body">&lt;=2% &amp; FAU 温循 &lt;=0.3dB — 早夭猝死直返 HTTP 422</text>

  <rect x="428" y="334" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="354" class="mono">Gate 3: Web IQ CMIS 5.2 &amp; DSP Step (280ms)</text>
  <text x="440" y="372" class="body">核验 OIF CMIS 5.2 EEPROM 密码学签名与 5nm/7nm</text>
  <text x="440" y="390" class="body">DSP 量产步进勘误表 — 假固件或 A0 版直返 HTTP 451</text>

  <rect x="428" y="410" width="348" height="68" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="430" class="mono" fill="#fcd34d">Gate 4: 8W LPO &amp; 400G Au/Ge Trade-In (245ms)</text>
  <text x="440" y="448" class="body">&lt;=30m 短距采用 LPO 线性直驱省 DSP (功耗降 50%) +</text>
  <text x="440" y="466" class="body">退役 400G 金锡/锗磷化铟折旧冲抵立省 $89,600 触发 409</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="812" y="104" width="352" height="390" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="828" y="120" width="184" height="24" rx="12" fill="#fde68a"/>
  <text x="840" y="136" class="pill-warn">📊 5-Lane 实测矩阵与 Web IQ</text>

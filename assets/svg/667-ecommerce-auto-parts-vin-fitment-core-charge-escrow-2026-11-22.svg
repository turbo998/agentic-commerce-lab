  <text x="442" y="200" class="mono" fill="#fcd34d">&amp; Check Terminal Bolt-Mount Witness Marks!</text>
  <text x="432" y="223" class="body-txt">• Remanufactured `Core Deposit ($75–$250)` Escrow:</text>

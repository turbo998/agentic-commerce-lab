  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. `ACES/PIES` 17-Digit `VIN` Gate (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Guessing "2020 F-150" Without Engine/Axle:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Resolve `License_Plate -&gt; 17-Char_VIN -&gt; OEM_PR_Code`</text>
  <text x="54" y="200" class="mono">Require `ACES_Fitment_Match == EXACT_ROTOR_MM`!</text>
  <text x="44" y="223" class="body-txt">• Blocks Left-vs-Right &amp; AWD-vs-FWD Collisions:</text>
  <text x="54" y="243" class="mono">Hard-Block Checkout If `Submodel/Engine` Unresolved</text>
  <text x="44" y="266" class="body-txt">• Eliminates the #1 aftermarket profit killer:</text>
  <text x="54" y="286" class="body-txt">buyers ordering 320mm brake rotors when their</text>
  <text x="54" y="304" class="body-txt">sport-package caliper requires 350mm rotors</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 VIN_SUBMODEL_FITMENT_MISMATCH_OR_UNRESOLVED_TRIM</text>


  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截漏测重锤+旋转双上极限防冲顶切断测试</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 根除吊钩冲顶拉断钢丝绳坠落特大事故隐患</text>


  <rect width="1200" height="675" fill="url(#bg360)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent360)"/>

  <!-- Header -->
  <text x="48" y="58" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 358 · INDUSTRIAL OVERHEAD BRIDGE CRANE (OSHA 1910.179 / ASME B30.2), MFL &amp; $185 BRAKE GATE</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">工业桥式/门式起重机定检维保、ASTM E1571 钢丝绳漏磁探伤与 $185 抱闸整流模块降级清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Konecranes / Demag / CMAA Spec 78 · $185 抱闸硅整流/内窥镜锁 + MFL 断丝探伤 + 125% 无线拉力计 + CCAA 检验师核验</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="64" y="160" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">🏗️ 四大工业行车机电与探伤硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. $185 抱闸整流模块 &amp; 减速箱内窥镜锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 90% 溜钩或起升卡顿源于 $185 抱闸直流整流块烧毁</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 换减速机须附内窥镜 (Borescope) 断齿或油液铁谱</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截坏个整流块却虚报 $16,500 换减速箱</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. ASME B30.2 卡尺缩径 &amp; MFL 漏磁探伤锁</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制实测公称直径缩减 &gt;=5% 或一捻距断丝 &gt;=12 根</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 上传 ASTM E1571 漏磁探伤 (LMA/LF) 内部断丝波形</text>
  <text x="74" y="368" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断看表面黑油泥就忽悠花 $6,800 换钢丝绳</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="426" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 100%–125% 无线拉力计载荷与挠度锁</text>
  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• OSHA 1910.179(k)(2) 强制 NIST 溯源无线拉力计</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 激光测距仪实测满载主梁跨中静挠度 &lt;= L / 800</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 杜绝不拉配重块随便吊车间废钢骗取 $4,500 试重费</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>

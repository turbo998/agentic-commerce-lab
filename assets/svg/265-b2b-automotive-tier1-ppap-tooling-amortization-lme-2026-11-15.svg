<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg265" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent265" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dangerGrad265" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad265" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg265)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="470" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="279" y="55" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">ROUND 263 · AUTO TIER-1 PPAP TOOLING, IIOT SHOT-CAP &amp; LME/CRU INDEX</text>
  <text x="44" y="96" fill="#f8fafc" font-size="22" font-weight="800">B2B 智能体汽车主机厂与 Tier-1 量产件批准（PPAP）、模具摊销确权与金属指数联动清算架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">PPAP Level 3 (Cpk≥1.67) 与 UCC-1 物权寄托锁 + 模具 IIoT 冲次满额去摊销锁 + LME/CRU 对称联动与废料回抵 vs. 终身幽灵摊销、破产封模与单向涨价</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent265)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad265)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统整车厂与 Tier-1 模具及零件结算的三大 BOM 黑洞（溢价 6%~10%）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. 未达 PPAP Level 3 (Cpk≥1.67) 放款 &amp; 破产被封模（UCC-1 缺失 · 403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 供应商仅凭临时 Interim PSW (Cpk=1.12 尺寸不稳) 即骗走最后 30% ($450k) 模具尾款</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 未办州政府 UCC-1 Tooling Bailment 物权备案，供应商破产时主机厂 $150万模具被银行查封</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 导致主机厂总装线因独家模具被扣押彻底停摆，单日停产损失超千万美元</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. 模具费早已 100% 摊销回本却继续收“终身幽灵摊销”（Zombie Cap · 422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• $150 万模具约定按 $5/件分摊在首 30 万件零件上；出货到第 300,001 件时本应降价 $5</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• 传统 Blanket PO 永不自动改价，第 30~60 万件被白白多收 $150 万双倍模具费，且夜班私打副厂件</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 采购订单与累计收货水位及模具 IIoT 冲次计数器脱节，沦为终身提款机</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. LME/CRU 金属涨价秒加钱跌价装死 &amp; 独吞冲压边角料（Scrap · 451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• 铝锭/冷轧钢涨 20% 时立刻发函加价，两个季度后暴跌 18% 却隐瞒不调降零件单价</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 18kg 钢卷冲出 8kg 车门，按 18kg 毛重收钢材费却独吞 10kg 高纯度冲压边角料 (Offal) 卖铁钱</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 违反双向对称价格指数联动条款，且侵吞主机厂已买单的 55% 边角料残值</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad265)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + IIoT 模具锁 + LME/Scrap 四重确定性门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · PPAP Level 3 Full PSW (Cpk≥1.67) 与 UCC-1 物权锁（拦截 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 强制核验 300 件节拍生产 Cpk≥1.67 正式 PSW 保证书、模具激光 RFID 铭牌</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">及州务卿 UCC-1 Tooling Bailment 备案号；临时放行单或无物权保护 11ms 硬拦截</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · 模具摊销累计水位满额自动归零与 IIoT 冲次锁（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">实时对齐 EDI 862/856 累计收货件数与模具物联网传感器冲次 (Shot-Count)，满 30 万件</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">瞬间自动剥离 $5/件摊销附加费，并阻断夜班私用主机厂模具盗打副厂件</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · LME/CRU 涨跌双向对称联动与冲压边角料回抵锁（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">按合同滞后窗口自动抓取 LME 铝/铜与 CRU 钢材均价执行双向对称调价，并强制按</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">(Gross毛重 - Net净重) × AMM 废钢指数从单件成本中足额扣回边角料残值</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 量产件自动清算 &amp; 摊销满额去费+金属跌价双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">10ms 签发 b2b_automotive_tier1_ppap_... 令牌；剥离满额摊销与废料回抵立省 $73,600 转 409</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#38bdf8" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 合规 PPAP 量产清算</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">PSW/UCC-1 + 冲次吻合 ($920k)</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Tier-1 Batch Settled · 10ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · 缺正式 PSW / UCC-1 备案</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">Cpk&lt;1.67 或无破产防封模物权</text>
  <text x="410" y="692" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">MISSING_PPAP_UCC1_BLOCKED</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · 满额后继续收幽灵摊销</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">超 30 万件仍收 $5 或私打副厂件</text>
  <text x="642" y="692" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">ZOMBIE_TOOLING_AMORTIZATION</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · 金属跌价不降/独吞废钢</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">LME 单向棘轮或未退 55% 边角料</text>
  <text x="874" y="692" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">ASYMMETRIC_LME_SCRAP_HOLD</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · 满额去摊销+废料回抵</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">立省 $73.6k ($846.4k 净付)</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">TOOLING_LME_TRUEUP_CONFIRM</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg97" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051020"/>
      <stop offset="50%" stop-color="#0a203e"/>
      <stop offset="100%" stop-color="#10325e"/>
    </linearGradient>
    <linearGradient id="accent97" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg97)"/>
  <rect x="30" y="25" width="1140" height="580" rx="18" fill="#08182e" stroke="#06b6d4" stroke-width="2" opacity="0.95"/>
  <rect x="30" y="25" width="1140" height="6" fill="url(#accent97)"/>

  <text x="60" y="72" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">ROUND 95 · SEMICONDUCTOR ULTRAPURE WATER (UPW), TOC/DO (&lt;=1 PPB) &amp; BORON/SILICA MANDATE</text>
  <text x="60" y="108" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">半导体晶圆厂超纯水 (UPW)、TOC/溶解氧与硼/胶体硅穿漏门禁托管 vs 电阻率盲付</text>
  <text x="60" y="136" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">SEMI F63 POU TOC/DO (&lt;=1.0 ppb) + Boron (&lt;=15 ppt) &amp; Silica (&lt;=0.5 ppb) + 20nm Particle vs. 18.2 MΩ Resistivity Illusion</text>

  <!-- Left Card -->
  <rect x="60" y="160" width="525" height="335" rx="12" fill="#25121d" stroke="#ef4444" stroke-width="1.8"/>
  <text x="85" y="196" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ 传统仅看 18.2 MΩ·cm 电阻率按月包干盲付模式</text>
  <text x="85" y="230" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• “电阻率满表 18.2 MΩ”的致命假象：胶体硅与弱电离硼酸根本不导电，树脂穿漏时电阻率依然 18.2！</text>
  <text x="85" y="260" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 硼 (Boron) 穿漏导致晶体管阈值电压漂移：抛光混床最先漏出 ppt 级硼离子，直接毒化晶圆掺杂浓度</text>
  <text x="85" y="290" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 185nm 紫外灯衰老致 TOC (&gt;3 ppb) 超标：有机碳在浸没式光刻机镜头下碳化结垢毁掉亿元物镜</text>
  <text x="85" y="320" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 纯水一次冲洗直接排入废水站浪费：高纯度清洗尾水未按电导率分级回用，多交 30% 原水与造水费</text>
  <rect x="85" y="350" width="475" height="120" rx="8" fill="#35101d" stroke="#f87171" stroke-width="1"/>
  <text x="105" y="382" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">典型 12 英寸晶圆厂外包超纯水站 (UPW BOO) 供水资损案例：</text>
  <text x="105" y="410" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">厂务 Agent 见在线电阻率达 18.24 MΩ·cm 即自动支付 $240,000 月度超纯水服务费，</text>
  <text x="105" y="434" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">因末端抛光混床树脂饱和穿漏 85 ppt 硼与纳米胶体硅未被电阻率表发现，造成湿法清洗批次良率雪崩</text>
  <text x="105" y="456" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 非离子胶体硅拦截：0% | • 弱电离硼穿漏拦截：0% | • 单次污染晶圆资损：超百万美元</text>

  <!-- Right Card -->
  <rect x="615" y="160" width="525" height="335" rx="12" fill="#0a2426" stroke="#22c55e" stroke-width="1.8"/>
  <text x="640" y="196" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">✅ POU 在线 TOC/硼/硅光谱 + 20nm 颗粒 + 梯级回用托管</text>
  <text x="640" y="230" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 机台端 (POU) 在线 TOC (&lt;=1.0 ppb)、溶解氧 (&lt;=1.0 ppb) 与 20nm 颗粒门禁：保护栅氧与光刻镜头</text>
  <text x="640" y="260" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 在线 ICP-MS 硼 (&lt;=15 ppt) 与比色法活性硅 (&lt;=0.5 ppb) 穿漏门禁：秒级识破抛光混床树脂早衰</text>
  <text x="640" y="290" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• SEMI F63 / ASTM E-1.3 标准与 TMAH 显影废水排放核验：Web IQ 核查耗材更换周期与环保合规</text>
  <text x="640" y="320" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 低电导率清洗尾水分流直回精处理段 (&gt;=78% 回收率) + RO 浓水补冷却塔：立省 $38,000</text>
  <rect x="640" y="350" width="475" height="120" rx="8" fill="#062e29" stroke="#4ade80" stroke-width="1"/>
  <text x="660" y="382" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">端到端工程与财务收益（Measured / Deterministic）：</text>
  <text x="660" y="410" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">11ms 硬阻断 POU 端 TOC/溶解氧/20nm 颗粒超标的水质违约账单；14ms 拦截电阻率无法察觉的</text>
  <text x="660" y="434" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">硼/胶体硅树脂穿漏；Web IQ 清洗尾水分级回收与 RO 浓水梯级利用立省 $38,000.00（净付 $202,000）</text>
  <text x="660" y="456" fill="#4ade80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 树脂隐蔽穿漏拦截：100% | • 全厂水回收率：&gt;=78% | • 验真耗时：&lt; 25ms</text>

  <!-- Bottom Bar -->
  <rect x="60" y="512" width="1080" height="72" rx="10" fill="#0d223d" stroke="#475569" stroke-width="1"/>
  <text x="85" y="541" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">架构师核心选型法则：</text>
  <text x="235" y="541" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14">晶圆厂超纯水 (UPW) 结算 Agent 绝不能只看 18.2 MΩ 电阻率！必须绑定【POU 在线硼/硅 + TOC/DO + 20nm 颗粒】。</text>
  <text x="85" y="567" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Provenance: Deterministic Policy Evaluator (`evaluate_semiconductor_upw_ultrapure_water_policy`) · SEMI F63 &amp; ASTM D5127 E-1.3 · 2026-11-11</text>
</svg>

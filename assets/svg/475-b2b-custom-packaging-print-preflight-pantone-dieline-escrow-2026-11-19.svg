<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg475" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111E" />
      <stop offset="50%" stop-color="#102138" />
      <stop offset="100%" stop-color="#081322" />
    </linearGradient>
    <linearGradient id="accent475" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg475)" />
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent475)" />

  <!-- Header -->
  <text x="44" y="48" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 32 · B2B CUSTOM PACKAGING, COMMERCIAL PRINT PREFLIGHT (PDF/X-4) &amp; DIELINE ESCROW</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">企业定制包装与商业印刷采购：PDF/X-4 印前预检、防印废 5 万纸箱与刀版复用锁</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Packlane / Canva Print / Vistaprint vs 裕同科技 / 云印 vs ISO 15930 PDF/X-4 Preflight vs Azure Foundry + Escrow Gate</text>

  <!-- Left Panel: 3 Core B2B Packaging & Print Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 企业包装与印刷采购三大报废黑洞</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. RGB 色差/缺 3mm 出血位印废 5 万只彩盒</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 设计师上传 72DPI RGB 图或条形码压在折痕刀模线</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  上直接开机，印出严重偏色漏白边且商超无法扫码</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：ISO 15930 (PDF/X-4) 300DPI/出血位预检 +</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  3D 折盒数字打样双签锁 (HTTP 403 禁开机)</text>

  <rect x="62" y="328" width="314" height="132" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="76" y="352" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2. 翻单重复收 $1,200 刀版模具费与超印强卖</text>
  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 老款礼盒翻单补货，印厂仍重复计收刀模费与铜版费</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  或借口开机损耗多印 18% 强行要求买方按实结算</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：在库模具寿命台账去重 + 行业 ±5% 溢短装</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  容差封顶硬拦截 (HTTP 422 拦截乱收费)</text>

  <rect x="62" y="474" width="314" height="134" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 食品级油墨迁移超标与 FSC 森林认证吊销</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 食品/美妆内包材使用含矿物油(MOSH/MOAH)油墨</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ FDA 食品接触油墨与 FSC 核查 (451)</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 多 SKU 拼版(Gang-Run)寻优 + 首件分光光度计</text>
  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  Delta-E &lt;=2.0 锁款立省 21% (HTTP 409)</text>

  <!-- Center Panel: 5-Lane Deterministic Gate -->
  <rect x="414" y="132" width="402" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="434" y="164" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ 企业定制包装与印刷采购五车道状态机</text>

  <rect x="434" y="184" width="362" height="72" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="450" y="208" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 200 · PDFX4_PREFLIGHT_DIELINE_ESCROW_AUTHORIZED</text>
  <text x="450" y="228" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">300DPI/3mm出血合规 + 3D打样已签 + 模具免收 (9ms)</text>
  <text x="450" y="245" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">b2b_packaging_print_preflight_escrow_mandate_*</text>

  <rect x="434" y="268" width="362" height="72" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
  <text x="450" y="292" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 403 · PDFX4_PREFLIGHT_OR_DIELINE_PROOF_BLOCKED</text>
  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截缺 3mm 出血/低分辨率 RGB 稿件或未签 3D 刀模打样开机</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">pdfx4_valid = false | signed_3d_proof = false</text>

  <rect x="434" y="352" width="362" height="72" rx="8" fill="#431407" stroke="#F97316" stroke-width="1.5" />
  <text x="450" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 422 · DUPLICATE_DIE_FEE_OR_OVERRUN_BLOCKED</text>
  <text x="450" y="396" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截翻单重复计收在库刀版模具费或超 ±5% 溢短装强行结算</text>
  <text x="450" y="413" fill="#FDBA74" font-family="Consolas, monospace" font-size="11">existing_die_active = true | overrun_pct &gt; 5%</text>

  <rect x="434" y="436" width="362" height="72" rx="8" fill="#3B0764" stroke="#A855F7" stroke-width="1.5" />
  <text x="450" y="460" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 451 · WEBIQ_FOOD_INK_MIGRATION_OR_FSC_HOLD</text>
  <text x="450" y="480" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="12">Web IQ 检出食品接触油墨违规或供应商 FSC CoC 证书吊销</text>
  <text x="450" y="497" fill="#D8B4FE" font-family="Consolas, monospace" font-size="11">fda_low_migration_ink = false | key_age &gt; 180d</text>

  <rect x="434" y="520" width="362" height="88" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.5" />
  <text x="450" y="544" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 409 · GANG_RUN_IMPOSITION_AND_DELTA_E_CONFIRM</text>
  <text x="450" y="564" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="12">跨 SKU 拼版寻优 + 模具台账复用 + Delta-E&lt;=2.0 锁款省 21%</text>
  <text x="450" y="584" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">季度包装包材与印刷采购池 $290,000 → 净结算 $229,100 (省 $60,900)</text>

  <!-- Right Panel: Platform Selection Matrix -->
  <rect x="836" y="132" width="320" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="856" y="164" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🧭 包装包材与云印刷平台选型</text>

  <rect x="854" y="184" width="284" height="100" rx="8" fill="#1E293B" />
  <text x="868" y="206" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Packlane / Canva Print / 傲彩 (Web2Print 自助)</text>
  <text x="868" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 在线 3D 刀模实时预览与小批量数码打样秒报价</text>
  <text x="868" y="246" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：大货胶印潘通专色与特种纸工艺管控弱</text>
  <text x="868" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：DTC 新品试销礼盒、展会折页与中小批量彩盒</text>

  <rect x="854" y="298" width="284" height="100" rx="8" fill="#1E293B" />
  <text x="868" y="320" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">裕同科技 / 劲嘉 / Esko 印前体系 (工业级印包)</text>
  <text x="868" y="340" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 支持百万级消费电子/美妆精装盒与 G7 色彩管理</text>
  <text x="868" y="360" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：跨厂模具资产分散，手工核价周期长达数天</text>
  <text x="868" y="380" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：3C/美妆/食品大宗包材与全球供应链集采</text>

  <rect x="854" y="412" width="284" height="196" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="868" y="436" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">★ 推荐：Foundry + PDF/X-4 预检 &amp; 拼版网关</text>
  <text x="868" y="458" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. PDF/X-4 自动校验 300DPI、出血与转曲</text>
  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 在库刀模/烫金版寿命台账防翻单重收费</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 食品接触低迁移油墨与 FSC 证书硬校验</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. 多 SKU 联版拼印 + 首件色差锁款省 21%</text>
  <rect x="868" y="542" width="256" height="50" rx="6" fill="#022C22" />
  <text x="880" y="563" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">审计标签：provenance = synthetic</text>
  <text x="880" y="581" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="11">independently_reproduced = false</text>
</svg>

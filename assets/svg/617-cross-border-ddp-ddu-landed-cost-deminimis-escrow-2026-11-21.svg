  <text x="830" y="182" class="mono">US CBP 19 CFR §10.151: Aggregate <= $800</text>
  <text x="830" y="200" class="mono">per One Person on One Day (24h Window)</text>
  <text x="820" y="223" class="body-txt">• Section 301 / Trade-Remedy Exclusion Check:</text>
  <text x="830" y="243" class="mono" fill="#f9a8d4">Verify HTS Eligibility for Entry Type 86</text>
  <text x="820" y="266" class="body-txt">• EU `IOSS <= €150` / UK `HMRC <= £135` Split:</text>

  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. DDU Doorstep Duty-Shock Breaker (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Unannounced `DDU / DAP` Doorstep Extortion:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Courier demands €42 VAT + €18 Advancement Fee</text>
  <text x="54" y="200" class="body-txt">at buyer's door → 34% buyers refuse parcel!</text>
  <text x="44" y="223" class="body-txt">• Mandatory Guaranteed `DDP` Checkout Gate:</text>
  <text x="54" y="243" class="mono">Require Pre-Collected Duty + Tax + Zero_COD</text>
  <text x="44" y="266" class="body-txt">• Blocks shipping DDU when round-trip return</text>
  <text x="54" y="286" class="body-txt">air freight (`$45-$70`) + customs abandonment</text>
  <text x="54" y="304" class="body-txt">exceeds net product contribution margin</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 UNDISCLOSED_DDU_DOORSTEP_DUTY_SHOCK_BLOCKED</text>


  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. 10-Digit HTS, CoO &amp; Invoice Parity Gate (422)</text>
  <text x="432" y="162" class="body-txt">• Stops Generic 6-Digit HS &amp; Wrong Origin Rate:</text>
  <text x="442" y="182" class="mono">Duty = f(10_Digit_HTS, Country_of_Origin_CoO,</text>
  <text x="442" y="200" class="mono">         Ship_From_Country, Material_Comp)</text>
  <text x="432" y="223" class="body-txt">• Strict Commercial Invoice Valuation Lock:</text>
  <text x="442" y="243" class="mono" fill="#fcd34d">Customs_Declared_Value == Net_Paid_Checkout_Amt</text>
  <text x="442" y="261" class="body-txt">Bans fake "$5 Gift / Sample" under-declaration</text>
  <text x="432" y="284" class="body-txt">• Prevents pre-discount MSRP over-taxation on</text>
  <text x="442" y="302" class="body-txt">promotional/bundled orders (`attach discount line`)</text>

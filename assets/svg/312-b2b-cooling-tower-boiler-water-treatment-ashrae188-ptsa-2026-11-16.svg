  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">冷却塔与锅炉水处理：PTSA 荧光示踪锁、浓缩倍数 &gt;=5.0 vs 药桶掺水稀释与排污冲药促复购</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_cooling_tower_boiler_water_treatment_ashrae188_ptsa_tracer_legionella_mandate_2026 · 15.0% Savings ($22,500 / Batch)</text>

  <!-- Left Panel: Legacy Water Treatment Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统工业水处理按桶结算四大黑洞 (Legacy Water Treatment Leakage: 25%–45%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. $2,200 药桶被掺水稀释 3 倍或加药泵气蚀空转 (Diluted Drum &amp; Dead Pump)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">将 55 加仑缓蚀阻垢剂固含量从 35% 稀释至 8%（一桶拆四桶卖），或加药计量泵气蚀</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">空转 2 个月未打入一滴药，冷机冷凝器结垢 1.5mm 多耗 18% 电费却照付全额药款。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 故意调低浓缩倍数把贵重药水排进下水道 (Blowdown Chemical Dumping)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">按药桶提成的业务员将电导率排污上限调低，使浓缩倍数 (CoC) 跌至 2.2（正常应</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">&gt;=5.0），把刚投加的昂贵药剂直接冲入市政污水管，药耗与水费双双翻倍。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 既卖药又自出水质报告掩盖垢下腐蚀 (Self-Graded Field Report Fraud)</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">供应商巡检员自己取水用便携比色计手填“水质优良”月报，隐瞒碳钢管道 &gt;5 mpy</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">点蚀穿孔风险与杀菌剂投加不足引发的填料生物粘泥 (Biofilm) 堆积。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 无 CDC ELITE 资质盲测引发军团菌停业危机 (ASHRAE 188 Legionella Breach)</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">使用无资质试纸替代 CDC ELITE 认证独立实验室培养，漏检嗜肺军团菌 (&gt;=10 CFU/mL)</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">气溶胶传播，导致医院或酒店被卫生局强制关停冷却塔并面临千万美元诉讼。</text>


  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 穿透核验出具军团菌培养报告 (ISO 11731) 的独立第三方实验室 CDC ELITE</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">认证状态与 EPA FIFRA 杀菌剂登记号，严防 ASHRAE 188 违章与公共卫生事故。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动按 CoC&gt;=5.5 核减跑药量并切换高浓缩固体药砖 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动剥离过度排污造成的药耗浪费并将 55 加仑含水液桶切换为固体浓缩药膏：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $150,000.00 → 自动核减 $22,500.00 (15.0%) → 净付 $127,500.00！</text>


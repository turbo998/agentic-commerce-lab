  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 在线 PTSA 荧光探头 (100±10 ppb) 质量守恒锁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">直连 Modbus 在线荧光探头与 LPR 腐蚀仪 (&lt;=2.0 mpy)，强制核验药桶液位下降量与</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">循环水 PTSA 荧光浓度增量守恒，11ms 内识破药桶掺水稀释与加药泵空转。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 补排污双水表浓缩倍数锁 (CoC &gt;=5.0) + 杀菌 ORP 门禁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">实时锁定补水表与排污表比值 (CoC &gt;=5.0) 及杀菌投加期 ORP &gt;=650 mV、冷机端差</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">&lt;=1.5°F，14ms 内硬拦截人为调大排污阀把药剂冲进下水道的恶意促复购行为。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>

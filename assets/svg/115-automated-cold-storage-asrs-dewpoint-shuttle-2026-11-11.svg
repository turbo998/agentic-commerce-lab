    <text x="823" y="223" fill="#CBD5E1">  延迟：19 ms · 放款：$145,000.00 (露点 -38°C)</text>

    <text x="823" y="253" font-weight="700" fill="#FCA5A5">• 穿堂除湿停机结霜/顶层超温拦截 (403)</text>
    <text x="823" y="272" fill="#CBD5E1">  延迟：11 ms · 拒付冰冻锁仓期间库位租费</text>

    <text x="823" y="302" font-weight="700" fill="#FCA5A5">• 堆垛机掉线降速或虚收倒托费拦截 (422)</text>
    <text x="823" y="321" fill="#CBD5E1">  延迟：14 ms · 对齐入库 3D 光幕轮廓合格存证</text>

    <text x="823" y="351" font-weight="700" fill="#FDE68A">• Web IQ -29°C 深度过冷热飞轮削峰 (409)</text>
    <text x="823" y="370" fill="#CBD5E1">  延迟：295 ms · 节省：$23,200.00 (16.0% 节电)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  134 / 134 单元测试 100% 通过 (CSP 自包含)</text>
  </g>
  <rect x="823" y="442" width="319" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="982" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">

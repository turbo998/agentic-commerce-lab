  </text>

  <!-- Right Card: Quantitative Benchmark & Architecture Wins -->
  <rect x="805" y="132" width="355" height="360" rx="12" fill="url(#cardBg115)" stroke="#10B981" stroke-width="1.5"/>
  <rect x="821" y="148" width="323" height="32" rx="6" fill="#064E3B"/>
  <text x="982" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0" text-anchor="middle">

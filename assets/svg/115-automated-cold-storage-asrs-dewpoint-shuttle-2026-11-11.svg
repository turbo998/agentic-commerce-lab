  <text x="60" y="541" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700" fill="#7DD3FC">
    🏛️ 架构师选型铁律 (Takeaway): 绝对不要按“静态包月托盘位数量”盲付 -25°C 全自动高架立体冷库 (AS/RS) 仓储账单！
  </text>
  <text x="60" y="565" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    必须绑定：① 转轮除湿穿堂露点 &lt;=-35°C 防轨道/激光测距结霜且 38m 顶层货位 &lt;=-24°C (11ms 拦 403)；② FEM 9.851 堆垛机双指令吞吐 &gt;=45 托/h (14ms 拦 422)；
  </text>
  <text x="60" y="586" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    ③ Web IQ 核查低氧防火系统 (O2 &lt;=15%) 与 NH3/CO2 检漏合规 (285ms 拦 451)，并利用冻品热容执行夜间谷电 -29°C 深度过冷移峰立省 $23,200 (295ms)。

  <rect width="1200" height="630" fill="url(#bg115)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent115)"/>

  <!-- Header -->
  <rect x="40" y="24" width="390" height="28" rx="14" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
  <text x="235" y="43" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#E0F2FE" text-anchor="middle">
    ROUND 113 · AUTOMATED COLD-STORAGE AS/RS (-25°C) ESCROW
  </text>
  <text x="40" y="84" font-family="Segoe UI, Ubuntu, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">
    高架立体冷库 (AS/RS -25°C)、转轮除湿防结霜 (&lt;=-35°C露点) 与堆垛吞吐智能托管
  </text>
  <text x="40" y="111" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" fill="#94A3B8">
    Desiccant Air-Lock Dew-Point (&lt;=-35°C), FEM 9.851 Dual-Command Cycle Throughput &amp; O2 Hypoxic Fire Guard vs. Ice-Jammed Slot Overbilling
  </text>

  <!-- Left Card: Legacy Fixed Pallet-Slot & Ice-Jamming Failure -->
  <rect x="40" y="132" width="355" height="360" rx="12" fill="url(#cardBg115)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="148" width="323" height="32" rx="6" fill="#450A0A"/>
  <text x="217" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">
    ❌ 传统按死库位收租与激光测距结霜瘫痪踩坑
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 关停转轮除湿机致激光测距结冰瘫痪 (Ice-Jam)</text>
    <text x="58" y="224" fill="#CBD5E1">• 冷库方为省电关掉穿堂氯化锂转轮除湿，收走 $145,000</text>
    <text x="58" y="242" fill="#CBD5E1">• 湿空气涌入 -25°C 巷道凝华成冰霜，堆垛机光电致盲停摆</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 货架冷缩变形或四向穿梭车掉线卡死出库 SLA</text>
    <text x="58" y="294" fill="#CBD5E1">• FEM 9.851 双指令出入库吞吐跌破 28 托/小时 (&lt;45 托标准)</text>
    <text x="58" y="312" fill="#CBD5E1">• 冻品压港超时却反诬货主“木托盘变形”索要人工倒托费</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 缺失低氧防火 (O2 &lt;=15%) 与氨制冷检漏联锁</text>
    <text x="58" y="364" fill="#CBD5E1">• 38米高架冷库无法装喷淋头，低氧制氮防火系统故障失灵</text>
    <text x="58" y="382" fill="#CBD5E1">• 或蒸发器融霜期顶层温度升至 -14°C 致冰激凌重结晶变质</text>
  </g>
  <rect x="58" y="442" width="319" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="217" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">

  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：先 100% 放款提现，次年 1 月再催 W-9 导致平台自掏腰包赔税</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 无税表/假税号先放款，平台背负 24%–30% 法定连带税债：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 创作者年中提走 $50,000 后失联，次年 1 月报 1099-K 时拒填 W-9；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 依据 IRC § 3406 / § 1461，未代扣的 24% 税款 + $310/张罚单全由平台自己买单！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 海外 W-8BEN 满 3 个日历年过期未重签 &amp; 漏扣美国源版税：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• W-8BEN 在第 3 年 12 月 31 日自动作废；向美国买家售卖 AI 模型版税漏扣 30%。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 仅用正则校验 9位数字 &amp; 漏报 $600 起征州 (MA/VT/MD) 1099-K：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 姓名与 EIN 不匹配引爆大批量 IRS CP2100 B-Notice 警告信与州税局重罚。</text>


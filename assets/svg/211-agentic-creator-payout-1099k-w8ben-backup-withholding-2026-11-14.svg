  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 首笔出金前 IRS e-Services TIN 实时匹配 + 24% 备用预提托管：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 精确核验 Legal Name + 9位 SSN/EIN；若待核验或命中 B-Notice，自动扣留 24%</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">  锁入税务托管专户仅放行 76% 净额，平台连带赔付风险降为 0.0%！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. W-8BEN 第3年 12月31日到期锁 + 版税/劳务精准定性拆分：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 境外履行劳务 0% 免税；美国买家版税按双边协定 (0%–10%) 精确代扣并报 1042-S。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 协定核验与免罚节税：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 阻断平台 24% 连带欠税赔付并合法激活协定减免，单批立省 $44,000.00 (HTTP 409)！</text>


  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 用户回复“不想收了”自然语言未被识别为 STOP，继续狂发</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 违反美国 TCPA / 佛州 FTSA 20:00–08:00 禁发令遭天价索赔!</text>


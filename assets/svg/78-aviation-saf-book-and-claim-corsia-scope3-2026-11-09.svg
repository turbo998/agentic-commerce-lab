<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg78" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06171e"/>
      <stop offset="50%" stop-color="#0b2836"/>
      <stop offset="100%" stop-color="#113847"/>
    </linearGradient>
    <linearGradient id="accent78" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg78)"/>
  <rect x="30" y="25" width="1140" height="580" rx="18" fill="#091a24" stroke="#06b6d4" stroke-width="2" opacity="0.95"/>
  <rect x="30" y="25" width="1140" height="6" fill="url(#accent78)"/>

  <text x="60" y="72" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">ROUND 76 · AVIATION SAF BOOK-AND-CLAIM, ASTM D7566 &amp; CORSIA SCOPE 1/3 MANDATE</text>
  <text x="60" y="108" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">可持续航空燃料 SAF 证书注销、掺混质量平衡与防双算托管 vs 绿色附加费盲付</text>
  <text x="60" y="136" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">RSB/ISCC Book-and-Claim Retirement + ASTM D7566 CoA + Scope 1/Scope 3 Atomic Pairing vs. Unverified Green Fare</text>

  <!-- Left Card -->
  <rect x="60" y="160" width="525" height="335" rx="12" fill="#23121b" stroke="#ef4444" stroke-width="1.8"/>
  <text x="85" y="196" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ 传统航空“绿色差旅附加费”盲付模式 (Greenwashing Fee)</text>
  <text x="85" y="230" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 一证多卖双重抵扣 (Double-Counting)：同一吨 SAF 被航司卖给 5 家跨国企业抵扣 Scope 3</text>
  <text x="85" y="260" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 棕榈油原生林毁林原料 (ILUC)：用高碳排原生棕榈油假冒废弃地沟油 (UCO) 提炼 HEFA</text>
  <text x="85" y="290" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 期货远期交付充当当年减排：企业付了今年差旅减排费，航司却用 2029 年远期意向书顶账</text>
  <text x="85" y="320" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 漏领 IRA 45Z / 欧盟补贴：全额转嫁 $2,800/吨绿色溢价，未抵扣政府清洁燃料税收抵免</text>
  <rect x="85" y="350" width="475" height="120" rx="8" fill="#32101c" stroke="#f87171" stroke-width="1"/>
  <text x="105" y="382" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">典型跨国企业差旅与航空货运 Scope 3 采购资损案例：</text>
  <text x="105" y="410" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">企业预付 $260,000 购买 100 吨 SAF 环境属性证书 (SAF-c)，审计时发现该批次未在</text>
  <text x="105" y="434" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">RSB/ISCC 注册簿唯一注销且原料属欧盟禁用的棕榈油副产物 → SBTi 审计全额作废</text>
  <text x="105" y="456" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 重复申报拦截率：0% | • 毁林原料识别率：0% | • ESG 年报合规风险：极高</text>

  <!-- Right Card -->
  <rect x="615" y="160" width="525" height="335" rx="12" fill="#092422" stroke="#22c55e" stroke-width="1.8"/>
  <text x="640" y="196" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">✅ RSB/ISCC 唯一注销 + ASTM D7566 + 45Z 税抵托管</text>
  <text x="640" y="230" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Book-and-Claim 原子配对注销：锁定航司 Scope 1 (SAFa) 与企业 Scope 3 (SAFc) 唯一序列号</text>
  <text x="640" y="260" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• ASTM D7566 物理注入回执：核验机场油库管道注入体积、质检 CoA 与 &gt;=70% 全生命周期减排</text>
  <text x="640" y="290" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• ISCC CORSIA 原料溯源红线：Web IQ 核验 UCO/农林废弃物 PoS，一票否决棕榈油衍生原料</text>
  <text x="640" y="320" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 清洁燃料税抵穿透套利：自动扣减美国 IRA 45Z / 加州 LCFS 补贴，拒绝为补贴部分买单</text>
  <rect x="640" y="350" width="475" height="120" rx="8" fill="#052e27" stroke="#4ade80" stroke-width="1"/>
  <text x="660" y="382" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">端到端工程与财务收益（Measured / Deterministic）：</text>
  <text x="660" y="410" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">12ms 拦截未在 RSB/ISCC 唯一注销的一证多卖证书；15ms 拦截未实际注入机场油库</text>
  <text x="660" y="434" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">的远期空头票据；Web IQ 穿透抵扣 45Z/LCFS 税收补贴立省 $38,000.00（净付 $222,000.00）</text>
  <text x="660" y="456" fill="#4ade80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 双重申报拦截率：100% | • SBTi/CORSIA 审计通过率：100% | • 验真耗时：&lt; 25ms</text>

  <!-- Bottom Bar -->
  <rect x="60" y="512" width="1080" height="72" rx="10" fill="#0f2530" stroke="#475569" stroke-width="1"/>
  <text x="85" y="541" fill="#06b6d4" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">架构师核心选型法则：</text>
  <text x="235" y="541" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14">企业购买航空 SAF 减排量绝不能只买一张 PDF 感谢信！必须绑定【RSB/ISCC 唯一注销 + ASTM D7566 油库注入 + 45Z 税抵】门禁。</text>
  <text x="85" y="567" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Provenance: Deterministic Policy Evaluator (`evaluate_aviation_saf_book_and_claim_policy`) · ICAO CORSIA &amp; SBTi Aviation · 2026-11-09</text>
</svg>

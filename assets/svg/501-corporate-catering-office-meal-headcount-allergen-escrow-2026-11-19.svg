  <!-- Header -->
  <text x="44" y="48" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 58 · CORPORATE CATERING, GROUP OFFICE MEAL, ALLERGEN LOCK &amp; ATTENDANCE-SYNC ESCROW</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">企业团餐与商务会议茶歇：防周五居家办公浪费40%盒饭、防加班餐补买超市购物卡与过敏原熔断</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">ezCater / DoorDash for Work / Forkable / 美团企业版 vs 门禁/Wi-Fi 实到人数联动 vs 花生过敏硬隔离 vs IRC §119 免税</text>

  <!-- Left Panel: 3 Core Corporate Catering Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 企业团餐与餐补三大浪费与违规黑洞</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. 周五按 150 人订午餐，仅 60 人到岗倒掉 90 份盒饭</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 行政按花名册固定订 150 人团餐，混合办公日大量</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  员工临时居家，40% 剩饭原封不动扔进垃圾桶</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：早上 09:45 办公楼 Wi-Fi/门禁打卡人数实时</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  削减团餐份数 + 禁在家里点公司加班餐 (HTTP 403)</text>

  <rect x="62" y="328" width="314" height="132" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="76" y="352" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2. 拿加班餐补囤烟酒/超市礼品卡与高管会迟到 1 小时</text>
  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 员工用 $30 晚餐额度在便利店买酒精饮料或充值卡；</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  或 $2,000 董事会午宴晚到 50 分钟会议已散场</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：SKU 行项目屏蔽烟酒/储值卡/生鲜囤货 +</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  会议开场迟到 &gt;20m 自动阶梯扣减餐费 (HTTP 422)</text>

  <rect x="62" y="474" width="314" height="134" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 严重坚果过敏混装休克与卫生评级 C 级黑作坊</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 参会者有致命花生过敏却点入大盘混装泰餐或卫生 C 级店</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ 餐厅卫生评级(&gt;=A)与过敏原独立包装(451)</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 整栋楼多部门拼单免 30% 平台散单溢价 + 符合</text>
  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  IRS IRC §119 职场供餐免税抵扣立省 26% (HTTP 409)</text>


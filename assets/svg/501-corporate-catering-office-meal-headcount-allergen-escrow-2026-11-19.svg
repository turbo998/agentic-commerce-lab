  <text x="450" y="497" fill="#D8B4FE" font-family="Consolas, monospace" font-size="11">unsealed_severe_allergen = true | health_inspection_grade_c = true</text>

  <rect x="434" y="520" width="362" height="88" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.5" />

  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 BUY_BOX_LOST_OR_REGIONAL_OOS_AD_WASTE_BLOCKED</text>


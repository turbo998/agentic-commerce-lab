  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Buy-Box Loss &amp; Regional OOS Breaker (403)</text>
  <text x="44" y="162" class="body-txt">• Stops Paying CPC to Send Traffic to 3P Resellers:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">If 1P/Brand_Buy_Box_Win_Rate &lt; 85% → Pause Bid</text>
  <text x="44" y="205" class="body-txt">• Regional Store / Zip-Code Inventory Gate:</text>
  <text x="54" y="225" class="mono">Require Zip_Store_ATP &gt;= 4 &amp; Core_Sizes &gt;= 60%</text>
  <text x="54" y="243" class="body-txt">Halts Instacart/Walmart ads in out-of-stock zips</text>
  <text x="44" y="266" class="body-txt">• Delivery-Promise Conversion Cliff Guard:</text>
  <text x="54" y="286" class="body-txt">Auto-pauses ASIN bids when FBA transfer lag</text>

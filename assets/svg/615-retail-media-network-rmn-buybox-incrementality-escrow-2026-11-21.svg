  <text x="442" y="200" class="mono" fill="#fcd34d">Cap Brand-Keyword Bid &lt;= $0.25 Defense Floor</text>
  <text x="432" y="223" class="body-txt">• Contribution-Margin `Breakeven ACoS` Ceiling:</text>
  <text x="442" y="243" class="mono">Max_CPC = CVR × (Net_Price - COGS - FBA_Fee)</text>
  <text x="432" y="266" class="body-txt">• Blocks Agency "Broad-Match Brand Stuffing":</text>
  <text x="442" y="286" class="body-txt">Enforces negative exact-match brand exclusions</text>

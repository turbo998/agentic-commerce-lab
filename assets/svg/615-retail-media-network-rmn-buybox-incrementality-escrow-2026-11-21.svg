  <text x="820" y="223" class="body-txt">• JBP Co-Op Trade-Fund vs Retail Media Double-Bill:</text>
  <text x="830" y="243" class="mono" fill="#f9a8d4">Reconcile Vendor Central Co-Op vs RMN Invoice</text>

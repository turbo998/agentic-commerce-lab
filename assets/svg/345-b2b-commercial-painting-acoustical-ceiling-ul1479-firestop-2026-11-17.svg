  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 超声波干膜测厚 (&gt;=3.2 Mils) + BIM 净石膏板面积锁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">强制使用 PosiTector 200 超声波测厚仪校验双遍漆膜 &gt;=3.2 mils 并绑定 BIM 扣除</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">玻璃幕墙、隔断与门洞后的净墙面面积，11ms 硬拦截一遍薄漆与含窗面积注水。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. UL 1479 膨胀防火泥药筒批号锁 + 单换矿棉板免拆龙骨锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">穿墙封堵强制一洞一二维码挂牌、核对 Hilti/3M 原厂药筒批号与点火膨胀发泡抽检；</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">完好 T-Bar 龙骨锁定单换 $1.80 矿棉板，14ms 封杀假红胶与 $9,500 强拆龙骨。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 UL 图号、FCIA 与灯具独立吊丝 (270ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">270ms 在线穿透核验 UL Product iQ (W-L/C-AJ 系统号) 管径匹配性、FCIA FM 4991</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">防火封堵承包商资质及 ASTM C636 / NEC 410.36(B) 灯具对角 12 号独立吊丝。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动扣除玻璃隔断虚报面积并将整拆龙骨降级为单换矿棉板 (235ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动剥离混入刷墙面积的玻璃隔断与门洞、将整屋拆龙骨降为单换矿棉板结算：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $118,000.00 → 自动核减 $17,700.00 (15.0%) → 净付 $100,300.00！</text>


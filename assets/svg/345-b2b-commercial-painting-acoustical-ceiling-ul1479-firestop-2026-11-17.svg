  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">商业室内涂装、矿棉吊顶与穿墙防火封堵：超声波 DFT 测厚锁、UL 防火泥锁 vs 一遍薄漆与假红胶骗局</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_commercial_interior_painting_acoustical_ceiling_ul1479_firestop_mandate_2026 · 15.0% Savings ($17,700 / Batch)</text>


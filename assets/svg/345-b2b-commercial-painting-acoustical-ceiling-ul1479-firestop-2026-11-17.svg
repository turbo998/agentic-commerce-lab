  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业室内涂装、吊顶与防火封堵四大黑洞 (Legacy Finishes Leakage: 30%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 合同签刷两遍耐擦洗蛋壳光漆，实际只滚一遍 $14 兑水粉笔漆 (DFT &lt; 1.4 Mils)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">利用一遍薄漆刚干时看着也是白的，偷省第二遍高价面漆与人工，漆膜仅 1.3 mils，</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">湿抹布一擦即露底；且把整面落地玻璃隔断与门洞全算进刷墙平方尺多收 30%。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 吊顶上方拿 $2.50 染色红胶假冒 $65/处 Hilti / 3M UL 1479 膨胀防火泥</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">欺负物业不会爬上吊顶检查防火墙管线穿孔，用普通红色丙烯酸胶冒充遇火膨胀 8 倍</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">的 UL 1479 防火封堵泥骗走 $18,000，导致医院 TJC 飞检或消防验收当场不合格。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 8 块矿棉吊顶板水渍发黄（换板仅 $15），却忽悠花 $9,500 拆换整屋铝合金龙骨</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">标准 2x2 / 2x4 明架矿棉吸音板只需单块掀起换新，包工头却谎称“主龙骨变形生锈”，</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">将完好的 Armstrong 烤漆 T 型龙骨整间砸掉重装，材料与工时暴利翻 60 倍。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 吊顶嵌入式 2x4 LED 灯盘未挂独立 12 号防坠安全吊丝 (违反 ASTM C636)</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">把十几斤重的灯具直接压在薄铝合金龙骨上，未按 NEC 410.36(B) 与 ASTM C636</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">在对角拉设锚固于混凝土楼板的独立 12 号镀锌钢丝，轻微碰撞即整片坍塌砸伤人。</text>


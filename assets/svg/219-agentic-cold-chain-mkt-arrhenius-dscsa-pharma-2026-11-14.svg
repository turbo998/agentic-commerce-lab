  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 21 CFR Part 11 温控芯片 ECDSA 签名链 + &gt;=0.5°C 防结冰锁：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 校验全程每 5 分钟硬件签名采样点，11ms 秒杀未签名 CSV 与 &lt;0.0°C 冻伤药；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 按阿伦尼乌斯方程计算 USP &lt;1079.2&gt; MKT &lt;= 8.0°C，14ms 揪出在途暴晒复冻！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. FDA DSCSA GS1 EPCIS 2.0 单盒序列号 1:1 核验：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 强制比对实物 2D 条码与电子 TI/TS 溯源单，100% 阻断问题召回批次入库。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 药典核验与参数化秒赔：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 超温子箱凭芯片签名 MKT 自动触发参数化冷链险秒赔，单批挽回 $43,200.00！</text>


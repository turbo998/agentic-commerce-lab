  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：卸货拿红外枪只测表面温度 + 算术平均温漏判在途暴晒复冻</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. “在途断电升温至 28°C，到港前 2 小时吹冷回 4.2°C”复冻欺诈：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 收货员拿红外测温枪只测卸货瞬间表面温度 (4.2°C 合格) 即放款 $540,000；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 箱内 GLP-1/单抗疫苗或顶级海鲜早已在途中高温变质失活！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 用算术平均温掩盖指数级热降解 &amp; 漏检 &lt;0.0°C 冰晶刺破蛋白：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 20 分钟 -1.5°C 过冷结冰直接令生物水针剂 100% 报废，算术平均温却显示 4.0°C。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 缺失 FDA DSCSA GS1 EPCIS 单盒四要素电子溯源报文：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 未核验 2D DataMatrix (GTIN+SN+Lot+Exp)，混入召回批号或非法串货假药。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

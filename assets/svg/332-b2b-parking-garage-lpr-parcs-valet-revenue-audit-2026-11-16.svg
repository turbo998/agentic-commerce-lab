  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">商业停车场与代客泊车对账：地感/LPR 1:1 闭环锁、钥匙柜工时锁 vs 手动抬杆吞钱与自保暴利</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_parking_garage_lpr_parcs_valet_revenue_share_audit_mandate_2026 · 15.0% Savings ($29,250 / Batch)</text>


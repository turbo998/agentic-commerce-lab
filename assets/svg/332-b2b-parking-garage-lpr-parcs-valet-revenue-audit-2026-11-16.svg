  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. A→B 双地感线圈 + LPR 物理出车 1:1 闭环 + 钥匙柜工时锁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">每辆触发出口 A→B 地感脉冲的车辆必须匹配 PARCS 付款或医院 HIS/酒店 PMS 免单</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">码；代客泊车工时强制核对智能钥匙柜取存日志，11ms 封杀手动抬杆吞钱与空岗。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 第三方真实保费封顶锁 + 严禁私吞 $3.99 扫码便利费门禁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">剥离运营商 16% 内部自保公司暴利加成，仅认第三方保单实付保费；强制清零或将</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">线上扫码便利费 100% 并入业主总营收分成池，14ms 阻断账外截留。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 PCI SSC P2PE 名录与市政停车税 (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 在线穿透核验道闸自助终端是否列入 PCI SSC Validated P2PE 硬件名录</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">及市财政局 Parking Occupancy Tax 月度足额完税回执，守住合规底线。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动倒扣无流水抬杆车费并砍除夜班空岗与自保水分 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动按全日最高票价从管理费倒扣 550 次异常抬杆、核减空岗工时并剥离自保加价：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $195,000.00 → 自动核减 $29,250.00 (15.0%) → 净付 $165,750.00！</text>


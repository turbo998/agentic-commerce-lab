  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统停车场与代客泊车外包四大黑洞 (Legacy Parking NOI Leakage: 20%–40%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 出口压线圈过车 1,200 辆却只报 980 辆（220 辆现金车被手动抬杆私吞）</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">高峰或球赛散场时，收费员收取车主 $25 现金后按“走错路倒出 / 故障免费放行”</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">(Manual Gate Override) 手动抬杆，PARCS 软件账面平账但业主每天蒸发 $5,500。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 医院/酒店代客泊车 (Valet) 深夜零接车却报销 8 名全职泊车员夜班工资</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">医院门诊下午 5 点关门后连续 7 小时零取送车，运营商却在实报实销工资单里塞入</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">8 名晚班泊车员（或跨项目借调人员）工时，每月向业主多报销 $28,000 人工费。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 总部 16% 自保责任险暴利分摊 + 私收车主 $3.99 扫码便利费独吞</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">按工资 16% 强收内部自保公司 Garagekeepers 擦碰险（高于真实保费 3 倍）；并在</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">扫码付页面向车主强加 $3.99 平台便利费，100% 进运营商子公司腰包不参与分成。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 无人道闸缴费机缺失 PCI P2PE 硬件加密被装盗刷器或拖欠市政停车税</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自助缴费机未使用 PCI SSC P2PE 认证加密读卡头导致访客银行卡被批量侧录，或</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">运营商挪用代收的 20% 市政停车税 (Municipal Parking Tax) 引发税务局查封大楼。</text>


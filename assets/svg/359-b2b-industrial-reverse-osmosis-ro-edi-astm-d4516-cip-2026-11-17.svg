  <text x="886" y="553" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ ORP &lt;= 250mV &amp; 中心管 7 点探针</text>
  <text x="886" y="573" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ NSF 60 阻垢剂 &amp; LAL 内毒素报告</text>
  <text x="886" y="593" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">☑ 零虚构坐标 · CSP 自包含沙盒通过</text>

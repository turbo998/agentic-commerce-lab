  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. ASTM D4516 25°C 温度标准化通量锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 水温每降 1°C 产水自然降 3% (12°C 实测少 32%)</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制按 TCF 折算 25°C NPF 衰减 &gt;=15% 才认定结垢</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截拿冬季冷水降产忽悠花 $28,000 换膜</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. $450 低pH/高pH 酸碱 CIP 在线清洗锁</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制先用 pH 2.0 柠檬酸 + pH 11.5 温水碱洗</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁跳过 $450 CIP 清洗直接拔掉 24 支 8040 膜</text>
  <text x="74" y="368" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 恢复 95%+ 通量，延长聚酰胺复合膜寿命至 5 年</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="426" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 中心管 7 点电导率探针 &amp; 余氯追责锁</text>
  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 1/4" 软管插入膜壳测井定位 $18 互连器 O 型圈串水</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 维保商断加 SMBS 致余氯烧穿膜片由服务商全额赔付</text>
  <text x="74" y="482" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断 $18 O 型圈漏水虚报 $4,800 整管换膜</text>


  <!-- Header -->
  <text x="48" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 357 · INDUSTRIAL &amp; HOSPITAL HIGH-PURITY REVERSE OSMOSIS (RO/EDI), ASTM D4516 &amp; $450 CIP GATE</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">工业与医院高纯水反渗透 (RO/EDI) ASTM D4516 25°C 标准化锁、$450 CIP 清洗与中心管探针清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Veolia / Evoqua / Ecolab / FilmTec · 25°C TCF 标准化通量锁 + $450 酸碱 CIP 门禁 + 中心管 7 点电导率探针 + AAMI ST108 / USP &lt;1231&gt;</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>

  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截缺失 LAL 内毒素 (&lt;0.25 EU/mL) 报告</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 满足血透中心与生物制药 WFI 零容忍合规</text>


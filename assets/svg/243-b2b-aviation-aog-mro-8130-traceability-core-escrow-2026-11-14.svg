  <text x="164" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#E0E7FF" text-anchor="middle">2026-11-14 · ROUND 241 · AVIATION AOG &amp; MRO</text>
  <text x="298" y="57" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">B2B 航空 AOG 航材与工业 MRO 清算：FAA 8130-3 溯源、旧件 BER 托管与 IATP 共享池架构</text>
  <text x="46" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#CBD5E1">Aviation AOG &amp; Industrial MRO: Digital 8130-3 / EASA Form 1, LLP Back-to-Birth &amp; Non-BER Core Escrow vs. SUP Counterfeits &amp; $95k Core Losses</text>
  <text x="46" y="106" font-family="Consolas, monospace" font-size="12" fill="#A5B4FC">Mandate Token: b2b_aviation_aog_mro_8130_traceability_core_escrow_mandate_2026_11_14 · Batch: $680,000.00 · Net IATP Optimized: $625,600.00 (-$54,400.00)</text>

  <!-- Left Column: Legacy AOG & Core Exchange Traps -->
  <rect x="28" y="132" width="596" height="398" rx="14" fill="url(#red-card)" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5">❌ 传统“AOG 恐慌看 PDF 打款 + 快递签收退押金”（四大停飞与坏账黑洞）</text>
  <text x="50" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#FECACA">Why Flat PDF 8130-3 Releases &amp; Blind Core Refunds Trigger Fleet Groundings &amp; $95k Write-Offs</text>

  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. 伪造扫描版 FAA Form 8130-3 / EASA Form 1 兜售非批准假航材 (SUP)</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 二道贩子利用飞机停场 (AOG 每小时亏 $5万) 恐慌，用 PS 篡改 PDF 适航挂签与限寿件 (LLP) 起落循环。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 报废涡轮盘混入机队，一旦被局方发 UPN 通告，整支机队强制停飞拆发，单台拆机损失超 $500,000！</text>

  <rect x="48" y="282" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">2. 周转件旧件 (Core Exchange) 凭快递签收盲目解冻 $95,000 押金</text>
  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 高价航材按“$35k 交换费 + 30天内退旧件 (否则扣 $95k 买断费)”交易；传统系统见快递签收即退押金。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 拆开包裹才发现退回的旧件内部已被烧穿判定为不可修复报废 (BER) 或被掉包成废铁壳，血亏 $95,000！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 漏检 FAA UPN 假件通告、强制适航指令 (AD) 与无 ASA-100 资质黑中介</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 未实时联查 FAA Unapproved Parts Notifications (UPN) 与未完成强制改装 AD 的存量件号。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 向未持有 ASA-100 / AS9120 认证或缺少无事故声明 (NIS) 的空壳公司付款，收货即成废品！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">4. 异地机场 AOG 遭现货黄牛坐地起价 300% 紧急溢价</text>
  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 采购 Agent 不懂得检索同机场《国际航司技术共享池 (IATP)》兄弟航司备件，高价向现货商挨宰。</text>
  <text x="64" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 跨洋包机调运备件额外耗费 18 小时停场费与高昂通关滞留成本。</text>


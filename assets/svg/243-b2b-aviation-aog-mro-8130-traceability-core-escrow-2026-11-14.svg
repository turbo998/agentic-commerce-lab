  <text x="684" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 独立冻结 100% 旧件买断押金；退回旧件必须核对机身拆下日志 (S/N) 一致且经内窥镜/台架确认为可修复。</text>
  <text x="684" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 一旦台架判定为 BER 报废或序列号被掉包，14ms 自动划扣押金赔付 (HTTP 422)！</text>

  <rect x="668" y="364" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>
  <text x="684" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">3. Microsoft Web IQ 联查 FAA UPN 通告、AD 指令与 ASA-100 (280ms → 451)</text>
  <text x="684" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• /v3/browse 280ms 穿透核验 FAA UPN / EASA SUP 假件黑名单与强制适航指令 (AD) 完成状态。</text>
  <text x="684" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 强制核验经销商 ASA-100 / AS9120 认证有效性，违规交易立即挂起 (HTTP 451)！</text>

  <rect x="668" y="446" width="564" height="68" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>
  <text x="684" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">4. 同机场 IATP 航材共享池调拨与 BER 防损立省 $54,400 (245ms → 409)</text>
  <text x="684" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 异地 AOG 自动匹配同机场 IATP 联盟航司共享备件，2 小时内直接装机起飞并免除黄牛溢价。</text>
  <text x="684" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FDE68A">• 在 $680,000.00 航材批次上立省 $54,400.00 (净结算 $625,600.00 · HTTP 409 Confirm)！</text>


  <text x="670" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#A7F3D0">Cryptographic 8130-3 / LLP Back-to-Birth Gate, Non-BER Bench Escrow &amp; IATP Pool Routing</text>

  <rect x="668" y="200" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>
  <text x="684" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">1. ATA Spec 2000 数字 8130-3 验签与 LLP Back-to-Birth 履历锁 (11ms → 403)</text>
  <text x="684" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 强制校验 Part 145 维修站硬件签名的数字 8130-3 / EASA Form 1、无事故声明 (NIS) 与出厂至今起落账本。</text>
  <text x="684" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 任何扫描版伪造 PDF、SUP 嫌疑件或限寿件履历断链，11ms 硬拦截 (HTTP 403)！</text>

  <rect x="668" y="282" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>

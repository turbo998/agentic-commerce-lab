  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反 12 CFR § 1026.19(f) 与 12 U.S.C. § 2607，面临三倍赔偿与联邦刑事追责。</text>


  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：听信邮件改账号被骗走 $45万首付 + 漏清旧房贷导致房子被查封</text>


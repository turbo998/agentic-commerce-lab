  <!-- Header -->
  <text x="48" y="58" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 324 · B2B REGULATED MEDICAL WASTE (RMW), BIOHAZARD AUTOCLAVING &amp; EPA RCRA E-MANIFEST RECONCILIATION</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">感染性医废与 RCRA 危废清运：去皮净磅重锁、EPA e-Manifest 闭环 vs 半空箱保底与 18% 复利暗涨</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_medical_biohazard_rcra_waste_epa_emanifest_autoclave_net_weight_mandate_2026 · 15.0% Savings ($25,500 / Batch)</text>

  <!-- Left Panel: Legacy Medical Waste Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统感染性医废与危废清运四大黑洞 (Legacy Medical Waste Leakage: 30%–65%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 仅装 6 磅纱布的半空红袋箱按 $55/箱满额保底收钱 (Flat-Tub Quota Gouging)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">诊所与病房按规定定期封箱，30 加仑红桶内实际仅 6 磅轻质纱布，服务商却按合同</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">保底 20 箱×$55=$1,100 固定一口价收费，折合每磅垃圾高达 $45（为空气买单）。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 普通高压蒸汽灭菌医废 ($0.42/lb) 混按 $4.50/lb 危废高温焚烧计费</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">90% 普通感染性红袋垃圾 (UN 3291) 只需高压蒸汽灭菌 (Autoclave)，清运商却不分类</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">扫码，全部按微量细胞毒/病理级高温旋转窑焚烧 ($4.50/lb) 开票，单价暴涨 10 倍。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 每半年自动触发 18% 复利暗涨 + 28% 自造“合规与环保恢复费”</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">合同隐藏自动调价条款 (API)，3 年内基准单价复利翻倍；同时在账单底部强加</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">18% Environmental + 10% Regulatory Compliance 自造附加费冒充政府法定税费。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. EPA e-Manifest 危废联单超 35 天未闭环引发医院 $70,000/天连带重罚</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">根据 RCRA 摇篮到坟墓终身追责法，转运商收钱后未将危废送达持证 TSDF 焚烧厂</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">完成 EPA RCRAInfo 电子签收，导致产废医院与药企直接遭受 EPA 巨额行政处罚。</text>


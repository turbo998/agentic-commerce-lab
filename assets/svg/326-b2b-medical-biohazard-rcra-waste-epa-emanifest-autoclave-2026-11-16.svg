  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 条码去皮实测净磅重锁 ($/Lb) + 红袋 Autoclave 分流 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">废除按箱保底一口价，强制扣除 4.5lb 塑料桶与可复用锐器盒皮重按净重计费；普通</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">UN 3291 红袋医废强制锁定 &lt;=$0.48/lb 高压蒸汽灭菌价，11ms 拦焚烧升档。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 合同基准单价锁 (&lt;=3% CPI) + 清零 28% 自造合规附加费 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">逐项比对 MSA 主协议初始费率表，14ms 硬拦截每半年 18% 自动复利调价 (API)</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">并 100% 剥离非政府征收的 28% Environmental / Regulatory Compliance 杂费。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 EPA RCRAInfo e-Manifest 闭环 (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 穿透核查联邦 EPA RCRAInfo 系统中的 Signed-by-TSDF 最终销毁签名哈希</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">与接收厂 ECHO 环保合规状态，未完成三方闭环销毁前严禁释放清算资金。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>

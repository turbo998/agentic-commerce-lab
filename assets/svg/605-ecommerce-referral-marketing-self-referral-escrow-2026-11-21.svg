  <rect width="1200" height="675" fill="url(#bg605)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent605)" rx="3" />

  <text x="40" y="58" class="title">老带新裂变营销 (Extole / Mention Me / ReferralCandy) 防自邀刷券与防退货骗奖托管架构</text>
  <text x="40" y="80" class="subtitle">Round 162 · 防 Gmail 加号别名/同收货地址自己邀请自己双吃 $40、防优惠券站截胡自然客 &amp; 30d 解冻净省 38% (SVG 605)</text>

  <!-- Left Card: 3 Referral Marketing Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大老带新裂变与拉新薅毛黑洞</text>
  <text x="56" y="164" class="card-title">1. “左手邀右手”自邀自买双吃 $40 (HTTP 403)</text>
  <text x="56" y="184" class="body">• 活动“邀好友各得 $20 无门槛券”：老客用 `bob+1@gmail.com`</text>
  <text x="56" y="202" class="body">  自己点自己的邀请链接注册“新号”，寄往同一个家庭地址/用同张卡</text>
  <text x="56" y="220" class="warn">• 1个人独吞新客 $20 + 老客推荐奖 $20，复购瞬间变成负毛利!</text>

  <text x="56" y="256" class="card-title">2. 新客下单秒发推荐奖，转头把新客单退掉 (HTTP 422)</text>
  <text x="56" y="276" class="body">• 小号下单付款第 1 秒，系统就把 $20 推荐奖励发到了大号账上</text>
  <text x="56" y="294" class="body">• 大号立刻用 $20 奖励买走正价货，随后小号申请全额取消/退货!</text>
  <text x="56" y="312" class="warn">• 或把邀请码贴到 Reddit/小红书优惠券贴，截胡本来在收银台的自然客!</text>

  <text x="56" y="348" class="card-title">3. 买 Google 品牌词广告或群发垃圾邮件拉新 (HTTP 451)</text>
  <text x="56" y="368" class="body">• 职业羊毛客在 Google 竞价购买 `"品牌名 + 优惠码"` 关键词</text>
  <text x="56" y="386" class="body">• 把品牌自己的官网挤到第 2 名，白赚成千上万笔 $20 拉新佣金</text>
  <text x="56" y="404" class="warn">• 或脚本群发未经同意的推荐邮件违反美国 CAN-SPAM 法案遭重罚!</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: SELF_REFERRAL_HOUSEHOLD_OR_ALIAS_COLLISION</text>
  <text x="70" y="502" class="warn">• HTTP 422: COUPON_SITE_LEAK_OR_UNESCROWED_REWARD_CLAIM</text>
  <text x="70" y="524" class="warn">• HTTP 451: BRAND_SEM_BIDDING_OR_ANNUAL_600_1099_CAP</text>
  <text x="70" y="546" class="mono">• HTTP 409:NAME_SHARE_PRIVATE_LINK_AND_TIERED_VIP_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: VERIFIED_NET_NEW_FRIEND_REFERRAL_200</text>
  <text x="70" y="596" class="body">铁律: 推荐人与被推荐人严禁共享卡指纹、设备或归一化收货地址!</text>

  <!-- Center Card: 4-Stage Referral Anti-Gaming Escrow Architecture -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶老带新防自邀图谱与托管架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#ef4444" />
  <text x="450" y="175" class="card-title" fill="#fca5a5">Gate 1: 五维家庭图谱去重锁 (Anti-Self-Referral) (HTTP 403)</text>
  <text x="450" y="195" class="body">• 剥离邮箱 `.` 与 `+tag` 归一化；强制比对推荐人 (Advocate) 与好友的:</text>
  <text x="450" y="213" class="body">  `Stripe Card Fingerprint` + `USPS 标准收货地址哈希` + `设备指纹/IP`</text>
  <text x="450" y="231" class="mono">• 命中任一相同特征 (自己邀自己或同室友互刷) -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="282" class="card-title" fill="#38bdf8">Gate 2: 推荐奖励 T+30d 退货期托管与防插件截胡 (HTTP 422)</text>
  <text x="450" y="302" class="body">• 被推荐新客首单必须满足 `实付净额 &gt;= $60`，且推荐人的 $20 奖励</text>
  <text x="450" y="320" class="body">  必须锁定在 `PENDING_ESCROW` 满 30 天确认新客未退货才解冻发放!</text>
  <text x="450" y="338" class="body">• 识别来自优惠券聚合网 (`Referer == coupon_site`) 的公网链接自动失效</text>
  <text x="450" y="354" class="mono">• 企图新客未过退货期就提走推荐奖或公网发码截胡 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: 品牌词竞价封禁与 $500 年度奖励封顶 (HTTP 451)</text>
  <text x="450" y="419" class="body">• 拦截带有 `gclid` 搜索品牌词广告点击的违规拉新流量</text>
  <text x="450" y="437" class="body">• 普通个人推荐人全年累计奖励硬锁 `&lt;= $500` (规避美国 IRS Form 1099</text>
  <text x="450" y="455" class="mono">  `$600` 税务申报红线与职业羊毛团伙规模化套利) -&gt; HTTP 451</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#10b981" />
  <text x="450" y="508" class="card-title" fill="#6ee7b7">Gate 4: 实名口令分享 (Name-Share) 与满额双赢券 (HTTP 409)</text>
  <text x="450" y="528" class="body">• 仿 Mention Me 机制: 无需复制丑陋链接，好友在结账页输入推荐人全名</text>
  <text x="450" y="546" class="body">  并验证私密好友关系，即可获得绑定该新客手机的单次满 $75 减 $20 券</text>
  <text x="450" y="566" class="mono">• 将“无门槛白送 $20”升级为“满 1.3x 平均客单价才可抵扣”</text>
  <text x="450" y="586" class="mono">• 100% 剔除自邀刷单 + 杜绝优惠网截胡 -&gt; 净省 38% 裂变获客成本</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大老带新裂变与反作弊底座</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Extole / Impact Advocate (企业级防刷图谱)</text>
  <text x="846" y="182" class="body">• 优势: 金融与大型零售标杆，原生构建跨账号设备、支付卡指纹与</text>
  <text x="846" y="198" class="body">  收货地址相似度图谱，毫秒级拦截“左手邀右手”自邀团伙</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. Mention Me (Share-by-Name 私域口碑引擎)</text>
  <text x="846" y="244" class="body">• 优势: 独创“按朋友真实姓名推荐”机制，无静态公开优惠码可被</text>
  <text x="846" y="260" class="body">  Honey 插件或优惠券网站爬虫抓取，100% 保证纯增量社交推荐</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. ReferralCandy / Friendbuy (Shopify 生态)</text>
  <text x="846" y="306" class="body">• 优势: 原生支持 `Reward Holding Period` (30–45 天退货观察期)</text>
  <text x="846" y="322" class="body">• 特性: 自动巡检优惠券网站泄露链接并一键熔断违规推荐码</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. 微信社交立减金“社交关系链 + 实名支付锁”</text>
  <text x="846" y="368" class="body">• 经验: 依托微信支付底层身份证实名哈希去重，哪怕换 10 个手机号</text>
  <text x="846" y="384" class="body">  只要底层实名认证同属一人，立判“非新客”拒绝发放拉新补贴</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度老带新自邀骗补与优惠网截胡池 ($95,000)</text>
  <text x="860" y="456" class="body">• 传统小号自邀双吃+优惠网截胡+秒退骗奖: $95,000/季</text>
  <text x="860" y="476" class="mono">• 卡指纹+归一化地址图谱拦截老客自邀自买: -$17,100</text>
  <text x="860" y="496" class="mono">• T+30d 退货期解冻锁与封杀优惠券网站外链: -$11,400</text>
  <text x="860" y="516" class="mono">• 满 1.3x AOV 门槛双赢券拉升新客首单毛利: -$7,600</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净裂变获客成本: $58,900 (净省 $36,100 / -38%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: referral_anti_gaming_optim_409</text>
</svg>

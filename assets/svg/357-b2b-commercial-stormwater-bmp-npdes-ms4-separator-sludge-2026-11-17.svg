  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统地下雨水旋流井清掏与海绵设施维保四大黑洞 (Legacy Stormwater Leakage: 35%–60%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 不撇除上清液，把井里 10 吨干净雨水抽进罐车按 $550/吨“含油危废污泥”收 $5,800</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">旋流井 (Stormceptor) 平时存有 2,500 加仑静止雨水，底泥仅 1 吨；不良车队故意不把</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">上层清水抽回管网 (Decant)，连水带泥抽满一车去过磅，让你花 $5,800 为天上的雨水买单。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 池底只有 2 英寸泥沙（远未达 15% 法定清掏阈值），每季度强行派吸污车刷单</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">不用透明刻度取样管 (Sludge Judge) 测量底泥真实厚度，欺负物业看不见地下黑井底，</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">在泥深还不到 15% 储泥容量（无需清掏）时每季度开吸污车来抽一回清水骗钱。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. $280 珍珠岩/沸石散装滤料包更换，被虚报为 $12,000 换整套 StormFilter 滤筒壳</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">地下雨水过滤系统 (Contech StormFilter) 的 HDPE 高分子外壳可重复使用 25 年，只需</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">倒掉旧颗粒换入 $280 滤料包，维保商却谎称整批 20 个滤筒总成报废强收 $12,000。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 拿高压水枪乱冲透水砖堵死基层，且无 EnviroCert CESSWI 证漏报市政 MS4 年报</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">高压水枪把表面细泥冲进碎石垫层堵死土工布（违反 ASTM C1781 真空吸扫规程），</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">且检查员无 CESSWI 环保资质漏交市政 MS4 年报，招致环保局 $10,000/天罚单。</text>


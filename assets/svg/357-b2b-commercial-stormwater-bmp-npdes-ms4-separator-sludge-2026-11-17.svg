  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">几何湿泥重量封顶结算，11ms 硬拦截把 10 吨上层雨水当危废污泥称重的骗局。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. $280 珍珠岩/沸石散装滤料换芯锁 + 透水砖真空吸扫锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">完好 StormFilter HDPE 滤壳一律锁定更换 $280 散装滤料包；透水铺装强制采用再生</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">空气真空吸扫车并校验 ASTM C1781 &gt;=20 in./hr 渗透率，14ms 封杀换壳与水枪毁砖。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#06B6D4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 EnviroCert CESSWI 证与 MS4 回执 (265ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">265ms 在线穿透核验国际环境认证学会 EnviroCert (CESSWI / CPESC / CPSWQ)</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">注册名录、Stormceptor 官方泥深表及市政 EPA NPDES MS4 年报归档回执。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动剥离吸污车 9 吨雨水重量并将 $12k 换滤筒降级为换滤料 (230ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动剔除未撇除的上清液雨水吨位水分并将 StormFilter 整筒更换降为散装换料：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $122,000.00 → 自动核减 $18,300.00 (15.0%) → 净付 $103,700.00！</text>


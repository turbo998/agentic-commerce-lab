  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_commercial_stormwater_bmp_npdes_ms4_separator_sludge_mandate_2026 · 15.0% Savings ($18,300 / Batch)</text>


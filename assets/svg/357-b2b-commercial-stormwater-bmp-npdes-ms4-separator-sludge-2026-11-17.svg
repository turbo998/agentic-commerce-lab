  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Sludge Judge &gt;=15% 泥深触发锁 + 几何净泥体积封顶锁 (11ms → HTTP 403)</text>

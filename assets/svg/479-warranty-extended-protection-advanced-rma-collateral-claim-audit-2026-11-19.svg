<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg479" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111E" />
      <stop offset="50%" stop-color="#102138" />
      <stop offset="100%" stop-color="#081322" />
    </linearGradient>
    <linearGradient id="accent479" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg479)" />
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent479)" />

  <!-- Header -->
  <text x="44" y="48" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 36 · EXTENDED WARRANTY, ADVANCED EXCHANGE RMA COLLATERAL &amp; AUTHORIZED REPAIR AUDIT</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">3C 家电延保、先行换新（Advanced RMA）与维修网点审计：防碎屏后补买保险与防换板欺诈</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">AppleCare+ / Extend / Clyde vs 京东全保换新 / Assurant vs 180d SPT Collateral vs Azure Foundry + Telemetry Gate</text>

  <!-- Left Panel: 3 Core Warranty & Advanced RMA Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 延保理赔与先行换机三大资损黑洞</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. 手机摔碎屏幕后才找 Agent 补买延保骗理赔</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 购机 15 天内允许补买意外险，机主在第 10 天摔碎</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  屏幕后立刻花 $99 补买延保，隔天报案骗取 $600 新屏</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：购后补买强制远程硬件诊断 + 对镜连拍视频</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  验机锁 (HTTP 403 拦截逆向选择骗保)</text>

  <rect x="62" y="328" width="314" height="132" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="76" y="352" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2. 先行发新机(Advanced RMA)不退旧机与虚报换板</text>
  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 先寄出 $1,200 替用新机后买家失联或寄回华强北模</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  型机；或外包维修点把 $49 换电池虚报成 $600 换主板</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：新机全额质押预授权锁 + 旧件主板 SN 加密</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  配对核销门禁 (HTTP 422 拦截骗机与虚报)</text>

  <rect x="62" y="474" width="314" height="134" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 厂商官方电池召回本应免费却走商业延保赔付</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 该批次笔记本/充电宝已触发 CPSC 官方免费召回</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ 官方召回优先权分流 (HTTP 451)</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 修换残值比价寻优 (维修费&gt;残值70%转直赔换新)</text>
  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  与旧件回收回血立省 24% (HTTP 409)</text>

  <!-- Center Panel: 5-Lane Deterministic Gate -->
  <rect x="414" y="132" width="402" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="434" y="164" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ 延保理赔与先行换新（RMA）五车道状态机</text>

  <rect x="434" y="184" width="362" height="72" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="450" y="208" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 200 · DIAGNOSTIC_VERIFIED_AND_RMA_AUTHORIZED</text>
  <text x="450" y="228" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">投保验机完好 + 质押令牌已锁 + 旧件SN配对通过 (10ms)</text>
  <text x="450" y="245" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">warranty_advanced_rma_collateral_mandate_*</text>

  <rect x="434" y="268" width="362" height="72" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
  <text x="450" y="292" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 403 · CRASH_THEN_INSURE_WITHOUT_DIAG_BLOCKED</text>
  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截购后补买延保未通过远程硬件自检与对镜触控完好性验证</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">post_purchase_diag_pass = false | lcd_touch_ok = false</text>

  <rect x="434" y="352" width="362" height="72" rx="8" fill="#431407" stroke="#F97316" stroke-width="1.5" />
  <text x="450" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 422 · UNCOLLATERALIZED_RMA_OR_PART_PADDING_BLOCKED</text>
  <text x="450" y="396" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截无全额质押先行发新机或维修网点未退原厂旧主板虚报索赔</text>
  <text x="450" y="413" fill="#FDBA74" font-family="Consolas, monospace" font-size="11">collateral_hold_ok = false | old_board_sn_match = false</text>

  <rect x="434" y="436" width="362" height="72" rx="8" fill="#3B0764" stroke="#A855F7" stroke-width="1.5" />
  <text x="450" y="460" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 451 · WEBIQ_OEM_RECALL_FREE_REPAIR_HOLD</text>
  <text x="450" y="480" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="12">Web IQ 检出该机型属 CPSC/OEM 法定免费召回范围优先走原厂</text>
  <text x="450" y="497" fill="#D8B4FE" font-family="Consolas, monospace" font-size="11">cpsc_oem_recall_active = true | key_age &gt; 180d</text>

  <rect x="434" y="520" width="362" height="88" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.5" />
  <text x="450" y="544" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 409 · COLLATERAL_RMA_AND_SALVAGE_TRIAGE_CONFIRM</text>
  <text x="450" y="564" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="12">180d SPT 换机质押 + 修换残值比价分流 + 旧件回血立省 24%</text>
  <text x="450" y="584" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">季度 3C 家电延保与先行换机结算池 $340,000 → 净赔付成本 $258,400 (省 $81,600)</text>

  <!-- Right Panel: Platform Selection Matrix -->
  <rect x="836" y="132" width="320" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="856" y="164" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🧭 延保与先行换新平台选型</text>

  <rect x="854" y="184" width="284" height="100" rx="8" fill="#1E293B" />
  <text x="868" y="206" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Extend / Clyde / Mulberry (嵌入式延保 API)</text>
  <text x="868" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 结账页一键勾选延保，保费由承保商与商户分成</text>
  <text x="868" y="246" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 痛点：购后补买(Post-Purchase)逆向骗保风控弱</text>
  <text x="868" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：品牌独立站、家電家居与运动器材零售商</text>

  <rect x="854" y="298" width="284" height="100" rx="8" fill="#1E293B" />
  <text x="868" y="320" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">AppleCare+ / 京东全保换新 / Assurant (重履约)</text>
  <text x="868" y="340" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 支持 Express Replacement 先发新机上门换旧机</text>
  <text x="868" y="360" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强绑设备底层硬件诊断序列号与 Find My 锁检查</text>
  <text x="868" y="380" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：高单价智能手机、显卡服务器与智能硬件</text>

  <rect x="854" y="412" width="284" height="196" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="868" y="436" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">★ 推荐：Foundry + 远程验机 &amp; 质押 RMA 网关</text>
  <text x="868" y="458" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 购后补买强制跑硬件自检 + 对镜触控验证</text>
  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 先行换新绑定 180d SPT 全额质押防失联</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 维修网点结算强制核对拆下旧主板原厂 SN</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. CPSC 召回免赔分流 + 残值比价立省 24%</text>
  <rect x="868" y="542" width="256" height="50" rx="6" fill="#022C22" />
  <text x="880" y="563" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">审计标签：provenance = synthetic</text>
  <text x="880" y="581" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="11">independently_reproduced = false</text>
</svg>

  <text x="52" y="66" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">
    ROUND 379 · FAQ #498 · SVG #822 · SANDBOX #272 · TEST #1,376
  </text>
  <text x="52" y="102" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">

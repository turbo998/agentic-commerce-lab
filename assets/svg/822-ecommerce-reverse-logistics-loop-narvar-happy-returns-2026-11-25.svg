  </text>
  <text x="52" y="130" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Loop Returns vs. Narvar vs. Happy Returns vs. AfterShip + Weight/IMEI Scan Lock, Wardrobing Veto &amp; Bonus-Credit Exchange
  </text>

  <!-- Panel 1 -->
  <rect x="52" y="156" width="350" height="390" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="1.8" />
  <rect x="52" y="156" width="350" height="42" rx="14" fill="#7f1d1d" />
  <text x="72" y="183" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    1. FTID &amp; Instant-Refund Card Hold (403)
  </text>
  <text x="72" y="222" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    Problem: Fake Tracking ID (FTID) &amp; Box-of-Rocks
  </text>
  <text x="72" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    • Fraudsters alter return label address (FTID) or
  </text>
  <text x="72" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    ship empty envelopes to trigger "Scan-Based Refund"
  </text>
  <text x="72" y="284" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    • Or take Instant Exchange without a valid card hold
  </text>
  <rect x="72" y="304" width="310" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1" />
  <text x="86" y="328" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">
    if Carrier_Weight_Delta &gt; 15% or not Card_Auth:
  </text>
  <text x="86" y="348" fill="#fecaca" font-family="Consolas, monospace" font-size="12">
    raise HTTP_403_FTID_WEIGHT_OR_HOLD_CARD_VETO
  </text>
  <text x="86" y="366" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">
    # Require in-person Return Bar QR or WMS dock inspection
  </text>
  <text x="72" y="404" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    Platform Fit: Loop Returns / Happy Returns
  </text>
  <text x="72" y="426" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Happy Returns Return Bar verifies item in person
  </text>
  <text x="72" y="446" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Loop Instant Exchange places Stripe $Auth Hold
  </text>
  <text x="72" y="466" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Auto-captures hold if return not received in 14d
  </text>

  <!-- Panel 2 -->
  <rect x="425" y="156" width="350" height="390" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" />
  <rect x="425" y="156" width="350" height="42" rx="14" fill="#78350f" />
  <text x="445" y="183" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">

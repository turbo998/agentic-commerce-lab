  <text x="54" y="562" class="body">• mRNA-LNP 严禁“仅看紫外 A260 与常规 HPLC 盲付”：A260 分不清游离与包封 RNA，而 0.2% 叔胺氮氧化物就会生醛共价焊死 mRNA 阻断翻译。</text>
  <text x="54" y="584" class="body">• 必须将 RiboGreen 包封率 (&gt;=92%)、DLS PDI (&lt;=0.12)、N-Oxide (&lt;=0.1%) 与硅基芯片 SIP 复用绑定为智能托管解锁谓词。</text>

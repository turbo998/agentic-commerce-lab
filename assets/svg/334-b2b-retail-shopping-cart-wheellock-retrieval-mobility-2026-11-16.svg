  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动将误锁轮降级为 $0 射频复位并砍除自盗找回费 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将无硬件损坏的锁轮降为 $0 复位或 $14 普通轮、剔除无出界日志找回赏金：</text>

  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">去重)；换 $185 智能轮须上传旧轮 RF 序列号电路故障码，11ms 拦自盗与乱换轮。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>

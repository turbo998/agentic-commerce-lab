  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商超手推车寻回与维保四大黑洞 (Legacy Cart Fleet Leakage: 28%–50%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 寻车外包队半夜自己从停车场偷拉 60 辆推车，白天送回后门骗 $12/辆赏金</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">超市按辆付赏金雇皮卡车队去街区找回遗弃推车；不良车队凌晨 2 点直接从门店车棚</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">偷运走好推车藏起来，第二天拉回后门让收货员签字，单店每月白骗数千美元。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 将 $14 普通聚氨酯后轮卡死或误触发锁死，一律谎报为 $185 智能电子锁轮报废</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">推车 3 个普通轮仅 $14/只，前排 1 个智能电子锁轮 (SmartWheel) 贵达 $185；明明只需</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">用遥控器 3 秒射频复位 ($0) 或换普通后轮，维保商却全部按更换智能锁轮开票。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 电动残障代步车 (ADA Scooter) 忘插电被换 $550 双电瓶 + 天线断路照收找回费</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">店员忘把代步车插上插座充电，维修工不做负载测试直接换走两块完好 AGM 电池；</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">且故意不修断路的停车场地下防盗天线，任由推车被推走以赚取更多街区找回赏金。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 漏检 ASTM F2372 儿童座椅安全带卡扣引发幼童跌落脑震荡百万索赔</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">收了全车队季度预防性保养费，却未逐辆检查并补齐断裂的儿童座椅安全带，导致</text>

  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">更换 ADA 电动代步车电池强制上传 12V AGM 内阻与充电器检测单；凡因维保商未修好</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">埋地防盗天线期间流失的推车，街区找回费 14ms 强制归零由维保商自负。</text>


  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 在线穿透核验全店购物车 ASTM F2372 儿童安全带卡扣 100% 完好巡检签字</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">及市政城管局 Abandoned Cart Impound 官方赎回规费收据，杜绝安全与罚单欺诈。</text>


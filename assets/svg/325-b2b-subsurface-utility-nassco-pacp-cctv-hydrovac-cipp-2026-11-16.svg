  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统地下管网清淤、探测与修复四大黑洞 (Legacy Subsurface Leakage: 28%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 吸污车去地磅前灌入 11 吨消防栓自来水冒充 $420/吨污泥 (Slurry Padding)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">联合吸污车只吸了 3 吨管底泥沙，不开启排水阀沥干，反而在路边消防栓灌入 11 吨</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">自来水凑成 14 吨满罐泥浆过磅，单车次骗取 $4,620 自来水运费与危废处置费。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 看旧图纸 (QL-D) 喷油漆冒充 $1,200/坑真空开挖实测 (QL-A Upcoding)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">按 ASCE 38-22 标准，QL-A 必须水力真空挖出探坑露出地下管线外壁实测埋深；</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">勘测队只看旧图纸在路面喷漆，却虚报 40 个 QL-A 探坑收 $48,000 导致挖断光缆。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 1 处接头树根入侵 (只需 $2,200 点修) 夸大为 $91,000 全管段 CIPP 翻新</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">350 英尺排水管仅 1 处承插口有树根（缺陷占比 1.7%），其余管壁完好，承包商却</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">忽悠整条管道按 $260/英尺做全长紫外光固化内衬 (UV-CIPP)，溢价超 40 倍。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 未办州级 811 动土许可野蛮开挖 + UV-CIPP 内衬壁厚缩水未完全固化</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">未取得 811 One-Call 管线权属方全员回复即盲目动土；或将 9.0mm 设计壁厚偷减</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">为 5.5mm 且加快紫外灯架拉速导致树脂未交联，半年后内衬软管在水压下扁塌。</text>


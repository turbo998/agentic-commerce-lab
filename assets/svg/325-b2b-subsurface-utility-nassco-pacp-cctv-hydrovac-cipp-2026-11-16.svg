  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动将局部缺陷降级为 $2,200 点状修复并扣除游离水重 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将非必要全管段 CIPP 改写为局部树脂点修并剥离吸污车自来水吨位：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $215,000.00 → 自动核减 $32,250.00 (15.0%) → 净付 $182,750.00！</text>


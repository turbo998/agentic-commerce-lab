  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">地下管网探测与非开挖修复：干泥含固率锁、PACP 缺陷密度 vs 吸污车灌自来水与 1处树根报 $91k 整修</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_subsurface_utility_locating_nassco_pacp_cctv_hydrovac_cipp_rehab_mandate_2026 · 15.0% Savings ($32,250 / Batch)</text>


  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 静置排水干泥吨位锁 (&gt;=35% 固含量) + QL-A 管顶 RTK 照 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">强制吸污车按沥水后实测含固率折算干基吨位；凡按 ASCE 38-22 QL-A 计费的探坑</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">必须上传露出管顶标尺与厘米级 RTK-GPS 水印照，11ms 拦灌水增重与假探坑。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. NASSCO PACP 缺陷密度门禁 (&lt;15% 禁整管翻新) + 壁厚锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动解析 PACP 数据库计米器脉冲，4–5 级结构缺陷长度占比 &lt;15% 时严禁批复整管</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">CIPP；强制校验 UV 灯车牵引速度、红外固化温度曲线与 ASTM D790 管端样块壁厚。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 811 动土许可与 NASSCO 执照 (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 穿透核查州级 811 One-Call Positive Response 门户（确认燃气/电力/光缆</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">全员已标定 Clear）与评估员 NASSCO PACP/LACP/MACP 认证编号有效性。</text>


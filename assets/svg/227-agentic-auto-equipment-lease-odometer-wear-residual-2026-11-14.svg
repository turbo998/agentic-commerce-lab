  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 225 · AUTO &amp; EQUIP LEASE</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体汽车与重型机械经营性租赁多 ECU 防调表、50mm 磨损标尺与残值清算架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">IPC+ECM+ABS+BMS 四源里程互验 + CFPB Reg M 正常磨损豁免令牌 (`agentic_equipment_auto_lease_odometer_wear_residual_mandate_...`)</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red227)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：$99 调表器抹掉 5 万英里骗退押金 + 对正常小划痕乱收天价整备费</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. CAN 总线里程阻断器 (Mileage Blocker) 与仪表盘刷表欺诈：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 承租人实际跑了 8.6 万英里 (应补交 $12,500 超里程费)，退租前刷回 3.4 万英里；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 只看仪表盘的 AI 当场被骗退还全额押金，且调表车流入拍卖场触发联邦三倍赔偿重罚！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 对 &lt;50mm 正常轻微划痕乱扣 $1,200 或转嫁二手车行情跌价：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反美国《消费者租赁法 (15 U.S.C. § 1667b / CFPB Reg M)》，招致集体诉讼。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 退租车辆过户缺失 NHTSA 49 CFR Part 580 法定电子里程签名：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 缺乏硬件级里程真实性披露证明，导致金融公司无法在二手拍卖场完成合规交割过户。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：四源 ECU 里程互验 + 50mm 激光磨损标尺 + Reg M 清算网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. UDS 加密读取 IPC + ECM/BMS 能量积分 + ABS 轮速四源守恒：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 交叉比对仪表盘、车轮物理滚动周长积分与电池终身累计放电千瓦时 (误差 ≤1%)，</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 100% 揪出任何 CAN 总线里程阻断器与 EEPROM 刷表欺诈，挽回 $12,500+ 超里程费！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 3D 激光标尺 (&lt;50mm 划痕与 ≥4/32" 轮胎 100% 免赔) + 残值隔离：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 严守 CFPB Reg M 正常磨损豁免边界；封闭式租约绝不向客户转嫁二手车行情跌幅。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms NHTSA 披露与追偿增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动追回隐蔽调表超里程折旧并省去人工复检成本，单批立省 $58,400.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>

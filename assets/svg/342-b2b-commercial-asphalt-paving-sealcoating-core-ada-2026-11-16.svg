  <text x="636" y="156" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">✅ 地磅钻芯压实锁 + 航拍 GIS 净沥青面积锁 + Web IQ ADA 502 架构</text>

  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 拌合站地磅吨位 (110 lbs/sy/in) + 钻芯厚度 + &gt;=92% 压实度锁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">强制核算沥青厂电子地磅票总吨数、抽检钻芯实测厚度及 ASTM D2950 核子密实度</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">&gt;= 92% Gmm，11ms 硬拦截 1.1 英寸薄皮偷工减料与压实不足。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 航拍 GIS 净沥青面积锁 (扣屋顶/绿岛) + 雾封层波美比重锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">绑定高分辨率 GIS 多边形扣除大楼屋顶、混凝土卸货区与绿化岛后的净黑地面上限，</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">并核验封层原液比重与 2–3 lbs/gal 石英砂配比，14ms 封杀毛面积注水与黑水刷地。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 C-12/DOT 牌照与 ADA &lt;=2.08% 坡度 (270ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">270ms 在线穿透核验州级 C-12 / DOT 道路承包商牌照，并强制校验全部 ADA 无障碍</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">车位与轮椅通道数字水平仪全向坡度 &lt;= 2.08% (1:48)，彻底清零诉讼隐患。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动剔除大楼屋顶/绿岛虚报面积并按实交沥青吨位核销 (235ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将雾封层计费面积从毛地块面积折算为 GIS 净沥青面积并核减冷灌胶差价：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $158,000.00 → 自动核减 $23,700.00 (15.0%) → 净付 $134,300.00！</text>


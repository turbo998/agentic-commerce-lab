  <!-- Header -->
  <text x="48" y="58" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 340 · B2B COMMERCIAL ASPHALT PAVING, SEALCOATING &amp; ADA SECTION 502 PARKING-LOT STRIPING</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">商业停车场沥青摊铺与雾封层结算：地磅钻芯锁、GIS 净面积锁 vs 1.1 英寸偷薄与把屋顶算进铺路面积</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_commercial_asphalt_paving_sealcoating_core_density_ada_striping_mandate_2026 · 15.0% Savings ($23,700 / Batch)</text>

  <!-- Left Panel: Legacy Commercial Paving Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业停车场铺路与雾封层四大黑洞 (Legacy Paving Leakage: 30%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 合同签 2.5 英寸压实沥青，实际只铺 1.1 英寸薄皮 (Skin-Patch Tonnage Scam)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">利用刚压平表面全黑看不出深浅，把 2.5 英寸热拌沥青偷减成 1.1 英寸薄壳，净吞</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">55% 沥青拌合站材料吨位费且压实度不足 88%，重卡碾压半年即全碎成龟裂纹。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 把商场 80,000 平尺大楼屋顶、水泥卸货坪与绿化树池全算进雾封层刷漆面积</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">直接拿市政地块总占地面积（Gross Parcel Acreage）乘单价开票，未扣除中间庞大的</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">超市建筑基底、混凝土垃圾站与景观绿岛，导致业主白白为“给屋顶刷沥青”多付 35%。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 雾封层涂料狂兑 60% 自来水且不加石英砂（“黑水刷地”一场暴雨冲光且打滑）</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">违反 ASTM D8099 配比（<=20% 水 + 2–3 lbs/gal 石英砂），往罐车里兑大半车水，</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">刷完当天乌黑发亮骗过验收，两周后露底且雨天变成溜冰场；裂缝用冷灌水顶替热熔胶。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. ADA 无障碍车位铺完坡度达 3.5%（超 2.08% 法定红线），遭职业索赔律师连环起诉</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">未用数字水平仪找平，导致无障碍车位与 8 英尺轮椅通道斜坡超过联邦 ADA Section</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">502.4 的 1:48 (2.08%) 上限，沦为职业原告提款机，单店和解与返工损失 $25,000。</text>

  <!-- Right Panel: Agentic Weigh-Ticket/Core Lock + GIS Net Area + Web IQ ADA Architecture -->

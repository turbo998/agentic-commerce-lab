  <text x="439" y="182" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. Deterministic Ski &amp; Rental Escrow Engine</text>

  <rect x="439" y="202" width="322" height="82" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="455" y="226" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 1 · BLACKOUT CALENDAR &amp; VCC LOCK</text>
  <text x="455" y="248" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Cross-checks hotel dates vs Epic/Ikon blackout</text>
  <text x="455" y="268" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12">table + single-season VCC blocks spring renewal</text>

  <rect x="439" y="298" width="322" height="86" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
  <text x="455" y="322" fill="#a5b4fc" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 2 · 08:30 AM LIFT TELEMETRY &amp; P-TEX</text>
  <text x="455" y="344" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Holds RFID activation if &lt;50% vertical lifts open</text>
  <text x="455" y="364" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">+ bundles $0-deductible P-Tex rock damage waiver</text>

  <rect x="439" y="398" width="322" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="455" y="422" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 3 · ISO 11088 DIN &amp; SNOWPACK GATE</text>
  <text x="455" y="444" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Requires electronic binding DIN release test</text>
  <text x="455" y="464" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">matching skier height/weight/BSL + snow depth</text>

  <rect x="439" y="502" width="322" height="102" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="455" y="526" fill="#fcd34d" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 4 · 4-PACK PASS &amp; CHALET DELIVERY (409)</text>
  <text x="455" y="548" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Locks pre-season 4-Day Pass ($98/d vs $299/d) +</text>
  <text x="455" y="568" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">off-mountain chalet ski delivery (-30% vs base)</text>
  <text x="455" y="588" fill="#fde68a" font-family="Consolas, monospace" font-size="12">Quarterly Savings: $30,800 / $110,000 (28.0%)</text>


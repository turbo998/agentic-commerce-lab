  <!-- Header -->
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUND 89 · SVG 532 · SKI PASS, MULTI-RESORT LIFT TICKET &amp; DEMO RENTAL ESCROW</text>
  <text x="56" y="100" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Ski &amp; Resort Agent: Blackout-Date Sync, &gt;=50% Lift-Open Gate &amp; P-Tex Damage Waiver</text>
  <text x="56" y="126" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Epic Pass / Ikon Pass / Black Tie Ski / GOSKI (滑呗) — Blocking $299 Window Gouging, Wind-Hold Traps &amp; $350 Base Claims</text>
  <rect x="960" y="54" width="184" height="36" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="1052" y="77" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">28% SKI TCO SAVED</text>

  <!-- Left Panel: 3 Commercial Traps -->
  <rect x="52" y="150" width="345" height="475" rx="14" fill="#111827" stroke="#ef4444" stroke-width="1.2"/>
  <text x="72" y="182" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. Ski Pass &amp; Resort Rental Traps</text>

  <rect x="70" y="200" width="309" height="126" rx="10" fill="#1f2937" stroke="#dc2626" stroke-width="1"/>
  <text x="84" y="224" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap A: Holiday Blackout &amp; $299 Window</text>
  <text x="84" y="246" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Books peak hotel on Base Pass without noticing</text>
  <text x="84" y="266" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  holiday blackout -&gt; forced to pay $299/d window</text>
  <text x="84" y="286" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Silent $1,050 spring Season Pass auto-renewal</text>
  <text x="84" y="306" fill="#fca5a5" font-family="Consolas, monospace" font-size="11">Guard: HTTP 403 BLACKOUT_MATRIX_AND_ZERO_RENEW</text>

  <rect x="70" y="340" width="309" height="126" rx="10" fill="#1f2937" stroke="#f97316" stroke-width="1"/>
  <text x="84" y="364" fill="#fed7aa" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap B: Gondola Wind-Hold &amp; P-Tex Claim</text>
  <text x="84" y="386" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 50-knot wind shuts 85% of mountain; resort</text>
  <text x="84" y="406" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  refuses refund for bunny-hill-only day</text>
  <text x="84" y="426" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Rental shop bills $350 deposit for base scratch</text>
  <text x="84" y="446" fill="#fdba74" font-family="Consolas, monospace" font-size="11">Guard: HTTP 422 LIFT_OPEN_50PCT_AND_PTEX_WAIVER</text>

  <rect x="70" y="480" width="309" height="124" rx="10" fill="#1f2937" stroke="#a855f7" stroke-width="1"/>
  <text x="84" y="504" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap C: Avalanche Closure &amp; DIN Fault</text>
  <text x="84" y="526" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Canyon highway closed by avalanche control or</text>
  <text x="84" y="546" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  &lt;20% trails open; missing ISO 11088 DIN test</text>
  <text x="84" y="566" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Stale mandate signing key (&gt;180 days)</text>
  <text x="84" y="586" fill="#d8b4fe" font-family="Consolas, monospace" font-size="11">Guard: HTTP 451 WEBIQ_AVALANCHE_OR_DIN_HOLD</text>

  <!-- Center Panel: Deterministic Control Plane -->

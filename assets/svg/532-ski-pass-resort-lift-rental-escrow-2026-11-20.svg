  <text x="835" y="500" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Platform Selection Matrix:</text>
  <text x="835" y="520" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Vail Epic / Alterra Ikon: Multi-resort pass tiers</text>
  <text x="835" y="538" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Ski Butlers / Black Tie: In-chalet fitting + waiver</text>
  <text x="835" y="556" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Mountain Collective / Indy Pass: Zero-blackout tier</text>
  <text x="835" y="574" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• GOSKI (滑呗) / Bona: Chongli/Altay ski-pack escrow</text>

  <text x="84" y="528" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• High-Growth Cloud ERP: Oracle NetSuite SuiteTalk REST (externalId) | Omnichannel CRM-Led: Salesforce Order Management + Outbox</text>

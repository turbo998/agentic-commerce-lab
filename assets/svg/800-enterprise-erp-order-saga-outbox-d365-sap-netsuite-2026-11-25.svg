  <text x="815" y="246" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  accounting period (SAP OB52 / NetSuite Period</text>
  <text x="815" y="268" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  Close) and drop into dead-letter queues</text>
  <text x="815" y="288" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Auto-rolls GL posting date to first open</text>
  <text x="815" y="310" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  period while preserving original TransactionDate</text>
  <rect x="815" y="370" width="305" height="34" rx="6" fill="#422006" stroke="#eab308"/>
  <text x="827" y="392" fill="#fef08a" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 451 CLOSED_ERP_FISCAL_PERIOD_REJECT</text>


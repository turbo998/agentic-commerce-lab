  <text x="80" y="182" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. ERP External_Doc_No Idempotency Lock</text>
  <text x="80" y="206" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• SAP BAPI_SALESORDER_CREATEFROMDAT2 &amp;</text>
  <text x="80" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  D365 OData SalesOrderHeaders create duplicate</text>
  <text x="80" y="246" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  orders on HTTP timeout retry unless indexed on</text>
  <text x="80" y="268" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  CustomerRequisitionNumber / BSTKD / externalId</text>
  <text x="80" y="288" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Enforces Read-Before-Retry &amp; unique constraint</text>
  <text x="80" y="310" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  on SHA-256(Tenant + Checkout_Session_ID)</text>
  <rect x="80" y="370" width="305" height="34" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="92" y="392" fill="#fecaca" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 403 DUPLICATE_ERP_ORDER_UNKEYED_RETRY</text>


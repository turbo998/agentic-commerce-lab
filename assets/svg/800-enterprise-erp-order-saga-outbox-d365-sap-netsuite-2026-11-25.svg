  <text x="60" y="128" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Deterministic External_Doc_No Idempotency · Payment-Captured / ERP-Failed Reverse Saga · Closed Fiscal Period Roll-Forward (-42%)</text>


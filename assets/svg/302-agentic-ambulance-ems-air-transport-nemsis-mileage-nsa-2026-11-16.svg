  <rect width="1200" height="675" fill="url(#bg302)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent302)"/>

  <!-- Header -->
  <text x="52" y="62" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-16 · ROUND 300 · AGENTIC GROUND &amp; AIR AMBULANCE (EMS) BILLING, NEMSIS LOADED MILES, ALS2 &amp; NSA QPA</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">智能体急救车与医疗救援直升机转运理赔：NEMSIS 载客里程锁、ALS2 抢救核验与 NSA 清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">封杀“把出站与返程 30英里空驶算进患者高价里程费” · 阻断挂 1袋普通生理盐水升码顶级 ALS2 (A0433) · 拦截 $48,000 直升机非法差额追偿</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统地面与航空急救理赔三大黑洞 (虚高 28%–52%)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 出站与返程“空车里程”混入患者 $28/英里账单</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 医保规定仅能对“上车点至急诊室 (Loaded Miles)”收里程费</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 车队把去接人的 15英里与回基地的 18英里全算在病人头上</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 甚至篡改上车点邮编骗取 +50% Super-Rural 偏远农村加成</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 挂一袋生理盐水升码顶级 ALS2 与拆解 $180 氧气费</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• ALS2 (A0433) 法定要求 &gt;=3次非盐水急救药或气管插管/除颤</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 车队给扭伤病人挂袋普通生理盐水就按顶级 ALS2 顶格报销</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 把已包含在起步价里的氧气 (A0422) 与电极片拆开重复收费</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 救援直升机开单 $48,000 违法向患者追偿差额</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 地面救护车 25分钟即可送达的平稳转院患者被强派直升机</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 违反联邦《反意外账单法 (NSA)》向患者寄 $48k 差额催收单</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 单次飞行耗尽企业自保医疗池并导致参保员工面临破产</text>

  <!-- Center Card: Agentic Policy Engine -->
  <rect x="422" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="422" y="136" width="356" height="38" rx="12" fill="#0C4A6E"/>
  <text x="442" y="160" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体 NEMSIS 载客里程、ALS2 指征与 NSA 三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#0284C7"/>
  <text x="452" y="210" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：NEMSIS [eTimes.09-&gt;11] 净载客里程与 ZIP 锁</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 仅积分“离开现场至抵达急诊室”GPS / FAA ADS-B 载客距离</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 绑定 eScene.19 上车点真实坐标核验 CMS 城乡邮编系数</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 阻断空驶里程计费与跨区农村加成造假</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#0284C7"/>
  <text x="452" y="326" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：ePCR &gt;=3次非盐水给药 ALS2 锁与耗材捆绑门禁</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 剔除普通生理盐水，核实 &gt;=3次急救推注或插管除颤才批 ALS2</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 100% 捆绑清零单独拆解的 A0422 氧气、血氧与电极片杂费</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 拦截挂盐水升码 ALS2 与耗材重复收费</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#0284C7"/>
  <text x="452" y="442" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ 反意外账单法 (NSA QPA) 与航空指征锁</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 核验 45 CFR 149.130 航空禁追偿与 QPA</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 比对两院地面车程耗时与危重指征，阻断非急症滥派直升机</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $32,250</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="796" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="796" y="136" width="356" height="38" rx="12" fill="#064E3B"/>
  <text x="816" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 地面与航空急救理赔 ($215,000) 实测矩阵</text>

  <rect x="812" y="188" width="324" height="60" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="826" y="210" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="826" y="232" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">净载客里程 + 真实 ALS2 指征 + 零拆解 + NSA → $215k</text>

  <rect x="812" y="258" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="280" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="826" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">把出站/返程 30英里空驶算进账单或虚报农村邮编 → 拦截</text>

  <rect x="812" y="328" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="826" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">仅输普通生理盐水升码 ALS2 或拆解 $180 氧气费 → 阻断</text>

  <rect x="812" y="398" width="324" height="60" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="826" y="420" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 (275ms) / 🧑‍⚖️ HTTP 409 (240ms)</text>
  <text x="826" y="442" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">直升机违法差额追偿挂起 / 砍空跑+降级重定价省 $32,250</text>

  <rect x="812" y="468" width="324" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="826" y="490" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">💡 净载客里程封顶与 ALS2 降级重定价后净付：$182,750 (省 15%)</text>
  <text x="826" y="510" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="11">令牌：agentic_ambulance_ems_air_transport_hcpcs_...</text>

  <!-- Footer -->
  <rect x="48" y="556" width="1104" height="80" rx="10" fill="#020617" stroke="#334155"/>
  <text x="68" y="582" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 急救里程 (A0425/A0436) 必须严格锁死在 NEMSIS [eTimes.09 离场 -&gt; eTimes.11 到院] 净载客距离，严禁报销空车往返里程。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. ALS2 (A0433) 必须剔除生理盐水凑数并捆绑氧气耗材，且航空救护车须经 Web IQ 强制执行《反意外账单法 (NSA)》QPA。</text>
</svg>

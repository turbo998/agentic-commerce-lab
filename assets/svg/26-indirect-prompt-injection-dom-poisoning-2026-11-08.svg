  <text x="308" y="652" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800">HTTP 403</text>
  <text x="308" y="678" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="11">13ms 网关拦截非白名单商户</text>
  <text x="308" y="696" fill="#6EE7B7" font-family="Segoe UI, Inter, sans-serif" font-size="11">Payee DID 100% 硬锚定</text>


  <text x="544" y="618" fill="#FCA5A5" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">伪造 ACP 签名目录拦截</text>
  <text x="544" y="652" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800">HTTP 401</text>
  <text x="544" y="678" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="11">16ms 阻断未签名篡改目录</text>
  <text x="544" y="696" fill="#FCA5A5" font-family="Segoe UI, Inter, sans-serif" font-size="11">acp_feed_sig_... 验签</text>

  <rect x="764" y="592" width="224" height="118" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="780" y="618" fill="#FDE68A" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">$1 商品 + $499 运费拦截</text>
  <text x="780" y="652" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800">HTTP 409</text>
  <text x="780" y="678" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="11">310ms 检出天价手续费钓鱼</text>

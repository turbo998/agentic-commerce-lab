  <!-- Lane 1: Sign-Confusion (+/- Cylinder Transpose Error) & Bad Self-Measured PD (+/-5mm) on Progressive Lenses -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. `Rx` Sign &amp; `AR PD` Gate (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops `SPH / CYL (+/-)` Sign-Entry &amp; Axis Errors:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Cross-Check Manual Entry vs `Rx_OCR_Scan` &amp;</text>
  <text x="54" y="200" class="mono">Require `Axis (001°-180°)` Whenever `CYL != 0`!</text>
  <text x="44" y="223" class="body-txt">• Stops Unverified Ruler `PD` on `$380` Progressives:</text>
  <text x="54" y="243" class="mono">Require `ARKit/TrueDepth Dual-PD + Seg_Height`</text>
  <text x="44" y="266" class="body-txt">• Eliminates custom ground progressive lenses</text>
  <text x="54" y="286" class="body-txt">being scrapped because a buyer typed `+3.25`</text>
  <text x="54" y="304" class="body-txt">instead of `-3.25` or guessed `PD = 63mm`</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 INVALID_RX_SIGN_AXIS_OR_UNVERIFIED_PROGRESSIVE_PD</text>


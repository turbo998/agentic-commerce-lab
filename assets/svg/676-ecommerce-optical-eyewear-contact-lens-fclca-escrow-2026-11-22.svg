  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. Contact-`BC/DIA` &amp; Index Gate (HTTP 422)</text>
  <text x="432" y="162" class="body-txt">• Blocks Fulfilling Contacts From an Eyeglass `Rx`:</text>
  <text x="442" y="182" class="mono">Require Exact `Brand + Base_Curve (BC) + DIA`</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">(Eyeglass Vertex Distance != Cornea Fit!)</text>
  <text x="432" y="223" class="body-txt">• High-Myopia (`&lt; -6.00D`) Rimless/Thick-Edge Gate:</text>
  <text x="442" y="243" class="mono">Enforce `1.67 / 1.74 High-Index` on `&gt;55mm` Frames</text>
  <text x="432" y="266" class="body-txt">• Prevents "Coke-bottle" 8mm thick polycarbonate</text>
  <text x="442" y="286" class="body-txt">lenses cracking drill-mount frames or buyers</text>
  <text x="442" y="304" class="body-txt">ordering contacts without a contact-lens fitting</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 EYEGLASS_RX_FOR_CONTACTS_OR_INDEX_FRAME_MISMATCH</text>


  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. `FTC FCLCA 8-Biz-Hr` Gate (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Strict `16 CFR Part 315 (FCLCA)` Compliance:</text>
  <text x="830" y="182" class="mono">Hold Contact-Lens Capture/Ship Until Prescriber</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">Confirms or `8_Prescriber_Business_Hours` Elapse!</text>
  <text x="820" y="223" class="body-txt">• Blocks Expired `Rx` (`&gt;12/24m` State Statutory Limit):</text>
  <text x="830" y="243" class="body-txt">Never ship contact-lens subscriptions on an</text>
  <text x="830" y="261" class="body-txt">expired `Rx` or use robotic robocalls that fail</text>
  <text x="830" y="279" class="body-txt">FTC audibility rules (`$50,120/violation` fine!)</text>

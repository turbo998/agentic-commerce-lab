  <text x="220" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">150M GEOFENCE &amp; J1939 TANK ±5% / LEVEL-3 ULSD+DEF / IFTA EX-TAX</text>
  <text x="650" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">HTTP &amp; ACTION PILL</text>
  <text x="875" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">LATENCY</text>
  <text x="965" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">NET IMPACT</text>

  <!-- Row 1 -->
  <text x="66" y="504" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">ful_commit_ok</text>
  <text x="220" y="504" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">本车距油站 ≤150m + J1939 液位增量误差 ≤5% + Level-3 仅含 ULSD/DEF</text>
  <text x="650" y="504" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">200 · Act automatically</text>
  <text x="875" y="504" fill="#E2E8F0" font-family="monospace" font-size="12">10ms</text>
  <text x="965" y="504" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">$440,000.00 Settled</text>

  <!-- Row 2 -->
  <text x="66" y="532" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">ful_sip_403</text>
  <text x="220" y="532" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">油机出油 110 gal 但 J1939 油箱仅增 55 gal (递枪偷油)，或异地盗刷</text>
  <text x="650" y="532" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">403 · Send to a human</text>
  <text x="875" y="532" fill="#E2E8F0" font-family="monospace" font-size="12">11ms</text>
  <text x="965" y="532" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">Siphon/Skimmer Blocked</text>

  <!-- Row 3 -->
  <text x="66" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">ful_dyed_422</text>
  <text x="220" y="560" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">便利店买香烟彩票套现，或公路货车违规加注免税染色红柴油 (§ 6715)</text>
  <text x="650" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">422 · Send to a human</text>
  <text x="875" y="560" fill="#E2E8F0" font-family="monospace" font-size="12">14ms</text>
  <text x="965" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">C-Store/Dyed Fuel Blocked</text>

  <!-- Row 4 -->
  <text x="66" y="588" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">ful_ift_451</text>
  <text x="220" y="588" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Web IQ /v3/browse 检出跨州里程未完成季度 IFTA 分摊或漏报重量税</text>
  <text x="650" y="588" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">451 · Send to a human</text>
  <text x="875" y="588" fill="#E2E8F0" font-family="monospace" font-size="12">280ms</text>
  <text x="965" y="588" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">IFTA/Weight-Tax Hold</text>

  <!-- Row 5 -->
  <text x="66" y="616" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">ful_sav_409</text>
  <text x="220" y="616" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Web IQ 启用 IFTA 净裸油价智能导航加油并凭 J1939 液位锁消除偷油</text>
  <text x="650" y="616" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">409 · Confirm</text>
  <text x="875" y="616" fill="#E2E8F0" font-family="monospace" font-size="12">245ms</text>
  <text x="965" y="616" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">Saves $35,200.00</text>

  <rect width="1200" height="675" fill="url(#bg240)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#ful240)"/>
  <text x="159" y="57" fill="#042F2E" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 238 · FLEET FUEL &amp; IFTA</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">B2B 商用车队加油卡 (Fleet Card) J1939 液位守恒、150m 围栏与 IFTA 燃油税架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">油箱液位增量 ±5% 守恒防递枪偷油 + 净裸油价 IFTA 令牌 (`b2b_commercial_fleet_fuel_card_j1939_tank_ifta_mandate_...`)</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red240)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：120加仑油箱一次刷走 210加仑递枪偷油 + 异地复制卡盗刷 $5万</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. “隔空递枪 (Side-Stepping)”偷油卖黄牛 + 磁条侧录异地盗刷：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 内鬼司机加满本车 60 加仑后，不挂枪直接把油枪递给旁边黄牛皮卡抽走 150 加仑套现；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 油机侧录器复制磁条卡与密码，周末在距离真车 800 公里外狂刷 $50,000！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 便利店买烟酒彩票混入油费 + 违规偷加免税农用染色红柴油：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 未锁 Level-3 NACS 商品码；公路货车加注染色红柴油触发 IRS § 6715 每车 $1,000+ 重罚。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 司机盲目去“低挂牌价、低燃油税州”加油导致季度末 IFTA 巨额补税：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 未扣除可抵扣州燃油税比较净裸油价 (Ex-Tax Price)，算完总账每加仑反而倒亏 $0.15。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms J1939 Siphon/Skimmer) | HTTP 422 (14ms Dyed/C-Store)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#ful240)"/>
  <text x="890" y="161" fill="#042F2E" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：150m 围栏解锁 + SAE J1939 液位守恒 + IFTA 净裸油价网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 油站 ≤150m 近场动态解封 + SAE J1939 油箱液位增量守恒 (±5%)：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 按 (VIN 油箱总容积 - J1939 当前油量) 动态封顶预授权，挂枪后 11ms 核对液位增量，</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 100% 终结隔空递枪偷油与异地复制卡盗刷！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. ISO 8583 Level-3 NACS 品类锁 (仅限公路 ULSD #2 与 DEF 尿素)：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 14ms 自动阻断便利店香烟彩票套现与违禁农用染色红柴油 (Dyed Diesel)。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms IFTA 净裸油价导航增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 按 (挂牌价 - IFTA 可抵扣州税) 最优路径加油并阻断偷油，单批立省 $35,200.00！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $440k Fleet Fuel/IFTA) | HTTP 409 ($35.2k Siphon/Tax Saved)</text>

  <!-- Bottom Quantitative Benchmark Table -->
  <rect x="36" y="415" width="1128" height="236" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="56" y="444" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">📊 定量实测矩阵：B2B 商用车队加油卡与 IFTA 跨州税批次 ($440,000.00) 5 组边界验证 (`evaluate_b2b_commercial_fleet_fuel_ifta_policy`)</text>

  <rect x="52" y="458" width="1096" height="28" rx="4" fill="#0F172A"/>

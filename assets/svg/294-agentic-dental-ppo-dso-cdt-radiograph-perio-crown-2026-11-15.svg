  <text x="826" y="442" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">无证义齿耗材挂起 / 降级 D1110+砍拆解桩核省 $22,200</text>

  <rect x="812" y="468" width="324" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="826" y="490" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">💡 影像 AI 降级重定价与剥离假桩核后净付：$162,800 (省 12%)</text>
  <text x="826" y="510" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="11">令牌：agentic_dental_ppo_dso_cdt_radiograph_perio_...</text>

  <!-- Footer -->
  <rect x="48" y="556" width="1104" height="80" rx="10" fill="#020617" stroke="#334155"/>
  <text x="68" y="582" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 严禁仅凭手写 4mm 牙周探诊表放行 CDT D4341 深刮，必须由口腔影像 AI 实测咬翼片 CEJ-to-Crest 骨吸收 &gt;=2.0mm。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. D2950 桩核必须具备 &gt;=50% 牙冠缺损影像证据，且高贵金属/全瓷冠与种植体必须通过 Web IQ 核验 Identalloy 与 FDA 510(k)。</text>

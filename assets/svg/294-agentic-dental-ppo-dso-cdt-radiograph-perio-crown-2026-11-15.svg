  <text x="442" y="160" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体口腔影像 AI、桩核体积与义齿验真三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#0284C7"/>
  <text x="452" y="210" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：DICOM 牙片 AI 骨吸收 (&gt;=2.0mm) 深刮锁</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• FDA 认证口腔影像 AI 自动测量 CEJ-to-Crest 骨吸收毫米数</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 无骨吸收 (&lt;2.0mm) 或无麻药 30分钟刷四象限深刮直接拒付</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 阻断把普通洗牙升码为 D4341 深刮</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#0284C7"/>
  <text x="452" y="326" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：&gt;=50% 牙尖缺损 D2950 锁与 Identalloy 门禁</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 3D 口扫与术前片证实牙体缺损 &gt;=50% 方可报销 D2950 桩核</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制核验技工所 Identalloy / Identceramic 官方防伪批号</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 拦截垫底伪造桩核与贱金属偷换</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#0284C7"/>
  <text x="452" y="442" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ FDA 510(k) 义齿库与州牙科执照锁</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 核验种植体与氧化锆瓷块 FDA 510(k)</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 穿透核查执业牙医 NPI 与州牙科委员会行政处罚记录</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $22,200</text>


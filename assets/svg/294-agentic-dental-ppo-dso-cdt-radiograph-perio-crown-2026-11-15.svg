  <!-- Header -->
  <text x="52" y="62" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-15 · ROUND 292 · AGENTIC DENTAL PPO/DSO CLAIMS (ADA CDT), AI RADIOGRAPH BONE LOSS &amp; CROWN LAB</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">智能体口腔医疗理赔与连锁齿科 (DSO)：口腔 AI 骨吸收核验、桩核防拆解与义齿溯源清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">封杀“无骨吸收把 $110 普通洗牙升码为 $1,200 四象限深刮 (D4341)” · 阻断补牙垫底伪造 $380 桩核重建 (D2950) · 核验 Identalloy 贵金属冠</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统商业齿科理赔与义齿三大黑洞 (多付 22%–38%)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 普通洗牙 ($110) 升码全口深层刮治 ($1,200)</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 患者拍片牙槽骨完全健康，诊所却手填“4mm 牙周袋”</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 拒做全包的 D1110 洗牙，强开 4 象限 D4341 深刮 + 抗生素</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 30 分钟一次掏空员工全年 $1,500 齿科医保额度</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 普通窝洞垫底拆解伪造 $380 桩核重建 (D2950)</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• D2950 要求天然牙冠缺损 &gt;=50% 无法固位才可申报</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 诊所只是顺手涂一点树脂填平浅坑，却在 90% 牙冠单上加收</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 每颗牙冠凭空多收 $380 桩核费 + $95 局部麻醉拆解费</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. $65 贱金属/杂牌瓷冒充 $1,450 高贵金属全瓷冠</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 按 D2790 高贵金属 (&gt;=60% 金铂钯) 或顶级全瓷冠报销</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 技工所实际交付 $65 镍铬贱金属冠或无 510(k) 工业氧化锆</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 既吃掉百倍材料差价，又引发患者牙龈黑线与金属过敏</text>


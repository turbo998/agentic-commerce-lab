  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制核验分气包气压 80–90 PSI 与逐阀脉冲声波</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 换 $28 Goyen/ASCO 膜片并离线反吹后 ΔP &lt;= 4.0"</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截破个膜片却报批 $8,500 换 24 支滤筒</text>


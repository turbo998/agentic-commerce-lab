  <text x="886" y="533" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ 气包 80-90 PSI &amp; 离线反吹 ΔP&lt;=4.0"</text>
  <text x="886" y="553" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ 防静电滤筒 &lt;10Ω 接地 &amp; Visolite UV</text>
  <text x="886" y="573" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ PE/CIH 签章 NFPA 652 DHA 归档</text>

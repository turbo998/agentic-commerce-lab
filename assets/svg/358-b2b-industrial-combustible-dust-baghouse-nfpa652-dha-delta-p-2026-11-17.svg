  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 可燃粉尘 (MIE &lt; 30mJ) 滤筒端盖对花板 &lt; 10.0 Ohms</text>

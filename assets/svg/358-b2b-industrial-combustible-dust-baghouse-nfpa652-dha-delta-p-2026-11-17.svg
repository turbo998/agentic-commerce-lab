  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁清灰踩凹泄爆片或用硅胶糊住裂缝</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 保障 Kst &gt; 0 粉尘爆燃泄压面积 100% 合规</text>


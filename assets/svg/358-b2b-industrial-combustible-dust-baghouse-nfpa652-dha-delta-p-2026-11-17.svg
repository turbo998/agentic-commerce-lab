  <!-- Header -->
  <text x="48" y="58" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 356 · INDUSTRIAL COMBUSTIBLE DUST COLLECTION, BAGHOUSE ΔP &amp; NFPA 652 / 660 DHA GATE</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">工业可燃粉尘除尘器 (Baghouse/滤筒) 脉冲反吹压差恢复锁、$28 膜片降级与 NFPA 652 DHA 清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Donaldson Torit / Camfil / Nederman · 80–90 PSI 分气包锁 + 离线反吹 ΔP &lt;= 4.0 in. w.g. + &lt;10Ω 防静电接地 + Visolite 紫外检漏</text>


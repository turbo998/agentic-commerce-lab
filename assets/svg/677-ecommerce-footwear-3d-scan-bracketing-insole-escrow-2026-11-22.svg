  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. `3D Scan` &amp; Anti-Bracketing Gate (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Unchecked 3-Size Same-SKU Bracketing:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Detect `&gt;=2 Adjacent Sizes` (US 9 / 9.5 / 10)</text>
  <text x="54" y="200" class="mono">&amp; Enforce `A4 Paper 3D Foot Scan (±1.5mm)`!</text>
  <text x="44" y="223" class="body-txt">• Cross-Brand Last-to-Last Normalization:</text>
  <text x="54" y="243" class="mono">Map `Mondopoint_mm + Instep_Height` to Exact</text>
  <text x="44" y="266" class="body-txt">• Eliminates 42% footwear return rates &amp; golden</text>
  <text x="54" y="286" class="body-txt">size stockouts caused by shoppers buying 3 pairs</text>
  <text x="54" y="304" class="body-txt">just to try on at home and return 2 pairs</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 MULTI_SIZE_BRACKETING_OR_UNMAPPED_BRAND_LAST</text>


  <text x="442" y="304" class="body-txt">You`) personalized embroidery return disputes</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 WIDTH_LAST_CONFLICT_OR_PRONATION_SHOE_MISMATCH</text>


  <text x="830" y="200" class="mono" fill="#f9a8d4">Tread-Lug &amp; Midsole-Crease Vision Check!</text>
  <text x="820" y="223" class="body-txt">• Factory Box Barcode &amp; Size-Tag Parity:</text>

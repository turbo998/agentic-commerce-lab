  <text x="442" y="182" class="mono">Require `Ball_Girth_Ratio &lt;= Last_Width_Spec`</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">(Stops Buying +1.5 Sizes Longer for Width!)</text>
  <text x="432" y="223" class="body-txt">• Overpronation / Flat-Arch Carbon-Plate Guard:</text>
  <text x="442" y="243" class="mono">Block Unstable Racing Shoes for Severe Overpronation</text>
  <text x="432" y="266" class="body-txt">• Prevents heel-slip blisters, plantar fasciitis</text>

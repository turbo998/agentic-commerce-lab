  <rect x="28" y="22" width="1144" height="68" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="48" y="51" class="title">Round 234 · Footwear `3D Foot Scan`, Anti-`Size-Bracketing` &amp; Gait/Width Escrow</text>
  <text x="48" y="74" class="sub">Volumental / Fit Predictor / Nike / Brooks / New Balance · `±1.5mm` 3D Last Match · `2E/4E` Width Gate · Pronation Insole Bundle (-37%)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>

  <text x="48" y="51" class="title">Round 189 · E-Commerce Back-in-Stock Waitlist Wave Allocation &amp; Pre-Order Escrow</text>
  <text x="48" y="74" class="sub">Klaviyo / Attentive / Purple Dot / Shopify · 5:1 Wave Batch Throttle · Bot Waitlist Purge · FTC 16 CFR 435 Delay Consent (-36% Loss)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1081" y="59" text-anchor="middle" class="mono" fill="#a7f3d0">SVG #632 · FAQ #308</text>

  <!-- Lane 1: Blast-All Sold-Out Backlash & Scalper Waitlist Stuffing Guard -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Blast-All &amp; Scalper Waitlist Lock (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Blasting 15,000 Alerts for 80 Restocked Units:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Max_Wave_Send = Available_Stock × 5 (Wait 2h)</text>
  <text x="54" y="200" class="mono">Halt Next Wave Immediately When Stock == 0</text>
  <text x="44" y="223" class="body-txt">• Anti-Scalper Waitlist Stuffing &amp; Household Cap:</text>
  <text x="54" y="243" class="mono">Deduplicate Plus-Aliases (`+1@`) &amp; Max 2 Units/HH</text>
  <text x="44" y="266" class="body-txt">• Prevents 98% of notified shoppers from clicking</text>
  <text x="54" y="286" class="body-txt">into a "Sold Out Again" page within 30 seconds</text>
  <text x="54" y="304" class="body-txt">and unsubscribing from SMS/email marketing</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 UNTHROTTLED_WAITLIST_BLAST_OR_BOT_SWEEP_BLOCKED</text>

  <!-- Lane 2: False Single-Unit Return Restock & Variant Size Mismatch Guard -->
  <rect x="416" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. Min-Restock Floor &amp; Exact Size Lock (422)</text>
  <text x="432" y="162" class="body-txt">• Stops Triggering Campaign on 1 Returned Item:</text>
  <text x="442" y="182" class="mono">Require Sellable_Restock_Qty &gt;= Min_Threshold (10)</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">Quarantine Uninspected RMA Returns from Trigger</text>
  <text x="432" y="223" class="body-txt">• Variant-Level SKU &amp; Regional Warehouse Match:</text>
  <text x="442" y="243" class="mono">Alert Only Subscribers of Exact `Size=M / Color`</text>
  <text x="432" y="266" class="body-txt">• Blocks waking up Size-M shoppers when only</text>
  <text x="442" y="286" class="body-txt">XXXL is restocked or shipping a single stained</text>
  <text x="442" y="304" y2="304" class="body-txt">RMA return as a "Restocked New Arrival"</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 SINGLE_RETURN_NOISE_OR_VARIANT_MISMATCH_BLOCKED</text>


  <text x="62" y="498" class="body-txt">dispatches in 30-min waves</text>
  <text x="62" y="516" class="mono">5 Alerts per 1 Restocked Unit</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>

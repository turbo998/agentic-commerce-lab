  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. FTC Part 435 Delay Consent Lock (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Stops Unlawful Pre-Order Delays Past Promised Date:</text>
  <text x="830" y="182" class="mono">FTC 16 CFR Part 435 (30-Day Mail Order Rule)</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">Require Explicit Opt-In Consent or Auto-Refund</text>
  <text x="820" y="223" class="body-txt">• Capture-on-Dispatch Network Token Escrow:</text>
  <text x="830" y="243" class="body-txt">Stores `$0` Network Token Mandate (`SPT/SetupIntent`)</text>
  <text x="830" y="261" class="body-txt">instead of charging 100% cash 90 days before ship</text>
  <text x="820" y="284" class="body-txt">• Eliminates expired-preauth failures and FTC</text>
  <text x="830" y="302" class="body-txt">regulatory penalties when container vessels delay</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 FTC_PART435_PREORDER_DELAY_CONSENT_REQUIRED_HOLD</text>


  <rect x="608" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="626" y="604" class="kpi-num" fill="#f59e0b">Qty &gt;= 10 Floor</text>
  <text x="626" y="626" class="kpi-lbl">Blocks Single-Return False Alarms</text>
  <text x="626" y="642" class="mono">100% Exact Size/Color SKU Match</text>

  <rect x="898" y="572" width="274" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="916" y="604" class="kpi-num" fill="#f472b6">FTC Part 435</text>
  <text x="916" y="626" class="kpi-lbl">Pre-Order Delay Opt-In Compliance</text>

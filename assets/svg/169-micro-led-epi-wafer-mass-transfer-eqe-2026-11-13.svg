  <text x="54" y="562" class="body">• Micro-LED 采购严禁“仅看外延片张数与中心单点亮度盲付”：掩盖了 5um 侧壁非辐射复合掉效 85% 与 99.9% 良率残留 6,220 个死点的灾难。</text>
  <text x="54" y="584" class="body">• 必须将全片 PL 波长 σ (&lt;=0.8nm)、ALD 侧壁钝化 EQE (&gt;=18%)、6N 转移良率与蓝宝石 LLO 复用绑定为智能托管解锁谓词。</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#131C31"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cardRailGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C243E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="chainRailGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#062C24"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="guardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E1B0F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)"/>

  <!-- Header -->
  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="320" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="160" y="17" fill="#7DD3FC" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.05em">ROUND 3 · CROSS-BORDER AGENT SETTLEMENT</text>
    <text x="336" y="18" fill="#94A3B8" font-size="12" font-weight="600">2026-11-08 · x402 / MPP Tempo (USDC/pathUSD) vs. Card Network Tokens (Stripe SPT v2 · Visa VIC)</text>
    <text x="0" y="54" fill="#F8FAFC" font-size="24" font-weight="800">跨境多币种 Agent 结算架构：稳定币/x402 链上结算 vs 卡组令牌网络选型一图流</text>
    <text x="0" y="78" fill="#CBD5E1" font-size="13">第一性原理：为什么跨境高频 API 不能走信用卡（$0.30 固定费 + 3.5% 汇损），而大额跨境实物代购又绝不能直接打链上 USDC（0 拒付追索权）？</text>
  </g>

  <!-- Left Column: Card Network Token Rail -->
  <g transform="translate(36, 122)">
    <rect x="0" y="0" width="364" height="402" rx="14" fill="url(#cardRailGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="16" y="16" width="175" height="24" rx="6" fill="#0284C7"/>
    <text x="103" y="32" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">方案 A · 卡组令牌跨境网络</text>
    <text x="16" y="64" fill="#F8FAFC" font-size="17" font-weight="800">Stripe SPT v2 (34国) + Visa VIC</text>
    <text x="16" y="84" fill="#7DD3FC" font-size="12">适用：跨境实物电商 / 机酒 / SaaS ($10–$50,000)</text>

    <rect x="16" y="100" width="332" height="90" rx="10" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="28" y="120" fill="#38BDF8" font-size="12" font-weight="700">1. 本地币种计价与 34 国合规清算</text>
    <text x="28" y="139" fill="#E2E8F0" font-size="11">• 支持 135+ 交易币种，覆盖美/英/欧盟27国/日/新/澳等 34 国</text>
    <text x="28" y="156" fill="#E2E8F0" font-size="11">• 欧盟/英国自动挂载 PSD2 SCA / FIDO2 Passkey 强认证免责</text>
    <text x="28" y="173" fill="#7DD3FC" font-size="11" font-weight="700">• 买家享有 120 天未发货/货不对板 Chargeback 拒付保护权</text>

    <rect x="16" y="202" width="332" height="90" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="28" y="222" fill="#A5B4FC" font-size="12" font-weight="700">2. 多商户跨境分账 (Stripe Connect SPT)</text>
    <text x="28" y="241" fill="#E2E8F0" font-size="11">• Destination / Separate Charges：平台统一收单后跨境分账</text>
    <text x="28" y="258" fill="#E2E8F0" font-size="11">• 铁律：未设 on_behalf_of 时严禁传 Stripe-Account 请求头</text>
    <text x="28" y="275" fill="#FCD34D" font-size="11" font-weight="700">• 卖家实时汇率/库存 Hook 4s 超时自动回退 Catalog Feed</text>

    <rect x="16" y="304" width="332" height="82" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="28" y="324" fill="#F8FAFC" font-size="12" font-weight="700">3. 成本结构与结算周期瓶颈 (Not For)</text>
    <text x="28" y="343" fill="#CBD5E1" font-size="11">• 综合费率：2.9% + $0.30 + 跨境卡费 1.5% + 换汇费 1%~2%</text>
    <text x="28" y="360" fill="#FCA5A5" font-size="11" font-weight="700">• ⛔ 低于 $1.00 的跨境 API 调用固定费损耗高达 30%~3000%</text>
    <text x="28" y="376" fill="#94A3B8" font-size="11">• 资金到账周期：T+2 ~ T+7（跨国银行清算延迟）</text>
  </g>

  <!-- Middle Column: On-Chain Programmable Micropayment Rail -->
  <g transform="translate(418, 122)">
    <rect x="0" y="0" width="364" height="402" rx="14" fill="url(#chainRailGrad)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="16" y="16" width="185" height="24" rx="6" fill="#059669"/>
    <text x="108" y="32" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">方案 B · 链上微支付与 Tempo</text>
    <text x="16" y="64" fill="#F8FAFC" font-size="17" font-weight="800">x402 (USDC) + Stripe MPP Tempo</text>
    <text x="16" y="84" fill="#6EE7B7" font-size="12">适用：跨境 API 按次计费 / 实时数据 / 算力 ($0.0001–$5)</text>

    <rect x="16" y="100" width="332" height="90" rx="10" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <text x="28" y="120" fill="#34D399" font-size="12" font-weight="700">1. HTTP 402 原生机器结算 (T+0 毫秒级到账)</text>
    <text x="28" y="139" fill="#E2E8F0" font-size="11">• 服务端返回 402 + WWW-Authenticate: Payment (network="tempo")</text>
    <text x="28" y="156" fill="#E2E8F0" font-size="11">• Agent 签发 EIP-3009 授权或 MPP Tempo Deposit 凭证即时扣款</text>
    <text x="28" y="173" fill="#6EE7B7" font-size="11" font-weight="700">• 无国界 7×24 秒级清算，消除 $0.30 固定起步费与 FX 汇差</text>

    <rect x="16" y="202" width="332" height="90" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="28" y="222" fill="#34D399" font-size="12" font-weight="700">2. 6 位小数 pathUSD 与 200 单位整美分对齐铁律</text>
    <text x="28" y="241" fill="#E2E8F0" font-size="11">• Tempo 链上 token 精度为 6 位小数 (1 cent = 10,000 units)</text>
    <text x="28" y="258" fill="#E2E8F0" font-size="11">• Stripe 商户法币余额入账按整美分向下截断 (floor to $0.01)</text>
    <text x="28" y="275" fill="#6EE7B7" font-size="11" font-weight="700">• ✅ $0.000875/call × 200 次 = $0.175000？错！需 800 次=$0.70</text>

    <rect x="16" y="304" width="332" height="82" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="28" y="324" fill="#F8FAFC" font-size="12" font-weight="700">3. 链上不可逆风险与司法管辖区红线 (Redlines)</text>
    <text x="28" y="343" fill="#FCA5A5" font-size="11" font-weight="700">• ⛔ 纽约州 (US-NY) 严禁启用稳定币微支付轨道 (强制 HTTP 403)</text>
    <text x="28" y="360" fill="#E2E8F0" font-size="11">• 链上打款不可撤回：未经交付验证的实物商品严禁走纯 x402</text>
    <text x="28" y="376" fill="#94A3B8" font-size="11">• 适用已通过 Web IQ 核验的幂等 API / 数字资产 / 托管微批结算</text>
  </g>

  <!-- Right Column: Hybrid Dual-Rail & Compliance Decision Engine -->
  <g transform="translate(800, 122)">
    <rect x="0" y="0" width="364" height="402" rx="14" fill="url(#guardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="16" y="16" width="190" height="24" rx="6" fill="#D97706"/>
    <text x="111" y="32" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">方案 C · 混合双轨与合规网关</text>
    <text x="16" y="64" fill="#F8FAFC" font-size="17" font-weight="800">Web IQ 实时核价 + 双轨智能路由</text>
    <text x="16" y="84" fill="#FCD34D" font-size="12">先用 Web IQ 核验含税落地价，再按金额/法域自动切轨</text>

    <rect x="16" y="100" width="332" height="90" rx="10" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
    <text x="28" y="120" fill="#FBBF24" font-size="12" font-weight="700">1. Web IQ (G3 global) 跨境含税落地价二次核验</text>
    <text x="28" y="139" fill="#E2E8F0" font-size="11">• 跨境电商最怕“展示价不含 VAT/关税、结账突然暴涨 25%”</text>
    <text x="28" y="156" fill="#E2E8F0" font-size="11">• /v3/browse (passage) 实时提取目标国 VAT、关税与退货邮费条款</text>
    <text x="28" y="173" fill="#FCD34D" font-size="11" font-weight="700">• 若含税总价超出 AP2 MandateVC 上限，在换汇前直接熔断！</text>

    <rect x="16" y="202" width="332" height="90" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="28" y="222" fill="#38BDF8" font-size="12" font-weight="700">2. 最小整美分对齐步长公式 (Zero-Truncation Step)</text>
    <text x="28" y="241" fill="#E2E8F0" font-size="11">• 给定单次 API 价格 p (6位小数)，最小无损批量步长：</text>
    <text x="28" y="259" fill="#7DD3FC" font-size="11" font-weight="700">  N_min = 10,000 / gcd(round(p × 1,000,000), 10,000)</text>
    <text x="28" y="276" fill="#E2E8F0" font-size="11">• 例：p=$0.000875 -&gt; N_min=80 ($0.07)；200步长=$0.00055 无损</text>

    <rect x="16" y="304" width="332" height="82" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="28" y="324" fill="#FCA5A5" font-size="12" font-weight="700">3. 司法管辖区与制裁自动围栏 (Geo &amp; FX Guard)</text>
    <text x="28" y="343" fill="#E2E8F0" font-size="11">• US-NY / 受限法域请求 x402/Tempo -&gt; 自动降级卡组或返回 403</text>
    <text x="28" y="360" fill="#E2E8F0" font-size="11">• 非 34 国商户请求 Stripe SPT -&gt; 自动切换 Visa VIC 全局网络</text>
    <text x="28" y="376" fill="#6EE7B7" font-size="11" font-weight="700">• 汇率滑点 &gt; 2.0% 时暂停自动放款并触发 Confirm 锁汇确认</text>
  </g>

  <!-- Bottom KPI Bar -->
  <g transform="translate(36, 542)">
    <rect x="0" y="0" width="1128" height="104" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="0.06em">SEALED CROSS-BORDER SETTLEMENT BENCHMARK · ZERO FABRICATED COORDINATES</text>

    <g transform="translate(24, 42)">
      <text x="0" y="18" fill="#34D399" font-size="22" font-weight="800">&lt; 0.1% vs 5.4%</text>
      <text x="0" y="38" fill="#CBD5E1" font-size="11">跨境微支付损耗 (x402/Tempo vs 信用卡)</text>
    </g>
    <g transform="translate(300, 42)">
      <text x="0" y="18" fill="#38BDF8" font-size="22" font-weight="800">34 国 / 135+ 币种</text>
      <text x="0" y="38" fill="#CBD5E1" font-size="11">Stripe SPT v2 + Visa VIC 拒付保护网络</text>
    </g>
    <g transform="translate(580, 42)">
      <text x="0" y="18" fill="#A78BFA" font-size="22" font-weight="800">$0.000000 截断损耗</text>
      <text x="0" y="38" fill="#CBD5E1" font-size="11">整美分 GCD 步长对齐 (对比未对齐损失 54.3%)</text>
    </g>
    <g transform="translate(870, 42)">
      <text x="0" y="18" fill="#FBBF24" font-size="22" font-weight="800">100% 合规围栏</text>
      <text x="0" y="38" fill="#CBD5E1" font-size="11">US-NY 稳定币阻断 + 跨境隐性关税熔断</text>
    </g>
  </g>
</svg>

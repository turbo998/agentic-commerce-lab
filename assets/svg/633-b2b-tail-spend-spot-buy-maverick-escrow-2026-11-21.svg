  <rect x="804" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. One-Time Vendor &amp; W-9/OFAC Lock (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Stops Onboarding 3,000 Zombie One-Time Vendors:</text>
  <text x="830" y="182" class="mono">onboarding_cost = $1,400/vendor for a $300 purchase!</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">Route One-Off Buys via Single MoR / VCN Aggregator</text>
  <text x="820" y="223" class="body-txt">• Mandatory `IRS TIN / W-9` &amp; `OFAC SDN` Screen:</text>
  <text x="830" y="243" class="body-txt">Blocks direct payouts to unverified personal</text>
  <text x="830" y="261" class="body-txt">Venmo/PayPal accounts or sanctioned shell entities</text>
  <text x="820" y="284" class="body-txt">• Prevents ERP master-vendor database bloat and</text>
  <text x="830" y="302" class="body-txt">24% IRS backup-withholding audit liabilities</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 UNVETTED_ONETIME_VENDOR_OR_MISSING_W9_HOLD</text>


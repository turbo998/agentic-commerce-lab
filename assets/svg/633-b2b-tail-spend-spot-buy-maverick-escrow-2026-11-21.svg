  <!-- Lane 1: Split-Order Smurfing Under Approval Threshold Guard -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Anti-Split-PO Smurfing Gate (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Splitting $28k Purchase Into 3 × $9,500 POs:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Sum(Same_Vendor_or_Project, Rolling_14d) &gt; $10k</text>
  <text x="54" y="200" class="mono">Escalate to VP + Legal Review Immediately</text>
  <text x="44" y="223" class="body-txt">• Cross-Department P-Card Swipe Aggregation:</text>
  <text x="54" y="243" class="mono">Match Merchant_Tax_ID + Cost_Center + Item_Class</text>
  <text x="44" y="266" class="body-txt">• Prevents employees from bypassing competitive</text>
  <text x="54" y="286" class="body-txt">bidding thresholds by submitting back-to-back</text>
  <text x="54" y="304" class="body-txt">$4,990 requisitions on consecutive days</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 SPLIT_ORDER_THRESHOLD_SMURFING_BYPASS_BLOCKED</text>


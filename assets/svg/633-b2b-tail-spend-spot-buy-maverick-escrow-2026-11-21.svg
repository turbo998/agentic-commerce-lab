  <text x="442" y="182" class="mono">Match Free-Text Req vs. PunchOut_Catalog (`MPN/GTIN`)</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">Block Off-Contract Spot Buy if Contract_Item Exists</text>
  <text x="432" y="223" class="body-txt">• Volume-Tier Rebate Protection:</text>
  <text x="442" y="243" class="mono">Route Spend to Preferred Tier-1 Master Supplier</text>
  <text x="432" y="266" class="body-txt">• Eliminates 35% retail markup leakage when</text>
  <text x="442" y="286" class="body-txt">requesters type free-text requests instead of</text>
  <text x="442" y="304" class="body-txt">searching the negotiated enterprise catalog</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 MAVERICK_OFF_CONTRACT_RETAIL_OVERPAY_BLOCKED</text>


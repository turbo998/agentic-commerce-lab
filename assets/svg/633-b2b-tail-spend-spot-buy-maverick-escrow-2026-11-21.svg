  <text x="62" y="480" class="body-txt">auto-switches to contracted</text>
  <text x="62" y="498" class="body-txt">`Coupa / Ariba` item;</text>
  <text x="62" y="516" class="mono">Saves 28% vs. Retail List Price</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>

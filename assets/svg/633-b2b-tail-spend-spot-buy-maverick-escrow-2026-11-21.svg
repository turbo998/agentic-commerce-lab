  <text x="622" y="462" class="body-txt">Settles tail orders through</text>
  <text x="622" y="480" class="body-txt">Amazon Business / Single-Use</text>
  <text x="622" y="498" class="body-txt">`Level-3 VCN` without new vendor;</text>
  <text x="622" y="516" class="mono" fill="#6ee7b7">0 ERP Vendor Master Pollution</text>

  <rect x="893" y="418" width="259" height="120" rx="8" fill="#1e293b" stroke="#10b981"/>

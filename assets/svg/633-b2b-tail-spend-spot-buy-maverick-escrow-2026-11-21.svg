  <text x="907" y="462" class="body-txt">Batches small departmental</text>
  <text x="907" y="480" class="body-txt">orders into consolidated weekly</text>
  <text x="907" y="498" class="body-txt">shipments with tier discounts;</text>
  <text x="907" y="516" class="mono" fill="#38bdf8">-34% Total Tail-Spend Leakage</text>


  <text x="337" y="498" class="body-txt">vetted suppliers automatically;</text>
  <text x="337" y="516" class="mono">Avg 14.5% Competitive Savings</text>

  <rect x="608" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>

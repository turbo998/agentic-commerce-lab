  <text x="48" y="74" class="sub">Fairmarkit / Amazon Business / Coupa / Zip · 14-Day Split-PO Smurfing Lock · Contract Catalog Redirect · 3-Quote Micro-RFQ (-34% Spend)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg126" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041524"/>
      <stop offset="50%" stop-color="#0A263D"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent126" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cardBg126" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102C46"/>
      <stop offset="100%" stop-color="#071626"/>
    </linearGradient>

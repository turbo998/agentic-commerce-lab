  <rect width="1200" height="630" fill="url(#bg126)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent126)"/>

  <!-- Header -->
  <rect x="40" y="24" width="390" height="28" rx="14" fill="#881337" stroke="#FB7185" stroke-width="1"/>
  <text x="235" y="43" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#FFE4E6" text-anchor="middle">
    ROUND 124 · SALMON AQUACULTURE (RAS / OFFSHORE) ESCROW
  </text>
  <text x="40" y="84" font-family="Segoe UI, Ubuntu, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">
    深海与循环水三文鱼养殖交割 (RAS/Offshore)、3D 饵料系数 (eFCR) 与土臭素智能托管
  </text>
  <text x="40" y="111" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" fill="#94A3B8">
    Stereo-Vision Biomass eFCR (&lt;=1.15), Geosmin/MIB Off-Flavor (&lt;=10 ng/kg) &amp; SalmoFan Color (&gt;=26) vs. Uneaten-Feed &amp; Muddy-Fish Overbilling
  </text>

  <!-- Left Card: Legacy Feed Tonnage & Muddy Off-Flavor Failure -->
  <rect x="40" y="132" width="355" height="360" rx="12" fill="url(#cardBg126)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="148" width="323" height="32" rx="6" fill="#450A0A"/>
  <text x="217" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">
    ❌ 传统按饲料吨数与毛鱼重盲付踩坑
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 盲目过量投喂致 18% 高价鱼粮沉底腐烂</text>
    <text x="58" y="224" fill="#CBD5E1">• 饲料油分渗漏或粉末率高，eFCR 恶化至 1.48，收走 $160,000</text>
    <text x="58" y="242" fill="#CBD5E1">• 残饵沉入网箱底耗氧产硫化氢，诱发鱼群窒息浮头</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 陆基循环水 (RAS) 未暂养脱腥致“土腥味 (Geosmin)”</text>
    <text x="58" y="294" fill="#CBD5E1">• 生物滤池放线菌产生土臭素 Geosmin &gt; 45 ng/kg (&gt;10 ng/kg)</text>
    <text x="58" y="312" fill="#CBD5E1">• 或偷减虾青素致鱼肉惨白 (SalmoFan &lt; 22)，刺身商超整批拒收</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 海虱 (Sea Lice) 爆发或饲用鱼粉混入非法捕捞</text>
    <text x="58" y="364" fill="#CBD5E1">• 成年雌性海虱 &gt; 0.5 只/尾违反挪威/苏格兰强制屠宰红线</text>
    <text x="58" y="382" fill="#CBD5E1">• 缺失 ASC 水产认证，高端生鲜渠道全线退单</text>
  </g>
  <rect x="58" y="442" width="319" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="217" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">

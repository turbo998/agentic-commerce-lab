  </text>

  <!-- Footer Banner -->
  <rect x="40" y="512" width="1120" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="541" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700" fill="#FDA4AF">
    🏛️ 架构师选型铁律 (Takeaway): 绝对不要按“投喂饲料总吨数”或“未停食带肠胃残饵活鱼毛重”盲付三文鱼水产交割款！
  </text>
  <text x="60" y="565" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    必须绑定：① 水下双目 3D 视觉增重实测经济饵料系数 eFCR &lt;=1.15 且捕捞前停食排空 &gt;=48h (11ms 拦 403)；② 土臭素 Geosmin &lt;=10 ng/kg 且色度 &gt;=26 (14ms 拦 422)；
  </text>
  <text x="60" y="586" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    ③ Web IQ 核查 ASC 水产认证与海虱密度 (&lt;=0.2只/尾, 285ms 拦 451)，并采用裂殖壶藻油替代高价秘鲁鱼油叠加 RAS 鱼粪沼气发电立省 $25,600 (295ms)。
  </text>

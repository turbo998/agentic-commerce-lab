    <text x="823" y="223" fill="#CBD5E1">  延迟：19 ms · 放款：$160,000.00 (Geosmin 3.2 ng/kg)</text>

    <text x="823" y="253" font-weight="700" fill="#FCA5A5">• 饲料沉底浪费或未绝食肠道增重拦截 (403)</text>
    <text x="823" y="272" fill="#CBD5E1">  延迟：11 ms · 拦截虚高款：$160,000.00</text>

    <text x="823" y="302" font-weight="700" fill="#FCA5A5">• 土臭素土腥味或鱼肉色泽惨白拦截 (422)</text>
    <text x="823" y="321" fill="#CBD5E1">  延迟：14 ms · 强制回清水池完成 7天脱腥</text>

    <text x="823" y="351" font-weight="700" fill="#FDE68A">• Web IQ 微藻油 EPA/DHA 与污泥沼气 (409)</text>
    <text x="823" y="370" fill="#CBD5E1">  延迟：295 ms · 节省：$25,600.00 (16.0% 降本)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  145 / 145 单元测试 100% 通过 (CSP 自包含)</text>
  </g>
  <rect x="823" y="442" width="319" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="982" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">

  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 租船合同明确规定卸毕 30/90 天内未交齐船长与码头双签 SOF 正本则索赔权永久灭失 (Extinguished)。</text>

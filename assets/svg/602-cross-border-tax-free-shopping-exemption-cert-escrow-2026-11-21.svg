  <text x="40" y="58" class="title">离境免税退税 (Global Blue / Planet) 与美国州免税证核验托管架构 (Avalara CertCapture / Stripe Tax)</text>
  <text x="40" y="80" class="subtitle">Round 159 · 防市内退税领钱后不离境倒卖、防伪造州转售免税证 (Resale Cert) 逃税遭重罚 &amp; 免税促单净省 36% (SVG 602)</text>

  <!-- Left Card: 3 Tax-Free & Exemption Cert Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大免税购物与免税证暴雷黑洞</text>
  <text x="56" y="164" class="card-title">1. “市内即买即退”领完退税不离境倒卖 (HTTP 403)</text>
  <text x="56" y="184" class="body">• 代购在巴黎/东京/上海商场买 $5,000 名包，当场领走 12% 现金退税</text>
  <text x="56" y="202" class="body">• 随后将名包在当地黑市转手卖掉，根本不去机场海关盖章核销!</text>
  <text x="56" y="220" class="warn">• 若担保信用卡是空壳预付卡，商家不仅被追缴 12% 税款还吃罚单!</text>

  <text x="56" y="256" class="card-title">2. 上传 PS 假“州转售免税证”搬空电脑 (HTTP 422)</text>
  <text x="56" y="276" class="body">• B2B/B2C 混合独立站允许上传美国各州 `Resale Exemption Certificate`</text>
  <text x="56" y="294" class="body">• 黄牛上传一张过期的加州餐厅税号或 PS 假 PDF，免掉 9.5% 消费税</text>
  <text x="56" y="312" class="warn">• 3 年后州税务局审计发现税号无效，勒令商家自掏腰包补税 + 40% 滞纳金!</text>

  <text x="56" y="348" class="card-title">3. 迈阿密出口转运仓地址被误收 7% 佛州税 (HTTP 451)</text>
  <text x="56" y="368" class="body">• 拉美跨境买家使用迈阿密认证货运代理 (Licensed Freight Forwarder)</text>
  <text x="56" y="386" class="body">• 本属合法出口免税，收银台却按佛州本地地址强收 7% 销售税导致弃购</text>
  <text x="56" y="404" class="warn">• 或反过来被境内买家冒充转运仓地址骗取免税!</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: UNSTAMPED_CUSTOMS_EXPORT_OR_PREPAID_COLLATERAL</text>
  <text x="70" y="502" class="warn">• HTTP 422: EXPIRED_OR_MISMATCHED_RESALE_EXEMPTION_CERT</text>
  <text x="70" y="524" class="warn">• HTTP 451: UNVERIFIED_FREIGHT_FORWARDER_EXPORT_CLAIM</text>
  <text x="70" y="546" class="mono">• HTTP 409:DIGITAL_CUSTOMS_PABLO_DIVA_INSTANT_VAT_409</text>
  <text x="450" y="568" class="mono" />
  <text x="70" y="568" class="mono">• HTTP 200: TIN_AND_CUSTOMS_VERIFIED_TAX_EXEMPT_200</text>
  <text x="70" y="596" class="body">铁律: 市内即买即退必锁非预付卡 21 天 150% 税额质押!</text>

  <!-- Center Card: 4-Stage Tax-Free & Exemption Certificate Architecture -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶离境退税质押与免税证实时核验架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#ef4444" />
  <text x="450" y="175" class="card-title" fill="#fca5a5">Gate 1: 即买即退 21 天海关电子签章质押锁 (HTTP 403)</text>
  <text x="450" y="195" class="body">• 市内先行退税 (Downtown Instant Refund) 100% 拒收虚拟预付卡担保!</text>
  <text x="450" y="213" class="body">• 强制在贷记卡建立 21 天 SPT 预授权质押；若 T+21d 未收到海关</text>
  <text x="450" y="231" class="mono">  `PABLO / DIVA` 离境电子验讫回执，自动全额扣回税款 -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="282" class="card-title" fill="#38bdf8">Gate 2: 州税务局 TIN 实时联机核验与行业匹配 (HTTP 422)</text>
  <text x="450" y="302" class="body">• 接入 Avalara CertCapture / Sovos 直连美国各州 Department of Revenue</text>
  <text x="450" y="320" class="body">• 实时校验: (1) 转售许可证号未过期吊销；(2) 主营行业代码 (NAICS)</text>
  <text x="450" y="338" class="body">  与所购商品一致 (拦截拿“餐饮店免税证”免税买 50 台游戏显卡!)</text>
  <text x="450" y="354" class="mono">• 假证、过期证或跨行业滥用转售免税证 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: 认证出口转运仓白名单与提单归档锁 (HTTP 451)</text>
  <text x="450" y="419" class="body">• 比对佛州/特拉华/德州官方 `Certified Freight Forwarder` 注册地址库</text>
  <text x="450" y="437" class="body">• 仅当收货地址精确命中持牌转运仓且回传出口运单/空运提单 (AWB) 时</text>
  <text x="450" y="455" class="mono">  才免除州销售税；普通住宅伪装出口仓逃税 -&gt; HTTP 451</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#10b981" />
  <text x="450" y="508" class="card-title" fill="#6ee7b7">Gate 4: 护照 OCR 秒开电子退税单与免税促单 (HTTP 409)</text>
  <text x="450" y="528" class="body">• 入境游客结账时手机扫护照 3 秒自动生成 `Global Blue / Planet`</text>
  <text x="450" y="546" class="body">  电子退税单 (免去手填纸质表格排长队)，直接显示退税后到手净价</text>
  <text x="450" y="566" class="mono">• 距离境退税起退线 (如 €100 / ¥500) 差 $15 时主动推荐凑单免税</text>
  <text x="450" y="586" class="mono">• 零税务审计补税罚单 + 跨境免税转化率跃升 -&gt; 净省 36% 税损</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大免税退税与免税证合规底座</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Avalara AvaTax + CertCapture (Exemption)</text>
  <text x="846" y="182" class="body">• 优势: 全美 50 州销售税免税证 OCR 提取与州政府数据库实时核验标杆</text>
  <text x="846" y="198" class="body">• 特性: 证书到期前 30 天自动向企业客户催收续期，应对税务审计零死角</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. Global Blue / Planet (全球离境退税网络)</text>
  <text x="846" y="244" class="body">• 优势: 直连欧盟法国 PABLO、西班牙 DIVA、日本 e-TaxFree 与中国离境退税</text>
  <text x="846" y="260" class="body">• 特性: 原生提供“市内即买即退”信用卡预授权质押与未离境自动追偿</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. Vertex Tax / Sovos Tax Determination</text>
  <text x="846" y="306" class="body">• 优势: 深度处理 B2B 制造业原材料免税、政府/非营利组织免税与</text>
  <text x="846" y="322" class="body">  佛罗里达 Certificate of Forwarding Agent Address 出口转运核验</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. 微信/支付宝“离境退税即买即退”预授权</text>
  <text x="846" y="368" class="body">• 经验: 境外旅客在北上广深试点商场扫码冻结信用额度，当场拿到</text>
  <text x="846" y="384" class="body">  人民币退税款二次消费；离境海关核验后自动解冻担保额</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度免税证造假补税、未离境跑单与弃购池 ($100,000)</text>
  <text x="860" y="456" class="body">• 传统假免税证被追缴+未离境骗退税+误征税: $100,000/季</text>
  <text x="860" y="476" class="mono">• 州税局 TIN 实时联机核验杜绝假证审计补税罚单: -$18,000</text>
  <text x="860" y="496" class="mono">• 即买即退非预付卡 21 天质押锁拦截不离境倒卖: -$11,000</text>
  <text x="860" y="516" class="mono">• 持牌出口转运仓自动免税与凑满退税门槛促单: -$7,000</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净税务风险成本: $64,000 (净省 $36,000 / -36%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: tax_free_exemption_escrow_optim_409</text>

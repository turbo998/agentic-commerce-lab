<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg165" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent165" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 23px; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-h { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 12px; fill: #fde68a; }
      .pill-ok { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #052e16; }
      .pill-err { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #450a0a; }
      .pill-warn { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #451a03; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg165)" rx="16"/>
  <rect x="28" y="22" width="1144" height="6" fill="url(#accent165)" rx="3"/>

  <text x="36" y="60" class="title">Round 163 · 半导体 EUV/ArFi 光刻胶与显影液、线宽粗糙度 (LWR) 与亚 ppb 纯度架构图</text>
  <text x="36" y="84" class="sub">Semiconductor EUV/ArFi Photoresist Offtake, 3σ LWR (&lt;=1.8 nm), ΔEsize (&lt;=+-1.5%), &gt;30nm Gel (&lt;=10/mL) &amp; Metals (&lt;=0.5 ppb)</text>

  <!-- Left Card: Failure Mode -->
  <rect x="36" y="104" width="355" height="390" rx="12" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="52" y="120" width="160" height="24" rx="12" fill="#fca5a5"/>
  <text x="64" y="136" class="pill-err">⛔ 传统按瓶数与粘度盲付</text>
  <text x="52" y="166" class="card-h">三大随机纳米桥连、接触孔瞎孔与 95% 甩胶浪费灾难</text>

  <text x="52" y="196" class="body" fill="#fca5a5" font-weight="700">1. 光酸扩散失控致 LWR (4.2nm) 与随机纳米桥连</text>
  <text x="52" y="216" class="body">PAG 与淬灭剂相分离或冷链超温致剂量漂移 +8.5%，</text>
  <text x="52" y="234" class="body">14nm 线距边缘粗糙度飙至 4.2nm，产生数千个随机</text>
  <text x="52" y="252" class="body">微桥连短路，刻蚀后无法返工整批晶圆报废！</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. &gt;30nm 软微凝胶 (140/mL) 印出瞎孔与刻蚀锥</text>
  <text x="52" y="302" class="body">透明高分子微凝胶穿过滤芯造成接触孔不开孔；</text>
  <text x="52" y="320" class="body">6.5ppb 钠铁金属在干法刻蚀中留作微掩模长出针锥。</text>

  <text x="52" y="350" class="body" fill="#fca5a5" font-weight="700">3. 禁用 PFOS 光酸违规与 2.5mL 静态滴胶浪费</text>
  <text x="52" y="370" class="body">长链 PFOS 违反 REACH 禁令；未用 RRC 溶剂预湿</text>
  <text x="52" y="388" class="body">每片白甩掉 95% 天价光刻胶且废 PGMEA 未精馏。</text>

  <rect x="52" y="418" width="323" height="58" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="64" y="440" class="mono" fill="#f87171">Legacy: 400 Gallon Bottles + Room-Temp Viscosity</text>
  <text x="64" y="460" class="mono" fill="#fca5a5">Result: $680,000 exposed to stochastic bridges</text>

  <!-- Center Card: Mandate Pipeline -->
  <rect x="412" y="104" width="380" height="390" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="428" y="120" width="248" height="24" rx="12" fill="#6ee7b7"/>
  <text x="440" y="136" class="pill-ok">🛡️ semiconductor_photoresist_mandate</text>
  <text x="428" y="166" class="card-h">四层 CD-SEM LWR、30nm 微凝胶与冷链门禁（10ms–280ms）</text>

  <rect x="428" y="182" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="202" class="mono">Gate 1: CD-SEM LWR &amp; ΔEsize Gate (11ms)</text>
  <text x="440" y="220" class="body">3σ LWR &lt;=1.8 nm, 灵敏度漂移 ΔEsize &lt;=+-1.5%</text>
  <text x="440" y="238" class="body">&amp; 随机纳米桥连/断线 = 0 — 违者直返 HTTP 403</text>

  <rect x="428" y="258" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="278" class="mono">Gate 2: &gt;30nm Gel &amp; 0.5ppb Metal (14ms)</text>
  <text x="440" y="296" class="body">SEMI C30 &gt;30nm 微凝胶 &lt;=10 个/mL &amp; ICP-MS</text>
  <text x="440" y="314" class="body">单项金属 &lt;=0.5 ppb (500ppt) — 瞎孔直返 HTTP 422</text>

  <rect x="428" y="334" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="354" class="mono">Gate 3: Web IQ PFOS-Free &amp; 5°C Log (280ms)</text>
  <text x="440" y="372" class="body">核验斯德哥尔摩公约 PFOS-Free 光酸证明与全程</text>
  <text x="440" y="390" class="body">2–8°C 冷链温度积分 — 禁用或超温直返 HTTP 451</text>

  <rect x="428" y="410" width="348" height="68" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="430" class="mono" fill="#fcd34d">Gate 4: 0.95mL RRC &amp; 5N PGMEA Loop (245ms)</text>
  <text x="440" y="448" class="body">Track RRC 溶剂预湿动态滴胶省胶 60% + 洗杯废溶剂</text>
  <text x="440" y="466" class="body">提纯至 99.999% PGMEA 回用立省 $95,200 触发 409</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="812" y="104" width="352" height="390" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="828" y="120" width="184" height="24" rx="12" fill="#fde68a"/>
  <text x="840" y="136" class="pill-warn">📊 5-Lane 实测矩阵与 Web IQ</text>
  <text x="828" y="166" class="card-h">零虚构坐标定量实测（Provenance: measured）</text>

  <text x="828" y="194" class="mono" fill="#4ade80">✅ HTTP 200 (10ms) · 极低粗糙与 500ppt 超纯放行</text>
  <text x="828" y="212" class="body">LWR 1.35nm + 凝胶 3/mL + 金属 0.15ppb → $680,000</text>

  <text x="828" y="240" class="mono" fill="#f87171">⛔ HTTP 403 (11ms) · 随机纳米桥连或剂量漂移</text>
  <text x="828" y="258" class="body">LWR=4.2nm 或 ΔEsize=+8.5% → 冻结 $680,000.00</text>

  <text x="828" y="286" class="mono" fill="#fb923c">⛔ HTTP 422 (14ms) · &gt;30nm 微凝胶或金属超标</text>
  <text x="828" y="304" class="body">微凝胶 140/mL 或金属 6.5ppb → 拒付 $680,000</text>

  <text x="828" y="332" class="mono" fill="#c084fc">⛔ HTTP 451 (280ms) · Web IQ 含 PFOS 或断冷链</text>
  <text x="828" y="350" class="body">禁用 PFOS 光酸或 &gt;15°C 超温 → 熔断 $680,000.00</text>

  <text x="828" y="378" class="mono" fill="#facc15">🟡 HTTP 409 (245ms) · RRC 预湿省胶与 PGMEA 精馏</text>
  <text x="828" y="396" class="body">节省 $95,200 (-14%) → 确认后净付 $584,800.00</text>

  <rect x="828" y="416" width="320" height="62" rx="8" fill="#1e293b"/>
  <text x="840" y="438" class="body" font-weight="700" fill="#38bdf8">Web IQ (/v3/browse) vs Exa / Bright Data</text>
  <text x="840" y="458" class="body">准确率 100% · P50 245ms · 抗注入 100% · 光罩保密</text>

  <!-- Footer -->
  <rect x="36" y="512" width="1128" height="92" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="538" class="card-h" fill="#d946ef">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• EUV/ArFi 光刻胶严禁“按瓶数与粘度盲付”：光酸扩散失控会导致 14nm 线条随机桥连，而 &gt;30nm 软微凝胶与 ppb 金属会印出瞎孔与刻蚀锥。</text>
  <text x="54" y="584" class="body">• 必须将 CD-SEM LWR (&lt;=1.8nm)、ΔEsize (&lt;=+-1.5%)、&gt;30nm 颗粒 (&lt;=10/mL) 与 RRC 省胶绑定为智能托管解锁谓词。</text>
</svg>

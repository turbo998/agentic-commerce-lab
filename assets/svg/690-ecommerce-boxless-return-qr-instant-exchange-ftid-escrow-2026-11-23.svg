  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. Return-Bar Item-Scan Gate (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Stops Blind Refunds on Sealed Cardboard Boxes:</text>
  <text x="830" y="182" class="mono">Hold Instant Refund Until `Return_Bar_Associate`</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">Scans `Garment_UPC_Tag / Serial` in Person!</text>
  <text x="820" y="223" class="body-txt">• Blocks Fast-Fashion Swap in Luxury Packaging:</text>
  <text x="830" y="243" class="body-txt">Prevents issuing a `$400` instant refund at a</text>
  <text x="830" y="261" class="body-txt">drop-off kiosk when the customer stuffed a `$5`</text>
  <text x="830" y="279" class="body-txt">thrift-store T-shirt inside a taped cardboard box</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 UNVERIFIED_SEALED_BOX_OR_GARMENT_UPC_TAG_MISMATCH</text>


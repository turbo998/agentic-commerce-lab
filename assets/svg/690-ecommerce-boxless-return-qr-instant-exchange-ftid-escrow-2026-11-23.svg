  <rect x="28" y="22" width="1144" height="68" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="48" y="51" class="title">Round 247 · E-Commerce Boxless `QR` Return Bar, Anti-`FTID` &amp; Instant-Exchange Escrow</text>
  <text x="48" y="74" class="sub">Happy Returns / Loop Returns / Narvar / UPS Store · In-Person Barcode Check · `FTID` Scale-Weight Gate · Bonus Credit Lock (-38%)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1081" y="59" text-anchor="middle" class="mono" fill="#a7f3d0">SVG #690 · FAQ #366</text>

  <!-- Lane 1: FTID (Fake Tracking ID) Label Tampering & Empty-Envelope Weight Mismatch -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Anti-`FTID` &amp; Scale-Weight Gate (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops `FTID` Label Edits &amp; `15g` Empty Envelopes:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Verify `Carrier_Induct_Weight == BOM_Weight ±12%`</text>
  <text x="54" y="200" class="mono">&amp; `Dest_ZIP9 == Official_3PL_Dock_Geofence`!</text>
  <text x="44" y="223" class="body-txt">• Bans Editable PDF Labels on High-Risk SKUs:</text>
  <text x="54" y="243" class="mono">Issue Tamper-Proof `Counter_Broker_QR_Code_Only`</text>
  <text x="44" y="266" class="body-txt">• Eliminates fraudsters editing a return label</text>
  <text x="54" y="286" class="body-txt">to mail a paper clip to a nearby address so</text>
  <text x="54" y="304" class="body-txt">tracking shows "Delivered" on an `$850` jacket</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 FTID_ADDRESS_TAMPER_OR_CARRIER_SCALE_WEIGHT_MISMATCH</text>


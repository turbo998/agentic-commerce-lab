  <text x="442" y="182" class="mono">Require `14-Day Card Auth_Hold (SPT)` Before</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">Shipping Replacement Item Ahead of Return!</text>
  <text x="432" y="223" class="body-txt">• Stops `+$15 Bonus Credit` Cash-Out Arbitrage:</text>
  <text x="442" y="243" class="mono">Strip `Promo_Bonus_Credit` on 2nd-Hop Cash Refund</text>
  <text x="432" y="266" class="body-txt">• Prevents a buyer claiming `$100 + $15 bonus`</text>
  <text x="442" y="286" class="body-txt">exchange credit, ordering a `$115` item, and</text>
  <text x="442" y="304" class="body-txt">returning the second item for `$115` cash</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 UNCOLLATERALIZED_INSTANT_EXCHANGE_OR_BONUS_CASHOUT</text>


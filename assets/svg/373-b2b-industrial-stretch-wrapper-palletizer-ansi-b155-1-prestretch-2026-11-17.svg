  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">产线末端全自动缠绕机与拉伸膜联合采购、250% 预拉伸率锁与 $135 摆杆传感器清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Lantech / Wulftec / Robopac / Signode · 10"→35" (&gt;=250%) 动力预拉伸锁 + &lt;=260g/托净耗膜 + $135 张力摆杆传感器 + ISTA 3E</text>


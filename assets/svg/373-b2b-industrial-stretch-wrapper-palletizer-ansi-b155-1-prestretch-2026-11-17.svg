  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 单托标准耗膜锁死 &lt;=260g，扣除纸筒皮重 (&lt;=2.2 lbs)</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截调松胶辊让客户多买 2 倍 LLDPE 拉伸膜</text>


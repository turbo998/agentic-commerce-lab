  <text x="815" y="246" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  multiple partial captures across split shipments</text>
  <text x="815" y="268" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Blocks single-capture BNPL on &gt;21d preorder</text>
  <text x="815" y="288" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  items or auto-calls Klarna Extend_Auth_Time</text>
  <text x="815" y="310" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  before warehouse wave release</text>
  <rect x="815" y="370" width="305" height="34" rx="6" fill="#422006" stroke="#eab308"/>
  <text x="827" y="392" fill="#fef08a" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 451 EXPIRED_BNPL_LOAN_ON_BACKORDER</text>


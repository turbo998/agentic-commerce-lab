  <rect x="60" y="444" width="1080" height="138" rx="12" fill="#0f172a" stroke="#f472b6" stroke-width="1.5"/>
  <text x="84" y="476" fill="#fbcfe8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Platform Selection Matrix &amp; Fiduciary Impact (Quarterly BNPL MDR Subsidy Bleed, Return Fee Loss &amp; Expired Auth Pool: $355,000)</text>
  <text x="84" y="504" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• High-AOV $300–$15,000 Adaptive 0%/APR Underwriting: Affirm | Global EU/US Fashion &amp; Pay-in-30/Pay-in-4: Klarna</text>

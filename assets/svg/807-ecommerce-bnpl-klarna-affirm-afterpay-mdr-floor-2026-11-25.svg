  <text x="60" y="68" fill="#f472b6" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">ROUND 364 · FAQ #483 · SVG #807 · SANDBOX #257 · TEST #1361 · E-COMMERCE BNPL ORCHESTRATION</text>
  <text x="60" y="102" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">E-Commerce Buy Now, Pay Later (BNPL: Klarna / Affirm / Afterpay / PayPal Pay in 4)</text>
  <text x="60" y="128" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">0% APR Merchant Subsidy AOV Floor (&gt;=$250) · High-Return Category MDR Veto · Split-Shipment Loan Auth Extension (-39% Cost)</text>

  <!-- Gate 1 -->
  <rect x="60" y="152" width="345" height="270" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="80" y="182" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. 0% APR Subsidy &amp; Low-Margin Veto</text>
  <text x="80" y="206" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 12-to-24 month 0% APR financing charges</text>
  <text x="80" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  the merchant a 6%–12% upfront MDR subsidy</text>
  <text x="80" y="246" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Offering 0% APR on $45 carts or low-margin</text>
  <text x="80" y="268" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  electronics (&lt;18% gross margin) turns every</text>
  <text x="80" y="288" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  checkout into a net loss; enforces Cart_AOV</text>
  <text x="80" y="310" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  &gt;= $250 &amp; Post_BNPL_Margin &gt;= 20% floor</text>
  <rect x="80" y="370" width="305" height="34" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="92" y="392" fill="#fecaca" font-family="Consolas, monospace" font-size="12" font-weight="700">HTTP 403 SUB_FLOOR_BNPL_MDR_MARGIN_BLEED</text>

  <!-- Gate 2 -->
  <rect x="427" y="152" width="345" height="270" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="447" y="182" fill="#fdba74" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">2. High-Return Non-Refundable MDR Shield</text>
  <text x="447" y="206" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• BNPL providers keep the 4.5%–5.99% merchant</text>
  <text x="447" y="226" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  fee (or $0.30 fixed fee) even when the</text>

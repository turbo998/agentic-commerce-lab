  <text x="84" y="556" fill="#38bdf8" font-family="Consolas, monospace" font-size="14" font-weight="700">HTTP 409 BNPL_DYNAMIC_AOV_TIER_AND_PAYPAL_ROUTING_CONFIRM · Savings: $138,450/qtr (-39.0%) · Net: $216,550</text>

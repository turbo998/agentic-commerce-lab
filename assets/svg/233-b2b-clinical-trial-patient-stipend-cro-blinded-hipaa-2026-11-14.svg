  <text x="159" y="57" fill="#042F2E" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 231 · CLINICAL TRIAL &amp; CRO</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">B2B 临床试验受试者双盲去标识化代发、防 CRO 幽灵入组与 IRB 反诱导架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">药企侧 0-Byte PII 防破盲 + 中心实验室血样三单匹配令牌 (`b2b_clinical_trial_patient_stipend_cro_blinded_hipaa_mandate_...`)</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red233)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：药企直看患者真名触发破盲与 HIPAA 罚单 + 幽灵受试者骗经费</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 药企财务直付患者个人银行卡泄露真名 + 分中心编造幽灵受试者：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 药企 ERP 直接采集患者姓名/SSN，违反 HIPAA 并导致双盲临床试验破盲作废；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 黑心分中心在 EDC 凭空编造 20 个假病人 (无中心实验室血样)，骗走 $50 万入组费！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 将 80% 补贴捆绑在末次访视强迫患者隐瞒严重不良反应 (SAE)：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反美国 FDA 21 CFR § 50.20 与伦理委员会 (IRB) 反金钱胁迫诱导准则。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 漏登美国阳光法案 (Sunshine Act) 主研医生 NPI 或税表泄露病种：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 向研究者医生付款未报 CMS Open Payments，或由肿瘤项目部直发 1099 税表泄露隐私。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

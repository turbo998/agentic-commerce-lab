  <text x="890" y="161" fill="#042F2E" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：BAA 双盲受托隔离舱 + 中心实验室血样三单匹配 + IRB 按次网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 药企侧 0-Byte 患者 PII 隔离 + EDC/中心实验室血样/eCOA 三单匹配：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 药企账本仅见 Subject_UUID，由独立 BAA 受托方以中性名称代发补贴与 1099 税表；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 强制核验中心实验室真实人类血样条码入库哈希，100% 粉碎幽灵受试者造假！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 按每次完成访视比例秒发 (Prorated) + 锁死 IRB 伦理批件上限：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 严守 FDA 21 CFR § 50.20 零金钱胁迫原则；受试者随访结束 10ms 补贴秒到虚拟卡。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 阳光法案核验与防损增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 拦截假入组骗保并凭即时发放降低 35% 脱落重招成本，单批立省 $48,800.00！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>

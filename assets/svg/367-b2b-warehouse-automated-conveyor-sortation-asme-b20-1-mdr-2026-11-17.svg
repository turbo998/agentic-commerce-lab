  <text x="446" y="306" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">PREMATURE_WHOLE_LOOP_BELT_REPLACEMENT_ON_SPLICE_LACING_BLOCKED</text>
  <text x="446" y="326" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截张紧架尚有余量却跳过 $180 打扣强推 $32k 整圈换带 → $0.00</text>


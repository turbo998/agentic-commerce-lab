  <text x="446" y="394" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">MDR_ROLLER_OR_GEARBOX_UPCODING_ON_95_DOLLAR_CARD_OR_POLY_V_BAND</text>
  <text x="446" y="414" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截把 $95 MDR 控制卡/$12 小皮带虚报为 $850 换电动滚筒 → $0.00</text>

  <!-- Lane 451 -->
  <rect x="432" y="440" width="392" height="76" rx="8" fill="#3B0764" stroke="#C084FC"/>
  <text x="446" y="462" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛑 HTTP 451 · Send to a human (265ms)</text>
  <text x="446" y="482" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">SKIPPED_ASME_B20_1_PULLCORD_ESTOP_TEST_OR_MISSING_NIP_GUARD_HOLD</text>
  <text x="446" y="502" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web IQ 挂起漏测 ASME B20.1 拉绳急停或缺失防夹护罩 → $0.00</text>

  <!-- Lane 409 -->

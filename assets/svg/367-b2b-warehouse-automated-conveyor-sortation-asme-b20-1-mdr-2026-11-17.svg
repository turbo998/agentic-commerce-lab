  <rect width="1200" height="675" fill="url(#bg367)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent367)"/>

  <!-- Header -->
  <text x="48" y="58" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 365 · WAREHOUSE AUTOMATED CONVEYOR &amp; SORTATION (ASME B20.1 / 24V MDR), $180 SPLICE &amp; $95 CARD GATE</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">智能物流仓自动输送线与滑靴/交叉带分拣机、$180 皮带打扣锁与 $95 MDR 驱动卡清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Dematic / Intelligrated / Vanderlande / Interroll · 张紧滑轨行程锁 + Flexco 钢扣重接 + ConveyLinx 寄存器诊断 + ASME B20.1</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="64" y="160" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">📦 四大物流输送分拣机械与电气硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 张紧架剩余行程 &amp; $180 钢扣重接锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制核验张紧滑轨 (Take-Up Frame) 是否已走完死点</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 伸长率 &lt;2.0% 接头开裂锁定 $180 Flexco 排扣重打</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截接头松脱却忽悠花 $32,000 换 400 英尺带</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. $95 24V MDR 控制卡 &amp; $12 小皮带锁</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 调取 ConveyLinx / PROFINET 寄存器与霍尔转速脉冲</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 绕组平衡 (1.2Ω) 锁定换 $95 驱动卡或 $12 Poly-V 带</text>
  <text x="74" y="368" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断把小故障高报成 $850 电动滚筒/$2,600 电机</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="426" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 滑靴分拣机 $14 导向轴承单换门禁</text>
  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 滑靴 (Divert Shoe) 卡轨 95% 源于底部 $14 尼龙轴承磨损</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁因滑块轴承磨损直接报废整排铝合金板条 (Slats)</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 保障 250+ 件/分钟高速分拣零卡箱与低备件消耗</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="540" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. Web IQ ASME B20.1 拉绳急停 &amp; 护罩核查</text>
  <text x="74" y="560" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• /v3/browse 核验全线 Pull-Cord 急停拉绳跳闸日志</text>
  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截缺失 OSHA 1910.212 驱动滚筒防夹护罩</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 根除大促高强度作业下输送带卷入工伤事故</text>


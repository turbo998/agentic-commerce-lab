  <text x="54" y="584" class="body">• 必须将快放气 0 起泡内瘪、氢渗透 (&lt;=46)、-40°C 温循、316L 镍含量 (&gt;=12.5%) 与干法缠绕绑定为智能托管解锁谓词。</text>

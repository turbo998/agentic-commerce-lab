  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 控制器 kWh 有功负载积分 + 油底壳排空脉冲锁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">直连柴发 EMCP 控制器核验带载测试累计 kWh 输出 (&gt;=50%额定×2h) 与排烟温度</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">&gt;=750°F；换油必须具备曲轴箱液位 100%→0%→100% 物理跳变，11ms 拦假测试/假换油。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. IEEE 1188 逐节微欧姆内阻核验 + ASTM D975 柴油清洁锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">对投运 &lt;3.5 年且超标单体 &lt;10% 的电池串强制锁死单节精准更换，严禁整串强换；</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">强制核验储油罐循环抛光流量与 ASTM D975 水及沉淀物 &lt;0.05% vol 化验单。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 EPA RICE 排放配额与 NETA 资质 (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 穿透核查站点 EPA RICE NESHAP / AQMD 年度非紧急运行小时余量、技师</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">NETA/EGSA 认证及医院 Joint Commission EC.02.05.07 应急电源档案合规性。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动将整串换电池降级为单节更换并抵扣废铅残值 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将 $38,000 整串报价改写为 2 节单体更换并按 $0.42/lb 扣除废铅酸电池残值：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $210,000.00 → 自动核减 $31,500.00 (15.0%) → 净付 $178,500.00！</text>


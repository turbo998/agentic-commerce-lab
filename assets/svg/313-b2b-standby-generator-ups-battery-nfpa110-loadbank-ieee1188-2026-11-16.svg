  <!-- Header -->
  <text x="48" y="58" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 311 · B2B STANDBY DIESEL GENERATOR &amp; UPS BATTERY MAINTENANCE (NFPA 110 § 8.4.2 &amp; IEEE 1188)</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">备用柴发与 UPS 蓄电池维保：NFPA 110 带载千瓦时锁、IEEE 1188 单节内阻 vs 空载湿堆与整串强换</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_standby_generator_ups_battery_nfpa110_loadbank_kw_ieee1188_ohmic_mandate_2026 · 15.0% Savings ($31,500 / Batch)</text>

  <!-- Left Panel: Legacy Generator & UPS Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统备用柴发与 UPS 维保四大黑洞 (Legacy Critical Power Leakage: 25%–50%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 空载打火怠速 15 分钟冒充 $4,800 负载箱测试 (No-Load Idle &amp; Wet Stacking)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">不拉 2MW 假负载箱现场接线，只让柴发在 0 kW 空载下转 15 分钟就收 $4,800 测试费；</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">低温未燃柴油糊死增压器形成“湿堆 (Wet Stacking)”，真停电合闸瞬间直接闷车熄火。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 抹布擦亮滤芯外壳冒充更换 120 加仑新机油 (Phantom Lube Oil Change)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">备用柴发全年仅运行 20 小时，旧机油颜色尚浅，不良技师根本不抽排油底壳旧油，</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">只用清洗剂擦亮 8 个滤清器外壳，将价值 $3,600 的 120 加仑新机油拉走倒卖。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 40 节电池仅 2 节内阻略高却强换整串收 $38,000 (Premature Full-String Swap)</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">投运仅 2.5 年的 UPS 电池组中 38 节完好、仅 2 节单体内阻超标，维保商却以“新旧</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">不能混用会起火”恐吓甲方，把 $1,900 的单节更换硬做成 $38,000 整串全换大单。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 侵吞 6,000 磅废铅酸电池残值 ($2,500) + 地埋油罐菌泥堵死 (Lead Core Theft)</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">拆下的 3 吨废铅酸电池再生铅价值 $2,500 却被维保商白拉走还倒收 $1,500 处置费；</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">地埋柴油罐未做 ASTM D975 除水抛光过滤，停电 10 分钟柴油菌泥即堵死油路。</text>


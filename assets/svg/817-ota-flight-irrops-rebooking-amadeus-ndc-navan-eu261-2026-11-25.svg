  <text x="445" y="183" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    2. Downstream Hotel &amp; Rail Sync (422)
  </text>
  <text x="445" y="222" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    Problem: Overnight Flight Rebook Causes Hotel No-Show
  </text>
  <text x="445" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    • Cancelled evening flight rebooked to 07:00 next day
  </text>
  <text x="445" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    • Destination hotel isn't notified → Marks traveler
  </text>
  <text x="445" y="284" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    No-Show at midnight &amp; cancels entire 4-night stay!
  </text>
  <rect x="445" y="304" width="310" height="72" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
  <text x="459" y="328" fill="#fcd34d" font-family="Consolas, monospace" font-size="12" font-weight="700">
    if Arrival_Shift &gt; 6h and not Hotel_Hold_Synced:
  </text>
  <text x="459" y="348" fill="#fde68a" font-family="Consolas, monospace" font-size="12">
    raise HTTP_422_UNSYNCED_DOWNSTREAM_HOTEL_LEG
  </text>
  <text x="459" y="366" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">
    # Dispatch Late-Arrival Guarantee &amp; shift car/rail
  </text>
  <text x="445" y="404" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    Multi-Leg Cascade Orchestration (HTTP 409):
  </text>
  <text x="445" y="426" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Sends automated `SI-LATE ARRIVAL` to hotel PMS
  </text>
  <text x="445" y="446" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Books airport distress hotel within airline cap
  </text>
  <text x="445" y="466" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Cuts IRROPs walk-up &amp; no-show losses by 42%
  </text>

  <!-- Panel 3 -->
  <rect x="798" y="156" width="350" height="390" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.8" />
  <rect x="798" y="156" width="350" height="42" rx="14" fill="#064e3b" />
  <text x="818" y="183" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    3. Refund vs. Rebook &amp; EU261 Mutex (451)
  </text>
  <text x="818" y="222" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    Problem: Double-Dipping Refund + Replacement Ticket
  </text>
  <text x="818" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">

  <text x="442" y="182" class="mono">Compare LLM_Generated_Copy ↔ Packaging_OCR</text>
  <text x="432" y="205" class="body-txt">• Blocks Hallucinated Material / Spec Claims:</text>
  <text x="442" y="225" class="mono" fill="#fcd34d">- Title says "100% Silk" vs Tag OCR "Polyester"</text>
  <text x="442" y="243" class="mono" fill="#fcd34d">- Copy says "Dishwasher Safe" vs Spec "Hand Wash"</text>
  <text x="442" y="261" class="mono" fill="#fcd34d">- Missing L×W×H / Weight / Allergen Ingredients</text>
  <text x="432" y="284" class="body-txt">• Requires 100% mandatory category attributes</text>
  <text x="442" y="302" class="body-txt">before publishing SKU to live storefront</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 TITLE_VS_LABEL_SPEC_MISMATCH_OR_MISSING_ATTR_BLOCKED</text>


  <text x="830" y="182" class="mono">Match UPC/Lot against Daily Recall Feed →</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">60s Storefront + WMS Order Kill-Switch</text>
  <text x="820" y="223" class="body-txt">• Mandatory Lab Certificates by Category:</text>
  <text x="830" y="243" class="body-txt">- Children's Toys: `CPC + CPSC Third-Party Lab`</text>
  <text x="830" y="261" class="body-txt">- E-Bikes / Lithium: `UL 2849 / UL 2272 / UN38.3`</text>
  <text x="830" y="279" class="body-txt">- California Ship-To: `Prop 65 Safe-Harbor Label`</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>

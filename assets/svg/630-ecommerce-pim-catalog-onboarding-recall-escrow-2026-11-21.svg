  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. GS1 GTIN Registry &amp; Dedup Gate (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Amazon `Error 8572` &amp; Google GTIN Bans:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Verify Mod-10 Check Digit + GS1_Company_Prefix</text>
  <text x="54" y="200" class="mono">matches Brand_Owner in GS1 Global Registry</text>
  <text x="44" y="223" class="body-txt">• Blocks Reseller "Cheap Barcode" Spoofing &amp;</text>
  <text x="54" y="243" class="body-txt">Duplicate Catalog Split (`1 Item = 5 ASINs`):</text>
  <text x="54" y="263" class="mono">Deduplicate via Hash(Brand, MPN, GTIN, Spec)</text>

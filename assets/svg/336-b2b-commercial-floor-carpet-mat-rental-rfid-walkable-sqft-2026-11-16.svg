  <text x="293" y="614" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="11">拦原地不换垫与35%幽灵库存</text>

  <rect x="498" y="580" width="215" height="40" rx="6" fill="#450A0A"/>
  <text x="510" y="598" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 422 · 14ms</text>
  <text x="510" y="614" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="11">拦BOMA毛面积注水与假石材水磨</text>

  <rect x="725" y="580" width="205" height="40" rx="6" fill="#3B0764"/>
  <text x="737" y="598" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 451 · 275ms</text>
  <text x="737" y="614" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="11">拦DCOF&lt;0.42滑蜡与无CRI认证</text>

  <rect x="942" y="580" width="196" height="40" rx="6" fill="#451A03"/>
  <text x="954" y="598" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 409 · 240ms</text>
  <text x="954" y="614" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11">锁净面积+砍幽灵垫省$22.5k</text>

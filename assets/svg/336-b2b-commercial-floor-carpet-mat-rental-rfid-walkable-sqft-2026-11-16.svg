  <text x="76" y="614" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11">RFID换垫+BIM净面积($150k)</text>

  <rect x="281" y="580" width="205" height="40" rx="6" fill="#450A0A"/>

  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 213 · ESIM SGP.32 &amp; 5G CHF</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体全球 eSIM 与物联网漫游 (GSMA SGP.32 &amp; BCE) 实时配额清算架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">EID-IMEI 硬件锁死 + 5G CHF 50MB 实时切片 + SGP.32 空中切网令牌 (`agentic_esim_iot_sgp32_bce_roaming_mandate_...`) vs 36h TAP 延迟天价盗刷</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red215)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：拔卡插 SIM-Box 狂跑流量 + 36h TAP 话单延迟刷出 $65,000 账单</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 物理可拔卡无 IMEI 绑定 + 36 小时 TAP 3.12 离线话单盲区：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 黑产撬开海外 POS/共享单车拔出物联网卡，插进 5G 路由器或 SIM-Box 盗刷；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 拜访地运营商 36 小时后才发来 TAP 账单，单张 $3 月租卡已欠费 $65,000！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 违反巴西/土耳其/印度“90 天永久漫游禁令”致车队集体断网：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 长期用境外 IMSI 驻网超 90 天被当地监管基站拉黑，5 万台无屏设备变砖失联。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 误将消费级 SGP.22 用于无屏设备 &amp; 散客高价 TAP 逐笔结算：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• SGP.22 强制要求屏幕手点确认无法远程切网；未走 BCE 阶梯包白交高额漫游溢价。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

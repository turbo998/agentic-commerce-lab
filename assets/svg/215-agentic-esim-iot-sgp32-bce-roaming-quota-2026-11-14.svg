  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：EID-IMEI 信令强锁 + 5G CHF 50MB 实时切片 + SGP.32 eIM 网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 32位 eUICC EID + 15位设备 IMEI 核心网信令强绑定：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 附着信令实时比对 reported_imei == bound_imei，机卡分离 11ms 即刻踢下网；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 5G CHF N40 / Diameter Gy 按 50MB 切片实时预留，触顶 14ms 断流 (最大敞口 &lt;$0.20)！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. GSMA SGP.32 (eIM) 驻网满 60 天静默空中切入本土运营商：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 无需屏幕交互，云端一键将巴西/土耳其车队切换为本土合规 IMSI 永不断联。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 法规核验与 BCE 阶梯降费：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 本地 Profile 置换高价漫游并走 GSMA BCE 批发净额结算，单批立省 $40,800.00！</text>


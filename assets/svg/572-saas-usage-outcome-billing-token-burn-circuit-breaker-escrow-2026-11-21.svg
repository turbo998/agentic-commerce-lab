<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg572" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081226" />
      <stop offset="50%" stop-color="#0f2342" />
      <stop offset="100%" stop-color="#06101f" />
    </linearGradient>
    <linearGradient id="accent572" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21.5px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .mono { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #6ee7b7; }
      .warn { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #fca5a5; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg572)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent572)" rx="3" />

  <text x="40" y="58" class="title">AI SaaS 按量与按结果计费 (Usage &amp; Outcome Billing)、防死循环爆账单与积分结转托管 (Orb / Metronome / Stripe)</text>
  <text x="40" y="80" class="subtitle">Round 129 · 防周末 Agent 死循环刷出 $45,000 惊吓账单、防假“已解决工单”乱收 $0.99 结果费 &amp; 阶梯预购净省 30% (SVG 572)</text>

  <!-- Left Card: 3 AI SaaS Billing Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大 AI 计费与客诉灾难</text>
  <text x="56" y="164" class="card-title">1. 周末死循环重试刷爆 $45,000 账单 (HTTP 403)</text>
  <text x="56" y="184" class="body">• 客户 Webhook 写错触发 Agent 无限递归自我调用</text>
  <text x="56" y="202" class="body">• 计费系统T+24h批处理汇总，周六晚狂烧 9 亿 Tokens 未熔断</text>
  <text x="56" y="220" class="warn">• 周一客户收到 $45,000 账单直接拒付并全网发帖维权</text>

  <text x="56" y="256" class="card-title">2. 假“成功解决 (Outcome)”与网络超时重计费</text>
  <text x="56" y="276" class="body">• AI 客服按“成功解决 $0.99/单”收费，但 AI 敷衍回复后</text>
  <text x="56" y="294" class="body">  强行关单，客户 5 分钟内重开新工单转人工，仍被扣 $0.99</text>
  <text x="56" y="312" class="warn">• 上游 LLM HTTP 502 超时重试 3 次，计量表竟重复扣 3 次费!</text>

  <text x="56" y="348" class="card-title">3. 月末未用完预付积分清零与 ASC 606 违规</text>
  <text x="56" y="368" class="body">• 客户季初充值 $20,000 AI Credits，因上线推迟月底被强行清零</text>
  <text x="56" y="386" class="body">• 引发客户极度反感并在续约时直接流失 (Breakage 反噬)</text>
  <text x="56" y="404" class="warn">• 未消费预付款提前确认为当期营收触发 ASC 606 审计违规</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: RUNAWAY_LOOP_SPEND_CAP_BREACH_BLOCK</text>
  <text x="70" y="502" class="warn">• HTTP 422: FAKE_OUTCOME_REOPEN_OR_RETRY_DOUBLE_BILL</text>
  <text x="70" y="524" class="warn">• HTTP 451: ASC606_UNEARNED_REVENUE_OR_FORFEIT_HOLD</text>
  <text x="70" y="546" class="mono">• HTTP 409: COMMIT_WITH_ROLLOVER_AND_TIER_CAP_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: IDEMPOTENT_USAGE_OUTCOME_AUTHORIZED</text>
  <text x="70" y="596" class="body">铁律: 仅对 HTTP 200 + 72h 未重开工单的真实结果扣费!</text>

  <!-- Center Card: 4-Stage Real-Time Metering Architecture -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶流式计量、结果验真与熔断架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="175" class="card-title" fill="#38bdf8">Gate 1: 亚秒级流式预算熔断器 (Streaming Spend Cap)</text>
  <text x="450" y="195" class="body">• Kafka/Flink 实时钱包扣减 (延迟 &lt;150ms)，绝不等 T+24h 批处理</text>
  <text x="450" y="213" class="body">• 5 分钟消耗斜率 &gt; 均值 8x 或触及日限额 -&gt; 立即挂起 API Key</text>
  <text x="450" y="231" class="mono">• 自动阻断周末递归死循环惊吓账单 -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#10b981" />
  <text x="450" y="282" class="card-title" fill="#6ee7b7">Gate 2: UUIDv7 幂等去重与 72h 结果验真 (Outcome Gate)</text>
  <text x="450" y="302" class="body">• 每笔推理/动作绑定确定性 idempotency_key，5xx 失败重试 $0 计费</text>
  <text x="450" y="320" class="body">• 按结果计费 (Outcome Billing): 工单关闭后进入 72h 观察期</text>
  <text x="450" y="338" class="body">• 若客户在 72h 内重开、转人工或给差评 -&gt; 自动免除 $0.99 结果费</text>
  <text x="450" y="354" class="mono">• 企图对报错重试或假解决工单扣费 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#6366f1" />
  <text x="450" y="399" class="card-title" fill="#a5b4fc">Gate 3: ASC 606 递延收入账本与透明告警 (HTTP 451)</text>
  <text x="450" y="419" class="body">• 预充值 Credits 严格计入合同负债 (Deferred Revenue)</text>
  <text x="450" y="437" class="body">• 按 FIFO 先进先出随真实 Token/Outcome 消耗逐笔确认收入</text>
  <text x="450" y="455" class="mono">• 强制在余额耗尽至 50% / 80% / 100% 时推送 Webhook 预警</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#f59e0b" />
  <text x="450" y="508" class="card-title" fill="#fcd34d">Gate 4: 跨期积分结转 (Rollover) 与阶梯封顶转化</text>
  <text x="450" y="528" class="body">• 允许当月未用完 Credits 自动顺延至下季度 (上限 25% Rollover)</text>
  <text x="450" y="546" class="body">• 识别月度持续超量客户，自动推荐升级阶梯承诺包享 72 折单价</text>
  <text x="450" y="566" class="mono">• 超额部分按承诺折扣价 (True-Up Rate) 结算而非惩罚性高价</text>
  <text x="450" y="586" class="mono">• 防爆表 + 砍无效结果费 + 积分结转 -&gt; 净省 30% AI 用量支出</text>

  <!-- Right Card: Billing Engines & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大现代用量计费底座</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Orb / Metronome</text>
  <text x="846" y="182" class="body">• 优势: 专为 AI Token 与云算力设计，支持每秒十万级事件摄入</text>
  <text x="846" y="198" class="body">• 特性: SQL 级可追溯计量、实时预付钱包扣减与 ASC 606 报表</text>

  <text x="846" y="226" class="card-title" fill="#6366f1">2. Stripe Billing (Meters API v2)</text>
  <text x="846" y="244" class="body">• 优势: 与 Stripe 收单/发票/税务一体化，免同步多套系统</text>
  <text x="846" y="260" class="body">• 特性: 原生支持 Credit Grants (预付积分发放与到期规则)</text>

  <text x="846" y="288" class="card-title" fill="#6ee7b7">3. Lago (开源自托管) / Amberflo</text>
  <text x="846" y="306" class="body">• 优势: 开源可私有化部署在企业 VPC 内，高吞吐低成本</text>
  <text x="846" y="322" class="body">• 特性: 实时余额门禁接口防止欠费透支</text>

  <text x="846" y="350" class="card-title" fill="#fcd34d">4. Intercom Fin / Zendesk Outcome 模式</text>
  <text x="846" y="368" class="body">• 标杆: 仅对“AI 独立解决且用户未转人工”的对话收 $0.99</text>
  <text x="846" y="384" class="body">• 必须配齐 72h 客户重开回拨锁以防假关单争议</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度 AI SaaS 用量与超额账单池 ($95,000)</text>
  <text x="860" y="456" class="body">• 传统死循环超支+过期清零+假结果费: $95,000/季</text>
  <text x="860" y="476" class="mono">• 实时斜率熔断拦截异常递归 Token 空耗: -$11,400</text>
  <text x="860" y="496" class="mono">• 剔除 5xx 重试与 72h 重开假解决工单费: -$9,500</text>
  <text x="860" y="516" class="mono">• 预付积分跨月结转 + 阶梯承诺包折算: -$7,600</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净支出: $66,500 (净省 $28,500 / -30%)</text>
  <text x="860" y="574" class="body">Provenance: official_list_price + synthetic</text>
  <text x="860" y="594" class="body">Mandate: saas_usage_outcome_billing_optim_409</text>
</svg>

  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统生物安全柜、通风橱与洁净室年检四大黑洞 (Legacy Lab Cert Leakage: 32%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 风机只开到 55% 占空比远未饱和，却骗实验室花 $3,250 做熏蒸并强换 HEPA 滤网</text>

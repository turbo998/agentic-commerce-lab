  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">且无 &gt;0.01% 破损穿孔，强制上调风机转速校准，11ms 硬拦截 $3,250 提前骗换滤网。</text>


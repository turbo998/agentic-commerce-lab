  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">一下 100 FPM 面风速，却按全套 ASHRAE 110 示踪气体截留率测试 ($650/台) 开票。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. USP &lt;797&gt; 洁净间微生物监测，将每盒 $12 的 TSA 琼脂接触皿加价到 $195/皿</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">在医院肿瘤静配中心半年检中，把成本仅 $12 的大豆酪蛋白琼脂皿 (TSA Plate) 按</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">$195/个天价打包进采样费，且未交由独立 AIHA EMLAP 认证微生物实验室培养。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 派无个人 NSF / CETA CNBT 执照的学徒工贴合格标，致静配药房被药监局关停</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">NSF/ANSI 49 认证严格“认人不认公司”，上门贴标的技术员本人未在 NSF 官网注册，</text>

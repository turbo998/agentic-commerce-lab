  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">61%，不良检测员却隐瞒 45% 风机储备裕度，谎称“滤网堵死”强收 $850 熏蒸 + $2,400 滤网。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 拿风速仪在通风橱窗口测 30 秒面风速 ($95)，却按 $650 全套 ASHRAE 110 收费</text>

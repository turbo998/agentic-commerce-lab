<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg271" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent271" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dangerGrad271" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad271" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg271)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="480" height="28" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="1"/>
  <text x="284" y="55" fill="#fb923c" font-size="13" font-weight="700" text-anchor="middle">ROUND 269 · PRIVATE RAILCAR FLEET, AAR CRB REPAIR &amp; RIC 6007</text>
  <text x="44" y="96" fill="#f8fafc" font-size="22" font-weight="800">B2B 智能体自备铁路货车车队租赁（Private Railcar）、AAR 异地维保与里程均衡清算架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">轨边 WILD≥90 kips 换轮锁与 $1,950 可车削旧轮残值门禁 + 车载 &gt;6G 撞击识别驼峰调车责任 (Rule 32) + RIC 6007 空重比≤105% vs. 强换好轮与撞车甩锅</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent271)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad271)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统自备铁路罐车 Railinc CRB 盲付的三大失血黑洞（年损 8%~16%）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. 趁换闸瓦强换 75% 寿命好轮对 &amp; 旧轮按废铁低抵（Rule 41 · 403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 轨边 WILD 冲击值仅 45 kips (未达 ≥90 kips 强换线)，沿途铁路检修所却强行换新收 $4,200</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 拆下旧轮轮辋 &gt;7/16" 本应退 $1,950 二手车削残值，却按 $280 废铁价抵扣，净坑 $1,670/轴</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 铁路检修段利用“先斩后奏”特权把过境自备货车当成高毛利提款机</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. 铁路驼峰调车场超速猛撞损坏却甩锅给货主（AAR Rule 32 · 422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• 铁路编组场违规以 9 mph (&gt;4 mph 红线) 超速溜放撞击，产生 8.5G 冲击撞断车钩与端梯</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• 原本 100% 属承运铁路全责 (Handling-Line $0)，检修员却填成“货主自然老化”收 $3,500</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 货主无车载碰撞遥测铁证，替铁路公司的野蛮调车作业常年背黑锅</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. 空车跨区修车突破 RIC 6007 105% 空重比 &amp; 退租内衬敲诈（451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• 盲目将空罐车调往远方修理厂，导致年度空驶里程超重载里程 105%，每超1英里罚 $0.72</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 5 年期满退租时，租赁商将化工品正常内壁变色污损勒索 $28,000/节全罐喷砂重涂费</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 年底突遭数十万美元空驶均衡罚单，且退租维保成本彻底失控</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad271)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + Ehms WILD + 车载碰撞遥测四重门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · Ehms WILD (≥90 kips) 换轮锁与 $1,950 车削残值门禁（拦截 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 按车号+轴位 (R1..L4) 穿透核验 Railinc Ehms 轨边 WILD 报警记录，并强制</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">对轮辋 &gt;7/16" 的拆下旧轮追回 $1,950 二手车削残值；无故换轮 11ms 自动拒付</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · 车载 GPS + &gt;6G 冲击传感器与 AAR Rule 32 免赔锁（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">将 CRB 报修时间戳与罐车太阳能物联网黑匣子记录的编组场 &gt;6G 超速撞击事件</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">时空对齐，自动生成 AAR Rule 32 Handling-Line 铁证回执，货主 $0 免赔</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · RIC 6007 空重里程比 (≤105%) 锁与退租内衬折旧门禁（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">优先调度重载顺路移动修车车队 (MRU) 将空重车里程比锁死在 ≤105%，并在退租时</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">按环氧内衬剩余寿命比例折算，拦截将正常化工变色充当毁损的全额敲诈</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 车队月结自动清算 &amp; 旧轮残值升级+Rule 95 追偿双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">10ms 签发 b2b_railcar_private_fleet_mileage_... 令牌；核减 $60,800 虚高维保费转 409</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#fb923c" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 合规 CRB 车队清算</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">WILD 达标 + $1,950 残值 ($760k)</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Railcar Fleet Settled · 10ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · 强换好轮/废铁价低抵</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">无 WILD 报警或吞 $1,670 残值</text>
  <text x="410" y="692" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">WHEEL_SWAP_SCRAP_FRAUD</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · 驼峰撞车甩锅给货主</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">编组场 &gt;8G 撞击伪造自然磨损</text>
  <text x="642" y="692" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">HANDLING_LINE_IMPACT_SHIFT</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · 空驶超 105%/退租敲诈</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">RIC 6007 罚单或 $28k 内衬重涂</text>
  <text x="874" y="692" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">RIC6007_LINING_OVERCHARGE</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · 残值升级+Rule 95 追偿</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">立省 $60.8k ($699.2k 净付)</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">CRB_WHEEL_CREDIT_CONFIRM</text>
</svg>

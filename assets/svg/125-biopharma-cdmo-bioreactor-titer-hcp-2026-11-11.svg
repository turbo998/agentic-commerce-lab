    <text x="823" y="321" fill="#CBD5E1">  延迟：15 ms · 拒收老旧填料纯化不合格原液</text>

    <text x="823" y="351" font-weight="700" fill="#FDE68A">• Web IQ N-1 灌流与连续层析省填料 (409)</text>
    <text x="823" y="370" fill="#CBD5E1">  延迟：300 ms · 节省：$62,000.00 (15.9% 降本)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  144 / 144 单元测试 100% 通过 (CSP 自包含)</text>

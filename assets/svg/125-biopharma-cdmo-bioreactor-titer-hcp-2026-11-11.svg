  <!-- Left Card: Legacy Slot Reservation & Contamination/Low-Titer Failure -->
  <rect x="40" y="132" width="355" height="360" rx="12" fill="url(#cardBg125)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="148" width="323" height="32" rx="6" fill="#450A0A"/>
  <text x="217" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">
    ❌ 传统按罐位预订盲付与染菌低产踩坑
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 一次性反应袋微漏染菌却强收 100% 罐位费</text>
    <text x="58" y="224" fill="#CBD5E1">• 2,000L 一次性生物反应袋 (SUB) 焊缝微孔感染支原体</text>
    <text x="58" y="242" fill="#CBD5E1">• 或溶氧/补料失控致滴度仅 1.8 g/L，CDMO 照收 $390,000</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. Protein-A 亲和层析填料老化致 HCP 杂质超标</text>
    <text x="58" y="294" fill="#CBD5E1">• 填料超 150 次循环未换，宿主细胞蛋白 HCP &gt; 420 ppm</text>
    <text x="58" y="312" fill="#CBD5E1">• 聚集体二聚体 &gt; 5% 或内毒素 &gt; 0.1 EU/mg，临床申报被拒</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 违反 FDA 21 CFR Part 11 数据完整性或噬菌体污染</text>
    <text x="58" y="364" fill="#CBD5E1">• 层析工作站手动删除异常紫外峰，收到 FDA 483 警告信</text>
    <text x="58" y="382" fill="#CBD5E1">• 导致创新药企 IND/BLA 上市进程延误整整 9 个月</text>
  </g>

  <rect width="1200" height="630" fill="url(#bg125)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent125)"/>

  <!-- Header -->
  <rect x="40" y="24" width="390" height="28" rx="14" fill="#831843" stroke="#F472B6" stroke-width="1"/>
  <text x="235" y="43" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#FCE7F3" text-anchor="middle">

  </text>
  <text x="60" y="565" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    必须绑定：① 在线拉曼光谱分泌滴度 &gt;=5.0 g/L 且 qPCR 支原体/病毒阴性 (12ms 拦 403)；② 宿主细胞蛋白 HCP &lt;=100 ppm 且内毒素 &lt;=0.1 EU/mg (15ms 拦 422)；
  </text>
  <text x="60" y="586" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    ③ Web IQ 核查 FDA 21 CFR Part 11 层析审计追踪与 OAI 警告信 (290ms 拦 451)，并切换 N-1 灌流培养与多柱连续层析省 40% Protein-A 树脂费立省 $62,000 (300ms)。

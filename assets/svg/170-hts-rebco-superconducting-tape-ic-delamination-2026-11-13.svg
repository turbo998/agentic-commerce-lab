  <rect width="1200" height="630" fill="url(#bg170)" rx="16"/>
  <rect x="28" y="22" width="1144" height="6" fill="url(#accent170)" rx="3"/>

  <text x="36" y="60" class="title">Round 168 · 可控核聚变与高场 MRI 第二代高温超导 (2G HTS REBCO) 带材、20T 强场与防脱层架构图</text>
  <text x="36" y="84" class="sub">2G HTS REBCO Coated Conductor Offtake, 20K/20T Critical Current (&gt;=650 A/4mm), 0 Dropout &amp; Transverse Delamination (&gt;=35 MPa)</text>

  <!-- Left Card: Failure Mode -->
  <rect x="36" y="104" width="355" height="390" rx="12" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="52" y="120" width="160" height="24" rx="12" fill="#fca5a5"/>
  <text x="64" y="136" class="pill-err">⛔ 传统按公里与77K端头盲付</text>
  <text x="52" y="166" class="card-h">三大 20T 强场掉流、局部失超炸毁与环氧冷却脱层灾难</text>

  <text x="52" y="196" class="body" fill="#fca5a5" font-weight="700">1. 无 BZO 纳米柱致 20T 掉流 75% 与中段失超热点</text>
  <text x="52" y="216" class="body">77K 液氮无磁场端头合格，但缺锆酸钡 (BZO) 磁通</text>
  <text x="52" y="234" class="body">钉扎柱致 20K/20T 强场下 Ic 暴跌至 180A；50km</text>
  <text x="52" y="252" class="body">中间 1cm 跌落点通电 1 秒即引爆整台聚变磁体失超！</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. 环氧冷却至 20K 热收缩将超导陶瓷层整层撕脱</text>
  <text x="52" y="302" class="body">环氧收缩率是金属基带的 5 倍，横向抗剥离 &lt;35 MPa</text>
  <text x="52" y="320" class="body">时冷却瞬间将 REBCO 层撕裂；高阻接头烧干液氦。</text>

  <text x="52" y="350" class="body" fill="#fca5a5" font-weight="700">3. 弱磁性基带掺假与溅射腔室 75% 高纯白银浪费</text>
  <text x="52" y="370" class="body">以磁性 Ni-W 冒充无磁 Hastelloy C-276 扭曲磁场；</text>
  <text x="52" y="388" class="body">真空室防着板上 75% 溅射白银与分条废边未冲抵。</text>

  <rect x="52" y="418" width="323" height="58" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="64" y="440" class="mono" fill="#f87171">Legacy: 50 km Spool + 77K Self-Field End-Cut</text>
  <text x="64" y="460" class="mono" fill="#fca5a5">Result: $780,000 exposed to 20T quench &amp; cleavage</text>

  <!-- Center Card: Mandate Pipeline -->
  <rect x="412" y="104" width="380" height="390" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="428" y="120" width="242" height="24" rx="12" fill="#6ee7b7"/>
  <text x="440" y="136" class="pill-ok">🛡️ hts_rebco_tape_mandate</text>
  <text x="428" y="166" class="card-h">四层 20T 强场钉扎、零跌落与防脱层门禁（10ms–280ms）</text>

  <rect x="428" y="182" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>

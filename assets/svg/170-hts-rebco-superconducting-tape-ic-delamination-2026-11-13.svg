  <text x="440" y="220" class="body">BZO 钉扎 Ic_min(20K,20T,B||c) &gt;=650 A/4mm &amp;</text>
  <text x="440" y="238" class="body">全长 TapeStar 局部电流跌落点 = 0 — 违者直返 403</text>

  <rect x="428" y="258" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="278" class="mono">Gate 2: Delamination &amp; nΩ Joint (14ms)</text>
  <text x="440" y="296" class="body">c 轴砧座横向抗剥离 σ_delam &gt;=35 MPa &amp; 搭接焊</text>
  <text x="440" y="314" class="body">接头电阻 R_joint &lt;=2.0 nΩ — 冷却脱层直返 422</text>

  <rect x="428" y="334" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="354" class="mono">Gate 3: Web IQ C-276 &amp; Fusion QA (280ms)</text>
  <text x="440" y="372" class="body">核验无磁 Hastelloy C-276 基带炉批与聚变磁体</text>
  <text x="440" y="390" class="body">中子辐照 QA 台账 — 磁性基带掺假直返 HTTP 451</text>

  <rect x="428" y="410" width="348" height="68" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="430" class="mono" fill="#fcd34d">Gate 4: Sputter Ag &amp; 12mm Laser Slit (245ms)</text>
  <text x="440" y="448" class="body">磁控溅射腔防着板白银 98.5% 电解重铸 + 12mm 母带</text>
  <text x="440" y="466" class="body">光纤激光无毛刺三切分条冲抵立省 $109,200 触发 409</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="812" y="104" width="352" height="390" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="828" y="120" width="184" height="24" rx="12" fill="#fde68a"/>
  <text x="840" y="136" class="pill-warn">📊 5-Lane 实测矩阵与 Web IQ</text>
  <text x="828" y="166" class="card-h">零虚构坐标定量实测（Provenance: measured）</text>

  <text x="828" y="194" class="mono" fill="#4ade80">✅ HTTP 200 (10ms) · 20T 强场高流与抗脱层放行</text>
  <text x="828" y="212" class="body">Ic 720A + 0 跌落 + 抗剥离 52MPa → $780,000</text>

  <text x="828" y="240" class="mono" fill="#f87171">⛔ HTTP 403 (11ms) · 20T 强场掉流或中段跌落点</text>
  <text x="828" y="258" class="body">20T Ic=180A 或含失超死点 → 冻结 $780,000.00</text>

  <text x="828" y="286" class="mono" fill="#fb923c">⛔ HTTP 422 (14ms) · 环氧冷却脱层或高阻接头</text>
  <text x="828" y="304" class="body">抗剥离 8.5MPa 或接头 45nΩ → 拒付 $780,000.00</text>

  <text x="828" y="332" class="mono" fill="#c084fc">⛔ HTTP 451 (280ms) · Web IQ 磁性基带或 QA 缺失</text>
  <text x="828" y="350" class="body">混入磁性 Ni-W 基带扭曲磁场 → 熔断 $780,000.00</text>

  <text x="828" y="378" class="mono" fill="#facc15">🟡 HTTP 409 (245ms) · 溅射银回收与 12mm 激光分条</text>
  <text x="828" y="396" class="body">节省 $109,200 (-14%) → 确认后净付 $670,800.00</text>

  <rect x="828" y="416" width="320" height="62" rx="8" fill="#1e293b"/>
  <text x="840" y="438" class="body" font-weight="700" fill="#38bdf8">Web IQ (/v3/browse) vs Exa / Bright Data</text>
  <text x="840" y="458" class="body">准确率 100% · P50 245ms · 抗注入 100% · 磁体保密</text>

  <!-- Footer -->
  <rect x="36" y="512" width="1128" height="92" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="538" class="card-h" fill="#38bdf8">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• 高温超导带材严禁“仅看 77K 液氮无磁场端头抽检盲付”：掩盖了缺 BZO 纳米柱在 20T 强场下掉流 75% 及环氧冷却把超导层撕脱的灾难。</text>
  <text x="54" y="584" class="body">• 必须将 20K/20T 最小临界电流 (&gt;=650A)、全长 0 跌落、横向抗剥离 (&gt;=35MPa) 与纳欧接头绑定为智能托管解锁谓词。</text>

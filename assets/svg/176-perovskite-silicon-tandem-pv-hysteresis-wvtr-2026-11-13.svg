  <text x="52" y="234" class="body">打出 720W 假高分 (迟滞 HI=14.5%)，真正晒太阳 3</text>
  <text x="52" y="252" class="body">分钟离子堆积屏蔽电场，真实功率当场跌剩 590W！</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. 强光卤素相分离、进水变黄粉 PbI2 与雨水溶铅</text>
  <text x="52" y="302" class="body">光照下溴碘分相崩电压，边封漏水半年发黄报废；</text>
  <text x="52" y="320" class="body">无固铅胶膜时冰雹砸裂淋雨溶出重金属铅污染农田。</text>

  <text x="52" y="350" class="body" fill="#fca5a5" font-weight="700">3. 1cm² 实验室小片证书冒充大组件与涂布溶剂排空</text>
  <text x="52" y="370" class="body">拿小片旋涂效率忽悠大面积组件采购；狭缝涂布挥发</text>
  <text x="52" y="388" class="body">的 DMF 溶剂与厚硅片未执行深冷回收与薄片冲抵。</text>

  <rect x="52" y="418" width="323" height="58" rx="8" fill="#0f172a" stroke="#7f1d1d"/>

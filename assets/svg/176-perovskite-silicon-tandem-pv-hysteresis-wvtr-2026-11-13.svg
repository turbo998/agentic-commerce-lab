  <text x="440" y="296" class="body">双85+1Sun 光热衰减 &lt;=5%, 丁基胶 WVTR &lt;=1e-4 &amp;</text>
  <text x="440" y="314" class="body">破损淋雨铅析出 &lt;=0.05 mg/L — 溶铅直返 HTTP 422</text>

  <rect x="428" y="334" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="354" class="mono">Gate 3: Web IQ &gt;=2m2 TÜV &amp; Pb-Trap (280ms)</text>
  <text x="440" y="372" class="body">核验全尺寸组件 (&gt;=2.0 m²) TÜV IEC 61215 证书与</text>
  <text x="440" y="390" class="body">原位磷酸基螯合固铅胶膜 — 小片冒充直返 HTTP 451</text>

  <rect x="428" y="410" width="348" height="68" rx="8" fill="#1e293b" stroke="#f59e0b"/>

  <rect x="36" y="512" width="1128" height="92" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="538" class="card-h" fill="#38bdf8">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• 钙钛矿叠层组件严禁“仅看 10ms 脉冲闪测盲付”：卤素离子迁移使快速反扫虚增 18% 假功率，且缺固铅胶膜会在冰雹破损时溶出重金属铅。</text>
  <text x="54" y="584" class="body">• 必须将正反扫迟滞 HI (&lt;=1.5%)、300s 稳态 MPPT、双 85 光热老化与淋雨铅析出 (&lt;=0.05mg/L) 绑定为智能托管谓词。</text>

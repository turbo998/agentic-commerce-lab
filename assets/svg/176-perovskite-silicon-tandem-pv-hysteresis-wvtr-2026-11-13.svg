  <text x="36" y="60" class="title">Round 174 · 钙钛矿/晶硅叠层光伏组件 (Tandem PV)、300s 稳态 MPPT 与原位固铅阻水架构图</text>
  <text x="36" y="84" class="sub">Perovskite-Silicon Tandem PV Offtake, I-V Hysteresis (&lt;=1.5%), 300s Steady MPPT, Edge WVTR (&lt;=1e-4) &amp; Lead Sequestration</text>

  <!-- Left Card: Failure Mode -->
  <rect x="36" y="104" width="355" height="390" rx="12" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="52" y="120" width="160" height="24" rx="12" fill="#fca5a5"/>
  <text x="64" y="136" class="pill-err">⛔ 传统按块数与10ms闪测盲付</text>
  <text x="52" y="166" class="card-h">三大离子迁移虚标瓦数、进水发黄与破损溶铅灾难</text>

  <text x="52" y="196" class="body" fill="#fca5a5" font-weight="700">1. 10ms 闪测虚标 720W 但稳态发电暴跌 18%</text>

  <text x="440" y="448" class="body">狭缝涂布 99.2% 溶剂蒸汽深冷冷凝回收 + 100um 超薄</text>
  <text x="440" y="466" class="body">异质结 (HJT) 底电池减硅协同冲抵立省 $77,000 触发 409</text>


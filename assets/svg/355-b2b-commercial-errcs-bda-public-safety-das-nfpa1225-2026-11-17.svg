  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统楼宇消防无线电 ERRCS / BDA 维保四大黑洞 (Legacy ERRCS Leakage: 35%–60%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 不带频谱扫频仪，拿两部对讲机在大堂喊两声就收 $4,800 全楼 20 宫格年检费</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">违反 NFPA 1225 逐层划分 20/40 宫格用 PCTEL 扫频仪实测 &gt;=-95 dBm 的规定，直接</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">复制去年的旧 Word 表格改日期交差，掩盖地下消防水泵房与楼梯间对讲盲区。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 雷雨后 $95 屋顶天馈防雷管 (PolyPhaser) 击穿，被虚报为 $18,000 换 BDA 主机</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">屋顶施主天线感应雷电后，串联的 $95 同轴气体放电防雷器主动熔断保护了主机，</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">不良弱电商却谎称“$18,000 双向射频放大器 (BDA) 主板被雷劈穿报废”骗换整机。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 上行增益乱调超隔离度红线引发自激啸叫，瘫痪全市 911 警用基站遭 FCC 重罚</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">未遵守“天馈隔离度 &gt;= 最大增益 + 20 dB”铁律，盲目调高增益引发正反馈自激，</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">向市政 700/800 MHz 公安消防铁塔狂发噪声干扰，引来 FCC 执法车上门查封罚 $25,000。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 检测员无 FCC GROL 通用无线电操作员执照，报告被消防局 (AHJ) 直接退回</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">派普通弱电拉线工冒充射频工程师，无个人 FCC GROL (PG-XXXXXX) 执照且未在</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">FCC Part 90 信号增强器数据库注册，导致大厦年度消防验收不过面临停业风险。</text>


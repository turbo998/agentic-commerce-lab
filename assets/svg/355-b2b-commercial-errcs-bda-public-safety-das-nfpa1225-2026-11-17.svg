  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">天馈隔离度 &gt;= Gain + 20 dB 证明，11ms 硬拦截手填假表与自激干扰隐患。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. $95 PolyPhaser 同轴防雷器更换与步进增益衰减降级锁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">雷雨后施主信号丢失或驻波告警强制先测 $95 同轴防雷器通断，自激告警锁定软件</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">衰减调校，14ms 封杀将外围防雷管熔断虚报为 $18,000 更换整台 BDA 主机。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 FCC GROL 执照与增强器备案号 (265ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">265ms 在线穿透核验签字人 FCC Universal Licensing System (GROL PG-XXXXXX)</text>

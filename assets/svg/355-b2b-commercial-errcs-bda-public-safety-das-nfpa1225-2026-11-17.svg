  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">商业楼宇消防应急无线电覆盖结算：逐层 20 宫格扫频锁、$95 防雷器降级锁 vs 假年检与上行干扰</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_commercial_errcs_bda_public_safety_das_nfpa1225_fcc_grol_mandate_2026 · 15.0% Savings ($18,900 / Batch)</text>


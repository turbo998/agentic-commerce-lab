  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动将 $18,000 换 BDA 主机降级为换 $95 防雷器并调校增益 (230ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将功放完好的 BDA 整换降级为更换同轴防雷器与步进增益调校并剔除假网格费：</text>

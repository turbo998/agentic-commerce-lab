  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. PCTEL 逐层 20 宫格扫频文件锁 (99% 关键区达标) + 隔离度锁 (11ms → HTTP 403)</text>

  <text x="54" y="584" class="body">• 必须将 Burn-Leach SiC 破损 (&lt;=1e-5)、1,200°C ECR (&lt;=3%)、径向氢化物 Fn (&lt;=0.25) 与 Hf (&lt;=50ppm) 绑定为智能托管谓词。</text>

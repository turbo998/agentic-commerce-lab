  <!-- Header -->
  <text x="48" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 327 · B2B COMMERCIAL SCAFFOLDING RENTAL, SWING-STAGE ACCESS &amp; MODULAR SITE OFFICE TRAILERS</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">模块化脚手架与工地办公箱房租赁：48h 拆架止租锁、现场料架清点 vs 拖延拆架与回库讹诈</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_commercial_scaffolding_modular_trailer_offrent_piece_count_mandate_2026 · 15.0% Savings ($30,750 / Batch)</text>

  <!-- Left Panel: Legacy Scaffolding & Site Trailer Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统脚手架与移动办公箱房租赁四大黑洞 (Legacy Scaffold Leakage: 25%–50%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 已发拆架通知却故意拖延 21 天不派人来拆照收 $13,650 铁管租金</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">OSHA 严禁总包自行拆架；客户通知完工报停后，供应商借口工人忙拖延 3 周不拆，</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">并强词夺理主张“只要钢管还在工地上就按 $650/天照收在场租金”。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 装车只写“18 捆待点”，拉回仓库单方面虚报 320 根横杆丢失索赔 $18,000</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">退场装车时不按根清点，两周后发来仓库盘点单宣称丢了 320 根盘扣横杆、85 块</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">钢跳板沾了水泥直接判报废，按全新品原价的 200% 强行扣款索赔。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. $450 板房铝合金楼梯按 $165/月连租 24 期花 $3,960 + 28 天年收 13 期</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">工地移动办公箱房按 28 天伪月度周期一年收 13 个月租金；门口楼梯、地锚、桌椅</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">累计租金高达买价的 8 倍，退箱时再讹 $3,800 地板磨损翻新费与 22% 免责险。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 缺失 OSHA 每日绿牌 (Green-Tag) 巡检或 &gt;125 英尺高架无 PE 工程师签章</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">超高脚手架未经注册结构工程师 (PE) 验算防风拉结，或缺失 Competent Person</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">班前绿牌安全检查日志，引发脚手架整体失稳坍塌与 OSHA 停工重罚。</text>


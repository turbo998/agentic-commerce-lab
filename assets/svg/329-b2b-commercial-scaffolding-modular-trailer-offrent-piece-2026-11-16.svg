  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 电子拆架通知 +48h 强制归零日租 + 现场料架清点终局锁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自项目发出 Dismantle Call-Off 满 48 小时起强制截断每日管件租金；退场强制在</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">工地装车前按标准计数料架双签确权，11ms 拒付一切回库事后单方盲点索赔。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 板房配件累计租金 100% 买断封顶 + 自然月周期门禁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">实时追踪楼梯、坡道、桌椅历史累计已付租金，满购置价 100% 自动停止计租；强制</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">按 12 个自然月而非 28 天 13 期计费，14ms 拦截天价配件与正常磨损翻新费。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 OSHA 绿牌日志与 &gt;125ft PE 签章 (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 在线核查州工程委员会注册工程师 (PE) 执照有效性 (&gt;125ft 脚手架必备)</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">及现场 Competent Person 每日 NFC 绿牌打卡完备率，守住高空防坠底线。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动截断 21 天拆架滞留租金并免除 22% 板房强险 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动砍除报停后滞留租金、封顶超买价楼梯月租并凭 Builders Risk COI 免除 22% 强险：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $205,000.00 → 自动核减 $30,750.00 (15.0%) → 净付 $174,250.00！</text>


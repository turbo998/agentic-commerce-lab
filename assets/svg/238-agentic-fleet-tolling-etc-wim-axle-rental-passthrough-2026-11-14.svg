  <text x="159" y="57" fill="#042F2E" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 236 · FLEET ETC &amp; TOLLING</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体车队高速路桥不停车收费 (ETC) 轨迹防套牌、WIM 轴数核对与租车清分架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">车载 OBU+ELD 时空互验 + VIN 轴数纠偏 + 租期毫秒切片令牌 (`agentic_fleet_tolling_etc_wim_axle_rental_passthrough_mandate_...`)</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red238)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：盲付套牌重卡过桥费 + 2轴当5轴乱扣 + 还车后错扣与 $15/天管理费</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 套牌黑车 Video OCR 冒名盗刷 + 伪造高速催费钓鱼短信 (Smishing)：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 套牌大货车在纽约过桥，OCR 账单发给停在芝加哥仓库的真车队，AI 不查 GPS 照单付款；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 轻信伪造 E-ZPass 逾期催缴短信链接，导致企业卡信息在钓鱼网站被盗刷！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 门架将 2 轴厢货误判成 5 轴重卡多收 5 倍费 + 还车后越界错扣：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 按账单入账日而非过门架物理时刻扣款，把还车后下一任租客或洗车工的过路费扣在前客卡上。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 租 7 天只过 1 次 $1.75 收费桥，却按全部 7 天强收 $14.99/天管理费：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 对未上高速的“零通行日”强收包干管理费，违反 NY GBL § 399-z 与 FTC 反垃圾费规则。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms Cloned Plate/Smishing) | HTTP 422 (14ms Axle/Post-Return)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#tol238)"/>
  <text x="890" y="161" fill="#042F2E" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：OBU+ELD 轨迹互验 + VIN 轴数纠偏 + 租期毫秒切片网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 门架坐标 vs 车载 FMCSA ELD/GPS 轨迹互验 (≤500m &amp; ±60s)：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 比对过车时刻本车真实 GPS 经纬度，100% 拦截异地套牌黑车与 OCR 看错车牌，</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 并自动打包硬件签名 ELD 轨迹图向高速管理局发起免责核减申诉！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 17位 VIN 核定轴数纠偏 + [提车, 还车] 毫秒级闭区间切片：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 14ms 阻断 2 轴车误按 5 轴扣费；严格按 Gantry_Pass_UTC 物理时刻切分租客责任。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 费率核验与防损增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 零通行日强制 $0 管理费并锁定 OBU 射频折扣免除 45% 视频罚金，单批立省 $31,200.00！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $390k Fleet ETC/Rental) | HTTP 409 ($31.2k Toll/OBU Saved)</text>


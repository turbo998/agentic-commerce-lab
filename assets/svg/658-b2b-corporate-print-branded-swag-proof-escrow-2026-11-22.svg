  <text x="46" y="642" class="mono">$66,600 Saved / $180k Pool</text>

  <rect x="318" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="336" y="604" class="kpi-num" fill="#10b981">100% Brand-DAM</text>
  <text x="336" y="626" class="kpi-lbl">300-DPI Vector &amp; Pantone PMS Locked</text>
  <text x="336" y="642" class="mono">Zero Misprinted Logo Scrap</text>

  <rect x="608" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="626" y="604" class="kpi-num" fill="#f59e0b">-67% Unit Cost</text>
  <text x="626" y="626" class="kpi-lbl">Cross-Dept Tier-Break Batching</text>
  <text x="626" y="642" class="mono">Redirects to Central Swag Locker</text>

  <rect x="898" y="572" width="274" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="916" y="604" class="kpi-num" fill="#f472b6">0 Closet Rot</text>
  <text x="916" y="626" class="kpi-lbl">On-Demand Claim Link &amp; Size Picker</text>
  <text x="916" y="642" class="mono">100% FCPA &amp; Gov Gift Compliant</text>

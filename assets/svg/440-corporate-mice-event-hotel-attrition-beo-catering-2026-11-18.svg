  <!-- Header -->
  <text x="52" y="58" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · ROUND 438 · CORPORATE MICE EVENTS, HOTEL ROOM-BLOCK ATTRITION &amp; BEO CATERING AGENT</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">企业会展 (MICE)、酒店包房与宴会采购 (Cvent/Marriott) 架构：转售房冲抵、BEO 保底与 AV 审单</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">搭建商 COI 责任险与定金防伪锁 · 酒店已转售空房全额冲抵违约金 · 剥离 AV 设备 24% 餐饮服务费与 72h 保底寻优 · 立省 $74,400 (24.0%)</text>

  <!-- Left Column: MICE & Banquet Pitfalls -->
  <rect x="48" y="132" width="352" height="390" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="162" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统企业峰会与酒店宴会三大出血点</text>

  <rect x="64" y="178" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 酒店把未住满房间卖给散客却仍收双份违约金</text>
  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 团队房少住 100 间，酒店当日散客满房已将空房高价转售</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 结账时酒店隐瞒转售记录，照收 100% 房价违约金 (Double-Dip)</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 甚至未扣除 25% 客房打扫变动成本与免税住宿税!</text>


  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 几十页 BEO 执行单将 LED 大屏、同传与专线网络混入餐饮组</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 违规加收 24% 餐饮服务费，单场白多付 $19,200 冤枉钱</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 搭建商无 COI 责任险进场施工或遭遇假邮件篡改定金账号!</text>

  <rect x="64" y="398" width="320" height="106" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="420" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 会前 72h 按报名人数傻报保底 -> 15% 空席倒掉</text>
  <text x="78" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 1,000 人免费报名直接报 1,000 份 $150 晚宴保底人数</text>
  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 现场只来 850 人，且浪费了酒店合同自带的 5% 免费备餐缓冲</text>
  <text x="78" y="480" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 传统大型峰会酒店与宴会结算损耗基线：$310,000 / 场</text>


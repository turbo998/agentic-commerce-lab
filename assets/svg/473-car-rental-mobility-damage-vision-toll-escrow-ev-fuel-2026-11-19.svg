  <rect width="1200" height="675" fill="url(#bg473)" />
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent473)" />

  <!-- Header -->
  <text x="44" y="48" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 30 · CAR RENTAL, P2P MOBILITY, PRE/POST DAMAGE VISION DIFF &amp; TOLL/EV-SOC ESCROW</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">商旅租车与共享出行：防还车 AI 误判历史划痕、防重复买 CDW 险与 ETC 过路费子令牌</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Hertz / Enterprise / Avis vs Turo / 携程租车 vs ISO 8583 0420 Reversal vs Azure Foundry + OBD-II &amp; Vision Gate</text>

  <!-- Left Panel: 3 Core Car Rental & Mobility Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 租车自驾与商旅用车三大扣款黑洞</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. 还车龙门架把历史旧伤/水渍当新划痕扣 $800</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 机场自动化扫描仪把取车前已有的保险杠擦痕或</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  雨滴反光误判为新增车损，离场后直接刷走 $800</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：取还车双时间戳 3D 视觉差分验真锁</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  无双端比对证据严禁扣车损 (HTTP 403 拦截)</text>

  <rect x="62" y="328" width="314" height="132" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="76" y="352" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2. 柜台诱导重复买碰撞险(CDW)与油电表刺客</text>
  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 企业大客户协议或 Visa Infinite 已含全额车损险，</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  柜台仍强加 $45/天 LDW，或满油还车被收 $9.99/加仑</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：企业协议 CDW 冲突锁 + OBD-II 真实油量/</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  电池 SOC 遥测核验 (HTTP 422 拦截乱收费)</text>

  <rect x="62" y="474" width="314" height="134" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. NHTSA 召回车辆出租与押金死锁 30 天</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 租车行将存在安全召回未修复的 VIN 车辆派给客户</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ 实时 NHTSA VIN 召回熔断 (HTTP 451)</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 还车秒级 0420 解冻押金 + 14天定额 ETC 子令牌</text>
  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  消灭重复投保与天价罚单立省 23% (HTTP 409)</text>

  <!-- Center Panel: 5-Lane Deterministic Gate -->
  <rect x="414" y="132" width="402" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="434" y="164" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ 商旅租车与车损/过路费托管五车道状态机</text>

  <rect x="434" y="184" width="362" height="72" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="450" y="208" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 200 · RENTAL_VISION_SOC_TOLL_ESCROW_AUTHORIZED</text>
  <text x="450" y="228" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">取还车外观一致 + OBD油电达标 + 押金秒解冻 (10ms)</text>
  <text x="450" y="245" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">car_rental_mobility_toll_escrow_mandate_*</text>

  <rect x="434" y="268" width="362" height="72" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
  <text x="450" y="292" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 403 · PRE_EXISTING_DAMAGE_CLAIM_BLOCKED</text>
  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截把取车前既有划痕当新伤扣费或无取还车双视频证据索赔</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">pre_pickup_scratch_match = true | diff_proof = null</text>

  <rect x="434" y="352" width="362" height="72" rx="8" fill="#431407" stroke="#F97316" stroke-width="1.5" />
  <text x="450" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 422 · DUPLICATE_CDW_OR_FAKE_FUEL_FEE_BLOCKED</text>
  <text x="450" y="396" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截柜台重复加购已含碰撞险(CDW)或违背 OBD 读数的满油罚金</text>
  <text x="450" y="413" fill="#FDBA74" font-family="Consolas, monospace" font-size="11">corp_cdw_included = true | obd_fuel_pct &gt;= 98%</text>

  <rect x="434" y="436" width="362" height="72" rx="8" fill="#3B0764" stroke="#A855F7" stroke-width="1.5" />
  <text x="450" y="460" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 451 · WEBIQ_NHTSA_VIN_RECALL_OR_LATE_TOLL_HOLD</text>
  <text x="450" y="480" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="12">Web IQ 检出所派车辆 VIN 有 NHTSA 未修复安全召回或逾期追讨</text>
  <text x="450" y="497" fill="#D8B4FE" font-family="Consolas, monospace" font-size="11">nhtsa_open_recall = true | key_age &gt; 180d</text>

  <rect x="434" y="520" width="362" height="88" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.5" />
  <text x="450" y="544" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 409 · INSTANT_0420_RELEASE_AND_TOLL_SLICE_CONFIRM</text>
  <text x="450" y="564" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="12">0420 押金秒解冻 + 14天定额 ETC 过路费子令牌 + 免重复投保省 23%</text>
  <text x="450" y="584" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">季度企业租车与出行结算池 $320,000 → 净结算 $246,400 (省 $73,600)</text>


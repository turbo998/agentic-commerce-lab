      <stop offset="0%" stop-color="#07111E" />
      <stop offset="50%" stop-color="#102138" />
      <stop offset="100%" stop-color="#081322" />
    </linearGradient>
    <linearGradient id="accent473" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

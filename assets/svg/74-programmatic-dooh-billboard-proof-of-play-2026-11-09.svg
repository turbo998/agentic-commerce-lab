<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg74" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1b"/>
      <stop offset="50%" stop-color="#171b3b"/>
      <stop offset="100%" stop-color="#221948"/>
    </linearGradient>
    <linearGradient id="accent74" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg74)"/>
  <rect x="30" y="25" width="1140" height="580" rx="18" fill="#0f172a" stroke="#a855f7" stroke-width="2" opacity="0.95"/>
  <rect x="30" y="25" width="1140" height="6" fill="url(#accent74)"/>

  <text x="60" y="72" fill="#d8b4fe" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">ROUND 72 · PROGRAMMATIC DOOH BILLBOARD PROOF-OF-PLAY &amp; FOOTFALL MANDATE</text>
  <text x="60" y="108" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">程序化户外大屏 DOOH 硬件上刊证明与客流倍率托管 vs 传统包月盲投黑屏虚报</text>
  <text x="60" y="136" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">TPM Hardware Play-Log + Light-Sensor Luminance + Geopath Mobile Footfall Multiplier vs. Flat-Lease Dark Screen</text>

  <!-- Left Card -->
  <rect x="60" y="160" width="525" height="335" rx="12" fill="#1f1224" stroke="#ef4444" stroke-width="1.8"/>
  <text x="85" y="196" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ 传统包月买断 / 播放日志自报模式 (Flat Lease / Fake Log)</text>
  <text x="85" y="230" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 黑屏死机照扣费：LED 控制卡死机或白屏 3 天，媒体主后台仍导出 100% 播放报表</text>
  <text x="85" y="260" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 夜间空街按高峰计费：凌晨 3 点空无一人，仍按日间 100% 标准千人成本 (CPM) 扣费</text>
  <text x="85" y="290" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 亮度调低省电欺诈：物业私自把屏幕亮度从 6,000 nits 降到 500 nits 导致阳光下看不清</text>
  <text x="85" y="320" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 播放时长偷工减料：合同约定的 15 秒轮播被切碎成 5 秒闪现，品牌曝光效果归零</text>
  <rect x="85" y="350" width="475" height="120" rx="8" fill="#2e101f" stroke="#f87171" stroke-width="1"/>
  <text x="105" y="382" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">典型户外广告采买资损案例：</text>
  <text x="105" y="410" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">广告主预定 1,200 次 15s 大屏轮播 ($18,000)，其中 180 次因控制卡掉线未播、</text>
  <text x="105" y="434" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">120 次屏幕亮度低于 1,500 nits，且实际客流指数仅为基准的 75% → 虚耗 $7,537.50</text>
  <text x="105" y="456" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 假上刊拦截率：0% | • 亮度与客流核减率：0% | • 媒介对账周期：45 天</text>

  <!-- Right Card -->
  <rect x="615" y="160" width="525" height="335" rx="12" fill="#0c1d2c" stroke="#22c55e" stroke-width="1.8"/>
  <text x="640" y="196" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">✅ 硬件级上刊证明 + 光感亮度 + 实时客流倍率智能合约</text>
  <text x="640" y="230" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 硬件帧缓冲哈希证明：播放器 TPM 签名校验每帧 HDMI 输出哈希与满 15s 时长</text>
  <text x="640" y="260" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 光感与坏点门禁：屏幕亮度 &lt; 3,500 nits（日间）或坏点率 &gt; 2% 的场次自动剔除计费</text>
  <text x="640" y="290" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Geopath/LBS 客流倍率联动：按实时商圈客流倍率 (0.50x–1.50x) 动态结算有效 CPM</text>
  <text x="640" y="320" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• OpenRTB 2.6 DOOH 结算：仅对硬件验真+亮度达标的 900 次有效播放按客流倍率秒级放款</text>
  <rect x="640" y="350" width="475" height="120" rx="8" fill="#072b22" stroke="#4ade80" stroke-width="1"/>
  <text x="660" y="382" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">端到端工程与财务收益（Measured / Deterministic）：</text>
  <text x="660" y="410" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">1,200 次预定剔除 180 次黑屏 + 120 次低亮度 = 900 次有效上刊；按 0.75x 客流</text>
  <text x="660" y="434" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">倍率结算 $10,125.00，自动核减 $7,875.00 黑屏、低亮与客流不足虚高账单</text>
  <text x="660" y="456" fill="#4ade80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 黑屏/低亮拦截率：100% | • 客流倍率核算精度：100% | • 验真耗时：&lt; 22ms</text>

  <!-- Bottom Bar -->
  <rect x="60" y="512" width="1080" height="72" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="85" y="541" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">架构师核心选型法则：</text>
  <text x="235" y="541" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14">程序化户外大屏 Agent 绝不能凭 CMS 排期表付钱！必须绑定【HDMI 帧哈希上刊证明 + 光感亮度达标 + 实时客流倍率】三合一门禁。</text>
  <text x="85" y="567" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Provenance: Deterministic Policy Evaluator (`evaluate_programmatic_dooh_proof_of_play_policy`) · OpenRTB 2.6 DOOH &amp; Geopath · 2026-11-09</text>
</svg>

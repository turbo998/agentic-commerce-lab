  <rect width="1200" height="675" fill="url(#bg467)" />
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent467)" />

  <!-- Header -->
  <text x="44" y="48" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 24 · CLINICAL TRIAL PATIENT STIPEND, ANTI-DUPLICATE ENROLLMENT &amp; HIPAA TAX-BLIND ESCROW</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">临床试验受试者补贴与差旅结算：防职业试药人跨院重入、IRB 限额锁与 HIPAA 隐私税表隔离</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Greenphire ClinCard vs Scout Clinical vs Medidata / Veeva eCOA vs Azure AI Foundry + CTSdatabase &amp; Tax-Blind Gate</text>

  <!-- Left Panel: 3 Core Clinical Stipend Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 临床试验补贴发放三大合规与欺诈黑洞</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. 职业试药人跨院重复入组与假访视骗补</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 隐瞒30天洗脱期在多家医院同时入组领多份补贴，</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  或未完成 eCOA 服药日志与采血访视即触发打款</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：跨中心零知识身份哈希查重 + CTMS/eCOA</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  访视完成签名硬绑定 (HTTP 403 硬阻断)</text>

  <rect x="62" y="328" width="314" height="132" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="76" y="352" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2. 超 IRB 伦理批件不当利诱与差旅混同计税</text>
  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 超出 IRB 核准金额发放补贴构成 FDA“不当利诱”，</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  或把实报实销交通住宿费错误计入 $600 应税收入</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：单访视 IRB 批件硬上限 + 免税差旅报销与</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  应税补贴双账本分离 (HTTP 422 拦截)</text>

  <rect x="62" y="474" width="314" height="134" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 1099 税表暴露患者真名引发 HIPAA 违宪</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 药企财务为开 $600 1099 税表索要患者真名/SSN，</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  直接暴露受试者疾病隐私；或 PI 医生被 FDA 禁业</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ 禁业/HIPAA 泄露熔断 (HTTP 451)</text>
  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  + 第三方盲墙代开税表与免税差旅省 25% (HTTP 409)</text>

  <!-- Center Panel: 5-Lane Deterministic Gate -->
  <rect x="414" y="132" width="402" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="434" y="164" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ 临床受试者补贴与隐私五车道状态机</text>

  <rect x="434" y="184" width="362" height="72" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="450" y="208" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 200 · ECOA_VERIFIED_IRB_CAPPED_BLIND_AUTHORIZED</text>
  <text x="450" y="228" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">无跨院重入 + eCOA访视完成 + IRB合规 + 盲墙发卡 (10ms)</text>
  <text x="450" y="245" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">clinical_trial_stipend_ecoa_mandate_*</text>

  <rect x="434" y="268" width="362" height="72" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
  <text x="450" y="292" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 403 · DUPLICATE_SUBJECT_OR_NO_ECOA_BLOCKED</text>
  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截职业试药人洗脱期内跨院重入或未完成 eCOA 访视领钱</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">cross_site_duplicate = true | ecoa_done = false</text>

  <rect x="434" y="352" width="362" height="72" rx="8" fill="#431407" stroke="#F97316" stroke-width="1.5" />
  <text x="450" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 422 · IRB_CAP_BREACH_OR_UNRECEIPTED_BLOCKED</text>
  <text x="450" y="396" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截超 IRB 伦理批件金额不当利诱或无票据差旅混入应税池</text>
  <text x="450" y="413" fill="#FDBA74" font-family="Consolas, monospace" font-size="11">stipend &gt; irb_cap | travel_tax_mixed = true</text>

  <rect x="434" y="436" width="362" height="72" rx="8" fill="#3B0764" stroke="#A855F7" stroke-width="1.5" />
  <text x="450" y="460" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 451 · WEBIQ_FDA_DEBARRED_OR_HIPAA_LEAK_HOLD</text>
  <text x="450" y="480" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="12">Web IQ 检出 PI 医生在 FDA 禁业名单或向药企泄露患者 SSN</text>
  <text x="450" y="497" fill="#D8B4FE" font-family="Consolas, monospace" font-size="11">fda_debarred = true | sponsor_ssn_leak = true</text>

  <rect x="434" y="520" width="362" height="88" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.5" />
  <text x="450" y="544" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 409 · TAX_BLIND_SPLIT_AND_VOUCHER_CONFIRM</text>
  <text x="450" y="564" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="12">免税差旅直付剥离 + 第三方税务盲墙代发 1099 立省 25%</text>
  <text x="450" y="584" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">季度受试者招募与补贴池 $340,000 → 净结算成本 $255,000 (省 $85,000)</text>


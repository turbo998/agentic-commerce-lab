  <text x="868" y="246" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 原生提供药企与患者 SSN 隔离代报 1099</text>
  <text x="868" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：全球多中心 II/III 期新药临床试验</text>

  <rect x="854" y="298" width="284" height="100" rx="8" fill="#1E293B" />
  <text x="868" y="320" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">CTSdatabase / Verified Clinical Trials</text>
  <text x="868" y="340" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 跨药企/跨医院受试者去标识化查重网络</text>
  <text x="868" y="360" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 精准拦截 30 天洗脱期内职业试药人套利</text>
  <text x="868" y="380" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：CNS 神经、镇痛、I期健康人药代试验</text>

  <rect x="854" y="412" width="284" height="196" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="868" y="436" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">★ 推荐：Foundry + ClinCard &amp; eCOA 网关</text>
  <text x="868" y="458" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. CTSdatabase 跨院防重入 + eCOA 联动</text>
  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. IRB 伦理批件单访视限额硬编码防利诱</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 交通食宿直付免税剥离 (不占 $600 额度)</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. 第三方盲墙代开 1099 零 HIPAA 泄密</text>
  <rect x="868" y="542" width="256" height="50" rx="6" fill="#022C22" />
  <text x="880" y="563" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">审计标签：provenance = synthetic</text>
  <text x="880" y="581" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="11">independently_reproduced = false</text>
</svg>

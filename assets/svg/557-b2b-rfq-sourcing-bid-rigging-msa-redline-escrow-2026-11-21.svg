  <rect width="1200" height="675" fill="url(#bg557)"/>
  <rect x="28" y="24" width="1144" height="627" rx="18" fill="none" stroke="url(#accent557)" stroke-width="2" opacity="0.5"/>
  <text x="54" y="66" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUND 114 · B2B RFQ SOURCING, ANTI-COLLUSION &amp; MSA REDLINING · SVG 557</text>
  <text x="54" y="100" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">B2B RFQ Sourcing, Anti-Bid-Rigging &amp; MSA/DPA Contract Redline Escrow</text>
  <text x="54" y="128" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">SAP Ariba / Coupa / Fairmarkit / Ironclad AI · UBO Collusion Block (HTTP 403) · MSA Super-Cap &amp; Zero-Train DPA Gate (HTTP 422)</text>

  <!-- Lane 1: Anti-Bid-Rigging & Cover-Quote Detection -->
  <rect x="54" y="152" width="345" height="465" rx="14" fill="#111827" stroke="#ef4444" stroke-width="1.6"/>
  <rect x="54" y="152" width="345" height="42" rx="14" fill="#7f1d1d"/>
  <text x="72" y="179" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. Anti-Collusion Lock (HTTP 403)</text>
  <text x="72" y="216" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">3-Bid UBO &amp; Metadata Graph Audit</text>
  <text x="72" y="238" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Blocks '3-Quote' RFQs where bidders share</text>
  <text x="72" y="258" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  Ultimate Beneficial Owners (UBO), bank</text>
  <text x="72" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  routing, PDF author metadata, or IP subnet</text>
  <rect x="72" y="298" width="309" height="82" rx="9" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
  <text x="86" y="321" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Anti-PO-Splitting Threshold Guard</text>
  <text x="86" y="341" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Rejects slicing a $120k purchase into</text>
  <text x="86" y="361" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  three $40k POs to bypass competitive RFQ</text>
  <text x="72" y="408" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Commit-Reveal Sealed Bid Envelope</text>
  <text x="72" y="430" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Cryptographically seals quotes until RFQ</text>
  <text x="72" y="450" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  close to prevent insider last-look leaks</text>
  <text x="72" y="470" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  to incumbent suppliers</text>
  <rect x="72" y="502" width="309" height="92" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="86" y="526" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">HTTP 403 Deterministic Verdict</text>
  <text x="86" y="548" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">COLLUSIVE_UBO_COVER_BIDDING_OR_PO</text>
  <text x="86" y="566" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">_SPLITTING_EVASION_BLOCKED</text>

  <!-- Lane 2: MSA/DPA Redlining & Liability Cap Gate -->
  <rect x="426" y="152" width="348" height="465" rx="14" fill="#111827" stroke="#f59e0b" stroke-width="1.6"/>
  <rect x="426" y="152" width="348" height="42" rx="14" fill="#78350f"/>
  <text x="444" y="179" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. MSA / DPA Redline Gate (HTTP 422)</text>
  <text x="444" y="216" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Liability Super-Cap &amp; IP Indemnity Check</text>
  <text x="444" y="238" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Blocks vendor Battle-of-the-Forms riders</text>
  <text x="444" y="258" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  capping Data Breach / IP Infringement</text>
  <text x="444" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  liability below 2x–3x ACV Super-Cap</text>
  <rect x="444" y="298" width="312" height="82" rx="9" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="458" y="321" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Zero-AI-Training DPA &amp; Evergreen Veto</text>
  <text x="458" y="341" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Strikes clauses granting vendor right to</text>
  <text x="458" y="361" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  train LLMs on buyer data &amp; &gt;3% CPI hikes</text>
  <text x="444" y="408" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Total Landed Cost (Incoterms DDP) Parity</text>
  <text x="444" y="430" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Normalizes EXW/FOB quotes to DDP door-</text>
  <text x="444" y="450" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  delivered cost including tariff, freight,</text>
  <text x="444" y="470" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  and payment-term cost of capital</text>
  <rect x="444" y="502" width="312" width="312" height="92" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="458" y="526" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">HTTP 422 Deterministic Verdict</text>
  <text x="458" y="548" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">UNCAPPED_VENDOR_DATA_TRAINING_OR</text>
  <text x="458" y="566" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">_MISSING_BREACH_SUPERCAP_BLOCKED</text>

  <!-- Lane 3: OFAC/SOC2 & Multi-Vendor Lot-Split FinOps -->
  <rect x="801" y="152" width="345" height="465" rx="14" fill="#111827" stroke="#10b981" stroke-width="1.6"/>
  <rect x="801" y="152" width="345" height="42" rx="14" fill="#064e3b"/>
  <text x="819" y="179" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3. Sanctions &amp; Lot-Split (451/409)</text>
  <text x="819" y="216" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Web IQ OFAC / SOC 2 Type II Gate (451)</text>
  <text x="819" y="238" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Screens 50%-rule UBO sanctions, D&amp;B</text>
  <text x="819" y="258" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  bankruptcy distress score &amp; active AICPA</text>
  <text x="819" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  SOC 2 Type II report before PO issuance</text>
  <rect x="819" y="298" width="309" height="96" rx="9" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="833" y="321" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">FinOps Lot-Split + Should-Cost Bid (409)</text>
  <text x="833" y="341" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Unbundles multi-line RFQ into best-of-</text>
  <text x="833" y="361" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  breed Cherry-Pick Lot Split + Should-Cost</text>
  <text x="833" y="381" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  index target + 2/10 Net 45: -29% Net</text>
  <text x="819" y="420" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Automated Tail-Spend Reverse e-Auction</text>
  <text x="819" y="442" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Invites 5 pre-vetted catalog suppliers</text>
  <text x="819" y="462" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  on $10k–$150k tail spend automatically</text>
  <rect x="819" y="502" width="309" height="92" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="833" y="526" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">HTTP 409 / 451 Deterministic Verdict</text>
  <text x="833" y="548" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">CHERRY_PICK_LOT_SPLIT_AND_SHOULD</text>
  <text x="833" y="566" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">_COST_REDLINE_CONFIRM (-29% Net)</text>

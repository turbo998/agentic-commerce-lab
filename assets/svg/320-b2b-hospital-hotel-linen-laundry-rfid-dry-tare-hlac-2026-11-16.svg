  <rect x="616" y="132" width="540" height="38" rx="12" fill="#064E3B"/>
  <text x="636" y="156" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">✅ 出厂净干重去皮锁 + UHF RFID 水洗折旧 + Web IQ HLAC 核验架构</text>

  <rect x="634" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 出厂净干重 (Clean-Dry) 结算 + 笼车 RFID 独立皮重锁 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">严禁按脏湿污水重计费，强制以洁净烘干打包出厂地磅读数为准，并刷每辆笼车</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">专属 RFID 标签扣除实测空车皮重 (75–95 lbs)，11ms 硬拦截污水与塑料车皮注水。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 废除 16% 固定损耗费 + 单件 RFID &gt;=60次水洗归零门禁 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">严禁收取固定比例 Auto-Rag-Out 附加费；读取单件布草 EPC Gen2 UHF RFID 水洗</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">计数器，凡水洗 &gt;=60 次自然破损或厂内丢失残值一律归 $0.00，剔除厂内回洗重。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 HLAC/TRSA 院感认证与手术衣寿命 (275ms → HTTP 451)</text>
  <text x="648" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">275ms 穿透核查洗涤厂 HLAC / TRSA Hygienically Clean Healthcare 认证状态</text>
  <text x="648" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">及可复用手术衣 ANSI/AAMI PB70 &lt;=75 次水洗强制退役标准，阻断院内交叉感染。</text>

  <rect x="634" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#D97706"/>
  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动将脏湿重回调为净干去皮重并剥离固定损耗费 (240ms → HTTP 409)</text>
  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动扣除污水含水率差额、实测笼车皮重差与 16% 自动破损附加费：</text>
  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $185,000.00 → 自动核减 $27,750.00 (15.0%) → 净付 $157,250.00！</text>


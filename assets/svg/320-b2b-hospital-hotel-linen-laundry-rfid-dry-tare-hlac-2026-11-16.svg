  <!-- Header -->
  <text x="48" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ROUND 318 · B2B HOSPITAL HEALTHCARE LINEN, SURGICAL PACKS &amp; HOSPITALITY LAUNDRY (HLAC / TRSA &amp; UHF RFID)</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">医院与酒店布草洗涤租赁：净干重去皮锁、UHF RFID 寿命折旧 vs 脏湿污水过磅与 16% 固定损耗费</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_hospital_hotel_linen_laundry_rfid_dry_tare_weight_hlac_hygienic_mandate_2026 · 15.0% Savings ($27,750 / Batch)</text>

  <!-- Left Panel: Legacy Linen Laundry Traps -->
  <rect x="44" y="132" width="540" height="395" rx="12" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="540" height="38" rx="12" fill="#450A0A"/>
  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统医院与酒店布草洗涤四大黑洞 (Legacy Linen Laundry Leakage: 22%–38%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 按吸饱血水/污水的“脏湿回收重 (Soiled Weight)”过磅计费 (+25% 水分)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">病房与手术室换下的脏床单、隔尿垫与湿拖把头吸饱了液体，比烘干后的净干布草重</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">出 25%–35%，洗涤厂按进厂脏湿重 ($0.75/lb) 计费，让医院每年花几十万洗污水。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 85 磅重型周转笼车统一按 60 磅去皮 (Cart Tare-Weight Shorting)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">装布草的滚塑大笼车连带金属隔板实重 85–95 磅，洗涤厂地磅却统一按 60 磅默认</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">去皮，每推一车就把 25 磅塑料车皮当成布草收钱，日积月累多收数十万美元。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 固定强加 16%“自动破损补充费”与洗 70 次旧床单按全新价索赔</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">每期账单固定叠收 16% Auto-Rag-Out 损耗费；把已在洗涤厂高温压榨洗了 70 次、</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">寿命耗尽自然撕裂的旧床单，全部算作医院人为损坏按 $18/条全新原价索赔。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 厂内掉地回洗 (Rewash) 二次收钱 + 手术衣超 75 次水洗丧失阻隔力</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">洗涤厂内部污损回洗率高达 9% 却重复过磅收费；隧道机水温未达 160°F×25m 或</text>
  <text x="76" y="496" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">AAMI PB70 可复用手术衣水洗超 75 次未报废，引发手术室血源渗透与 MRSA 院感。</text>

  <!-- Right Panel: Agentic Clean-Dry + UHF RFID Architecture -->

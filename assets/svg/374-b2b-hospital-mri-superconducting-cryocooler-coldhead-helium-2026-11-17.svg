  <text x="446" y="414" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截把 $4,200 活塞芯更换高报 $35,000 换整支冷头或充低纯氦 → $0.00</text>

  <!-- Lane 451 -->

  <rect width="1200" height="675" fill="url(#bg374)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent374)"/>

  <!-- Header -->
  <text x="48" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 372 · HOSPITAL 1.5T/3.0T MRI CRYOCOOLER (4K COLDHEAD / ACR), $680 ADSORBER &amp; $4,200 DISPLACER GATE</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">医院超导核磁共振 (MRI) 4K 冷头维保、$680 压缩机吸附罐锁与 $4,200 活塞芯清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Siemens / GE / Philips / Sumitomo RDK-408 · &lt;=15,000h 活性炭吸附罐锁 + 3.8–4.5 PSI 零挥发锁 + 99.999% (5N) 高纯氦气 + ACR</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="64" y="160" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">🧲 四大超导 MRI 极低温与液氦硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. $680 活性炭吸附罐 (&lt;=15,000h) 责任锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 压缩机油蒸气全靠 $680 Adsorber 拦截防进 -269°C 冷头</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 凡因漏换吸附罐致冷头油冻停机挥发液氦由外包全赔</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截维保失职却向医院索要 $48,000 液氦账单</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. $4,200 冷头内部活塞芯 (Displacer) 锁</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• RDK-408 冷头不锈钢真空外筒寿命长达 10–15 年</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 25,000h 磨损只需在线抽换 $4,200 蓄冷活塞芯与阀片</text>
  <text x="74" y="368" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断把活塞常规磨损高报成 $35,000 换整支冷头</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="426" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 99.999% (5N) 超高纯氦气 COA 防冰堵锁</text>
  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 压缩机补压严禁使用 99.9% 含水工业气球氦气</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制核验 5N 级高纯氦气瓶批号 (H2O &lt; 2 ppm)</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 彻底消除 4.2K 二级冷端微量水蒸气结冰卡死</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="540" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. Web IQ ACR 缺氧报警 &amp; 失超管核查</text>
  <text x="74" y="560" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• /v3/browse 核验扫描间 &lt;19.5% O2 缺氧探头校准</text>
  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截室外失超排气管 (Quench Pipe) 积水结冰</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 守护放射科患者与技师免受失超窒息生命威胁</text>


  <text x="446" y="592" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">改用 $4,200 冷头活塞芯再生 + $680 吸附罐更换立省 $32,600 → $115,400.00</text>


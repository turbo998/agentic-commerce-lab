  <text x="446" y="462" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛑 HTTP 451 · Send to a human (265ms)</text>
  <text x="446" y="482" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">FAILED_MRI_ROOM_OXYGEN_MONITOR_OR_BLOCKED_QUENCH_VENT_PIPE_HOLD</text>
  <text x="446" y="502" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web IQ 挂起机房 &lt;19.5% 缺氧探头失效或室外失超管堵塞 → $0.00</text>


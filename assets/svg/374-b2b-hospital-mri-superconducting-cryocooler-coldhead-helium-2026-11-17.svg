  <text x="446" y="326" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截漏换 $680 吸附罐致油冻挥发却向医院转嫁 $48k 液氦费 → $0.00</text>


  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 传统平台 T+1 将全款打给诊所，诊所做完 2 次即爆雷停业</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 剩余 8 次触发信用卡远期拒付，平台被迫全额垫付穿仓!</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#172036"/>
    </linearGradient>
    <linearGradient id="cfOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6821F"/>
      <stop offset="50%" stop-color="#FBAD41"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B180A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A253B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#062C24"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E163B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#cfOrange)"/>

  <!-- Header -->
  <g transform="translate(32, 22)">
    <rect x="0" y="0" width="336" height="26" rx="13" fill="#2A1A10" stroke="#F6821F" stroke-width="1.2"/>
    <text x="168" y="17" fill="#FDBA74" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.04em">CLOUDFLARE AGENTIC COMMERCE · 2025–2026 STACK</text>
    <text x="352" y="18" fill="#94A3B8" font-size="12" font-weight="600">As-of 2026-11-14 · Agents Week (Aug 2026) + Web Bot Auth + Wallets + x402 / MPP / TAP / MCP</text>
    <text x="0" y="52" fill="#F8FAFC" font-size="23" font-weight="800">Cloudflare 智能体商业（Agentic Commerce）最新产品矩阵与六大落地场景全景图</text>
    <text x="0" y="75" fill="#CBD5E1" font-size="12.5">在全球 335+ 边缘城市统一交付：可信 Agent 身份认证（&lt;1ms）→ 零改代码目录适配（Markdown/MCP）→ 双轨可编程支付（卡组令牌 + HTTP 402）→ 有状态 Agent 运行时</text>
  </g>

  <!-- Row 1: 4 Core Product Pillars -->
  <!-- Pillar 1: Identity & Access -->
  <g transform="translate(32, 114)">
    <rect x="0" y="0" width="274" height="334" rx="12" fill="url(#card1)" stroke="#F6821F" stroke-width="1.4"/>
    <rect x="14" y="14" width="160" height="22" rx="5" fill="#EA580C"/>
    <text x="94" y="29" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">1. 身份认证与爬虫治理层</text>
    <text x="14" y="57" fill="#F8FAFC" font-size="15.5" font-weight="800">可信 Agent 准入与反白嫖</text>
    <text x="14" y="75" fill="#FDBA74" font-size="11">解决：既不误杀正牌买手，又不放纵黑产爬虫</text>

    <rect x="14" y="88" width="246" height="72" rx="8" fill="#0F172A" stroke="#9A3412" stroke-width="1"/>
    <text x="24" y="106" fill="#FB923C" font-size="11.5" font-weight="700">• Web Bot Auth (RFC 9421 签名)</text>
    <text x="24" y="123" fill="#E2E8F0" font-size="10.5">公钥目录 JWKS + HTTP 消息签名，&lt;1ms</text>
    <text x="24" y="139" fill="#E2E8F0" font-size="10.5">免 CAPTCHA 放行合法导购与比价 Agent</text>
    <text x="24" y="153" fill="#FDBA74" font-size="10" font-weight="700">写操作升级校验 Content-Digest + 买家委托</text>

    <rect x="14" y="168" width="246" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="186" fill="#38BDF8" font-size="11.5" font-weight="700">• AI Crawl Control (意图精细分流)</text>
    <text x="24" y="203" fill="#E2E8F0" font-size="10.5">按 AI 搜索 / Agent 实时代购 / 模型训练三类</text>
    <text x="24" y="219" fill="#E2E8F0" font-size="10.5">意图独立配置 Allow / Block / Charge (402)</text>
    <text x="24" y="233" fill="#7DD3FC" font-size="10" font-weight="700">归因分析看板追踪 Agent 引流与成交转化</text>

    <rect x="14" y="248" width="246" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="266" fill="#F87171" font-size="11.5" font-weight="700">• Bot Management + AI Labyrinth</text>
    <text x="24" y="283" fill="#E2E8F0" font-size="10.5">ML 行为评分毫秒级识别伪造 UA 恶意黄牛</text>
    <text x="24" y="299" fill="#FCA5A5" font-size="10.5" font-weight="700">违规爬虫诱导进入 AI 迷宫诱饵页消耗算力</text>
    <text x="24" y="313" fill="#94A3B8" font-size="10">彻底替代高弃单率的传统图形滑块验证码</text>
  </g>

  <!-- Pillar 2: Agent-Native Discovery & MCP -->
  <g transform="translate(319, 114)">
    <rect x="0" y="0" width="274" height="334" rx="12" fill="url(#card2)" stroke="#38BDF8" stroke-width="1.4"/>
    <rect x="14" y="14" width="168" height="22" rx="5" fill="#0284C7"/>
    <text x="98" y="29" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">2. Agent 原生目录与交互层</text>
    <text x="14" y="57" fill="#F8FAFC" font-size="15.5" font-weight="800">零改造店铺语义化与 MCP</text>
    <text x="14" y="75" fill="#7DD3FC" font-size="11">解决：HTML 噪音耗 Token、库存价格难实时交互</text>

    <rect x="14" y="88" width="246" height="72" rx="8" fill="#0F172A" stroke="#0369A1" stroke-width="1"/>
    <text x="24" y="106" fill="#38BDF8" font-size="11.5" font-weight="700">• Markdown for Agents (2026-02)</text>
    <text x="24" y="123" fill="#E2E8F0" font-size="10.5">识别 Accept: text/markdown 边缘实时转写</text>
    <text x="24" y="139" fill="#E2E8F0" font-size="10.5">剥离冗余 DOM/JS，节省高达 90%–99% Token</text>
    <text x="24" y="153" fill="#7DD3FC" font-size="10" font-weight="700">附带 Content-Signal 标头声明版权与用途许可</text>

    <rect x="14" y="168" width="246" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="186" fill="#A5B4FC" font-size="11.5" font-weight="700">• Agent Visibility Template</text>
    <text x="24" y="203" fill="#E2E8F0" font-size="10.5">源站零改代码，边缘一键注入结构化商品</text>
    <text x="24" y="219" fill="#E2E8F0" font-size="10.5">JSON-LD 元数据与站点级 /llms.txt 导航索引</text>
    <text x="24" y="233" fill="#C7D2FE" font-size="10" font-weight="700">大幅提升 AI 搜索引擎与购物助手商品召回率</text>

    <rect x="14" y="248" width="246" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="266" fill="#34D399" font-size="11.5" font-weight="700">• Remote MCP Server + UCP / ACP</text>
    <text x="24" y="283" fill="#E2E8F0" font-size="10.5">支持 2026-07-28 无状态 MCP 规范与可选 OAuth</text>
    <text x="24" y="299" fill="#E2E8F0" font-size="10.5">Durable Object RPC 零网络开销双向查库存/下单</text>
    <text x="24" y="313" fill="#6EE7B7" font-size="10" font-weight="700">原生兼容 Universal / Agentic Commerce 协议</text>
  </g>

  <!-- Pillar 3: Wallets, Payments & Monetization -->
  <g transform="translate(606, 114)">
    <rect x="0" y="0" width="274" height="334" rx="12" fill="url(#card3)" stroke="#10B981" stroke-width="1.4"/>
    <rect x="14" y="14" width="176" height="22" rx="5" fill="#059669"/>
    <text x="102" y="29" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">3. 可编程钱包与多轨支付层</text>
    <text x="14" y="57" fill="#F8FAFC" font-size="15.5" font-weight="800">Wallets + 卡组/HTTP 402 双轨</text>
    <text x="14" y="75" fill="#6EE7B7" font-size="11">解决：Agent 如何安全花钱 &amp; 商家如何自动收款</text>

    <rect x="14" y="88" width="246" height="72" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <text x="24" y="106" fill="#34D399" font-size="11.5" font-weight="700">• Cloudflare Wallets &amp; cloudflare.pay</text>
    <text x="24" y="123" fill="#E2E8F0" font-size="10.5">2026-08 发布：为每个 Agent 分配独立虚拟子钱包</text>
    <text x="24" y="139" fill="#E2E8F0" font-size="10.5">稳定身份句柄 (*.cloudflare.pay) 溯源背后企业</text>
    <text x="24" y="153" fill="#6EE7B7" font-size="10" font-weight="700">硬编码单笔上限、日预算封顶与商户白名单</text>

    <rect x="14" y="168" width="246" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="186" fill="#FCD34D" font-size="11.5" font-weight="700">• 卡组与委托轨道：TAP / Agent Pay / AP2</text>
    <text x="24" y="203" fill="#E2E8F0" font-size="10.5">联合 Visa、Mastercard、Amex、Stripe 共建</text>
    <text x="24" y="219" fill="#E2E8F0" font-size="10.5">网络令牌化实物商品结账，享拒付抗辩与免责</text>
    <text x="24" y="233" fill="#FDE68A" font-size="10" font-weight="700">适合中高客单价实物零售、机酒预订与 B2B 订单</text>

    <rect x="14" y="248" width="246" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="266" fill="#38BDF8" font-size="11.5" font-weight="700">• HTTP 402 微支付：x402 + MPP + NET$</text>
    <text x="24" y="283" fill="#E2E8F0" font-size="10.5">共建 Linux 基金会 x402；MPP 支持单次/会话/订阅</text>
    <text x="24" y="299" fill="#E2E8F0" font-size="10.5">Pay Per Crawl &amp; Monetization Gateway 边缘收款</text>
    <text x="24" y="313" fill="#7DD3FC" font-size="10" font-weight="700">USDC / NET Dollar 1:1 稳定币实现亚美分秒级结算</text>
  </g>

  <!-- Pillar 4: Runtime, Governance & Security -->
  <g transform="translate(893, 114)">
    <rect x="0" y="0" width="275" height="334" rx="12" fill="url(#card4)" stroke="#8B5CF6" stroke-width="1.4"/>
    <rect x="14" y="14" width="176" height="22" rx="5" fill="#7C3AED"/>
    <text x="102" y="29" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">4. 有状态运行时与零信任管控</text>
    <text x="14" y="57" fill="#F8FAFC" font-size="15.5" font-weight="800">Agents SDK + Cloudflare OS</text>
    <text x="14" y="75" fill="#C4B5FD" font-size="11">解决：百万并发记忆持久化、长事务与防越权</text>

    <rect x="14" y="88" width="247" height="72" rx="8" fill="#0F172A" stroke="#6D28D9" stroke-width="1"/>
    <text x="24" y="106" fill="#C4B5FD" font-size="11.5" font-weight="700">• Agents SDK + Durable Objects + Memory</text>
    <text x="24" y="123" fill="#E2E8F0" font-size="10.5">每个购物 Agent 独占 SQLite 实例 + 托管 Memory</text>
    <text x="24" y="139" fill="#E2E8F0" font-size="10.5">空闲自动休眠 (Hibernate) 零常驻成本，毫秒唤醒</text>
    <text x="24" y="153" fill="#DDD6FE" font-size="10" font-weight="700">内置 withX402 / paidTool / mppx 支付工具包</text>

    <rect x="14" y="168" width="247" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="186" fill="#38BDF8" font-size="11.5" font-weight="700">• Workflows (GA) + @cloudflare/computer</text>
    <text x="24" y="203" fill="#E2E8F0" font-size="10.5">持久化编排多步结账、锁库超时回滚、物流追踪</text>
    <text x="24" y="219" fill="#E2E8F0" font-size="10.5">Code Mode 安全沙盒执行比价脚本与税费验算</text>
    <text x="24" y="233" fill="#7DD3FC" font-size="10" font-weight="700">断网/重试幂等恢复，彻底杜绝重复扣款</text>

    <rect x="14" y="248" width="247" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="266" fill="#34D399" font-size="11.5" font-weight="700">• Cloudflare OS + Identity AI Gateway</text>
    <text x="24" y="283" fill="#E2E8F0" font-size="10.5">Gatekeeper Workers 实施最小权限 Capability 隔离</text>
    <text x="24" y="299" fill="#E2E8F0" font-size="10.5">身份感知 AI Gateway 绑定企业 SSO 审计每次推理</text>
    <text x="24" y="313" fill="#6EE7B7" font-size="10" font-weight="700">统一缓存、多模型路由与 Token/资金双熔断</text>
  </g>

  <!-- Row 2: 6 High-Value Business Use Cases Matrix -->
  <g transform="translate(32, 464)">
    <rect x="0" y="0" width="1136" height="232" rx="12" fill="#0B1220" stroke="#334155" stroke-width="1.2"/>
    <text x="20" y="27" fill="#F8FAFC" font-size="15" font-weight="800">🎯 六大核心业务落地场景与 Cloudflare 推荐组合栈（Use-Case Architecture Blueprint）</text>
    <text x="1116" y="27" text-anchor="end" fill="#94A3B8" font-size="11">核心准则：实物/高客单走 TAP/Agent Pay 卡组轨 · API/内容/高频查价走 x402/MPP 微支付轨</text>

    <!-- Scenario 1 -->
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="358" height="82" rx="8" fill="#131C2E" stroke="#F6821F" stroke-width="1"/>
      <text x="12" y="20" fill="#FDBA74" font-size="12" font-weight="700">① 品牌独立站 / 电商平台“AI 导购零摩擦改造”</text>
      <text x="12" y="38" fill="#E2E8F0" font-size="10.5">痛点：传统 WAF 误杀买手 Agent；HTML 详情页重且库存不同步</text>
      <text x="12" y="55" fill="#94A3B8" font-size="10">组合：Web Bot Auth + Markdown for Agents + Visibility Template</text>
      <text x="12" y="71" fill="#34D399" font-size="10" font-weight="700">+ Remote MCP 实时查库锁单 + Visa TAP / Mastercard Agent Pay</text>
    </g>

    <!-- Scenario 2 -->
    <g transform="translate(389, 42)">
      <rect x="0" y="0" width="358" height="82" rx="8" fill="#131C2E" stroke="#38BDF8" stroke-width="1"/>
      <text x="12" y="20" fill="#7DD3FC" font-size="12" font-weight="700">② 内容媒体 / 行业情报 / 电商评论库“按爬付费变现”</text>
      <text x="12" y="38" fill="#E2E8F0" font-size="10.5">痛点：AI 爬虫白嫖高价值测评与价格历史，零广告点击分成</text>
      <text x="12" y="55" fill="#94A3B8" font-size="10">组合：AI Crawl Control + Pay Per Crawl (MoR) + AI Labyrinth</text>
      <text x="12" y="71" fill="#38BDF8" font-size="10" font-weight="700">+ Monetization Gateway (HTTP 402 / x402 / NET Dollar 分润)</text>
    </g>

    <!-- Scenario 3 -->
    <g transform="translate(760, 42)">
      <rect x="0" y="0" width="358" height="82" rx="8" fill="#131C2E" stroke="#10B981" stroke-width="1"/>
      <text x="12" y="20" fill="#6EE7B7" font-size="12" font-weight="700">③ 个人代购 / 降价狙击与自动补货助手 (B2C Buyer)</text>
      <text x="12" y="38" fill="#E2E8F0" font-size="10.5">痛点：长周期盯盘高成本；用户不敢把主信用卡直接交给大模型</text>
      <text x="12" y="55" fill="#94A3B8" font-size="10">组合：Durable Objects 休眠唤醒 + Virtual Wallet (限额/白名单)</text>
      <text x="12" y="71" fill="#6EE7B7" font-size="10" font-weight="700">+ Workflows 触发锁单 + AP2 / Stripe SPT 单商户受限扣款</text>
    </g>

    <!-- Scenario 4 -->
    <g transform="translate(18, 136)">
      <rect x="0" y="0" width="358" height="82" rx="8" fill="#131C2E" stroke="#8B5CF6" stroke-width="1"/>
      <text x="12" y="20" fill="#C4B5FD" font-size="12" font-weight="700">④ 企业 B2B 寻源比价与自动化尾料采购 (Procurement)</text>
      <text x="12" y="38" fill="#E2E8F0" font-size="10.5">痛点：多部门预算串用、越权下单、缺乏审计溯源与合规门禁</text>
      <text x="12" y="55" fill="#94A3B8" font-size="10">组合：Cloudflare OS (Gatekeeper Workers) + Identity AI Gateway</text>
      <text x="12" y="71" fill="#C4B5FD" font-size="10" font-weight="700">+ cloudflare.pay 组织身份溯源 + MPP (session / subscription)</text>
    </g>

    <!-- Scenario 5 -->
    <g transform="translate(389, 136)">
      <rect x="0" y="0" width="358" height="82" rx="8" fill="#131C2E" stroke="#F59E0B" stroke-width="1"/>
      <text x="12" y="20" fill="#FDE68A" font-size="12" font-weight="700">⑤ 付费 MCP 工具与垂直 SaaS API 无感微交易市场</text>
      <text x="12" y="38" fill="#E2E8F0" font-size="10.5">痛点：Agent 临时调用海关税率/征信核验工具，无法人工注册绑卡</text>
      <text x="12" y="55" fill="#94A3B8" font-size="10">组合：Agents SDK paidTool / withX402 + Stateless MCP (2026-07)</text>
      <text x="12" y="71" fill="#FDE68A" font-size="10" font-weight="700">+ withX402Client / mppx 自动处理 402 挑战并按 $0.002/次即付即用</text>
    </g>

    <!-- Scenario 6 -->
    <g transform="translate(760, 136)">
      <rect x="0" y="0" width="358" height="82" rx="8" fill="#131C2E" stroke="#EC4899" stroke-width="1"/>
      <text x="12" y="20" fill="#F9A8D4" font-size="12" font-weight="700">⑥ 跨境酒旅联动预订与多商户拆单 Saga 编排</text>
      <text x="12" y="38" fill="#E2E8F0" font-size="10.5">痛点：机票+酒店+门票跨站库存冲突，部分失败易造成单边扣款</text>
      <text x="12" y="55" fill="#94A3B8" font-size="10">组合：Cloudflare Workflows 两阶段预授权 Hold + 失败自动补偿</text>
      <text x="12" y="71" fill="#F9A8D4" font-size="10" font-weight="700">+ Code Mode 退改签阶梯费率精算 + 跨境 NET Dollar / 卡组双结算</text>
    </g>
  </g>
</svg>

  <text x="684" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 将承诺拆分为按季度滚动的阶梯式 Convertible SP 并 100% 冲抵 EDP/MACC 保底额度。</text>
  <text x="684" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FDE68A">• 在 $920,000.00 云算力与 FinOps 批次上单批立省 $73,600.00 (净结算 $846,400.00 · HTTP 409)！</text>


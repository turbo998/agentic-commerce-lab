  <text x="684" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• /v3/browse 280ms 穿透核验云市场 Private Offer 是否具备 100% Azure Benefit Eligible / AWS EDSO 标签。</text>
  <text x="684" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 拦截不计入企业年度保底池的非标商品，彻底消除年底 Shortfall 违约罚没 (HTTP 451)！</text>

  <rect x="668" y="446" width="564" height="68" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>

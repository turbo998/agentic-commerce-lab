  <text x="310" y="57" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">B2B 云财务治理 (Cloud FinOps)：P10 可转换承诺 (CUD/RI)、防跨区流量刺客与 EDP 消纳架构</text>
  <text x="46" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#CBD5E1">90-Day P10 Convertible SP/RI Gate, FOCUS 1.0 EffectiveCost &amp; EDP/MACC Drawdown vs. Zombie RIs &amp; Cross-AZ Egress Shocks</text>
  <text x="46" y="106" font-family="Consolas, monospace" font-size="12" fill="#6EE7B7">Mandate Token: b2b_cloud_finops_committed_use_cud_ri_arbitrage_mandate_2026_11_14 · Batch: $920,000.00 · Net Optimized: $846,400.00 (-$73,600.00)</text>

  <!-- Left Column: Legacy Cloud FinOps Traps -->
  <rect x="28" y="132" width="596" height="398" rx="14" fill="url(#red-card)" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5">❌ 传统“按波峰买死 3 年 Standard RI + 忽略流量费”（四大云预算黑洞）</text>
  <text x="50" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#FECACA">Why Peak-Sized 3-Year Standard RIs &amp; Cross-AZ Placements Trigger $500k Zombie Waste</text>

  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. 把短期波峰 (P95) 当基荷买死 3 年 Standard RI 沦为“僵尸预留”</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 听信云控制台基于最近 14 天大促/训练波峰的推荐，全额预付锁死 3 年不可退换的 Standard RI。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 3 个月后业务回落或架构从 H100 升级至 B200，旧 RI 无法跨族转换，白白空转扣款 30 个月！</text>

  <rect x="48" y="282" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">2. 贪图异地算力便宜 10% 却触发 3 倍跨可用区/NAT 流量刺客 (Egress)</text>
  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 调度 AI 只比对 GPU/vCPU 单价，将计算节点迁移至异地 Region 或跨可用区挂载存储。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 触发 $0.02–$0.09/GB 的 Cross-AZ 与 NAT Gateway 流量费，省下 $5k 算力费却多交 $25k 流量费！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 误买不计入 AWS EDP / Azure MACC 保底池的 SKU 遭年底差额罚没</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 企业签有千万美元年度保底消费协议 (EDP/MACC)，但 AI 直接在场外或非认证列表采购第三方软件。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 消费额无法冲抵 EDP/MACC 保底进度，导致年底未达标差额 (Shortfall) 被云厂商 100% 罚没！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">4. 按收付实现制 BilledCost 记账导致预付当月成本失真与部门推诿</text>
  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 未遵循 FinOps FOCUS 1.0 EffectiveCost 权责发生制摊销，把百万预付款全记在买单部门当月账上。</text>
  <text x="64" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 其他业务部门免费蹭用低价 RI 额度，导致 AI 单次推理真实毛利核算彻底失真。</text>


  <text x="684" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 强制联算 (算力折扣 - Cross-AZ/NAT 流量费) &gt; 0，并按 FOCUS 1.0 EffectiveCost 小时级精准摊销。</text>
  <text x="684" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 一旦跨区流量费反噬算力折扣或未执行权责摊销，14ms 立即熔断拦截 (HTTP 422)！</text>

  <rect x="668" y="364" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>

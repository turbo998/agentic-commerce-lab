  <text x="684" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 严格按过去 90 天剔除波峰后的 P10 稳态基荷定容，强制选用可跨芯片/跨实例族转换的 Convertible SP。</text>

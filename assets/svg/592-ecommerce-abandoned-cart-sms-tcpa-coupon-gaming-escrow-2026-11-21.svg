  <rect width="1200" height="675" fill="url(#bg592)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent592)" rx="3" />

  <text x="40" y="58" class="title">电商弃购挽回 (Klaviyo / Attentive / Braze)、防“故意弃购骗 8 折券”与 TCPA 短信合规托管架构</text>
  <text x="40" y="80" class="subtitle">Round 149 · 防买家每次加购故意等 2 小时骗 20% 券、防晚 8 点后发短信赔 $1,500/条 TCPA 罚单 &amp; 瀑布流触达净省 38% (SVG 592)</text>

  <!-- Left Card: 3 Abandoned Cart Traps -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大弃购挽回与短信营销黑洞</text>
  <text x="56" y="164" class="card-title">1. “故意加购不付等 2 小时骗券”套路 (HTTP 403)</text>
  <text x="56" y="184" class="body">• TikTok/小红书教程教买家：“千万别原价买! 先加购物车关掉网页，</text>
  <text x="56" y="202" class="body">  等 2 小时商家就会自动发 20% Off 挽回码到你邮箱!”</text>
  <text x="56" y="220" class="warn">• 导致 45% 原价熟客全学会故意弃购，白白蒸掉 20% 净毛利!</text>

  <text x="56" y="256" class="card-title">2. 已在 App 下单，短信还在狂发催付 (HTTP 422)</text>
  <text x="56" y="276" class="body">• 用户在手机浏览器弃购，10 分钟后换用 App 或苹果 Pay 已完成购买</text>
  <text x="56" y="294" class="body">• 但营销流未实时校验 `Order_Placed` 或该尺码已断货 (OOS)</text>
  <text x="56" y="312" class="warn">• 2 小时后照发“给你 85 折快回来买”，刚原价买完的客户当场气炸退差!</text>

  <text x="56" y="348" class="card-title">3. 触犯美国 TCPA / 宵禁时间遭 $1,500/条索赔 (HTTP 451)</text>
  <text x="56" y="368" class="body">• 把“接收物流通知手机号”当成“同意接收营销短信 (Marketing Opt-In)”</text>
  <text x="56" y="386" class="body">• 或按美西时间晚上 19:30 群发，撞上美东佛罗里达 22:30 法定宵禁</text>
  <text x="56" y="404" class="warn">• 职业诉讼人按 TCPA 索赔 $500–$1,500/条短信，一封律师函赔 $250k!</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: SERIAL_CART_ABANDON_COUPON_GAMING</text>
  <text x="70" y="502" class="warn">• HTTP 422: ALREADY_CONVERTED_OR_SKU_OUT_OF_STOCK</text>
  <text x="70" y="524" class="warn">• HTTP 451: TCPA_QUIET_HOURS_OR_MISSING_DOUBLE_OPTIN</text>
  <text x="70" y="546" class="mono">• HTTP 409:EMAIL_FIRST_WATERFALL_HOLD_DISCOUNT_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: COMPLIANT_CART_RECOVERY_DISPATCH_200</text>
  <text x="70" y="596" class="body">铁律: 首封挽回信严禁带折扣码；90 天内最多触发 1 次挽回券!</text>

  <!-- Center Card: 4-Stage Abandoned Cart & TCPA Architecture -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶弃购挽回防套利与 TCPA 合规架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#ef4444" />
  <text x="450" y="175" class="card-title" fill="#fca5a5">Gate 1: 90 天挽回券冷却锁与防故意弃购博弈 (HTTP 403)</text>
  <text x="450" y="195" class="body">• 第 1 波提醒 (T+1h) 100% 严禁附带任何折扣码 (仅提供客服答疑/尺码建议)</text>
  <text x="450" y="213" class="body">• 同一账号/设备指纹 90 天内已领过 1 次弃购券，或属高频故意弃购老手:</text>
  <text x="450" y="231" class="mono">• 自动剥离折扣权益，仅发无折扣库存提醒 -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="282" class="card-title" fill="#38bdf8">Gate 2: 发送前毫秒级“已购/断货”实时重校验 (HTTP 422)</text>
  <text x="450" y="302" class="body">• 延迟队列在真正调用 Twilio/SendGrid 发送前的 50ms，强制实时查询:</text>
  <text x="450" y="320" class="body">  (1) 用户是否已跨设备/用 Apple Pay 完成下单；(2) 加购尺码是否仍有库存</text>
  <text x="450" y="338" class="body">• 彻底杜绝“刚原价买完就收到 85 折挽回短信”引发的愤怒退差价!</text>
  <text x="450" y="354" class="mono">• 已转化订单或断货 SKU 企图触发挽回推送 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: TCPA 双重授权与收件人州界宵禁锁 (HTTP 451)</text>
  <text x="450" y="419" class="body">• 校验独立于交易通知的 `SMS Marketing Double Opt-In` 签名日志</text>
  <text x="450" y="437" class="body">• 综合手机号区号 + 账单邮编取最严时区: 严守当地 `08:00–20:00` 窗口</text>
  <text x="450" y="455" class="mono">• 夜间宵禁、单次弃购超 1 条短信或命中 Litigator 黑名单 -&gt; HTTP 451</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#10b981" />
  <text x="450" y="508" class="card-title" fill="#6ee7b7">Gate 4: 低成本通道瀑布流与阶梯毛利保护 (HTTP 409)</text>
  <text x="450" y="528" class="body">• 通道成本对比: App Push ($0) &lt; Email ($0.0005) &lt;&lt; MMS 彩信 ($0.045)</text>
  <text x="450" y="546" class="body">• 先发零成本 Email/Push；4 小时未打开且购物车毛利 &gt;$25 才升级发 SMS</text>
  <text x="450" y="566" class="mono">• T+24h 对高毛利首单犹豫客优先给“免运费/赠小样”替代粗暴打 8 折</text>
  <text x="450" y="586" class="mono">• 砍掉无效彩信轰炸 + 守住原价客毛利 -&gt; 净省 38% 营销与补贴成本</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大全渠道弃购挽回引擎</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Klaviyo + Shopify Webhooks</text>
  <text x="846" y="182" class="body">• 优势: 电商事件流触发标杆，原生支持按历史领券次数分流分支</text>
  <text x="846" y="198" class="body">• 特性: 发送前实时拉取商品库存状态与单次专属动态券码</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. Attentive / Postscript (合规 SMS 专家)</text>
  <text x="846" y="244" class="body">• 优势: 内置美国各州 (FL/OK/WA) 严苛 TCPA 宵禁时钟与单次弃购频控</text>
  <text x="846" y="260" class="body">• 特性: 自动遵守运营商 `10DLC / SHAFT` 过滤与职业诉讼号屏蔽</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. Braze / Iterable (全渠道瀑布流编排)</text>
  <text x="846" y="306" class="body">• 优势: 优先触达免费 App Push/Web Push 与低成本邮件，未开信再补短信</text>
  <text x="846" y="322" class="body">• 特性: 全局跨渠道频次上限 (Frequency Cap) 防止一天连轰 6 条导致退订</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. 企业微信 / WhatsApp 对话式导购挽回</text>
  <text x="846" y="368" class="body">• 优势: 高客单商品 (如珠宝/床垫) 弃购不直接塞打折码，而是由 AI 导购</text>
  <text x="846" y="384" class="body">• 特性: 主动询问“是纠结尺码还是配送时间?”，用专业答疑实现原价转化</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度弃购挽回短信费、毛利折损与合规池 ($105,000)</text>
  <text x="860" y="456" class="body">• 传统见弃购就发8折码+全量彩信+已购误发: $105,000/季</text>
  <text x="860" y="476" class="mono">• T+1h 零折扣 + 90天冷却锁防故意弃购骗券: -$18,900</text>
  <text x="860" y="496" class="mono">• Email/Push 优先瀑布流砍掉 65% 高价 MMS 彩信费: -$12,600</text>
  <text x="860" y="516" class="mono">• 毫秒级已购/断货重检与 TCPA 零罚单防护: -$8,400</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净挽回成本: $65,100 (净省 $39,900 / -38%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: abandoned_cart_escrow_optim_409</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg510" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111E" />
      <stop offset="50%" stop-color="#0F203A" />
      <stop offset="100%" stop-color="#081322" />
    </linearGradient>
    <linearGradient id="accent510" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg510)" />
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent510)" />

  <!-- Header -->
  <text x="44" y="48" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 67 · CROSS-BORDER PARCEL CONSOLIDATION, VOLUMETRIC WEIGHT &amp; REPACK ESCROW</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">跨境集运、海外转运仓与海淘合箱结算：防大箱塞空气虚增体积重、打包监控锁与敏感货路由</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">菜鸟集运 / Superbuy / Buyee / MyUS vs 3D 激光量方去鞋盒抽真空 vs 顶置打包视频锁 vs 预演合箱立省 28%</text>

  <!-- Left Panel: 3 Core Cross-Border Parcel Consolidation Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 跨境集运与海淘转运三大运费刺客</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. 3kg 衣服塞进超大箱充气，按 9.5kg 体积重收 $160</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 10 件小包裹实际总重仅 3.2kg，不良集运仓故意保留全部</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  内层快递盒并塞满泡沫装入大箱，按 L×W×H/5000 翻倍收费</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：3D 装箱算法体积利用率(&gt;=75%) + 预演排练</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  包装(Rehearsal)裁剪瓦楞箱边长锁 (HTTP 403)</text>

  <rect x="62" y="328" width="314" height="132" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="76" y="352" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2. 拆盒合箱漏发 2 件商品死无对证与超免仓期罚款</text>
  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 20 个淘宝/日淘子包裹合箱成 1 个大箱后少了 2 件饰品，</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  集运仓甩锅给国内卖家漏发；或包裹滞留第91天被直接销毁</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：入库质检QC实拍 + 封箱工位顶置无剪辑</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  扫码点数视频与出库总重守恒核验 (HTTP 422)</text>

  <rect x="62" y="474" width="314" height="134" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 带电/液体混入普货空运遭退运没收与抽真空寻优</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 蓝牙耳机(UN3481锂电)/化妆品混入邮政普货线遭安检退回</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ 航空危险品(IATA DGR)与仿牌拦截(451)</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 自动拆除外层冗余鞋盒 + 羽绒服抽真空袋压缩体积</text>
  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  + 走“免体积重仅按实重”特惠专线立省 28% (HTTP 409)</text>

  <!-- Center Panel: 5-Lane Deterministic Gate -->
  <rect x="414" y="132" width="402" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="434" y="164" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ 跨境集运与转运合箱五车道受托状态机</text>

  <rect x="434" y="184" width="362" height="72" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="450" y="208" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 200 · DIM_WEIGHT_CAPPED_AND_PACK_VIDEO_AUTHORIZED</text>
  <text x="450" y="228" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3D 装箱体积利用率达标 + 顶置封箱视频已绑 + 专线合规 (8ms)</text>
  <text x="450" y="245" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">crossborder_parcel_consolidation_escrow_mandate_*</text>

  <rect x="434" y="268" width="362" height="72" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
  <text x="450" y="292" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 403 · VOLUMETRIC_BOX_PADDING_FRAUD_BLOCKED</text>
  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截故意用超大箱塞空气致体积重超实重 1.8 倍或拒拆外层快递盒</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">dim_to_actual_weight_ratio &gt; 1.8 | box_fill_density &lt; 0.65</text>

  <rect x="434" y="352" width="362" height="72" rx="8" fill="#431407" stroke="#F97316" stroke-width="1.5" />
  <text x="450" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 422 · MISSING_SUBPARCEL_SCAN_OR_WEIGHT_DRIFT</text>
  <text x="450" y="396" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截合箱少扫子包裹条码、无顶置封箱录像或出库总重偏差&gt;150g</text>
  <text x="450" y="413" fill="#FDBA74" font-family="Consolas, monospace" font-size="11">all_subparcels_scanned_in_video = false | weight_drift_g &gt; 150</text>

  <rect x="434" y="436" width="362" height="72" rx="8" fill="#3B0764" stroke="#A855F7" stroke-width="1.5" />
  <text x="450" y="460" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 451 · WEBIQ_IATA_LITHIUM_OR_COUNTERFEIT_HOLD</text>
  <text x="450" y="480" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="12">Web IQ 检出锂电池/液体误排入航空普货线或涉海关IPR侵权扣关</text>
  <text x="450" y="497" fill="#D8B4FE" font-family="Consolas, monospace" font-size="11">battery_liquid_on_general_air_line = true | key_age &gt; 180d</text>

  <rect x="434" y="520" width="362" height="88" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.5" />
  <text x="450" y="544" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 409 · REHEARSAL_VACUUM_PACK_AND_ACTUAL_WEIGHT_LINE</text>
  <text x="450" y="564" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="12">去鞋盒+抽真空折边 + 切换“免泡重仅计实重”专线立省 28%</text>
  <text x="450" y="584" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">季度跨境集运与转运仓结算池 $175,000 → 净结算额 $126,000 (省 $49,000)</text>

  <!-- Right Panel: Platform Selection Matrix -->

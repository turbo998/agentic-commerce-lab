  <text x="440" y="296" class="body">白光干涉毛面粗糙度 Rz &lt;=2.0 um, 表面达因值 &gt;=38</text>
  <text x="440" y="314" class="body">mN/m &amp; 150°C 零变色 — 铜瘤或缩孔直返 HTTP 422</text>

  <rect x="428" y="334" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="354" class="mono">Gate 3: Web IQ IATF 16949 &amp; Cr6+ RoHS (280ms)</text>
  <text x="440" y="372" class="body">核验车规 IATF 16949 证书、阴极钛辊抛光台账与</text>
  <text x="440" y="390" class="body">三价铬钝化 (Cr6+ ND) — 违规机台直返 HTTP 451</text>

  <rect x="428" y="410" width="348" height="68" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="430" class="mono" fill="#fcd34d">Gate 4: 4.5um VLP-HTE &amp; Trim Loop (245ms)</text>
  <text x="440" y="448" class="body">4.5um 极薄高延减铜 + 12% 模切紫铜边料返厂溶铜</text>
  <text x="440" y="466" class="body">自动冲抵铜材与加工费立省 $64,400 触发 HTTP 409</text>


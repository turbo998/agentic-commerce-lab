  <text x="36" y="60" class="title">Round 150 · 极薄锂电电解铜箔 (4.5–6 um)、CCD 零针孔与高温延伸率智能托管架构图</text>
  <text x="36" y="84" class="sub">Lithium-Ion Battery ED Copper Foil Offtake, Dual-CCD 0 Pinholes/m2, 180°C Elongation (&gt;=6.0%) &amp; Matte Roughness Rz (&lt;=2.0 um)</text>

  <!-- Left Card: Failure Mode -->
  <rect x="36" y="104" width="355" height="390" rx="12" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="52" y="120" width="160" height="24" rx="12" fill="#fca5a5"/>
  <text x="64" y="136" class="pill-err">⛔ 传统按吨重与厚度盲付</text>
  <text x="52" y="166" class="card-h">三大极片涂布断带、掉粉与电芯微短路灾难</text>

  <text x="52" y="196" class="body" fill="#fca5a5" font-weight="700">1. 钛辊划痕致微米针孔 + 高温脆断 (延伸&lt;3%)</text>
  <text x="52" y="216" class="body">阴极钛辊带伤或添加剂失衡留下 30um 穿透针孔，</text>
  <text x="52" y="234" class="body">涂布黑浆渗穿污染背辊；180°C 延伸率跌至 2.1%，</text>
  <text x="52" y="252" class="body">在辊压机张力与硅碳负极 300% 膨胀下直接撕裂断带！</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. 毛面铜峰过高 (Rz=3.8um) 刺穿隔膜自放电</text>

  <!-- Footer -->
  <rect x="36" y="512" width="1128" height="92" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="538" class="card-h" fill="#f97316">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• 4.5–6 um 极薄锂电铜箔严禁“按吨重盲付”：微米针孔会导致涂布渗浆停机，而缺乏 180°C 高温延伸率会使铜箔在硅碳负极膨胀下撕裂。</text>
  <text x="54" y="584" class="body">• 必须将双面 CCD 零针孔、180°C 延伸率 (&gt;=6.0%)、毛面粗糙度 Rz (&lt;=2.0um) 与模切边铜溶铜闭环绑定为智能托管解锁谓词。</text>

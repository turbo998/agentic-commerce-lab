<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg295" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent295" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg295)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent295)"/>

  <!-- Header -->
  <text x="52" y="62" fill="#818CF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-15 · ROUND 293 · B2B CONTRACT MANNED SECURITY GUARD, TAMPER NFC TOUR, 1.0X HOLDOVER CAP &amp; BSIS</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">B2B 园区与数据中心驻场安保及移动巡逻：活体在岗锁、防拆 NFC 巡更与连班免加班费清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">封杀“夜班空岗 (Open Post) 照收 $38/h 与撬下巡更扣放桌底刷假码” · 阻断供应商缺替班连班转嫁 1.5x 加班费 · 核验 BSIS/SORA 保安证</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统商业安保外包与巡逻三大黑洞 (多付 18%–32%)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 夜班缺人“空岗吃空饷 (Open Post)”与桌底假巡更</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 凌晨偏远岗亭保安旷工无人值守，队长代签字照收 $38/h</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 保安用螺丝刀把墙上巡更磁扣撬下粘在值班室桌底定时刷</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 账单显示 100% 满勤巡逻，实则围墙被剪开 4 小时无人知</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 自身招不到人连班却向业主转嫁 1.5 倍加班费</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 安保公司不养机动替班员，接班人爽约就逼白班连上 16 小时</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 反手将这 8 小时按 1.5 倍 ($57/h) 紧急加班费开给业主</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 供应商排班越混乱、旷工越多，从业主身上赚的加班费越多</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 初级工冒充 $52 高级岗与无证/持枪证过期执勤</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 合同买 $52/h 退伍军警一级岗，实际派 $17/h 兼职新手</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 执勤人员州级保安证 (BSIS / SORA) 或持枪证早已过期</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 一旦发生伤人或重大失窃，商业保险直接拒赔由业主背锅</text>

  <!-- Center Card: Agentic Policy Engine -->
  <rect x="422" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
  <rect x="422" y="136" width="356" height="38" rx="12" fill="#312E81"/>
  <text x="442" y="160" fill="#C7D2FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体活体在岗、防拆 NFC 巡更与 1.0x 封顶三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#4F46E5"/>
  <text x="452" y="210" fill="#818CF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：岗亭活体抽检 + 防拆 NFC 与步态巡更锁</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 岗亭平板随机人脸活体核验，空岗 &gt;15m 自动扣款并罚 1.5x</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 巡更芯片内置防撬断路器并绑定 UWB/GPS 真实行走步数</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 阻断空岗吃空饷与值班室桌底刷假码</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#4F46E5"/>
  <text x="452" y="326" fill="#818CF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：缺人连班强制 1.0x 平价锁与 Tier 岗级门禁</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 无业主签发的 Surge Token，一切连班加班仅按 1.0x 结算</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严格核对人员资历等级 (Tier-1 vs Tier-2)，严禁以次充好</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 拦截排班失职加班费转嫁与岗级虚报</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#4F46E5"/>
  <text x="452" y="442" fill="#818CF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ 州保安局 BSIS/SORA 与持枪证锁</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 班前实时查验州政府保安注册号状态</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 穿透核查外露持枪证 (Firearm Permit) 与年度射击复训</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $24,750</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="796" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="796" y="136" width="356" height="38" rx="12" fill="#064E3B"/>
  <text x="816" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 园区与数据中心安保 ($275,000) 实测矩阵</text>

  <rect x="812" y="188" width="324" height="60" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="826" y="210" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="826" y="232" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">活体满岗 + 防拆 NFC 巡更 + 1.0x 平价 + 持证 → $275k</text>

  <rect x="812" y="258" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="280" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="826" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">夜班空岗 (Open Post) 照收工时或撬巡更扣刷假码 → 拦截</text>

  <rect x="812" y="328" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="826" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">缺人连班转嫁 1.5x 加班费或初级工冒充一级岗 → 阻断</text>

  <rect x="812" y="398" width="324" height="60" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="826" y="420" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 (275ms) / 🧑‍⚖️ HTTP 409 (240ms)</text>
  <text x="826" y="442" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">BSIS/SORA 保安证过期挂起 / 砍连班溢价+哨塔省 $24,750</text>

  <rect x="812" y="468" width="324" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="826" y="490" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">💡 剥离连班加班溢价与 AI 哨塔混编后净付：$250,250 (省 9%)</text>
  <text x="826" y="510" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="11">令牌：b2b_commercial_security_guard_patrol_biometric_...</text>

  <!-- Footer -->
  <rect x="48" y="556" width="1104" height="80" rx="10" fill="#020617" stroke="#334155"/>
  <text x="68" y="582" fill="#818CF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 驻场保安考勤必须绑定岗亭活体抽检与带防拆导电回路的 NTAG 424 滚动 NFC + 步态巡更，空岗 &gt;15 分钟自动扣费并罚违约金。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 凡无业主 Surge Token 的供应商缺人连班 (Holdover Overtime) 强制按 1.0x 平价结算，且班前通过 Web IQ 核验 BSIS/SORA 证件。</text>
</svg>

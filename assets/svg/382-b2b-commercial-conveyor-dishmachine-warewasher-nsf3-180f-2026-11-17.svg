  <text x="446" y="414" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截不清理堵塞喷淋臂却调大蠕动泵多卖 2 倍高价催干剂 → $0.00</text>


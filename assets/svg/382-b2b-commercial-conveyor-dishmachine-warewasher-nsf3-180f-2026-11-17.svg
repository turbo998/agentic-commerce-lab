  <rect width="1200" height="675" fill="url(#bg382)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent382)"/>

  <!-- Header -->
  <text x="48" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 380 · COMMERCIAL CONVEYOR DISHMACHINE &amp; WAREWASHER (NSF/ANSI 3), 20-PSI RINSE PRV &amp; ML/RACK CHEMICAL GATE</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">酒店与医院大型长龙洗碗机维保、20 PSI 终淋减压阀锁与按筐药水定额清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Hobart / Meiko / Champion / Hatco · $95 终淋减压阀 (15–25 PSI 防雾化降温) + $165 增压接触器 + 盘面 &gt;=160°F (3600 HUE)</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="64" y="160" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">🍽️ 四大商用长龙洗碗机热力与药耗硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 20±5 PSI 终淋减压阀 ($95 PRV) 防雾化锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 55 PSI 高压会把 185°F 热水打成细雾在半空降温 25°F</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制核验流动水压 15–25 PSI 与 $165 分路接触器</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截借水雾降温忽悠花 $6,500 换整台增压器</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 洗臂快拆尾盖清垢 &amp; 按筐药水定额锁</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁不掏洗臂柠檬籽却调大蠕动泵多卖 2 倍催干剂</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 绑定光电洗筐数 (Rack Counter) 封顶每百筐 mL 药量</text>
  <text x="74" y="368" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断 $240/桶高价催干剂与主洗液超量倾销</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="426" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. NSF/ANSI 3 盘面 &gt;=160°F (3,600 HUE) 锁</text>
  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 水箱表显 180°F 不代表餐盘表面真达到 160°F (71°C)</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制上传防水电子热盘仪 (Thermal Puck) &gt;=3,600 HUE</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 100% 满足医院与酒店食药监热力灭菌飞检</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="540" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. Web IQ 热回收盘管除垢 &amp; CFESA 核查</text>
  <text x="74" y="560" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• /v3/browse 核验 CFESA 技师与 Hatco/Hobart 目录</text>
  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截低温消毒机余氯 &lt;50 ppm 诺如病毒隐患</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 兼顾 FDA Food Code 卫生红线与蒸汽热回收能效</text>


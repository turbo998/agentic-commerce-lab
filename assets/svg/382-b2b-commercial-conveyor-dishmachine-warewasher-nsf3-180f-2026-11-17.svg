  <text x="446" y="570" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">AUTOMATED_RINSE_PRV_CONTACTOR_KIT_AND_PER_RACK_CHEMICAL_SAVINGS_CONFIRM</text>
  <text x="446" y="592" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">改换 $95 终淋减压阀+$165 接触器 + 按筐核减催干剂立省 $21,400 → $93,600.00</text>


  <text x="446" y="306" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">BOOSTER_HEATER_REPLACEMENT_UPCODING_ON_95_DOLLAR_RINSE_PRV_OR_CONTACTOR_BLOCKED</text>
  <text x="446" y="326" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截把 $95 减压阀高压水雾降温或 $165 接触器高报 $6,500 换机 → $0.00</text>


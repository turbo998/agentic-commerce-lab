  <text x="446" y="462" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛑 HTTP 451 · Send to a human (265ms)</text>
  <text x="446" y="482" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">FAILED_NSF3_160F_PLATE_SURFACE_TEMP_OR_LOW_SANITIZER_PPM_HOLD</text>
  <text x="446" y="502" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web IQ 挂起盘面温度 &lt;160°F (&lt;3600 HUE) 或余氯 &lt;50 ppm → $0.00</text>

  <!-- Lane 409 -->

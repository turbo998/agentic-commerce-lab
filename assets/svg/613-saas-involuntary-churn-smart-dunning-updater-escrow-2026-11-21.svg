  <text x="62" y="498" class="body-txt">before renewal; lifts baseline</text>
  <text x="62" y="516" class="mono">+4.2% Auth Rate on Day 0</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>

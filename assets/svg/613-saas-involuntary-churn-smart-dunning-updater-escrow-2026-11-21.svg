  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. B2B Tenant Grace &amp; PSD2 SCA Exemption (451)</text>
  <text x="820" y="162" class="body-txt">• Never Hard-Kill Active B2B Production Tenants:</text>
  <text x="830" y="182" class="mono">Day 1-14: Admin Banner Only (API/SSO stays UP)</text>
  <text x="830" y="200" class="mono">Day 15-21: Read-Only Mode · Day 30: Archive</text>
  <text x="820" y="223" class="body-txt">• EU/UK PSD2 `79 Soft Decline (SCA Required)`:</text>
  <text x="830" y="243" class="mono" fill="#f9a8d4">Apply Fixed-Amount MIT Exemption or Send 3DS2</text>
  <text x="820" y="266" class="body-txt">• RBI India e-Mandate (`>INR 15,000` Pre-Debit):</text>
  <text x="830" y="286" class="body-txt">Enforces mandatory T-24h AFA notification before</text>
  <text x="830" y="304" class="body-txt">recurring charge to prevent statutory bank block</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 B2B_PRODUCTION_CUTOFF_OR_PSD2_SCA_HOLD</text>


  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. CIT/MIT Trace ID &amp; Silent Updater Gate (422)</text>
  <text x="432" y="162" class="body-txt">• Fixes False `05 Do Not Honor` on Recurring MIT:</text>
  <text x="442" y="182" class="mono">Require Original_CIT_Network_Tx_ID (TID) +</text>
  <text x="442" y="200" class="mono">recurring_indicator=MIT + Zero-CVV Payload</text>
  <text x="432" y="223" class="body-txt">• T-72h Pre-Bill Network Token / VAU / ABU Sync:</text>
  <text x="442" y="243" class="mono" fill="#fcd34d">Refresh Expired / Reissued PAN Before Billing</text>
  <text x="432" y="266" class="body-txt">• Anti-Customer-Scare "Failed Payment!" Email Lock:</text>
  <text x="442" y="286" class="body-txt">Suppresses dunning emails during 7-day silent</text>
  <text x="442" y="304" class="body-txt">smart-retry window so passive users don't cancel</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 MISSING_CIT_TID_OR_PREMATURE_DUNNING_BLOCKED</text>


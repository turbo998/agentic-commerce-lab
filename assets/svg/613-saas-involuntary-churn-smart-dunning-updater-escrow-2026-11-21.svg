  <!-- Lane 1: Hard-Decline & Excessive Retry Fine Breaker -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Hard-Decline &amp; Card-Network Fine Breaker (403)</text>
  <text x="44" y="162" class="body-txt">• Stops Naive "Retry Every 24h for 10 Days" Loops:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Visa Category-1 / Mastercard MAC Category-1:</text>
  <text x="54" y="200" class="mono">04/07/14/41/43/R0/R1 → ZERO Retries Allowed</text>
  <text x="44" y="223" class="body-txt">• Prevents $0.10–$1.50/tx Network Retry Fines &amp;</text>
  <text x="54" y="243" class="body-txt">Merchant MID Approval-Rate Blacklisting:</text>
  <text x="54" y="263" class="mono">Cap Soft-Decline Retries &lt;= 15 per 30 Rolling Days</text>
  <text x="44" y="286" class="body-txt">• Routes Hard Declines immediately to Out-of-Band</text>
  <text x="54" y="304" class="body-txt">1-Tap Apple Pay / Google Pay / Link update link</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 HARD_DECLINE_OR_VISA_15X_RETRY_CAP_BLOCKED</text>


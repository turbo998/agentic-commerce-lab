  <text x="819" y="179" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3. Co-Employment &amp; FinOps (451/409)</text>
  <text x="819" y="216" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Web IQ 18-Month Co-Employment Cap (451)</text>
  <text x="819" y="238" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Enforces mandatory 18/24m tenure break</text>
  <text x="819" y="258" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  (Microsoft Vizcaino doctrine) &amp; I-9</text>
  <text x="819" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  E-Verify work authorization validity</text>
  <rect x="819" y="298" width="309" height="96" rx="9" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
  <text x="833" y="321" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">FinOps Direct-Sourcing + Payrolling (409)</text>
  <text x="833" y="341" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Routes silver-medalist &amp; alumni hires</text>
  <text x="833" y="361" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  through 10%-markup EOR Payrolling instead</text>
  <text x="833" y="381" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  of 42% staffing agency rate: -32% Net</text>
  <text x="819" y="420" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">90-Day Guarantee Fee Holdback</text>
  <text x="819" y="442" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Escrows perm search fees with 100% cash</text>
  <text x="819" y="462" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  clawback on early 90-day attrition</text>
  <rect x="819" y="502" width="309" height="92" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="833" y="526" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">HTTP 409 / 451 Deterministic Verdict</text>
  <text x="833" y="548" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">DIRECT_SOURCING_PAYROLL_TIER_AND</text>
  <text x="833" y="566" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">_SLIDING_BUYOUT_CONFIRM (-32% Net)</text>

  <!-- Lane 1: ATS Ownership & Conversion Buyout Cap -->
  <rect x="54" y="152" width="345" height="465" rx="14" fill="#111827" stroke="#ef4444" stroke-width="1.6"/>
  <rect x="54" y="152" width="345" height="42" rx="14" fill="#7f1d1d"/>
  <text x="72" y="179" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. ATS Ownership &amp; Buyout (HTTP 403)</text>
  <text x="72" y="216" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Prior-ATS &amp; Right-to-Represent (RTR) Lock</text>
  <text x="72" y="238" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Blocks agency fee claims on candidates</text>
  <text x="72" y="258" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  active in internal Workday/Greenhouse ATS</text>
  <text x="72" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  within 180d or lacking candidate-signed RTR</text>
  <rect x="72" y="298" width="309" height="82" rx="9" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
  <text x="86" y="321" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">$0 Temp-to-Perm Conversion After 960 Hrs</text>
  <text x="86" y="341" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Rejects 25% buyout fees after contractor</text>
  <text x="86" y="361" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  completes 6 months (960 billable hours)</text>
  <text x="72" y="408" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Open-Book Statutory Burden &amp; Markup Cap</text>
  <text x="72" y="430" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Separates W-2 base pay rate from agency</text>
  <text x="72" y="450" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  markup (&lt;=28% commercial / &lt;=35% IT)</text>
  <text x="72" y="470" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  to block 65% opaque bill-rate spreads</text>
  <rect x="72" y="502" width="309" height="92" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="86" y="526" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">HTTP 403 Deterministic Verdict</text>
  <text x="86" y="548" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">ATS_DUPLICATE_CANDIDATE_CLAIM_OR</text>
  <text x="86" y="566" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">_EXCESSIVE_CONVERSION_FEE_BLOCKED</text>

  <!-- Lane 2: SSO/VDI Timesheet & Rate-Card Tier Audit -->

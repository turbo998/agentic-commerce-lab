  <text x="54" y="66" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUND 119 · B2B CONTINGENT STAFFING, VMS TIMESHEET &amp; RATE-CARD ESCROW · SVG 562</text>
  <text x="54" y="100" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">B2B Contingent Staffing (VMS), Timesheet Audit &amp; Direct-Sourcing Escrow</text>

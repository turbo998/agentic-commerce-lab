  <text x="444" y="179" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. VMS Timesheet &amp; Tier Gate (HTTP 422)</text>
  <text x="444" y="216" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">SSO / VDI Active-Day vs. 40h Timesheet Match</text>
  <text x="444" y="238" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Cross-checks Fieldglass/Beeline 40h</text>
  <text x="444" y="258" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  timesheets against Entra SSO / VDI active</text>
  <text x="444" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  sessions &amp; public holiday shutdown days</text>
  <rect x="444" y="298" width="312" height="82" rx="9" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="458" y="321" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Anti-'Title Inflation' Rate-Card Gate</text>
  <text x="458" y="341" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Blocks billing a 2-yr Junior Dev at</text>
  <text x="458" y="361" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  Senior L4 Architect ($165/hr) rate tier</text>
  <text x="444" y="408" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Anti-'Bait-and-Switch' Proxy Interview Lock</text>
  <text x="444" y="430" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Verifies Day-1 laptop onboarding face</text>
  <text x="444" y="450" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  biometrics match the video-interviewed</text>
  <text x="444" y="470" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  candidate (defeats deepfake/proxy stand-ins)</text>
  <rect x="444" y="502" width="312" height="92" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="458" y="526" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">HTTP 422 Deterministic Verdict</text>
  <text x="458" y="548" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">UNVERIFIED_HOLIDAY_TIMESHEET_OR</text>
  <text x="458" y="566" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">_RATE_CARD_LEVEL_INFLATION_BLOCKED</text>


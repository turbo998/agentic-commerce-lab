  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. SIGIS UPC 级白名单分流 + 2PC 双支付源原子拆单：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• $120 医疗品自动注入 Field 63 刷 FSA 卡免小票秒过 + $15 日用品刷个人备用卡；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 双卡均拿到 Pre-Auth 后再原子 Capture，副卡失败 14ms 内自动 0400 冲正 FSA！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 双重用途硬件强制绑定 10 位 CMS NPI 持牌医生 LMN (≤12m)：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 验证 ICD-10 疾病诊断与医生 NPI 签名，100% 符合 IRS Publication 502 免税标准。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms NPI 执照核验与转化增收：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 混合购物车通过率从 0% 跃升至 96.4%，单批挽回/增收 $35,200.00 (HTTP 409)！</text>


  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：混合购物车整单刷 FSA 100% 拒付 + 伪造无 NPI 假处方暴雷</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 混合购物车未拆单整刷 HSA/FSA 遭发卡行 Code 57 秒拒：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• $120 血压计 + $15 普通洗发水混装整单刷 FSA 卡，发卡行 100% 硬拒付；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 缺失 SIGIS IIAS Field 63 医疗字段，导致员工福利卡被冻结要求人工补交纸质小票。</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 双重用途商品 (智能戒/理疗仪) 用 AI 伪造无 NPI 假 LMN：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反美国国税局 IRC § 213(d)，消费者被追缴 30% 个税 + 20% 法定罚金，商户被除名！</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 拆单无两阶段回滚 (2PC) 导致副卡失败后 HSA 资金悬挂：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 先实扣 FSA 卡再刷个人副卡失败，跨财年退款导致客户年底 FSA 额度过期作废。</text>


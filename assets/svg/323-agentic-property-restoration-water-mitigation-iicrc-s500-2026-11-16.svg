  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: agentic_property_restoration_water_mitigation_iicrc_s500_psychrometric_xactimate_mandate_2026 · 15.0% Savings ($29,250 / Batch)</text>


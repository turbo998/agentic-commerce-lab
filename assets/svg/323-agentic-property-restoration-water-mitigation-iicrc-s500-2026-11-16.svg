  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. LiDAR 房间尺寸 S500 台数锁 + 蓝牙 Dry Standard 停机 (11ms → HTTP 403)</text>
  <text x="648" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">依据受潮面积与立方英尺严格按 ANSI/IICRC S500 公式计算风机与除湿机上限台数；</text>
  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">蓝牙湿度计监测到石膏板 &lt;=12% MC 且 ΔGPP &lt;=5 时秒级冻结租金，11ms 拦空转。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="290" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 水源污染等级锁定 (Cat 1 禁强拆) + 单工种 20% O&amp;P 清零 (14ms → HTTP 422)</text>
  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">洁净水管破裂 (&lt;48h) 强制锁定为 Category 1 原位烘干，严禁按 Cat 3 黑水强拆或</text>

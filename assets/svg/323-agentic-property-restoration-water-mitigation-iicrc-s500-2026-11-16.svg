  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业水灾抢修与 Xactimate 报单四大黑洞 (Legacy Mitigation Leakage: 30%–60%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 500 平尺小房间硬塞 18 台风机 + 墙干后多吹 5 天 (Equipment Stuffing)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">无视 IICRC S500 体积公式，在小办公室堆满 18 台鼓风机与 4 台除湿机收 $1,400/天；</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">石膏板第 3 天已达 &lt;=12% 干标准，施工队却故意拖到第 8 天才收机器白收 5 天租。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 将自来水管漏水 (Cat 1 净水) 虚报为 Cat 3 黑水强拆装修 (Cat 3 Upcoding)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">饮用水管或空调冷凝水滴漏本可 $8,000 原位抽水吹干，抢修队却按化粪池倒灌级</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Category 3 黑水开单，把完好的地毯与石膏板墙全部切除砸毁，骗取 $68,000 大单。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 单一除湿工种强加 20% 总包管理费 (O&amp;P) + 净水收设备消毒费 (WTR EQD)</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">只做了抽水吹干一个工种，却在账单末尾强收 10% Overhead + 10% Profit (20%</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">O&amp;P)；且对吹干净自来水的机器按每台 $45 收取生物危废级去污消毒费。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 手动调高 Xactimate 定额单价 + 无独立 IEP 报告伪造毒霉菌危机</text>
  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">在 Xactimate 软件里偷偷将官方区域定额单价手动改高 25%；未经 AIHA 认证独立</text>

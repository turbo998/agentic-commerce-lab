  <text x="54" y="182" class="mono" fill="#fca5a5">Query Live `X12 270/271` (`VSP / EyeMed / Davis`)</text>
  <text x="54" y="200" class="mono">Place Atomic Hold on Annual `$150_Frame_Allowance`</text>
  <text x="44" y="223" class="body-txt">• Anti-Upfront-Cash Checkout Abandonment:</text>
  <text x="54" y="243" class="mono">Deduct Plan Benefit Live + Split HSA/FSA Copay</text>
  <text x="44" y="266" class="body-txt">• Prevents patients from claiming the same annual</text>
  <text x="54" y="286" class="body-txt">allowance on both glasses and contacts in the same</text>
  <text x="54" y="304" class="body-txt">plan year (leaving merchant with payer clawbacks)</text>

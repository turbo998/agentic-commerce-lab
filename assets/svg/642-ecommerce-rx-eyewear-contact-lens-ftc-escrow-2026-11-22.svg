  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. Rx Sign/Axis &amp; AR `PD` Gate (HTTP 422)</text>
  <text x="432" y="162" class="body-txt">• Stops Grinding Lenses w/ Flipped `+` vs `-` Signs:</text>
  <text x="442" y="182" class="mono">OCR Cross-Check: `Sphere (+/-)`, `Cyl` Requires `Axis`</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">Block Contact Lens Base-Curve (`BC`) on Eyeglasses!</text>
  <text x="432" y="223" class="body-txt">• Mobile AR Pupillary Distance (`PD`) Verification:</text>
  <text x="442" y="243" class="mono">Require Dual-PD (`OD/OS`) for High-Index `&gt; ±4.00D`</text>
  <text x="432" y="266" class="body-txt">• Eliminates 38% of lab lens remakes caused by</text>
  <text x="442" y="286" class="body-txt">shoppers typing `+3.25` instead of `-3.25` or</text>
  <text x="442" y="304" class="body-txt">guessing a default 63mm PD on progressive lenses</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 INVALID_RX_SIGN_AXIS_OR_MISSING_AR_PD_BLOCKED</text>


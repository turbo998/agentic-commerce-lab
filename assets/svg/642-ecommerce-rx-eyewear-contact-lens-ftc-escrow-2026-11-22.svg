  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. FTC 8-Business-Hour Rx Lock (HTTP 451)</text>
  <text x="820" y="162" class="body-txt">• Stops Shipping Contacts Before 8 Business Hours:</text>
  <text x="830" y="182" class="mono">FTC 16 CFR Part 315: Count Prescriber Local Biz Hrs</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">Pause Clock on Saturday, Sunday &amp; Federal Holidays</text>
  <text x="820" y="223" class="body-txt">• Expired Rx &amp; Brand-Substitution Prohibition:</text>
  <text x="830" y="243" class="body-txt">Blocks substituting private-label contact lenses</text>
  <text x="830" y="261" class="body-txt">for the exact doctor-prescribed brand (`Acuvue`)</text>
  <text x="820" y="284" class="body-txt">• Prevents $51,744/violation FTC penalties from</text>
  <text x="830" y="302" class="body-txt">robocall verification spam or premature shipping</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 FTC_PART315_8BIZ_HOUR_OR_EXPIRED_RX_HOLD</text>


  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. “假外包真雇佣 (Misclassification)”解约反水被判补缴 3 年 40% 社保</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 海外全职程序员每周固定坐班 40h、受公司经理考勤排期，却长期按个人外包 (Contractor) 发薪。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 触犯欧盟 2024/2831 指令与加州 AB5，解约即被诉事实劳动关系，单人追缴社保与罚金超 $100,000！</text>


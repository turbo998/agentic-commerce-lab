  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 海外 EoR 商务人员直接以母公司名义签合同，被当地税局认定构成常设机构 (Permanent Establishment)。</text>
  <text x="64" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 母公司全球关联利润被当地税局按 25%–35% 追征企业所得税，且 SWIFT 跨境发薪汇损高达 3.5%！</text>


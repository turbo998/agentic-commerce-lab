  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 欧洲、日本、拉美等民法法系国家不承认外包商自动适用 Work Made for Hire，且精神权利不可概括放弃。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 未签属地化现时知识产权转让协议 (PIIA) 即打款，融资并购尽调时发现核心代码产权悬空！</text>


  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 平时只按月发基本工资，未按月计提 8.33% 的法定十三薪/十四薪及巴西 8% FGTS 解雇准备金。</text>

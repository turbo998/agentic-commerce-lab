  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">把内窥探头怼在正常铸铁管水垢上谎称地基下排污管坍塌，忽悠签单 $18,000 换管。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>

  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业防倒流阀年检与排污疏通四大黑洞 (Legacy Plumbing Leakage: 35%–60%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. RPZ 防倒流阀卡一粒沙子滴水，骗你花 $3,800 锯掉换整套新铜阀 (Full Valve Scam)</text>

  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">不良管道工却谎称“铜阀报废不能修”收 $3,800 换新阀，还把 30 磅好铜阀卖废铜私吞。</text>


  <text x="450" y="245" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">grocery_perishable_markdown_gs1_mandate_*</text>

  <rect x="434" y="268" width="362" height="72" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
  <text x="450" y="292" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 403 · EXPIRED_LOT_AI17_OR_LABEL_SWAP_BLOCKED</text>
  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截已过 AI(17) 保质期商品结账或折扣码与原 GTIN 不符</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">pos_hard_stop = true | swap_fraud = blocked</text>

  <rect x="434" y="352" width="362" height="72" rx="8" fill="#431407" stroke="#F97316" stroke-width="1.5" />
  <text x="450" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 422 · CANNIBALIZATION_OR_HOARDING_BLOCKED</text>
  <text x="450" y="396" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截非临期批次被误打折、单客超3件扫货或ESL/POS价差</text>
  <text x="450" y="413" fill="#FDBA74" font-family="Consolas, monospace" font-size="11">max_units = 3 | esl_pos_parity = required</text>

  <rect x="434" y="436" width="362" height="72" rx="8" fill="#3B0764" stroke="#A855F7" stroke-width="1.5" />

  <!-- Header -->
  <text x="44" y="48" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 21 · GROCERY PERISHABLE DYNAMIC MARKDOWN, GS1 DATABAR EXPIRY LOCK &amp; FOOD-RESCUE ARCHITECTURE</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">生鲜商超与临期动态出清：GS1 效期死锁、ESL 阶梯调价与盲盒/慈善抵税护栏</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Instacart Carrot Tags vs Wasteless / Hanshow ESL vs Too Good To Go / Flashfood vs Azure Foundry + GS1 AI(17) Guard</text>

  <!-- Left Panel: 3 Core Grocery Shrink Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 生鲜商超与临期出清三大失控黑洞</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. 过期品误售食安罚单与撕标换贴欺诈</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 传统 UPC-A 一维码不含保质期，收银台无法拦截</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  过期鲜奶；或黄牛撕下5折贴纸贴到正价和牛上</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：强制校验 GS1 DataBar AI(17) 效期字段与</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  原 GTIN 绑定签名 (HTTP 403 硬阻断收银)</text>

  <rect x="62" y="328" width="314" height="132" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />

  <text x="868" y="458" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. POS 强校验 GS1 AI(17) 效期与防换标签名</text>
  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 按剩余货架期(RSL)阶梯驱动 ESL 变价</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 闭店前 90m 自动切盲盒 + 慈善抵税凭证</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. 联动 Web IQ 实时阻断 FDA 召回批次</text>
  <rect x="868" y="542" width="256" height="50" rx="6" fill="#022C22" />

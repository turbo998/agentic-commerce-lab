  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">锥形黄铜堵头 (Tube Plugs) 就能解决的轻微点蚀，夸大成 $45,000 整台冷凝器拔管重穿。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. $380 内置油过滤器芯堵塞报“低油压差”，被虚报为 $9,500 换潜油泵或变频器模块</text>

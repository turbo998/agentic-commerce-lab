  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. BMS 满载冷凝趋近温差回落锁 (&lt;=2.5°F) + 100% 铜管计数锁 (11ms → HTTP 403)</text>

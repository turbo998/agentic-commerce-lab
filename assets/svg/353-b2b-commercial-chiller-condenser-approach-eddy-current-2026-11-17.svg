  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">潜油泵烧毁；变频柜过温只因 $240 散热风扇停转却报 $9,500 换 IGBT 功率主板。</text>


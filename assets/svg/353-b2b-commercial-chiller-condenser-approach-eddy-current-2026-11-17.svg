  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">拍照交差，开机后冷凝趋近温差高达 6.5°F（正常 &lt;=2.5°F），一夏天多烧 $25,000 电费。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 不给原始涡流波形图，拿一张假 Excel 表吓唬“铜管腐蚀穿孔”强推 $45,000 换管</text>

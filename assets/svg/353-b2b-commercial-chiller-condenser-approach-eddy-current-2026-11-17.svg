  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统商业冷水机组通炮清洗与涡流探伤四大黑洞 (Legacy Chiller Leakage: 32%–55%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 只拿水枪冲端盖管板表面拍照收 $7,500，800 根铜管未刷致趋近温差仍达 6.5°F</text>

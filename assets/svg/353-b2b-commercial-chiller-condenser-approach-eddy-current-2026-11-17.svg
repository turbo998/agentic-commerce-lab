  <text x="76" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">派无 ASNT 电磁涡流资质学徒乱拉探头出假报告；且全年未用标准样气测试机房冷媒</text>

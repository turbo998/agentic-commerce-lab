  <rect width="1200" height="630" fill="url(#bg112)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent112)"/>

  <!-- Header -->
  <rect x="40" y="24" width="390" height="28" rx="14" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="235" y="43" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#FEF3C7" text-anchor="middle">
    ROUND 110 · OFFSHORE WIND WTIV JACK-UP SPUDCAN ESCROW
  </text>
  <text x="40" y="84" font-family="Segoe UI, Ubuntu, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">
    海上风电自升式安装船 (WTIV) 租船、桩靴预压载防穿刺与吊机停租智能托管
  </text>
  <text x="40" y="111" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" fill="#94A3B8">
    SNAME 5-5A Spudcan Preload Holding (&gt;=110% Max Storm Load), Rack-Phase-Difference (RPD &lt;=0.5°) &amp; Boom-Tip Wind vs. Off-Hire Overbilling
  </text>

  <!-- Left Card: Legacy Daily Log & Punch-Through/Crane Failure -->
  <rect x="40" y="132" width="355" height="360" rx="12" fill="url(#cardBg112)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="148" width="323" height="32" rx="6" fill="#450A0A"/>
  <text x="217" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">
    ❌ 传统凭船长日志盲付与桩腿穿刺踩坑
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 偷减压载水预压时长致吊装时“桩腿穿刺 (Punch-Through)”</text>
    <text x="58" y="224" fill="#CBD5E1">• 上硬下软海床未满载压舱持荷 6 小时，收走 $480,000</text>
    <text x="58" y="242" fill="#CBD5E1">• 1,600吨主吊起吊 15MW 叶轮瞬间单腿骤沉 3米致船体倾覆</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 升降齿轮齿条磨损或主吊故障谎称“高空阵风待命”</text>
    <text x="58" y="294" fill="#CBD5E1">• 桩腿齿条相位差 RPD &gt; 0.5° 卡死或绕桩吊变幅液压漏油</text>
    <text x="58" y="312" fill="#CBD5E1">• 船东手写 DPR 日志谎称“130米高空风速 &gt; 12 m/s”骗日费</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 拔桩高压冲水伤及海缆或踩入邻近历史桩坑 (Footprint)</text>
    <text x="58" y="364" fill="#CBD5E1">• 桩靴距既有桩坑边缘 &lt; 1倍直径诱发侧向滑移弯折桩腿</text>
    <text x="58" y="382" fill="#CBD5E1">• 缺失劳合社 MWS 站位批复 (Location Approval) 致保险拒赔</text>
  </g>
  <rect x="58" y="442" width="319" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="217" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">

  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="823" y="204" font-weight="700" fill="#6EE7B7">• 桩靴预压载稳固与主吊达标放款 (200)</text>
    <text x="823" y="223" fill="#CBD5E1">  延迟：21 ms · 放款：$480,000.00 (RPD 0.12°)</text>

    <text x="823" y="253" font-weight="700" fill="#FCA5A5">• 偷减预压载持荷或齿条 RPD 超差拦截 (403)</text>
    <text x="823" y="272" fill="#CBD5E1">  延迟：12 ms · 阻断高空吊装桩腿穿刺风险</text>

    <text x="823" y="302" font-weight="700" fill="#FCA5A5">• 主吊/升降故障伪装高空大风待命拦截 (422)</text>
    <text x="823" y="321" fill="#CBD5E1">  延迟：15 ms · 自动触发 BIMCO WINDTIME 停租</text>

    <text x="823" y="351" font-weight="700" fill="#FDE68A">• Web IQ 支线送料驳船 (Feeder) 协同套利 (409)</text>
    <text x="823" y="370" fill="#CBD5E1">  延迟：300 ms · 节省：$64,000.00 (13.3% 降本)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  131 / 131 单元测试 100% 通过 (CSP 自包含)</text>
  </g>
  <rect x="823" y="442" width="319" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="982" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">

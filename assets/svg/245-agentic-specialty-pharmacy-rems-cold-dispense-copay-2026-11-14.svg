  <text x="46" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#CBD5E1">FDA REMS ETASU Lab Gate, Anti-Copay-Maximizer OOP Shield &amp; 48h Cold-Chain Lock vs. Misbranding Fines &amp; $25k Spoiled Biologics</text>
  <text x="46" y="106" font-family="Consolas, monospace" font-size="12" fill="#F472B6">Mandate Token: agentic_specialty_pharmacy_rems_cold_dispense_copay_mandate_2026_11_14 · Batch: $840,000.00 · Net Optimized: $772,800.00 (-$67,200.00)</text>


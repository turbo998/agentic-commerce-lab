  <text x="50" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#FECACA">Why Cron Auto-Refills &amp; Unchecked PBM Cobilling Trigger FDA Fines &amp; $25k Biologic Spoilage</text>

  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. 未核验 FDA REMS ETASU 授权码与 7 日内化验单直接违规发药</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 高致畸/粒细胞缺乏风险特药必须凭近 7 天阴性妊娠或血常规 (ANC) 换取 REMS 授权码方可调配。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• AI 按普通慢病到期自动续寄，直接违反 21 U.S.C. § 355-1 沦为非法假劣药，面临吊销执照重罚！</text>

  <rect x="48" y="282" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">2. PBM 共付额最大化器 (Copay Maximizer) 吸干药厂 $15,000 患者援助金</text>
  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• PBM 将特药划为非基本福利 (Non-EHB)，故意把患者月自付调高至 $2,500 吸干药厂援助卡上限。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 药厂付出的 $15,000 补贴完全不计入患者年度免赔额 (OOP Max = $0)，半年后患者因无力自付断药！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 未确认患者 48h 居家签收盲目寄出 $25,000 冷链生物制剂</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 单支上万美元的 2°C–8°C 单抗/基因药物一旦寄出即不可退回重售；患者出差无人签收放在门口。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 冰排融化后蛋白质在 4 小时内热变性失活，整箱 $25,000 救命药彻底报废！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">4. 误向 Medicare Part D / Medicaid 患者发放商业共付卡触发反回扣法重罪</text>
  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 未穿透核查双保 (Dual-Eligible) 患者的联邦医保 BIN/PCN，违规使用药厂商业补贴卡抵扣。</text>
  <text x="64" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 触犯美国《反回扣法 (AKS 42 U.S.C. § 1320a-7b)》与《虚假申报法》，面临司法部数亿美元罚单！</text>


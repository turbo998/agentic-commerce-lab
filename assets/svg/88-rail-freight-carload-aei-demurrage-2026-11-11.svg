<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg88" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="50%" stop-color="#17233b"/>
      <stop offset="100%" stop-color="#223556"/>
    </linearGradient>
    <linearGradient id="accent88" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg88)"/>
  <rect x="30" y="25" width="1140" height="580" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2" opacity="0.95"/>
  <rect x="30" y="25" width="1140" height="6" fill="url(#accent88)"/>

  <text x="60" y="72" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">ROUND 86 · RAIL FREIGHT CARLOAD, AEI RFID TELEMETRY &amp; CONSTRUCTIVE PLACEMENT MANDATE</text>
  <text x="60" y="108" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">铁路干线货运车皮周转、AEI 轨旁射频遥测与建设性送达脱钩托管 vs 积压滞留费盲付</text>
  <text x="60" y="136" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">AAR AEI RFID Switch-Release Proof + Anti-Bunching / Missed-Switch Exclusion + STB 49 CFR 1333 vs. Rail Demurrage Trap</text>

  <!-- Left Card -->
  <rect x="60" y="160" width="525" height="335" rx="12" fill="#25121d" stroke="#ef4444" stroke-width="1.8"/>
  <text x="85" y="196" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ 传统铁路车皮滞留费 (Rail Demurrage) 盲付模式</text>
  <text x="85" y="230" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 铁路扎堆送车 (Railcar Bunching) 嫁祸货主：5 天分批发的 40 节车皮被攒成 1 天塞爆厂区专用线</text>
  <text x="85" y="260" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 建设性送达 (Constructive Placement) 霸王计费：车停在站外编组场算货主超时，$150/车/天强扣</text>
  <text x="85" y="290" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 机车漏挂 (Missed Switch) 照收占轨费：货主早已卸空报请拉走，铁路调车机车爽约却继续计费</text>
  <text x="85" y="320" fill="#fee2e2" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 自备车 (Private Car) 里程补贴漏算：企业自购罐车/漏斗车在干线运行未抵扣空重车里程津贴</text>
  <rect x="85" y="350" width="475" height="120" rx="8" fill="#35101d" stroke="#f87171" stroke-width="1"/>
  <text x="105" y="382" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">典型化工 / 粮谷 / 钢铁大宗铁路专用线物流结算资损案例：</text>
  <text x="105" y="410" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">采购 Agent 自动支付 $92,000 月度铁路运费与车皮滞留账单，其中 $28,000 系铁路编组站</text>
  <text x="105" y="434" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13">途中延误后扎堆集中到达 (Bunching) 及周末调车机车漏挂所致，货主替铁路背锅买单</text>
  <text x="105" y="456" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 扎堆送车豁免率：0% | • 机车漏挂剔除：0% | • 冤枉滞留罚金占比：20%–35%</text>

  <!-- Right Card -->
  <rect x="615" y="160" width="525" height="335" rx="12" fill="#0a2426" stroke="#22c55e" stroke-width="1.8"/>
  <text x="640" y="196" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">✅ AEI 轨旁射频 + 扎堆/漏挂豁免 + 自备车里程抵扣托管</text>
  <text x="640" y="230" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• AAR AEI 轨旁 RFID 与 EDI 418/322 对账：铁证锁定车皮进出厂道口时刻与卸空释放回执</text>
  <text x="640" y="260" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 扎堆到达 (Bunching) 与漏挂 (Missed Switch) 硬剔除：非货主原因导致的建设性送达一律停表</text>
  <text x="640" y="290" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 轨道衡动态毛皮重互校与 STB 49 CFR 1333 合规：Web IQ 核验对等滞留规则与危化品路由</text>
  <text x="640" y="320" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 整列直达编组 (Unit-Train) 与自备车里程津贴套利：自动核算 TTX/私有车皮里程返还立省 $24,500</text>
  <rect x="640" y="350" width="475" height="120" rx="8" fill="#062e29" stroke="#4ade80" stroke-width="1"/>
  <text x="660" y="382" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">端到端工程与财务收益（Measured / Deterministic）：</text>
  <text x="660" y="410" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">11ms 硬阻断铁路扎堆送车 (Bunching) 与调车漏挂产生的虚假建设性送达滞留费；14ms 拦截</text>
  <text x="660" y="434" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="13">轨道衡结冰超重误报；Web IQ 匹配自备车干线里程补贴与整列编组优待直接抵扣 $24,500（净付 $67.5k）</text>
  <text x="660" y="456" fill="#4ade80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 霸王滞留费拦截：100% | • 专用线停时对账精度：秒级 | • 验真耗时：&lt; 25ms</text>

  <!-- Bottom Bar -->
  <rect x="60" y="512" width="1080" height="72" rx="10" fill="#131f38" stroke="#475569" stroke-width="1"/>
  <text x="85" y="541" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">架构师核心选型法则：</text>
  <text x="235" y="541" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14">铁路货运结算 Agent 绝不能见 Constructive Placement 账单就付！必须绑定【AEI 轨旁 RFID + 扎堆/漏挂豁免 + 轨道衡复核】。</text>
  <text x="85" y="567" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Provenance: Deterministic Policy Evaluator (`evaluate_rail_freight_carload_demurrage_policy`) · AAR AEI RFID &amp; STB 49 CFR 1333 · 2026-11-11</text>
</svg>

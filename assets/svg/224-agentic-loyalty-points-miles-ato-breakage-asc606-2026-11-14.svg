  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 222 · LOYALTY &amp; ASC 606</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体会员积分与常旅客里程防黄牛盗刷洗分、受让人 72h 锁与 ASC 606 负债架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">FIDO2 兑奖升级 + 新受让人 ≥72h 冷静期 + 单点价值 CPP 令牌 (`agentic_loyalty_points_miles_ato_breakage_asc606_mandate_...`) vs 撞库盗刷</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red224)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：撞库秒加受让人盗刷百万里程 + 越权翻倍抵扣炸穿财报负债</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 黑客撞库盗号 (ATO) 秒加陌生受让人出票或兑电子礼品卡套现：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 票代黄牛 (Mileage Brokers) 盗号后 10 秒添加散客姓名秒出国际商务舱或换礼品卡；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 平台既要向合作航司付真金白银，又得给被盗会员全额补发里程，遭受 200% 双倍亏损！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 营销 Agent 擅自放开 2.5¢/pt 翻倍抵扣击穿 ASC 606 递延负债池：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 突破账面 1.25¢/pt 合同负债计提标准，触发全网存量积分负债重估爆雷与套利挤兑。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 利用 Cash+Points 退货洗长有效期，或违规清零用户付费购买的积分：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 下单秒退将临期积分延期 2 年；误将花钱买的积分 (Purchased Points) 清零引发诉讼。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

  </text>
  <text x="818" y="466" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">
    • Requires pre-registered Alternate Pickup Person name
  </text>

  <!-- Footer -->
  <text x="52" y="582" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    🏆 1,405th Deterministic Unit Test Milestone! · Pillar 3: Omnichannel BOPIS &amp; Curbside Fulfillment (#527)
  </text>

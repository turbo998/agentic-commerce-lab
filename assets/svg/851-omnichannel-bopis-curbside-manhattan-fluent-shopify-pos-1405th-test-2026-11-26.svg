  </text>
  <text x="818" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    and texts a static barcode screenshot to a local mule
  </text>
  <text x="818" y="284" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    who walks out of the store 30 minutes later!
  </text>
  <rect x="818" y="304" width="310" height="72" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
  <text x="832" y="328" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">
    if Static_Screenshot_On_HighValue or Unbound_Proxy:
  </text>
  <text x="832" y="348" fill="#a7f3d0" font-family="Consolas, monospace" font-size="12">
    raise HTTP_451_BOPIS_MULE_STATIC_BARCODE_FRAUD_BREACH
  </text>
  <text x="832" y="366" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">

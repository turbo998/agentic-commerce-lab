  <text x="220" y="532" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">违规向第三方拖车行开票 (§ 541.4)，或在码头无预约号期间强收滞箱费</text>
  <text x="650" y="532" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">403 · Send to a human</text>
  <text x="875" y="532" fill="#E2E8F0" font-family="monospace" font-size="12">11ms</text>
  <text x="965" y="532" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">Trucker/0-Slot Blocked</text>

  <!-- Row 3 -->
  <text x="66" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">dnd_exp_422</text>
  <text x="220" y="560" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">计费结束后超 30 个日历日才开票 (§ 541.7)，或缺失 OSRA 13 项要素</text>
  <text x="650" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">422 · Send to a human</text>
  <text x="875" y="560" fill="#E2E8F0" font-family="monospace" font-size="12">14ms</text>
  <text x="965" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">Statutory 0-Pay Waiver</text>

  <!-- Row 4 -->

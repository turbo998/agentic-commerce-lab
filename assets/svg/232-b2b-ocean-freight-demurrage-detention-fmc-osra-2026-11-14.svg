  <!-- Row 5 -->
  <text x="66" y="616" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">dnd_sav_409</text>
  <text x="220" y="616" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Web IQ 凭码头无号实时存证与 FMC 30天/13要素规则自动核减 D&amp;D 费</text>
  <text x="650" y="616" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">409 · Confirm</text>

  <text x="220" y="504" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">合格合同受票方 + 码头无号日已停表豁免 + ≤30天开票且齐备 13 要素</text>
  <text x="650" y="504" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">200 · Act automatically</text>

  <rect width="1200" height="675" fill="url(#bg232)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#sea232)"/>
  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 230 · OCEAN D&amp;D &amp; FMC OSRA</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">B2B 海运集装箱滞港滞箱费 (D&amp;D) 与美国 FMC OSRA (46 CFR Part 541) 审计架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">码头无预约号自动停表 + 禁向拖车行开票 + 30天/13要素免付令牌 (`b2b_ocean_freight_demurrage_detention_fmc_osra_mandate_...`)</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red232)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：码头约不到号照交 $400/天 + 向拖车行逼债扣车 + 逾期缺要素废票照付</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 码头无可用预约号仍强收 $400/天 + 违规向拖车行 (Trucker) 开票：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 码头连续 4 天无还空柜预约槽位 (0 Slots) 或封区，船司仍违法强收滞箱费 (违反 § 545.5)；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 船司把账单开给无合同关系的集卡车队并封禁进港权，违反 46 CFR § 541.4！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 计费结束超 30 天才开出秋后算账发票，或漏填 OSRA 13 项要素：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 根据 46 CFR § 541.6/541.7，超 30 天开票或缺失实际可提货日等 13 要素依法 0 付款义务。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 未剔除港口台风/罢工封港天数，或同时向发货人与收货人双重开票：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 导致跨国供应链为不可抗力与船司重复计费白白损失数万美元物流预算。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms Trucker/0-Slot D&amp;D) | HTTP 422 (14ms &gt;30d / &lt;13 Fields)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#sea232)"/>
  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：码头预约存证停表 + § 541.4 受票方锁 + 30天/13要素免付网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 码头预约槽位每小时存证 (Incentive Principle) + 合格受票方锁：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 自动比对 eModal/PierPASS 预约快照，对无预约号日 100% 停表免付 (§ 545.5)；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 硬拦截任何开给第三方集卡拖车行 (Motor Carrier) 的违法账单 (§ 541.4)！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 30 个日历日开票死线 (§ 541.7) + OSRA 13 项强制要素 (§ 541.6)：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 14ms 自动识别超 30 天逾期发票或漏填 Container Availability Date 废票并依法拒付。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 港口通告与核减增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动附带密码学无号存证包与 FMC 法定免付条款，单批立省 $41,600.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $520k Ocean D&amp;D) | HTTP 409 ($41.6k OSRA Waiver Saved)</text>

  <!-- Bottom Quantitative Benchmark Table -->
  <rect x="36" y="415" width="1128" height="236" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="56" y="444" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">📊 定量实测矩阵：B2B 海运集装箱滞港滞箱费 (D&amp;D) 结算批次 ($520,000.00) 5 组边界验证 (`evaluate_b2b_ocean_freight_dnd_fmc_policy`)</text>

  <rect x="52" y="458" width="1096" height="28" rx="4" fill="#0F172A"/>
  <text x="66" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">SCENARIO ID</text>
  <text x="220" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">§ 541.4 PARTY &amp; § 545.5 SLOT ORACLE / &lt;=30D &amp; 13 FIELDS / PORT HOLD</text>

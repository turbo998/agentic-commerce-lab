  <text x="830" y="182" class="mono">Require Active `DE_LUCID_#`, `WEEE_Reg_#` &amp; `FR_UIN`</text>
  <text x="830" y="200" class="mono" fill="#f9a8d4">Verify Authorized Representative (`AR`) for Non-EU</text>
  <text x="820" y="223" class="body-txt">• Anti-`Abmahnung` Competitor Cease-and-Desist Lock:</text>
  <text x="830" y="243" class="body-txt">Blocks German/French checkout or catalog publish</text>
  <text x="830" y="261" class="body-txt">if electrical/battery SKU lacks valid `Stiftung EAR`</text>
  <text x="820" y="284" class="body-txt">• Prevents €200,000VerpackG/ElektroG fines and</text>
  <text x="830" y="302" class="body-txt">sudden Q4 Amazon.de / TikTok Shop account freezes</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 MISSING_EU_EPR_LUCID_WEEE_UIN_REGISTRATION_HOLD</text>


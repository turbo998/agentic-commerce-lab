  <text x="622" y="498" class="body-txt">`ZSVR LUCID` &amp; dual-system PRO;</text>
  <text x="622" y="516" class="mono" fill="#6ee7b7">100% Zero-Discrepancy Audit</text>

  <rect x="893" y="418" width="259" height="120" rx="8" fill="#1e293b" stroke="#10b981"/>

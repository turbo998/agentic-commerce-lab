  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. Material BOM Split &amp; RMA Netting (HTTP 422)</text>
  <text x="432" y="162" class="body-txt">• Stops Declaring Cardboard Weight at Plastic Rate:</text>
  <text x="442" y="182" class="mono">Split SKU Packaging: `Paper (€0.18/kg)` vs</text>
  <text x="442" y="200" class="mono" fill="#fcd34d">`Plastic (€1.45/kg)` vs `Li-Ion Battery_Grams`</text>
  <text x="432" y="223" class="body-txt">• Cross-Border Returned-Order Weight Deduction:</text>
  <text x="442" y="243" class="mono">Net_EPR_Grams = Shipped_Grams - Returned_Grams</text>
  <text x="432" y="266" class="body-txt">• Eliminates 45% eco-fee overpayment caused by</text>
  <text x="442" y="286" class="body-txt">lumping 320g corrugated boxes into the high-cost</text>
  <text x="442" y="304" class="body-txt">composite/plastic tariff or paying on returned goods</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 GROSS_PLASTIC_LUMPING_OR_UNNETTED_RMA_BLOCKED</text>


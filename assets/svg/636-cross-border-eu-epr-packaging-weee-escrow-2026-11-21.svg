  <text x="62" y="480" class="body-txt">box (`Primary`) + 3PL shipping</text>
  <text x="62" y="498" class="body-txt">carton (`Secondary`) per order;</text>
  <text x="62" y="516" class="mono">Separates Paper vs. LDPE Film</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>

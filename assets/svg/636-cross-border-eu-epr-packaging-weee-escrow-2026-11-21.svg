  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Double-Remit &amp; PVC Penalty Lock (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Paying EPR Twice (Marketplace + Self-File):</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Exclude `Marketplace_Pay_on_Behalf` Orders</text>
  <text x="54" y="200" class="mono">from Direct PRO (`Citeo / Der Grüne Punkt`) Filing</text>
  <text x="44" y="223" class="body-txt">• French Citeo `Eco-Modulation` Malus Guard:</text>
  <text x="54" y="243" class="mono">Block Non-Recyclable PVC / Carbon-Black (+100% Fee)</text>
  <text x="44" y="266" class="body-txt">• Prevents merchants from paying Amazon EPR</text>
  <text x="54" y="286" class="body-txt">withholding AND reporting the same German/French</text>
  <text x="54" y="304" class="body-txt">units again in their annual direct PRO return</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 EPR_MARKETPLACE_DOUBLE_PAY_OR_PVC_MALUS_BLOCKED</text>


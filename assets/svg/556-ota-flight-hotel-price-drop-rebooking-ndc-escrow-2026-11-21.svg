  <text x="54" y="66" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUND 113 · OTA FLIGHT/HOTEL PRICE-DROP REBOOKING &amp; NDC SAGA · SVG 556</text>
  <text x="54" y="100" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">OTA Flight/Hotel Price-Drop Rebooking, Anti-Basic-Economy &amp; NDC Escrow</text>

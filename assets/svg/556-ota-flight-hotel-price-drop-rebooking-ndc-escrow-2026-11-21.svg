  <text x="833" y="526" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">HTTP 409 / 451 Deterministic Verdict</text>
  <text x="833" y="548" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">NDC_ORDER_RESHOP_RESIDUAL_CREDIT_AND</text>
  <text x="833" y="566" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">_SAME_ROOM_REBOOK_CONFIRM (-27% Net)</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 逐单净贡献毛利门禁 (Post-MDR Net Margin &gt;= 800 bps)：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 高毛利 (60%) 品类全开 0% APR 免息拉升转化；微利 SKU 自动路由至消费者付息分期</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">  (商户 MDR 仅 ~2.2%) 或 0.8% 费率 A2A 直连，100% 杜绝负毛利倒贴！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 逆向物流揽收即刻触发 Pause_Autopay + 尾部优先抵扣 (Tail-First)：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 快递首扫瞬间冻结第 2 期代扣；$250 退货先消减第 4 期 ($100) 与第 3 期 ($100)，第 2 期降为 $50。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms CFPB Reg Z 合规与费率套利：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 动态置换微利单高昂贴息 MDR 450 bps，单批立省 $23,400.00 (HTTP 409 Confirm)！</text>


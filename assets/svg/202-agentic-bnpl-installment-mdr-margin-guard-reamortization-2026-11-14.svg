  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 200 · BNPL MDR &amp; REG Z</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体电商分期付款 (BNPL) 商户贴息毛利门禁与部分退货尾部优先重算架构</text>

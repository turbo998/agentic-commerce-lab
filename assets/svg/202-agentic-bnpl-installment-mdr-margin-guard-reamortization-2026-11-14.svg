  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red202)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：微利 SKU 盲开 5.9% 贴息免息 + 退货在途继续强扣分期款</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 对 8% 毛利 3C 爆款叠加 5% 促销券再开 5.9% MDR 免息分期：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• BNPL 商户贴息扣率 (4.5%–6.5%) 是普通信用卡 (2.2%) 的近 3 倍；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 8% 毛利 - 5% 优惠券 - 5.9% BNPL MDR = 每成交一单直接倒贴净亏 -2.9%！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 多码试穿凑单退货 (Bracketing) 造成不可退还贴息费沉没：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 用户零首付买 4 个尺码退 3 件，不退还的固定费与贴息成本吞噬仅存 1 件的利润。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 退货在途未暂停代扣 &amp; 平摊重算违反 CFPB Regulation Z 新规：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 用户第 5 天寄出 $250 退货，第 14 天仍被强扣 $100 第二期款，引爆监管投诉与拒付。</text>


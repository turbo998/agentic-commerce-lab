  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统档案托管与粉碎四大黑洞 (Legacy Archiving &amp; Shredding Leakage: 25%–50%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 已过 7 年保存期的“僵尸死档”无限期收租 (Post-Retention Zombie Boxes)</text>

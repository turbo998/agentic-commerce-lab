  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">高达 $9.50/箱（相当于近 2 年仓租），倒逼部门经理为了省当期预算继续白交 15 年租。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. $6.50–$8.50/箱天价永久退仓赎回费 (Permanent Withdrawal Hostage Fee)</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 已粉碎销毁“幽灵箱号”继续按月扣费 (Unreconciled CoD Ghost Cartons)</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 100 个装卸货月台“按开关 10 秒走过场保养”漏检锁车钩 (Restraint Skip)</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">季度保养根本不支起升降板清理底坑垃圾，也不测货车防溜锁车钩 (Dok-Lok) 拉力与</text>

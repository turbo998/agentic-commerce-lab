  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. $18 光电眼遮挡/移位谎称换 $2,400 主控板 (Photo-Eye to Board Upcoding)</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">高速门因底部红外光电眼被灰尘糊住或蹭歪停在半空，维修工花 3 分钟擦净拧紧，却</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">拿车里旧废板拍照谎称“更换进口变频主控板总成”，单次骗取 $2,150+$960 工时。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 地面拧螺丝强绑 $280 剪叉车 + $150 焊机 + $125 耗材费 (Ghost Tool Fees)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">即使只是站在仓库地面调试 1.2 米高的月台按钮箱或换锁车钩弹簧（未开动火票），</text>

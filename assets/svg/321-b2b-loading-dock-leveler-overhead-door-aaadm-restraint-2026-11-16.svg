  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 商超/医院自动门无 AAADM 持证年检导致防夹失效伤人 (ANSI A156.10 Breach)</text>

  </text>
  <text x="60" y="565" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    必须绑定：① 独立见证焙烧 LOI 干基净重与锍镍火法试金 ICP-MS 分差 &lt;=0.03 wt% (12ms 拦 403)；② 新剂 CO 脉冲化学吸附分散度 &gt;=65% 且精炼回收率 &gt;=98.5% (15ms 拦 422)；
  </text>
  <text x="60" y="586" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    ③ Web IQ 核查巴塞尔公约危废联单与 LPPM 认证 (290ms 拦 451)，并通过贵金属重量账户 (Metal Pool) 闭环来料加工直接冲抵新剂原料款立省 $56,000 (300ms)。

  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 精炼厂夸大积碳烧失量 (LOI) 暗吞铂/铱盎司</text>
    <text x="58" y="224" fill="#CBD5E1">• 废重整/PEM 催化剂含积碳油污，收走 $340,000</text>
    <text x="58" y="242" fill="#CBD5E1">• 精炼商虚报 LOI = 28% (实为 14%)，侵吞 45 盎司铂金</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 卖废剂买新剂遭“买卖点差 + 15% 关税”双重剥皮</text>
    <text x="58" y="294" fill="#CBD5E1">• 先按 88% 折价贱卖旧剂，再按 100% 现价全款买新剂</text>
    <text x="58" y="312" fill="#CBD5E1">• 未走海绵铂金属池 (Metal Pool) 账面划转，白交巨额溢价</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 缺失 LPPM 冲突矿产审计或巴塞尔危废跨境证</text>
    <text x="58" y="364" fill="#CBD5E1">• 含苯/重金属废催化剂未办巴塞尔公约跨境转移许可</text>

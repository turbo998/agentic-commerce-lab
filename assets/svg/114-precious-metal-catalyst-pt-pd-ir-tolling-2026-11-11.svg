    <text x="823" y="272" fill="#CBD5E1">  延迟：12 ms · 强制开启独立仲裁样 (Umpire)</text>

    <text x="823" y="302" font-weight="700" fill="#FCA5A5">• 新剂 CO 化学吸附分散度不足拦截 (422)</text>
    <text x="823" y="321" fill="#CBD5E1">  延迟：15 ms · 拒收铂晶粒烧结团聚劣质批次</text>

    <text x="823" y="351" font-weight="700" fill="#FDE68A">• Web IQ 海绵铂金属池无损划转套利 (409)</text>
    <text x="823" y="370" fill="#CBD5E1">  延迟：300 ms · 节省：$56,000.00 (16.5% 降本)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  133 / 133 单元测试 100% 通过 (CSP 自包含)</text>
  </g>
  <rect x="823" y="442" width="319" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="982" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">

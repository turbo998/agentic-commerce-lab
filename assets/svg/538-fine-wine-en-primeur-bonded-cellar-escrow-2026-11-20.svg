  <text x="835" y="556" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Octavian / London City Bond (LCB): Segregated IB</text>
  <text x="835" y="574" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Prooftag / Chai Vault: Bubble/NFC provenance</text>

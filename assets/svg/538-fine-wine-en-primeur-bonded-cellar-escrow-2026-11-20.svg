  <rect x="439" y="202" width="322" height="82" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
  <text x="455" y="226" fill="#fb7185" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 1 · LWIN18 BENCHMARK &amp; DIRECT TITLE</text>
  <text x="455" y="248" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Caps price at &lt;=1.06x Liv-ex Market Price &amp;</text>
  <text x="455" y="268" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12">locks client-named Octavian/LCB sub-account</text>

  <rect x="439" y="298" width="322" height="86" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="455" y="322" fill="#fbbf24" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 2 · OWC SEAL, ULLAGE &amp; 13°C REEFER</text>
  <text x="455" y="344" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Verifies intact OWC, Into-Neck (IN) fill level,</text>
  <text x="455" y="364" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">flat cork &amp; 12-14°C reefer temperature log</text>

  <rect x="439" y="398" width="322" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="455" y="422" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 3 · PROOFTAG NFC &amp; IN-BOND EMCS LOCK</text>
  <text x="455" y="444" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Verifies Château Prooftag/NFC capsule seal &amp;</text>
  <text x="455" y="464" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">HMRC/EU EMCS Bond-to-Bond tax-free transit</text>

  <rect x="439" y="502" width="322" height="102" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="455" y="526" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="700">STEP 4 · BBX EXCHANGE &amp; $15/CASE RENT (409)</text>
  <text x="455" y="548" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Executes In-Bond bids on Liv-ex/BBX (3% fee vs</text>
  <text x="455" y="568" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">25% broker) + flat $15/case/yr LCB storage</text>
  <text x="455" y="588" fill="#fde68a" font-family="Consolas, monospace" font-size="12">Quarterly Savings: $40,000 / $160,000 (25.0%)</text>


  <!-- Header -->
  <text x="56" y="68" fill="#fb7185" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUND 95 · SVG 538 · FINE WINE EN PRIMEUR, BONDED CELLAR &amp; ULLAGE PROVENANCE ESCROW</text>
  <text x="56" y="100" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Fine Wine Agent: Liv-ex LWIN18 Cap, Segregated Bonded Title &amp; Into-Neck Ullage Gate</text>
  <text x="56" y="126" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Liv-ex / Berry Bros. &amp; Rudd (BBX) / Octavian / Sotheby&apos;s Wine — Blocking Omnibus Cellar Commingling, Cooked Corks &amp; 25% Spreads</text>
  <rect x="960" y="54" width="184" height="36" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="1052" y="77" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">25% CELLAR SAVED</text>

  <!-- Left Panel: 3 Commercial Traps -->
  <rect x="52" y="150" width="345" height="475" rx="14" fill="#111827" stroke="#ef4444" stroke-width="1.2"/>
  <text x="72" y="182" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">1. Fine Wine &amp; En Primeur Traps</text>

  <rect x="70" y="200" width="309" height="126" rx="10" fill="#1f2937" stroke="#dc2626" stroke-width="1"/>
  <text x="84" y="224" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap A: Omnibus Cellar &amp; 25% Spread</text>
  <text x="84" y="246" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Broker holds client cases in commingled</text>
  <text x="84" y="266" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  omnibus account (seized on bankruptcy)</text>
  <text x="84" y="286" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 25% markup over Liv-ex + 2.5%/yr AUM fee</text>
  <text x="84" y="306" fill="#fca5a5" font-family="Consolas, monospace" font-size="11">Guard: HTTP 403 SEGREGATED_TITLE_AND_LIVEX_CAP</text>

  <rect x="70" y="340" width="309" height="126" rx="10" fill="#1f2937" stroke="#f97316" stroke-width="1"/>
  <text x="84" y="364" fill="#fed7aa" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap B: Loose Bottles, Ullage &amp; Cooked Wine</text>
  <text x="84" y="386" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Delivers loose bottles instead of sealed OWC</text>
  <text x="84" y="406" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  (-18% value) or mid-shoulder oxidized ullage</text>
  <text x="84" y="426" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Protruding corks from &gt;28°C uncooled shipping</text>
  <text x="84" y="446" fill="#fdba74" font-family="Consolas, monospace" font-size="11">Guard: HTTP 422 OWC_SEAL_AND_INTO_NECK_ULLAGE</text>

  <rect x="70" y="480" width="309" height="124" rx="10" fill="#1f2937" stroke="#a855f7" stroke-width="1"/>
  <text x="84" y="504" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700"> Trap C: Fake Prooftag &amp; Broken Bond VAT</text>
  <text x="84" y="526" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Counterfeit Burgundy fails Château Prooftag</text>
  <text x="84" y="546" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  bubble/NFC check; non-bonded van breaks IB</text>
  <text x="84" y="566" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  status triggering 20% VAT + Excise penalty</text>
  <text x="84" y="586" fill="#d8b4fe" font-family="Consolas, monospace" font-size="11">Guard: HTTP 451 WEBIQ_PROOFTAG_AND_BOND_HOLD</text>


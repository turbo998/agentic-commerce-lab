  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 导购 Agent 或诱导性 UI 顺手勾选“确认配置锁定不可退大定”</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 引发大规模定金不退维权群诉与信用卡 13.7 条款拒付!</text>


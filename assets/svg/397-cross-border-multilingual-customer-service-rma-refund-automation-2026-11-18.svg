  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 工单夹带提示词注入诱导 Agent 全额秒退且免寄回</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 高价商品仅凭填写假单号即秒退，遭空包/改址 (FTID) 诈骗</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 导致不可逆资金被批量盗划与恶意空包套现!</text>


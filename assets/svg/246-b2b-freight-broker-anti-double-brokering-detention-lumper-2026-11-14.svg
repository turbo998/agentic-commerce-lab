  <text x="670" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#A7F3D0">Physical Tractor-to-MC Pinning, EDI 214 Geofence Detention Gate &amp; Drop-and-Hook Routing</text>

  <rect x="668" y="200" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>
  <text x="684" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">1. 道闸车门 DOT 喷码 + 车载 ELD-VIN 与中标 MC 强绑定 (11ms → 403)</text>
  <text x="684" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 货车进场时强制比对中标承运商 MC/DOT、车载 ELD 17位车架号与道闸 AI 相机识别的车门 DOT 号。</text>
  <text x="684" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 任何转包给第三方车头或变色龙套牌车队的行为，11ms 硬拦截并锁定真车主直付 (HTTP 403)！</text>

  <rect x="668" y="282" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>
  <text x="684" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">2. EDI 214 200m 地理围栏准点锁与数字卸货核销码 (14ms → 422)</text>
  <text x="684" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 唯有 ELD 进入仓库 200m 围栏时刻 &lt;= 预约窗口，方可在 2h 免堆期后计提压车费；迟到者自动归零。</text>
  <text x="684" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 卸货费强制通过 Relay / Capstone 数字核销码直付仓库，14ms 拒收一切手写现金白条 (HTTP 422)！</text>

  <rect x="668" y="364" width="564" height="72" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>
  <text x="684" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">3. Microsoft Web IQ 联查 FMCSA BMC-84 保函与货险除外条款 (280ms → 451)</text>
  <text x="684" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• /v3/browse 280ms 穿透核验 FMCSA SAFER 运营资质与 $75,000 BMC-84 法定信托保函活性。</text>
  <text x="684" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#A7F3D0">• 自动拆解货险 COI 批单，检出“无人看管拒赔”或高价值标的不保条款立即挂起 (HTTP 451)！</text>

  <rect x="668" y="446" width="564" height="68" rx="10" fill="#062825" stroke="#34D399" stroke-width="1"/>
  <text x="684" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#6EE7B7">4. Drop-and-Hook 预装甩挂池免排队与零压车费立省 $45,600 (245ms → 409)</text>
  <text x="684" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 将高频干线升级为预装甩挂池 (Drop-and-Hook)，车头进场摘挂即走，月台周转缩至 20 分钟。</text>
  <text x="684" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FDE68A">• 在 $570,000.00 整车货运批次上单批防损/立省 $45,600.00 (净结算 $524,400.00 · HTTP 409)！</text>


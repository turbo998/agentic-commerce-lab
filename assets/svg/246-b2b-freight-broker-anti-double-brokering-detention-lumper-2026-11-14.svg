  <text x="170" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FEF3C7" text-anchor="middle">2026-11-14 · ROUND 244 · FREIGHT BROKERAGE</text>
  <text x="310" y="57" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">B2B 干线整车货运 (FTL)：防二次转包 Double-Brokering、月台压车费与数字卸货单架构</text>
  <text x="46" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#CBD5E1">ELD-VIN to MC/DOT Carrier Identity Lock, EDI 214 Geofence Detention &amp; Digital Lumper vs. 49 USC 13706 Double-Pay &amp; Lumper Fraud</text>
  <text x="46" y="106" font-family="Consolas, monospace" font-size="12" fill="#FBBF24">Mandate Token: b2b_freight_broker_anti_double_brokering_detention_lumper_mandate_2026_11_14 · Batch: $570,000.00 · Net Optimized: $524,400.00 (-$45,600.00)</text>

  <!-- Left Column: Legacy Freight Brokerage Traps -->
  <rect x="28" y="132" width="596" height="398" rx="14" fill="url(#red-card)" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5">❌ 传统“见签收单 POD 即打款 + 白条报销”（四大双倍赔付与贪腐黑洞）</text>
  <text x="50" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#FECACA">Why POD-Only Quick-Pay &amp; Paper Accessorial Slips Trigger Double-Payment Lawsuits &amp; Kickbacks</text>

  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. 非法二次转包 (Double-Brokering) 骗走运费致货主被迫“一单付两次”</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 空壳骗子盗用 MC 号接单后转包给不知情的真卡车司机，拿真司机的 POD 骗走货主 Quick-Pay 跑路。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 未收到钱的真司机依据《49 U.S.C. § 13706》起诉货主/收货人，法院判令货主再付一遍全额运费！</text>

  <rect x="48" y="282" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">2. 司机自身迟到错过预约窗口却手改签到表索要 $100/h 压车费</text>
  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 司机比预约时间晚到 90 分钟沦为排队补位 (Work-In)，卸完货后涂改纸质登记表谎称准点到达。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 无车载 ELD 地理围栏时间戳核验，货主每车白白替司机的迟到买单 $400–$600 冤枉压车费！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 商超冷库手写现金卸货费 (Lumper Fee) 虚开 3 倍分赃</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 传统报销允许上传手写纸质收据；不良司机花 $150 请人卸货，却开具 $480 假白条向 AI 请款。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 每年因虚假装卸白条与托盘重打费 (Restacking) 流失数百万美元隐性物流成本！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">4. 漏检 FMCSA $75k 保函断保与货险“服务区无人看管拒赔”大坑</text>
  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 未实时联查经纪人 BMC-84 信托保函活性，且忽略承运商货险中的“夜间无人看管整车被盗免责条款”。</text>
  <text x="64" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 一旦高价值算力服务器或铜材在高速服务区被盗，保险公司一分不赔！</text>

  <!-- Right Column: ELD-VIN Lock + Geofence + Digital Lumper Architecture -->

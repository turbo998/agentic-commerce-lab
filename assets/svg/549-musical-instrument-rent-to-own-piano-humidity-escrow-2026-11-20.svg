  <text x="54" y="66" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUND 106 · RETAIL RENT-TO-OWN &amp; SPECIALTY LOGISTICS · SVG 549</text>

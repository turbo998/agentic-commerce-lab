  <text x="72" y="258" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">   payments into non-equity 'Liability</text>
  <text x="72" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  Waiver / Maintenance Fees' or 2.2x MSRP</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg129" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041E19"/>
      <stop offset="50%" stop-color="#06392F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent129" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cardBg129" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A3B32"/>
      <stop offset="100%" stop-color="#051B16"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg129)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent129)"/>

  <!-- Header -->
  <rect x="40" y="24" width="390" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="235" y="43" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#D1FAE5" text-anchor="middle">
    ROUND 127 · HIGH-SPEED AI SERVER PCB &amp; CCL ESCROW
  </text>
  <text x="40" y="84" font-family="Segoe UI, Ubuntu, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">
    高速 AI 服务器多层 PCB 与覆铜板交割、TDR 阻抗 (±5%) 与背钻残桩/防 CAF 智能托管
  </text>
  <text x="40" y="111" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" fill="#CBD5E1">
    Coupon TDR Impedance (±5%), X-Ray Backdrill Stub (&lt;=6 mil) &amp; Ion-Chromatography Anti-CAF vs. 112G/224G SerDes Eye-Closure Overbilling
  </text>

  <!-- Left Card: Legacy Continuity-Only & CCL Downgrade Failure -->
  <rect x="40" y="132" width="355" height="360" rx="12" fill="url(#cardBg129)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="148" width="323" height="32" rx="6" fill="#450A0A"/>
  <text x="217" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">
    ❌ 传统仅看飞针通断盲付踩坑
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 背钻残桩过长 (&gt;14 mil) 与阻抗失配闭死眼图</text>
    <text x="58" y="224" fill="#CBD5E1">• 直流飞针测试 100% 导通，但 112G PAM4 谐振反射严重</text>
    <text x="58" y="242" fill="#CBD5E1">• 贴完 8 颗 GPU 后 PCIe Gen6 链路掉线，报废 $230,000</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 偷换普通玻纤布致玻纤编织效应 (Fiber Weave Skew)</text>
    <text x="58" y="294" fill="#CBD5E1">• 用普通 E-glass 冒充扁平低介电 NE-glass / Megatron-8</text>
    <text x="58" y="312" fill="#CBD5E1">• 或回流焊 260°C 爆板分层、孔铜厚度 &lt; 25 μm 断裂</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 药水溴/氯离子残留致导电阳极丝 (CAF) 短路</text>
    <text x="58" y="364" fill="#CBD5E1">• 离子污染度 &gt; 1.56 μg/cm² NaCl，机房通电 3 个月铜丝生长</text>
    <text x="58" y="382" fill="#CBD5E1">• 高压供电层与信号过孔微短路起火烧毁整台 AI 节点</text>
  </g>
  <rect x="58" y="442" width="319" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="217" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">
    风险敞口：$230,000 OAM/UBB 高速母板报废
  </text>

  <!-- Center Card: 4-Layer High-Speed PCB Mandate Engine -->
  <rect x="415" y="132" width="370" height="360" rx="12" fill="url(#cardBg129)" stroke="#10B981" stroke-width="2"/>
  <rect x="431" y="148" width="338" height="32" rx="6" fill="#064E3B"/>
  <text x="600" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#D1FAE5" text-anchor="middle">
    ⚡ TDR 阻抗 + X-Ray 背钻残桩 + 离子色谱托管
  </text>

  <!-- Step 1 -->
  <rect x="433" y="192" width="334" height="58" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="445" y="211" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">
    Gate 1 · TDR 阻抗 (±5%) 与背钻残桩 (&lt;=6 mil · 11ms)
  </text>
  <text x="445" y="229" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" fill="#CBD5E1">
    差分阻抗越界、插损 S21 超标或 X-Ray 背钻残桩 &gt; 6 mil →
  </text>
  <text x="445" y="244" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#F87171">
    HTTP 403 TDR_IMPEDANCE_MISMATCH_OR_BACKDRILL_STUB_BLOCKED
  </text>

  <!-- Step 2 -->
  <rect x="433" y="258" width="334" height="58" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="445" y="277" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#FDE047">
    Gate 2 · 6次 288°C 热应力与孔铜 (&gt;=25 μm · 14ms)
  </text>
  <text x="445" y="295" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" fill="#CBD5E1">
    IPC-6012 Class 3 金相切片检出孔壁空洞、微裂纹或爆板 →
  </text>
  <text x="445" y="310" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#F87171">
    HTTP 422 THERMAL_STRESS_DELAMINATION_OR_PLATING_VOID_BLOCKED
  </text>

  <!-- Step 3 -->
  <rect x="433" y="324" width="334" height="58" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="445" y="343" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#7DD3FC">
    Gate 3 · Web IQ UL 94V-0 覆铜板溯源与防 CAF (285ms)
  </text>
  <text x="445" y="361" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" fill="#CBD5E1">
    偷换普通覆铜板或离子色谱检出 Br-/Cl- 超标诱发 CAF →
  </text>
  <text x="445" y="376" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11" font-weight="700" fill="#F87171">
    HTTP 451 CCL_RESIN_SUBSTITUTION_OR_IONIC_CAF_CONTAMINATION_HOLD
  </text>

  <!-- Step 4 -->
  <rect x="433" y="390" width="334" height="86" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  <text x="445" y="410" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">
    Gate 4 · Web IQ 混压叠层优化 + 蚀刻废液提铜 (295ms)
  </text>
  <text x="445" y="428" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" fill="#D1FAE5">
    非高速电源层混合压合 (Hybrid Stackup) + 酸性蚀刻液电解再生铜 →
  </text>
  <text x="445" y="446" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" font-weight="700" fill="#FDE68A">
    HTTP 409 Confirm · 立省 $36,800 ($193,200 净付)
  </text>
  <text x="445" y="465" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11.5" font-weight="700" fill="#A7F3D0">
    ✅ 200 OK · 19ms 自动清算 $230,000.00
  </text>

  <!-- Right Card: Quantitative Benchmark & Architecture Wins -->
  <rect x="805" y="132" width="355" height="360" rx="12" fill="url(#cardBg129)" stroke="#10B981" stroke-width="1.5"/>
  <rect x="821" y="148" width="323" height="32" rx="6" fill="#064E3B"/>
  <text x="982" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0" text-anchor="middle">
    📊 定量实测基准与架构师收益 (Round 127)
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="823" y="204" font-weight="700" fill="#6EE7B7">• 阻抗 85Ω±3% 与残桩 3.8mil 放款 (200)</text>
    <text x="823" y="223" fill="#CBD5E1">  延迟：19 ms · 放款：$230,000.00 (Class 3 零分层)</text>

    <text x="823" y="253" font-weight="700" fill="#FCA5A5">• TDR 阻抗越界或背钻残桩 &gt;6mil 拦截 (403)</text>
    <text x="823" y="272" fill="#CBD5E1">  延迟：11 ms · 拦截虚高款：$230,000.00</text>

    <text x="823" y="302" font-weight="700" fill="#FCA5A5">• 288°C 热冲击爆板或孔铜空洞拦截 (422)</text>
    <text x="823" y="321" fill="#CBD5E1">  延迟：14 ms · 杜绝 SMT 贴装万元 GPU 后整板报废</text>

    <text x="823" y="351" font-weight="700" fill="#FDE68A">• Web IQ 高低速混压叠层与蚀刻提铜 (409)</text>
    <text x="823" y="370" fill="#CBD5E1">  延迟：295 ms · 节省：$36,800.00 (16.0% 降本)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  148 / 148 单元测试 100% 通过 (CSP 自包含)</text>
  </g>
  <rect x="823" y="442" width="319" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="982" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">
    守住 112G/224G AI 算力母板信号完整性与零短路红线
  </text>

  <!-- Footer Banner -->
  <rect x="40" y="512" width="1120" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="541" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700" fill="#6EE7B7">
    🏛️ 架构师选型铁律 (Takeaway): 绝对不要仅凭“直流飞针测试通断合格”盲付 24–40 层 AI 服务器 UBB/OAM 高速 PCB 货款！
  </text>
  <text x="60" y="565" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    必须绑定：① 板边测试条 TDR 阻抗 ±5%、S21 插损与 X-Ray 背钻残桩 &lt;=6 mil (11ms 拦 403)；② IPC-6012 Class 3 288°C 热应力与孔铜 &gt;=25μm (14ms 拦 422)；
  </text>
  <text x="60" y="586" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    ③ Web IQ 核查覆铜板原厂批号 (Megatron/Tachyon) 与离子色谱防 CAF 洁净度 (285ms 拦 451)，并启用高低速混压叠层与蚀刻提铜立省 $36,800 (295ms)。
  </text>
</svg>

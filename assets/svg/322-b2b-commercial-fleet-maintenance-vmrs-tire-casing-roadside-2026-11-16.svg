  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 15 分钟道路救援收“$350 出车费 + 里程费 + 4h 最低双倍工时” ($1,270)</text>

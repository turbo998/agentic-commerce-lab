  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">逐项对齐 9 位 VMRS 编码与原厂标准工时表 (SRT) 并自动扣除重叠拆装工时；道路</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">救援里程绑定门店至抛锚点 GPS 真实距离，严禁出车费+4h最低工时三重叠加。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 J1939 诊断树与 Reman Core 押金 (275ms → HTTP 451)</text>

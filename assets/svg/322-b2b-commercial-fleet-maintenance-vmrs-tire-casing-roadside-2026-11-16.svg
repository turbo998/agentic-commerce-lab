  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统重卡外修与高速道路救援四大黑洞 (Legacy Fleet Repair Leakage: 25%–48%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 高速换胎按 $680 散客高价宰客 + 私吞 $120 优质可翻新旧胎壳</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">绕过车队 $390 全国大客户统签价 (National Account) 按 $680 门市价卖胎；将只扎了</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">一颗钉子、可翻新 2 次的米其林/固特异好胎壳 ($120 Casing Credit) 私吞倒卖。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 0.8h 换刹车气室虚报 2.5h + 同部位拆装重叠工时双收 (Labor Padding)</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">标准定额仅 0.8 小时的换气室被按 2.5 小时计费；换水泵已含拆风扇皮带工时，却又</text>

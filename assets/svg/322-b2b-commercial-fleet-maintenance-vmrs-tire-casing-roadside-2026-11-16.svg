  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">强制抵扣 $110–$140 胎体残值 (Casing Credit)，11ms 硬拦截散客高价与私吞好胎壳。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>

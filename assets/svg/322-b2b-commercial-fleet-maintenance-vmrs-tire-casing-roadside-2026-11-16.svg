  <text x="648" y="478" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">自动将虚报工时回调至 1.0x SRT、扣除 $120 胎体残值与 $650 旧件 Core 押金：</text>

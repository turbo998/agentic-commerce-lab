  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. $380 DPF 高温吹灰再生被忽悠花 $4,800 换新 + 侵吞 $650 旧件押金</text>

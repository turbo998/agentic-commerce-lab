  <text x="220" y="504" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">USDA EWR 电子仓单零质押过户 + PACA ≤30天账期 + NTEP 水分干缩精确</text>
  <text x="650" y="504" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">200 · Act automatically</text>

  <rect x="36" y="415" width="1128" height="236" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="56" y="444" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">📊 定量实测矩阵：B2B 大宗农资与生鲜收储结算批次 ($820,000.00) 5 组边界验证 (`evaluate_b2b_agritech_grain_ewr_paca_policy`)</text>


  <rect width="1200" height="675" fill="url(#bg222)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#grn222)"/>
  <text x="159" y="57" fill="#064E3B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 220 · AGRITECH EWR &amp; PACA</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">B2B 农资大宗与生鲜供应链 USWA 电子仓单 (EWR)、水分干缩折算与 PACA 信托架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">NTEP 水分仪 1.4%/点干缩扣重 + PACA ≤30天超级优先权令牌 (`b2b_agritech_grain_ewr_moisture_dockage_paca_trust_mandate_...`) vs 买水粮亏空</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red222)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：19.5% 湿粮按毛重打款 + 纸质白条仓单 + Net 45 丧失 PACA 优先权</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 生鲜账期放宽至 Net 45 (&gt;30天) 依法丧失 PACA 破产超级优先权：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 根据 7 CFR § 46.46(e)(2)，一旦约定账期超过 30 天，7 U.S.C. § 499e(c) 法定信托</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 当场自动作废！买方破产时无法排在抵押银行之前拿回货款；纸质仓单更易遭遇一仓多押。</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 19.5% 湿玉米不扣水分干缩 (Shrink) 直接按地磅毛重全款结算：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 相比 15.5% 标准干度超标 4%，每批白给 8%+“买水冤枉钱”并倒贴天然气烘干费。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 未排查州级 EFS 农资银行留置权，被迫替破产农场主二次还贷：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 买到背负银行种子化肥贷款留置权的作物，根据联邦食品安全法面临双重付款追索。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms No EWR / PACA &gt;30d) | HTTP 422 (14ms Wet Shrink)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#grn222)"/>
  <text x="890" y="161" fill="#064E3B" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：USDA EWR 电子仓单锁 + NTEP 水分干缩引擎 + PACA ≤30d 网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. USDA USWA 中央电子仓单 (EWR) 原子过户 + PACA ≤30 天账期硬锁：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 强制确认中央 EWR 登记处 Lien_Free == true 唯一持有人变更，根绝一粮多卖；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 生鲜账期硬锁 ≤30 天并嵌入 § 499e(c) 信托声明，100% 凌驾于抵押银行优先受偿！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. NTEP 近红外水分仪直连 (1.4%/点干缩 + 烘干费) 与 &lt;20 ppb 毒素红线：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 仅按折算后标准净干重 (Net Dry Bushels) 结算，14ms 拦截湿粮虚报与黄曲霉毒素超标。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms PACA 牌照与干缩扣减增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动剥离超标水分干缩溢价并直连 EWR 仓单交割，单批立省 $65,600.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $820k EWR/PACA) | HTTP 409 ($65.6k Shrink Saved)</text>


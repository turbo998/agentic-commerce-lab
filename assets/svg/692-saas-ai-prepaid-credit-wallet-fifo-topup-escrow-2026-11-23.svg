  <text x="442" y="200" class="mono" fill="#fcd34d">`- &gt; Promo_Grant -&gt; Rollover -&gt; Paid_Commit)`!</text>
  <text x="432" y="223" class="body-txt">• Pre-Flight `max_tokens` Reservation Lock:</text>

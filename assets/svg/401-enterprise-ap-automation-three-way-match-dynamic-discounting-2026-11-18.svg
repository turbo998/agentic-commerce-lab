  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 黑客入侵供应商邮箱发来“收款银行账号变更”新发票</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 初级 Agent 直接读取发票 OCR 账号或无人类确认调 send_money</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 导致百万货款直接汇入洗钱账户无法追回!</text>


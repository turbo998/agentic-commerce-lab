  <text x="68" y="590" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">✅ Good Fit: 企业财务共享中心 (SSC) AP 自动审单、供应链动态贴现 (2/10 Net 30)、跨国多币种供应商对账与司库安全排款</text>

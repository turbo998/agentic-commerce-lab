  <!-- Header -->
  <text x="52" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · ROUND 399 · ENTERPRISE B2B AP AUTOMATION, 3-WAY MATCH &amp; DYNAMIC DISCOUNTING AGENT</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">企业 B2B 应付账款 (AP) 自动化、三单匹配与早付现金折扣 (2/10 Net 30) Agent：防 BEC 诈骗与司库门禁</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">PO-GRN-Invoice 行项公差对齐 · 收款账号锁死 Vendor Master 金库 · 捕捉 2/10 Net 30 (37.2% 年化) · 立省 $40,000.00 (20.0%)</text>

  <!-- Left Column: AP & Treasury Pitfalls -->

  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• PO 订 1,000 件、仓库 GRN 实收合格仅 980 件 (20 件破损)</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 供应商仍按 1,000 件开票，或加空格重复提交同一发票请款</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 为未收货/破损拒收品白白买单并发生重复打款!</text>

  <rect x="64" y="398" width="320" height="106" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>

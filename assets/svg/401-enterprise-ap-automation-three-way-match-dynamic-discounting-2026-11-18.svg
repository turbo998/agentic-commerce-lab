  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 司库打款密钥休眠 &gt;180 天未锁定存在静默越权风险</text>
  <text x="78" y="480" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 传统 AP 应付账款基线：$200,000 / 批次（无折扣+溢付）</text>


  <text x="68" y="566" fill="#38BDF8" font-family="Consolas, monospace" font-size="13" font-weight="700">Mandate Prefix: enterprise_erp_crm_shopify_sap_d365_idempotent_saga_mandate_*</text>
  <text x="68" y="590" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">✅ Good Fit: 全渠道零售订单中心 (OMS)、B2B 经销商自助下单 Agent、跨 Shopify / D365 / SAP S/4HANA / Salesforce 交易协同</text>
  <text x="68" y="614" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">⛔ Not For: 允许大模型自传随机幂等键或在 4,000ms 支付回调内同步阻塞调用慢速传统 ERP 的架构 · Provenance: official_doc_snapshot + deterministic_offline_simulation</text>

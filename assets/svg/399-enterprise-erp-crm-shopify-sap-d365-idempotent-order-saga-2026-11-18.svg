  <text x="850" y="222" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Shopify / D365：180s 软锁微服务 + ETag 乐观锁</text>
  <text x="850" y="242" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• SAP S/4HANA：影子信控缓存 + Outbox 异步落库</text>
  <text x="850" y="262" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• Salesforce：Web IQ 卸载 90% 读流量保 API 配额</text>

  <rect x="836" y="294" width="300" height="104" rx="8" fill="#071715" stroke="#065F46" stroke-width="1"/>
  <text x="850" y="316" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">⚡ 分布式事务可靠性指标</text>
  <text x="850" y="338" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 超时重试双倍扣款发生率：0.0% (SHA-256 锁)</text>
  <text x="850" y="358" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• ERP 拒单 Void 预授权通道费损失：$0.00</text>
  <text x="850" y="378" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• finalize_checkout 热路径响应：180ms (&lt;&lt; 4,000ms)</text>

  <rect x="836" y="410" width="300" height="94" rx="8" fill="#071715" stroke="#10B981" stroke-width="1.5"/>
  <text x="850" y="434" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">💰 季度防重扣与免退费磨损净节省</text>
  <text x="850" y="460" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">立省 $42,000.00 (-20.0%)</text>
  <text x="850" y="484" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12">原损耗基线 $210,000.00 → 优化净值 $168,000.00</text>

  <!-- Footer Mandate Strip -->

  <!-- Header -->
  <text x="52" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · ROUND 397 · ENTERPRISE ERP/CRM/COMMERCE (SHOPIFY / D365 / SAP / SALESFORCE) SAGA ARCHITECTURE</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">对接企业 ERP/CRM/电商后台 (Shopify/D365/SAP/Salesforce) 幂等下单、防重扣款与 Saga 异常补偿架构</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">网关派生 SHA-256 幂等锁 · Transactional Outbox 跑赢 4,000ms Webhook · 2-Phase manual 预授权零损回滚 · 立省 $42,000.00 (20.0%)</text>

  <!-- Left Column: Enterprise Integration Pitfalls -->
  <rect x="48" y="132" width="352" height="390" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="162" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统 Agent 直连 ERP/支付三大灾难</text>

  <rect x="64" y="178" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. LLM 自造随机 UUID 重试致双倍扣款与重复发运</text>
  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• SAP/支付响应慢触发超时，LLM 换个新随机 ID 自动重试</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 先直接实扣 $12,000 后 SAP 信控拒单，走退款白亏 2.9% 手续费</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 造成客户被扣两次钱与仓库发两份货的严重事故!</text>

  <rect x="64" y="288" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="310" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 重试改参漂移 (Parameter Drift) 与 ETag 失锁</text>
  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 大模型重试时私自修改数量/备注或丢掉折扣行项</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 未校验 Cart ETag 与 ERP 主数据版本造成阴阳价格挂账</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 导致前端实收金额与后端 SAP 应收账款严重不平!</text>

  <rect x="64" y="398" width="320" height="106" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="420" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 4,000ms Webhook 内同步调慢速 SAP 频繁拒付</text>
  <text x="78" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Stripe finalize_checkout 超过 4,000ms 立即 Decline 拒单</text>
  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 同步等待 5 秒 SAP BAPI 或无世代围栏导致僵尸进程写乱账</text>
  <text x="78" y="480" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 传统跨系统掉单与重扣损耗基线：$210,000 / 季度</text>


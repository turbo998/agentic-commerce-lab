  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：GL 科目穿透剔除 CapEx + 5% Cap 锁 + 净销售 Breakpoint 网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. GL 总账明细穿透审计：11ms 剔除未摊销 CapEx + 锁死 ≤5% 涨幅：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 强制解析房东 GL 科目明细，100% 剥离屋顶/地基结构性 CapEx 与招租佣金；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 按起租基准年自动钳位可控公共维护费 (Controllable CAM) 复利涨幅 ≤ 5.0%！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 锁死 Total GLA 物理分母守恒 + 抽成租金剥离税金与退货：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 从 POS 毛流水自动扣除销项税、BORIS 退货与储值卡浮存后再计算 Natural Breakpoint。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms BOMA 核验与审计节流：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 自动核减违规摊派 CapEx 与虚高营业额抽成，单批立省 $47,200.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>

  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 228 · CRE NNN CAM &amp; RENT</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">B2B 商业地产三净租赁 (NNN) CAM 清算、CapEx 剔除与商场抽成租金架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">资本性支出 CapEx 穿透剔除 + 可控 CAM ≤5% 封顶 + 自然平衡点令牌 (`b2b_cre_triple_net_cam_reconciliation_percentage_rent_mandate_...`)</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red230)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：房东换屋顶 CapEx 塞进物业费 + 分母缩水 + 含税退货算进抽成</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 房东将 $18万换屋顶/修地基 CapEx 混入当年日常维修费 (OpEx)：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 20 年寿命的结构性大修未按期折旧，一次性全额摊派给租户，或突破 ≤5% 涨幅封顶；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 只看 PDF 汇总金额的 AP 智能体照单全付，每家门店每年白白多交数万美元冤枉钱！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 抽逃主力店面积缩小 GLA 分母 + 抽成租金误算消费税与退货：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 分摊比例从 5.0% 被人为放大至 8.3%；把 8.8% 销项税与退货算进营业额白交 6% 抽成。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 虚增 BOMA 公摊系数或利用 95% Gross-Up 超收 &gt;100% 实际成本：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反 BOMA Z65.1/Z65.5 面积测量标准，将公摊水电变成房东的隐性利润中心。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

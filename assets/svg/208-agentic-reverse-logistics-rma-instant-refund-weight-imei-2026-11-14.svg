  <text x="875" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">LATENCY</text>
  <text x="965" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">NET IMPACT</text>

  <!-- Row 1 -->
  <text x="66" y="504" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">rma_commit_ok</text>
  <text x="220" y="504" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">分拨中心 DWS 重量偏差 ≤5% + 月台坐标锁死 + 出入库 IMEI 匹配</text>
  <text x="650" y="504" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">200 · Act automatically</text>
  <text x="875" y="504" fill="#E2E8F0" font-family="monospace" font-size="12">10ms</text>
  <text x="965" y="504" fill="#34D399" font-family="monospace" font-size="12" font-weight="700">$580,000.00 Settled</text>

  <!-- Row 2 -->
  <text x="66" y="532" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">rma_ftd_403</text>
  <text x="220" y="532" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">FTID 改址寄 20g 空信封至同邮编餐厅或干冰挥发导致重量失配</text>
  <text x="650" y="532" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">403 · Send to a human</text>
  <text x="875" y="532" fill="#E2E8F0" font-family="monospace" font-size="12">11ms</text>
  <text x="965" y="532" fill="#F87171" font-family="monospace" font-size="12" font-weight="700">FTID Scam Blocked</text>

  <!-- Row 3 -->
  <text x="66" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">rma_swp_422</text>
  <text x="220" y="560" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">入库扫描检出 inbound_imei != outbound_imei (买新退旧/石头掉包)</text>
  <text x="650" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">422 · Send to a human</text>
  <text x="875" y="560" fill="#E2E8F0" font-family="monospace" font-size="12">14ms</text>
  <text x="965" y="560" fill="#FB923C" font-family="monospace" font-size="12" font-weight="700">Serial Swap Blocked</text>

  <!-- Row 4 -->
  <text x="66" y="588" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">rma_bat_451</text>
  <text x="220" y="588" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Web IQ /v3/browse 检出含锂电池退件缺 UN3481 标识或违反消法折旧</text>
  <text x="650" y="588" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">451 · Send to a human</text>
  <text x="875" y="588" fill="#E2E8F0" font-family="monospace" font-size="12">280ms</text>
  <text x="965" y="588" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700">Hazmat/Law Hold</text>

  <!-- Row 5 -->
  <text x="66" y="616" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">rma_sav_409</text>
  <text x="220" y="616" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Web IQ 启用即时换货储值金挽留 35% 退货营收并阻断 FTID 掉包损失</text>
  <text x="650" y="616" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">409 · Confirm</text>
  <text x="875" y="616" fill="#E2E8F0" font-family="monospace" font-size="12">245ms</text>
  <text x="965" y="616" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="700">Saves $46,400.00</text>

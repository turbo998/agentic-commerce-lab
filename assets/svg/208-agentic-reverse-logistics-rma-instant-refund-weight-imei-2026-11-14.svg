<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg208" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="emerald208" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="red208" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg208)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#emerald208)"/>
  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 206 · RMA &amp; ANTI-FTID GATE</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体售后逆向物流 (RMA) 与防“掉包/改址空包 (Box-of-Rocks &amp; FTID)”架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">分拨中心 DWS 称重 (±5%) + 出入库 IMEI/SN 哈希闭环 + 担保极速换令牌 (`agentic_reverse_logistics_rma_instant_refund_mandate_...`) vs 盲目揽收秒退被骗</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red208)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：仅看快递状态码盲目秒退现金 + 遭 FTID 空信封与石头掉包洗劫</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 虚假运单改址欺诈 (FTID)：寄 20g 空信封去隔壁快餐店骗退：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 黑产篡改退货面单可视地址至同邮编餐厅，快递员投递空信封触发 DELIVERED；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 只看状态码的 RMA Agent 自动退还 $1,500 现金，而仓库根本没收到包裹！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. “石头/干冰充重量”与“买新退旧掉包 (IMEI Swap)”：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 快递柜扫码瞬间无担保退现，5天后仓库拆包发现是石头或报废旧显卡，虚拟卡已销户。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 100% 现金退流失复购 &amp; 含锂电池退件违反 UN3481 航空安全：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 未引导换货导致 100% 营收流失；破损锂电池退件未走陆运触发高额航空罚款。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms FTID/Weight) | HTTP 422 (14ms IMEI/Serial Swap)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#emerald208)"/>
  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：分拨中心 DWS 称重 (±5%) + 出入库 IMEI 闭环 + 极速换网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 分拨中心激光称重 (Hub DWS ±5%) + 退货仓月台 Geohash 锁：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 强制比对分拨中心电子秤实测重量与出库毛重 (偏差 &lt;=5%)，11ms 秒杀 FTID 空信封；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 锁死面单地址不可修改并核验仓库月台专属数字签名。</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 出库-入库唯一序列号 (IMEI / SN / NFC) 1:1 密码学比对：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 入库扫码强制断言 inbound_imei_hash == outbound_imei_hash，100% 阻断买新退旧。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 消法核验与 +5% 极速换货挽留：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 拦截空包掉包并把 35% 退货转化为换货留存，单批挽回/止损 $46,400.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $580k RMA) | HTTP 409 ($46.4k Fraud &amp; Churn Saved)</text>

  <!-- Bottom Quantitative Benchmark Table -->
  <rect x="36" y="415" width="1128" height="236" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="56" y="444" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">📊 定量实测矩阵：智能体售后逆向物流批次 ($580,000.00) 5 组边界验证 (`evaluate_agentic_reverse_logistics_rma_policy`)</text>

  <rect x="52" y="458" width="1096" height="28" rx="4" fill="#0F172A"/>
  <text x="66" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">SCENARIO ID</text>
  <text x="220" y="476" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="700">HUB DWS ±5% WEIGHT / DOCK GEOHASH / 1:1 IMEI HASH PARITY</text>

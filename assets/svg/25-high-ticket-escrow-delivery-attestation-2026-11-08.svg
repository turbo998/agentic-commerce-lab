  <text x="68" y="348" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 若仅凭快递单号显示“已签收”就自动放款，无法识别包装盒内是改标假芯片或高仿假表。</text>

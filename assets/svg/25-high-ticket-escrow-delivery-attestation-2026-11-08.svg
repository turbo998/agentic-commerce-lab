  <text x="68" y="236" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 比价 Agent 贪图 $4,100 低价直接向陌生卖家即时打款，骗子发空包裹并提现注销，资金 100% 损失。</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 对年开机 &lt;50h 的闲置仪器盲目续签 $24,000 原厂金牌全包 + 漏做 PM</text>

  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">按美国药典 USP &lt;1058&gt;，更换常规耗材只需 30 分钟模块化波长/压力测试，原厂却</text>

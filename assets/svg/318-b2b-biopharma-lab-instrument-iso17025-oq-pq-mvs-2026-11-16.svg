  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">(OEM Gold)；甚至原厂上年度根本没派人做合同规定的年度 PM 保养也照付续期款。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>

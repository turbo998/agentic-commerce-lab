  <rect width="1200" height="675" fill="url(#bg409)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent409)"/>

  <!-- Header -->
  <text x="52" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-18 · ROUND 407 · E-COMMERCE BNPL (KLARNA / AFFIRM / AFTERPAY) WEBVIEW HANDOVER &amp; MDR MARGIN AGENT</text>
  <text x="52" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="800">商业智能体先买后付 (BNPL: Klarna/Affirm) 结账架构：受控 WebView 移交、禁转 requires_action 与贴息锁</text>
  <text x="52" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">严禁无头自动化点信贷 WebView (403) · 禁向 Agent 转 requires_action (400) · 扣除 6% MDR 毛利锁 · 立省 $32,550.00 (21.0%)</text>

  <!-- Left Column: BNPL Pitfalls -->
  <rect x="48" y="132" width="352" height="390" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="68" y="162" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统 BNPL 接入 Agent 三大合规与亏损坑</text>

  <rect x="64" y="178" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 无头浏览器代点信贷协议 &amp; 误转 requires_action</text>
  <text x="78" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 用 Playwright 替用户自动勾选 Affirm 贷款协议违反信贷法</text>
  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 卖家将 payment_intent.requires_action 抛给后台 Agent</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 直接触发 Stripe 403/400 协议拦截与监管重罚!</text>

  <rect x="64" y="288" width="320" height="98" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="310" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 薄利爆款叠加优惠券再扣 6.5% 免息贴息 MDR 倒亏</text>
  <text x="78" y="330" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 3C 引流款毛利仅 8%，用完 5% 优惠券后再选 12 期 0 息</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• BNPL 机构向商家收 6.5% 贴息费率 (MDR)，每单净亏 3.5%</text>
  <text x="78" y="366" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 或买家误签 24.99% APR 高息分期导致本息超出预算上限!</text>

  <rect x="64" y="398" width="320" height="106" rx="8" fill="#0F172A" stroke="#7F1D1D" stroke-width="1"/>
  <text x="78" y="420" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 无人值守任务卡死 &amp; 部分退货未重算分期尾款</text>
  <text x="78" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 夜间自动代购无用户设备控制权却拉起 BNPL 弹窗卡死</text>
  <text x="78" y="458" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 退回 1 件商品未调减未到期分期本金，引发账单纠纷</text>
  <text x="78" y="480" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 传统 BNPL 贴息磨损与掉单基线：$155,000 / 季度</text>

  <!-- Center Column: 5-Lane Deterministic Gate -->
  <rect x="420" y="132" width="380" height="390" rx="12" fill="#0F2238" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="440" y="162" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">🛡️ BNPL 受控移交与贴息毛利五车道门禁</text>

  <rect x="436" y="178" width="348" height="56" rx="8" fill="#091526" stroke="#EF4444" stroke-width="1.2"/>
  <text x="450" y="200" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · 拦截无头自动化与误转 requires_action (11ms)</text>
  <text x="450" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">严禁 Agent 操作信贷 WebView + 严禁卖家向 Agent 转 requires_action</text>

  <rect x="436" y="244" width="348" height="56" rx="8" fill="#091526" stroke="#F97316" stroke-width="1.2"/>
  <text x="450" y="266" fill="#FB923C" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · 拦截 6% MDR 击穿毛利与高息超标 (14ms)</text>
  <text x="450" y="286" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">校验扣除贴息 MDR 后净毛利 &gt;=15% + 本息总额 &lt;= Mandate 上限</text>

  <rect x="436" y="310" width="348" height="56" rx="8" fill="#091526" stroke="#A855F7" stroke-width="1.2"/>
  <text x="450" y="332" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 · 拦截无设备控制权与漏重算分期 (265ms)</text>
  <text x="450" y="352" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">后台任务自动回退卡 SPT 轨道 + 部分退货强制重算未到期尾款</text>

  <rect x="436" y="376" width="348" height="58" rx="8" fill="#091526" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="450" y="398" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🧑‍⚖️ HTTP 409 · 贴息路由分流与受控 WebView 确认 (230ms)</text>
  <text x="450" y="418" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="11">拦截薄利单倒贴 MDR + 高毛利分期提转化立省 $32,550 → $122,450</text>

  <rect x="436" y="444" width="348" height="60" rx="8" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
  <text x="450" y="468" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · 受控 WebView 人类签名 + 毛利合规 (10ms)</text>
  <text x="450" y="488" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="11">0% APR 合规 + 贴息后净毛利 28.8% + SPT 结算 ($155,000)</text>

  <!-- Right Column: Quantitative Metrics -->
  <rect x="820" y="132" width="332" height="390" rx="12" fill="#0B2420" stroke="#10B981" stroke-width="1.5"/>
  <text x="840" y="162" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">📊 BNPL 结账与毛利第一性原理</text>

  <rect x="836" y="178" width="300" height="104" rx="8" fill="#071715" stroke="#065F46" stroke-width="1"/>
  <text x="850" y="200" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">📱 四重 BNPL 安全与利润锁</text>
  <text x="850" y="222" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 设备控制：仅限受控系统 WebView 人类亲自确认</text>
  <text x="850" y="242" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 贴息护栏：Gross Margin - 券 - MDR &gt;= 15%</text>
  <text x="850" y="262" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 售后重算：部分退货自动冲抵未到期分期尾款</text>

  <rect x="836" y="294" width="300" height="104" rx="8" fill="#071715" stroke="#065F46" stroke-width="1"/>
  <text x="850" y="316" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">⚡ 转化率与合规保障成效</text>
  <text x="850" y="338" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 高客单价 ($200–$3,000) 转化率提升：+28.0%</text>
  <text x="850" y="358" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 贴息叠加优惠券负毛利发生率：0.0%</text>
  <text x="850" y="378" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 无人值守任务 SPT 自动回退成功率：100%</text>

  <rect x="836" y="410" width="300" height="94" rx="8" fill="#071715" stroke="#10B981" stroke-width="1.5"/>
  <text x="850" y="434" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">💰 季度贴息止损与转化净增效</text>
  <text x="850" y="460" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">立省 $32,550.00 (-21.0%)</text>
  <text x="850" y="484" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12">原贴息与掉单损耗 $155,000.00 → 净值 $122,450.00</text>

  <!-- Footer Mandate Strip -->
  <rect x="48" y="538" width="1104" height="96" rx="10" fill="#091326" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="566" fill="#38BDF8" font-family="Consolas, monospace" font-size="13" font-weight="700">Mandate Prefix: ecommerce_bnpl_webview_handover_mdr_margin_mandate_*</text>
  <text x="68" y="590" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">✅ Good Fit: 高客单价家居家电、轻奢服饰、3C 数码与在线教育分期结账 (Stripe Multi-Rail SPT + Klarna / Affirm / Afterpay)</text>
  <text x="68" y="614" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">⛔ Not For: 试图用无头浏览器自动点击信贷协议或在不核算 6% 贴息 MDR 的情况下对薄利引流品全量开放免息分期 · Provenance: official_doc_snapshot + deterministic_offline_simulation</text>
</svg>

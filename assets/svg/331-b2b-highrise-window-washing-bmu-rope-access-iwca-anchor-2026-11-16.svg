  <text x="648" y="206" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 屋顶 64 道锚点 NFC 打卡 + 坐板气压高度计阶梯轨迹锁 (11ms → HTTP 403)</text>

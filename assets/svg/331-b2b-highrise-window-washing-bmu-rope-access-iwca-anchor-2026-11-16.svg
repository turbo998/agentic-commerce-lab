  <text x="648" y="458" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 自动按实测完成下降道数折算并剥离虚假酸洗加价 (240ms → HTTP 409)</text>

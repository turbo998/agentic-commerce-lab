  <text x="64" y="156" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❌ 传统高空玻璃幕墙清洗四大黑洞 (Legacy Facade Cleaning Leakage: 25%–50%)</text>

  <rect x="62" y="184" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="206" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 64 道垂直放绳列跳过 20 道北立面/转角盲区却按 100% 全楼收费</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">地面保安抬头根本看不清 35 楼擦没擦；清洗队只放绳擦了向阳面与低区大堂，跳过</text>
  <text x="76" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">难擦的北面或 4 分钟直接滑降到底不擦窗，却开走 $32,000 全楼完工账单。</text>

  <rect x="62" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="290" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 将 $0.18/平尺普通纯水擦洗谎报为 $6.50/平尺重度水垢酸洗抛光修复</text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">高区幕墙只有普通浮灰，承包商却谎称“遭受酸雨与硅钙矿物结晶腐蚀”，按贵 30 倍的</text>
  <text x="76" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">氧化铈机械打磨与酸洗还原 (Stage-2 Glass Restoration) 加收 $25,000+。</text>

  <rect x="62" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="374" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 用低价室内保洁险冒充高空险（保单暗藏“&gt;30 英尺高空拒赔条款”）</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">承包商提交普通室内保洁工伤险 (Code 9014) 与含 Height Exclusion 的责任险，</text>
  <text x="76" y="412" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">一旦蜘蛛人在 30 楼发生坠落或砸伤路人，保险公司直接拒赔，由大厦业主全额兜底。</text>

  <rect x="62" y="436" width="504" height="74" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="458" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. 屋顶防坠锚栓未做 OSHA 1910.27 5,000 磅拉拔年检致大厦业主负刑责</text>

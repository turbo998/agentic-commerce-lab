  <text x="648" y="310" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">常规季度保洁锁死标准清洗价，14ms 阻断事后擅自追加的硬水斑酸洗还原 (Acid</text>
  <text x="648" y="328" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Restoration) 与纳米疏水镀膜附加费；低区裙房强制路由至地面纯水杆费率。</text>

  <rect x="634" y="352" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="648" y="374" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Web IQ /v3/browse 核查 OSHA 1910.27 锚点证与 SPRAT L3 (275ms → HTTP 451)</text>

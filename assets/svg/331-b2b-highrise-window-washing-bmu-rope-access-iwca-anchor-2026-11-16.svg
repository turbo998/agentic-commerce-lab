  <text x="648" y="496" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">基准批次 $155,000.00 → 自动核减 $23,250.00 (15.0%) → 净付 $131,750.00！</text>


  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mandate: b2b_highrise_window_washing_bmu_rope_access_iwca_i141_anchor_mandate_2026 · 15.0% Savings ($23,250 / Batch)</text>


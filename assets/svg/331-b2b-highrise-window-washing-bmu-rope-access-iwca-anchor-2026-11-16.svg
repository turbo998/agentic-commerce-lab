  <text x="648" y="244" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">到裙房 &gt;=30 分钟的逐层停顿擦洗轨迹，11ms 硬拦截背阴面跳道与 4 分钟速降。</text>

  <rect x="634" y="268" width="504" height="74" rx="8" fill="#0F172A" stroke="#065F46"/>

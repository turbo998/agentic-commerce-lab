  <!-- Header -->
  <rect x="36" y="24" width="1128" height="84" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="40" width="215" height="26" rx="13" fill="url(#vio231)"/>
  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 229 · TELECOM DCB &amp; PSD2</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">智能体运营商话费代计费 (DCB) 防切网劫持、欧盟 PSD2 硬顶与防暗扣架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">GSMA CAMARA 验号 + PSD2 单笔 ≤€50/月累 ≤€300 令牌 (`agentic_telecom_dcb_header_enrichment_psd2_cap_mandate_...`) vs 木马偷关 Wi-Fi 盗刷</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red231)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：木马偷断 Wi-Fi 透明层静默吸费 + 拆单破 €50 上限 + 账单暗塞</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 恶意 APK 凌晨偷关 Wi-Fi 强切 4G/5G 触发 WAP Clickjacking 盗刷：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 传统网关盲信明文 X-MSISDN 注入，木马在透明 WebView 自动点订购 $9.99/周；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 月底引发海量机主投诉，被移动运营商 100% 冻结罚没未结算款并永久封杀计费代码！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 拆单绕过欧盟 PSD2 Art. 3(l) 单笔 ≤€50 / 月累 ≤€300 豁免红线：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 将 €120 商品拆成 3 笔 €40 或用话费买实物商品，当场丧失电信豁免权构成无牌非法支付。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 话费账单模糊塞入不明收费 (Cramming) 且缺失一键 STOP 退订：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反美国 FCC 47 CFR § 64.2401 Truth-in-Billing 法规，面临数千万美元联邦罚款。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms WAP Toll Fraud) | HTTP 422 (14ms PSD2 €50/€300 Cap)</text>

  <!-- Right Card: Recommended Architecture -->
  <rect x="616" y="124" width="548" height="275" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="634" y="140" width="512" height="32" rx="6" fill="url(#vio231)"/>
  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：GSMA CAMARA 验号 + PSD2 €50/€300 刚性锁 + FCC 透明账单网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. GSMA Open Gateway CAMARA 验号 + 端侧前景交互 + 防切网锁：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 硬拦截计费前 &lt;30s 内“Wi-Fi 非自然断开强切蜂窝网”与透明覆盖层自动点击，</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 强制要求端侧生物特征或交易绑定动态码确认，将木马吸费投诉率压降至 0.0%！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 欧盟 PSD2 Art. 3(l) 单笔 ≤€50 &amp; 月累 ≤€300 + 反拆单熔断：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 严锁纯数字/车票品类与双限额红线；超额订单 14ms 自动平滑分流至持牌银行卡通道。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms FCC 披露与防坏账增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 启用 OCS 实时话费额度预锁并消除木马坏账核减 (Haircut)，单批立省 $33,600.00！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $420k Telecom DCB) | HTTP 409 ($33.6k Haircut Saved)</text>


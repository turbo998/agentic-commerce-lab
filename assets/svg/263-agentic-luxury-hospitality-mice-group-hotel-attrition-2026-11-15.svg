<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg263" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="accent263" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dangerGrad263" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="safeGrad263" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bg263)"/>
  <rect x="24" y="20" width="1232" height="720" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="36" width="460" height="28" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
  <text x="274" y="55" fill="#f472b6" font-size="13" font-weight="700" text-anchor="middle">ROUND 261 · MICE GROUP HOTEL ATTRITION, RESALE CREDIT &amp; MASTER FOLIO</text>
  <text x="44" y="96" fill="#f8fafc" font-size="22" font-weight="800">B2B 智能体大型会展酒店集团采购（MICE）、客房缩减违约金（Attrition）与重售冲抵清算架构</text>
  <text x="44" y="122" fill="#94a3b8" font-size="14">全馆入住率重售冲抵锁 + 参会名单 PSI 跨渠道归集 + 75% 净毛利折算与 BEO 签名令牌 vs. 满房转卖散客收双份钱、OTA 漏算入团与总账单乱塞音视频杂费</text>
  <rect x="44" y="134" width="1192" height="3" fill="url(#accent263)"/>

  <!-- Left Column: Legacy Risks -->
  <rect x="44" y="152" width="576" height="420" rx="14" fill="url(#dangerGrad263)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="68" y="184" fill="#fca5a5" font-size="18" font-weight="700">⛔ 传统会展酒店 Master Folio 撤展结账的三大失血黑洞（多付 12%~25%）</text>

  <rect x="64" y="202" width="536" height="106" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="226" fill="#f87171" font-size="15" font-weight="700">1. 满房转卖散客却向主办方收双份空房违约金（Resale Double-Dip · 403）</text>
  <text x="80" y="248" fill="#cbd5e1" font-size="13">• 团房差 300 间夜未达标，酒店向主办方开出 $90,000 ($300×300) 缩减违约金 (Attrition)</text>
  <text x="80" y="268" fill="#cbd5e1" font-size="13">• 实则当晚酒店 98% 满房，已将其中 260 间按 $450/晚高价转卖给散客，一间房收两份钱</text>
  <text x="80" y="288" fill="#fca5a5" font-size="12" font-weight="600">→ 隐瞒全馆真实入住率，违反合同法减损冲抵义务 (Resale Mitigation Duty)</text>

  <rect x="64" y="320" width="536" height="106" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="344" fill="#fbbf24" font-size="15" font-weight="700">2. 嘉宾自己用 OTA/积分订同酒店漏算入团 &amp; 100% 毛房价罚款（422）</text>
  <text x="80" y="366" fill="#cbd5e1" font-size="13">• 120 名参会嘉宾为攒积分或用携程/Expedia 订了同一家酒店，却未被计入团房完成度 (Pickup)</text>
  <text x="80" y="386" fill="#cbd5e1" font-size="13">• 空房没住人省下了 25% 房嫂打扫洗涤水电成本且不产生住宿税，酒店却按 100% 房价+税硬罚</text>
  <text x="80" y="406" fill="#fde68a" font-size="12" font-weight="600">→ 违反 Restatement § 356 损害赔偿补偿原则（最多只能赔 75% 客房 / 65% 餐饮净毛利）</text>

  <rect x="64" y="438" width="536" height="116" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1"/>
  <text x="80" y="462" fill="#f472b6" font-size="15" font-weight="700">3. 总账单私塞未签字 BEO 音视频吊装费与服务费叠税（Master Folio · 451）</text>
  <text x="80" y="484" fill="#cbd5e1" font-size="13">• 驻场 AV 外包商未经主办方现场签字，在 Master Folio 乱塞 $38,000 桁架吊装监理费与端口费</text>
  <text x="80" y="504" fill="#cbd5e1" font-size="13">• 散客迷你吧酒水被混入主账户，且对 24% 行政服务费违规叠加征收州消费税 (Tax-on-Fee)</text>
  <text x="80" y="528" fill="#fbcfe8" font-size="12" font-weight="600">→ 撤展当天上千行账单无法肉眼核对，信用卡被一次性强行扣款</text>

  <!-- Right Column: Agentic Architecture -->
  <rect x="660" y="152" width="576" height="420" rx="14" fill="url(#safeGrad263)" stroke="#10b981" stroke-width="1.5"/>
  <text x="684" y="184" fill="#6ee7b7" font-size="18" font-weight="700">✅ 智能体 Web IQ + PSI 名单归集 + 重售冲抵四重清算门禁</text>

  <rect x="680" y="202" width="536" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="696" y="225" fill="#38bdf8" font-size="14" font-weight="700">Gate 1 · 全馆入住率穿透与重售散客冲抵锁（拦截 403）</text>
  <text x="696" y="246" fill="#e2e8f0" font-size="13">Web IQ 强制调取会议期间酒店 HTNG PMS 经审计全馆未售出空置房报表，将已转卖</text>
  <text x="696" y="266" fill="#94a3b8" font-size="12">给散客的房间数 100% 从违约缺口中冲抵；隐瞒重售收双份钱 11ms 硬拦截</text>

  <rect x="680" y="296" width="536" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="696" y="319" fill="#34d399" font-size="14" font-weight="700">Gate 2 · 参会名单 PSI 跨渠道归集与 75%/65% 净利折算锁（拦截 422）</text>
  <text x="696" y="340" fill="#e2e8f0" font-size="13">用大会签到名册与酒店住客库执行隐私哈希交集 (PSI)，100% 追回通过 OTA/积分</text>
  <text x="696" y="360" fill="#94a3b8" font-size="12">入住同酒店的参会者间夜，并将真实空房违约金锁死在 ≤75% 净毛利（免空房税）</text>

  <rect x="680" y="390" width="536" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="696" y="413" fill="#a78bfa" font-size="14" font-weight="700">Gate 3 · BEO 宴会单现场硬件签名锁与防服务费叠税门禁（拦截 451）</text>
  <text x="696" y="434" fill="#e2e8f0" font-size="13">Master Folio 每一笔宴会加餐、音视频吊装与网络增项必须匹配主办方授权代表现场</text>
  <text x="696" y="454" fill="#94a3b8" font-size="12">WebAuthn 签名的 BEO 变更单，自动剔除散客杂费与违规服务费叠税</text>

  <rect x="680" y="484" width="536" height="72" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="696" y="507" fill="#fbbf24" font-size="14" font-weight="700">Gate 4 · 总账单自动核销 &amp; PSI 归集+重售冲抵减免双签（200 / 409）</text>
  <text x="696" y="528" fill="#e2e8f0" font-size="13">10ms 签发 agentic_luxury_hospitality_mice_... 令牌；核减 $54,400 虚高违约金转 409</text>

  <!-- Bottom Benchmark Bar -->
  <rect x="44" y="588" width="1192" height="132" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="68" y="616" fill="#f472b6" font-size="15" font-weight="700">📊 定量实测基准（lab/webiq_commerce_demo.py · 5 组确定性边界全部通过 · CSP 自包含零外部依赖）</text>

  <rect x="68" y="630" width="220" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="178" y="652" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">200 OK · 合规 Master Folio</text>
  <text x="178" y="672" fill="#ecfdf5" font-size="12" text-anchor="middle">重售冲抵 + BEO 吻合 ($680k)</text>
  <text x="178" y="692" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">Master Folio Settled · 10ms</text>

  <rect x="300" y="630" width="220" height="74" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="410" y="652" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">403 · 满房转卖仍收双份违约金</text>
  <text x="410" y="672" fill="#fee2e2" font-size="12" text-anchor="middle">隐瞒 98% 入住率一房两卖</text>
  <text x="410" y="692" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">RESALE_DOUBLE_DIP_BLOCKED</text>

  <rect x="532" y="630" width="220" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="642" y="652" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">422 · 漏计团外订房/100%毛罚</text>
  <text x="642" y="672" fill="#fef3c7" font-size="12" text-anchor="middle">OTA 参会者漏计或未扣 25% 成本</text>
  <text x="642" y="692" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">OUTSIDE_BLOCK_GROSS_PENALTY</text>

  <rect x="764" y="630" width="220" height="74" rx="8" fill="#500724" stroke="#ec4899" stroke-width="1"/>
  <text x="874" y="652" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">451 · 未签字 BEO 音视频杂费</text>
  <text x="874" y="672" fill="#fce7f3" font-size="12" text-anchor="middle">乱塞 $38k AV 吊装费与叠税</text>
  <text x="874" y="692" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">UNSIGNED_BEO_AV_HOLD</text>

  <rect x="996" y="630" width="216" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="1104" y="652" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">409 · PSI 找回+重售减免</text>
  <text x="1104" y="672" fill="#e0f2fe" font-size="12" text-anchor="middle">立省 $54.4k ($625.6k 净付)</text>
  <text x="1104" y="692" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">PSI_RESALE_CREDIT_CONFIRM</text>
</svg>

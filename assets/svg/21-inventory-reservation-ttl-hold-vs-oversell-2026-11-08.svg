  <rect x="816" y="318" width="324" height="58" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="828" y="338" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">恶意比价爬虫超额占库 (active_holds &gt; 2)</text>
  <text x="828" y="360" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 429 · 16ms 硬阻断 · Send to a human</text>

  <rect x="816" y="386" width="324" height="58" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="828" y="406" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">180s 租约过期 / Fencing Token 失配冲正</text>
  <text x="828" y="428" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">HTTP 409 · 24ms Void 预授权 · $0.00 手续费损耗</text>

  <rect x="816" y="454" width="324" height="44" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="828" y="481" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">断货转 14d 预售/换型：HTTP 409 Confirm (340ms)</text>

  <!-- Bottom Bar: Architect Takeaway -->
  <rect x="44" y="526" width="1112" height="108" rx="12" fill="#090D16" stroke="#334155" stroke-width="1.2"/>
  <text x="64" y="552" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">🎯 架构师核心选型铁律 (Architect Golden Rules for Flash-Sale Inventory Leases &amp; Zero-Oversell):</text>
  <text x="64" y="576" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">1. 试算与锁库分离：calculate_order 绝不锁物理库存 (185ms)；申请 inv_hold_live_... (180s TTL) 强制要求买家 MandateVC 验签且单买家活跃锁库 &lt;= 2 (超限 16ms 报 429)。</text>
  <text x="64" y="598" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">2. 先锁库预授权、核验栅栏后再 Capture：采用 capture_method=manual 配合单调递增 fencing_token；若超时 (&gt;180s) 立即 Void 预授权 (24ms 报 409)，避免损失 2.9%+$0.30 收单费。</text>
  <text x="64" y="620" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 断货换型或预售延期 (&gt;3d) 强制经 Web IQ /v3/browse 实时接地并触发 HTTP 409 Confirm (340ms) · 线下实体仓盘亏标注为 not_measured · 详见 docs/inventory-reservation-ttl-hold-vs-oversell-compensation-faq.md</text>

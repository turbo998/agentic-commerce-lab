  <rect x="434" y="182" width="332" height="96" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="446" y="204" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Step 1: 比价零锁库 · 锁库严查 MandateVC 与配额</text>
  <text x="446" y="224" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• calculate_order 仅返回非约束库存快照 (185ms)</text>
  <text x="446" y="244" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• acquire_hold 校验 MandateVC 且 active_holds &lt;= 2</text>
  <text x="446" y="264" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• Redis Lua 原子递减签发 inv_hold_... (180s TTL)</text>

  <rect x="434" y="290" width="332" height="96" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="446" y="312" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Step 2: 手工预授权冻结 + 单调递增栅栏校验</text>
  <text x="446" y="332" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 发起 PaymentIntent (capture_method=manual)</text>
  <text x="446" y="352" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 最终出库前核验 now &lt; expires_at 且 token 匹配</text>
  <text x="446" y="372" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 校验通过 → WMS 硬提交 + Capture (HTTP 200 · 280ms)</text>

  <rect x="434" y="398" width="332" height="96" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="446" y="420" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Step 3: 租约超时自动 Void 预授权 ($0 手续费损耗)</text>
  <text x="446" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 若 Agent 推理卡顿 &gt;180s (token 41 &lt; current 42)</text>
  <text x="446" y="460" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 立即拒绝出库并调用 payment_intents.cancel 冲正</text>
  <text x="446" y="480" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 🔄 HTTP 409 LEASE_EXPIRED_VOIDED (24ms · $0 损耗)</text>


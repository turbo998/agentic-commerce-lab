  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">AI Agent 秒杀锁库与防超卖：180s 租约 + manual 预授权双锁 vs 无锁超卖退费与恶意占库</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Provenance: deterministic_offline_simulation + synthetic_policy + official_doc_snapshot · 0.0% Oversell Rate · $0.00 Refund Fee Loss on Expired Void</text>

  <!-- Left Column: Two Fatal Failure Modes -->
  <rect x="44" y="132" width="356" height="378" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="44" y="132" width="356" height="36" rx="12" fill="#7F1D1D"/>
  <text x="62" y="155" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统架构在 Agent 并发抢购下的两大死穴</text>

  <rect x="60" y="182" width="324" height="96" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="72" y="204" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 乐观无锁自动扣款 (automatic -> 后置扣库)</text>
  <text x="72" y="224" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 25 个 Agent 50ms 并发抢 5 件现货 → 25 笔全扣款</text>
  <text x="72" y="244" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 被迫退单 20 笔，但已捕获订单退款不退 2.9%+$0.30</text>
  <text x="72" y="264" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 💥 卖 5 台显卡，先倒贴净亏 $586.00 手续费!</text>

  <rect x="60" y="290" width="324" height="96" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="72" y="312" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 比价即长时锁库 (Denial-of-Inventory 攻击)</text>
  <text x="72" y="332" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 比价 Agent 并发调用 30 家店铺 calculate_order</text>
  <text x="72" y="352" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 若询价即锁库存 15 分钟 → 1 秒内全店现货被锁光</text>
  <text x="72" y="372" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 💥 拦截对策：比价 0 锁库 + 单买家配额 &lt;=2 (429 16ms)</text>

  <rect x="60" y="398" width="324" height="96" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="72" y="420" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 假现货与静默转预售 (Silent Backorder Swap)</text>
  <text x="72" y="440" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• JSON-LD 静态写 InStock，正文小字写“预计 4 周发货”</text>
  <text x="72" y="460" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 断货后商户欲静默替换为翻新替代型号或 14 天预售</text>
  <text x="72" y="480" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 🧑‍⚖️ Web IQ 实时接地 → HTTP 409 Confirm (340ms)</text>


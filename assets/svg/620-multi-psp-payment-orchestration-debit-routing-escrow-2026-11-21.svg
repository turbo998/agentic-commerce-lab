  <rect width="1200" height="675" fill="url(#bg620)"/>
  <rect x="28" y="22" width="1144" height="68" rx="12" fill="#0f172a" stroke="url(#hdr620)" stroke-width="2"/>
  <text x="48" y="51" class="title">Round 177 · Multi-PSP Payment Orchestration, Acquirer Failover &amp; PINless Debit Routing Escrow</text>
  <text x="48" y="74" class="sub">Primer / Spreedly / Adyen / Stripe · Anti-Double-Charge Timeout Mutex · Durbin PINless Debit (-140 bps) · Local MID Routing (-39% Cost)</text>
  <rect x="1010" y="36" width="142" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1081" y="59" text-anchor="middle" class="mono" fill="#a7f3d0">SVG #620 · FAQ #296</text>

  <!-- Lane 1: Timeout Failover Double-Charge & Hard-Decline Cascade Breaker -->
  <rect x="28" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="28" y="106" width="368" height="36" rx="12" fill="#450a0a"/>
  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Timeout Double-Charge &amp; Cascade Breaker (403)</text>
  <text x="44" y="162" class="body-txt">• Stops "PSP-A Timed Out → Blindly Charge PSP-B"</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">When PSP-A returns HTTP 504 / Unknown State:</text>
  <text x="54" y="200" class="mono">Fire Async `0420 Reversal` on PSP-A FIRST</text>
  <text x="44" y="223" class="body-txt">• Never Cascade Hard or Fraud Declines to PSP-B:</text>
  <text x="54" y="243" class="mono">Block Failover on Code 14/41/43/51/54/57</text>
  <text x="44" y="266" class="body-txt">• Prevents double-charging the customer across</text>
  <text x="54" y="286" class="body-txt">Stripe AND Adyen when PSP-A network socket</text>
  <text x="54" y="304" class="body-txt">drops after issuer already approved the charge</text>
  <rect x="44" y="318" width="336" height="26" rx="6" fill="#2a1215"/>
  <text x="54" y="335" class="mono" fill="#f87171">403 UNREVERSED_TIMEOUT_OR_HARD_CASCADE_BLOCKED</text>

  <!-- Lane 2: Cross-Border Acquiring Tax & Missing 3DS2 Token Handover -->
  <rect x="416" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="416" y="106" width="368" height="36" rx="12" fill="#451a03"/>
  <text x="432" y="129" class="card-hdr" fill="#fcd34d">2. Local MID &amp; Decoupled 3DS2 MPI Gate (422)</text>
  <text x="432" y="162" class="body-txt">• Stops Cross-Border Acquiring Penalty (`+1.5%`):</text>
  <text x="442" y="182" class="mono">Route Card_Issuer_Country == Local_Acquirer_MID</text>
  <text x="442" y="200" class="body-txt">Avoids routing UK/BR/JP cards to US MID (+150bps</text>
  <text x="442" y="218" class="body-txt">scheme cross-border fee &amp; -14% issuer decline)</text>
  <text x="432" y="241" class="body-txt">• Standalone 3DS2 MPI (`CAVV / XID / ECI` Reuse):</text>
  <text x="442" y="261" class="mono" fill="#fcd34d">Pass Same 3DS2 Cryptogram to Backup PSP-B</text>
  <text x="432" y="284" class="body-txt">• Blocks forcing the shopper through a 2nd</text>
  <text x="442" y="302" class="body-txt">3DS2 OTP challenge when failing over to PSP-B</text>
  <rect x="432" y="318" width="336" height="26" rx="6" fill="#2e1d09"/>
  <text x="442" y="335" class="mono" fill="#fbbf24">422 CROSS_BORDER_MID_MISMATCH_OR_2X_3DS_BLOCKED</text>

  <!-- Lane 3: PSP Lock-In Vault Trap & Split-Refund Routing -->
  <rect x="804" y="106" width="368" height="250" rx="12" fill="#111c2d" stroke="#ec4899" stroke-width="1.5"/>
  <rect x="804" y="106" width="368" height="36" rx="12" fill="#500724"/>
  <text x="820" y="129" class="card-hdr" fill="#f472b6">3. Universal Vault &amp; Origin-PSP Refund Lock (451)</text>
  <text x="820" y="162" class="body-txt">• Eliminates Single-PSP Token Lock-In:</text>
  <text x="830" y="182" class="mono">Store Card in Universal PCI Vault (BasisTheory/</text>
  <text x="830" y="200" class="mono">Spreedly/Primer) + EMVCo Network Token</text>
  <text x="820" y="223" class="body-txt">• Strict Origin-PSP &amp; Origin-MID Refund Pinning:</text>
  <text x="830" y="243" class="mono" fill="#f9a8d4">Refund_PSP_MID == Original_Captured_PSP_MID</text>
  <text x="830" y="261" class="body-txt">Prevents blind unreferenced refunds (`Credit`) on</text>
  <text x="830" y="279" class="body-txt">wrong PSP when order failed over during checkout</text>
  <rect x="820" y="318" width="336" height="26" rx="6" fill="#320b1e"/>
  <text x="830" y="335" class="mono" fill="#f472b6">451 SINGLE_PSP_VAULT_LOCKIN_OR_WRONG_MID_REFUND_HOLD</text>

  <!-- Bottom Durbin Regulated PINless Debit & Cascading Failover Architecture -->
  <rect x="28" y="374" width="1144" height="182" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="48" y="401" class="card-hdr" fill="#38bdf8">4. US Fed Reg II (Durbin) Dual-Network PINless Debit Routing + Code-05 Soft Failover + Local APM (HTTP 409)</text>

  <rect x="48" y="418" width="255" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="62" y="440" class="card-hdr">① Reg II PINless Debit Route</text>
  <text x="62" y="462" class="body-txt">Routes US regulated debit BINs</text>
  <text x="62" y="480" class="body-txt">over `Star / NYCE / Accel / Pulse`</text>
  <text x="62" y="498" class="body-txt">at `0.05% + $0.22` cap vs</text>
  <text x="62" y="516" class="mono">Saves ~140 bps vs Visa/MC Rail</text>

  <rect x="323" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="337" y="440" class="card-hdr">② 120ms Code-05 Soft Failover</text>
  <text x="337" y="462" class="body-txt">When PSP-A returns `05 Do Not</text>
  <text x="337" y="480" class="body-txt">Honor`, retries via PSP-B</text>
  <text x="337" y="498" class="body-txt">with same 3DS2 CAVV in 120ms;</text>
  <text x="62" y="516" class="mono"/>
  <text x="337" y="516" class="mono">Rescues 32% False Declines</text>

  <rect x="608" y="418" width="265" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="622" y="440" class="card-hdr">③ Local Domestic Entity Routing</text>
  <text x="622" y="462" class="body-txt">Routes Brazil to dLocal/Pix,</text>
  <text x="622" y="480" class="body-txt">EU to Adyen NL, US to Stripe</text>
  <text x="622" y="498" class="body-txt">US domestic MID automatically;</text>
  <text x="622" y="516" class="mono" fill="#6ee7b7">+8.5% Global Auth Uplift</text>

  <rect x="893" y="418" width="259" height="120" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="907" y="440" class="card-hdr" fill="#6ee7b7">④ Unified Settlement Ledger</text>
  <text x="907" y="462" class="body-txt">Normalizes Stripe, Adyen &amp;</text>
  <text x="907" y="480" class="body-txt">Braintree webhooks + fee</text>
  <text x="907" y="498" class="body-txt">audits into 1 ERP schema;</text>
  <text x="907" y="516" class="mono" fill="#38bdf8">-39% Payment MDR &amp; Decline Loss</text>

  <!-- KPI Footer -->

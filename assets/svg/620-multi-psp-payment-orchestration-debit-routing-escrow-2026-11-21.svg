  <text x="46" y="626" class="kpi-lbl">Quarterly MDR &amp; False-Decline Saved</text>
  <text x="46" y="642" class="mono">$72,150 Saved / $185k Pool</text>

  <rect x="318" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="336" y="604" class="kpi-num" fill="#10b981">0.05% + $0.22</text>
  <text x="336" y="626" class="kpi-lbl">Durbin Reg-II PINless Debit</text>
  <text x="336" y="642" class="mono">Least-Cost Routing on US Debit</text>

  <rect x="608" y="572" width="272" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="626" y="604" class="kpi-num" fill="#f59e0b">0 Double-Charge</text>
  <text x="626" y="626" class="kpi-lbl">0420 Timeout Reversal Before Retry</text>
  <text x="626" y="642" class="mono">Strict Cross-PSP Idempotency</text>

  <rect x="898" y="572" width="274" height="80" rx="10" fill="#111c2d" stroke="#1e293b"/>
  <text x="916" y="604" class="kpi-num" fill="#f472b6">1x 3DS2 CAVV</text>
  <text x="916" y="626" class="kpi-lbl">Decoupled MPI Cryptogram Reuse</text>
  <text x="916" y="642" class="mono">Seamless Failover Without 2nd OTP</text>

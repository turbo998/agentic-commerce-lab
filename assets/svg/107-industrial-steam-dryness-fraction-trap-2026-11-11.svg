  </text>

  <!-- Center Card: 4-Layer Steam Dryness & Trap Mandate Engine -->
  <rect x="415" y="132" width="370" height="360" rx="12" fill="url(#cardBg107)" stroke="#EC4899" stroke-width="2"/>
  <rect x="431" y="148" width="338" height="32" rx="6" fill="#831843"/>
  <text x="600" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#FCE7F3" text-anchor="middle">

  <rect width="1200" height="630" fill="url(#bg107)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent107)"/>

  <!-- Header -->
  <rect x="40" y="24" width="390" height="28" rx="14" fill="#831843" stroke="#F472B6" stroke-width="1"/>
  <text x="235" y="43" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#FCE7F3" text-anchor="middle">
    ROUND 105 · INDUSTRIAL STEAM-AS-A-SERVICE DRYNESS ESCROW
  </text>
  <text x="40" y="84" font-family="Segoe UI, Ubuntu, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">
    化工园区蒸汽外供 (Steam-as-a-Service)、干度分数 (&gt;=0.97) 与疏水阀防直排智能托管
  </text>
  <text x="40" y="111" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" fill="#94A3B8">
    Dual-Vortex Steam Dryness Fraction (x &gt;=0.97), 40 kHz Ultrasonic Trap Blow-Through &amp; Flash-Steam MVR vs. Wet-Steam Mass Overbilling
  </text>

  <!-- Left Card: Legacy Wet-Steam Mass & Blow-Through Failure -->
  <rect x="40" y="132" width="355" height="360" rx="12" fill="url(#cardBg107)" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="148" width="323" height="32" rx="6" fill="#450A0A"/>
  <text x="217" y="169" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">
    ❌ 传统按蒸汽吨数盲付与热水充汽踩坑
  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="58" y="204" font-weight="700" fill="#F87171">1. 湿蒸汽夹带液滴把“热水当蒸汽高价卖”</text>
    <text x="58" y="224" fill="#CBD5E1">• 管网保温破损致蒸汽干度跌至 x = 0.82 (含18%液态水)</text>
    <text x="58" y="242" fill="#CBD5E1">• 孔板流量计照收 100% 蒸汽吨费，且引发严重水锤击穿阀门</text>

    <text x="58" y="274" font-weight="700" fill="#F87171">2. 疏水阀卡死常开 (Failed-Open) 直排活蒸汽</text>
    <text x="58" y="294" fill="#CBD5E1">• 20% 机械疏水阀阀芯磨损常开，活蒸汽直排凝结水沟</text>
    <text x="58" y="312" fill="#CBD5E1">• 用汽厂每月白交数万美元“漏气幽灵账单”</text>

    <text x="58" y="344" font-weight="700" fill="#F87171">3. 凝结水硬度/铁离子超标污染锅炉给水</text>
    <text x="58" y="364" fill="#CBD5E1">• 换热器微漏致凝结水电导率 &gt; 10 μS/cm 遭热电厂拒收</text>
    <text x="58" y="382" fill="#CBD5E1">• 85°C 高温除盐水白白排入下水道，扣除全部回水抵扣款</text>
  </g>
  <rect x="58" y="442" width="319" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="217" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg107" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131F"/>
      <stop offset="50%" stop-color="#132235"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent107" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cardBg107" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18283E"/>
      <stop offset="100%" stop-color="#0C1624"/>
    </linearGradient>

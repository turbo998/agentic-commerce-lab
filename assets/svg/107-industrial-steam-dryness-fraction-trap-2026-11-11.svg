  </text>

  <g font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#E2E8F0">
    <text x="823" y="204" font-weight="700" fill="#6EE7B7">• 干度 x &gt;=0.97 与净热吉焦达标放款 (200)</text>
    <text x="823" y="223" fill="#CBD5E1">  延迟：19 ms · 放款：$155,000.00</text>

    <text x="823" y="253" font-weight="700" fill="#FCA5A5">• 湿蒸汽夹水 (x=0.82) 把水当汽卖拦截 (403)</text>
    <text x="823" y="272" fill="#CBD5E1">  延迟：11 ms · 拦截虚收款：$155,000.00</text>

    <text x="823" y="302" font-weight="700" fill="#FCA5A5">• 40 kHz 疏水阀常开漏汽/回水污染拦截 (422)</text>
    <text x="823" y="321" fill="#CBD5E1">  延迟：14 ms · 自动隔离故障疏水阀支路</text>

    <text x="823" y="351" font-weight="700" fill="#FDE68A">• Web IQ 闪蒸乏汽 MVR 升压复刻套利 (409)</text>
    <text x="823" y="370" fill="#CBD5E1">  延迟：300 ms · 节省：$24,800.00 (16.0% 节汽)</text>

    <text x="823" y="400" font-weight="700" fill="#93C5FD">• 顺序反转零漂移 (0.0 pts) &amp; 单元测试</text>
    <text x="823" y="419" fill="#CBD5E1">  126 / 126 单元测试 100% 通过 (CSP 自包含)</text>
  </g>
  <rect x="823" y="442" width="319" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="982" y="463" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">
    只为真实汽化潜热买单，终结凝结水充蒸汽黑洞
  </text>

  <!-- Footer Banner -->
  <rect x="40" y="512" width="1120" height="88" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="541" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" font-weight="700" fill="#F9A8D4">
    🏛️ 架构师选型铁律 (Takeaway): 绝对不要按普通涡街/孔板流量计的“湿蒸汽毛吨数 (Gross Mass Tons)”给热电厂付蒸汽款！
  </text>
  <text x="60" y="565" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    必须绑定：① 在线干度计实测干度分数 x &gt;=0.97 且按净有效汽化潜热 (GJ) 扣除高温凝结水回水焓值 (11ms 拦 403)；② 40 kHz 超声波疏水阀零常开直排且回水电导率 &lt;=10 μS/cm (14ms 拦 422)；
  </text>
  <text x="60" y="586" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12.5" fill="#CBD5E1">
    ③ Web IQ 核查特种承压设备定检与热电碳排因子 (290ms 拦 451)，并将 0.15 MPa 闪蒸乏汽接入谷电 MVR 机械蒸汽再压缩机替代高价新汽 (300ms 省 $24,800)。
  </text>

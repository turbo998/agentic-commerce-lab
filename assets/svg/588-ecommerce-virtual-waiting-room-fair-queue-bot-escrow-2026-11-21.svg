<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg588" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081326" />
      <stop offset="50%" stop-color="#0f2342" />
      <stop offset="100%" stop-color="#06101e" />
    </linearGradient>
    <linearGradient id="accent588" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21.5px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .mono { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #6ee7b7; }
      .warn { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #fca5a5; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg588)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent588)" rx="3" />

  <text x="40" y="58" class="title">大促高并发虚拟排队室与公平抽签架构 (Queue-it / Cloudflare Waiting Room / EQL 防黄牛)</text>
  <text x="40" y="80" class="subtitle">Round 145 · 防 50万抢购流量打崩全站日常订单、防 1000 个无痕窗口刷签 &amp; 边缘隔离排队室净省 39% 扩容与流失损耗 (SVG 588)</text>

  <!-- Left Card: 3 Flash-Drop Queue Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大闪购排队与宕机灾难</text>
  <text x="56" y="164" class="card-title">1. 单品闪购打崩全站主数据库 (Blast Radius)</text>
  <text x="56" y="184" class="body">• 仅发售 500 双联名鞋，零点涌入 60 万抢购请求直击源站</text>
  <text x="56" y="202" class="body">• 数据库连接池瞬间打满 502 宕机，导致正在买普通衣服的</text>
  <text x="56" y="220" class="warn">  8,000 名日常顾客全部无法结账，陪葬 $450,000 日常 GMV!</text>

  <text x="56" y="256" class="card-title">2. 开 500 个浏览器无痕窗口刷排位 (HTTP 403)</text>
  <text x="56" y="276" class="body">• 排队室仅按匿名 Cookie 分配排队号 (Queue ID)</text>
  <text x="56" y="294" class="body">• 黄牛用指纹浏览器同时开 500 个窗口拿 500 个签号</text>
  <text x="56" y="312" class="warn">• 或把排到第 1 名的 Cookie 链接在闲鱼上以 $50 倒卖给别人!</text>

  <text x="56" y="348" class="card-title">3. 先到先得 (FCFS) 拼网速与进站篡改 SKU (HTTP 422)</text>
  <text x="56" y="368" class="body">• 纯靠 00:00:00.001 毫秒级点击抢排队，机房脚本 100% 霸榜</text>
  <text x="56" y="386" class="body">• 放行令牌未绑定目标 SKU 与 User_ID，黄牛用普通商品通道</text>
  <text x="56" y="404" class="warn">  绕过排队室直接调结账 API 偷买限购爆款!</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: MULTI_TAB_SYBIL_QUEUE_OR_COOKIE_RESALE</text>
  <text x="70" y="502" class="warn">• HTTP 422: UNSIGNED_QUEUE_BYPASS_OR_SKU_SWAP_ATTACK</text>
  <text x="70" y="524" class="warn">• HTTP 451: ORIGIN_DB_BLAST_RADIUS_UNISOLATED_HOLD</text>
  <text x="70" y="546" class="mono">• HTTP 409: PRE_DROP_FAIR_LOTTERY_AND_EDGE_GATE_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: HMAC_BOUND_QUEUE_PASS_AUTHORIZED</text>
  <text x="70" y="596" class="body">铁律: 开售前 15m 预等候室乱序洗牌 (Randomize) 废除拼手速!</text>

  <!-- Center Card: 4-Stage Edge Waiting Room Architecture -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶边缘排队室、预洗牌与防绕过架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="175" class="card-title" fill="#38bdf8">Gate 1: 15分钟预等候室公平洗牌 (Pre-Queue Randomizer)</text>
  <text x="450" y="195" class="body">• 09:45–10:00 进入预等候室的用户，在 10:00 整采用加密随机</text>
  <text x="450" y="213" class="body">  算法统一打乱分配排队序号，彻底废掉黄牛 0.1ms 机房抢跑优势</text>
  <text x="450" y="231" class="mono">• 强制绑定实名账号+手机号+支付卡指纹 1人仅限1签 -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#10b981" />
  <text x="450" y="282" class="card-title" fill="#6ee7b7">Gate 2: 边缘 HMAC 通行令牌锁 (Edge-Signed Pass Token)</text>
  <text x="450" y="302" class="body">• 轮到进场时，Cloudflare/Queue-it 边缘节点签发 10 分钟有效</text>
  <text x="450" y="320" class="body">  `Queue_Pass_JWS = HMAC(user_id + client_ip + target_sku + exp)`</text>
  <text x="450" y="338" class="body">• 源站结账 API 必验该签名，严禁从普通页面抓包绕过排队直调 API!</text>
  <text x="450" y="354" class="mono">• 无排队签名或进场后篡改收货人/倒卖排队链接 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: 爆款与日常主站物理舱壁隔离 (Bulkhead Isolation)</text>
  <text x="450" y="419" class="body">• 排队拦截层 100% 运行在 CDN 边缘节点，仅对 `/drop/*` 路径生效</text>
  <text x="450" y="437" class="body">• 按源站数据库健康水位动态调节每秒放行速率 (如 300 人/分钟)</text>
  <text x="450" y="455" class="mono">• 未隔离全站流量导致日常购物车陪葬宕机 -&gt; HTTP 451 熔断</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#f59e0b" />
  <text x="450" y="508" class="card-title" fill="#fcd34d">Gate 4: EQL 连败加权公平抽签与实时售罄广播 (HTTP 409)</text>
  <text x="450" y="528" class="body">• 对极度稀缺商品改“在线死等排队”为“2小时窗口预授权抽签”</text>
  <text x="450" y="546" class="body">• 历史连续未中签的真实老粉自动获得 2x~5x 抽签权重补偿 (EQL)</text>
  <text x="450" y="566" class="mono">• 排队室实时推送各尺码剩余百分比，售罄即刻解散免无效等待</text>
  <text x="450" y="586" class="mono">• 免 10 倍服务器临时扩容费 + 保住主站日常 GMV -&gt; 净省 39%</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大高并发排队与抽签底座</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Queue-it (全球虚拟排队室霸主)</text>
  <text x="846" y="182" class="body">• 优势: 票务/球鞋/政府预约金标准，原生支持 Pre-Queue 预洗牌</text>
  <text x="846" y="198" class="body">• 特性: 排队页实时广播各尺码库存进度条与邮件到号提醒</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. Cloudflare Waiting Room + Turnstile</text>
  <text x="846" y="244" class="body">• 优势: 与边缘 WAF、Bot Management 无缝一体，零源站代码侵入</text>
  <text x="846" y="260" class="body">• 特性: 根据源站响应延迟自动伸缩每分钟放行人数</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. EQL (Run Fair) 公平抽签引擎</text>
  <text x="846" y="306" class="body">• 优势: 物理消灭抢跑压力，内置多维反女巫团伙检测与老粉连败加权</text>
  <text x="846" y="322" class="body">• 特性: 中签即通过预绑卡自动完成扣款，100% 售罄率</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. Shopify Flash-Sale Queue &amp; Hydrogen Edge</text>
  <text x="846" y="368" class="body">• 优势: 独立站原生结账队列，保障主站浏览不卡顿仅在结账层限流</text>
  <text x="846" y="384" class="body">• 特性: 原生防无头爬虫直接 post `/checkout.json` 接口</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度大促服务器扩容与宕机陪葬池 ($140,000)</text>
  <text x="860" y="456" class="body">• 传统主站宕机陪葬GMV+10倍云扩容浪费: $140,000/季</text>
  <text x="860" y="476" class="mono">• 边缘排队室舱壁隔离保住全站日常订单: -$28,000</text>
  <text x="860" y="496" class="mono">• 免除为 15 分钟尖峰提前包月扩容 10x 算力: -$16,800</text>
  <text x="860" y="516" class="mono">• 拦截多开窗口黄牛把货留给高复购真实老粉: -$9,800</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净成本: $85,400 (净省 $54,600 / -39%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: virtual_waiting_room_optim_409</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg166" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent166" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 23px; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-h { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 12px; fill: #fde68a; }
      .pill-ok { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #052e16; }
      .pill-err { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #450a0a; }
      .pill-warn { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #451a03; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg166)" rx="16"/>
  <rect x="28" y="22" width="1144" height="6" fill="url(#accent166)" rx="3"/>

  <text x="36" y="60" class="title">Round 164 · 航空与重型燃机单晶涡轮叶片 (CMSX-4/DD6)、劳厄晶向与中子零残芯架构图</text>
  <text x="36" y="84" class="sub">Single-Crystal Superalloy Turbine Blade Offtake, Laue [001] (&lt;=8°), Zero RX (0 um), Gd Neutron Core (0%) &amp; Rhenium Revert</text>

  <!-- Left Card: Failure Mode -->
  <rect x="36" y="104" width="355" height="390" rx="12" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="52" y="120" width="160" height="24" rx="12" fill="#fca5a5"/>
  <text x="64" y="136" class="pill-err">⛔ 传统按支数与外轮廓盲付</text>
  <text x="52" y="166" class="card-h">三大 1,600°C 空中蠕变断叶与前缘融化烧穿灾难</text>

  <text x="52" y="196" class="body" fill="#fca5a5" font-weight="700">1. 吹砂诱发表面再结晶 (RX) 致 1,100°C 秒断</text>
  <text x="52" y="216" class="body">单晶合金彻底去除了碳/硼晶界强化元素，一旦固溶</text>
  <text x="52" y="234" class="body">后表皮长出 100um 再结晶新晶界，在 10 吨离心</text>
  <text x="52" y="252" class="body">拉力下新晶界瞬间裂开导致叶片飞断击穿机匣！</text>

  <text x="52" y="282" class="body" fill="#fca5a5" font-weight="700">2. 普通 X 光漏检蛇形道陶瓷残芯堵死气膜孔</text>
  <text x="52" y="302" class="body">镍钨铼重金属屏蔽 X 射线，死角残留 1.5mm 硅基</text>
  <text x="52" y="320" class="body">型芯震落堵死 0.4mm 气膜孔，2 秒内烧穿前缘。</text>

  <text x="52" y="350" class="body" fill="#fca5a5" font-weight="700">3. 偷减天价金属铼 ($3,000/kg) 与 60% 冒口流失</text>
  <text x="52" y="370" class="body">少加 1.4% 金属铼使持久寿命腰斩；占投料 60%</text>
  <text x="52" y="388" class="body">的同炉含铼单晶浇道冒口废料未真空精炼回配。</text>

  <rect x="52" y="418" width="323" height="58" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="64" y="440" class="mono" fill="#f87171">Legacy: 200 Blades + Blue-Light 3D Airfoil Scan</text>
  <text x="64" y="460" class="mono" fill="#fca5a5">Result: $720,000 exposed to uncontained blade-off</text>

  <!-- Center Card: Mandate Pipeline -->
  <rect x="412" y="104" width="380" height="390" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="428" y="120" width="248" height="24" rx="12" fill="#6ee7b7"/>
  <text x="440" y="136" class="pill-ok">🛡️ single_crystal_blade_mandate</text>
  <text x="428" y="166" class="card-h">四层劳厄晶向、零再结晶与中子照相门禁（10ms–280ms）</text>

  <rect x="428" y="182" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="202" class="mono">Gate 1: Laue [001] &amp; Zero-RX Gate (11ms)</text>
  <text x="440" y="220" class="body">劳厄 X 射线 [001] 偏角 &lt;=8.0°, 零雀斑链 &amp; 浅腐蚀</text>
  <text x="440" y="238" class="body">表面再结晶深度 RX = 0 um — 违者直返 HTTP 403</text>

  <rect x="428" y="258" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="278" class="mono">Gate 2: Gd Neutron 0% Core &amp; Flow (14ms)</text>
  <text x="440" y="296" class="body">ASTM E545 钆示踪中子照相内腔残芯 = 0% &amp; 气膜孔</text>
  <text x="440" y="314" class="body">流量偏差 &lt;=+-5.0% — 残芯堵孔直返 HTTP 422</text>

  <rect x="428" y="334" width="348" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="440" y="354" class="mono">Gate 3: Web IQ ICP Rhenium &amp; 0-Weld (280ms)</text>
  <text x="440" y="372" class="body">核验 NADCAP 热处理资质、ICP 铼含量 Re &gt;=2.9%</text>
  <text x="440" y="390" class="body">与 100% 零违规氩弧补焊 — 偷铼补焊直返 HTTP 451</text>

  <rect x="428" y="410" width="348" height="68" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="440" y="430" class="mono" fill="#fcd34d">Gate 4: 60% Re Sprue Vacuum Revert (245ms)</text>
  <text x="440" y="448" class="body">60% 同炉含铼单晶浇道/选晶器废料高真空脱气 (O/N</text>
  <text x="440" y="466" class="body">&lt;=5ppm) 50% 回配重熔立省 $100,800 触发 HTTP 409</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="812" y="104" width="352" height="390" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="828" y="120" width="184" height="24" rx="12" fill="#fde68a"/>
  <text x="840" y="136" class="pill-warn">📊 5-Lane 实测矩阵与 Web IQ</text>
  <text x="828" y="166" class="card-h">零虚构坐标定量实测（Provenance: measured）</text>

  <text x="828" y="194" class="mono" fill="#4ade80">✅ HTTP 200 (10ms) · 精准晶向零再结晶零残芯放行</text>
  <text x="828" y="212" class="body">Laue 3.8° + RX 0um + 中子 0%残芯 → $720,000</text>

  <text x="828" y="240" class="mono" fill="#f87171">⛔ HTTP 403 (11ms) · 晶向超差或表面再结晶拦截</text>
  <text x="828" y="258" class="body">偏角 19° 或 120um 再结晶层 → 冻结 $720,000.00</text>

  <text x="828" y="286" class="mono" fill="#fb923c">⛔ HTTP 422 (14ms) · 中子照相残芯或气膜孔堵塞</text>
  <text x="828" y="304" class="body">内腔陶瓷残芯或流量 -14% → 拒付 $720,000.00</text>

  <text x="828" y="332" class="mono" fill="#c084fc">⛔ HTTP 451 (280ms) · Web IQ 偷减金属铼或补焊</text>
  <text x="828" y="350" class="body">Re=1.6% 短缺或私自 TIG 补焊 → 熔断 $720,000</text>

  <text x="828" y="378" class="mono" fill="#facc15">🟡 HTTP 409 (245ms) · 含铼浇冒口真空回炉冲抵</text>
  <text x="828" y="396" class="body">节省 $100,800 (-14%) → 确认后净付 $619,200.00</text>

  <rect x="828" y="416" width="320" height="62" rx="8" fill="#1e293b"/>
  <text x="840" y="438" class="body" font-weight="700" fill="#38bdf8">Web IQ (/v3/browse) vs Exa / Bright Data</text>
  <text x="840" y="458" class="body">准确率 100% · P50 245ms · 抗注入 100% · 流道保密</text>

  <!-- Footer -->
  <rect x="36" y="512" width="1128" height="92" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="538" class="card-h" fill="#f97316">🔑 架构师第一性原理速记（Takeaway for AI Solution Architects）</text>
  <text x="54" y="562" class="body">• 单晶涡轮叶片严禁“仅看外轮廓与普通 X 光盲付”：无碳硼保护的表面再结晶 (RX) 会导致 1,100°C 秒断，而 X 光看不穿重金属内的硅基残芯。</text>
  <text x="54" y="584" class="body">• 必须将 Laue [001] 偏角 (&lt;=8°)、零再结晶 (RX=0)、钆示踪中子零残芯与含铼浇冒口回炉绑定为智能托管解锁谓词。</text>
</svg>

  <text x="890" y="161" fill="#064E3B" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：登记处 RETIRED 锁 + 24/7 同网小时级匹配 + $0 电价地板网关</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 中央登记处 Status == RETIRED 唯一注销 + 24/7 同电网 1h 对齐：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 11ms 直连 M-RETS / PJM-GATS / AIB / Puro 确认证书已永久退役并绑定买方 LEI；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 强制同一 ISO/RTO 电网边界与 EnergyTag 小时级时间戳对齐，100% 通过四大行鉴证！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. vPPA 差价合约硬锁 Effective_LMP = max($0.00, LMP) 零地板：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 14ms 自动截断负电价时段超额赔付或触发经济限电，将单 MWh 差价支出死锁在履约价内。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms RE100/CSRD 核验与防损增效：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 砍断负电价倒贴并直连登记处批发注销免除二道贩子加价，单批立省 $68,800.00！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>

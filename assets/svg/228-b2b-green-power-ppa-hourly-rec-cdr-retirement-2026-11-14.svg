  <text x="159" y="57" fill="#064E3B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 226 · GREEN PPA &amp; 24/7 REC</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">B2B 智算中心绿电采购 (vPPA)、24/7 小时级绿证注销与负电价零地板清算架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">登记处 RETIRED 唯一锁 + 同网 1h 对齐 + 负电价 $0 地板令牌 (`b2b_green_power_ppa_hourly_rec_cdr_retirement_mandate_...`) vs 一证两卖与倒贴</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red228)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：买未注销异地绿证被判漂绿 + vPPA 负电价时段双倍倒贴巨亏</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. 绿证未在登记处执行 RETIRED 永久注销 + 跨非互联电网漂绿：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 仅凭 PDF 截图付款，卖家将处于 ACTIVE 状态的同一批绿证转卖两家公司 (一证双报)；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 用异地午间光伏证冲抵半夜煤电 GPU 算力，遭欧盟 CSRD 与 FTC 反漂绿重罚！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. 虚拟购电协议 (vPPA) 漏设 $0/MWh 负电价地板导致天价倒贴：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 固定价 $38/MWh 遇现货电价跌至 -$42/MWh 时，被迫按 $38 - (-$42) = $80/MWh 赔付。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 混入投产超 15 年老旧水电项目或过期 Vintage 旧证被 RE100 拒认：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反 RE100 技术准则，导致数百万美元绿证采购款在年度碳审计中 100% 作废。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>

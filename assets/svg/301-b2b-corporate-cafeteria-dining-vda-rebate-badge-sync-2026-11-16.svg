<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg301" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent301" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg301)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent301)"/>

  <!-- Header -->
  <text x="52" y="62" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-16 · ROUND 299 · B2B CORPORATE CAFETERIA, PANTRY &amp; MICRO-MARKET COST-PLUS, GPO/VDA REBATES &amp; BADGE SYNC</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">B2B 企业员工餐厅、茶水间与无人微超：100% 采购返利穿透锁、门禁在岗核销与防空额保底架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">封杀“Cost-Plus 合同私吞 14% Foodbuy/Entegra 厂家返利” · 阻断周五居家办公照收 3,000人满员保底补贴 · 锁死微超货损 &lt;=1.5%</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统企业团餐与无人微超三大黑洞 (多付 22%–38%)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 表面收 5% 管理费，暗吞 14% GPO/VDA 厂家返利</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 团餐商按分销商毛发票价向雇主实报实销并加收 5% 管理费</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 背地里通过旗下 GPO (Foodbuy/Entegra) 拿走食品厂 14% 返利</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 食材买得越贵、浪费越多，团餐商拿的返利与提成反而越高</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 周一/周五 22% 混合办公出勤，照收满员保底补贴</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 周五全楼仅 750 人到岗，后厨仍按 3,000 人满员排班备菜</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 下午把几百份剩菜倒掉，全额工时与食材亏损由雇主买单</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 员工拿未上班同事工牌代刷两份免费餐，套取公司餐补</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 茶水间幽灵补货与微超 12% 漏扫失窃全算雇主账</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 自助微超 (Micro-Market) 每月 12% 未扫码拿走与临期报废</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 团餐商将全部货损塞进雇主月底 P&amp;L 亏损补贴账单</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 茶水间账单报销 20 箱高价冷萃咖啡，实际只上架 12 箱</text>

  <!-- Center Card: Agentic Policy Engine -->
  <rect x="422" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="422" y="136" width="356" height="38" rx="12" fill="#064E3B"/>
  <text x="442" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体净返利穿透、门禁在岗与微超货损三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#059669"/>
  <text x="452" y="210" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：100% 扣除 GPO/VDA 返利净底价与固定管理费</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制将 11%–16% 厂家销量返利 (VDA) 100% 冲减雇主食材费</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 管理费改为按实测就餐人次定额计提，严禁按食材花费抽成</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 阻断截留表外返利与毛发票价加成</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#059669"/>
  <text x="452" y="326" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：大楼门禁进场一卡一餐锁与微超 &lt;=1.5% 货损</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 食堂 POS 实时核对当日大楼门禁进场记录，封杀代刷未上班卡</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 周一/周五按工位预约动态排班，微超货损封顶 &lt;=1.5%</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 拦截混合办公空额保底与 12% 货损甩锅</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#059669"/>
  <text x="452" y="442" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ USDA 批发价、卫生评级与过敏原锁</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 核验 USDA AMS 肉蛋果蔬区域批发指数</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 核查市政卫生局 Grade A 检查档案与 FDA 9 大致敏原标识</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $28,000</text>

  <!-- Right Card: Quantitative Benchmark -->
  <rect x="796" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="796" y="136" width="356" height="38" rx="12" fill="#164E63"/>
  <text x="816" y="160" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 企业园区团餐与微超 ($280,000) 实测矩阵</text>

  <rect x="812" y="188" width="324" height="60" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="826" y="210" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="826" y="232" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">100% 扣返利净底价 + 门禁一卡一餐 + 货损 &lt;=1.5% → $280k</text>

  <rect x="812" y="258" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="280" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="826" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">私吞 14% GPO/VDA 厂家返利或按毛发票价抽成 → 拦截</text>

  <rect x="812" y="328" width="324" height="60" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="826" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="826" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">周五 22% 出勤收满员保底或转嫁 12% 微超失窃 → 阻断</text>

  <rect x="812" y="398" width="324" height="60" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="826" y="420" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">🛑 HTTP 451 (275ms) / 🧑‍⚖️ HTTP 409 (240ms)</text>
  <text x="826" y="442" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">卫生局检查违规挂起 / 追回 VDA 返利+排班折算省 $28,000</text>

  <rect x="812" y="468" width="324" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="826" y="490" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">💡 追回 14% 厂家返利与混合办公折算后净付：$252,000 (省 10%)</text>
  <text x="826" y="510" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="11">令牌：b2b_corporate_cafeteria_dining_micromarket_cost_...</text>

  <!-- Footer -->
  <rect x="48" y="556" width="1104" height="80" rx="10" fill="#020617" stroke="#334155"/>
  <text x="68" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">架构师核心选型铁律 (Architect's Golden Rule)：</text>
  <text x="68" y="604" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 企业团餐 Cost-Plus 合同必须强制执行 100% Net-of-Rebate 净食材底价，将 Foodbuy/Entegra 厂家返利全额退还雇主。</text>
  <text x="68" y="624" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 食堂 POS 餐补必须实时匹配当日大楼门禁进场工牌，微超货损封顶 &lt;=1.5%，并通过 Web IQ 核验 USDA 批发价与食安评级。</text>
</svg>

  <!-- Header -->
  <text x="52" y="62" fill="#A78bfa" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-15 · ROUND 280 · AGENTIC CORPORATE RELOCATION RMC, HHG TARE/GROSS WEIGHT &amp; BVO HOME-SALE TAX SHIELD</text>
  <text x="52" y="92" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">智能体企业高管异地搬迁与安家 (RMC/HHG)：CAT Scale 过磅防压秤、反扣货与 BVO 免税清算架构</text>
  <text x="52" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">49 CFR 375.509 ELD 油位双磅单 + AI 7.0 lbs/cu.ft. 体积密度锁防压秤 · GIS 街景核验防 $2,400 接驳车勒索 · IRS 2005-74 BVO 卖房免税盾</text>

  <!-- Left Card: Legacy Failure Modes -->
  <rect x="48" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="48" y="136" width="356" height="38" rx="12" fill="#7F1D1D"/>
  <text x="68" y="160" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 传统企业高管搬迁与安家三大黑洞 (超支 15%–26%)</text>

  <rect x="64" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="210" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 空车抽油、重车加满油+塞配重压秤 (Weight Bump)</text>
  <text x="78" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 空车称皮重 (Tare) 时油箱抽干，装完家具称毛重时加满</text>
  <text x="78" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 300 加仑柴油 (+2,130 lbs) + 乘员与暗格配重虚增 4,000 磅</text>
  <text x="78" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 单户高管跨州搬家白白被骗走 $4,800 虚构运费</text>

  <rect x="64" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="326" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. 卸货前扣押家具勒索 $2,400 接驳车与推车费</text>
  <text x="78" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 抵达新家后谎称“53尺大挂车进不了小区”拒绝开门卸货</text>
  <text x="78" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 当场勒索 $2,400 小货车接驳 (Shuttle) 与 $850 远距离推车</text>
  <text x="78" y="388" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 将员工自包纸箱 (PBO) 谎报成天价定制木箱 (Custom Crating)</text>

  <rect x="64" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="78" y="442" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. BVO 旧房出售违规触发 65% Tax Gross-Up 雪崩</text>
  <text x="78" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 协助高管卖旧房时未满足 IRS Rev. Rul. 2005-74 两步过户</text>
  <text x="78" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• $55,000 房产佣金与过户费被国税局认定为应税 W-2 工资</text>
  <text x="78" y="504" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 企业承担税上税补贴 (Tax-on-Tax) 每单白赔 $35,750</text>

  <!-- Center Card: Agentic Policy Engine -->
  <rect x="422" y="136" width="356" height="404" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="422" y="136" width="356" height="38" rx="12" fill="#4C1D95"/>
  <text x="442" y="160" fill="#DDD6FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛡️ 智能体 ELD 双磅单、AI 密度与 BVO 免税三道锁</text>

  <rect x="438" y="188" width="324" height="104" rx="8" fill="#0F172A" stroke="#6D28D9"/>
  <text x="452" y="210" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 1：CAT Scale + ELD 油位与 7.0 lb/cu.ft. 密度锁</text>
  <text x="452" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制核验空/重车过磅时 ELD 油箱液位一致且无乘员在车</text>
  <text x="452" y="252" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 净重除以 AI 视频体积密度超 8.5 lbs/cu.ft. 强制免费复磅</text>
  <text x="452" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 11ms 触发 HTTP 403 拦截压秤作弊与超 110% 扣货勒索</text>

  <rect x="438" y="304" width="324" height="104" rx="8" fill="#0F172A" stroke="#6D28D9"/>
  <text x="452" y="326" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 2：GIS 道路净空核验 Shuttle 与 PBO 纸箱门禁</text>
  <text x="452" y="348" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 派单前通过市政 GIS 与街景锁定 53 尺挂车转弯半径</text>
  <text x="452" y="368" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 纸箱条码严格区分员工自包 (PBO) 与搬家公司精装 (CP)</text>
  <text x="452" y="388" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 14ms 触发 HTTP 422 阻断 $2,400 虚假接驳与木箱溢价</text>

  <rect x="438" y="420" width="324" height="104" rx="8" fill="#0F172A" stroke="#6D28D9"/>
  <text x="452" y="442" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">锁 3：Web IQ FMCSA HHG 牌照与 IRS BVO 免税盾</text>
  <text x="452" y="464" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ /v3/browse 核验 USDOT HHG 专项牌照与零扣货记录</text>
  <text x="452" y="484" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 校验 ERC 双估价 (&lt;=5% 温差) 与 IRS 2005-74 免税闭环</text>
  <text x="452" y="504" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">• 275ms 触发 HTTP 451 / 240ms HTTP 409 立省 $51,200</text>


  <!-- Header -->
  <text x="44" y="48" fill="#F43F5E" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 62 · MICRO-DRAMA IAP, WEB-NOVEL PAY-PER-CHAPTER &amp; SERIES BUYOUT CAP ESCROW</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">短剧出海充值、网文按章解锁与互动影游：防 $39.99/周暗扣、整剧封顶买断与省苹果税</text>

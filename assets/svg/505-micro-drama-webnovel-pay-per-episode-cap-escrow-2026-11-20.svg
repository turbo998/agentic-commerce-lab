  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截 $0.99 试用捆绑 $39.99/周自动续费暗扣或深夜未成年人连刷</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">bundled_weekly_sub_usd &gt; 15.0 | minor_curfew_spend = true</text>

  <rect x="434" y="352" width="362" height="72" rx="8" fill="#431407" stroke="#F97316" stroke-width="1.5" />

  <text x="868" y="458" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 硬拦截 $0.99 试用捆绑 $39.99/周隐蔽自动续费</text>
  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 单部短剧累计扣费满 $14.99 自动转整部买断</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Web IQ 拦截盗版搬运与拒付率(&gt;0.9%)爆雷</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. H5 网页直充免 30% 苹果税立省 27%</text>
  <rect x="868" y="542" width="256" height="50" rx="6" fill="#022C22" />

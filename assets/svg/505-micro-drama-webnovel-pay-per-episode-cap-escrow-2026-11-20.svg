  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 前 12 集免费，后 88 集每集扣 60 金币，零散充值看完一部</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  剧竟比去电影院贵 5 倍；或网文太监断更/短剧下架不退余额</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：单剧累计消费达 $14.99 自动转整部买断</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  (Series Cap Pass) + 断更未解锁币原路退 (HTTP 422)</text>

  <rect x="62" y="474" width="314" height="134" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 盗版切片投流侵权下架与 H5 网页直充省苹果税</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 黑产搬运国内短剧 AI 换脸配音出海，遭版权方 DMCA 下架封号</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ 版权链与拒付率(VAMP &lt;0.9%)熔断(451)</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 引导 Web2App H5 Stripe/PayPal 直充免 30% 渠道税</text>

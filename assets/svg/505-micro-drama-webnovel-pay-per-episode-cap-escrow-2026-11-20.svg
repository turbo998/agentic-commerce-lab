  <text x="450" y="245" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">micro_drama_webnovel_cap_escrow_mandate_*</text>

  <rect x="434" y="268" width="362" height="72" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />

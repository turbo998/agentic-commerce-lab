  <text x="159" y="57" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 199 · EUCP v2.1 &amp; DCSA EBL</text>
  <text x="282" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="800">B2B 跨境电子信用证 (eUCP v2.1) 与电子提单 (DCSA v3.0 eBL) 零不符点交单架构</text>
  <text x="282" y="85" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">SWIFT MT700 45A 逐字镜像 + CIF 保额 ≥110% + 装船后 ≤21 天交单门禁 (`b2b_eucp_ebl_letter_of_credit_mandate_...`) vs 纸质提单滞港费与 70% 不符点拒付</text>

  <!-- Left Card: Anti-Pattern -->
  <rect x="36" y="124" width="548" height="275" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="54" y="140" width="512" height="32" rx="6" fill="url(#red201)"/>
  <text x="310" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">❌ 传统反模式：纸质提单邮寄滞港 + LLM 自由改写单据触发 MT734 拒付</text>

  <text x="56" y="196" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. LLM 润色发票货描违反 UCP 600 Art. 18(c) 镜面严格相符原则：</text>
  <text x="56" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Agent 把 MT700 45A 的 "MONOCRYSTALLINE PV MODULES" 改成 "Solar Panels"；</text>
  <text x="56" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 若海上运输期间行情暴跌 20%，买方借此微小不符点指使开证行合法拒付弃货！</text>

  <text x="56" y="265" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. CIF 海运保单按 100% 投保 (少于 110%) 或装船 21 天后逾期交单：</text>
  <text x="56" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 违反 UCP 600 Art. 28(f)(ii) 最低 110% 保额与 Art. 14(c) 21天交单期，银行担保作废。</text>

  <text x="56" y="315" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. 纸质正本提单跨国快递耗时 14–21 天（船到单未到）：</text>
  <text x="56" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 货柜锁在目的港码头每天产生 $150–$300/柜滞港费，或被迫签无担保保函 (LOI) 放货。</text>

  <rect x="56" y="352" width="508" height="32" rx="6" fill="#450A0A" stroke="#DC2626"/>
  <text x="310" y="373" fill="#FECACA" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">GATE BLOCKS: HTTP 403 (11ms 45A/110% Discrepancy) | HTTP 422 (14ms &gt;21d/eBL)</text>


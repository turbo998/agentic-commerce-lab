  <text x="890" y="161" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">✅ 推荐架构：eUCP v2.1 AST 预审 + DCSA v3.0 电子提单 + Web IQ</text>

  <text x="636" y="196" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. SWIFT MT700 Field 45A 逐字符 AST 镜像与 UCP 600 不变量锁死：</text>
  <text x="636" y="216" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 禁止 LLM 改写货描；强制断言 CIF 保额 ≥ 110% 发票额且保单签发日 ≤ 提单装船日；</text>
  <text x="636" y="235" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 强制装船后 ≤ 21 天内自动交单，将首次交单不符点率从 70% 压降至 0.0%！</text>

  <text x="636" y="265" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. UNCITRAL MLETR / UK ETDA 合规 DCSA v3.0 电子提单 (eBL)：</text>
  <text x="636" y="285" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 10 分钟内完成正本提单密码学排他控制权 (Exclusive Control) 跨国银行背书，零滞港费。</text>

  <text x="636" y="315" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Microsoft Web IQ (/v3/browse) 280ms 船只 IMO 制裁与 MLETR 法效核验：</text>
  <text x="636" y="335" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• 免除 14 天滞港费并解锁零不符点福费廷低息贴现，单批立省 $64,400.00 (HTTP 409)！</text>

  <rect x="636" y="352" width="508" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="890" y="373" fill="#A7F3D0" font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">SETTLED: HTTP 200 (10ms $920k L/C) | HTTP 409 ($64.4k Demurrage &amp; Forfaiting Saved)</text>


  <text x="44" y="129" class="card-hdr" fill="#fca5a5">1. Pro-Rata `GWP` Return Clawback (HTTP 403)</text>
  <text x="44" y="162" class="body-txt">• Stops Returning $100 Main Item &amp; Keeping $80 GWP:</text>
  <text x="54" y="182" class="mono" fill="#fca5a5">Allocate_Invoice_Discount(Main=$65, GWP=$35)</text>
  <text x="54" y="200" class="mono">If `GWP_Returned == FALSE`: Refund Only `$65`!</text>
  <text x="44" y="223" class="body-txt">• Enforces `ASC 606` Split Performance Obligation:</text>
  <text x="54" y="243" class="mono">Never Book GWP at $0.00 on Returnable Receipt!</text>

  <text x="78" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 同一张网图旋转裁剪后向 20 家店铺重复申请“仅退款”闪赔</text>
  <text x="78" y="256" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 报修手机序列号 (SN) 与原订单不符，拿旧坏机顶包骗新机!</text>


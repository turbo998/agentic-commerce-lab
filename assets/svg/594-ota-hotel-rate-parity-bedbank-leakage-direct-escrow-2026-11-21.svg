<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg594" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#0f2342" />
      <stop offset="100%" stop-color="#06101e" />
    </linearGradient>
    <linearGradient id="accent594" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21.5px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 14px; fill: #e2e8f0; }
      .body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .mono { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #6ee7b7; }
      .warn { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #fca5a5; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg594)" rx="16" />
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent594)" rx="3" />

  <text x="40" y="58" class="title">酒店价格一致性 (Rate Parity)、防批发商串货破价与官网直订权益托管架构 (Lighthouse / Fornova / SynXis)</text>
  <text x="40" y="80" class="subtitle">Round 151 · 防 Bedbank 盲盒批发价违规挂 OTA 砸盘、防盗用大厂差旅协议码 &amp; 官网直订免 18% 佣金净省 34% (SVG 594)</text>

  <!-- Left Card: 3 Hotel Rate Parity & Leakage Disasters -->
  <rect x="40" y="102" width="350" height="535" rx="12" fill="#111c33" stroke="#ef4444" stroke-width="1.5" />
  <rect x="56" y="118" width="156" height="24" rx="6" fill="#ef4444" />
  <text x="66" y="134" class="badge" fill="#ffffff">三大酒店价格倒挂与协议码乱象</text>
  <text x="56" y="164" class="card-title">1. B2B 房券批发商 (Bedbank) 违规串货破价 (HTTP 403)</text>
  <text x="56" y="184" class="body">• 酒店以 $120 底价把房包给旅行社做“机+酒打包非公开盲盒”</text>
  <text x="56" y="202" class="body">• 无良二级批发商偷偷拆包，在 Google Hotels / 小 OTA 挂 $145 裸卖</text>
  <text x="56" y="220" class="warn">• 直接砸穿酒店官网 $200 挂牌价 (BAR)，官网转化率腰斩!</text>

  <text x="56" y="256" class="card-title">2. 盗用世界 500 强协议码与房贩倒卖积分房 (HTTP 422)</text>
  <text x="56" y="276" class="body">• 闲鱼/小红书公开售卖各跨国巨头内部差旅协议代码 (Corporate Code)</text>
  <text x="56" y="294" class="body">• 散客无工牌/无企业邮箱照样订走 $110 协议房；或房贩用黑卡</text>
  <text x="56" y="312" class="warn">  刷积分房添加“同住人”倒卖，客人到店前台被查出当场拒住!</text>

  <text x="56" y="348" class="card-title">3. 恶意 BRG 最低价双倍索赔套利团伙 (HTTP 451)</text>
  <text x="56" y="368" class="body">• 酒店承诺“官网买贵赔差价再打 75 折 (Best Rate Guarantee)”</text>
  <text x="56" y="386" class="body">• 职业羊毛党拿“不可退无早特价房”碰瓷“官网免费取消含早房”</text>
  <text x="56" y="404" class="warn">• 或拿不含税裸价对比含税价，自动化脚本批量刷走数千晚免费房!</text>

  <rect x="56" y="432" width="318" height="186" rx="8" fill="#0b1324" stroke="#334155" />
  <text x="70" y="456" class="card-title" fill="#fca5a5">拦截状态码映射 (Deterministic Gate)</text>
  <text x="70" y="480" class="warn">• HTTP 403: BEDBANK_WHOLESALE_UNBUNDLED_RATE_UNDERCUT</text>
  <text x="70" y="502" class="warn">• HTTP 422: UNAUTHORIZED_CORP_CODE_OR_BROKER_POINTS</text>
  <text x="70" y="524" class="warn">• HTTP 451: MISMATCHED_CXL_POLICY_BRG_ARBITRAGE</text>
  <text x="70" y="546" class="mono">• HTTP 409:DIRECT_BOOKING_PRICE_MATCH_PERK_409</text>
  <text x="70" y="568" class="mono">• HTTP 200: PARITY_VERIFIED_DIRECT_OR_CORP_200</text>
  <text x="70" y="596" class="body">铁律: 协议价订房必验企业域名 OTP；批发商破价秒关房态!</text>

  <!-- Center Card: 4-Stage Hotel Rate Parity & Direct Booking Escrow -->
  <rect x="415" y="102" width="390" height="535" rx="12" fill="#0f1e38" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="431" y="118" width="196" height="24" rx="6" fill="#38bdf8" />
  <text x="441" y="134" class="badge">四阶酒店控价、防串货与直订托管架构</text>

  <rect x="435" y="154" width="350" height="95" rx="8" fill="#162847" stroke="#ef4444" />
  <text x="450" y="175" class="card-title" fill="#fca5a5">Gate 1: 批发商数字水印追踪与破价秒断房 (HTTP 403)</text>
  <text x="450" y="195" class="body">• 给每家 Bedbank 分发的净价嵌入微秒级分位特征码 (如 `$120.03`)</text>
  <text x="450" y="213" class="body">• Web IQ / Lighthouse 巡检发现某 OTA 出现低于 BAR 5% 的违规裸房价:</text>
  <text x="450" y="231" class="mono">• 无需人工测试预订，凭价格尾数精准锁定违约批发商断流 -&gt; HTTP 403</text>

  <rect x="435" y="261" width="350" height="105" rx="8" fill="#162847" stroke="#38bdf8" />
  <text x="450" y="282" class="card-title" fill="#38bdf8">Gate 2: 企业协议码邮箱域名 OTP 与积分房防倒卖 (HTTP 422)</text>
  <text x="450" y="302" class="body">• 输入大客户协议码 (Corporate Rate Code) 预订时，线上立即向</text>
  <text x="450" y="320" class="body">  `@company.com` 企业邮箱发送 6 位 OTP 验证码或验 Concur 差旅单</text>
  <text x="450" y="338" class="body">• 积分兑换房晚若入住人与会员异地且临时改同住人 -&gt; 强制本人到场核验</text>
  <text x="450" y="354" class="mono">• 散客盗用企业协议码或黄牛房贩倒卖积分房 -&gt; HTTP 422</text>

  <rect x="435" y="378" width="350" height="95" rx="8" fill="#162847" stroke="#a855f7" />
  <text x="450" y="399" class="card-title" fill="#d8b4fe">Gate 3: BRG 买贵必赔“五维苹果对苹果”校验 (HTTP 451)</text>
  <text x="450" y="419" class="body">• 自动化审核 BRG 索赔: 必须同时满足 `同房型 + 同入住日期 + 同人数 +</text>
  <text x="450" y="437" class="body">  同早餐权益 + 同免费取消截止时间 + 含全部 Resort Fee 税费总额`</text>
  <text x="450" y="455" class="mono">• 拿不可退裸房碰瓷可免费取消含早房恶意骗 BRG -&gt; HTTP 451</text>

  <rect x="435" y="485" width="350" height="132" rx="8" fill="#0b1629" stroke="#10b981" />
  <text x="450" y="508" class="card-title" fill="#6ee7b7">Gate 4: 官网直订实时比价匹配与非现金高毛利礼遇 (HTTP 409)</text>
  <text x="450" y="528" class="body">• 当客人在酒店官网犹豫要去 OTA (酒店需交 18%–22% 佣金) 时:</text>
  <text x="450" y="546" class="body">• 官网插件 (Triptease / The Hotels Network) 实时弹出 OTA 同价匹配</text>
  <text x="450" y="566" class="mono">• 并叠加边际成本极低的 `$40 餐饮抵用券 + 免费升房 + 延迟退房`</text>
  <text x="450" y="586" class="mono">• 免除 18% OTA 渠道佣金 + 收回批发商破价 -&gt; 净增 34% 客房净收益</text>

  <!-- Right Card: Platforms & FinOps -->
  <rect x="830" y="102" width="330" height="535" rx="12" fill="#111c33" stroke="#10b981" stroke-width="1.5" />
  <rect x="846" y="118" width="166" height="24" rx="6" fill="#10b981" />
  <text x="856" y="134" class="badge">四大酒店控价与直订转化技术栈</text>

  <text x="846" y="164" class="card-title" fill="#38bdf8">1. Lighthouse (原 OTA Insight) / Fornova</text>
  <text x="846" y="182" class="body">• 优势: 全球酒店价格一致性监控标杆，按地域 IP 模拟真实用户查价</text>
  <text x="846" y="198" class="body">• 特性: 自动抓出在移动端/特定国家偷偷用优惠券破价的违规分销商</text>

  <text x="846" y="226" class="card-title" fill="#6ee7b7">2. Sabre SynXis / Amadeus CRS</text>
  <text x="846" y="244" class="body">• 优势: 酒店中央预订系统底座，支持按渠道动态调整加价与秒级关房</text>
  <text x="846" y="260" class="body">• 特性: 原生支持企业协议码 (Negotiated Rate) 绑定 SSO/域名白名单</text>

  <text x="846" y="288" class="card-title" fill="#fcd34d">3. Triptease / The Hotels Network (THN)</text>
  <text x="846" y="306" class="body">• 优势: 酒店官网直订转化引擎，在 Google Hotels 比价流中动态出价</text>
  <text x="846" y="322" class="body">• 特性: 发现外部破价时毫秒级在官网生成定向 Price-Match 挽留弹窗</text>

  <text x="846" y="350" class="card-title" fill="#c084fc">4. 华住会 / 万豪旅享家“官渠最低价+积分双享”</text>
  <text x="846" y="368" class="body">• 经验: 严格切断第三方 OTA 的会员SNP (房晚/积分/行政酒廊待遇)</text>
  <text x="846" y="384" class="body">• 特性: 用低边际成本的早餐/延迟退房锁定商旅高频直客</text>

  <rect x="846" y="408" width="298" height="210" rx="10" fill="#091326" stroke="#10b981" />
  <text x="860" y="432" class="card-title" fill="#6ee7b7">季度酒店渠道佣金、串货破价与协议盗刷池 ($135,000)</text>
  <text x="860" y="456" class="body">• 传统 Bedbank 串货砸盘+18% OTA佣金+假协议码: $135,000/季</text>
  <text x="860" y="476" class="mono">• 官网直订同价匹配+礼遇包省下 18% OTA 佣金: -$22,950</text>
  <text x="860" y="496" class="mono">• 批发商微秒分位水印秒关破价串货渠道: -$13,500</text>
  <text x="860" y="516" class="mono">• 企业邮箱 OTP 验证拦截非员工盗刷大厂协议价: -$9,450</text>
  <line x1="860" y1="528" x2="1126" y2="528" stroke="#334155" />
  <text x="860" y="550" class="card-title" fill="#38bdf8">季度净渠道成本: $89,100 (净省 $45,900 / -34%)</text>
  <text x="860" y="574" class="body">Provenance: synthetic</text>
  <text x="860" y="594" class="body">Mandate: ota_hotel_parity_escrow_optim_409</text>
</svg>

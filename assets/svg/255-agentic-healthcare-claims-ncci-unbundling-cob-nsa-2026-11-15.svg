  <text x="64" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 孩子看牙同时向父母两家公司医保报销；次险 AI 未校验主险 EDI 835 EOB 即按原价赔付 80%。</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 违反 NAIC 生日法则 (Birthday Rule) 与 100% 费用封顶原则，每单白白多赔 60% 超额利润！</text>

  <rect x="48" y="364" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">3. 网内医院的网外麻醉/急诊医生向患者强收天价差额账单 (Balance Billing)</text>
  <text x="64" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 患者去网内医院做手术，麻醉师却属网外并向患者私下追讨 $8,000 差价 (Surprise Medical Bill)。</text>
  <text x="64" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 直接违反美国联邦《无意外账单法 (No Surprises Act)》，面临每单最高 $10,000 行政罚款！</text>

  <rect x="48" y="446" width="556" height="68" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>

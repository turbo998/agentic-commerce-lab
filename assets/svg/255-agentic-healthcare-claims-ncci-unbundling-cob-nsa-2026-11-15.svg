  <text x="64" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 代账 AI 故意添加无血培养或影像报告支撑的“急性呼吸衰竭/败血症”附加码以套取高倍 DRG 权重。</text>

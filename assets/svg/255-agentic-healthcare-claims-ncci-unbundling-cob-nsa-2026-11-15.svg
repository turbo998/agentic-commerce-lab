  <rect x="48" y="200" width="556" height="72" rx="10" fill="#2A0A10" stroke="#F87171" stroke-width="1"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#FCA5A5">1. 把一台打包手术拆成 5 个独立代码收费 (CPT Unbundling 虚增 2.5 倍)</text>
  <text x="64" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">• 综合手术码 ($2,200) 已包含切开、探查、止血与缝合；不良诊所拆成 5 行独立代码索赔 $5,400。</text>
  <text x="64" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FCA5A5">• 甚至单人单日报销拔除 38 颗智齿或切 2 次盲肠 (突破 CMS MUE 解剖学极限) 仍被无脑照付！</text>


  <text x="446" y="306" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">WHOLE_HUMIDIFIER_SUBASSEMBLY_UPCODING_ON_160_DOLLAR_STEAM_CYLINDER_BLOCKED</text>
  <text x="446" y="326" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截把 $160 加湿塑料桶结垢或 $95 阀堵高报 $8,500 换总成 → $0.00</text>


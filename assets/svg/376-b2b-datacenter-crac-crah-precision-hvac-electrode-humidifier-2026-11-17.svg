  <rect width="1200" height="675" fill="url(#bg376)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent376)"/>

  <!-- Header -->
  <text x="48" y="58" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 374 · DATA CENTER CRAC/CRAH PRECISION HVAC (ASHRAE TC 9.9), $160 STEAM CYLINDER &amp; ZERO-FIGHTING GATE</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">数据中心精密空调 (CRAC/CRAH) 与加湿器维保、$160 电极罐锁与防冷热对抗清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Vertiv Liebert / Stulz / Schneider / Carel · $160 一次性聚丙烯加湿桶 + $95 排污阀 + EC 风机动平衡 + 露点群控零对抗</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="64" y="160" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">❄️ 四大机房精密空调机电与群控硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. $160 一次性电极加湿塑料桶 &amp; $95 阀锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 95% 加湿故障源于 $160 聚丙烯塑料桶水垢满或排水堵</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制优先清理底部 $95 排污电磁阀并换 $160 新桶</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截把耗材换桶高报成 $8,500 换加湿器总成</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. ebm-papst EC 风机叶轮清灰动平衡锁</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 下送风 EC 无刷离心风机寿命长达 60,000–80,000h</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 震动报警优先擦除叶轮积灰恢复 &lt;=2.5 mm/s 动平衡</text>
  <text x="74" y="368" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断无绕组故障码强推 $4,600/台换 EC 风机</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="426" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. iCOM 露点群控零“加湿/除湿打架”锁</text>
  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁各自按回风 %RH 独立控制引发相邻空调互殴</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制统一露点 (Dew Point) 群控，加除湿重叠 = 0 分钟</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 消除一边开 9kW 加湿一边开 12kW 电再热白烧电</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="540" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. Web IQ 进水电导率 &amp; 漏水绳联锁核查</text>
  <text x="74" y="560" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• /v3/browse 核验电极桶匹配水质 (125–1,250 µS/cm)</text>
  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截误接 0 µS/cm 纯 RO 水或地板下漏水绳断路</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 满足 ASHRAE TC 9.9 与 Uptime Tier IV 机房合规</text>


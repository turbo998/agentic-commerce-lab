<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg520" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111E" />
      <stop offset="50%" stop-color="#131E3A" />
      <stop offset="100%" stop-color="#081322" />
    </linearGradient>
    <linearGradient id="accent520" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg520)" />
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent520)" />

  <!-- Header -->
  <text x="44" y="48" fill="#EC4899" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">ROUND 77 · MUSIC FESTIVAL &amp; STADIUM CASHLESS RFID WRISTBAND, TIP-CREEP &amp; AUTO-REFUND ESCROW</text>
  <text x="44" y="82" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">音乐节与体育场馆无现金 RFID 手环：防沉淀余额吞没、防25%默认小费刺客与直连免充值</text>
  <text x="44" y="108" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Coachella / Tomorrowland / Intellitix / 草莓音乐节 vs 散场余额 $0 手续费自动原路退 vs 禁自助买水预勾小费 vs 直刷省 23%</text>

  <!-- Left Panel: 3 Core Festival RFID Wristband & Stadium Concession Risks -->
  <rect x="44" y="132" width="350" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="64" y="164" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🚨 音乐节手环与场馆餐饮三大吸金套路</text>

  <rect x="62" y="182" width="314" height="132" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
  <text x="76" y="206" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. 18 珍珠=1杯啤酒隐藏汇率，散场剩 $19 拒退吞没</text>
  <text x="76" y="228" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制充值虚拟“珍珠/代币”掩盖真实物价，散场后仅开 72h</text>
  <text x="76" y="248" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  手动填 IBAN 退费窗口且强收 $5 手续费，吞走数百万沉淀资金</text>
  <text x="76" y="268" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：禁强制预充值，直接绑定单次限额 SPT 直刷</text>
  <text x="76" y="288" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  + 散场 T+24h 余额 $0 手续费自动退回 (HTTP 403)</text>

  <rect x="62" y="328" width="314" height="132" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="76" y="352" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2. 递一瓶 $7 罐装水，POS 屏默认勾选 25% 小费暗扣</text>
  <text x="76" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 自助冰箱拿水或酒保转身递罐装啤酒，POS 屏幕只显示</text>
  <text x="76" y="394" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  22%/25%/30% 三个大按钮且把“无小费”藏在二级角落，微醺下误触</text>
  <text x="76" y="414" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：手环贴卡前预设小费上限(0% 自助/封顶 10%)</text>
  <text x="76" y="434" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  + 离线双花与重复刷手环去重锁 (HTTP 422)</text>

  <rect x="62" y="474" width="314" height="134" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="76" y="498" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. 暴雨雷电腰斩压轴演出拒退票与早鸟酒水包寻优</text>
  <text x="76" y="520" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 恶劣天气取消第 2 天压轴演出，主办方想用明年抵用券赖账</text>
  <text x="76" y="540" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 护栏：Web IQ 极端天气停演按天自动退现锁(451)</text>
  <text x="76" y="560" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 手环直连信用卡免储值沉淀 + 持联名卡享场馆餐饮</text>
  <text x="76" y="582" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">  15% 即时返现(Amex/Chase Cashback)立省 23% (HTTP 409)</text>

  <!-- Center Panel: 5-Lane Deterministic Gate -->
  <rect x="414" y="132" width="402" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="434" y="164" fill="#EC4899" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ 音乐节手环与场馆消费五车道受托状态机</text>

  <rect x="434" y="184" width="362" height="72" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="450" y="208" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 200 · DIRECT_RFID_LINK_AND_TIP_CAP_AUTHORIZED</text>
  <text x="450" y="228" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">法币明码计价 + 小费上限已锁 + 散场余额 $0 手续费秒退 (7ms)</text>
  <text x="450" y="245" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">festival_stadium_cashless_rfid_escrow_mandate_*</text>

  <rect x="434" y="268" width="362" height="72" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
  <text x="450" y="292" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 403 · BREAKAGE_REFUND_FEE_OR_FORCED_TOKEN_TRAP</text>
  <text x="450" y="312" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截散场退手环余额强收 $5 手续费、过期没收余额或奇葩汇率代币</text>
  <text x="450" y="329" fill="#FCA5A5" font-family="Consolas, monospace" font-size="11">unspent_refund_fee_usd &gt; 0 | auto_refund_after_event = false</text>

  <rect x="434" y="352" width="362" height="72" rx="8" fill="#431407" stroke="#F97316" stroke-width="1.5" />
  <text x="450" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 422 · PREDATORY_25PCT_AUTO_TIP_OR_DOUBLE_TAP</text>
  <text x="450" y="396" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="12">拦截买瓶装水默认勾选 25% 小费暗扣或弱网 POS 30秒内重复刷手环</text>
  <text x="450" y="413" fill="#FDBA74" font-family="Consolas, monospace" font-size="11">default_tip_pct &gt; user_preset_cap | duplicate_rfid_tap_30s = true</text>

  <rect x="434" y="436" width="362" height="72" rx="8" fill="#3B0764" stroke="#A855F7" stroke-width="1.5" />
  <text x="450" y="460" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 451 · WEBIQ_WEATHER_DAY_CANCEL_VOUCHER_HOLD</text>
  <text x="450" y="480" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="12">Web IQ 检出因雷暴取消单日演出却拒退按日门票现金或高温断供免费水</text>
  <text x="450" y="497" fill="#D8B4FE" font-family="Consolas, monospace" font-size="11">cancelled_day_pro_rata_cash_refund = false | key_age &gt; 180d</text>

  <rect x="434" y="520" width="362" height="88" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="1.5" />
  <text x="450" y="544" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTTP 409 · ZERO_PRELOAD_CARD_LINK_AND_SPONSOR_REBATE</text>
  <text x="450" y="564" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="12">手环直绑限额SPT免预充值沉淀 + 赞助商卡15%餐饮返现立省 23%</text>
  <text x="450" y="584" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">季度音乐节与体育场馆消费池 $160,000 → 净结算额 $123,200 (省 $36,800)</text>

  <!-- Right Panel: Platform Selection Matrix -->
  <rect x="836" y="132" width="320" height="495" rx="12" fill="#111C2D" stroke="#334155" stroke-width="1.5" />
  <text x="856" y="164" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🧭 音乐节与场馆支付选型</text>

  <rect x="854" y="184" width="284" height="100" rx="8" fill="#1E293B" />
  <text x="868" y="206" fill="#EC4899" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Front Gate / Intellitix / 开放直刷手环 (Card-Linked)</text>
  <text x="868" y="226" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 手环 UID 直接绑定 Apple Pay / 信用卡单笔直扣(无需</text>
  <text x="868" y="246" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  预先充钱)，设置 4 位 PIN 防丢手环盗刷，彻底 0 沉淀</text>
  <text x="868" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：Coachella/Lollapalooza 等大型音乐节与 NFL 球场</text>

  <rect x="854" y="298" width="284" height="100" rx="8" fill="#1E293B" />
  <text x="868" y="320" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">封闭储值手环 (Closed-Loop Preload + Auto-Refund)</text>
  <text x="868" y="340" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 适用于无网络深山营地音乐节，手环芯片离线读写余</text>
  <text x="868" y="360" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">  额，散场后线上充值部分必须无条件自动原路退回</text>
  <text x="868" y="380" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">适合：森林露营音乐节、跨国电子音乐节(Tomorrowland)</text>

  <rect x="854" y="412" width="284" height="196" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="868" y="436" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">★ 推荐：Foundry + 小费锁与余额秒退网关</text>
  <text x="868" y="458" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. 优先手环直绑 SPT 免预充；若预充则散场 0 费自动退</text>
  <text x="868" y="480" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. 预设小费硬上限拦截自助买水 25% 屏幕小费暗扣</text>
  <text x="868" y="502" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. 30 秒同摊位重复贴卡去重防弱网双倍扣款</text>
  <text x="868" y="524" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. 零沉淀损失 + 赞助商卡返现立省 23%</text>
  <rect x="868" y="542" width="256" height="50" rx="6" fill="#022C22" />
  <text x="880" y="563" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">审计标签：provenance = synthetic</text>
  <text x="880" y="581" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="11">independently_reproduced = false</text>
</svg>

  <rect width="1200" height="675" fill="url(#bg372)"/>
  <rect x="24" y="20" width="1152" height="635" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="6" rx="3" fill="url(#accent372)"/>

  <!-- Header -->
  <text x="48" y="58" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 370 · CNC METALWORKING FLUID (MWF) RECYCLING &amp; OIL-MIST COLLECTOR (OSHA 1910.1000 / NIOSH 98-102)</text>
  <text x="48" y="88" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">机加工车间 CNC 切削液再生循环、导轨浮油离心撇除锁与 $120 静电油雾机钨丝清算架构</text>
  <text x="48" y="112" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Blaser Swisslube / Master Fluid TRIM / SmogHog / Filtermist · 浮油 &lt;=0.5% 离心再生锁 + 6–8% Brix 折光锁 + ESP 极板超声波水洗</text>

  <!-- Left Column: Telemetry & Physics Locks -->
  <rect x="44" y="132" width="356" height="495" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="64" y="160" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">⚙️ 四大 CNC 切削液与油雾净化物理硬门禁</text>

  <rect x="60" y="176" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="198" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 导轨浮油离心撇除 (&lt;=0.5%) 免换液锁</text>
  <text x="74" y="218" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 周一水箱发臭 90% 源于导轨油浮面隔氧滋生厌氧菌</text>
  <text x="74" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 强制先用 $650 移动离心车撇油过滤并调回 pH 9.1</text>
  <text x="74" y="254" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 11ms 拦截忽悠抽干 40 台机床当危废骗 $18,000</text>

  <rect x="60" y="290" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="312" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. ESP 静电油雾机 $120 钨丝 &amp; 超声波洗锁</text>
  <text x="74" y="332" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 铝合金静电集尘极板箱 (Collector Cell) 可永久水洗复用</text>
  <text x="74" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 高压跳闸优先换 $120 电离钨丝与 $150 碱液超声波洗</text>
  <text x="74" y="368" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 14ms 阻断把脏极板当一次性耗材高报 $5,200 换新</text>

  <rect x="60" y="404" width="324" height="102" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="426" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. 去离子软水 (&lt;=80 ppm) &amp; 折光系数核账</text>
  <text x="74" y="446" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 严禁拿 &gt;200 ppm 硬水配液导致钙镁皂垢粘死刀柄</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 按 Brix × 折光系数 (RF) 核对新浓缩液真实消耗桶数</text>
  <text x="74" y="482" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 延长半合成/全合成切削液槽液寿命至 24–36 个月</text>

  <rect x="60" y="518" width="324" height="92" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="74" y="540" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4. Web IQ NIOSH 98-102 &amp; 无亚硝胺 SDS</text>
  <text x="74" y="560" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• /v3/browse 核验呼吸带油雾颗粒 &lt;=0.5 mg/m³ (NIOSH)</text>
  <text x="74" y="578" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 265ms 拦截含亚硝胺或一类致癌甲醛释放型杀菌剂</text>
  <text x="74" y="596" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">• 根除操作工职业性接触性皮炎与过敏性肺炎</text>

  <!-- Center Column: 5-Lane Deterministic Matrix -->
  <rect x="416" y="132" width="424" height="495" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="436" y="160" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">⚖️ 五路确定性清算决策矩阵 (5-Lane Matrix)</text>

  <!-- Lane 200 -->
  <rect x="432" y="176" width="392" height="76" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="446" y="198" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ HTTP 200 · Act automatically (10ms)</text>
  <text x="446" y="218" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12">VERIFIED_CNC_MWF_SUMP_AND_OIL_MIST_OSHA1910_SETTLED</text>
  <text x="446" y="238" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">浮油 &lt;=0.5% + 6-8% Brix 软水 + 极板洗净 + NIOSH → $134,000.00</text>

  <!-- Lane 403 -->
  <rect x="432" y="264" width="392" height="76" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="446" y="286" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛑 HTTP 403 · Send to a human (11ms)</text>
  <text x="446" y="306" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">WHOLE_SUMP_COOLANT_DUMPING_ON_UNSKIMMED_TRAMP_OIL_BLOCKED</text>
  <text x="446" y="326" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截仅因导轨浮油隔氧发臭未撇油即强推 $18k 全槽弃液 → $0.00</text>

  <!-- Lane 422 -->
  <rect x="432" y="352" width="392" height="76" rx="8" fill="#450A0A" stroke="#F87171"/>
  <text x="446" y="374" fill="#FECACA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🚨 HTTP 422 · Send to a human (14ms)</text>
  <text x="446" y="394" fill="#FEE2E2" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">ESP_COLLECTOR_CELL_UPCODING_ON_120_DOLLAR_IONIZER_WIRE_OR_HARD_WATER_SOAP</text>
  <text x="446" y="414" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">拦截把可水洗 ESP 静电集尘极板或 $120 断钨丝高报 $5,200 → $0.00</text>

  <!-- Lane 451 -->
  <rect x="432" y="440" width="392" height="76" rx="8" fill="#3B0764" stroke="#C084FC"/>
  <text x="446" y="462" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛑 HTTP 451 · Send to a human (265ms)</text>
  <text x="446" y="482" fill="#F3E8FF" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">EXCESSIVE_NIOSH_OIL_MIST_EXPOSURE_OR_BANNED_NITROSAMINE_BIOCIDE_HOLD</text>
  <text x="446" y="502" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web IQ 挂起油雾 &gt;0.5 mg/m³ 或违规含亚硝胺/甲醛杀菌剂 → $0.00</text>

  <!-- Lane 409 -->
  <rect x="432" y="528" width="392" height="84" rx="8" fill="#451A03" stroke="#F59E0B"/>
  <text x="446" y="550" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🧑‍⚖️ HTTP 409 · Confirm (230ms)</text>
  <text x="446" y="570" fill="#FEF3C7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">AUTOMATED_COALESCING_TRAMP_OIL_RECYCLING_AND_ESP_WASH_SAVINGS_CONFIRM</text>
  <text x="446" y="592" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">改用 $650 移动离心撇油再生 + $120 钨丝/超声波洗立省 $24,800 → $109,200.00</text>

  <!-- Right Column: FinOps & Benchmark -->
  <rect x="856" y="132" width="300" height="495" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="876" y="160" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">📊 成本精算与基准对比</text>

  <rect x="872" y="176" width="268" height="145" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="886" y="198" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">单批 CNC 车间切削液与油雾维保额</text>
  <text x="886" y="226" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">$134,000.00</text>
  <text x="886" y="252" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Web IQ 离心保液 &amp; 洗极板立省：</text>
  <text x="886" y="278" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">-$24,800.00 (-18.5%)</text>
  <text x="886" y="304" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">净清算额：$109,200.00</text>

  <rect x="872" y="335" width="268" height="140" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="886" y="357" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Web IQ vs. 竞品检索能力</text>
  <text x="886" y="379" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web IQ: 230ms 直连 Blaser/TRIM</text>
  <text x="886" y="399" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">  折光系数库与 GHS SDS 毒理白名单</text>
  <text x="886" y="421" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Bright Data: 缺乏导轨浮油厌氧封</text>
  <text x="886" y="441" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">  盖与 Brix×RF 浓缩桶数确定性模型</text>
  <text x="886" y="461" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exa: 无法做 NIOSH 98-102 强校验</text>

  <rect x="872" y="489" width="268" height="121" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="886" y="511" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛠️ 生产核验清单 (Checklist)</text>
  <text x="886" y="533" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ 离心撇油 &lt;=0.5% &amp; 6-8% Brix 再生</text>
  <text x="886" y="553" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ ESP $120 钨丝/洗极板 &amp; 软水 &lt;=80ppm</text>
  <text x="886" y="573" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">☑ NIOSH 油雾 &lt;=0.5mg/m³ &amp; 无亚硝胺</text>
  <text x="886" y="593" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">☑ 零虚构坐标 · CSP 自包含沙盒通过</text>
</svg>
